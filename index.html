  // Umlaute auf den Grundbuchstaben ziehen, damit "kase", "kaese" und "käse" alle
  // denselben Schluessel ergeben und den Harzer Käse finden. Erst ß, dann die Umlaute,
  // zuletzt die ausgeschriebenen Varianten — sonst bliebe "kaese" auf halbem Weg stehen.
  function foodNorm(s) {
    return String(s == null ? "" : s).toLowerCase()
      .replace(/ß/g, "ss")
      .replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")
      .replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");
  }
  // Der Suchindex wird beim ersten Tippen einmal aufgebaut, nicht beim Laden der Seite.
  let foodIdx = null;
  function foodList() {
    if (!foodIdx) foodIdx = FOODS.map(f => ({
      name: f[0], kcal: f[1], carbs: f[2], protein: f[3], fat: f[4],
      unit: ING_UNITS.indexOf(f[5]) > 0 ? f[5] : "g",
      key: foodNorm(f[0] + (f[6] ? " " + f[6] : ""))
    }));
    return foodIdx;
  }
  // Rangfolge: Treffer am Wortanfang zuerst, dann am Anfang eines spaeteren Wortes,
  // dann irgendwo mittendrin. Sonst schlaegt "reis" die Preiselbeere vor dem Reis vor.
  function foodSearch(q, max) {
    const n = foodNorm(q).trim();
    if (n.length < 2) return [];
    const a = [], b = [], c = [];
    foodList().forEach(f => {
      const i = f.key.indexOf(n);
      if (i < 0) return;
      if (i === 0) a.push(f);
      else if (/[\s,/-]/.test(f.key.charAt(i - 1))) b.push(f);
      else c.push(f);
    });
    return a.concat(b, c).slice(0, max || 8);
  }

  // ---------- Barcode-Scan (Open Food Facts) ----------
  // Foto vom Barcode -> Code lokal aus dem Bild lesen -> Nummer bei Open Food Facts
  // nachschlagen. Nur die Barcode-NUMMER verlaesst das Geraet, nie das Foto selbst.
  // Erkennung bevorzugt die native BarcodeDetector-API (Chrome/Edge/Android); die
  // gibt es auf iOS/Safari nicht - dort laedt loadZXing() beim ersten Scan eine
  // Open-Source-Bibliothek (ZXing) nach. Sie liegt seit Paket A2 LOKAL im Repo
  // (vendor/zxing.min.js, @zxing/library@0.21.3), nicht mehr auf einem Fremd-CDN:
  // kein Drittserver-Abruf, offline-tauglich und Store-konform (kein Remote-Code).
  // Relativer Pfad wegen des GitHub-Pages-Unterpfads /mealplan/.
  let zxLoad = null;
  function loadZXing() {
    if (window.ZXing) return Promise.resolve();
    if (!zxLoad) zxLoad = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "vendor/zxing.min.js";
      s.onload = resolve;
      s.onerror = () => { zxLoad = null; s.remove(); reject(new Error("zxing-load")); };
      document.head.appendChild(s);
    });
    return zxLoad;
  }
  const BARCODE_FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"];
  async function detectBarcode(file) {
    if (window.BarcodeDetector) {
      try {
        const det = new window.BarcodeDetector({ formats: BARCODE_FORMATS });
        const bmp = await createImageBitmap(file);
        const hits = await det.detect(bmp);
        if (hits && hits[0] && hits[0].rawValue) return hits[0].rawValue;
      } catch (e) { /* z. B. Format nicht unterstuetzt - fällt auf ZXing zurueck */ }
    }
    await loadZXing();
    const url = URL.createObjectURL(file);
    try {
      const reader = new window.ZXing.BrowserMultiFormatReader();
      const res = await reader.decodeFromImageUrl(url);
      return res && res.getText ? res.getText() : null;
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  // Open Food Facts liefert die Naehrwerte unabhaengig von fest/fluessig immer unter
  // den "_100g"-Feldern (auch Cola steht unter carbohydrates_100g, nicht _100ml) -
  // deshalb reicht hier eine feste Basis, ohne nach Einheit zu unterscheiden.
  // Produktname: die deutschen Felder zuerst — "product_name" ist bei hier ueblichen
  // Produkten haeufig die englische oder kleingeschriebene Fassung ("coca-cola"),
  // waehrend "product_name_de" den Namen liefert, den man auf der Packung liest.
  // Beschreibende generic_name-Felder als letzter Ausweg, damit lieber "Nuss-Nugat-Creme"
  // im Feld steht als gar nichts. Laenge auf das maxlength des Eingabefelds gekappt.
  function offName(p) {
    const cands = [p.product_name_de, p.product_name, p.generic_name_de, p.generic_name];
    for (let i = 0; i < cands.length; i++) {
      const s = String(cands[i] == null ? "" : cands[i]).replace(/\s+/g, " ").trim();
      if (s) return s.slice(0, 60);
    }
    return null;
  }
  async function fetchOffNutrition(code) {
    const url = "https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) +
      ".json?fields=product_name,product_name_de,generic_name,generic_name_de,nutriments,status";
    const res = await fetch(url);
    if (!res.ok) throw new Error("off-http-" + res.status);
    const data = await res.json();
    if (data.status !== 1 || !data.product) return null;
    const n = data.product.nutriments || {};
    const num = v => (typeof v === "number" && isFinite(v) && v >= 0) ? v : null;
    const kcal = num(n["energy-kcal_100g"]), carbs = num(n.carbohydrates_100g),
          protein = num(n.proteins_100g), fat = num(n.fat_100g);
    if (kcal == null && carbs == null && protein == null && fat == null) return null;
    return { name: offName(data.product), kcal, carbs, protein, fat };
  }

  // Live-Scanner: Kamerabild statt Einzelfoto — man haelt den Barcode in den Rahmen,
  // die Suche startet von selbst. Der Kamera-Lifecycle ist hier die heikelste Stelle:
  // eine weiterlaufende Kamera ist ein Vertrauensbruch, kein Schoenheitsfehler. Deshalb
  // gibt es genau EINE Abbaustelle (cleanup), sie ist mehrfach aufrufbar, und jeder
  // Ausgang laeuft durch sie — Treffer, Abbruch, Fehler, Tabwechsel, Seite verlassen.
  // Aufloesung: { code } bei Treffer, { photo:true } bei Ausweichen aufs Foto,
  // { cancelled:true } bei Abbruch.
  let liveScanStop = null;
  function scanBarcodeLive() {
    return new Promise(resolve => {
      let stream = null, reader = null, timer = 0, done = false;
      const node = el(`<div class="scanwrap" role="dialog" aria-modal="true" aria-label="Barcode scannen">
        <div class="scanbox">
          <div class="scanhead">
            <h3>Barcode scannen</h3>
            <button type="button" class="btn ghost sm" data-x aria-label="Scanner schließen">✕</button>
          </div>
          <div class="scanvid"><video playsinline muted autoplay></video><div class="scanframe"></div></div>
          <p class="scanhint" role="status">Kamera wird gestartet …</p>
          <div class="scanfoot">
            <button type="button" class="btn ghost" data-photo>Stattdessen Foto aufnehmen</button>
          </div>
        </div>
      </div>`);
      const video = node.querySelector("video");
      const hint = node.querySelector(".scanhint");

      function cleanup() {
        if (timer) { clearTimeout(timer); timer = 0; }
        if (reader) { try { reader.reset(); } catch (e) {} reader = null; }
        // Eigene Stream-Referenz, weil ZXings stopStreams() nur die Video-Tracks beendet
        if (stream) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); stream = null; }
        try { video.pause(); video.srcObject = null; } catch (e) {}
        document.removeEventListener("keydown", onKey, true);
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("pagehide", onHide);
        if (node.parentNode) node.remove();
        liveScanStop = null;
      }
      function finish(res) { if (done) return; done = true; cleanup(); resolve(res); }
      // Escape darf NUR den Scanner schliessen. Ohne capture + stopPropagation wuerde
      // modalKeys() darunter greifen und das Meal-Formular samt Eingaben mitschliessen.
      function onKey(e) {
        if (e.key !== "Escape") return;
        e.preventDefault(); e.stopPropagation();
        finish({ cancelled: true });
      }
      function onHide(e) { if (e.type === "pagehide" || document.hidden) finish({ cancelled: true }); }
      function fail(msg) {
        if (done) return;
        hint.textContent = msg;
        hint.classList.add("err");
        hint.setAttribute("role", "alert"); // Fehler muss auch vorgelesen werden
      }

      node.querySelector("[data-x]").addEventListener("click", () => finish({ cancelled: true }));
      node.querySelector("[data-photo]").addEventListener("click", () => finish({ photo: true }));
      document.body.appendChild(node);
      liveScanStop = () => finish({ cancelled: true });
      document.addEventListener("keydown", onKey, true);
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", onHide);
      node.querySelector("[data-x]").focus();

      (async () => {
        // getUserMedia gibt es nur im sicheren Kontext: HTTPS oder localhost. Ueber eine
        // http://-Adresse im WLAN (Handy-Test gegen den PC) blockiert der Browser die Kamera.
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fail("Die Kamera braucht eine sichere Verbindung (HTTPS). Nimm stattdessen ein Foto auf.");
          return;
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
            audio: false
          });
        } catch (e) {
          const n = e && e.name;
          fail(n === "NotAllowedError" || n === "SecurityError"
              ? "Kamerazugriff wurde abgelehnt. Erlaube ihn in den Browser-Einstellungen – oder nimm ein Foto auf."
            : n === "NotFoundError" || n === "OverconstrainedError"
              ? "Keine passende Kamera gefunden. Nimm stattdessen ein Foto auf."
              : "Die Kamera lässt sich nicht starten. Nimm stattdessen ein Foto auf.");
          return;
        }
        // Abbruch waehrend der Berechtigungsabfrage: cleanup lief mit stream===null,
        // die Kamera wuerde sonst unbemerkt weiterlaufen.
        if (done) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); stream = null; return; }

        video.srcObject = stream;
        // play() bewusst NICHT abwarten: das Promise loest auf manchen Geraeten nie auf,
        // dann haenge der Scanner dauerhaft in "Kamera wird gestartet". Die Erkennung
        // vertraegt ein noch nicht bereites Video — sie versucht es im naechsten
        // Durchlauf einfach erneut. (playsinline + muted decken die Autoplay-Regeln ab.)
        const playing = video.play();
        if (playing && playing.catch) playing.catch(() => {});
        if (done) return;
        hint.textContent = "Halte den Barcode in den Rahmen …";

        // Schneller Weg: native API (Chrome/Edge, Android). Auf dem iPhone gibt es sie
        // nicht — auch nicht in Chrome, das dort WebKit nutzt. Dann uebernimmt ZXing.
        if (window.BarcodeDetector) {
          try {
            const det = new window.BarcodeDetector({ formats: BARCODE_FORMATS });
            const tick = async () => {
              if (done) return;
              try {
                const hits = await det.detect(video);
                if (done) return;
                if (hits && hits[0] && hits[0].rawValue) { finish({ code: hits[0].rawValue }); return; }
              } catch (e) { /* einzelner Frame unlesbar — einfach weiter */ }
              timer = setTimeout(tick, 160); // ~6 Versuche/s reichen und schonen den Akku
            };
            tick();
            return;
          } catch (e) { /* Formate nicht unterstuetzt — faellt auf ZXing durch */ }
        }
        try { await loadZXing(); }
        catch (e) { fail("Der Scanner konnte nicht geladen werden (offline?). Nimm stattdessen ein Foto auf."); return; }
        if (done) return;
        reader = new window.ZXing.BrowserMultiFormatReader();
        // Callback feuert pro Frame; ohne Treffer kommt eine NotFoundException, die hier
        // bewusst ignoriert wird — nur ein echtes Ergebnis beendet den Scan.
        reader.decodeFromStream(stream, video, res => {
          if (done || !res || !res.getText) return;
          finish({ code: res.getText() });
        });
      })();
    });
  }

  // Ruhetag-Ziel aus dem Kalorienrechner (state.goal), hochgerechnet auf `days` Tage.
  // Null, solange der Nutzer noch kein Ergebnis gespeichert hat.
  // Das gespeicherte Ziel ist der RUHETAG-Wert: Alltagsbedarf (BMR × PAL) plus Ziel-
  // Anpassung, ohne Training. An Trainingstagen kommt der Verbrauch der Einheit obendrauf
  // (siehe trainTargets) — deshalb ist der Ruhetag der niedrigste Tag der Woche.
  function goalTargets(days) {
    const g = state.goal;
    if (!g || !nutNum(g.kcal)) return null;
    const n = days || 1;
    return { kcal: nutNum(g.kcal) * n, carbs: nutNum(g.carbs) * n, protein: nutNum(g.protein) * n, fat: nutNum(g.fat) * n };
  }

  // ---------- Trainingstage (Verbrauch je Einheit) ----------
  //
  // Der Trainingsplan haengt an state.goal.training — ein Objekt { mon: {level, min} } —
  // und wird mit dem Ziel zusammen gespeichert und synchronisiert. Bewusst NICHT pro
  // Kalenderwoche: die App haelt ohnehin nur die aktuelle und die naechste Woche vor
  // (pruneWeeks), aeltere verfallen beim Laden. Ein einziger Plan erfuellt „gilt fuer
  // aktuelle + naechste Woche" damit von selbst — und rueckt beim Wochenwechsel
  // automatisch mit, weil der Wochenschluessel wandert, der Plan aber bleibt.
  //
  // Rechenweg je Trainingstag:
  //   kcal   = Ruhetag-kcal + (netto-MET × Gewicht × Stunden)
  //   Eiweiss und Fett bleiben in GRAMM gleich wie am Ruhetag
  //   die gesamte Zusatzenergie geht in die Kohlenhydrate
  // Letzteres ist Absicht und nicht bloss die einfachste Loesung: Kohlenhydrate fuellen
  // die Glykogenspeicher, die die Einheit gerade geleert hat. Eiweiss am Trainingstag
  // zusaetzlich zu erhoehen braeuchte es nicht — der Bedarf richtet sich nach Koerper-
  // gewicht, nicht nach Tagesform.
  function goalTraining() {
    const g = state.goal;
    return (g && g.training && typeof g.training === "object") ? g.training : {};
  }
  function isTrainingDay(dayKey) { return !!goalTraining()[dayKey]; }
  function anyTraining() { return trainingKeys(goalTraining()).length > 0; }

  // Zusatzverbrauch eines Tages in kcal (0 am Ruhetag). Braucht das Koerpergewicht aus
  // dem Ziel — fehlt es (Alt-Daten), gibt es keinen Aufschlag statt eines Fantasiewerts.
  function dayTrainKcal(dayKey) {
    const g = state.goal;
    const e = goalTraining()[dayKey];
    if (!g || !e || !nutNum(g.weight)) return 0;
    return trainKcal(e.level, e.min, nutNum(g.weight));
  }
  // Reine Rechnung auf dem Ruhetag-Wert. Getrennt gehalten, damit der Rechner die
  // Trainingstag-Werte schon in der Vorschau zeigen kann — dort gibt es noch kein
  // gespeichertes state.goal, und zwei getrennte Formeln wuerden auseinanderlaufen.
  function trainFromRest(rest, extraKcal) {
    const add = Math.max(0, Math.round(extraKcal || 0));
    return { kcal: rest.kcal + add, carbs: rest.carbs + Math.round(add / 4),
             protein: rest.protein, fat: rest.fat };
  }
  // Das Ziel EINES Tages, je nach Tagestyp.
  function goalTargetsForDay(dayKey) {
    const rest = goalTargets(1);
    if (!rest) return null;
    if (!isTrainingDay(dayKey)) return rest;
    return trainFromRest(rest, dayTrainKcal(dayKey));
  }
  // Summe der Ziele mehrerer Tage. Ersetzt goalTargets(n) ueberall dort, wo ueber Tage
  // aggregiert wird: die Tage unterscheiden sich jetzt in kcal UND Kohlenhydraten, ein
  // „Tagesziel x 7" waere schlicht falsch.
  function goalTargetsForDays(dayKeys) {
    if (!goalTargets(1)) return null;
    return (dayKeys || []).reduce((a, k) => {
      const t = goalTargetsForDay(k);
      return { kcal: a.kcal + t.kcal, carbs: a.carbs + t.carbs, protein: a.protein + t.protein, fat: a.fat + t.fat };
    }, { kcal: 0, carbs: 0, protein: 0, fat: 0 });
  }
  // Wochensumme der Kalorien fuer EIN Ziel-Objekt — bewusst mit Parameter statt aus
  // state.goal: der Rechner zeigt die Woche fuer ein gerade berechnetes, noch nicht
  // gespeichertes Ziel an, alles andere fuer das gespeicherte. Ohne diesen Parameter
  // gaebe es zwangslaeufig zwei Additionen derselben Sache, die beim naechsten Feature
  // auseinanderlaufen. Geht ueber trainFromRest, damit eine spaetere Regel dort (etwa
  // ein Deckel gegen Ausreisser) hier automatisch mitzieht.
  function weekKcalOf(g) {
    if (!g || !nutNum(g.kcal)) return 0;
    const t = sanitizeTraining(g.training);
    const rest = { kcal: nutNum(g.kcal), carbs: nutNum(g.carbs), protein: nutNum(g.protein), fat: nutNum(g.fat) };
    return DAYS.reduce((s, d) => {
      const e = t[d.key];
      return s + (e ? trainFromRest(rest, trainKcal(e.level, e.min, nutNum(g.weight))).kcal : rest.kcal);
    }, 0);
  }

  // Markierung fuer die Tages-Kopfzeile. Farbe allein traegt die Information nicht
  // (Rot und Blau liegen bei 1,07:1) — deshalb immer Icon UND Wort.
  function trainBadgeHtml(dayKey) {
    const e = goalTraining()[dayKey];
    if (!e) return "";
    const lv = trainLevel(e.level);
    const add = dayTrainKcal(dayKey);
    const title = `Trainingstag: ${lv.label}, ${e.min} Min.${add ? ` · +${nfmt(add)} kcal` : ""}`;
    return `<span class="dtrain" title="${esc(title)}">${ICON_DUMBBELL}${esc(lv.label)}</span>`;
  }

  // Ab diesem Anteil des Ziels gilt der Korridor als getroffen. Darunter ist nicht
  // „gut, weil nicht ueberschritten“, sondern schlicht noch offen – deutlich zu wenig
  // zu essen ist im Defizit ein Fehler, kein Erfolg.
  const GOAL_BAND = 0.9;

  // Zustand gegen ein Ziel: "under" | "ok" | "over".
  // dir "min" (Protein): das Ziel ist eine Untergrenze – darueber ist gut, nie eine
  // Warnung. Alles andere ist eine Obergrenze.
  function goalState(ist, ziel, dir) {
    if (!ziel) return "under";
    const r = ist / ziel;
    if (dir === "min") return r >= 1 ? "ok" : "under";
    if (r > 1) return "over";
    return r >= GOAL_BAND ? "ok" : "under";
  }

  // Ein Fortschrittsbalken. Optionen:
  //   label, ist, ziel, unit – Beschriftung und Werte
  //   cls        – Makro-Farbe des Punktes (t-carb / t-prot / t-fat); der Balken selbst
  //                zeigt immer den Zustand, nicht die Kategorie
  //   dir        – "min" = Untergrenze (Protein), sonst Obergrenze
  //   rest       – true = Restzeile immer, "attention" = nur wenn nicht im Ziel, false = nie
  //   unitInline – Einheit in der Zahlenzeile zeigen
  function goalBarHtml(o) {
    if (!o.ziel) return "";
    const rest = Math.round(o.ziel - o.ist);
    const st = goalState(o.ist, o.ziel, o.dir);
    const pct = Math.max(0, Math.min(100, Math.round(o.ist / o.ziel * 100)));
    const showRest = o.rest === true || (o.rest === "attention" && st !== "ok");
    // Der Zustand steht immer auch als Text da – Farbe allein traegt keine Information.
    // Wortwahl nach Richtung: Protein ist eine Untergrenze, die man erreichen SOLL
    // („noch 33 g“ ist eine Aufforderung). Fett und Kohlenhydrate sind ein Budget, das
    // man beim Abnehmen gerade nicht ausschoepfen muss – „noch 42 g Fett“ laese sich
    // dort wie die Aufforderung, sie noch zu essen. Deshalb „übrig“ — das ist neutral
    // und kurz genug fuer die schmalen Tageskarten („Spielraum“ brach dort um).
    const restTxt = rest < 0
      ? `${nfmt(-rest)} ${o.unit} ${o.dir === "min" ? "über Ziel" : "drüber"}`
      : o.dir === "min"
        ? `noch ${nfmt(rest)} ${o.unit}`
        : `${nfmt(rest)} ${o.unit} übrig`;
    return `<div class="gm ${o.cls || ""} is-${st}">
        <div class="gm-r"><span class="gm-n">${o.label}</span><span class="gm-v"><b>${nfmt(o.ist)}</b>&thinsp;/&thinsp;${nfmt(o.ziel)}${o.unitInline && o.unit ? " " + o.unit : ""}</span></div>
        <div class="gm-bar" role="progressbar" aria-valuenow="${Math.round(o.ist)}" aria-valuemin="0" aria-valuemax="${Math.round(o.ziel)}" aria-label="${esc(o.label)}"><span style="width:${pct}%"></span></div>
        ${showRest ? `<div class="gm-left">${restTxt}</div>` : ""}
      </div>`;
  }

  // Welche Tage ihre Makrobalken aufgeklappt haben. Bewusst nicht gespeichert: beim
  // Neuladen sind alle Tageskarten wieder eingeklappt (gleiches Muster wie collapsedCats
  // bei den Meal-Kategorien).
  const expandedDayGoals = new Set();

  // Kalorien breit in einer Zeile – die Makros stehen dahinter, standardmaessig
  // eingeklappt. Sieben Tage x 4 Balken (Kalorien + 3 Makros) gleichzeitig sichtbar
  // war beim UX-Review der groesste Befund fuer "zu viel auf einen Blick"; jetzt zeigt
  // die Karte im Ruhezustand nur noch den einen Balken, der beim Ueberfliegen der Woche
  // zaehlt. ueber goalMacrosHtml() derselbe Baustein wie bei "Ziele dieser Woche":
  // ausgeschriebene Namen, Label ueber dem Wert. Frueher hatte die Tageskarte eine
  // eigene, engere Variante mit Kuerzeln (P/KH/F) in einem starren Drei-Spalten-Raster -
  // auf schmalen Desktop-Karten (~232px) blieb dafuer kein Platz und Wert/Kuerzel
  // standen in zwei Zeilen uebereinander statt wie hier als Label+Wert PRO Makro.
  // goalMacrosHtml() wickelt stattdessen jedes Makro einzeln (flex-wrap) und schrumpft
  // dadurch von selbst auf ein Makro pro Zeile, sobald der Platz fuer drei nicht reicht.
  function dayGoalsHtml(s, t, dayKey) {
    const over = goalState(s.kcal, t.kcal) === "over";
    const open = expandedDayGoals.has(dayKey);
    // Ist der Tag ueber dem Ziel, sagt das schon das .dover-Badge im Kartenkopf mit der
    // exakten Zahl - die Restzeile im Balken wuerde denselben Wert ein zweites Mal
    // direkt darunter zeigen. Unter dem Ziel gibt es kein Badge, dort bleibt "noch X kcal"
    // die einzige Stelle, die das sagt.
    return `<div class="day-goals">
        ${goalBarHtml({ label: "Kalorien", ist: s.kcal, ziel: t.kcal, unit: "kcal", rest: over ? false : "attention", unitInline: true })}
        <button type="button" class="day-goals-toggle" data-action="toggle-day-goals" data-day="${dayKey}" aria-expanded="${open}">
          <span>Makros</span>
          <svg class="caret${open ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        ${open ? goalMacrosHtml(s, t) : ""}
      </div>`;
  }

  function dayNutHtml(s, dayKey) {
    if (!hasNut(s)) return "";
    // Ziel des konkreten Tages: am Ruhetag weniger Kohlenhydrate, dafuer mehr Fett.
    const t = goalTargetsForDay(dayKey);
    // Mit gespeichertem Ziel ersetzen die Balken die Textzeile – sonst staende alles doppelt.
    if (t) return dayGoalsHtml(s, t, dayKey);
    return `<div class="day-nut">
        <span class="kcal">${nfmt(s.kcal)} <small>kcal</small></span>
        <span class="macros">
          <span class="m carb"><b>${nfmt(s.carbs)}</b>&nbsp;g KH</span>
          <span class="m prot"><b>${nfmt(s.protein)}</b>&nbsp;g Eiw.</span>
          <span class="m fat"><b>${nfmt(s.fat)}</b>&nbsp;g Fett</span>
        </span>
      </div>`;
  }

  function weekNutHtml() {
    const w = weekNut();
    // Wochenziel = Summe aller sieben Tagesziele. Bewusst summiert statt „Tagesziel x 7“:
    // mit Carb-Cycling unterscheiden sich Kohlenhydrate und Fett je Tagestyp, die Woche
    // haengt dann davon ab, WELCHE Tage Trainingstage sind. Dass ein Teil davon noch
    // ungeplant ist, sagt das Kennzeichen „x von 7 Tagen geplant“.
    const t = goalTargetsForDays(DAYS.map(d => d.key));
    // Nur noch Kalorien fuer die Woche - Kohlenhydrate/Protein/Fett ueber sieben Tage
    // aufsummiert war eine Zahl ohne Handlung: entschieden wird immer auf Tagesebene,
    // nie "diese Woche insgesamt 980g Protein". Die Makrobalken bleiben, wo sie etwas
    // sagen: je Tag (dayGoalsHtml) und im Tages-Ring hier drunter (weekGoalHtml).
    // Kein umschliessender Rahmen mehr ("Deine Ziele"-Karte): Heute/Woche stehen mit
    // ihrer eigenen Kartenoptik (.wg-col) direkt auf der Seite - Karte-in-der-Karte war
    // doppelt genestet, und beide Karten tragen mit "Kalorien" + Eyebrow-Zeile schon
    // genug eigenen Kontext, um ohne uebergeordneten Titel verstaendlich zu sein.
    //
    // Ziel vorhanden: die beiden Zielkarten IMMER zeigen — auch ohne ein einziges geplantes
    // Meal. Der leere Zustand (keine Naehrwerte in der Woche) wird an weekGoalHtml durchgereicht;
    // die Diese-Woche-Karte wird dann zum Erklaerpanel statt zum Datenring, die Heute-Karte zeigt
    // bei Verzehr 0 die Ziele (Ring "Verbleibend" = volles Tagesziel, Makrobalken 0/Ziel).
    if (t) return `<div class="week-nut">${weekGoalHtml(w, t)}</div>`;
    // Randfall ohne gespeichertes Ziel (die App fuehrt sonst ins Onboarding): nur bei
    // vorhandenen Naehrwerten die Kalorien-Kachel, sonst faellt der Bereich ganz weg.
    if (!hasNut(w)) return "";
    const tiles = `<div class="wn-tile t-kcal"><div class="val">${nfmt(w.kcal)}<span class="u">kcal</span></div><div class="lbl">Kalorien</div></div>`;
    return `<div class="week-nut"><div class="wn-tiles">${tiles}</div></div>`;
  }

  // Ring + Kennzahlenliste + eigene Makro-Spalte, nachgebaut nach einem Screenshot einer
  // anderen Fitness-App (siehe Fotos/WhatsApp Image ...). `grundziel` ist das Ziel OHNE
  // Trainings-Zuschlag, `trainingAdd` der Zuschlag des Tages/der Woche (0 an Ruhetagen) -
  // zusammen ergeben sie das tatsaechliche Ziel, exakt wie computeGoal()/trainFromRest()
  // es schon rechnen (ziel = grundziel + trainingAdd), hier nur sichtbar aufgeteilt statt
  // fertig addiert. `headHtml` ist die kleine Zeile UEBER der grossen Ueberschrift
  // "Kalorien" (Zeitraum + Kennzeichen, z.B. "Heute · Montag"). `rightColHtml` ist der
  // KOMPLETTE Inhalt der zweiten Spalte samt eigener Ueberschrift (nicht nur Makros) -
  // bleibt die Spalte leer ("") faellt sie ganz weg. `grundzielLbl` heisst "Grundbedarf"
  // (Heute wie Woche) - NICHT "Tagesziel"/"Wochenziel": genau dieses Wort bezeichnet im
  // Tageskopf-Badge (.dover) den VOLLEN Wert MIT Trainingszuschlag. Dieselbe Bezeichnung
  // fuer zwei unterschiedliche Zahlen (mit/ohne Training) haette an Trainingstagen dazu
  // gefuehrt, dass "Tagesziel: 2.200" gelesen wird, obwohl das tatsaechliche Budget an dem
  // Tag 2.200 + Trainingszuschlag ist - "Grundbedarf" macht das "ohne Training" explizit.
  const RING_C = 201; // Umfang bei r=32 (2 × π × 32)
  function goalRingHtml(ist, grundziel, trainingAdd, headHtml, rightColHtml, grundzielLbl) {
    const ziel = grundziel + trainingAdd;
    const rest = Math.round(ziel - ist);
    const st = goalState(ist, ziel);
    const ratio = ziel ? ist / ziel : 0;
    const off = Math.max(0, RING_C * (1 - Math.min(1, ratio)));
    // Zustand steht zusaetzlich IMMER als Text da (Zahl + Wortwechsel) - der Bogen
    // verstaerkt das nur farblich, ersetzt es nicht (siehe CSS-Kommentar bei .wg).
    const stLbl = st === "over" ? "Drüber" : "Verbleibend";
    return `<div class="wg is-${st}">
        <div class="wg-lbl">${headHtml}</div>
        <div class="wg-row">
          <div class="wg-col-cal">
            <h3 class="wg-h">Kalorien</h3>
            <div class="wg-main">
              <div class="wg-ring">
                <svg viewBox="0 0 78 78" width="118" height="118" aria-hidden="true">
                  <circle class="wg-track" cx="39" cy="39" r="32"/>
                  <circle class="wg-fill" cx="39" cy="39" r="32" stroke-dasharray="${RING_C}" stroke-dashoffset="${off}"/>
                </svg>
                <div class="wg-c"><b>${nfmt(Math.abs(rest))}</b><span>${stLbl}</span></div>
              </div>
              <div class="wg-stats">
                <div class="wg-stat base" role="group" aria-label="${grundzielLbl}: ${nfmt(grundziel)} kcal"><span class="wg-stat-ic">${ICON_FLAG}</span><span class="wg-stat-txt"><small>${grundzielLbl}</small><b>${nfmt(grundziel)}</b></span></div>
                <div class="wg-stat food" role="group" aria-label="Ernährung: ${nfmt(ist)} kcal"><span class="wg-stat-ic">${iconSvg("utensils", "")}</span><span class="wg-stat-txt"><small>Ernährung</small><b>${nfmt(ist)}</b></span></div>
                <div class="wg-stat train" role="group" aria-label="Training: ${nfmt(trainingAdd)} kcal"><span class="wg-stat-ic">${ICON_DUMBBELL}</span><span class="wg-stat-txt"><small>Training</small><b>${nfmt(trainingAdd)}</b></span></div>
              </div>
            </div>
          </div>
          ${rightColHtml ? `<div class="wg-col-macros">${rightColHtml}</div>` : ""}
        </div>
      </div>`;
  }

  // Die drei Makrobalken einer Spalte. Protein ist eine Untergrenze (dir "min"),
  // Kohlenhydrate und Fett sind ein Budget — daher unterschiedliche Bewertung.
  // Hier stehen die Makros ausgeschrieben — anders als in den schmalen Tageskarten
  // des Plans (dayGoalsHtml), wo nur Kuerzel hineinpassen.
  function goalMacrosHtml(s, t) {
    return `<div class="wg-macros">
        ${goalBarHtml({ label: "Proteine", ist: s.protein, ziel: t.protein, unit: "g", cls: "t-prot", dir: "min", rest: "attention", unitInline: true })}
        ${goalBarHtml({ label: "Kohlenhydrate", ist: s.carbs, ziel: t.carbs, unit: "g", cls: "t-carb", rest: "attention", unitInline: true })}
        ${goalBarHtml({ label: "Fett", ist: s.fat, ziel: t.fat, unit: "g", cls: "t-fat", rest: "attention", unitInline: true })}
      </div>`;
  }

  // Zwei flache Leisten untereinander: heutiger Tag und ganze Woche, beide mit
  // Kalorienring UND Makros. Untereinander statt nebeneinander, weil jede Leiste so
  // die volle Breite nutzt — die Makros passen dann rechts daneben statt darunter,
  // und der ganze Block bleibt flach.
  function weekGoalHtml(w, t) {
    const d = DAYS.filter(x => x.key === todayDayKey())[0] || DAYS[0];
    const day = goalTargetsForDay(d.key);
    // Immer gegen den Plan der AKTUELLEN Woche rechnen, auch wenn state.plan gerade
    // auf die naechste Woche zeigt - "heute" bleibt heute, unabhaengig von der
    // gewaehlten Ansicht (siehe dayNutOf-Kommentar).
    const s = state.viewWeek === "next" ? dayNutOf(state.plans[weekKeyFor("cur")] || makeEmptyPlan(), d.key) : dayNut(d.key);
    // Leerzustand je Karte getrennt: die Heute-Karte zeigt ihren Makro-Hinweis, solange HEUTE
    // kein Meal hat (nicht schon, wenn irgendein anderer Wochentag geplant ist); die
    // Diese-Woche-Karte wird zum Erklaerpanel, solange die ganze Woche leer ist.
    const dayEmpty = !hasNut(s);
    const weekEmpty = !hasNut(w);
    const dayHead = `Deine Ziele für Heute · ${esc(d.label)}`;
    const plannedKeys = DAYS.filter(x => hasNut(dayNut(x.key))).map(x => x.key);
    const planned = plannedKeys.length;
    const open = 7 - planned;
    // Grundziel/Training fuer goalRingHtml aufgeteilt statt fertig addiert (siehe dort).
    // Bewusst gegen ALLE sieben Tage gerechnet (t, aus weekNutHtml uebergeben), nicht nur
    // die mit bereits eingeplanten Meals: Trainingstage sind eine Eigenschaft des
    // gespeicherten Ziels (state.goal.training), keine des Wochenplans - ein Trainingstag
    // zaehlt sein Kalorien-Plus auch dann, wenn dafuer noch kein Meal eingetragen ist.
    // Vorher haengte das an "geplanten" Tagen (goalTargetsForDays(plannedKeys)) - dadurch
    // fehlte der Trainings-Zuschlag fuer jeden Trainingstag ohne Meal komplett (zeigte
    // faelschlich "Training: 0"), und Grundziel war zu niedrig. rest1 ist garantiert nicht
    // null: weekGoalHtml laeuft nur, wenn ein Ziel existiert (siehe Aufrufer in weekNutHtml).
    const rest1 = goalTargets(1);
    const weekGrund = rest1.kcal * 7;
    const weekTrainAdd = t.kcal - weekGrund;
    // Trainings-Kennzeichen auch in der Tagesspalte der Uebersicht — sonst erklaert
    // sich das abweichende Kohlenhydrat-Ziel dort nicht. Ohne den kcal-Aufschlag im
    // Badge selbst: der steht jetzt schon in der Training-Zeile der Kennzahlenliste
    // (goalRingHtml) - hier direkt daneben noch einmal waere dieselbe Zahl doppelt.
    const dayTrainAdd = isTrainingDay(d.key) ? dayTrainKcal(d.key) : 0;
    const dayTrain = isTrainingDay(d.key)
      ? `<span class="wg-train" title="Trainingstag: ${esc(trainLevel((goalTraining()[d.key] || {}).level).label)}">${ICON_DUMBBELL}Training</span>` : "";
    const dayHeadHtml = `${dayHead}${dayTrain}`;
    const weekLbl = state.viewWeek === "next" ? "Nächste Woche" : "Diese Woche";
    // Eyebrow der Karte laenger/erklaerender als die kurze Wisch-Tab-Beschriftung (weekLbl bleibt
    // dafuer unveraendert). Der fruehere "X geplante Tage"-Chip ist raus: dieselbe Information
    // steht bereits rechts im Fortschritt-Balken ("x von 7 Tagen geplant") - Dopplung entfernt.
    const weekHeadHtml = state.viewWeek === "next" ? "Deine Ziele für nächste Woche" : "Deine Ziele für diese Woche";
    // Was bleibt fuer die noch leeren Tage? Das ist beim Planen die eigentlich
    // gesuchte Zahl — der blosse Wochenrest sagt nicht, wie viel pro Tag noch geht.
    const restKcal = t.kcal - w.kcal;
    const perOpen = open > 0 && restKcal > 0
      ? `<div class="wg-open">Für die ${open} offenen Tage bleiben ⌀ <b>${nfmt(restKcal / open)} kcal</b> pro Tag</div>`
      : "";
    // Rechte Spalte der Wochenkarte: Fortschritt statt Makros (Wochenmakros interessieren
    // niemanden - Makro-Entscheidungen fallen auf Tagesebene, siehe dayGoalsHtml/Kommentar
    // in weekNutHtml). Zeigt, wie viele der 7 Tage schon geplant sind, plus das Budget
    // fuer die restigen Tage (perOpen) - beides war ohnehin schon berechnet.
    const planPct = Math.round(planned / 7 * 100);
    const weekProgressHtml = `
      <h3 class="wg-h">Fortschritt</h3>
      <div class="wg-progress">
        <div class="wg-progress-txt" data-planned="${planned}">${planned} von 7 Tagen geplant</div>
        <div class="wg-progress-bar" role="progressbar" aria-valuenow="${planned}" aria-valuemin="0" aria-valuemax="7" aria-label="Tage geplant"><span style="width:${planPct}%"></span></div>
        ${perOpen}
      </div>`;
    // Rechte Spalte der Heute-Karte: im Leerzustand stehen die Makrobalken alle auf 0/Ziel und
    // sagen nichts - daher stattdessen ein kurzer Hinweis, was hier erscheint. Die Ueberschrift
    // "Makros" bleibt als Kontext. Ring + Grundbedarf/Ernaehrung/Training bleiben, die zeigen die
    // Ziele auch ohne geplantes Meal. Bewusst ein eigener, Makro-bezogener Satz (nicht der der
    // Diese-Woche-Karte), damit er auf dem Rechner nicht doppelt untereinander steht.
    const dayRight = dayEmpty
      ? `<h3 class="wg-h">Makros</h3><p class="wg-side-note">Trage für heute ein Meal ein, dann erscheinen hier deine Makros: Proteine, Kohlenhydrate und Fett.</p>`
      : `<h3 class="wg-h">Makros</h3>${goalMacrosHtml(s, day)}`;
    // Rechte Spalte der Diese-Woche-Karte: gleiches Muster wie dayRight — die Ueberschrift
    // "Fortschritt" bleibt als Kontext stehen, nur der Inhalt darunter wechselt. So haben beide
    // Karten immer Ring + Grundbedarf/Ernaehrung/Training UND dieselbe Form/Hoehe, auch auf dem
    // Handy im Wisch-Karussell (vorher wurde die ganze Karte zu einem separaten Panel ohne Ring).
    const weekRight = weekEmpty
      ? `<h3 class="wg-h">Fortschritt</h3><p class="wg-side-note">Plane deine Woche — hier siehst du dann Kalorien, Ernährung, Training und Makros auf einen Blick.</p>`
      : weekProgressHtml;
    // Der "Neu berechnen"-Knopf steht AUSSERHALB beider Karten, in einer eigenen Zeile unter
    // dem Wischstreifen. Zwei Gruende: Die Aktion betrifft das Ziel insgesamt (Tag UND Woche),
    // gehoert also an eine Stelle, die zu beiden gehoert - und in der Kopfzeile nur der
    // Heute-Karte machte er genau diese Kopfzeile rund 17px hoeher als die der Wochenkarte,
    // wodurch "Kalorien" samt Ring beim Wischen um diesen Betrag sprang. Zudem war er auf der
    // Wochenkarte gar nicht mehr zu sehen, weil er mit weggewischt wurde. Vormals in der
    // Wochenplan-Werkzeugleiste, dort konzeptionell falsch einsortiert (neben Teilen/Leeren
    // DIESER Woche).
    const recalcLink = `<button type="button" class="btn ghost sm wg-recalc" data-action="recalc-goal" title="Ziele neu berechnen" aria-label="Ziele neu berechnen">${TOOL_ICONS.recalc}<span>Ziele neu berechnen</span></button>`;
    // Auf dem Handy liegen die beiden Leisten nebeneinander und werden gewischt
    // (siehe CSS) – die Knopfleiste sagt, welche gerade zu sehen ist. Am Rechner
    // ist sie ausgeblendet, dort stehen beide untereinander wie bisher.
    // .wg-actions liegt bewusst weder in .wgbar noch in .wg-cols: initCarousel liest die
    // Kinder der Leiste als Sprungziele und die des Streifens als Karten - ein Knopf in
    // einem der beiden waere ein dritter, toter Slide-Schalter.
    return `<div class="wgbar" role="group" aria-label="Zielansicht wählen">
        <button type="button" class="wg-b">Heute</button>
        <button type="button" class="wg-b">${weekLbl}</button>
      </div>
      <div class="wg-cols">
        <div class="wg-col${isTrainingDay(d.key) ? " wg-col-training" : ""}">${goalRingHtml(s.kcal, rest1.kcal, dayTrainAdd, dayHeadHtml, dayRight, "Grundbedarf")}</div>
        <div class="wg-col">${goalRingHtml(w.kcal, weekGrund, weekTrainAdd, weekHeadHtml, weekRight, "Grundbedarf")}</div>
      </div>
      <div class="wg-actions">${recalcLink}</div>`;
  }

  // Zaehlt "X von 7 Tagen geplant" weich hoch statt den Endwert sofort hinzustellen -
  // aber nur, wenn sich die Zahl seit dem letzten Anzeigen wirklich veraendert hat. Sonst
  // wuerde jeder blosse Tab-Wechsel zurueck zu Home dieselbe Animation erneut abspulen,
  // und genau das soll bei einer haeufig besuchten Seite nicht passieren (siehe
  // apple-design/emil-design-eng: Animation nur, wo sie etwas zeigt, nicht bei jedem Blick).
  let lastShownPlanned = null; // nur fuer die laufende Sitzung, kein State-Feld noetig
  function animateProgressCount() {
    const txt = view.querySelector(".wg-progress-txt");
    const bar = view.querySelector(".wg-progress-bar > span");
    if (!txt) return; // Leerzustand (weekEmpty) hat keinen Fortschrittsbalken
    const planned = +txt.dataset.planned || 0;
    const from = lastShownPlanned == null ? 0 : lastShownPlanned;
    lastShownPlanned = planned;
    if (from === planned || reducedMotion()) {
      txt.textContent = planned + " von 7 Tagen geplant";
      if (bar) bar.style.width = Math.round(planned / 7 * 100) + "%";
      return;
    }
    const dur = 700, t0 = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3); // --ease-out als JS-Aequivalent
      const cur = Math.round(from + (planned - from) * eased);
      txt.textContent = cur + " von 7 Tagen geplant";
      if (bar) bar.style.width = Math.round(cur / 7 * 100) + "%";
      if (p < 1) requestAnimationFrame(frame); else { txt.textContent = planned + " von 7 Tagen geplant"; if (bar) bar.style.width = Math.round(planned / 7 * 100) + "%"; }
    }
    requestAnimationFrame(frame);
  }

  // Wochentag von heute – geteilt von der Uebersicht und der „Heute“-Markierung im Plan.
  function todayDayKey() { return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][new Date().getDay()]; }

  function nutFactsHtml(r) {
    const n = recipeNut(r);
    if (!hasNut(n)) return "";
    return `<div class="dsec"><h4>Makros <span style="text-transform:none;letter-spacing:0;font-weight:400">· je Portion</span></h4>
        <div class="nutfacts">
          <div class="nf t-kcal"><div class="v">${nfmt(n.kcal)}<span class="u">kcal</span></div><div class="k">Kcal</div></div>
          <div class="nf t-carb"><div class="v">${nfmt(n.carbs)}<span class="u">g</span></div><div class="k">KH</div></div>
          <div class="nf t-prot"><div class="v">${nfmt(n.protein)}<span class="u">g</span></div><div class="k">P</div></div>
          <div class="nf t-fat"><div class="v">${nfmt(n.fat)}<span class="u">g</span></div><div class="k">F</div></div>
        </div></div>`;
  }

  // ---------- Handy-Karussell (Wochenplan, Wochenziele, Rechner) ----------
  // Die Hoehenanpassungen der gerade aufgebauten Streifen UND deren ResizeObserver.
  // Bewusst Listen hier statt eines window-Listeners/Observers je Karussell: die
  // Streifen werden bei jedem render() neu gebaut, ein Listener pro Durchlauf waere
  // ein Leck. resetCarousels() leert beide Listen vor dem Neuaufbau und trennt die
  // alten Observer ausdruecklich (sonst haelt ein ResizeObserver seine beobachteten,
  // laengst aus dem DOM entfernten Knoten weiter am Leben). Steht VOR initCarousel,
  // damit die Zuweisung sicher vor dem ersten Aufruf lief.
  const fits = [];
  const carouselObservers = [];
  function resetCarousels() {
    carouselObservers.forEach(ro => ro.disconnect());
    carouselObservers.length = 0;
    fits.length = 0;
  }
  window.addEventListener("resize", () => fits.forEach(f => f()));

  // Bindet einen waagerecht schnappenden Streifen an die Knopfleiste darueber. Die
  // Kopplung laeuft ueber scrollLeft und NICHT ueber scrollIntoView: letzteres
  // verschiebt die Seite auch senkrecht, man wuerde beim Tagwechsel also
  // ungewollt nach oben oder unten springen.
  // Am Rechner steht die Leiste auf display:none, der Streifen ist ein normales
  // Raster – dann laeuft hier nur ein Klick-Handler mit, der nie ausgeloest wird.
  // panelList: nur noetig, wenn die Karten keine direkten Kinder des Streifens sind.
  // Beim Rechner ist das so – dort flacht display:contents die Zwischenebene nur fuer
  // die Darstellung ein, im DOM bleibt sie stehen, und .children liefe daneben.
  // onChange meldet jeden Kartenwechsel; der Rechner haengt daran seinen Fussknopf.
  function initCarousel(scroller, bar, panelList, onChange, opts) {
    if (!scroller || !bar) return null;
    const panels = panelList || Array.prototype.slice.call(scroller.children);
    const btns = Array.prototype.slice.call(bar.children);
    if (!panels.length || !btns.length) return null;

    let activeIdx = -1;
    function setActive(idx) {
      btns.forEach((b, i) => {
        const on = i === idx;
        b.classList.toggle("active", on);
        if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
      });
      if (idx !== activeIdx) { activeIdx = idx; if (onChange) onChange(idx); }
    }

    // Aktiv ist die Karte, deren linke Kante zuletzt vor der Mitte des Fensters lag –
    // das trifft auch waehrend eines halb gewischten Uebergangs das Richtige.
    function currentIndex() {
      const mid = scroller.scrollLeft + scroller.clientWidth / 2;
      let idx = 0;
      panels.forEach((p, i) => { if (p.offsetLeft - panels[0].offsetLeft <= mid) idx = i; });
      return idx;
    }

    function markActive() { setActive(currentIndex()); }

    // Der Streifen ist von sich aus so hoch wie die hoechste Karte. Mit
    // align-items: flex-start behaelt zwar jede Karte ihre eigene Hoehe, der
    // Streifen bliebe aber trotzdem auf Maximalhoehe stehen – die Luecke waere dann
    // nur nach draussen gewandert, vor die Einkaufsliste. Also die Hoehe der gerade
    // sichtbaren Karten nachfuehren. Beim Wischen zaehlt das Maximum der angerissenen
    // Karten, sonst wuerde die hereinkommende hoehere Karte unterwegs abgeschnitten.
    function fitHeight() {
      // Am Rechner ist .week ein Raster und scrollt nicht – dort nichts anfassen.
      if (scroller.scrollWidth <= scroller.clientWidth + 10) { scroller.style.height = ""; return; }
      let h = 0;
      // fixedHeight: Karten, die als gleich hoch gedacht sind (Heute/Woche-Ziele),
      // aber durch bedingten Inhalt (Trainings-Badge, "Neu berechnen"-Knopf) leicht
      // abweichen koennen. Ohne festes Mass auf das Maximum ALLER Karten wuerde der
      // Streifen beim Wischen zwischen beiden Hoehen wackeln, statt einmal fest zu
      // stehen. Der Wochenplan (.week) bleibt bewusst variabel: dort ist die
      // unterschiedliche Hoehe pro Tag gewollt (siehe Kommentar bei .week weiter oben).
      if (opts && opts.fixedHeight) {
        panels.forEach(p => { h = Math.max(h, p.offsetHeight); });
      } else {
        const left = scroller.scrollLeft, right = left + scroller.clientWidth;
        panels.forEach(p => {
          const a = p.offsetLeft - panels[0].offsetLeft;
          if (a + p.offsetWidth > left + 1 && a < right - 1) h = Math.max(h, p.offsetHeight);
        });
      }
      if (h) scroller.style.height = h + "px";
    }
    fits.push(fitHeight);

    // Karten koennen nach dem Aufbau wachsen: waehlt man im Rechner ein Ziel, klappt
    // das Tempo-Feld auf; setzt man Trainingstage, kommen Zeilen dazu. Ohne Nachmessen
    // behaelt der Streifen seine alte Hoehe und schneidet das Neue mit overflow:hidden
    // ab – der untere Teil der Karte war dann nicht mehr erreichbar. Ein Beobachter auf
    // den Karten faengt jede Ursache ab, statt jede einzelne Stelle von Hand nachzuziehen.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => fitHeight());
      panels.forEach(p => ro.observe(p));
      carouselObservers.push(ro);
    }

    let ticking = false;
    scroller.addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; markActive(); fitHeight(); });
    }, { passive: true });

    function go(i) {
      const p = panels[i];
      if (!p) return;
      // Markierung sofort umsetzen, nicht erst wenn das Scroll-Ereignis kommt: beim
      // Sanftlauf dauert das mehrere hundert Millisekunden, und ein Knopf, der nach
      // dem Tippen noch tot aussieht, wird ein zweites Mal getippt.
      const from = currentIndex();
      setActive(i);
      // Der Sanftlauf animiert stur ueber die gesamte Strecke – von Montag auf Samstag
      // hiesse das, durch alle Zwischentage zu rauschen. Das ist keine Bewegung, die
      // etwas erklaert, sondern nur Wartezeit. Deshalb: nur zum Nachbartag sanft
      // gleiten (dort zeigt die Bewegung, in welche Richtung es ging), sonst direkt
      // setzen. Bei mehr als einer Karte Abstand springt es also sofort.
      const neighbour = Math.abs(i - from) <= 1;
      scroller.scrollTo({
        left: p.offsetLeft - panels[0].offsetLeft,
        behavior: (neighbour && !reducedMotion()) ? "smooth" : "auto",
      });
      // Beim Direktsprung steht die neue Position schon – dann die Hoehe sofort
      // mitziehen, statt einen Frame lang die alte stehen zu lassen. Beim Sanftlauf
      // rechnet das Scroll-Ereignis unterwegs ohnehin laufend nach.
      fitHeight();
    }

    btns.forEach((b, i) => b.addEventListener("click", () => go(i)));

    markActive();
    fitHeight();
    return { go: go, fit: fitHeight, index: currentIndex };
  }

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  // Die Tagesleiste klebt unter dem Seitenkopf. Dessen Hoehe haengt an Schriftgroesse
  // und Bildschirmbreite (Slogan bricht um, Reiter wandern nach unten) – deshalb
  // gemessen und als --head-h gesetzt, statt im CSS eine Zahl zu raten.
  function syncStickyOffsets() {
    const root = document.documentElement;
    const head = document.querySelector("header.site");
    if (head) root.style.setProperty("--head-h", head.offsetHeight + "px");
    // Untere Reiterleiste: auf dem Handy fest am Bildschirmrand. Der klebende
    // Fussknopf des Rechners muss darueber sitzen, sonst laege er dahinter. Am Rechner
    // steht die Leiste im Kopf, dann ist der Abstand 0.
    const tabs = document.querySelector(".tabs");
    const fixed = tabs && getComputedStyle(tabs).position === "fixed";
    root.style.setProperty("--tabbar-h", fixed ? tabs.offsetHeight + "px" : "0px");
  }
  window.addEventListener("resize", syncStickyOffsets);

  // ---------- „Ziele <Jahr>": Gewichtsverlauf als Jahresdiagramm ----------
  const MON_SHORT = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
  const MON_LONG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  function kgfmt(n) { return (Math.round(n * 10) / 10).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  // Naechstgroessere "runde" Schrittweite (1, 2, 2,5, 5, 10 und Zehnerpotenzen davon).
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function monthLabel(m) { return MON_LONG[monthIdx(m)] + " " + m.slice(0, 4); }
  // Jahre, die eine Ansicht verdienen: alles mit Messung oder Ziel, plus das laufende Jahr.
  function weightYears() {
    const ys = {};
    (state.weights || []).forEach(e => { ys[e.m.slice(0, 4)] = 1; });
    Object.keys(state.weightGoals || {}).forEach(y => { ys[y] = 1; });
    ys[String(new Date().getFullYear())] = 1;
    return Object.keys(ys).sort();
  }
  function activeYear() {
    const ys = weightYears();
    const y = String(state.viewYear || new Date().getFullYear());
    return ys.indexOf(y) !== -1 ? y : ys[ys.length - 1];
  }

  // Das Diagramm. Bewusst reines SVG ohne Bibliothek: die App laedt nichts nach, und bei
  // hoechstens ein paar hundert Punkten ist SVG ohnehin die richtige Wahl.
  // Die X-Achse steht FEST auf die zwoelf Monate und dehnt sich nicht nach den Daten.
  // Das ist der Grund, warum auch wenige Messungen hier ehrlich aussehen: die Skala kann
  // nicht ueber das Tempo luegen. Januar sitzt ganz links, Dezember ganz rechts - damit
  // endet auch die Ziellinie sichtbar am Dezember und laeuft nicht aus dem Bild.
  // Die Breite kommt als Pixelmass von aussen (siehe initWeightChart), damit eine
  // SVG-Einheit genau ein Bildschirmpunkt ist. Mit fester viewBox waere die Schrift
  // sonst auf dem Handy auf ein Drittel geschrumpft und am breiten Bildschirm riesig -
  // im Layout-Test war die Achsenbeschriftung dadurch unlesbar.
  const WCH = { PL: 42, PR: 22, PT: 14, PB: 26 };
  function weightChartSvg(year, rows, ziel, width) {
    const W = Math.max(260, Math.round(width || 600));
    // Hoehe an die Breite koppeln, aber gedeckelt: auf einem breiten Bildschirm waere
    // ein Diagramm mit fester Hoehe fast 5:1 flach und die Kurve darin gestaucht -
    // Veraenderungen von ein, zwei Kilo waeren nicht mehr abzulesen.
    const g = Object.assign({ W: W, H: Math.max(190, Math.min(300, Math.round(W * 0.42))) }, WCH);
    const plotW = g.W - g.PL - g.PR, plotH = g.H - g.PT - g.PB;
    // Monatsindex 0..11 auf die Breite verteilt - keine Datumsarithmetik mehr noetig,
    // seit ein Eintrag fuer einen ganzen Monat steht.
    const px = i => g.PL + (i / 11) * plotW;

    let lo = Infinity, hi = -Infinity;
    rows.forEach(r => { lo = Math.min(lo, r.kg); hi = Math.max(hi, r.kg); });
    if (ziel != null) { lo = Math.min(lo, ziel); hi = Math.max(hi, ziel); }
    // Sonderfall: eine einzige Messung oder lauter gleiche Werte -> Spanne 0. Ohne diesen
    // Mindestabstand teilte die Skala durch null und das ganze Diagramm waere NaN.
    let pad = (hi - lo) * 0.18;
    if (!(pad > 0.05)) pad = 1.5;
    lo -= pad; hi += pad;
    // Auf runde Schritte aufziehen: "90 / 85 / 80" liest sich im Vorbeigehen, die
    // rechnerisch exakten Grenzen ergaeben "90,8 / 86,3 / 81,7" - Zahlen, die niemand
    // im Kopf zuordnet.
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    const py = kg => g.PT + (hi - kg) / (hi - lo) * plotH;

    // Waagerechtes Gitter, zurueckhaltend - es soll die Kurve stuetzen, nicht mit ihr
    // um Aufmerksamkeit ringen.
    let grid = "";
    for (let kg = lo; kg <= hi + step / 2; kg += step) {
      const y = py(kg);
      grid += `<line class="wch-grid" x1="${g.PL}" y1="${y.toFixed(1)}" x2="${g.W - g.PR}" y2="${y.toFixed(1)}"/>`
            + `<text class="wch-ay" x="${g.PL - 7}" y="${(y + 3.5).toFixed(1)}">${kgfmt(kg)}</text>`;
    }
    // Monatsachse: zwoelf Marken, genau unter den moeglichen Messpunkten. Ausgeschrieben,
    // sobald Platz ist - "J F M A M J J A S O N D" hat zweimal J und zweimal M und ist
    // damit mehrdeutig.
    const wide = g.W >= 460;
    let months = "";
    for (let m = 0; m < 12; m++) {
      months += `<text class="wch-ax" x="${px(m).toFixed(1)}" y="${g.H - 10}">${wide ? MON_LONG[m].slice(0, 3) : MON_SHORT[m]}</text>`;
    }

    // Ziellinie: vom ersten bekannten Stand des Jahres zum Wunschgewicht im Dezember.
    // Gestrichelt und in gedaempfter Farbe - die Serien unterscheiden sich damit auch
    // ohne Farbsehen, was eine reine Farbunterscheidung nicht leisten wuerde.
    // Der hohle Endpunkt ist wichtig: ohne ihn lief die Linie am Bildrand einfach aus
    // und sah aus, als ginge sie ins Unendliche weiter, statt im Dezember anzukommen.
    let zielEl = "";
    if (ziel != null && rows.length) {
      const zx = px(11), zy = py(ziel);
      zielEl = `<line class="wch-goal" x1="${px(monthIdx(rows[0].m)).toFixed(1)}" y1="${py(rows[0].kg).toFixed(1)}"
          x2="${zx.toFixed(1)}" y2="${zy.toFixed(1)}"/>
        <circle class="wch-goal-dot" cx="${zx.toFixed(1)}" cy="${zy.toFixed(1)}" r="4.5"/>`;
    }

    const pts = rows.map(r => `${px(monthIdx(r.m)).toFixed(1)},${py(r.kg).toFixed(1)}`).join(" ");
    const line = rows.length > 1 ? `<polyline class="wch-line" points="${pts}"/>` : "";
    // Zwei Kreise je Messung: der sichtbare kleine und ein unsichtbarer grosser als
    // Trefferflaeche - ein 4-px-Punkt ist mit dem Finger nicht zu treffen. Der Radius
    // waechst mit dem Monatsabstand (eine SVG-Einheit = ein Bildschirmpunkt), bleibt
    // aber bei 18 gedeckelt: auf breiten Schirmen braucht es keine 60-px-Flaechen, auf
    // schmalen duerfen sich die Flaechen leicht ueberlappen - getroffen wird ohnehin
    // der oberste Punkt, und zu klein waere hier das groessere Uebel.
    const hitR = Math.max(11, Math.min(18, plotW / 11 / 2)).toFixed(1);
    const dots = rows.map(r =>
      `<g class="wch-pt" tabindex="0" role="img" data-m="${r.m}" aria-label="${esc(monthLabel(r.m))}: ${kgfmt(r.kg)} Kilogramm">
         <title>${esc(monthLabel(r.m))}: ${kgfmt(r.kg)} kg</title>
         <circle class="wch-hit" cx="${px(monthIdx(r.m)).toFixed(1)}" cy="${py(r.kg).toFixed(1)}" r="${hitR}"/>
         <circle class="wch-dot" cx="${px(monthIdx(r.m)).toFixed(1)}" cy="${py(r.kg).toFixed(1)}" r="4"/>
       </g>`).join("");

    return `<svg class="wch-svg" viewBox="0 0 ${g.W} ${g.H}" width="${g.W}" height="${g.H}"
        role="img" aria-label="Gewichtsverlauf ${year}, ${rows.length} Messung${rows.length === 1 ? "" : "en"}">
        ${grid}${months}${zielEl}${line}${dots}
      </svg>`;
  }

  // Ohne Einwilligung entfaellt Diagramm/Menue komplett - Gewicht ist ein Gesundheitsdatum
  // (Art. 9 DSGVO, Ziffer 3b der Datenschutzerklaerung) und wird nicht stillschweigend
  // mitgetrackt, auch wenn schon ein Gewicht aus der Ziel-Berechnung vorliegt.
  function weightConsentHtml() {
    // Widerruf loescht keine Bestandsdaten (siehe weightConsentRevokeModal/Ziffer 3b) - das
    // Recht, sie einzusehen und einzeln zu loeschen, darf deshalb nicht an der Einwilligung
    // haengen. Nur "Gewicht eintragen" (neue Erfassung) ist an sie gebunden.
    const hasData = (state.weights || []).length > 0;
    return `<div class="wg-col wch">
        <div class="wch-head">
          <div>
            <div class="wg-lbl">Ziele ${activeYear()}</div>
            <h3 class="wg-h">Gewicht</h3>
          </div>
        </div>
        <button class="btn primary" data-action="weight-consent-in">Verlauf aktivieren</button>
        ${hasData ? `<button class="btn ghost sm" data-action="weight-manage" style="margin-top:8px">Bestehende Einträge verwalten</button>` : ""}
      </div>`;
  }

  // Die ganze Karte: Kopf mit Jahr und Kennzahlen, Jahreswechsel, Diagramm, Legende.
  function weightHtml() {
    if (!hasWeightConsent()) return weightConsentHtml();
    const year = activeYear();
    const all = state.weights || [];
    const rows = all.filter(e => e.m.slice(0, 4) === year);
    const ziel = (state.weightGoals || {})[year];
    const years = weightYears();
    const first = rows.length ? rows[0] : null;
    const last = rows.length ? rows[rows.length - 1] : null;
    const diff = first && last ? last.kg - first.kg : null;

    // Kennzahlen statt Fliesstext: Start, aktueller Stand, Ziel. Die Veraenderung traegt
    // ihr Vorzeichen sichtbar, damit "-2,4 kg" nicht als Zunahme gelesen wird.
    // Der abkuerzende Punkt gehoert nur an echte Abkuerzungen: "Jan." ja, "Mai" nein -
    // dreibuchstabige Monatsnamen (Mai) sind schon vollstaendig.
    const fromMon = first ? MON_LONG[monthIdx(first.m)] : "";
    const fromLbl = fromMon.length > 3 ? fromMon.slice(0, 3) + "." : fromMon;
    // Gruen heisst „naeher am Ziel", NICHT „weniger". Die Richtung kommt deshalb aus dem
    // Jahresziel (liegt es ueber dem Startgewicht, ist eine Zunahme der Fortschritt),
    // ersatzweise aus dem Ziel des Rechners. Ohne beides bleibt Abnehmen die Annahme.
    // Fest an „runter = gut" gekoppelt haette die App jedem, der aufbaut, seinen Erfolg
    // in Alarmrot gezeigt - in einer App, die ausdruecklich auch fuer Muskelaufbau rechnet.
    const zunahmeIstZiel = ziel != null ? ziel > (first ? first.kg : 0)
      : !!(state.goal && state.goal.mode === "gain");
    const towardGoal = zunahmeIstZiel ? diff >= 0 : diff <= 0;
    // Die Kennzahlen stehen unter dem Diagramm, nicht in der Kopfzeile: oben steht jetzt der
    // Plus-Knopf, und die Zahlen lesen sich als Bilanz nach der Kurve besser als davor.
    // Ohne Messung und ohne Ziel entfaellt der Block ganz — sonst bliebe eine Trennlinie
    // ueber einer leeren Zeile stehen.
    const stats = (last || ziel != null) ? `<div class="wch-stats wch-foot">
        ${last ? `<div class="wch-s"><small>Aktuell</small><b>${kgfmt(last.kg)}<span>kg</span></b></div>` : ""}
        ${diff != null && rows.length > 1 ? `<div class="wch-s"><small>Seit ${fromLbl}</small><b class="${towardGoal ? "is-toward" : "is-away"}">${diff > 0 ? "+" : "−"}${kgfmt(Math.abs(diff))}<span>kg</span></b></div>` : ""}
        ${ziel != null ? `<div class="wch-s"><small>Ziel</small><b>${kgfmt(ziel)}<span>kg</span></b></div>` : ""}
      </div>` : "";

    // Jahreswechsel nur zeigen, wenn es etwas zu wechseln gibt. Gleiche Knopfoptik wie
    // der Wochenwechsel im Plan (.week-switch/.ws-btn) statt eines zweiten Musters.
    const yearBar = years.length > 1
      ? `<div class="week-switch" role="tablist" aria-label="Jahr wählen">
          ${years.map(y => `<button class="ws-btn${y === year ? " active" : ""}" data-action="wyear" data-year="${y}" role="tab" aria-selected="${y === year}">${y}</button>`).join("")}
        </div>`
      : "";

    let body;
    if (!rows.length) {
      // Leerer Zustand mit Handlung statt leerer Flaeche.
      body = `<p class="wch-empty">Noch keine Messung ${year === String(new Date().getFullYear()) ? "in diesem Jahr" : "in " + year}.</p>`;
    } else {
      // Der Plot bleibt hier leer: initWeightChart misst die tatsaechliche Breite und
      // zeichnet erst dann - nur so stimmt die Schriftgroesse auf jedem Bildschirm.
      body = `<div class="wch-plot"></div>`
        // Legende ist Pflicht, sobald zwei Serien im Bild sind.
        // Nur "Ziel", nicht "Ziel 75,0 kg": die Zahl steht schon in der Kennzahlenreihe
        // darueber - zweimal dieselbe Zahl im selben Bild ist Fuellung, keine Information.
        + (ziel != null && rows.length ? `<div class="wch-leg">
            <span><i class="k-line"></i>Gemessen</span><span><i class="k-goal"></i>Ziel</span>
          </div>` : "")
        // Ausgabefeld fuer den angetippten Punkt - ohne Bedienhinweis. Dass ein Punkt
        // antippbar ist, zeigt er selbst; ein Satz daneben waere genau die Erklaerung,
        // die die Textmenge-Vorgabe untersagt. Bei nur einer Messung steht hier der Wert,
        // weil es dort nichts zu vergleichen gibt.
        + `<div class="wch-tip" aria-live="polite">${rows.length > 1 ? "" : monthLabel(last.m) + " · " + kgfmt(last.kg) + " kg"}</div>`;
    }

    // Eine Aktion oben rechts statt zweier Knoepfe unten: dasselbe rote Plus wie auf den
    // Meal-Karten (.imgadd), dahinter das Menue mit "Gewicht eintragen" / "Ziel aendern".
    return `<div class="wg-col wch">
        <div class="wch-head">
          <div>
            <div class="wg-lbl">Ziele ${year}</div>
            <h3 class="wg-h">Gewicht</h3>
          </div>
          <div class="wch-menu">
            <button class="wch-add" data-action="weight-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Gewicht eintragen oder Ziel ändern">+</button>
          </div>
        </div>
        ${yearBar}
        ${body}
        ${stats}
      </div>`;
  }

  // Startreiter: Begruessungs-Hero + Kalorien-Uebersicht (Heute/Woche-Ringe), beide vormals
  // oben im Wochenplan. Dort war es voll, bevor man ueberhaupt beim Tagesraster war - jetzt
  // eigene Landingpage, der Wochenplan startet direkt mit "Dein Wochenplan".
  function renderHome() {
    view.innerHTML = `${appHeroHtml()}${weekNutHtml()}${rueckblickHtml()}${weightHtml()}`;
    resetCarousels();
    initCarousel(view.querySelector(".wg-cols"), view.querySelector(".wgbar"), null, null, { fixedHeight: true });
    animateProgressCount();
    initWeightChart();
  }

  // Kurzform eines Wochenschluessels fuers Label: "2026-W29" -> "KW 29".
  function weekKwLabel(wk) { const m = /-W(\d+)$/.exec(wk); return m ? "KW " + Number(m[1]) : wk; }
  // Paket C1: Rueckblick auf Home — Streak (Wochen in Folge geplant) + Mini-Trend der
  // durchschnittlichen Tageskalorien der letzten Wochen + Ziel-Treffer-Quote. Quelle ist das
  // schlanke Archiv state.weekStats (abgelaufene Wochen, siehe archiveWeek). Ohne Ziel oder ohne
  // jede Historie/ Streak faellt der Block ganz weg (kein leerer Kasten fuer neue Nutzer).
  function rueckblickHtml() {
    if (!state.goal) return "";
    const stats = state.weekStats || {};
    const keys = Object.keys(stats).sort();
    // Streak: aufeinanderfolgende Wochen rueckwaerts mit geplanten Tagen; die aktuelle zaehlt
    // mit, sobald sie schon geplant ist.
    const curKey = weekKeyFor("cur");
    const curPlan = state.plans[curKey];
    const curPlanned = !!(curPlan && DAYS.some(d => hasNut(dayNutOf(curPlan, d.key))));
    let streak = 0; const dcur = new Date(); dcur.setDate(dcur.getDate() - 7);
    while (true) { const wk = isoWeekKey(dcur); if (stats[wk] && stats[wk].days > 0) { streak++; dcur.setDate(dcur.getDate() - 7); } else break; }
    if (curPlanned) streak++;
    if (!keys.length && !streak) return "";
    const shownKeys = keys.slice(-8);
    let chart = "";
    if (shownKeys.length) {
      const vals = shownKeys.map(k => stats[k].kcal);
      const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals), span = (max - min) || 1;
      const bars = shownKeys.map(k => {
        const s = stats[k];
        const h = 22 + Math.round((s.kcal - min) / span * 78);   // 22..100 %, damit auch das Minimum sichtbar bleibt
        return `<span class="rueck-bar" title="${weekKwLabel(k)}: Ø ${nfmt(s.kcal)} kcal, ${s.hit}/${s.days} Tage im Ziel"><i style="height:${h}%"></i></span>`;
      }).join("");
      const totDays = shownKeys.reduce((a, k) => a + stats[k].days, 0);
      const totHit = shownKeys.reduce((a, k) => a + stats[k].hit, 0);
      const avgKcal = Math.round(vals.reduce((a, v) => a + v, 0) / vals.length);
      chart = `<div class="rueck-bars" aria-hidden="true">${bars}</div>
        <div class="rueck-foot">
          <div class="rueck-s"><small>&#216; pro Tag</small><b>${nfmt(avgKcal)}<span>kcal</span></b></div>
          <div class="rueck-s"><small>Ziel getroffen</small><b>${totHit}<span>/${totDays} Tage</span></b></div>
        </div>`;
    }
    const flame = `<svg class="rueck-fl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2c.4 3-1.6 4.2-2.9 5.6C9.2 9 8 10.4 8 12.6a4 4 0 0 0 8 .2c0-1.3-.5-2.3-1-3 .9.4 1.7 1.2 2.2 2.3.3-.7.5-1.6.5-2.6 0-3.4-2.3-5.4-4.2-7.5z"/></svg>`;
    const streakLine = streak
      ? `<div class="rueck-streak">${flame}<span><b>${streak}</b> Woche${streak === 1 ? "" : "n"} in Folge geplant</span></div>`
      : "";
    return `<section class="rueck">
        <div class="wg-lbl">Rückblick</div>
        ${streakLine}
        ${chart}
      </section>`;
  }

  // Zeichnet das Diagramm in der gemessenen Breite und haengt die Bedienung dran.
  // Punkt antippen/anfahren -> Datum und Gewicht in die Zeile darunter. Ein reiner
  // Hover-Tooltip haette auf dem Handy gar nichts gezeigt, deshalb Klick UND Fokus
  // (letzterer bedient zugleich die Tastatur).
  function initWeightChart() {
    const host = view.querySelector(".wch-plot");
    if (!host) return;
    const tip = view.querySelector(".wch-tip");
    const base = tip ? tip.textContent : "";
    const year = activeYear();
    const rows = (state.weights || []).filter(e => e.m.slice(0, 4) === year);
    const ziel = (state.weightGoals || {})[year];
    if (!rows.length) return;

    host.innerHTML = weightChartSvg(year, rows, ziel != null ? ziel : null, host.clientWidth);
    host.querySelectorAll(".wch-pt").forEach(pt => {
      const show = () => {
        const row = rows.filter(e => e.m === pt.dataset.m)[0];
        if (row && tip) tip.textContent = monthLabel(row.m) + " · " + kgfmt(row.kg) + " kg";
        host.querySelectorAll(".wch-pt").forEach(o => o.classList.toggle("is-on", o === pt));
      };
      pt.addEventListener("click", show);
      pt.addEventListener("focus", show);
      pt.addEventListener("mouseenter", show);
    });
    const svg = host.querySelector(".wch-svg");
    if (svg) svg.addEventListener("mouseleave", () => {
      if (tip) tip.textContent = base;
      host.querySelectorAll(".wch-pt").forEach(o => o.classList.remove("is-on"));
    });
  }
  // Breite aendert sich (Drehen, Fenster ziehen) -> neu zeichnen, sonst behielte das
  // SVG seine alte Pixelbreite und stuende zu schmal oder abgeschnitten da.
  window.addEventListener("resize", () => { if (view.querySelector(".wch-plot")) initWeightChart(); });

  function renderPlan() {
    let html = `<div class="section-head plan-head">
        <div class="title">
          <h2>Dein Wochenplan</h2>
        </div>
        <div class="plan-tools">
          <div class="week-switch" role="tablist" aria-label="Woche wählen">
            <button class="ws-btn${state.viewWeek === "next" ? "" : " active"}" data-action="week" data-week="cur" role="tab" aria-selected="${state.viewWeek === "next" ? "false" : "true"}">Aktuelle Woche</button>
            <button class="ws-btn${state.viewWeek === "next" ? " active" : ""}" data-action="week" data-week="next" role="tab" aria-selected="${state.viewWeek === "next" ? "true" : "false"}">Nächste Woche</button>
          </div>
          <button class="btn ghost icon-gh" data-action="share" title="Woche teilen" aria-label="Woche teilen">${TOOL_ICONS.share}</button>
          ${canEdit() ? `<button class="btn ghost icon-gh" data-action="clear-week" title="Woche leeren" aria-label="Woche leeren">${TOOL_ICONS.clear}</button>` : ""}
        </div>
      </div>`;

    // In der Naechste-Woche-Ansicht gibt es kein „heute“ – sonst wuerde derselbe
    // Wochentag faelschlich als heutiger markiert.
    const todayKey = state.viewWeek === "next" ? null : todayDayKey();

    // Tagesleiste: nur auf dem Handy sichtbar (CSS), dort Anzeige und Sprungziel des
    // Karussells. Kein role="tablist" – es sind keine Reiter, sondern Sprungmarken
    // in einen Streifen, der auch gewischt werden kann. Die Kurzform steht sichtbar,
    // der volle Wochentag im aria-label; sonst laese eine Sprachausgabe nur „Mo“.
    html += `<nav class="daybar" aria-label="Zum Wochentag springen">`;
    DAYS.forEach(d => {
      const isToday = d.key === todayKey;
      html += `<button type="button" class="db-b${isToday ? " is-today" : ""}" aria-label="${esc(d.label)}${isToday ? " (heute)" : ""}"><span>${d.short}</span><span class="db-dot" aria-hidden="true"></span></button>`;
    });
    html += `</nav><div class="week">`;

    DAYS.forEach(d => {
      const isToday = d.key === todayKey;
      // Warnzeichen direkt in der Kopfzeile: sonst sieht man erst beim Scrollen zur
      // Fussbilanz, welcher Tag den Korridor sprengt. Beim Ueberfliegen der Woche ist
      // aber genau das die Frage — welchen Tag muss ich nachjustieren?
      const dTarget = goalTargetsForDay(d.key);
      const dSum = dayNut(d.key);
      const dOver = dTarget && hasNut(dSum) && goalState(dSum.kcal, dTarget.kcal) === "over";
      // Die Trainings-Markierung haengt am gespeicherten Ziel: ohne Ziel gibt es auch
      // keine Tagestypen, dann bleibt die Karte wie bisher.
      const isTrain = !!state.goal && isTrainingDay(d.key);
      // Kompakt als Icon+Zahl statt Volltext ("120 kcal drüber") - der ausgeschriebene
      // Satz steht im title, wie beim Trainings-Badge daneben. Zwei ausgeschriebene
      // Badges plus Tagesname sprengten auf schmalen Karten sonst die Kopfzeile.
      const dOverBadge = dOver
        ? `<span class="dover" title="${esc(nfmt(dSum.kcal - dTarget.kcal) + " kcal über dem Tagesziel")}">${ICON_WARN}${nfmt(dSum.kcal - dTarget.kcal)}</span>`
        : "";
      html += `<section class="day${isToday ? " today" : ""}${dOver ? " over" : ""}${isTrain ? " training" : ""}"><div class="day-head"><span class="dname">${d.label}</span>${isTrain ? trainBadgeHtml(d.key) : ""}${dOverBadge}<span class="dtag">${isToday ? "Heute" : d.short}</span></div><div class="slots">`;
      MEALS.forEach(m => {
        const ids = state.plan[d.key][m.key];
        html += `<div class="slot" data-meal="${m.key}" data-slot="${d.key}:${m.key}">
          <div class="mlabel">${m.label}</div>`;
        let shown = 0;
        ids.forEach((rid, idx) => {
          const r = getRecipe(rid);
          if (!r) return;
          shown++;
          const drag = canEdit();
          html += `<div class="filled"${drag ? ` draggable="true"` : ""} data-action="view" data-id="${r.id}" data-slot-src="${d.key}:${m.key}:${idx}" title="${esc(r.name)}${drag ? " – ziehen zum Verschieben" : ""}">
              ${thumbHtml(r, "r-thumb")}
              <div><div class="r-name">${esc(r.name)}</div>${recipeNut(r).kcal ? `<div class="r-meta">${nfmt(recipeNut(r).kcal)} kcal</div>` : ""}</div>
              ${drag ? `<button class="x" data-action="unassign" data-slot-src="${d.key}:${m.key}:${idx}" aria-label="Entfernen" title="Entfernen">✕</button>` : ""}
            </div>`;
        });
        if (canEdit()) html += `<button class="add${shown ? " more" : ""}" data-action="pick" data-day="${d.key}" data-meal="${m.key}">+ ${shown ? "Noch ein Meal" : "Meal wählen"}</button>`;
        html += `</div>`;
      });
      html += `</div>${dayNutHtml(dayNut(d.key), d.key)}</section>`;
    });

    html += `</div>
      <button class="shop-cta" data-action="shopping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        Einkaufsliste der Woche
      </button>`;
    view.innerHTML = html;
    syncStickyOffsets();
    resetCarousels(); // die Streifen des vorigen Durchlaufs sind gerade weggeworfen worden
    const planCarousel = initCarousel(view.querySelector(".week"), view.querySelector(".daybar"));
    // Ohne diesen Sprung stuende beim Reiterwechsel auf dem Handy immer Montag da,
    // egal welcher Wochentag gerade ist – "next" hat kein "heute", dort bleibt Montag.
    if (planCarousel && todayKey) {
      const todayIdx = DAYS.findIndex(d => d.key === todayKey);
      if (todayIdx > 0) planCarousel.go(todayIdx);
    }
  }

  // Bewusst nicht gespeichert: beim Neuladen gilt wieder die Standardvorbelegung unten.
  const collapsedCats = new Set();
  // Vorbelegung laeuft nur einmal: sonst wuerfe jeder renderRecipes()-Aufruf (z. B. nach
  // dem Aufklappen einer Kategorie) die eigene Auswahl des Nutzers wieder um.
  let collapsedCatsSeeded = false;
  // Bewusst nicht gespeichert (wie collapsedCats): beim Neuladen ist die Liste wieder voll.
  let recipeQuery = "";

  // "von Anna" auf der Karte - nur in einer Gruppe, nur bei fremden Meals, nur der Vorname.
  //
  // Das Meal speichert bei "by" ausschliesslich die uid, nie den Namen: der wird erst zur
  // Anzeigezeit aus der Mitgliederliste aufgeloest. Dadurch verschwindet der Personenbezug
  // automatisch, sobald jemand die Gruppe verlaesst oder sein Konto loescht - ohne dass in
  // n Meal-Dokumenten nachgeraeumt werden muss. Ist die uid unbekannt, steht schlicht nichts da.
  function recipeAuthorHtml(r) {
    if (!syncGid || !r || !r.by || r.by === syncUid) return "";
    const who = firstName((memberByUid(r.by) || {}).name);
    if (!who) return "";
    return `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(who)}</span>`;
  }

  // Kollidiert mit keiner echten Kategorie - Schluessel der Favoriten-Gruppe in der Map.
  const FAV_KEY = "__favs";

  // Baut nur Kopfzeile + (bei Meals) Suchfeld + leeren Container und haengt den
  // input-Listener an. Ein voller render() ueber view.innerHTML zerstoert bei jedem
  // Tastendruck Fokus und Cursor im Suchfeld - deshalb schreibt nur paintRecipeGroups()
  // danach in #r-groups, genau wie paint(q) im Planer-Picker nur nach #p-list schreibt.
  function renderRecipes() {
    let html = `
      <div class="section-head">
        <div class="title">
          <h2>Meine Meals</h2>
        </div>
        ${canEdit() && state.recipes.some(isExample) ? `<button class="btn ghost sm" data-action="clear-examples">Beispiele entfernen</button>` : ""}
        ${canEdit() ? `<button class="btn primary" data-action="new-recipe">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Neues Meal
        </button>` : ""}
      </div>
      ${state.recipes.length > 0 ? `<div class="recipe-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="r-search" placeholder="Meal suchen …" autocomplete="off" value="${esc(recipeQuery)}" aria-label="Meals durchsuchen">
      </div>` : ""}
      <div id="r-groups"></div>`;
    view.innerHTML = html;
    const searchEl = view.querySelector("#r-search");
    if (searchEl) searchEl.addEventListener("input", () => { recipeQuery = searchEl.value; paintRecipeGroups(); });
    paintRecipeGroups();
  }

  // Schreibt ausschliesslich nach #r-groups - Kopfzeile und Suchfeld bleiben unberuehrt,
  // damit ein Tastendruck im Suchfeld weder Fokus noch Cursorposition verliert.
  function paintRecipeGroups() {
    const container = view.querySelector("#r-groups");
    if (!container) return;

    if (state.recipes.length === 0) {
      container.innerHTML = `<div class="empty">
        <svg class="em-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7l-4-3H5a1 1 0 0 0-1 1Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <h3>${canEdit() ? "Noch keine Meals" : "Hier ist noch nichts"}</h3>
        <p>${canEdit() ? "Lege dein erstes Meal an – danach kannst du es im Wochenplan auf die Tage verteilen." : "Sobald jemand aus eurer Gruppe ein Meal anlegt, siehst du es hier."}</p>
        ${canEdit() ? `<button class="btn primary" data-action="new-recipe">Erstes Meal anlegen</button>` : ""}
      </div>`;
      return;
    }

    const q = recipeQuery.toLowerCase().trim();
    let pool = state.recipes;
    if (q) pool = pool.filter(r => r.name.toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q));

    // Favoriten stehen oben UND bleiben in ihrer Kategorie: wer ein Meal dort sucht, soll es
    // dort auch finden - sonst werden die Kategorien loechrig, sobald jemand viel favorisiert.
    // Der doppelte Eintrag erklaert sich durch das rote Herz. Dass zwei Karten dieselbe
    // data-rid tragen, ist unkritisch - Foto-Drop und Strg+V treffen ohnehin dasselbe Meal.
    const groups = new Map();
    const favItems = pool.filter(r => isFav(r.id));
    if (favItems.length) groups.set(FAV_KEY, favItems); // immer als erster Map-Eintrag
    CATEGORIES.forEach(c => groups.set(c, []));
    pool.forEach(r => {
      const c = groups.has(r.category) && r.category !== FAV_KEY ? r.category : "Sonstige";
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(r);
    });

    // Erste Kategorie mit Inhalt bleibt offen, alle anderen starten eingeklappt - bei vielen
    // Meals in mehreren Kategorien war "alles auf einmal offen" beim ersten Blick eine sehr
    // lange Liste. Laeuft nur bei leerer Suche, sonst schriebe die erste Suche die
    // Klapp-Vorbelegung auf dem gefilterten Bestand fest. Favoriten zaehlen hier nicht mit,
    // sonst waere die Favoriten-Gruppe die "erste Kategorie mit Inhalt" und alle echten
    // Kategorien starteten eingeklappt.
    if (!q && !collapsedCatsSeeded) {
      collapsedCatsSeeded = true;
      let firstSeen = false;
      for (const [cat, items] of groups) {
        if (cat === FAV_KEY || items.length === 0) continue;
        if (firstSeen) collapsedCats.add(cat); else firstSeen = true;
      }
    }

    let html = "";
    let anyRendered = false;
    for (const [cat, items] of groups) {
      if (items.length === 0) continue;
      anyRendered = true;
      items.sort((a, b) => a.name.localeCompare(b.name, "de"));
      const isFavGroup = cat === FAV_KEY;
      const label = isFavGroup ? "Favoriten" : cat;
      const icon = isFavGroup ? "heart" : (CAT_ICON[cat] || "pot");
      // Bei aktiver Suche zaehlt collapsedCats nicht - sonst laege ein Treffer in einer
      // eingeklappten Kategorie, die Zaehlung zeigte "1", die Karte waere unsichtbar.
      const open = !!q || !collapsedCats.has(cat);
      // Waehrend der Suche ist ohnehin alles offen - die Kopfzeile deshalb NICHT als Knopf
      // ausgeben: ein Klick wuerde zwar collapsedCats umlegen, aber sichtbar passierte
      // nichts (open bleibt true). Ein toter Klick liest sich wie ein Fehler. Ohne Caret
      // ist auch optisch klar, dass hier gerade nichts zu klappen ist.
      // favgroup als eigene Klasse: der Scroll-Ausgleich in toggle-fav braucht einen Anker,
      // der NICHT die Favoriten-Gruppe ist (die entsteht und verschwindet ja gerade). Ueber
      // data-cat ginge das nicht - bei aktiver Suche ist die Kopfzeile ein div ohne Attribut.
      html += `<section class="catgroup${isFavGroup ? " favgroup" : ""}">`;
      html += q
        ? `<div class="cathead static">
          <span class="cname">${iconSvg(icon, "cicon")}${esc(label)}</span>
          <span class="ccount">${items.length}</span>
        </div>`
        : `<button class="cathead" data-action="toggle-cat" data-cat="${esc(cat)}" aria-expanded="${open}">
          <svg class="caret${open ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <span class="cname">${iconSvg(icon, "cicon")}${esc(label)}</span>

      if (!open) { html += `</section>`; continue; }
