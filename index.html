    else { try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(okMsg || "Kopiert"); } catch (e) { toast("Kopieren hat nicht geklappt"); } }

  // ----- PDF selbst erzeugen (kein window.print, sandbox-sicher) -----
  // "×" (0327) fehlte hier - im Ausschneide-Pruefstand fuer den neuen PDF-Marken-Kopf
  // gefunden: Zutaten-Mengen wie "(×3)" in der Einkaufslisten-PDF zeigten "(?3)".
  const WINANSI = { "ä":"344","ö":"366","ü":"374","Ä":"304","Ö":"326","Ü":"334","ß":"337","·":"267","–":"226","—":"227","…":"205","é":"351","è":"350","ê":"352","á":"341","à":"340","â":"342","ç":"347","ñ":"361","€":"200","°":"260","„":"204","“":"223","”":"224","‘":"221","’":"222","×":"327" };
  function pdfEsc(str) {
    let out = "";
    for (const ch of String(str)) {
      const code = ch.codePointAt(0);
      if (ch === "\\") out += "\\\\";
      else if (ch === "(") out += "\\(";
      else if (ch === ")") out += "\\)";
      else if (code >= 32 && code < 127) out += ch;
      else if (WINANSI[ch]) out += "\\" + WINANSI[ch];
      else out += "?";
    }
    return out;
  }
  function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  // ----- Marken-Kopf fuer die PDFs (Logo, "PADDY'S MEALPLAN", Slogan) -----
  // Nur die Grossbuchstaben/Zeichen, die in der Wortmarke ("PADDY'S MEALPLAN") und im
  // Vektor-Rueckfall-Kreis ("PM") tatsaechlich vorkommen - keine vollstaendige AFM-Tabelle
  // noetig, da Slogan und Metazeilen einfarbig/linksbuendig bleiben und keine Breite brauchen.
  // Werte sind die festen Adobe-Standardbreiten von Helvetica-Bold (1000-Einheiten-Raster,
  // Teil der PDF-Basis-14-Schriften, nicht dokumentspezifisch).
  const HB_WIDTH = { " ": 278, "P": 667, "A": 722, "D": 722, "Y": 722, "’": 278, "S": 667, "M": 833, "E": 667, "L": 556, "N": 722 };
  function hbWidth(str, size) {
    let w = 0;
    for (const ch of str) w += (HB_WIDTH[ch] != null ? HB_WIDTH[ch] : 600);
    return w / 1000 * size;
  }
  // Kreis als 4 Bezier-Kurven (Standardnaeherung, k=0.5523) - rohes PDF kennt keinen
  // Kreis-Operator. f = fuellen; die Fuellfarbe muss VOR dem Aufruf per "rg" gesetzt sein.
  function pdfCirclePath(cx, cy, r) {
    const k = 0.5522847498, rk = r * k;
    return cx + r + " " + cy + " m\n"
      + (cx + r) + " " + (cy + rk) + " " + (cx + rk) + " " + (cy + r) + " " + cx + " " + (cy + r) + " c\n"
      + (cx - rk) + " " + (cy + r) + " " + (cx - r) + " " + (cy + rk) + " " + (cx - r) + " " + cy + " c\n"
      + (cx - r) + " " + (cy - rk) + " " + (cx - rk) + " " + (cy - r) + " " + cx + " " + (cy - r) + " c\n"
      + (cx + rk) + " " + (cy - r) + " " + (cx + r) + " " + (cy - rk) + " " + (cx + r) + " " + cy + " c\nh\n";
  }
  // Logo-Marke: echtes Bild-XObject (logo!=null) oder roter Vektor-Kreis mit "PM" als
  // Rueckfall (gleiches Muster wie der Platzhalter in ROADMAP.html). Path-Operatoren (m/c/f)
  // und "Do" duerfen nicht innerhalb eines BT/ET-Textblocks stehen, deshalb eigene BT/ET
  // nur um den "PM"-Text herum.
  function pdfMarkOps(cx, cy, r, logo) {
    if (logo) {
      const d = r * 2, x = cx - r, y = cy - r;
      return "q\n" + d + " 0 0 " + d + " " + x + " " + y + " cm\n/Im0 Do\nQ\n";
    }
    let ops = "0.863 0.149 0.149 rg\n" + pdfCirclePath(cx, cy, r) + "f\n";
    const fontSize = r * 0.82;
    const tx = cx - hbWidth("PM", fontSize) / 2;
    const ty = cy - fontSize * 0.36;
    ops += "1 1 1 rg BT /F2 " + fontSize.toFixed(2) + " Tf 1 0 0 1 " + tx.toFixed(2) + " " + ty.toFixed(2) + " Tm (PM) Tj ET\n0 0 0 rg\n";
    return ops;
  }
  // Voller Marken-Kopf: Logo + zweifarbige Wortmarke + Slogan + Trennlinie + Dokumenttitel +
  // Metazeile. Genutzt auf Seite 1 beider PDFs (Wochenplan hat nur eine Seite). Inhalt der
  // aufrufenden Funktion beginnt danach bei y=700.
  // Der Dokumenttitel steht bewusst auf 17pt statt der frueheren 24pt: Damals war er das
  // einzige grosse Element der Seite, jetzt fuehrt die Wortmarke darueber. Zwei konkurrierende
  // Ueberschriften in aehnlicher Groesse wuerden sich gegenseitig die Wirkung nehmen -
  // "Wochenplan"/"Einkaufsliste" ist hier die zweite Ebene, nicht die erste.
  function pdfBrandHeader(L, R, docTitle, metaLine, logo) {
    const cx = L + 17, cy = 798, wx = 100, wsize = 15;
    let cs = pdfMarkOps(cx, cy, 17, logo);
    const first = "PADDY’S ";
    cs += "BT\n0 0 0 rg /F2 " + wsize + " Tf 1 0 0 1 " + wx + " 804 Tm (" + pdfEsc(first) + ") Tj\n";
    cs += "0.863 0.149 0.149 rg 1 0 0 1 " + (wx + hbWidth(first, wsize)).toFixed(2) + " 804 Tm (" + pdfEsc("MEALPLAN") + ") Tj\n0 0 0 rg\nET\n";
    cs += "BT\n0.45 0.45 0.45 rg /F3 9.5 Tf 1 0 0 1 " + wx + " 790 Tm (" + pdfEsc("Plan it. Cook it. Lift it.") + ") Tj\n0 0 0 rg\nET\n";
    cs += "0.863 0.149 0.149 RG 1.5 w " + L + " 772 m " + R + " 772 l S\n";
    cs += "BT\n0 0 0 rg /F2 17 Tf 1 0 0 1 " + L + " 750 Tm (" + pdfEsc(docTitle) + ") Tj\n";
    cs += "0.4 0.4 0.4 rg /F1 11 Tf 1 0 0 1 " + L + " 734 Tm (" + pdfEsc(metaLine) + ") Tj\n0 0 0 rg\nET\n";
    return cs;
  }
  // Schlanker Kopf fuer Folgeseiten der Einkaufsliste: kleinere Logo-Marke (dasselbe
  // Bild-XObject, nur anders skaliert - keine zweite Einbettung), Titel + Seitenzahl,
  // duennere Trennlinie. Inhalt beginnt danach bei y=778.
  function pdfSlimHeader(L, R, pageNum, totalPages, logo) {
    let cs = pdfMarkOps(L + 11, 812, 11, logo);
    cs += "BT\n0 0 0 rg /F2 12 Tf 1 0 0 1 100 816 Tm (" + pdfEsc("Einkaufsliste") + ") Tj\n";
    cs += "0.5 0.5 0.5 rg /F1 9 Tf 1 0 0 1 100 802 Tm (" + pdfEsc("Seite " + pageNum + " von " + totalPages) + ") Tj\n0 0 0 rg\nET\n";
    cs += "0.863 0.149 0.149 RG 1 w " + L + " 792 m " + R + " 792 l S\n";
    return cs;
  }

  // ----- Echtes Logo-PNG fuer die PDFs vorbereiten (einmalig, async, gecacht) -----
  // Rohes PDF kennt nur RGB-Bilder + optionale Graustufen-/SMask fuer Transparenz, kein
  // natives RGBA. Das App-Logo (--logoL) ist ein 220x220 RGBA-PNG (per Analyse bestaetigt:
  // bitdepth 8, colortype 6, kein Interlacing). Pipeline: Base64 -> PNG-Chunks lesen ->
  // IDAT inflaten -> PNG-Filter pro Scanline rueckgaengig machen -> in RGB- und
  // Alpha-Puffer trennen -> beide einzeln wieder deflaten (klein, da grossflaechig einfarbig).
  // logoPdfAsset bleibt "undefined" bis zum ersten Versuch, "null" wenn PNG-Format/Browser
  // nicht passt (-> Vektor-Rueckfall in pdfMarkOps), sonst das fertige Objekt.
  let logoPdfAsset;
  function parsePngChunks(bytes) {
    const pos0 = 8;
    const chunks = [];
    let pos = pos0;
    while (pos < bytes.length) {
      const len = (bytes[pos] << 24 | bytes[pos + 1] << 16 | bytes[pos + 2] << 8 | bytes[pos + 3]) >>> 0;
      const type = String.fromCharCode(bytes[pos + 4], bytes[pos + 5], bytes[pos + 6], bytes[pos + 7]);
      chunks.push({ type: type, data: bytes.subarray(pos + 8, pos + 8 + len) });
      pos += 12 + len;
      if (type === "IEND") break;
    }
    return chunks;
  }
  function pngUnfilter(raw, width, height, bpp) {
    const stride = width * bpp;
    const out = new Uint8Array(height * stride);
    let rawPos = 0, outPos = 0;
    for (let y = 0; y < height; y++) {
      const filter = raw[rawPos++];
      for (let x = 0; x < stride; x++) {
        const a = x >= bpp ? out[outPos + x - bpp] : 0;
        const b = y > 0 ? out[outPos - stride + x] : 0;
        const c = (y > 0 && x >= bpp) ? out[outPos - stride + x - bpp] : 0;
        const v = raw[rawPos++];
        let recon;
        if (filter === 0) recon = v;
        else if (filter === 1) recon = v + a;
        else if (filter === 2) recon = v + b;
        else if (filter === 3) recon = v + ((a + b) >> 1);
        else { // Paeth
          const p = a + b - c, pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
          recon = v + (pa <= pb && pa <= pc ? a : (pb <= pc ? b : c));
        }
        out[outPos + x] = recon & 0xff;
      }
      outPos += stride;
    }
    return out;
  }
  function bytesToBinaryString(bytes) {
    let s = "", CHUNK = 8000;
    for (let i = 0; i < bytes.length; i += CHUNK) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    return s;
  }
  async function inflateBytes(bytes) {
    const ds = new DecompressionStream("deflate");
    const w = ds.writable.getWriter();
    w.write(bytes); w.close();
    return new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  async function deflateToBinaryString(bytes) {
    const cs = new CompressionStream("deflate");
    const w = cs.writable.getWriter();
    w.write(bytes); w.close();
    const out = new Uint8Array(await new Response(cs.readable).arrayBuffer());
    return bytesToBinaryString(out);
  }
  async function prepareLogoForPdf() {
    if (logoPdfAsset !== undefined) return logoPdfAsset;
    try {
      if (!("CompressionStream" in window) || !("DecompressionStream" in window)) { logoPdfAsset = null; return null; }
      const raw = getComputedStyle(document.documentElement).getPropertyValue("--logoL").trim();
      const m = raw.match(/^url\(data:image\/png;base64,([^)]+)\)$/);
      if (!m) { logoPdfAsset = null; return null; }
      const bin = atob(m[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (!(bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47)) { logoPdfAsset = null; return null; }
      const chunks = parsePngChunks(bytes);
      const ihdr = chunks.find(c => c.type === "IHDR");
      if (!ihdr) { logoPdfAsset = null; return null; }
      const d = ihdr.data;
      const width = (d[0] << 24 | d[1] << 16 | d[2] << 8 | d[3]) >>> 0;
      const height = (d[4] << 24 | d[5] << 16 | d[6] << 8 | d[7]) >>> 0;
      const bitDepth = d[8], colorType = d[9], interlace = d[12];
      if (bitDepth !== 8 || colorType !== 6 || interlace !== 0) { logoPdfAsset = null; return null; }
      const idatChunks = chunks.filter(c => c.type === "IDAT");
      let idatLen = 0; idatChunks.forEach(c => idatLen += c.data.length);
      const idat = new Uint8Array(idatLen);
      let off = 0; idatChunks.forEach(c => { idat.set(c.data, off); off += c.data.length; });
      const rawScan = await inflateBytes(idat);
      const px = pngUnfilter(rawScan, width, height, 4);
      const n = width * height;
      const rgb = new Uint8Array(n * 3), alpha = new Uint8Array(n);
      for (let i = 0; i < n; i++) {
        rgb[i * 3] = px[i * 4]; rgb[i * 3 + 1] = px[i * 4 + 1]; rgb[i * 3 + 2] = px[i * 4 + 2];
        alpha[i] = px[i * 4 + 3];
      }
      const rgbStream = await deflateToBinaryString(rgb);
      const alphaStream = await deflateToBinaryString(alpha);
      logoPdfAsset = { w: width, h: height, rgbStream: rgbStream, rgbLen: rgbStream.length, alphaStream: alphaStream, alphaLen: alphaStream.length };
    } catch (e) { logoPdfAsset = null; }
    return logoPdfAsset;
  }

  function planPdfString() {
    const L = 56, R = 539;
    const dateStr = new Date().toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
    const name = profile ? profile.name : "";
    const logo = logoPdfAsset;
    let cs = pdfBrandHeader(L, R, "Wochenplan", (name ? name + "   ·   " : "") + dateStr, logo);
    cs += "BT\n";
    let y = 700;
    DAYS.forEach(d => {
      cs += "0 0 0 rg /F2 13 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc(d.label) + ") Tj\n";
      MEALS.forEach((m, i) => {
        const names = state.plan[d.key][m.key].map(rid => { const r = getRecipe(rid); return r ? r.name : null; }).filter(Boolean);
        const yy = y - 17 - i * 15;
        cs += "/F1 11 Tf 1 0 0 1 74 " + yy + " Tm (" + pdfEsc(m.label + ":") + ") Tj\n";
        cs += (names.length ? "0 0 0" : "0.66 0.66 0.66") + " rg /F1 11 Tf 1 0 0 1 172 " + yy + " Tm (" + pdfEsc(names.length ? trunc(names.join(", "), 52) : "–") + ") Tj\n0 0 0 rg\n";
      });
      y -= 74;
    });
    cs += "0.6 0.6 0.6 rg /F1 9 Tf 1 0 0 1 " + L + " 44 Tm (" + pdfEsc("Erstellt mit Paddy’s Mealplan") + ") Tj\nET\n";

    const objs = [];
    objs.push("<< /Type /Catalog /Pages 2 0 R >>");
    objs.push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    const xobjRes = logo ? " /XObject << /Im0 8 0 R >>" : "";
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R /F3 7 0 R >>" + xobjRes + " >> /Contents 4 0 R >>");
    objs.push("<< /Length " + cs.length + " >>\nstream\n" + cs + "endstream");
    objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>");
    if (logo) {
      objs.push("<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /SMask 9 0 R /Length " + logo.rgbLen + " >>\nstream\n" + logo.rgbStream + "\nendstream");
      objs.push("<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length " + logo.alphaLen + " >>\nstream\n" + logo.alphaStream + "\nendstream");
    }
    let pdf = "%PDF-1.4\n";
    const offsets = [];
    objs.forEach((o, i) => { offsets.push(pdf.length); pdf += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
    const xref = pdf.length;
    pdf += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
    offsets.forEach(off => { pdf += String(off).padStart(10, "0") + " 00000 n \n"; });
    pdf += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    return pdf;
  }
  // PDF-String -> Bytes. Ein JS-Zeichen ist hier genau ein Byte (siehe pdfEsc/Bild-Streams).
  function pdfBytes(pdf) {
    const bytes = new Uint8Array(pdf.length);
    for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
    return bytes;
  }
  function saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function planPdfName() {
    const who = (profile ? profile.name : "plan").replace(/[^\wäöüßÄÖÜ-]+/g, "_");
    return "wochenplan-" + who + ".pdf";

  // ----- Teilen ueber den nativen Dialog des Geraets (Web Share API) -----
  // Auf dem Handy der kuerzeste Weg: ein Tippen, dann waehlt der Nutzer WhatsApp, Signal,
  // Mail o. Ä. - kein Umweg ueber Zwischenablage oder mailto (das bei vollen Wochenplaenen
  // ohnehin an der ~2000-Zeichen-Grenze von Windows/Outlook scheitert).
  // canShareFiles() ist bewusst strenger als "navigator.share existiert": Desktop-Chrome
  // kennt share(), kann aber je nach System keine Dateien - dann lieber Text teilen als
  // einen Knopf anzubieten, der wirft.
  function canShare() { return typeof navigator !== "undefined" && typeof navigator.share === "function"; }
  function canShareFiles(files) {
    try { return canShare() && typeof navigator.canShare === "function" && navigator.canShare({ files: files }); }
    catch (e) { return false; }
  }
  // Teilt eine Datei, faellt auf Text zurueck, wenn das Geraet keine Dateien teilen kann.
  // Rueckgabe: true = geteilt, false = Nutzer hat abgebrochen oder es ging nicht.
  async function shareFileOrText(bytes, filename, title, fallbackText) {
    let file = null;
    try { file = new File([bytes], filename, { type: "application/pdf" }); } catch (e) { file = null; }
    try {
      if (file && canShareFiles([file])) { await navigator.share({ files: [file], title: title }); return true; }
      if (canShare()) { await navigator.share({ title: title, text: fallbackText }); return true; }
    } catch (e) {
      // AbortError = Nutzer hat den Dialog weggewischt. Das ist kein Fehler, nur ein Nein.
      if (e && e.name === "AbortError") return false;
      throw e;
    }
    return false;
  }
  async function sharePlanPdf() {
    try {
      await prepareLogoForPdf();
      const ok = await shareFileOrText(pdfBytes(planPdfString()), planPdfName(), emailSubject(), emailBody());
      if (ok) toast("Wochenplan geteilt");
    } catch (e) { toast("Teilen hat nicht geklappt"); }
  }

  // ----- Einkaufsliste als PDF (Paket B3) -----
  // Anders als der Wochenplan (immer 7 Tage, eine feste Seite) ist die Einkaufsliste beliebig
  // lang - deshalb mehrseitig statt der festen Ein-Seiten-Struktur von planPdfString(). Baut
  // je Seite einen eigenen Content-Stream und haengt sie am Ende zu einem gemeinsamen PDF
  // zusammen, gleiche Bausteine (pdfEsc/trunc/WinAnsi-Fonts) wie beim Wochenplan-PDF.
  // Reine Layout-Planung ohne Kopf-Text (planShopPages): verteilt Gruppen/Zutaten auf
  // Seiten, renderShopPage baut daraus die eigentlichen Content-Streams. Getrennt vom
  // Rendern, weil die Gesamtseitenzahl (fuer "Seite X von Y" im Kopf jeder Seite) erst nach
  // dem vollstaendigen Layout feststeht. Seite 1 hat wegen des vollen Marken-Kopfs weniger
  // Content-Hoehe als die Folgeseiten mit schlankem Kopf - deshalb die zwei TOP-Werte.
  function planShopPages(items, groups) {
    const TOP_FIRST = 700, TOP_CONT = 778, BOTTOM = 60;
    const pages = [];
    let page = [], y = TOP_FIRST;
    function newPage() { pages.push(page); page = []; y = TOP_CONT; }
    function ensureSpace(need) { if (y - need < BOTTOM) newPage(); }
    if (!items.length) {
      page.push({ kind: "empty" });
      y -= 20;
    } else {
      groups.forEach(g => {
        ensureSpace(20 + 16); // Gruppenkopf + mindestens eine Zeile zusammenhalten
        page.push({ kind: "group", title: g.cat.title });
        y -= 20;
        g.items.forEach(it => {
          ensureSpace(16);
          page.push({ kind: "item", label: it.label + (it.count > 1 ? " (×" + it.count + ")" : "") });
          y -= 16;
        });
        page.push({ kind: "gap", amount: 8 });
        y -= 8;
      });
    }
    ensureSpace(20);
    page.push({ kind: "footer" });
    pages.push(page);
    return pages;
  }
  // Rendert eine geplante Seite zu einem Content-Stream. Seite 1 bekommt den vollen
  // Marken-Kopf, jede weitere den schlanken Kopf mit Seitenzahl.
  function renderShopPage(entries, pageNum, totalPages, scope, dateStr, logo) {
    const L = 56, R = 539;
    let cs = pageNum === 1
      ? pdfBrandHeader(L, R, "Einkaufsliste", scope + "   ·   " + dateStr, logo)
      : pdfSlimHeader(L, R, pageNum, totalPages, logo);
    cs += "BT\n";
    let y = pageNum === 1 ? 700 : 778;
    entries.forEach(entry => {
      if (entry.kind === "empty") {
        cs += "0.5 0.5 0.5 rg /F1 12 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc("Noch keine Zutaten geplant.") + ") Tj\n0 0 0 rg\n";
        y -= 20;
      } else if (entry.kind === "group") {
        cs += "0 0 0 rg /F2 13 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc(entry.title) + ") Tj\n";
        y -= 20;
      } else if (entry.kind === "item") {
        cs += "0 0 0 rg /F1 11 Tf 1 0 0 1 " + (L + 18) + " " + y + " Tm (" + pdfEsc(trunc(entry.label, 58)) + ") Tj\n";
        y -= 16;
      } else if (entry.kind === "gap") {
        y -= entry.amount;
      } else if (entry.kind === "footer") {
        cs += "0.6 0.6 0.6 rg /F1 9 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc("Erstellt mit Paddy’s Mealplan") + ") Tj\n0 0 0 rg\n";
      }
    });
    cs += "ET\n";
    return cs;
  }
  function shopPdfString() {
    const { items, groups } = buildShoppingList();
    const dateStr = new Date().toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
    const scope = state.viewWeek === "next" ? "Nächste Woche" : "Diese Woche";
    const logo = logoPdfAsset;
    const planned = planShopPages(items, groups);
    const n = planned.length;
    const pages = planned.map((p, i) => renderShopPage(p, i + 1, n, scope, dateStr, logo));

    const fontsStart = 3 + 2 * n; // Objekt-ID der ersten Schriftart, nach Catalog+Pages+je Seite (Page+Content)
    const imageId = fontsStart + 3, smaskId = fontsStart + 4;
    const objs = [];
    objs[0] = "<< /Type /Catalog /Pages 2 0 R >>";
    const kids = [];
    for (let i = 0; i < n; i++) kids.push((3 + 2 * i) + " 0 R");
    objs[1] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>";
    const fontRes = "/F1 " + fontsStart + " 0 R /F2 " + (fontsStart + 1) + " 0 R /F3 " + (fontsStart + 2) + " 0 R";
    const xobjRes = logo ? " /XObject << /Im0 " + imageId + " 0 R >>" : "";
    for (let i = 0; i < n; i++) {
      const pageId = 3 + 2 * i, contentId = 4 + 2 * i;
      objs[pageId - 1] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << " + fontRes + " >>" + xobjRes + " >> /Contents " + contentId + " 0 R >>";
      objs[contentId - 1] = "<< /Length " + pages[i].length + " >>\nstream\n" + pages[i] + "endstream";
    }
    objs[fontsStart - 1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    objs[fontsStart] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
    objs[fontsStart + 1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>";
    if (logo) {
      objs[imageId - 1] = "<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /SMask " + smaskId + " 0 R /Length " + logo.rgbLen + " >>\nstream\n" + logo.rgbStream + "\nendstream";
      objs[smaskId - 1] = "<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length " + logo.alphaLen + " >>\nstream\n" + logo.alphaStream + "\nendstream";
    }
    let pdf = "%PDF-1.4\n";
    const offsets = [];
    objs.forEach((o, i) => { offsets.push(pdf.length); pdf += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
    const xref = pdf.length;
    pdf += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
    offsets.forEach(off => { pdf += String(off).padStart(10, "0") + " 00000 n \n"; });
    pdf += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    return pdf;
  }

  function emailSubject() { return "Mein Wochenplan" + (profile ? " von " + profile.name : ""); }
  function emailBody() { return "Hallo,\n\nhier ist mein Wochenplan:\n\n" + planText() + "\n\n(Die PDF hänge ich an.)\n\nViele Grüße" + (profile ? "\n" + profile.name : ""); }
  function emailText(to) { return (to ? "An: " + to + "\n" : "") + "Betreff: " + emailSubject() + "\n\n" + emailBody(); }
  // Windows/Outlook nehmen eine mailto-URL nur bis ~2048 Zeichen an; darueber oeffnet das
  // Mail-Programm gar nicht oder schneidet den Text still ab. Ein voller Wochenplan mit
  // mehreren Meals je Slot kommt gemessen auf ~2600 Zeichen. Statt es darauf ankommen zu
  // lassen, kuerzen wir den Body dann selbst auf einen Verweis auf die PDF - lieber eine
  // kurze Mail, die aufgeht, als eine lange, die abbricht.
  const MAILTO_MAX = 1800;
  function buildMailto(to) {
    const base = "mailto:" + (to || "") + "?subject=" + encodeURIComponent(emailSubject()) + "&body=";
    const full = base + encodeURIComponent(emailBody());
    if (full.length <= MAILTO_MAX) return full;
    const short = "Hallo,\n\nmeinen Wochenplan hänge ich als PDF an.\n\nViele Grüße" + (profile ? "\n" + profile.name : "");
    return base + encodeURIComponent(short);
  }
  window.addEventListener("beforeprint", () => { const pa = document.getElementById("print-area"); if (pa) pa.innerHTML = buildPrintable(); });

        }
        const mailCopy = segBody.querySelector("#mail-copy");
        if (mailCopy) mailCopy.addEventListener("click", () => copyToClipboard(emailText(mailTo.value.trim()), "E-Mail-Text kopiert"));
      }
    }
    segBtns.forEach(b => b.addEventListener("click", () => { mode = b.dataset.seg; paint(); }));
    paint();
    openModal(node);
  }

  function openShareRecipe(recipeId) {
    const r = getRecipe(recipeId);
    if (!r) return;
    let createdUrl = null;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Meal teilen">
      <div class="modal-head"><div style="flex:1"><div class="kicker">Meal teilen</div><h3 style="margin-top:2px">${esc(r.name)} teilen</h3></div><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body"><div id="sr-body"></div></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const body = node.querySelector("#sr-body");
    function paint() {
      const cloudOk = window.CloudShare && window.CloudShare.enabled;
      if (!cloudOk) {
        body.innerHTML = `<p class="share-hint">Du brauchst ein <b>Cloud-Konto</b> zum Teilen.</p>`;
      } else if (createdUrl) {
        body.innerHTML = `
          <p class="share-hint">Fertig! Wer den Link öffnet, übernimmt dieses Meal als <b>Kopie</b>.</p>
          <span class="share-sub">Dein Teilen-Link</span>
          <div class="link-row">
            <input type="text" class="share-link" id="sl" readonly value="${esc(createdUrl)}">
            <button class="btn primary" id="sl-copy">Link kopieren</button>
          </div>
          <p class="share-mini">Der Empfänger meldet sich einmal kostenlos an und kann das Meal dann übernehmen.</p>
          <div class="share-actions"><button class="btn" id="sl-new">Neuen Link erstellen</button></div>`;
        body.querySelector("#sl-copy").addEventListener("click", () => { body.querySelector("#sl").select(); copyToClipboard(createdUrl, "Link kopiert"); });
        body.querySelector("#sl-new").addEventListener("click", () => { createdUrl = null; paint(); });
      } else {
        body.innerHTML = `
          <p class="share-hint">Der Link erstellt eine <b>Kopie</b> dieses Meals.</p>
          <button class="btn primary" id="mk-link" style="width:100%;justify-content:center">Meal-Link erstellen</button>
          <p class="share-mini" id="mk-note"></p>`;
        const btn = body.querySelector("#mk-link");
        const note = body.querySelector("#mk-note");
        btn.addEventListener("click", () => {
          const payload = shareMealPayload(recipeId);
          if (!payload) { note.className = "share-mini warn"; note.textContent = "Meal nicht gefunden."; return; }
          if (JSON.stringify(payload).length > 400000) { note.className = "share-mini warn"; note.textContent = "Das Foto dieses Meals ist zu groß zum Teilen."; return; }
          btn.disabled = true; btn.textContent = "Erstelle Link …"; note.className = "share-mini"; note.textContent = "";
          const id = shareId();
          window.CloudShare.publish(id, payload).then(() => {
            if (!(state.shares || []).includes(id)) { state.shares = (state.shares || []).concat(id); save(); }
            createdUrl = location.origin + location.pathname + "?s=" + id; paint();
          }).catch(() => { btn.disabled = false; btn.textContent = "Meal-Link erstellen"; note.className = "share-mini warn"; note.textContent = "Link konnte nicht erstellt werden. Bist du online und angemeldet?"; });
        });
      }
    }
    paint();
    openModal(node);
  }

  function applySharedData(data, takePlan) {
    if (!data || !Array.isArray(data.recipes)) { toast("Geteilter Plan konnte nicht gelesen werden"); return; }
    // Ein geteilter Plan wuerde hier in die GEMEINSAME Sammlung geschrieben - dafuer fehlen
    // einem Nur-Ansehen-Mitglied die Rechte, und der Vorgang liefe still ins Leere.
    if (blockedByRole()) { closeModal(); return; }
    const idMap = {};
    let added = 0;
    data.recipes.forEach(ir => {
      if (!ir || !ir.name) return;
      const existing = state.recipes.find(r => r.name.trim().toLowerCase() === ir.name.trim().toLowerCase());
      if (existing) { idMap[ir.id] = existing.id; return; }
      const nid = uid();
      idMap[ir.id] = nid;
      // image bewusst durch safeImage(): der Snapshot stammt von einer fremden Person,
      // und nur hier kaeme ein manipulierter Wert ungeprueft in den eigenen Bestand.
      state.recipes.push({ id: nid, name: ir.name, category: migrateCat(ir.category || "Gericht"), nutrition: (ir.nutrition && typeof ir.nutrition === "object") ? ir.nutrition : null, ingredients: Array.isArray(ir.ingredients) ? ir.ingredients.map(sanitizeIng).filter(Boolean) : [], steps: ir.steps || "", image: safeImage(ir.image) });
      added++;
    });
    if (takePlan && data.plan) {
      const np = makeEmptyPlan();
      DAYS.forEach(d => MEALS.forEach(m => {
        const raw = data.plan[d.key] && data.plan[d.key][m.key];
        np[d.key][m.key] = asIdList(raw).map(v => idMap[v]).filter(Boolean);
      }));
      state.plans[activeWeekKey()] = np;   // in die gerade angezeigte Woche importieren
      state.plan = np;
    }
    save(); closeModal();
    state.tab = "plan"; render();
    toast("Importiert" + (data.by ? " von " + data.by : "") + ": " + added + " neue Meal" + (added === 1 ? "" : "s"));
  }

  // ---------- Boot ----------
  boot();
})();
</script>
<script>
  /* Service Worker registrieren — rein additiv: die App muss ohne ihn voll funktionieren
     (Graceful Fallback, wie beim blockierten Firebase-CDN). Relativer Pfad + Scope, weil die
     Seite unter .../mealplan/ liegt, nicht auf dem Domain-Root. Erst nach 'load', um den
     ersten Paint/Boot nicht zu verzoegern. Fehler still schlucken. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
    });
  }
</script>
</html>
