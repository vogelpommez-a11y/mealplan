      // Oben deklariert, weil cleanup() sie referenziert - eine const weiter unten laege
      // in der zeitlichen Totzone, sobald irgendein Pfad frueher aufraeumt.
      let backClose = null;
      const node = el(`<div class="scanwrap" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="scanbox">
          <div class="scanhead">
            <h3>${esc(title)}</h3>
            <button type="button" class="btn ghost sm" data-x aria-label="Scanner schließen">✕</button>
          </div>
          <div class="scanvid"><video playsinline muted autoplay></video><div class="scanframe"></div></div>
          <p class="scanhint" role="status">Kamera wird gestartet …</p>
          ${showPhoto ? `<div class="scanfoot">
            <button type="button" class="btn ghost" data-photo>Stattdessen Foto aufnehmen</button>
          </div>` : ""}
        </div>
      </div>`);
      const video = node.querySelector("video");
      const hint = node.querySelector(".scanhint");
      const stage = node.querySelector(".scanvid");

      function cleanup() {
        if (timer) { clearTimeout(timer); timer = 0; }
        if (reader) { try { reader.reset(); } catch (e) { noteError("scan:readerReset", e); } reader = null; }
        // Eigene Stream-Referenz, weil ZXings stopStreams() nur die Video-Tracks beendet
        if (stream) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) { noteError("scan:trackStop", e); } }); stream = null; }
        try { video.pause(); video.srcObject = null; } catch (e) { noteError("scan:videoRelease", e); }
        document.removeEventListener("keydown", onKey, true);
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("pagehide", onHide);
        window.removeEventListener("resize", onResize);
        if (orientTimer) { clearTimeout(orientTimer); orientTimer = 0; }
        if (node.parentNode) node.remove();
        liveScanStop = null;
        // Zweite Ebene der Zurueck-Taste: Der Scanner liegt UEBER dem Meal-Formular, das
        // offen bleibt (z-index 80 gegen 60). Ein Zurueck schliesst deshalb erst den Sucher
        // und laesst das Formular stehen - genau die Erwartung auf Android.
        if (backClose) overlayClosed(backClose);
      }
      // ---- Kamerabild: Buehnenformat und Fokus ----
      // Hochkant lieferte die Kamera weiter 4:3 quer, waehrend die Buehne per Breakpoint auf
      // 3:4 stand - object-fit: cover schnitt den Barcode links und rechts ab, scannen ging
      // nur quer. Deshalb richtet sich die Buehne nach dem TATSAECHLICHEN Stream und nicht
      // nach der Bildschirmbreite.
      let orientTimer = 0;
      function portrait() { return window.innerHeight >= window.innerWidth; }
      function videoTrack() {
        const t = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
        return t && t.readyState !== "ended" ? t : null;
      }
      const box = node.querySelector(".scanbox");
      function syncStage() {
        const t = videoTrack();
        const s = t && t.getSettings ? t.getSettings() : null;
        // Notfalls die Masse des Videoelements: Safari liefert getSettings() nicht immer gefuellt.
        const w = (s && s.width) || video.videoWidth, h = (s && s.height) || video.videoHeight;
        if (w > 0 && h > 0) stage.style.setProperty("--scan-ar", String(w / h));
        // Freie Hoehe fuer die Buehne messen statt schaetzen: alles abziehen, was der Kasten
        // sonst braucht (Kopfzeile, Hinweis, Foto-Ausweg, Abstaende) plus das Innenpolster der
        // Ebene. clientHeight der Ebene, nicht window.innerHeight - im Pruefstand-Rahmen nehmen
        // klassische Scrollleisten Platz weg (siehe docs/TESTING.md).
        let rest = 0;
        Array.prototype.forEach.call(box.children, c => {
          if (c !== stage) rest += c.getBoundingClientRect().height;
        });
        const cs = getComputedStyle(box);
        const gap = parseFloat(cs.rowGap) || 0;
        const frei = node.clientHeight - 32 - rest - gap * (box.children.length - 1);
        // Untergrenze, damit ein Messfehler die Buehne nie verschwinden laesst.
        stage.style.setProperty("--scan-h", Math.max(180, Math.round(frei)) + "px");
      }
      // Ohne das bleibt die Kamera auf dem Fixfokus, den der Browser vorgibt: je naeher man
      // an den Barcode geht, desto unschaerfer. focusMode kennt derzeit nur Chromium
      // (Android) - Safari/iOS ignoriert es. Deshalb immer nur "versuchen", nie darauf warten
      // und niemals einen Fehler daraus machen (siehe docs/TROUBLESHOOTING.md).
      function focusModes() {
        const t = videoTrack();
        if (!t || !t.applyConstraints || !t.getCapabilities) return [];
        try { return t.getCapabilities().focusMode || []; } catch (e) { return []; }
      }
      function applyFocus(mode) {
        const t = videoTrack();
        if (!t || focusModes().indexOf(mode) < 0) return false;
        try { t.applyConstraints({ advanced: [{ focusMode: mode }] }).catch((e) => noteError("scan:focusMode", e)); } catch (e) { noteError("scan:focusMode", e); return false; }
        return true;
      }
      function onResize() {
        if (orientTimer) clearTimeout(orientTimer);
        // Entprellt: Drehen feuert resize mehrfach, und die neuen Masse stehen erst danach fest.
        orientTimer = setTimeout(() => {
          orientTimer = 0;
          if (done) return;
          const t = videoTrack();
          const s = t && t.getSettings ? t.getSettings() : null;
          // Nur nachfordern, wenn das Bild jetzt quer zur Haltung liegt. Ein applyConstraints
          // ohne Not kann den Track kurz neu aushandeln - das laesst das Bild sichtbar zucken.
          if (t && s && s.width > 0 && s.height > 0 && (s.width > s.height) === portrait()) {
            try {
              t.applyConstraints({ advanced: [{ aspectRatio: portrait() ? 3 / 4 : 4 / 3 }] })
                .then(syncStage).catch((e) => noteError("scan:applyConstraints", e));
            } catch (e) { noteError("scan:applyConstraints", e); }
          }
          syncStage();
        }, 220);
      }
      function finish(res) { if (done) return; done = true; cleanup(); resolve(res); }
      // Escape darf NUR den Scanner schliessen. Ohne capture + stopPropagation wuerde
      // modalKeys() darunter greifen und das Meal-Formular samt Eingaben mitschliessen.
      function onKey(e) {
        if (e.key !== "Escape") return;
        e.preventDefault(); e.stopPropagation();
        finish({ cancelled: true });
      }
      function onHide(e) { if (e.type === "pagehide" || document.hidden) finish({ cancelled: true }); }
      function fail(msg) {
        if (done) return;
        hint.textContent = msg;
        hint.classList.add("err");
        hint.setAttribute("role", "alert"); // Fehler muss auch vorgelesen werden
      }

      node.querySelector("[data-x]").addEventListener("click", () => finish({ cancelled: true }));
      const photoBtn = node.querySelector("[data-photo]");
      if (photoBtn) photoBtn.addEventListener("click", () => finish({ photo: true }));
      document.body.appendChild(node);
      // Eine Referenz fuer beide Wege: liveScanStop (closeModal raeumt den Sucher mit ab) und
      // der History-Stapel muessen dieselbe Funktion sehen, sonst findet overlayClosed() sie
      // spaeter nicht wieder.
      backClose = () => finish({ cancelled: true });
      liveScanStop = backClose;
      overlayOpened(backClose);
      document.addEventListener("keydown", onKey, true);
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", onHide);
      node.querySelector("[data-x]").focus();

      (async () => {
        // getUserMedia gibt es nur im sicheren Kontext: HTTPS oder localhost. Ueber eine
        // http://-Adresse im WLAN (Handy-Test gegen den PC) blockiert der Browser die Kamera.
        const photoHint = showPhoto ? " Nimm stattdessen ein Foto auf." : "";
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fail("Die Kamera braucht eine sichere Verbindung (HTTPS)." + photoHint);
          return;
        }
        try {
          // aspectRatio folgt der Haltung des Geraets, damit die Kamera hochkant auch ein
          // hochkantes Bild liefert. Alles "ideal": eine harte Forderung wuerde auf Kameras
          // ohne dieses Format mit OverconstrainedError abbrechen, obwohl ein anderes Format
          // voellig ausreicht - die Buehne richtet sich ohnehin nach dem, was ankommt.
          // 1920 statt 1280: mehr Pixel je Barcode-Strich, damit ein Code auch aus etwas
          // mehr Abstand noch lesbar ist - der Ausweg dort, wo sich der Fokus nicht steuern
          // laesst (iOS, siehe applyFocus).
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1920 }, height: { ideal: 1080 },
              aspectRatio: { ideal: portrait() ? 3 / 4 : 4 / 3 },
            },
            audio: false
          });
        } catch (e) {
          const n = e && e.name;
          fail(n === "NotAllowedError" || n === "SecurityError"
              ? "Kamerazugriff wurde abgelehnt. Erlaube ihn in den Browser-Einstellungen." + photoHint
            : n === "NotFoundError" || n === "OverconstrainedError"
              ? "Keine passende Kamera gefunden." + photoHint
              : "Die Kamera lässt sich nicht starten." + photoHint);
          return;
        }
        // Abbruch waehrend der Berechtigungsabfrage: cleanup lief mit stream===null,
        // die Kamera wuerde sonst unbemerkt weiterlaufen.
        if (done) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) { noteError("scan:trackStop", e); } }); stream = null; return; }

        video.srcObject = stream;
        // play() bewusst NICHT abwarten: das Promise loest auf manchen Geraeten nie auf,
        // dann haenge der Scanner dauerhaft in "Kamera wird gestartet". Die Erkennung
        // vertraegt ein noch nicht bereites Video — sie versucht es im naechsten
        // Durchlauf einfach erneut. (playsinline + muted decken die Autoplay-Regeln ab.)
        const playing = video.play();
        if (playing && playing.catch) playing.catch((e) => noteError("scan:videoPlay", e));
        if (done) return;
        hint.textContent = readyHint;

        // Buehne aufs echte Bildformat ziehen - jetzt und sobald die Masse wirklich stehen
        // (getSettings() ist direkt nach dem Start nicht auf jedem Geraet schon gefuellt).
        syncStage();
        video.addEventListener("loadedmetadata", syncStage, { once: true });
        window.addEventListener("resize", onResize);
        applyFocus("continuous");
        // Antippen stellt neu scharf: der Rettungsanker auf Geraeten, die einmal falsch
        // scharfstellen und dort haengen bleiben. Nur wenn der Fokus ueberhaupt steuerbar ist -
        // sonst verspraeche der Hinweistext etwas, das nicht passiert.
        if (focusModes().length) {
          stage.style.cursor = "pointer";
          hint.textContent = readyHint + " Antippen stellt scharf.";
          syncStage();   // der laengere Hinweis kann umbrechen und nimmt der Buehne dann Hoehe
          stage.addEventListener("click", () => {
            if (done) return;
            if (!applyFocus("single-shot")) applyFocus("continuous");
            hint.textContent = "Stelle scharf …";
            setTimeout(() => { if (!done && !hint.classList.contains("err")) hint.textContent = readyHint; }, 900);
          });
        }

        // Schneller Weg: native API (Chrome/Edge, Android). Auf dem iPhone gibt es sie
        // nicht — auch nicht in Chrome, das dort WebKit nutzt. Dann uebernimmt ZXing.
        if (window.BarcodeDetector) {
          try {
            const det = new window.BarcodeDetector({ formats: formats });
            const tick = async () => {
              if (done) return;
              try {
                const hits = await det.detect(video);
                if (done) return;
                if (hits && hits[0] && hits[0].rawValue) { finish({ code: hits[0].rawValue }); return; }
              } catch (e) { /* einzelner Frame unlesbar — einfach weiter */ }
              timer = setTimeout(tick, 160); // ~6 Versuche/s reichen und schonen den Akku
            };
            tick();
            return;
          } catch (e) { /* Formate nicht unterstuetzt — faellt auf ZXing durch */ }
        }
        try { await loadZXing(); }
        catch (e) { fail("Der Scanner konnte nicht geladen werden (offline?)." + photoHint); return; }
        if (done) return;
        reader = new window.ZXing.BrowserMultiFormatReader();
        // Callback feuert pro Frame; ohne Treffer kommt eine NotFoundException, die hier
        // bewusst ignoriert wird — nur ein echtes Ergebnis beendet den Scan.
        reader.decodeFromStream(stream, video, res => {
          if (done || !res || !res.getText) return;
          finish({ code: res.getText() });
        });
      })();
    });
  }

  // Ruhetag-Ziel aus dem Kalorienrechner (state.goal), hochgerechnet auf `days` Tage.
  // Null, solange der Nutzer noch kein Ergebnis gespeichert hat.
  // Das gespeicherte Ziel ist der RUHETAG-Wert: Alltagsbedarf (BMR × PAL) plus Ziel-
  // Anpassung, ohne Training. An Trainingstagen kommt der Verbrauch der Einheit obendrauf
  // (siehe trainTargets) — deshalb ist der Ruhetag der niedrigste Tag der Woche.
  function goalTargets(days) {
    const g = state.goal;
    if (!g || !nutNum(g.kcal)) return null;
    const n = days || 1;
    return { kcal: nutNum(g.kcal) * n, carbs: nutNum(g.carbs) * n, protein: nutNum(g.protein) * n, fat: nutNum(g.fat) * n };
  }

  // ---------- Trainingstage (Verbrauch je Einheit) ----------
  //
  // Der Trainingsplan haengt an state.goal.training — ein Objekt { mon: {level, min} } —
  // und wird mit dem Ziel zusammen gespeichert und synchronisiert. Bewusst NICHT pro
  // Kalenderwoche: die App haelt ohnehin nur die aktuelle und die naechste Woche vor
  // (pruneWeeks), aeltere verfallen beim Laden. Ein einziger Plan erfuellt „gilt fuer
  // aktuelle + naechste Woche" damit von selbst — und rueckt beim Wochenwechsel
  // automatisch mit, weil der Wochenschluessel wandert, der Plan aber bleibt.
  //
  // Rechenweg je Trainingstag:
  //   kcal   = Ruhetag-kcal + (netto-MET × Gewicht × Stunden)
  //   Eiweiss und Fett bleiben in GRAMM gleich wie am Ruhetag
  //   die gesamte Zusatzenergie geht in die Kohlenhydrate
  // Letzteres ist Absicht und nicht bloss die einfachste Loesung: Kohlenhydrate fuellen
  // die Glykogenspeicher, die die Einheit gerade geleert hat. Eiweiss am Trainingstag
  // zusaetzlich zu erhoehen braeuchte es nicht — der Bedarf richtet sich nach Koerper-
  // gewicht, nicht nach Tagesform.
  function goalTraining() {
    const g = state.goal;
    return (g && g.training && typeof g.training === "object") ? g.training : {};
  }
  function isTrainingDay(dayKey) { return !!goalTraining()[dayKey]; }

  // Zusatzverbrauch eines Tages in kcal (0 am Ruhetag). Braucht das Koerpergewicht aus
  // dem Ziel — fehlt es (Alt-Daten), gibt es keinen Aufschlag statt eines Fantasiewerts.
  function dayTrainKcal(dayKey) {
    const g = state.goal;
    const e = goalTraining()[dayKey];
    if (!g || !e || !nutNum(g.weight)) return 0;
    return trainKcal(e.level, e.min, nutNum(g.weight));
  }
  // Reine Rechnung auf dem Ruhetag-Wert. Getrennt gehalten, damit der Rechner die
  // Trainingstag-Werte schon in der Vorschau zeigen kann — dort gibt es noch kein
  // gespeichertes state.goal, und zwei getrennte Formeln wuerden auseinanderlaufen.
  function trainFromRest(rest, extraKcal) {
    const add = Math.max(0, Math.round(extraKcal || 0));
    return { kcal: rest.kcal + add, carbs: rest.carbs + Math.round(add / 4),
             protein: rest.protein, fat: rest.fat };
  }
  // Das Ziel EINES Tages, je nach Tagestyp.
  function goalTargetsForDay(dayKey) {
    const rest = goalTargets(1);
    if (!rest) return null;
    if (!isTrainingDay(dayKey)) return rest;
    return trainFromRest(rest, dayTrainKcal(dayKey));
  }
  // Summe der Ziele mehrerer Tage. Ersetzt goalTargets(n) ueberall dort, wo ueber Tage
  // aggregiert wird: die Tage unterscheiden sich jetzt in kcal UND Kohlenhydraten, ein
  // „Tagesziel x 7" waere schlicht falsch.
  function goalTargetsForDays(dayKeys) {
    if (!goalTargets(1)) return null;
    return (dayKeys || []).reduce((a, k) => {
      const t = goalTargetsForDay(k);
      return { kcal: a.kcal + t.kcal, carbs: a.carbs + t.carbs, protein: a.protein + t.protein, fat: a.fat + t.fat };
    }, { kcal: 0, carbs: 0, protein: 0, fat: 0 });
  }

  // Markierung fuer die Tages-Kopfzeile. Farbe allein traegt die Information nicht
  // (Rot und Blau liegen bei 1,07:1) — deshalb immer Icon UND Wort.
  function trainBadgeHtml(dayKey) {
    const e = goalTraining()[dayKey];
    if (!e) return "";
    const lv = trainLevel(e.level);
    const add = dayTrainKcal(dayKey);
    const title = `Trainingstag: ${lv.label}, ${e.min} Min.${add ? ` · +${nfmt(add)} kcal` : ""}`;
    return `<span class="dtrain" title="${esc(title)}">${ICON_DUMBBELL}${esc(lv.label)}</span>`;
  }

  // Ab diesem Anteil des Ziels gilt der Korridor als getroffen. Darunter ist nicht
  // „gut, weil nicht ueberschritten“, sondern schlicht noch offen – deutlich zu wenig
  // zu essen ist im Defizit ein Fehler, kein Erfolg.
  const GOAL_BAND = 0.9;

  // Zustand gegen ein Ziel: "under" | "ok" | "over".
  // dir "min" (Protein): das Ziel ist eine Untergrenze – darueber ist gut, nie eine
  // Warnung. Alles andere ist eine Obergrenze.
  function goalState(ist, ziel, dir) {
    if (!ziel) return "under";
    const r = ist / ziel;
    if (dir === "min") return r >= 1 ? "ok" : "under";
    if (r > 1) return "over";
    return r >= GOAL_BAND ? "ok" : "under";
  }

  // Ein Fortschrittsbalken. Optionen:
  //   label, ist, ziel, unit – Beschriftung und Werte
  //   cls        – Makro-Farbe des Punktes (t-carb / t-prot / t-fat); der Balken selbst
  //                zeigt immer den Zustand, nicht die Kategorie
  //   dir        – "min" = Untergrenze (Protein), sonst Obergrenze
  //   rest       – true = Restzeile immer, "attention" = nur wenn nicht im Ziel, false = nie
  //   unitInline – Einheit in der Zahlenzeile zeigen
  function goalBarHtml(o) {
    if (!o.ziel) return "";
    const rest = Math.round(o.ziel - o.ist);
    const st = goalState(o.ist, o.ziel, o.dir);
    const pct = Math.max(0, Math.min(100, Math.round(o.ist / o.ziel * 100)));
    const showRest = o.rest === true || (o.rest === "attention" && st !== "ok");
    // Der Zustand steht immer auch als Text da – Farbe allein traegt keine Information.
    // Wortwahl nach Richtung: Protein ist eine Untergrenze, die man erreichen SOLL
    // („noch 33 g“ ist eine Aufforderung). Fett und Kohlenhydrate sind ein Budget, das
    // man beim Abnehmen gerade nicht ausschoepfen muss – „noch 42 g Fett“ laese sich
    // dort wie die Aufforderung, sie noch zu essen. Deshalb „übrig“ — das ist neutral
    // und kurz genug fuer die schmalen Tageskarten („Spielraum“ brach dort um).
    const restTxt = rest < 0
      ? `${nfmt(-rest)} ${o.unit} ${o.dir === "min" ? "über Ziel" : "drüber"}`
      : o.dir === "min"
        ? `noch ${nfmt(rest)} ${o.unit}`
        : `${nfmt(rest)} ${o.unit} übrig`;
    // toggle: macht die ganze Zeile zum Aufklapper (nur der Wochenplan nutzt das, siehe
    // dayGoalsHtml). Frueher stand dafuer eine eigene Knopfzeile "Makros ›" darunter - die
    // kostete 41px, und im Sheet fester Hoehe ist das Flaeche, die den Mahlzeiten fehlt.
    // Als Parameter und nicht als globale Regel: goalBarHtml() baut auch die Balken der
    // Wochenziele und im Rechner, dort gibt es nichts aufzuklappen.
    const tg = o.toggle;
    // Der Knopf ist NUR der Chevron; die ganze Zeile wird ueber ein aufgespanntes ::after
    // zur Trefferflaeche. Dasselbe Stretched-Link-Muster wie bei .ing-view-name und
    // .rcard-open. Der naheliegende Weg - die ganze .gm als <button> - waere zwar kuerzer
    // gewesen, haette aber zwei Dinge gebrochen: <button> erwartet Phrasing Content, und
    // .gm enthaelt drei <div> (darunter eine role="progressbar"). Ausserdem baut sich der
    // Name eines Knopfes aus seinem GESAMTEN Inhalt - "Kalorien" waere doppelt
    // vorgelesen worden, einmal aus dem Label und einmal aus dem aria-label der
    // Fortschrittsleiste. So bleiben die Zahlen normaler Text und der Knopf heisst schlicht
    // "Makros".
    const chevron = tg
      ? `<button type="button" class="gm-caret" data-action="toggle-day-goals" data-day="${tg.day}" aria-expanded="${tg.open}"><span class="visually-hidden">Makros</span><svg class="caret${tg.open ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>`
      : "";
    // Wert und Chevron in einer eigenen Huelle: .gm-r ist flex mit space-between und war auf
    // GENAU zwei Kinder ausgelegt (Label links, Wert rechts). Ein drittes Kind verteilte den
    // Raum auf zwei Luecken - der Wert stand dann 80px vor dem Pfeil in der Mitte, als
    // gehoerten sie nicht zusammen. Ohne toggle ist die Huelle leer und aendert nichts.
    const wert = `<span class="gm-v"><b>${nfmt(o.ist)}</b>&thinsp;/&thinsp;${nfmt(o.ziel)}${o.unitInline && o.unit ? " " + o.unit : ""}</span>`;
    return `<div class="gm ${o.cls || ""} is-${st}${tg ? " gm-tap" : ""}">
        <div class="gm-r"><span class="gm-n">${o.label}</span>${tg ? `<span class="gm-vwrap">${wert}${chevron}</span>` : wert}</div>
        <div class="gm-bar" role="progressbar" aria-valuenow="${Math.round(o.ist)}" aria-valuemin="0" aria-valuemax="${Math.round(o.ziel)}" aria-label="${esc(o.label)}"><span style="width:${pct}%"></span></div>
        ${showRest ? `<div class="gm-left">${restTxt}</div>` : ""}
      </div>`;
  }

  // Welche Tage ihre Makrobalken aufgeklappt haben. Bewusst nicht gespeichert: beim
  // Neuladen sind alle Tageskarten wieder eingeklappt (gleiches Muster wie collapsedCats
  // bei den Meal-Kategorien).
  const expandedDayGoals = new Set();
  // Welche Slots ihre kollabierten "andere"-Zuweisungskarten aufgeklappt haben. Bewusst
  // nicht gespeichert: beim naechsten render() wieder eingeklappt (gleiches Muster wie oben).
  const expandedOthers = new Set();

  // Kalorien breit in einer Zeile – die Makros stehen dahinter, standardmaessig
  // eingeklappt. Sieben Tage x 4 Balken (Kalorien + 3 Makros) gleichzeitig sichtbar
  // war beim UX-Review der groesste Befund fuer "zu viel auf einen Blick"; jetzt zeigt
  // die Karte im Ruhezustand nur noch den einen Balken, der beim Ueberfliegen der Woche
  // zaehlt. ueber goalMacrosHtml() derselbe Baustein wie bei "Ziele dieser Woche":
  // ausgeschriebene Namen, Label ueber dem Wert. Frueher hatte die Tageskarte eine
  // eigene, engere Variante mit Kuerzeln (P/KH/F) in einem starren Drei-Spalten-Raster -
  // auf schmalen Desktop-Karten (~232px) blieb dafuer kein Platz und Wert/Kuerzel
  // standen in zwei Zeilen uebereinander statt wie hier als Label+Wert PRO Makro.
  // goalMacrosHtml() wickelt stattdessen jedes Makro einzeln (flex-wrap) und schrumpft
  // dadurch von selbst auf ein Makro pro Zeile, sobald der Platz fuer drei nicht reicht.
  // Die Makros stehen BEWUSST vor der Kalorienzeile, nicht dahinter.
  //
  // Im Wochenplan sitzt die Tagesbilanz fest am Kartenfuss. Stand der Aufklapper oben,
  // wuchs die Bilanz beim Oeffnen nach oben weg und nahm ihren eigenen Ausloeser mit -
  // gemessen 149px. Wer ein zweites Mal an dieselbe Stelle tippte, traf einen Makrobalken;
  // praktisch liess sich der Bereich nicht mehr schliessen. Andersherum bleibt die
  // Kalorienzeile die unterste Zeile und bewegt sich keinen Pixel, egal was darueber
  // aufklappt.
  //
  // Der Ausloeser ist seit demselben Schritt die Kalorienzeile selbst (toggle-Parameter),
  // nicht mehr eine eigene Knopfzeile darunter - die kostete 41px Hoehe fuer ein Wort.
  function dayGoalsHtml(s, t, dayKey) {
    const open = expandedDayGoals.has(dayKey);
    return `<div class="day-goals">
        ${open ? goalMacrosHtml(s, t) : ""}
        ${goalBarHtml({ label: "Kalorien", ist: s.kcal, ziel: t.kcal, unit: "kcal", rest: "attention", unitInline: true, toggle: { day: dayKey, open: open } })}
      </div>`;
  }

  function dayNutHtml(s, dayKey) {
    if (!hasNut(s)) return "";
    // Ziel des konkreten Tages: am Ruhetag weniger Kohlenhydrate, dafuer mehr Fett.
    const t = goalTargetsForDay(dayKey);
    // Mit gespeichertem Ziel ersetzen die Balken die Textzeile – sonst staende alles doppelt.
    if (t) return dayGoalsHtml(s, t, dayKey);
    return `<div class="day-nut">
        <span class="kcal">${nfmt(s.kcal)} <small>kcal</small></span>
        <span class="macros">${macroLineHtml(s)}</span>
      </div>`;
  }

  // Fuellt die klebende Tagesbilanz unter dem Wischstreifen (#day-bal, nur Handy).
  //
  // Bewusst ueber dasselbe dayNutHtml() wie die Bilanz in der Karte: ein zweiter Renderpfad
  // fuer dieselbe Aussage liefe beim naechsten Feature auseinander. Der Unterschied ist
  // allein der Ort.
  //
  // Leerer Tag: dayNutHtml gibt "" zurueck. Dann bleibt die Leiste nicht leer stehen,
  // sondern verschwindet ganz (.is-empty) - eine leere klebende Flaeche waere schlimmer
  // als keine.
  // Ohne Argument: der Tag kommt aus der TAGESLEISTE, nicht von einem durchgereichten
  // Index. Das ist bewusst so.
  //
  // Zuerst nahm die Funktion einen Index entgegen, und mehrere Aufrufer reichten ihn
  // weiter. Nach dem Entfernen eines Meals stand dann die Summe von Montag in der Leiste,
  // obwohl Dienstag angezeigt war: irgendein Aufrufer kam mit einem leeren Wert und ein
  // Rueckfall auf DAYS[0] machte daraus stillschweigend Montag. Der markierte Knopf ist
  // dagegen genau das, was der Nutzer sieht - eine Quelle, die nicht danebenliegen kann,
  // ohne dass es auffiele.
  // Rueckgabe: true, wenn die Leiste tatsaechlich sichtbar ist und bemalt wurde. Der
  // Aufklapp-Handler entscheidet daran, ob ein volles render() noetig ist - siehe dort.
  function paintDayBalance(dayKey) {
    const box = document.getElementById("day-bal");
    if (!box) return false;                 // anderer Reiter
    // Zustaendig nur auf dem Handy. Die Leiste steht in JEDEM Durchlauf im Markup und ist
    // am Rechner bloss per CSS versteckt - eine Pruefung auf ihre blosse Existenz griff
    // deshalb immer und liess am Rechner die angeklickte Karte unveraendert.
    //
    // Gegen die Breite und NICHT gegen getComputedStyle(box).display: die Leiste blendet
    // sich bei einem leeren Tag selbst aus (.is-empty). Ein Sichtbarkeits-Test haette sie
    // ab dann dauerhaft blockiert - sie waere nie wieder befuellt worden, weil der
    // Zustand seine eigene Heilung verhindert. Die 680px sind derselbe Breakpoint, an dem
    // das CSS sie einblendet; beide muessen zusammen geaendert werden.
    if (!window.matchMedia("(max-width: 680px)").matches) return false;
    let k = dayKey;
    if (!k) {
      const btns = document.querySelectorAll(".daybar .db-b");
      const i = Array.prototype.findIndex.call(btns, b => b.classList.contains("active"));
      k = (DAYS[i] || DAYS[0]).key;
    }
    const html = dayNutHtml(dayNut(k), k);
    box.innerHTML = html;
    box.classList.toggle("is-empty", !html);
    return true;
  }

  function weekNutHtml() {
    const w = weekNut();
    // Wochenziel = Summe aller sieben Tagesziele. Bewusst summiert statt „Tagesziel x 7“:
    // mit Carb-Cycling unterscheiden sich Kohlenhydrate und Fett je Tagestyp, die Woche
    // haengt dann davon ab, WELCHE Tage Trainingstage sind. Dass ein Teil davon noch
    // ungeplant ist, sagt das Kennzeichen „x von 7 Tagen geplant“.
    const t = goalTargetsForDays(DAYS.map(d => d.key));
    // Nur noch Kalorien fuer die Woche - Kohlenhydrate/Protein/Fett ueber sieben Tage
    // aufsummiert war eine Zahl ohne Handlung: entschieden wird immer auf Tagesebene,
    // nie "diese Woche insgesamt 980g Protein". Die Makrobalken bleiben, wo sie etwas
    // sagen: je Tag (dayGoalsHtml) und im Tages-Ring hier drunter (weekGoalHtml).
    // Kein umschliessender Rahmen mehr ("Deine Ziele"-Karte): Heute/Woche stehen mit
    // ihrer eigenen Kartenoptik (.wg-col) direkt auf der Seite - Karte-in-der-Karte war
    // doppelt genestet, und beide Karten tragen mit "Kalorien" + Eyebrow-Zeile schon
    // genug eigenen Kontext, um ohne uebergeordneten Titel verstaendlich zu sein.
    //
    // Ziel vorhanden: die beiden Zielkarten IMMER zeigen — auch ohne ein einziges geplantes
    // Meal. Der leere Zustand (keine Naehrwerte in der Woche) wird an weekGoalHtml durchgereicht;
    // die Diese-Woche-Karte wird dann zum Erklaerpanel statt zum Datenring, die Heute-Karte zeigt
    // bei Verzehr 0 die Ziele (Ring "Verbleibend" = volles Tagesziel, Makrobalken 0/Ziel).
    if (t) return `<div class="week-nut">${weekGoalHtml(w, t)}</div>`;
    // Randfall ohne gespeichertes Ziel (die App fuehrt sonst ins Onboarding): nur bei
    // vorhandenen Naehrwerten die Kalorien-Kachel, sonst faellt der Bereich ganz weg.
    if (!hasNut(w)) return "";
    const tiles = `<div class="wn-tile t-kcal"><div class="val">${nfmt(w.kcal)}<span class="u">kcal</span></div><div class="lbl">Kalorien</div></div>`;
    return `<div class="week-nut"><div class="wn-tiles">${tiles}</div></div>`;
  }

  // Ring + Kennzahlenliste + eigene Makro-Spalte, nachgebaut nach einem Screenshot einer
  // anderen Fitness-App (siehe Fotos/WhatsApp Image ...). `grundziel` ist das Ziel OHNE
  // Trainings-Zuschlag, `trainingAdd` der Zuschlag des Tages/der Woche (0 an Ruhetagen) -
  // zusammen ergeben sie das tatsaechliche Ziel, exakt wie computeGoal()/trainFromRest()
  // es schon rechnen (ziel = grundziel + trainingAdd), hier nur sichtbar aufgeteilt statt
  // fertig addiert. `headHtml` ist die kleine Zeile UEBER der grossen Ueberschrift
  // "Kalorien" (Zeitraum + Kennzeichen, z.B. "Heute · Montag"). `rightColHtml` ist der
  // KOMPLETTE Inhalt der zweiten Spalte samt eigener Ueberschrift (nicht nur Makros) -
  // bleibt die Spalte leer ("") faellt sie ganz weg. `grundzielLbl` heisst "Grundbedarf"
  // (Heute wie Woche) - NICHT "Tagesziel"/"Wochenziel": genau dieses Wort bezeichnet im
  // Fussbilanz der Tageskarte (goalBarHtml) den VOLLEN Wert MIT Trainingszuschlag. Dieselbe Bezeichnung
  // fuer zwei unterschiedliche Zahlen (mit/ohne Training) haette an Trainingstagen dazu
  // gefuehrt, dass "Tagesziel: 2.200" gelesen wird, obwohl das tatsaechliche Budget an dem
  // Tag 2.200 + Trainingszuschlag ist - "Grundbedarf" macht das "ohne Training" explizit.
  const RING_C = 201; // Umfang bei r=32 (2 × π × 32)
  function goalRingHtml(ist, grundziel, trainingAdd, headHtml, rightColHtml, grundzielLbl) {
    const ziel = grundziel + trainingAdd;
    const rest = Math.round(ziel - ist);
    const st = goalState(ist, ziel);
    const ratio = ziel ? ist / ziel : 0;
    const off = Math.max(0, RING_C * (1 - Math.min(1, ratio)));
    // Zustand steht zusaetzlich IMMER als Text da (Zahl + Wortwechsel) - der Bogen
    // verstaerkt das nur farblich, ersetzt es nicht (siehe CSS-Kommentar bei .wg).
    const stLbl = st === "over" ? "Drüber" : "Verbleibend";
    return `<div class="wg is-${st}">
        <div class="wg-lbl">${headHtml}</div>
        <div class="wg-row">
          <div class="wg-col-cal">
            <h3 class="wg-h">Kalorien</h3>
            <div class="wg-main">
              <div class="wg-ring">
                <svg viewBox="0 0 78 78" width="118" height="118" aria-hidden="true">
                  <circle class="wg-track" cx="39" cy="39" r="32"/>
                  <circle class="wg-fill" cx="39" cy="39" r="32" stroke-dasharray="${RING_C}" stroke-dashoffset="${off}"/>
                </svg>
                <div class="wg-c"><b>${nfmt(Math.abs(rest))}</b><span>${stLbl}</span></div>
              </div>
              <div class="wg-stats">
                <div class="wg-stat base" role="group" aria-label="${grundzielLbl}: ${nfmt(grundziel)} kcal"><span class="wg-stat-ic">${ICON_FLAG}</span><span class="wg-stat-txt"><small>${grundzielLbl}</small><b>${nfmt(grundziel)}</b></span></div>
                <div class="wg-stat food" role="group" aria-label="Ernährung: ${nfmt(ist)} kcal"><span class="wg-stat-ic">${iconSvg("utensils", "")}</span><span class="wg-stat-txt"><small>Ernährung</small><b>${nfmt(ist)}</b></span></div>
                <div class="wg-stat train" role="group" aria-label="Training: ${nfmt(trainingAdd)} kcal"><span class="wg-stat-ic">${ICON_DUMBBELL}</span><span class="wg-stat-txt"><small>Training</small><b>${nfmt(trainingAdd)}</b></span></div>
              </div>
            </div>
          </div>
          ${rightColHtml ? `<div class="wg-col-macros">${rightColHtml}</div>` : ""}
        </div>
      </div>`;
  }

  // Die drei Makrobalken einer Spalte. Protein ist eine Untergrenze (dir "min"),
  // Kohlenhydrate und Fett sind ein Budget — daher unterschiedliche Bewertung.
  // Hier stehen die Makros ausgeschrieben — anders als in den schmalen Tageskarten
  // des Plans (dayGoalsHtml), wo nur Kuerzel hineinpassen.
  // Reihenfolge KH->P->F (CLAUDE.md, "Makros und Nährwerte") - die ausgeschriebenen Namen
  // bleiben (siehe Kommentar bei dayGoalsHtml: Kuerzel scheiterten hier an schmalen
  // Desktop-Karten), nur die Anordnung zieht mit der App-weiten Regel mit.
  function goalMacrosHtml(s, t) {
    return `<div class="wg-macros">
        ${goalBarHtml({ label: "Kohlenhydrate", ist: s.carbs, ziel: t.carbs, unit: "g", cls: "t-carb", rest: "attention", unitInline: true })}
        ${goalBarHtml({ label: "Proteine", ist: s.protein, ziel: t.protein, unit: "g", cls: "t-prot", dir: "min", rest: "attention", unitInline: true })}
        ${goalBarHtml({ label: "Fett", ist: s.fat, ziel: t.fat, unit: "g", cls: "t-fat", rest: "attention", unitInline: true })}
      </div>`;
  }

  // Zwei flache Leisten untereinander: heutiger Tag und ganze Woche, beide mit
  // Kalorienring UND Makros. Untereinander statt nebeneinander, weil jede Leiste so
  // die volle Breite nutzt — die Makros passen dann rechts daneben statt darunter,
  // und der ganze Block bleibt flach.
  function weekGoalHtml(w, t) {
    const d = DAYS.filter(x => x.key === todayDayKey())[0] || DAYS[0];
    const day = goalTargetsForDay(d.key);
    // Immer gegen den Plan der AKTUELLEN Woche rechnen, auch wenn state.plan gerade
    // auf die naechste Woche zeigt - "heute" bleibt heute, unabhaengig von der
    // gewaehlten Ansicht (siehe dayNutOf-Kommentar).
    const s = state.viewWeek === "next" ? dayNutOf(state.plans[weekKeyFor("cur")] || makeEmptyPlan(), d.key) : dayNut(d.key);
    // Leerzustand je Karte getrennt: die Heute-Karte zeigt ihren Makro-Hinweis, solange HEUTE
    // kein Meal hat (nicht schon, wenn irgendein anderer Wochentag geplant ist); die
    // Diese-Woche-Karte wird zum Erklaerpanel, solange die ganze Woche leer ist.
    const dayEmpty = !hasNut(s);
    const weekEmpty = !hasNut(w);
    const dayHead = `Deine Ziele für Heute · ${esc(d.label)}`;
    const plannedKeys = DAYS.filter(x => hasNut(dayNut(x.key))).map(x => x.key);
    const planned = plannedKeys.length;
    const open = 7 - planned;
    // Grundziel/Training fuer goalRingHtml aufgeteilt statt fertig addiert (siehe dort).
    // Bewusst gegen ALLE sieben Tage gerechnet (t, aus weekNutHtml uebergeben), nicht nur
    // die mit bereits eingeplanten Meals: Trainingstage sind eine Eigenschaft des
    // gespeicherten Ziels (state.goal.training), keine des Wochenplans - ein Trainingstag
    // zaehlt sein Kalorien-Plus auch dann, wenn dafuer noch kein Meal eingetragen ist.
    // Vorher haengte das an "geplanten" Tagen (goalTargetsForDays(plannedKeys)) - dadurch
    // fehlte der Trainings-Zuschlag fuer jeden Trainingstag ohne Meal komplett (zeigte
    // faelschlich "Training: 0"), und Grundziel war zu niedrig. rest1 ist garantiert nicht
    // null: weekGoalHtml laeuft nur, wenn ein Ziel existiert (siehe Aufrufer in weekNutHtml).
    const rest1 = goalTargets(1);
    const weekGrund = rest1.kcal * 7;
    const weekTrainAdd = t.kcal - weekGrund;
    // Trainings-Kennzeichen auch in der Tagesspalte der Uebersicht — sonst erklaert
    // sich das abweichende Kohlenhydrat-Ziel dort nicht. Ohne den kcal-Aufschlag im
    // Badge selbst: der steht jetzt schon in der Training-Zeile der Kennzahlenliste
    // (goalRingHtml) - hier direkt daneben noch einmal waere dieselbe Zahl doppelt.
    const dayTrainAdd = isTrainingDay(d.key) ? dayTrainKcal(d.key) : 0;
    const dayTrain = isTrainingDay(d.key)
      ? `<span class="wg-train" title="Trainingstag: ${esc(trainLevel((goalTraining()[d.key] || {}).level).label)}">${ICON_DUMBBELL}Training</span>` : "";
    const dayHeadHtml = `${dayHead}${dayTrain}`;
    const weekLbl = state.viewWeek === "next" ? "Nächste Woche" : "Diese Woche";
    // Eyebrow der Karte laenger/erklaerender als die kurze Wisch-Tab-Beschriftung (weekLbl bleibt
    // dafuer unveraendert). Der fruehere "X geplante Tage"-Chip ist raus: dieselbe Information
    // steht bereits rechts im Fortschritt-Balken ("x von 7 Tagen geplant") - Dopplung entfernt.
    const weekHeadHtml = state.viewWeek === "next" ? "Deine Ziele für nächste Woche" : "Deine Ziele für diese Woche";
    // Was bleibt fuer die noch leeren Tage? Das ist beim Planen die eigentlich
    // gesuchte Zahl — der blosse Wochenrest sagt nicht, wie viel pro Tag noch geht.
    const restKcal = t.kcal - w.kcal;
    const perOpen = open > 0 && restKcal > 0
      ? `<div class="wg-open">Für die ${open} offenen Tage bleiben ⌀ <b>${nfmt(restKcal / open)} kcal</b> pro Tag</div>`
      : "";
    // Rechte Spalte der Wochenkarte: Fortschritt statt Makros (Wochenmakros interessieren
    // niemanden - Makro-Entscheidungen fallen auf Tagesebene, siehe dayGoalsHtml/Kommentar
    // in weekNutHtml). Zeigt, wie viele der 7 Tage schon geplant sind, plus das Budget
    // fuer die restigen Tage (perOpen) - beides war ohnehin schon berechnet.
    const planPct = Math.round(planned / 7 * 100);
    const weekProgressHtml = `
      <h3 class="wg-h">Fortschritt</h3>
      <div class="wg-progress">
        <div class="wg-progress-txt" data-planned="${planned}">${planned} von 7 Tagen geplant</div>
        <div class="wg-progress-bar" role="progressbar" aria-valuenow="${planned}" aria-valuemin="0" aria-valuemax="7" aria-label="Tage geplant"><span style="width:${planPct}%"></span></div>
        ${perOpen}
      </div>`;
    // Rechte Spalte der Heute-Karte: im Leerzustand stehen die Makrobalken alle auf 0/Ziel und
    // sagen nichts - daher stattdessen ein kurzer Hinweis, was hier erscheint. Die Ueberschrift
    // "Makros" bleibt als Kontext. Ring + Grundbedarf/Ernaehrung/Training bleiben, die zeigen die
    // Ziele auch ohne geplantes Meal. Bewusst ein eigener, Makro-bezogener Satz (nicht der der
    // Diese-Woche-Karte), damit er auf dem Rechner nicht doppelt untereinander steht.
    const dayRight = dayEmpty
      ? `<h3 class="wg-h">Makros</h3><p class="wg-side-note">Trage für heute ein Meal ein, dann erscheinen hier deine Makros: Proteine, Kohlenhydrate und Fett.</p>`
      : `<h3 class="wg-h">Makros</h3>${goalMacrosHtml(s, day)}`;
    // Rechte Spalte der Diese-Woche-Karte: gleiches Muster wie dayRight — die Ueberschrift
    // "Fortschritt" bleibt als Kontext stehen, nur der Inhalt darunter wechselt. So haben beide
    // Karten immer Ring + Grundbedarf/Ernaehrung/Training UND dieselbe Form/Hoehe, auch auf dem
    // Handy im Wisch-Karussell (vorher wurde die ganze Karte zu einem separaten Panel ohne Ring).
    const weekRight = weekEmpty
      ? `<h3 class="wg-h">Fortschritt</h3><p class="wg-side-note">Plane deine Woche — hier siehst du dann Kalorien, Ernährung, Training und Makros auf einen Blick.</p>`
      : weekProgressHtml;
    // Der "Neu berechnen"-Knopf steht AUSSERHALB beider Karten, in einer eigenen Zeile unter
    // dem Wischstreifen. Zwei Gruende: Die Aktion betrifft das Ziel insgesamt (Tag UND Woche),
    // gehoert also an eine Stelle, die zu beiden gehoert - und in der Kopfzeile nur der
    // Heute-Karte machte er genau diese Kopfzeile rund 17px hoeher als die der Wochenkarte,
    // wodurch "Kalorien" samt Ring beim Wischen um diesen Betrag sprang. Zudem war er auf der
    // Wochenkarte gar nicht mehr zu sehen, weil er mit weggewischt wurde. Vormals in der
    // Wochenplan-Werkzeugleiste, dort konzeptionell falsch einsortiert (neben Teilen/Leeren
    // DIESER Woche).
    // Zwei Wege nebeneinander (B4): "Anpassen" korrigiert die Zahlen direkt, "Neu berechnen"
    // fuehrt durch den Rechner. Der Direktweg steht zuerst, weil er der haeufigere ist -
    // die Grundlagen (Alter, Groesse, Aktivitaet) aendern sich selten, das Defizit oft.
    const recalcLink = `<button type="button" class="btn ghost sm wg-recalc" data-action="tune-goal" title="Ziel anpassen" aria-label="Ziel anpassen">${ACT_ICONS.edit}<span>Anpassen</span></button>`
      + `<button type="button" class="btn ghost sm wg-recalc" data-action="recalc-goal" title="Ziele neu berechnen" aria-label="Ziele neu berechnen">${TOOL_ICONS.recalc}<span>Neu berechnen</span></button>`;
    // Auf dem Handy liegen die beiden Leisten nebeneinander und werden gewischt
    // (siehe CSS) – die Knopfleiste sagt, welche gerade zu sehen ist. Am Rechner
    // ist sie ausgeblendet, dort stehen beide untereinander wie bisher.
    // .wg-actions liegt bewusst weder in .wgbar noch in .wg-cols: initCarousel liest die
    // Kinder der Leiste als Sprungziele und die des Streifens als Karten - ein Knopf in
    // einem der beiden waere ein dritter, toter Slide-Schalter.
    return `<div class="wgbar" role="group" aria-label="Zielansicht wählen">
        <span class="db-ind" aria-hidden="true"></span>
        <button type="button" class="wg-b">Heute</button>
        <button type="button" class="wg-b">${weekLbl}</button>
      </div>
      <div class="wg-cols">
        <div class="wg-col${isTrainingDay(d.key) ? " wg-col-training" : ""}">${goalRingHtml(s.kcal, rest1.kcal, dayTrainAdd, dayHeadHtml, dayRight, "Grundbedarf")}</div>
        <div class="wg-col">${goalRingHtml(w.kcal, weekGrund, weekTrainAdd, weekHeadHtml, weekRight, "Grundbedarf")}</div>
      </div>
      <div class="wg-actions">${recalcLink}</div>`;
  }

  // Zaehlt "X von 7 Tagen geplant" weich hoch statt den Endwert sofort hinzustellen -
  // aber nur, wenn sich die Zahl seit dem letzten Anzeigen wirklich veraendert hat. Sonst
  // wuerde jeder blosse Tab-Wechsel zurueck zu Home dieselbe Animation erneut abspulen,
  // und genau das soll bei einer haeufig besuchten Seite nicht passieren (siehe
  // apple-design/emil-design-eng: Animation nur, wo sie etwas zeigt, nicht bei jedem Blick).
  let lastShownPlanned = null; // nur fuer die laufende Sitzung, kein State-Feld noetig
  function animateProgressCount() {
    const txt = view.querySelector(".wg-progress-txt");
    const bar = view.querySelector(".wg-progress-bar > span");
    if (!txt) return; // Leerzustand (weekEmpty) hat keinen Fortschrittsbalken
    const planned = +txt.dataset.planned || 0;
    const from = lastShownPlanned == null ? 0 : lastShownPlanned;
    lastShownPlanned = planned;
    if (from === planned || reducedMotion()) {
      txt.textContent = planned + " von 7 Tagen geplant";
      if (bar) bar.style.width = Math.round(planned / 7 * 100) + "%";
      return;
    }
    const dur = 700, t0 = performance.now();
    function frame(now) {
      // Nach unten geklemmt aus demselben Grund wie in animateOnbProgress: ein negatives
      // p laesst den Zaehler unter null laufen.
      const p = Math.max(0, Math.min(1, (now - t0) / dur));
      const eased = 1 - Math.pow(1 - p, 3); // --ease-out als JS-Aequivalent
      const cur = Math.round(from + (planned - from) * eased);
      txt.textContent = cur + " von 7 Tagen geplant";
      if (bar) bar.style.width = Math.round(cur / 7 * 100) + "%";
      if (p < 1) requestAnimationFrame(frame); else { txt.textContent = planned + " von 7 Tagen geplant"; if (bar) bar.style.width = Math.round(planned / 7 * 100) + "%"; }
    }
    requestAnimationFrame(frame);
  }

  // Wochentag von heute – geteilt von der Uebersicht und der „Heute“-Markierung im Plan.
  function todayDayKey() { return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][new Date().getDay()]; }

  // Gemeinsames Bauteil von Karte (paintRecipeGroups) und Ansicht (openMealSheet,
  // Nur-Lese-Zweig) - siehe plans/MealAnsicht.MD Schritt 3: der Nutzer soll beim
  // Aufklappen genau das weiterwachsen sehen, was er angetippt hat. Liefert bewusst NUR
  // das nutfacts-Raster ohne Ueberschrift - die Ansicht setzt "Makros gesamt" selbst
  // davor, die Karte braucht keine Ueberschrift.
  function mealStatsHtml(r) {
    const n = recipeNut(r);
    if (!hasNut(n)) return "";
    return `<div class="nutfacts">
          <div class="nf t-kcal"><div class="v">${nfmt(n.kcal)}<span class="u">kcal</span></div><div class="k">Kcal</div></div>
          <div class="nf t-carb"><div class="v">${nfmt(n.carbs)}<span class="u">g</span></div><div class="k">KH</div></div>
          <div class="nf t-prot"><div class="v">${nfmt(n.protein)}<span class="u">g</span></div><div class="k">P</div></div>
          <div class="nf t-fat"><div class="v">${nfmt(n.fat)}<span class="u">g</span></div><div class="k">F</div></div>
        </div>`;
  }
  // ---------- Merkmale: Anzeige (Nur-Lese-Zweig) und Eingabe (Bearbeiten-Zweig) ----------
  // Zeigt nur, was gesetzt ist: ein Meal ohne Merkmale bekommt keine leere Zeile.
  // "Meal-Prep" steht vorn, weil es fuer die Zielgruppe die wichtigste Aussage ist.
  function mealFlagsHtml(r) {
    const parts = [];
    if (r.mealPrep) parts.push(`<span class="on">Meal-Prep</span>`);
    (r.tags || []).forEach(k => parts.push(`<span>${esc(tagLabel(k))}</span>`));
    return parts.length ? `<div class="mflags">${parts.join("")}</div>` : "";
  }
  function mealMetaEditHtml(r) {
    const tags = r.tags || [];
    const chips = [`<button type="button" data-flag="mealPrep" aria-pressed="${r.mealPrep ? "true" : "false"}">Meal-Prep</button>`]
      .concat(RECIPE_TAGS.map(t => `<button type="button" data-tag="${t.key}" aria-pressed="${tags.indexOf(t.key) !== -1 ? "true" : "false"}">${esc(t.label)}</button>`));
    return `<div class="ms-meta">
          <h4 class="sec-h">Merkmale</h4>
          <div class="mtags" id="f-tags">${chips.join("")}</div>
        </div>`;
  }

  // Schlanke Kartenzeile (Nachtrag aus der Abnahme von Phase 1, 07.08.2026): mealStatsHtml()
  // als Kartenbauteil zeigte vier umrandete Kacheln - bei zehn Karten vierzig Kaesten, unter
  // 560px klappt das Raster auf 2x2 und macht jede Karte zwei Kachelzeilen hoch. Zweiter
  // Helfer statt Wiederverwendung: speist aus DENSELBEN recipeNut(r)/hasNut(), "gemeinsames
  // Bauteil" bleibt also inhaltlich (gleiche Zahlen, gleiche Farben, gleiche Reihenfolge)
  // erhalten, nur nicht als identisches Markup - kcal prominent, Makros als farbige
  // Kuerzel ohne Kacheln/Rahmen/Textlabels, eine ruhige Zeile statt eines Kachel-Rasters.
  function cardStatsHtml(r) {
    const n = recipeNut(r);
    if (!hasNut(n)) return "";
    return `<div class="cstats">
          <span class="cs-kcal">${nfmt(n.kcal)} <span class="u">kcal</span></span>
          <span class="cs-macros">${macroLineHtml(n)}</span>
        </div>`;
  }

  // ---------- Handy-Karussell (Wochenplan, Wochenziele, Rechner) ----------
  // Die Hoehenanpassungen der gerade aufgebauten Streifen UND deren ResizeObserver.
  // Bewusst Listen hier statt eines window-Listeners/Observers je Karussell: die
  // Streifen werden bei jedem render() neu gebaut, ein Listener pro Durchlauf waere
  // ein Leck. resetCarousels() leert beide Listen vor dem Neuaufbau und trennt die
  // alten Observer ausdruecklich (sonst haelt ein ResizeObserver seine beobachteten,
  // laengst aus dem DOM entfernten Knoten weiter am Leben). Steht VOR initCarousel,
  // damit die Zuweisung sicher vor dem ersten Aufruf lief.
  const fits = [];
  const carouselObservers = [];
  function resetCarousels() {
    carouselObservers.forEach(ro => ro.disconnect());
    carouselObservers.length = 0;
    fits.length = 0;
  }
  window.addEventListener("resize", () => fits.forEach(f => f()));

  // Bewegungswerte einmal aus den CSS-Tokens gelesen (Karussell-Sprung und
  // Wochenwechsel-Uebergang unten) - keine zweite Quelle fuer Dauern/Kurven neben den
  // Custom Properties in :root. Die Werte stehen im <style> im <head> und sind damit
  // laengst im CSSOM, wenn dieses Script laeuft.
  const MOTION = (() => {
    const cs = getComputedStyle(document.documentElement);
    return {
      fast: cs.getPropertyValue("--dur-fast").trim() || "160ms",
      base: cs.getPropertyValue("--dur-base").trim() || "200ms",
      slow: cs.getPropertyValue("--dur-slow").trim() || "300ms",
      ease: cs.getPropertyValue("--ease-out").trim() || "cubic-bezier(.23, 1, .32, 1)",
    };
  })();

  // Bindet einen waagerecht schnappenden Streifen an die Knopfleiste darueber. Die
  // Kopplung laeuft ueber scrollLeft und NICHT ueber scrollIntoView: letzteres
  // verschiebt die Seite auch senkrecht, man wuerde beim Tagwechsel also
  // ungewollt nach oben oder unten springen.
  // Am Rechner steht die Leiste auf display:none, der Streifen ist ein normales
  // Raster – dann laeuft hier nur ein Klick-Handler mit, der nie ausgeloest wird.
  // panelList: nur noetig, wenn die Karten keine direkten Kinder des Streifens sind.
  // Beim Rechner ist das so – dort flacht display:contents die Zwischenebene nur fuer
  // die Darstellung ein, im DOM bleibt sie stehen, und .children liefe daneben.
  // onChange meldet jeden Kartenwechsel; der Rechner haengt daran seinen Fussknopf.
  function initCarousel(scroller, bar, panelList, onChange, opts) {
    if (!scroller || !bar) return null;
    const panels = panelList || Array.prototype.slice.call(scroller.children);
    // Gleitende Pille des Segmented Control (Schritt 3) - in .daybar UND .wgbar vorhanden
    // (gleiches Schema fuer beide Handy-Karussells, siehe CSS). Aus bar.children
    // ausgeklammert, sonst zaehlte sie als zusaetzlicher Knopf mit.
    const ind = bar.querySelector(".db-ind");
    const btns = Array.prototype.slice.call(bar.children).filter(el => el !== ind);
    if (!panels.length || !btns.length) return null;

    let activeIdx = -1;
    function setActive(idx) {
      btns.forEach((b, i) => {
        const on = i === idx;
        b.classList.toggle("active", on);
        if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
      });
      // Bleibt generisch: die .wgbar (Home, "Ziele der Woche") hat keine .is-train-Knoepfe,
      // dort ist der Ausdruck immer false und die Zeile folgenlos.
      bar.classList.toggle("is-train", !!(btns[idx] && btns[idx].classList.contains("is-train")));
      if (idx !== activeIdx) { activeIdx = idx; if (onChange) onChange(idx); }
    }

    // Gecachte Messwerte statt bei jedem Scroll-Bild neu zu lesen - genau das erzwang
    // vorher pro Bild ein Layout (offsetLeft/offsetWidth/offsetHeight von bis zu 7
    // Karten). measure() liest einmal in einem Batch, alles Weitere greift nur noch
    // lesend auf die Arrays zu. renderPlan() baut die Leiste bei jedem render() neu -
    // deshalb keine einmalige Init, sondern hier am Ende jedes initCarousel()-Aufrufs.
    let lefts = [], widths = [], heights = [], maxScroll = 0, step = 0, lastH = -1, clientW = 0;
    function measure() {
      const base = panels[0].offsetLeft;
      lefts = panels.map(p => p.offsetLeft - base);
      widths = panels.map(p => p.offsetWidth);
      heights = panels.map(p => p.offsetHeight);
      // clientWidth/scrollWidth gehoeren mit in den Batch: sie einzeln im Scroll-Pfad zu
      // lesen erzwingt genau das Layout wieder, das die Arrays hier vermeiden sollen.
      clientW = scroller.clientWidth;
      maxScroll = scroller.scrollWidth - clientW;
      // Fuer die Pille bewusst getBoundingClientRect statt offsetWidth/offsetLeft:
      // letztere runden auf ganze Pixel. Sieben Knoepfe auf 390 px sind je 52,86 px
      // breit - gerundet 53 stuende die Pille am Sonntag rund einen Pixel ueber den
      // Rand hinaus. Gemessen, nicht gerechnet, bleibt es aber trotzdem.
      if (btns.length) {
        const r0 = btns[0].getBoundingClientRect();
        step = btns.length > 1 ? btns[1].getBoundingClientRect().left - r0.left : 0;
        if (ind) ind.style.width = r0.width + "px";
      }
    }

    // Aktiv ist die Karte, deren linke Kante zuletzt vor der Mitte des Fensters lag –
    // das trifft auch waehrend eines halb gewischten Uebergangs das Richtige.
    function currentIndex() {
      const mid = scroller.scrollLeft + clientW / 2;
      let idx = 0;
      lefts.forEach((l, i) => { if (l <= mid) idx = i; });
      return idx;
    }

    // Early-Return: die 7 Knoepfe werden nur noch bei echtem Wechsel angefasst, nicht
    // bei jedem Scroll-Bild - setActive() macht einen Style-Recalc mit aktiven
    // Transitions, das war der teuerste Posten im rAF-Pfad.
    function markActive() { const idx = currentIndex(); if (idx !== activeIdx) setActive(idx); }

    // Pille des Segmented Control 1:1 an scrollLeft gekoppelt - reine Funktion ohne
    // eigene Transition, siehe Schritt 3.
    function syncIndicator() {
      if (!ind) return;
      const p = maxScroll ? scroller.scrollLeft / maxScroll * (panels.length - 1) : 0;
      ind.style.transform = "translate3d(" + (p * step) + "px,0,0)";
    }

    // Der Streifen ist von sich aus so hoch wie die hoechste Karte. Mit
    // align-items: flex-start behaelt zwar jede Karte ihre eigene Hoehe, der
    // Streifen bliebe aber trotzdem auf Maximalhoehe stehen – die Luecke waere dann
    // nur nach draussen gewandert, vor die Einkaufsliste. Also die Hoehe der gerade
    // sichtbaren Karten nachfuehren. Beim Wischen zaehlt das Maximum der angerissenen
    // Karten, sonst wuerde die hereinkommende hoehere Karte unterwegs abgeschnitten.
    function fitHeight() {
      // Am Rechner ist .week ein Raster und scrollt nicht – dort nichts anfassen.
      // Gegen den gemessenen Wert, nicht gegen frisch gelesene Layout-Eigenschaften.
      if (maxScroll <= 10) {
        if (scroller.style.height) { scroller.style.height = ""; lastH = -1; }
        return;
      }
      let h = 0;
      // fixedHeight: Hoehe EINMAL auf das Maximum ALLER Karten, statt der gerade
      // sichtbaren zu folgen. Beide Aufrufer brauchen das, aus verschiedenen Gruenden:
      // die Wochenziele, weil ihre zwei Karten (Heute/Woche) gleich hoch wirken sollen
      // und durch bedingten Inhalt leicht abweichen; der Wochenplan, weil ein Schreiben
      // mitten in der Wischgeste den Snap zerstoert (TROUBLESHOOTING Ziffer 42).
      // Ohne die Option fuehrt der Zweig darunter die Hoehe laufend nach - genau das,
      // was der Wochenplan nicht vertraegt.
      if (opts && opts.fixedHeight) {
        heights.forEach(x => { h = Math.max(h, x); });
      } else {
        const left = scroller.scrollLeft, right = left + clientW;
        lefts.forEach((a, i) => {
          if (a + widths[i] > left + 1 && a < right - 1) h = Math.max(h, heights[i]);
        });
      }
      // Schreibfaul: scroller.style.height nur bei echter Aenderung anfassen - sonst
      // Write->Read->Layout in jedem Scroll-Bild, genau waehrend der Streifen bewegt.
      if (h && h !== lastH) { lastH = h; scroller.style.height = h + "px"; }
    }
    fits.push(() => { measure(); fitHeight(); }); // Orientierungswechsel: erst neu messen, dann passen

    // Karten koennen nach dem Aufbau wachsen: waehlt man im Rechner ein Ziel, klappt
    // das Tempo-Feld auf; setzt man Trainingstage, kommen Zeilen dazu. Ohne Nachmessen
    // behaelt der Streifen seine alte Hoehe und schneidet das Neue mit overflow:hidden
    // ab – der untere Teil der Karte war dann nicht mehr erreichbar. Aktualisiert nur
    // den betroffenen Cache-Eintrag statt komplett neu zu messen - eine gewachsene
    // Karte aendert nicht die Positionen der anderen.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(entries => {
        entries.forEach(en => { const i = panels.indexOf(en.target); if (i >= 0) heights[i] = en.target.offsetHeight; });
        fitHeight();
      });
      panels.forEach(p => ro.observe(p));
      carouselObservers.push(ro);
    }

    // Ein Finger-Wisch hatte - anders als go() - keine Absicherung, wenn er zwischen zwei
    // Snap-Punkten liegen blieb: der Plan stand dann haelftig auf zwei Tagen. Ausloeser ist
    // fitHeight(), das die Hoehe des Scrollers mitten im Lauf schreibt. Beim Zurueckwischen
    // (morgen -> heute) ist die hereinkommende Karte in der Regel hoeher als die verlassene
    // - heute ist der vollere Tag -, der Streifen waechst also schon beim ersten Millimeter
    // der Geste. Ein Groessenwechsel des Snap-Behaelters laesst den Browser sein Snap-Ziel
    // neu bestimmen und kann den laufenden Wisch dabei verlieren; vorwaerts faellt es nicht
    // auf, weil die Hoehe dort erst am Ende schrumpft. go() faengt genau diesen Fall seit
    // jeher mit settle() ab - hier dieselbe Nachkorrektur fuer den nativen Wisch.
    let settleTimer = 0, touching = false;
    ["touchstart", "touchend", "touchcancel"].forEach(t => {
      scroller.addEventListener(t, e => { touching = !!(e.touches && e.touches.length); }, { passive: true });
    });
    // Senkrechten Stand der verlassenen Panels zurueckdrehen: wer zu einem anderen Tag
    // wischt, will ihn SEHEN und nicht dort weiterlesen, wo er zuletzt aufgehoert hat.
    // Bewusst erst NACH dem Einrasten und nur fuer Panels, die gerade nicht dran sind -
    // waehrend der Geste ist die verlassene Karte noch halb im Bild, ein Sprung dort
    // waere sichtbar. Panels ohne eigenen Scroller (Rechner, Wochenziele) fasst die
    // Schleife nicht an, dort ist scrollTop ohnehin 0.
    function resetInactiveScroll(activeIdx) {
      panels.forEach((p, i) => {
        if (i === activeIdx) return;
        const inner = p.querySelector(".slots");
        if (inner && inner.scrollTop) inner.scrollTop = 0;
      });
    }
    function settleNative() {
      // Solange der Finger liegt, ist "zwischen zwei Tagen" der gewollte Zustand.
      if (touching) { armSettle(); return; }
      const i = currentIndex();
      if (lefts[i] == null) return;
      if (Math.abs(scroller.scrollLeft - lefts[i]) > 2) scroller.scrollLeft = lefts[i];
      resetInactiveScroll(i);
    }
    // Hart setzen statt sanft: ein zweiter Lauf koennte auf demselben Weg wieder zwischen
    // zwei Punkten enden. Der Zielindex ist derselbe, den die Tagesleiste ohnehin schon
    // hervorhebt (currentIndex()) - korrigiert wird also auf den angezeigten Tag.
    function armSettle() { clearTimeout(settleTimer); settleTimer = setTimeout(settleNative, 220); }
    const hasScrollEnd = "onscrollend" in scroller;
    if (hasScrollEnd) scroller.addEventListener("scrollend", settleNative, { passive: true });

    let ticking = false;
    scroller.addEventListener("scroll", () => {
      // Synchron, nicht im rAF-Block: iOS-Safari drosselt requestAnimationFrame waehrend
      // Momentum-Scroll, das scroll-Ereignis kommt aber weiter. Ein einzelner
      // Transform-Write ist billig genug fuer jedes Bild.
      syncIndicator();
      if (!hasScrollEnd) armSettle();   // Rueckfall fuer Safari ohne scrollend
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; markActive(); fitHeight(); });
    }, { passive: true });

    // quiet: nur die Position setzen, ohne die schmueckende Sprung-Bewegung unten.
    // renderPlan() nutzt das beim Betreten des Reiters und beim Wochenwechsel: dort ist
    // der Tag kein Wechsel, den jemand ausgeloest hat, sondern der Startzustand. Ohne
    // das liefe beim Wochenwechsel ausserdem der Streifen-Uebergang gleichzeitig mit
    // Pillenfahrt und Karten-Ankommen - drei Bewegungen fuer einen Klick.
    function go(i, quiet) {
      const p = panels[i];
      if (!p) return;
      // Markierung sofort umsetzen, nicht erst wenn das Scroll-Ereignis kommt: beim
      // Sanftlauf dauert das mehrere hundert Millisekunden, und ein Knopf, der nach
      // dem Tippen noch tot aussieht, wird ein zweites Mal getippt.
      const from = activeIdx;
      setActive(i);
      // Der Sanftlauf animiert stur ueber die gesamte Strecke – von Montag auf Samstag
      // hiesse das, durch alle Zwischentage zu rauschen. Das ist keine Bewegung, die
      // etwas erklaert, sondern nur Wartezeit. Deshalb: nur zum Nachbartag sanft
      // gleiten (dort zeigt die Bewegung, in welche Richtung es ging), sonst direkt
      // setzen. Bei mehr als einer Karte Abstand springt es also sofort.
      const dist = Math.abs(i - from);
      const neighbour = dist <= 1;
      scroller.scrollTo({
        left: lefts[i],
        behavior: (neighbour && !reducedMotion()) ? "smooth" : "auto",
      });
      // Beim Direktsprung steht die neue Position schon – dann die Hoehe sofort
      // mitziehen, statt einen Frame lang die alte stehen zu lassen. Beim Sanftlauf
      // rechnet das Scroll-Ereignis unterwegs ohnehin laufend nach.
      fitHeight();

      // Mehrtages-Sprung (Schritt 4): kein Sanftlauf durch die Zwischentage (siehe
      // oben), die Richtung erzaehlt stattdessen die Pille mit einer einmaligen
      // Transition, die angekommene Karte kommt kurz mit einem WAAPI-Ankommen an.
      if (dist > 1 && !quiet && !reducedMotion()) {
        if (ind && step) {
          const dur = dist <= 2 ? MOTION.base : MOTION.slow;
          ind.style.transition = "transform " + dur + " " + MOTION.ease;
          ind.style.transform = "translate3d(" + (i * step) + "px,0,0)";
          // Inline-Style danach wieder loesen, sonst bremst die Transition beim
          // naechsten Wisch das 1:1-Tracking im scroll-Listener.
          const clearTrans = () => { ind.style.transition = ""; ind.removeEventListener("transitionend", clearTrans); };
          ind.addEventListener("transitionend", clearTrans);
        }
        if (p.animate) {
          const dir = i > from ? 1 : -1; // 8px bleiben innerhalb des 12px-Gaps, kein Nachbar blitzt auf
          p.animate(
            [{ opacity: .55, transform: "translateX(" + (dir * 8) + "px)" }, { opacity: 1, transform: "translateX(0)" }],
            { duration: parseFloat(MOTION.base) || 200, easing: MOTION.ease }
          );
        }
      }

      // iOS-Absicherung: scrollTo({behavior:"smooth"}) kann bei scroll-snap-type: x
      // mandatory zwischen zwei Snap-Punkten enden. scrollend ist Progressive
      // Enhancement (Safari hat es erst seit 2023), sonst greift ein Timeout - beides
      // prueft danach, ob wirklich am Zielpunkt gelandet wurde, und setzt sonst hart nach.
      // activeIdx-Pruefung ist Pflicht, nicht Feinschliff: hat der Nutzer nach dem
      // Tippen sofort weitergewischt, steht laengst ein anderer Tag - eine
      // Nachkorrektur risse ihn dann gegen seinen eigenen Wisch zurueck.
      const settle = () => {
        if (activeIdx !== i) return;
        if (Math.abs(scroller.scrollLeft - lefts[i]) > 2) scroller.scrollLeft = lefts[i];
        resetInactiveScroll(i);   // wie beim Finger-Wisch, siehe settleNative()
      };
      if ("onscrollend" in scroller) scroller.addEventListener("scrollend", settle, { once: true });
      else setTimeout(settle, 400);
    }

    btns.forEach((b, i) => b.addEventListener("click", () => go(i)));

    measure();
    markActive();
    fitHeight();
    syncIndicator();
    return { go: go, fit: fitHeight, index: currentIndex };
  }

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  // Gemeinsamer Enter-Uebergang fuer gleichrangige Ansichtswechsel (Schiebe-Schema, siehe
  // CLAUDE.md): Wochenwechsel und Tab-Wechsel nutzen dieselbe Bewegung statt eigener Kopien.
  // Enter-only: der innerHTML-Austausch IST der Exit, eine Ausblendung davor waere nur
  // kuenstliche Latenz. Reduced Motion behaelt die Ueberblendung, verliert aber die Richtung
  // (kein transform) - der globale !important-Block wuerde eine reine CSS-animation sonst
  // komplett kappen, WAAPI erlaubt genau diese Abstufung. dir: Vorzeichen der Bewegungsrichtung
  // (positiv = von rechts, negativ = von links); 0/falsy faellt auf reine Ueberblendung zurueck.
  function slideIn(el, dir) {
    if (!el || !el.animate) return null;
    const reduced = reducedMotion();
    const kf = (reduced || !dir)
      ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ opacity: 0, transform: "translateX(" + (dir * 16) + "px)" }, { opacity: 1, transform: "translateX(0)" }];
    return el.animate(kf, { duration: parseFloat(reduced ? MOTION.fast : MOTION.base) || 200, easing: MOTION.ease });
  }

  // FLIP zwischen Meal-Karte/Wochenplan-Slot und der grossen Meal-Ansicht (openMealSheet,
  // plans/MealAnsicht.MD Schritt 4). Nur transform animieren, NIE width/height - pro Frame
  // ein Reflow mit einem 640px-Base64-Bild darin waere zu teuer. from/to: DOMRect-artige
  // Objekte (mind. left/top/width/height) wie getBoundingClientRect() sie liefert - from ist
  // immer die KLEINE Karte/der Slot, to immer das grosse Overlay, in beiden Richtungen.
  // Gleichmaessige Skalierung ueber die Breite (ein ungleichmaessiges sx/sy staucht den Text
  // sichtbar), Verschiebung ueber die MITTELPUNKTE, damit der Standard-transform-origin
  // (50% 50%) stimmt.
  function flipDelta(from, to) {
    const s = from.width / to.width;
    const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
    const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
    return { dx, dy, s };
  }
  // Oeffnen: startet skaliert/verschoben auf der Karte, waechst auf transform:none.
  function flipIn(el, from, to) {
    if (!el || !el.animate || !from || !to || reducedMotion()) return null;
    const { dx, dy, s } = flipDelta(from, to);
    el.style.willChange = "transform";
    const anim = el.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${s})` },
      { transform: "none" },
    ], { duration: parseFloat(MOTION.slow) || 300, easing: MOTION.ease });
    const clear = () => { el.style.willChange = ""; };
    anim.finished.then(clear, clear);
    return anim;
  }
  // Schliessen: umgekehrt, und kuerzer als das Oeffnen (MOTION.base statt .slow) - Exits
  // sollen kuerzer sein als Entries.
  function flipOut(el, from, to) {
    if (!el || !el.animate || !from || !to || reducedMotion()) return null;
    const { dx, dy, s } = flipDelta(from, to);
    el.style.willChange = "transform";
    const anim = el.animate([
      { transform: "none" },
      { transform: `translate(${dx}px, ${dy}px) scale(${s})` },
    ], { duration: parseFloat(MOTION.base) || 200, easing: MOTION.ease });
    const clear = () => { el.style.willChange = ""; };
    anim.finished.then(clear, clear);
    return anim;
  }

  // Gleitende Pille fuer .week-switch (Schiebe-Schema, Schritt "Aktuelle/Naechste Woche"):
  // anders als bei .db-ind/.tab-ind kann hier keine CSS-transition greifen, weil
  // view.innerHTML die ganze Leiste bei jedem render() neu baut - die neu gebaute Pille
  // stuende sofort am Ziel. Deshalb WAAPI, mit per getBoundingClientRect GEMESSENEN
  // (nicht gerechneten) Positionen: "Aktuelle Woche" und "Naechste Woche" sind
  // unterschiedlich breit, ein 50%-Ansatz saesse daneben. dir: Bewegungsrichtung wie bei
  // slideIn() - nur gesetzt bei echtem Wochenwechsel, sonst springt die Pille lautlos.
  function syncWeekSwitchPill(container, dir) {
    if (!container) return;
    const ind = container.querySelector(".ws-ind");
    const active = container.querySelector(".ws-btn.active");
    if (!ind || !active) return;
    const cRect = container.getBoundingClientRect();
    // ind.style.left rechnet gegen die PADDING-Box von .week-switch (Containing Block eines
    // absolut positionierten Kindes), getBoundingClientRect() aber gegen die BORDER-Box -
    // ohne den Abzug staende die Pille um genau die Randbreite (1px) zu weit rechts.
    const bLeft = container.clientLeft;
    const aRect = active.getBoundingClientRect();
    const left = aRect.left - cRect.left - bLeft, width = aRect.width;
    if (dir && !reducedMotion() && ind.animate) {
      const other = Array.prototype.slice.call(container.querySelectorAll(".ws-btn")).find(b => b !== active);
      if (other) {
        const oRect = other.getBoundingClientRect();
        ind.style.left = left + "px"; ind.style.width = width + "px";
        ind.animate(
          [{ left: (oRect.left - cRect.left - bLeft) + "px", width: oRect.width + "px" }, { left: left + "px", width: width + "px" }],
          { duration: parseFloat(MOTION.base) || 200, easing: MOTION.ease }
        );
        return;
      }
    }
    ind.style.left = left + "px"; ind.style.width = width + "px";
  }

  // Die Tagesleiste klebt unter dem Seitenkopf. Dessen Hoehe haengt an Schriftgroesse
  // und Bildschirmbreite (Slogan bricht um, Reiter wandern nach unten) – deshalb
  // gemessen und als --head-h gesetzt, statt im CSS eine Zahl zu raten.
  function syncStickyOffsets() {
    const root = document.documentElement;
    const head = document.querySelector("header.site");
    if (head) root.style.setProperty("--head-h", head.offsetHeight + "px");
    // Untere Reiterleiste: auf dem Handy fest am Bildschirmrand. Der klebende
    // Fussknopf des Rechners muss darueber sitzen, sonst laege er dahinter. Am Rechner
    // steht die Leiste im Kopf, dann ist der Abstand 0.
    const tabs = document.querySelector(".tabs");
    const fixed = tabs && getComputedStyle(tabs).position === "fixed";
    root.style.setProperty("--tabbar-h", fixed ? tabs.offsetHeight + "px" : "0px");
    // --sheet-top und --foot-h gab es hier einmal fuer den Wochenplan als Flaeche fester
    // Hoehe. Die ist zurueckgebaut (siehe .plan-sheet im CSS): der innere Scroller nahm dem
    // Snap-Streifen die Wischgeste ab. Beide Variablen sind damit ersatzlos entfallen -
    // die Seite scrollt wieder normal, und was kleben soll, klebt per position:sticky.
  }
  window.addEventListener("resize", syncStickyOffsets);

  // ---------- „Ziele <Jahr>": Gewichtsverlauf als Jahresdiagramm ----------
  // MON_SHORT (Einzelbuchstaben) ist mit der Wochenachse entfallen: "J F M A M J J A S O N D"
  // hat zweimal J und zweimal M. Solange alle zwoelf Marken standen, war das gerade noch
  // aufloesbar - bei jeder zweiten Marke auf schmalen Geraeten (B2) nicht mehr. Dort stehen
  // jetzt dieselben Drei-Buchstaben-Kuerzel wie am Rechner, nur seltener.
  const MON_LONG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  function kgfmt(n) { return (Math.round(n * 10) / 10).toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  // Naechstgroessere "runde" Schrittweite (1, 2, 2,5, 5, 10 und Zehnerpotenzen davon).
  function niceStep(raw) {
    if (!(raw > 0)) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  // Beschriftung einer Wiegung (B2): "KW 33 · 10.08." - die Kalenderwoche allein ist im
  // Alltag schwer einzuordnen, das Datum des Montags verankert sie.
  //
  // weekKEYLabel, nicht weekLabel: Sie hiess bis zum 24.08.2026 genauso wie die Funktion
  // weiter unten, die einen Wochen-OFFSET als Zahl erwartet (appHeroHtml). Zwei Top-Level-
  // Declarations gleichen Namens im selben Script - durch Hoisting gewann die spaetere fuer
  // ALLE Aufrufer, und diese hier wurde nie ausgefuehrt. Der Gewichtsverlauf zeigte deshalb
  // live "Woche NaN · NaN. undefined". Siehe docs/TROUBLESHOOTING.md.
  //
  // Der Parameter ist ein ISO-Wochenschluessel ("2026-W33"), NICHT eine Zahl.
  function weekKeyLabel(k) {
    const d = weekMonday(k);
    return "KW " + weekNumOf(k) + " · " + String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".";
  }
  // Jahre, die eine Ansicht verdienen: alles mit Messung oder Ziel, plus das laufende Jahr —
  // und seit B6 die Jahre des Wochenarchivs, damit Gewichtskarte und Kalender sich EINEN
  // Umschalter und EIN state.viewYear teilen. Zwei Umschalter untereinander, die
  // verschiedene Jahre anbieten, waeren die schlechtere Antwort.
  function weightYears() {
    const ys = {};
    (state.weights || []).forEach(e => { ys[e.m.slice(0, 4)] = 1; });
    Object.keys(state.weightGoals || {}).forEach(y => { ys[y] = 1; });
    ys[String(new Date().getFullYear())] = 1;
    // ⚠️ Die Archivjahre kommen aus archivJahreZeigen(), NICHT aus Object.keys(state.weekStats)
    // und nie aus einem gerechneten Datum. sanitizeWeekStats() BEHAELT einen Jahrgang mehr,
    // als angeboten werden soll (archivJahreBehalten() = 3, archivJahreZeigen() = 2). Wer hier
    // ueber die vorhandenen Schluessel ginge, boete das Pufferjahr mit an — und der Puffer
    // waere keiner mehr. Begruendung am Fenster selbst, docs/ARCHITECTURES.md „Archivfenster".
    // Das Jahr kommt aus dem SCHLUESSEL-PRAEFIX ("2026-W01" liegt real im Dezember 2025) —
    // dieselbe Trimm-Regel wie in sanitizeWeekStats(), sonst zeigt der Umschalter Jahre an,
    // die dort weggeworfen wurden.
    const zeigen = archivJahreZeigen();
    Object.keys(state.weekStats || {}).forEach(k => {
      const y = k.slice(0, 4);
      if (zeigen.indexOf(y) !== -1) ys[y] = 1;
    });
    return Object.keys(ys).sort();
  }
  function activeYear() {
    const ys = weightYears();
    const y = String(state.viewYear || new Date().getFullYear());
    return ys.indexOf(y) !== -1 ? y : ys[ys.length - 1];
  }

  // Das Diagramm. Bewusst reines SVG ohne Bibliothek: die App laedt nichts nach, und bei
  // hoechstens ein paar hundert Punkten ist SVG ohnehin die richtige Wahl.
  // Die X-Achse steht FEST auf die zwoelf Monate und dehnt sich nicht nach den Daten.
  // Das ist der Grund, warum auch wenige Messungen hier ehrlich aussehen: die Skala kann
  // nicht ueber das Tempo luegen. Januar sitzt ganz links, Dezember ganz rechts - damit
  // endet auch die Ziellinie sichtbar am Dezember und laeuft nicht aus dem Bild.
  // Die Breite kommt als Pixelmass von aussen (siehe initWeightChart), damit eine
  // SVG-Einheit genau ein Bildschirmpunkt ist. Mit fester viewBox waere die Schrift
  // sonst auf dem Handy auf ein Drittel geschrumpft und am breiten Bildschirm riesig -
  // im Layout-Test war die Achsenbeschriftung dadurch unlesbar.
  const WCH = { PL: 42, PR: 22, PT: 14, PB: 26 };
  function weightChartSvg(year, rows, ziel, width) {
    const W = Math.max(260, Math.round(width || 600));
    // Hoehe an die Breite koppeln, aber gedeckelt: auf einem breiten Bildschirm waere
    // ein Diagramm mit fester Hoehe fast 5:1 flach und die Kurve darin gestaucht -
    // Veraenderungen von ein, zwei Kilo waeren nicht mehr abzulesen.
    const g = Object.assign({ W: W, H: Math.max(190, Math.min(300, Math.round(W * 0.42))) }, WCH);
    const plotW = g.W - g.PL - g.PR, plotH = g.H - g.PT - g.PB;
    // Wochennummer 1..52 auf die Breite verteilt (B2). Die Achse steht weiterhin FEST auf
    // das ganze Jahr und dehnt sich nicht nach den Daten - das ist der Grund, warum auch
    // wenige Messungen hier ehrlich aussehen: die Skala kann nicht ueber das Tempo luegen.
    const px = w => g.PL + ((w - 1) / 51) * plotW;

    let lo = Infinity, hi = -Infinity;
    rows.forEach(r => { lo = Math.min(lo, r.kg); hi = Math.max(hi, r.kg); });
    if (ziel != null) { lo = Math.min(lo, ziel); hi = Math.max(hi, ziel); }
    // Sonderfall: eine einzige Messung oder lauter gleiche Werte -> Spanne 0. Ohne diesen
    // Mindestabstand teilte die Skala durch null und das ganze Diagramm waere NaN.
    let pad = (hi - lo) * 0.18;
    if (!(pad > 0.05)) pad = 1.5;
    lo -= pad; hi += pad;
    // Auf runde Schritte aufziehen: "90 / 85 / 80" liest sich im Vorbeigehen, die
    // rechnerisch exakten Grenzen ergaeben "90,8 / 86,3 / 81,7" - Zahlen, die niemand
    // im Kopf zuordnet.
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    const py = kg => g.PT + (hi - kg) / (hi - lo) * plotH;

    // Waagerechtes Gitter, zurueckhaltend - es soll die Kurve stuetzen, nicht mit ihr
    // um Aufmerksamkeit ringen.
    let grid = "";
    for (let kg = lo; kg <= hi + step / 2; kg += step) {
      const y = py(kg);
      grid += `<line class="wch-grid" x1="${g.PL}" y1="${y.toFixed(1)}" x2="${g.W - g.PR}" y2="${y.toFixed(1)}"/>`
            + `<text class="wch-ay" x="${g.PL - 7}" y="${(y + 3.5).toFixed(1)}">${kgfmt(kg)}</text>`;
    }
    // Wochenachse: 52 Marken waeren Kaugummi, deshalb Monatsnamen an der Woche, in die
    // der Monatserste faellt. Die Bezugsgroesse ist die Woche, die LESBARKEIT bleibt
    // monatlich - man liest "Mär" und weiss, wo man ist, ohne Kalenderwochen im Kopf zu
    // haben. Auf schmalen Geraeten jeder zweite Monat, sonst ueberlappen die Marken.
    const wide = g.W >= 460;
    let months = "";
    for (let m = 0; m < 12; m++) {
      if (!wide && m % 2) continue;
      const w = weekNumOf(weightKeyNow(new Date(+year, m, 1)));
      // Der 1. Januar liegt oft noch in KW 52/53 des Vorjahres - dann ans linke Ende.
      const wx = (m === 0 && w > 50) ? 1 : w;
      months += `<text class="wch-ax" x="${px(wx).toFixed(1)}" y="${g.H - 10}">${MON_LONG[m].slice(0, 3)}</text>`;
    }

    // Ziellinie: vom ersten bekannten Stand des Jahres zum Wunschgewicht im Dezember.
    // Gestrichelt und in gedaempfter Farbe - die Serien unterscheiden sich damit auch
    // ohne Farbsehen, was eine reine Farbunterscheidung nicht leisten wuerde.
    // Der hohle Endpunkt ist wichtig: ohne ihn lief die Linie am Bildrand einfach aus
    // und sah aus, als ginge sie ins Unendliche weiter, statt im Dezember anzukommen.
    let zielEl = "";
    if (ziel != null && rows.length) {
      const zx = px(52), zy = py(ziel);
      zielEl = `<line class="wch-goal" x1="${px(weekNumOf(rows[0].m)).toFixed(1)}" y1="${py(rows[0].kg).toFixed(1)}"
          x2="${zx.toFixed(1)}" y2="${zy.toFixed(1)}"/>
        <circle class="wch-goal-dot" cx="${zx.toFixed(1)}" cy="${zy.toFixed(1)}" r="4.5"/>`;
    }

    const pts = rows.map(r => `${px(weekNumOf(r.m)).toFixed(1)},${py(r.kg).toFixed(1)}`).join(" ");
    const line = rows.length > 1 ? `<polyline class="wch-line" points="${pts}"/>` : "";
    // Gleitender Durchschnitt ueber vier Wochen (B2). Erst er macht wochengenaues Wiegen
    // brauchbar: eine einzelne Wiegung schwankt um mehr, als eine Woche Fortschritt
    // ausmacht - die Rohkurve zeigt dann Zacken, die nichts bedeuten. Gerechnet ueber die
    // letzten vier VORHANDENEN Messungen, nicht ueber vier Kalenderwochen: bei einer Luecke
    // waere der Schnitt sonst leer, obwohl es Werte gibt. Ab vier Messungen, darunter
    // gaebe es nichts zu glaetten.
    let avgLine = "";
    if (rows.length >= 4) {
      const ap = rows.map((r, i) => {
        const win = rows.slice(Math.max(0, i - 3), i + 1);
        const avg = win.reduce((a, x) => a + x.kg, 0) / win.length;
        return `${px(weekNumOf(r.m)).toFixed(1)},${py(avg).toFixed(1)}`;
      }).join(" ");
      avgLine = `<polyline class="wch-avg" points="${ap}"/>`;
    }
