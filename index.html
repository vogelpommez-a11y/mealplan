      const ing = (r.ingredients || []);
      const ingPreview = ing.length ? esc(ing.slice(0, 4).map(ingLabel).join(" · ")) + (ing.length > 4 ? " …" : "") : "Keine Zutaten hinterlegt";

        <div class="rbody">
        <div class="top">
          <h3>${esc(r.name)}</h3>
          ${isExample(r) ? `<span class="chip example" title="Mitgeliefertes Beispiel-Meal">Beispiel</span>` : ""}
        </div>
        <div class="meta">
          ${recipeNut(r).kcal ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4.4 4 8a4 4 0 0 1-8 0c0-1.3.4-2.1 1-3 .3 1 .8 1.6 1.5 1.9C10 8 10.4 5.4 12 3Z"/></svg>${nfmt(recipeNut(r).kcal)} kcal</span>` : ""}

        <div class="actions">
          <button class="btn ghost sm" data-action="view" data-id="${r.id}">${ACT_ICONS.view}Ansehen</button>
          ${canEdit() ? `<button class="btn ghost sm" data-action="edit" data-id="${r.id}">${ACT_ICONS.edit}Bearbeiten</button>` : ""}
          <span class="act-icons">
            <button class="btn ghost icon-gh" data-action="share-recipe" data-id="${r.id}" title="Meal teilen" aria-label="Meal teilen">${TOOL_ICONS.share}</button>
            ${canEdit() ? `<button class="btn del-ic" data-action="delete" data-id="${r.id}" title="Meal löschen" aria-label="Meal löschen">${ACT_ICONS.del}</button>` : ""}
            <button class="btn fav-ic${isFav(r.id) ? " on" : ""}" data-action="toggle-fav" data-id="${r.id}"
                    aria-pressed="${isFav(r.id)}"
                    title="${isFav(r.id) ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen"}"
                    aria-label="${isFav(r.id) ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen"}">${iconSvg("heart", "")}</button>

    }
    container.innerHTML = anyRendered ? html : `<p style="color:var(--text-muted);margin:0">Kein Meal gefunden.</p>`;
  }

  // ---------- Modal ----------
  const modalRoot = document.getElementById("modal-root");
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  let lastFocused = null;   // Element, das den Dialog geoeffnet hat
  function closeModal() {
    // Sicherheitsnetz: schliesst irgendetwas das Formular, waehrend der Live-Scanner
    // laeuft, darf die Kamera nicht weiterlaufen.
    if (liveScanStop) liveScanStop();
    groupModalRepaint = null;   // sonst zeichnete ein spaeterer Mitglieder-Snapshot in ein totes DOM
    modalRoot.innerHTML = "";
    document.removeEventListener("keydown", modalKeys);
    // Fokus dorthin zurueckgeben, wo er herkam - sonst landet er beim Schliessen am
    // Seitenanfang und Tastaturnutzer verlieren ihre Position.
    if (lastFocused && document.contains(lastFocused)) { try { lastFocused.focus(); } catch (e) {} }
    lastFocused = null;
  }
  // Escape schliesst; Tab bleibt im Dialog gefangen (sonst wandert der Fokus hinter
  // den Dialog in die Seite, die visuell gar nicht bedienbar ist).
  function modalKeys(e) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key !== "Tab") return;
    const box = modalRoot.querySelector(".modal");
    if (!box) return;
    const items = Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE), el => el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function openModal(node) {
    hoveredCardId = null;   // Maus steht ab jetzt ueber dem Overlay, nicht mehr auf einer Karte
    lastFocused = document.activeElement;
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("mousedown", e => { if (e.target === overlay) closeModal(); });
    overlay.appendChild(node);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
    document.addEventListener("keydown", modalKeys);
    const focusEl = node.querySelector("input, textarea, select, button");
    if (focusEl) setTimeout(() => focusEl.focus(), 30);
  }
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

  // Einheitlicher Ja/Nein-Dialog. Ersetzt fuenf fast identische Modal-Bloecke; damit
  // sehen Bestaetigungen ueberall gleich aus und verhalten sich gleich.
  //   title, text (oder bodyHtml fuer Auszeichnungen), okLabel, onConfirm
  function confirmModal(o) {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
      <div class="modal-head"><h3>${esc(o.title)}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">${o.bodyHtml || `<p style="margin:0">${esc(o.text || "")}</p>`}</div>
      <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn danger" data-confirm>${esc(o.okLabel || "Löschen")}</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("[data-confirm]").addEventListener("click", () => { closeModal(); o.onConfirm(); });
    openModal(node);
  }

  // ---------- Wiegen ----------
  // Ein Formular fuer beides: diesen Monat wiegen und frühere Monate nachtragen. Bewusst
  // zwei Auswahlfelder und kein <input type="month">: das kennt Safari auf dem iPhone
  // nicht und faellt dort auf ein nacktes Textfeld zurueck - ausgerechnet auf dem Geraet,
  // auf dem die App laufen soll.
  // manageOnly (Art. 9 DSGVO): ohne Einwilligung darf kein NEUER Eintrag entstehen, das
  // Recht auf Loeschung bestehender Eintraege bleibt aber unabhaengig davon bestehen -
  // deshalb Eingabefelder und "Speichern" ausblenden, die Liste mit den Loeschen-Knoepfen
  // bleibt unveraendert. Siehe weightConsentHtml() fuer den Aufrufweg ohne Einwilligung.
  function openWeighForm(manageOnly) {
    const nowY = new Date().getFullYear(), nowM = new Date().getMonth();
    const last = latestWeight();
    // Vorbelegt ist das Jahr, das gerade im Diagramm steht - nicht stur das laufende.
    // Wer ueber den Jahreswechsel auf „Ziele 2025" schaut und dort etwas nachtragen
    // will, muesste sonst erst zurueckschalten.
    const startY = activeYear();
    // Auswaehlbare Jahre: die letzten drei plus alle, in denen schon etwas steht.
    const yset = {};
    for (let i = 0; i < 3; i++) yset[nowY - i] = 1;
    yset[startY] = 1;
    (state.weights || []).forEach(e => { yset[e.m.slice(0, 4)] = 1; });
    const years = Object.keys(yset).sort().reverse();

    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="${manageOnly ? "Verlauf verwalten" : "Wiegen"}">
      <div class="modal-head"><h3>${manageOnly ? "Verlauf verwalten" : "Wiegen"}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        ${manageOnly ? "" : `<div class="field"><label for="w-kg">Gewicht</label>${numField({ id: "w-kg", min: KG_MIN, max: KG_MAX, step: 0.1, unit: "kg", placeholder: "kg", value: last ? String(last.kg) : "" })}</div>
        <div class="row2">
          <div class="field"><label for="w-m">Monat</label><select id="w-m"></select></div>
          <div class="field"><label for="w-y">Jahr</label><select id="w-y">
            ${years.map(y => `<option value="${y}"${y === startY ? " selected" : ""}>${y}</option>`).join("")}
          </select></div>
        </div>`}
        <div id="w-list"></div>
      </div>
      <div class="modal-foot">${manageOnly ? `<button class="btn primary" data-close>Fertig</button>` : `<button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="w-ok">Speichern</button>`}</div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));

    const mEl = node.querySelector("#w-m"), yEl = node.querySelector("#w-y");
    // Im laufenden Jahr enden die Monate beim aktuellen: ein Gewicht fuer den naechsten
    // Monat kann niemand gemessen haben.
    function fillMonths() {
      if (!mEl || !yEl) return;
      const sel = mEl.value;
      const maxM = +yEl.value === nowY ? nowM : 11;
      mEl.innerHTML = MON_LONG.slice(0, maxM + 1)
        .map((n, i) => `<option value="${String(i + 1).padStart(2, "0")}">${n}</option>`).join("");
      mEl.value = (sel && +sel <= maxM + 1) ? sel : String(maxM + 1).padStart(2, "0");
    }
    fillMonths();
    if (yEl) yEl.addEventListener("change", fillMonths);

    const listEl = node.querySelector("#w-list");
    function paintList() {
      const rows = (state.weights || []).slice().reverse();
      listEl.innerHTML = rows.length
        ? `<h4 style="margin:18px 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)">Verlauf</h4>`
          + rows.map(r => `<div class="wl-row"><span class="wl-d">${esc(monthLabel(r.m))}</span><span class="wl-k">${kgfmt(r.kg)} kg</span>
              <button class="btn ghost sm" data-del="${r.m}" aria-label="Eintrag ${esc(monthLabel(r.m))} löschen">✕</button></div>`).join("")
        : `<p class="wl-empty">Noch keine Messung.</p>`;
      listEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
        const m = b.dataset.del;
        // Loeschen der juengsten Wiegung kann syncGoalWeight() das Kalorienziel still neu
        // berechnen (Paket B6) - Vorher/Jetzt merken, um es sichtbar zu machen statt es
        // unbemerkt zu lassen. Fuer Rueckgaengig (Paket B1) reichen der Eintrag und das Ziel.
        const removedEntry = (state.weights || []).find(e => e.m === m);
        const oldKcal = state.goal ? state.goal.kcal : null;
        const oldGoal = state.goal;
        removeWeight(m);
        const newKcal = state.goal ? state.goal.kcal : null;
        save(); paintList(); render();
        const undo = () => {
          if (removedEntry) { state.weights = (state.weights || []).concat([removedEntry]).sort((a, b) => a.m < b.m ? -1 : 1); }
          state.goal = oldGoal;
          save(); paintList(); render();
        };
        if (oldKcal != null && newKcal != null && oldKcal !== newKcal && removedEntry) {
          goalAdjustModal("Kalorienziel angepasst", oldKcal, newKcal, "Du hast eine Wiegung gelöscht, dein Energiebedarf wurde neu berechnet.", undo);
        } else {
          undoToast("Wiegung gelöscht", undo);
        }
      }));
    }
    paintList();

    if (manageOnly) { openModal(node); return; }

    node.querySelector("#w-ok").addEventListener("click", () => {
      const kgEl = node.querySelector("#w-kg");
      // nutParse akzeptiert Komma wie Punkt - auf deutschen Tastaturen wird das Komma getippt.
      const kg = nutParse(kgEl.value);
      if (!(kg >= KG_MIN && kg <= KG_MAX)) { kgEl.focus(); kgEl.style.borderColor = "var(--danger)"; toast("Bitte ein Gewicht zwischen " + KG_MIN + " und " + KG_MAX + " kg eintragen"); return; }
      const m = yEl.value + "-" + mEl.value;
      if (!validMonthKey(m) || m > monthKey()) { toast("Bitte einen Monat bis heute wählen"); return; }
      const neu = !(state.weights || []).some(e => e.m === m);
      const oldKcal = state.goal ? state.goal.kcal : null;
      setWeight(m, kg);
      const newKcal = state.goal ? state.goal.kcal : null;
      // Auf das Jahr springen, in das der Eintrag gehoert - sonst traegt man den Januar
      // nach und sieht ihn nicht, weil noch ein anderes Jahr im Bild steht.
      state.viewYear = +yEl.value;
      save(); closeModal(); render();
      if (oldKcal != null && newKcal != null && oldKcal !== newKcal) {
        goalAdjustModal(`Neues Gewicht: ${kgfmt(kg)} kg`, oldKcal, newKcal, "Dein Körpergewicht hat sich verändert und dein Energiebedarf wurde neu berechnet.");
      } else {
        toast(m === monthKey() ? "Gewicht gespeichert" : (neu ? "Nachgetragen: " : "Geändert: ") + monthLabel(m));
      }
    });
    openModal(node);
  }

  // Zeigt nach dem Wiegen, falls syncGoalWeight() das Kalorienziel neu berechnet hat,
  // Vorher/Jetzt/Differenz - sonst merkt der Nutzer die stille Neuberechnung nicht.
  // undoFn optional (Paket B1): bei der geloeschten Wiegung faellt sonst gleichzeitig ein Toast
  // MIT Rueckgaengig-Knopf und dieser Dialog an - "zwei Dinge gleichzeitig waeren zu viel" (gleiche
  // Ueberlegung wie beim Teilen-Modal, das das Onboarding zurueckstellt). Das Rueckgaengig steckt
  // hier stattdessen im Dialog selbst.
  function goalAdjustModal(title, oldKcal, newKcal, reason, undoFn) {
    const diff = newKcal - oldKcal;
    const sign = diff > 0 ? "+" : "−";
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Kalorienziel angepasst">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 4px">Dein Kalorienziel wurde angepasst:</p>
        <div class="bd-row"><span>Vorher</span><span>${nfmt(oldKcal)} kcal</span></div>
        <div class="bd-row"><span>Jetzt</span><span>${nfmt(newKcal)} kcal</span></div>
        <div class="bd-row bd-mid"><span>Änderung</span><span>${sign}${nfmt(Math.abs(diff))} kcal</span></div>
        <p class="tdays-note" style="margin-bottom:0">Grund: ${esc(reason)}</p>
      </div>
      <div class="modal-foot">${undoFn ? `<button class="btn ghost" data-undo>Rückgängig</button>` : ""}<button class="btn primary" data-close>Alles klar</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    if (undoFn) { const ub = node.querySelector("[data-undo]"); if (ub) ub.addEventListener("click", () => { closeModal(); undoFn(); }); }
    openModal(node);
  }

  // Jahres-Zielgewicht. Eigener kleiner Dialog, weil es genau ein Feld ist und nicht in
  // jedem Wiegen-Vorgang im Weg stehen soll.
  function openWeightGoalForm() {
    const year = activeYear();
    const cur = (state.weightGoals || {})[year];
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Jahresziel ${year}">
      <div class="modal-head"><h3>Ziel ${year}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <div class="field"><label for="wg-kg">Wunschgewicht zum Jahresende</label>${numField({ id: "wg-kg", min: KG_MIN, max: KG_MAX, step: 0.1, unit: "kg", placeholder: "kg", value: cur != null ? String(cur) : "" })}</div>
      </div>
      <div class="modal-foot">
        ${cur != null ? `<button class="btn ghost" id="wg-del">Ziel entfernen</button>` : `<button class="btn ghost" data-close>Abbrechen</button>`}
        <button class="btn primary" id="wg-ok">Speichern</button>
      </div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const del = node.querySelector("#wg-del");
    if (del) del.addEventListener("click", () => {
      delete state.weightGoals[year]; save(); closeModal(); render(); toast("Jahresziel entfernt");
    });
    node.querySelector("#wg-ok").addEventListener("click", () => {
      const inp = node.querySelector("#wg-kg");
      const kg = nutParse(inp.value);
      if (!(kg >= KG_MIN && kg <= KG_MAX)) { inp.focus(); inp.style.borderColor = "var(--danger)"; toast("Bitte ein Gewicht zwischen " + KG_MIN + " und " + KG_MAX + " kg eintragen"); return; }
      if (!state.weightGoals) state.weightGoals = {};
      state.weightGoals[year] = Math.round(kg * 10) / 10;
      save(); closeModal(); render(); toast("Ziel für " + year + " gespeichert");
    });

  }

    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));

    // --- Zutaten-Zeilen (Name, Menge, Naehrwerte pro 100 g, Barcode-Scan) ---

    function nutVal(v) { return v != null ? esc(v) : ""; }
    function addIngRow(o) {

      if (o.unit == null && node.querySelector("#f-cat").value === "Getränk") o.unit = "ml";
      const u = ingUnit(o);

            <span class="ing-brief"></span>
          </summary>
          <div class="ing-vals">
            <label class="t-kcal"><span class="ing-lbl">Kcal</span><input type="number" class="ing-kcal" min="0" max="9999" step="1" value="${nutVal(o.kcal)}"></label>
            <label class="t-carb"><span class="ing-lbl">KH</span><input type="number" class="ing-carbs" min="0" max="999" step="0.1" value="${nutVal(o.carbs)}"></label>
            <label class="t-prot"><span class="ing-lbl">P</span><input type="number" class="ing-prot" min="0" max="999" step="0.1" value="${nutVal(o.protein)}"></label>
            <label class="t-fat"><span class="ing-lbl">F</span><input type="number" class="ing-fat" min="0" max="999" step="0.1" value="${nutVal(o.fat)}"></label>
          </div>
        </details>
      </div>`);
      row.querySelector(".ing-del").addEventListener("click", () => { row.remove(); updateMacroSum(); });
      row.querySelector(".ing-barcode").addEventListener("click", () => { startBarcodeFlow(row); });
      // Kurzfassung fuer die zugeklappte Zeile. Die vier Felder bleiben im DOM und
      // werden nur ausgeblendet - rowData() liest sie unveraendert ueber .value.
      function paintNut() {
        const g = sel => nutParse(row.querySelector(sel).value);
        // Eine Nachkommastelle behalten: nfmt() rundet auf ganze Zahlen und machte
        // aus 0,6 g Fett eine 1.
        const nz = v => (Math.round(v * 10) / 10).toLocaleString("de-DE");
        const k = g(".ing-kcal"), kh = g(".ing-carbs"), p = g(".ing-prot"), fa = g(".ing-fat");
        const t = [];
        if (k != null) t.push(`<span class="ing-lbl t-kcal">${nfmt(k)} kcal</span>`);
        if (kh != null) t.push(`<span class="ing-lbl t-carb">${nz(kh)} KH</span>`);
        if (p != null) t.push(`<span class="ing-lbl t-prot">${nz(p)} P</span>`);
        if (fa != null) t.push(`<span class="ing-lbl t-fat">${nz(fa)} F</span>`);
        // "–" statt eines Aufforderungstexts: Der Pfeil rechts zeigt bereits, dass sich
        // die Zeile oeffnen laesst, und "eintragen" war nicht zu unterscheiden von einem
        // Zustand ("leer"). Gleiches Zeichen wie beim leeren Auswahlrad im Onboarding.
        // k/kh/p/fa sind Zahlen aus nfmt()/nz() (kein Nutzertext) - innerHTML ist hier sicher.
        row.querySelector(".ing-brief").innerHTML = t.length ? t.join("") : "–";
      }
      row.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => { updateMacroSum(); paintNut(); }));
      // Einheit umstellen: Bezugsgroesse der Naehrwerte mitziehen. Bei Stueck gibt es keine
      // 100er-Basis — der Barcode-Scan liefert aber immer pro 100 g und stellt die Einheit
      // ohnehin selbst zurueck, deshalb bleibt der Knopf hier sichtbar.
      const uSel = row.querySelector(".ing-u");
      // Feste Umrechnung beim Wechsel zwischen "pro-100"-Einheiten (g/ml) und
      // Loeffelmassen (EL/TL) - 1 EL = 15 ml/g, 1 TL = 5 ml/g (Kuechen-Konvention,
      // Naeherung fuer Fluessigkeiten wie Feststoffe gleichermassen). "st" bleibt aussen
      // vor, wie bisher schon keine feste Bezugsgroesse.
      const UNIT_BASIS = { g: 100, ml: 100, el: 15, tl: 5 };
      let prevUnit = u; // Einheit VOR dem Wechsel, fuer die Umrechnung noetig
      function convertNutValues(oldUnit, newUnit) {
        if (oldUnit === newUnit || !(oldUnit in UNIT_BASIS) || !(newUnit in UNIT_BASIS)) return;
        const ratio = UNIT_BASIS[newUnit] / UNIT_BASIS[oldUnit];
        const kcalEl = row.querySelector(".ing-kcal"), carbsEl = row.querySelector(".ing-carbs"),
              protEl = row.querySelector(".ing-prot"), fatEl = row.querySelector(".ing-fat");
        const k = nutParse(kcalEl.value), kh = nutParse(carbsEl.value), p = nutParse(protEl.value), fa = nutParse(fatEl.value);
        if (k != null) kcalEl.value = Math.round(k * ratio);
        if (kh != null) carbsEl.value = Math.round(kh * ratio * 10) / 10;
        if (p != null) protEl.value = Math.round(p * ratio * 10) / 10;
        if (fa != null) fatEl.value = Math.round(fa * ratio * 10) / 10;
      }
      function syncUnit() {
        const cur = uSel.value;
        row.querySelector(".ing-per").textContent = ingPerLabel(cur);
        row.querySelector(".ing-g").placeholder = cur === "st" ? "2" : "200";
        updateMacroSum();
        paintNut();
      }
      // Umrechnung nur bei echtem Nutzer-Wechsel (change-Event) - nicht beim initialen
      // Zeilenaufbau und nicht in acPick() (setzt Einheit+Werte direkt aus der
      // Zutaten-Datenbank, ruft syncUnit() ohne change-Event auf).
      uSel.addEventListener("change", () => {
        const newUnit = uSel.value;
        convertNutValues(prevUnit, newUnit);
        prevUnit = newUnit;
        syncUnit();
      });
      syncUnit();

      // --- Zutaten-Suche (ARIA-Combobox auf dem Namensfeld) ---
      // Sucht in FOODS und fuellt bei Auswahl Einheit und alle vier Naehrwerte. Wer nichts
      // auswaehlt, tippt wie bisher frei weiter — die Liste ist ein Angebot, kein Zwang.
      const nameInp = row.querySelector(".ing-name");
      const acBox = row.querySelector(".ing-ac");
      const acId = "ing-ac-" + (++acSeq);
      acBox.id = acId;
      nameInp.setAttribute("role", "combobox");
      nameInp.setAttribute("aria-expanded", "false");
      nameInp.setAttribute("aria-autocomplete", "list");
      nameInp.setAttribute("aria-controls", acId);
      let acHits = [], acCur = -1, acOpen = false;
      function acClose() {
        if (!acOpen) return;
        acOpen = false; acCur = -1;
        acBox.hidden = true;
        row.classList.remove("ac-open");
        nameInp.setAttribute("aria-expanded", "false");
        nameInp.removeAttribute("aria-activedescendant");
      }
      function acMark(i) {
        acCur = i;
        Array.prototype.forEach.call(acBox.children, (li, n) => {
          const on = n === i;
          li.classList.toggle("on", on);
          li.setAttribute("aria-selected", on ? "true" : "false");
        });
        if (i >= 0) {
          nameInp.setAttribute("aria-activedescendant", acId + "-" + i);
          const li = acBox.children[i];
          if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
        } else nameInp.removeAttribute("aria-activedescendant");
      }
      function acShow() {
        acHits = foodSearch(nameInp.value, 8);
        if (!acHits.length) { acClose(); return; }
        acBox.innerHTML = acHits.map((f, n) =>
          `<li class="ing-ac-item" role="option" aria-selected="false" id="${acId}-${n}">` +
          `<span class="fname">${esc(f.name)}</span>` +
          `<span class="fnut">${nfmt(f.kcal)} kcal · ${f.unit === "st" ? "je Stück" : "je 100 " + f.unit}</span></li>`).join("");
        acBox.hidden = false; acOpen = true;
        row.classList.add("ac-open");
        nameInp.setAttribute("aria-expanded", "true");
        acMark(-1);
      }
      function acPick(i) {
        const f = acHits[i];
        if (!f) return;
        nameInp.value = f.name;
        uSel.value = f.unit;
        prevUnit = f.unit; // sonst wuerde ein direkt folgender manueller Wechsel mit einer veralteten Ausgangseinheit umrechnen
        row.querySelector(".ing-kcal").value = f.kcal;
        row.querySelector(".ing-carbs").value = f.carbs;
        row.querySelector(".ing-prot").value = f.protein;
        row.querySelector(".ing-fat").value = f.fat;
        acClose();
        syncUnit(); // zieht Bezugsgroesse, Scan-Button und die Makro-Summe nach
        row.querySelector(".ing-g").focus(); // jetzt fehlt nur noch die Menge
      }
      nameInp.addEventListener("input", acShow);
      nameInp.addEventListener("blur", acClose);
      nameInp.addEventListener("keydown", e => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (!acOpen) { acShow(); if (!acOpen) return; }
          e.preventDefault();
          let n = acCur + (e.key === "ArrowDown" ? 1 : -1);
          if (n < 0) n = acHits.length - 1;
          if (n >= acHits.length) n = 0;
          acMark(n);
        } else if (e.key === "Enter" && acOpen && acCur >= 0) {
          e.preventDefault(); acPick(acCur);
        } else if (e.key === "Escape" && acOpen) {
          e.preventDefault();
          e.stopPropagation(); // nur die Liste schliessen, nicht das ganze Modal
          acClose();
        } else if (e.key === "Tab") acClose();
      });
      // mousedown abfangen: sonst verliert das Feld den Fokus und blur schliesst die
      // Liste, bevor der Klick ueberhaupt ankommt.
      acBox.addEventListener("mousedown", e => e.preventDefault());
      acBox.addEventListener("click", e => {
        const li = e.target.closest(".ing-ac-item");
        if (li) acPick(Array.prototype.indexOf.call(acBox.children, li));
      });

      ingsWrap.appendChild(row);
      return row;
    }
    function rowData(row) {
      const name = row.querySelector(".ing-name").value.trim();
      if (!name) return null;
      const o = { name };
      const grams = nutParse(row.querySelector(".ing-g").value);
      const kcal = nutParse(row.querySelector(".ing-kcal").value);
      const carbs = nutParse(row.querySelector(".ing-carbs").value);
      const protein = nutParse(row.querySelector(".ing-prot").value);
      const fat = nutParse(row.querySelector(".ing-fat").value);
      if (grams == null && kcal == null && carbs == null && protein == null && fat == null) return name; // reiner Freitext wie frueher
      const unit = row.querySelector(".ing-u").value;
      if (grams != null) o.grams = grams;
      if (unit !== "g") o.unit = unit; // "g" ist Default und bleibt ungespeichert
      if (kcal != null) o.kcal = kcal;
      if (carbs != null) o.carbs = carbs;
      if (protein != null) o.protein = protein;
      if (fat != null) o.fat = fat;
      return o;
    }
    function collectIngs() { return Array.from(ingsWrap.querySelectorAll(".ing-row")).map(rowData).filter(Boolean); }
    // Summe aller Zutaten (auf Menge hochgerechnet) → Makro-Felder; die Felder bleiben
    // dabei IMMER von Hand editierbar (frueher gesperrt, solange Zutaten Naehrwerte
    // hatten). Tippt der Nutzer selbst hinein, gilt sein Wert ab da als Uebersteuerung
    // und wird von weiteren Zutaten-Aenderungen nicht mehr ueberschrieben, bis er per
    // "Automatisch uebernehmen" wieder zurueckgesetzt wird.
    let macroOverridden = false;
    function updateMacroSum() {
      const withNut = collectIngs().filter(i => typeof i === "object" && nutNum(i.grams) && ingHasNut(i));
      const auto = withNut.length > 0;
      if (auto && !macroOverridden) {
        let s = { kcal: 0, carbs: 0, protein: 0, fat: 0 };
        withNut.forEach(i => { s = addNut(s, ingContrib(i)); });
        node.querySelector("#f-kcal").value = Math.round(s.kcal);
        node.querySelector("#f-carbs").value = Math.round(s.carbs * 10) / 10;
        node.querySelector("#f-protein").value = Math.round(s.protein * 10) / 10;
        node.querySelector("#f-fat").value = Math.round(s.fat * 10) / 10;
      }
      const hint = node.querySelector("#f-nut-hint");
      const resetBtn = node.querySelector("#f-nut-reset");
      if (auto && macroOverridden) { hint.textContent = "– manuell angepasst"; resetBtn.hidden = false; }
      else if (auto) { hint.textContent = "– Summe aus deinen Zutaten (automatisch)"; resetBtn.hidden = true; }
      else { hint.textContent = "– mit Zutaten-Nährwerten automatisch summiert"; resetBtn.hidden = true; }
      // "+ Weitere Zutat" erst zeigen, wenn die erste Zutat einen Namen hat - sonst wirkt
      // das Formular ueberladen, bevor ueberhaupt etwas eingetragen wurde.
      node.querySelector("#f-ing-add").hidden = ![...ingsWrap.querySelectorAll(".ing-name")].some(inp => inp.value.trim());
    }
    ["f-kcal", "f-carbs", "f-protein", "f-fat"].forEach(fid => {
      node.querySelector("#" + fid).addEventListener("input", () => { macroOverridden = true; updateMacroSum(); });
    });
    node.querySelector("#f-nut-reset").addEventListener("click", () => { macroOverridden = false; updateMacroSum(); });
    (r && r.ingredients && r.ingredients.length ? r.ingredients : [null]).forEach(i => addIngRow(i == null ? null : ingObj(i)));
    updateMacroSum();
    node.querySelector("#f-ing-add").addEventListener("click", () => { addIngRow().querySelector(".ing-name").focus(); });
    // Kategorie -> Getraenk gewechselt: noch unberuehrte Zutatenzeilen (kein Name, keine
    // Menge, Einheit noch auf dem "g"-Default) auf ml umstellen. Bereits befuellte Zeilen
    // bleiben unangetastet, damit keine bewusst gewaehlte Einheit ueberschrieben wird.
    node.querySelector("#f-cat").addEventListener("change", (e) => {
      if (e.target.value !== "Getränk") return;
      ingsWrap.querySelectorAll(".ing-row").forEach(row => {
        const nameEl = row.querySelector(".ing-name"), gEl = row.querySelector(".ing-g"), uEl = row.querySelector(".ing-u");
        if (!nameEl.value && !gEl.value && uEl.value === "g") { uEl.value = "ml"; uEl.dispatchEvent(new Event("change")); }
      });
    });
    // Barcode -> Open Food Facts -> Zeile fuellen. Gemeinsamer Weg fuer beide Zugaenge
    // (Live-Kamera und Einzelfoto). Der Scan ersetzt die Zeile vollstaendig: Einheit
    // (OFF normiert alles auf 100 g), alle vier Naehrwerte UND den Namen. Den Namen
    // auszunehmen waere inkonsequent — er ist die Identitaet des gescannten Produkts,
    // keine persoenliche Notiz. Liefert der Treffer keinen Namen, bleibt der bisherige
    // stehen, statt ihn gegen nichts zu tauschen. Die Rueckmeldung nennt das erkannte
    // Produkt, damit ein ersetzter Name nicht wortlos verschwindet.
    async function applyBarcode(row, code) {
      const btn = row.querySelector(".ing-barcode");
      btn.disabled = true; btn.classList.add("busy");
      toast("Suche Produkt …");
      try {
        const p = await fetchOffNutrition(code);
        if (!p) { toast("Produkt nicht gefunden – bitte manuell eintragen"); return; }
        if (p.name) row.querySelector(".ing-name").value = p.name;
        // Reihenfolge bewusst so: das change-Event fuer die Einheit laeuft ZUERST, waehrend
        // die Naehrwertfelder noch ihre ALTEN Werte tragen - eine dabei ausgeloeste Umrechnung
        // (convertNutValues, z. B. falls die Zeile zuvor auf EL/TL stand) betrifft dann nur
        // Werte, die im naechsten Moment ohnehin durch die echten Barcode-Werte ueberschrieben
        // werden. Wuerden die Naehrwerte VOR dem change-Event gesetzt, liefe die
        // EL/TL-Umrechnung auf den frisch gesetzten (schon korrekten Pro-100g-)Werten und
        // wuerde sie verfaelschen.
        row.querySelector(".ing-u").value = "g";
        row.querySelector(".ing-u").dispatchEvent(new Event("change"));
        if (p.kcal != null) row.querySelector(".ing-kcal").value = Math.round(p.kcal);
        if (p.carbs != null) row.querySelector(".ing-carbs").value = p.carbs;
        if (p.protein != null) row.querySelector(".ing-prot").value = p.protein;
        if (p.fat != null) row.querySelector(".ing-fat").value = p.fat;
        // Paket B7 (Fund beim Durchsehen): .value setzen loest kein "input"-Event aus (das
        // tut nur echte Tastatureingabe) - die zugeklappte Kurzfassung der Zeile (paintNut,
        // reagiert auf "input") zeigte nach einem Barcode-Scan deshalb weiterhin "–", obwohl
        // die Werte laengst korrekt im DOM standen. Ein manuelles "input" auf einem der Felder
        // stoesst die Kurzfassung an, OHNE erneut ueber das Einheiten-change-Event (und damit
        // die Umrechnung) zu laufen.
        row.querySelector(".ing-kcal").dispatchEvent(new Event("input"));
        updateMacroSum();
        toast(p.name ? "„" + p.name + "“ übernommen – Werte bitte kurz prüfen"
                     : "Nährwerte übernommen – bitte kurz prüfen");
      } catch (e) {
        toast("Suche nicht möglich (offline?) – bitte manuell eintragen");
      } finally {
        btn.disabled = false; btn.classList.remove("busy");
      }
    }
    // Einstieg ueber den Zeilen-Button: erst Live-Kamera; wer dort aufs Foto ausweicht
    // (oder wessen Kamera nicht startet), landet auf dem bisherigen Foto-Weg.
    async function startBarcodeFlow(row) {
      const r = await scanBarcodeLive();
      if (!r || r.cancelled) return;
      if (!row.isConnected) return; // Zeile inzwischen entfernt
      if (r.photo) { barcodeRow = row; barcodeInput.click(); return; }
      if (r.code) await applyBarcode(row, r.code);
    }
    // Foto-Weg: Bild -> Code lokal auslesen -> gemeinsamer Nachschlage-Pfad
    barcodeInput.addEventListener("change", async () => {
      const f = barcodeInput.files && barcodeInput.files[0];
      barcodeInput.value = "";
      const row = barcodeRow; barcodeRow = null;
      if (!f || !row || !row.isConnected) return;
      const btn = row.querySelector(".ing-barcode");
      btn.disabled = true; btn.classList.add("busy");
      toast("Lese Barcode …");
      let code = null, failed = false;
      try {
        code = await detectBarcode(f);
      } catch (e) {
        failed = true;
        toast("Erkennung nicht möglich (offline?) – bitte manuell eintragen");
      } finally {
        btn.disabled = false; btn.classList.remove("busy");
      }
      if (failed) return;
      if (!code) { toast("Kein Barcode erkannt – bitte näher heran oder manuell eintragen"); return; }
      await applyBarcode(row, code);
    });

    node.querySelector("[data-save]").addEventListener("click", () => {
      const name = node.querySelector("#f-name").value.trim();
      if (!name) { node.querySelector("#f-name").focus(); node.querySelector("#f-name").style.borderColor = "var(--danger)"; toast("Bitte gib einen Namen ein"); return; }
      const ingredients = collectIngs();
      const nutrition = {
        kcal: nutParse(node.querySelector("#f-kcal").value),
        carbs: nutParse(node.querySelector("#f-carbs").value),
        protein: nutParse(node.querySelector("#f-protein").value),
        fat: nutParse(node.querySelector("#f-fat").value),
      };
      const hasAnyNut = nutrition.kcal != null || nutrition.carbs != null || nutrition.protein != null || nutrition.fat != null;
      // Portionen/Minuten sind bewusst entfallen (ein Meal = eine Portion); das Meal-Bild
      // wird nicht mehr hier, sondern ueber das "+" auf der Meal-Karte gepflegt.
      const data = {
        name,
        category: node.querySelector("#f-cat").value,
        nutrition: hasAnyNut ? nutrition : null,
        ingredients,
        steps: node.querySelector("#f-steps").value.trim(),
      };
      // In einer Gruppe merkt sich ein neues Meal, WER es angelegt hat - nur die uid,
      // nie den Namen (siehe recipeAuthorHtml). Beim Bearbeiten bleibt der Urheber stehen:
      // wer ein fremdes Meal anpasst, wird dadurch nicht zum Autor.
      if (r) { Object.assign(r, data); toast("Meal gespeichert"); }
      else { state.recipes.push(Object.assign({ id: uid() }, data, syncGid ? { by: syncUid } : null)); toast("Meal angelegt"); }
      closeModal(); render();
    });
    openModal(node);
  }

  // ---------- Recipe detail ----------
  function openRecipeDetail(id) {
    const r = getRecipe(id); if (!r) return;
    const cls = CAT_CLASS[r.category] || "cat-x";
    const ing = r.ingredients && r.ingredients.length
      ? `<ul>${r.ingredients.map(i => `<li>${esc(ingLabel(i))}${ingHasNut(i) && nutNum(ingObj(i).grams) ? ` <span style="color:var(--text-muted);font-size:12px">· ${nfmt(ingContrib(i).kcal)} kcal</span>` : ""}</li>`).join("")}</ul>`
      : `<p style="color:var(--text-muted);margin:0">Keine Zutaten hinterlegt.</p>`;
    const node = el(`<div class="modal detail" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
      <div class="modal-head">
        <div style="flex:1"><div class="kicker">Meal</div><h3 style="margin-top:2px">${esc(r.name)}</h3></div>
        <span class="chip ${cls}">${esc(r.category || "Gericht")}</span>
        <button class="btn ghost sm" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div class="dbanner has-photo"><img class="rphoto" src="${photoFor(r)}" alt="${esc(r.name)}"></div>
        ${nutFactsHtml(r)}
        <div class="dsec"><h4>Zutaten</h4>${ing}</div>
        ${r.steps ? `<div class="dsec"><h4>Zubereitung</h4><div class="steps">${esc(r.steps)}</div></div>` : ""}
      </div>
      <div class="modal-foot">
        ${canEdit() ? `<button class="btn" data-edit>${ACT_ICONS.edit}Bearbeiten</button>` : ""}
        <button class="btn" data-share>${TOOL_ICONS.share}Teilen</button>
        ${canEdit() ? `<button class="btn danger" data-del>${ACT_ICONS.del}Löschen</button>` : ""}
        <button class="btn primary" data-close>Schließen</button>
      </div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    // Beim Nur-Ansehen stehen die beiden Knoepfe gar nicht erst da (siehe oben).
    const editBtn = node.querySelector("[data-edit]");
    if (editBtn) editBtn.addEventListener("click", () => { closeModal(); openRecipeForm(r.id); });
    node.querySelector("[data-share]").addEventListener("click", () => { closeModal(); openShareRecipe(r.id); });
    const delBtn = node.querySelector("[data-del]");
    if (delBtn) delBtn.addEventListener("click", () => { closeModal(); deleteRecipe(r.id); });
    openModal(node);
  }

  // ---------- Picker ----------
  function openPicker(day, meal) {
    const dLabel = DAYS.find(d => d.key === day).label;
    const mLabel = MEALS.find(m => m.key === meal).label;
    if (state.recipes.length === 0) {
      const node = el(`<div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head"><h3>Noch keine Meals</h3><button class="btn ghost sm" data-close>✕</button></div>
        <div class="modal-body"><p style="margin:0;color:var(--text-muted)">Du hast noch keine Meals angelegt. Wechsle in den Reiter <strong>Meals</strong> und leg zuerst ein Meal an.</p></div>
        <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" data-go>Zu den Meals</button></div>
      </div>`);
      node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
      node.querySelector("[data-go]").addEventListener("click", () => { closeModal(); state.tab = "recipes"; render(); openRecipeForm(null); });
      openModal(node);
      return;
    }
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Meal wählen">
      <div class="modal-head"><div style="flex:1"><div class="kicker">${esc(dLabel)} · ${esc(mLabel)}</div><h3 style="margin-top:2px">Meal wählen</h3></div><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body">
        <div class="picker-search"><input type="text" id="p-search" placeholder="Meal suchen …" autocomplete="off"></div>
        <div class="plist" id="p-list"></div>
      </div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));

    const listEl = node.querySelector("#p-list");
    const searchEl = node.querySelector("#p-search");
    const mealCat = MEALS.find(m => m.key === meal).label;
    let showAll = false;

    function paint(q) {
      const query = (q || "").toLowerCase().trim();
      let list = state.recipes.slice().sort((a, b) => a.name.localeCompare(b.name, "de"));
      if (query) list = list.filter(r => r.name.toLowerCase().includes(query) || (r.category || "").toLowerCase().includes(query));
      const hidden = list.filter(r => !catFitsMeal(r.category, meal)).length;
      if (!showAll) list = list.filter(r => catFitsMeal(r.category, meal));
      // Favoriten zuerst, dann die zum Slot passende Kategorie. sort() ist stabil, die
      // Namenssortierung von oben bleibt damit innerhalb beider Gruppen erhalten.
      list.sort((a, b) => {
        const fa = isFav(a.id) ? 0 : 1, fb = isFav(b.id) ? 0 : 1;
        if (fa !== fb) return fa - fb;
        const sa = catSuggestsMeal(a.category, meal) ? 0 : 1, sb = catSuggestsMeal(b.category, meal) ? 0 : 1;
        return sa - sb;
      });
      const more = hidden > 0
        ? `<div class="pmore">
             <span>${hidden} Meal${hidden === 1 ? " passt" : "s passen"} nicht zu ${esc(mealCat)}</span>
             <button class="btn ghost sm" data-toggle-all>${showAll ? "Nur passende" : "Alle anzeigen"}</button>
           </div>`
        : "";
      if (list.length === 0) {
        listEl.innerHTML = `<p style="color:var(--text-muted);padding:8px 4px;margin:0">Kein passendes Meal gefunden.</p>${more}`;
      } else {
        listEl.innerHTML = list.map(r => {
          const suggest = catSuggestsMeal(r.category, meal) ? " suggest" : "";
          const off = catFitsMeal(r.category, meal) ? "" : " offcat";
          return `<button class="pitem${suggest}${off}" data-assign="${r.id}">
            ${thumbHtml(r, "pthumb")}
            <span class="pn">${esc(r.name)}</span>
            ${isFav(r.id) ? `<span class="pfav" aria-hidden="true">${iconSvg("heart", "")}</span>` : ""}
            <span class="pc">${esc(r.category || "")}</span>
          </button>`;
        }).join("") + more;
      }
      const toggle = listEl.querySelector("[data-toggle-all]");
      if (toggle) toggle.addEventListener("click", () => { showAll = !showAll; paint(searchEl.value); });
      listEl.querySelectorAll("[data-assign]").forEach(b => b.addEventListener("click", () => {
        state.plan[day][meal].push(b.dataset.assign);
        closeModal(); render(); toast("Zum Plan hinzugefügt");
      }));
    }
    searchEl.addEventListener("input", () => paint(searchEl.value));
    paint("");
    openModal(node);
  }

  // ---------- Shopping list ----------
  // Grobe Warengruppen fuer die Einkaufsliste (Stichwort-Matching wie PHOTO_RULES).
  // Reihenfolge = Pruef- UND Anzeigereihenfolge (grob wie ein Supermarkt-Rundgang);
  // die zuerst passende Gruppe gewinnt. Stichwoerter mit < 4 Zeichen matchen nur als
  // ganzes Wort, laengere per Wortanfang/-ende (deutsche Komposita), aber nie in der
  // Wortmitte -- so schnappt "reis" nicht in "Preiselbeere", "eis" nicht in "Rindfleisch".
  // Erweitern: einfach Stichwoerter in die passende Liste eintragen (klein, ss statt ss/ß).
  const SHOP_CATS = [
    { key: "gemuese", title: "Obst & Gemüse", icon: "🥬", kw: ["zwiebel","knoblauch","schalotte","paprika","tomate","tomaten","tomatenmark","karotte","möhre","moehre","zucchini","gurke","salat","rucola","spinat","brokkoli","blumenkohl","kartoffel","süsskartoffel","pilz","champignon","lauch","porree","sellerie","kohl","kürbis","kuerbis","aubergine","bohne","bohnen","erbse","erbsen","zuckerschote","zuckererbse","mais","avocado","ingwer","chili","kohlrabi","fenchel","spargel","radieschen","rettich","bete","kresse","apfel","äpfel","aepfel","banane","zitrone","limette","orange","clementine","mandarine","beere","beeren","himbeer","erdbeer","heidelbeer","blaubeer","brombeer","traube","trauben","birne","mango","pfirsich","nektarine","aprikose","ananas","melone","kiwi","pflaume","kirsche","feige","petersilie","basilikum","schnittlauch","koriander","minze"] },
    { key: "fleisch", title: "Fleisch & Fisch", icon: "🥩", kw: ["hackfleisch","hack","fleisch","hähnchen","haehnchen","huhn","hühner","huehner","hühnchen","pute","puten","rind","schwein","kalb","lamm","schnitzel","gulasch","steak","filet","wurst","würstchen","wuerstchen","bratwurst","speck","schinken","salami","bacon","mett","hackbraten","frikadelle","bulette","geschnetzeltes","leberkäse","leberkaese","cabanossi","chorizo","lachs","thunfisch","garnele","garnelen","shrimp","scampi","fisch","forelle","kabeljau","dorsch","seelachs","hering","makrele","sardine","sardellen","muschel","surimi"] },
    { key: "milch", title: "Milchprodukte & Eier", icon: "🧀", kw: ["milch","butter","sahne","joghurt","jogurt","quark","käse","kaese","gouda","mozzarella","parmesan","feta","frischkäse","frischkaese","schmand","ei","eier","eiweiss","eigelb","margarine","buttermilch","mascarpone","ricotta","hüttenkäse","huettenkaese","emmentaler","cheddar","camembert","brie","whey","protein","casein","kasein"] },
    { key: "teig", title: "Teigwaren, Reis & Getreide", icon: "🍝", kw: ["nudel","nudeln","spaghetti","penne","fusilli","tagliatelle","makkaroni","lasagne","spätzle","spaetzle","gnocchi","tortellini","ravioli","farfalle","rigatoni","pasta","reis","basmati","risotto","couscous","bulgur","quinoa","polenta","griess","haferflocken","hafer","müsli","muesli","cornflakes","porridge"] },
    { key: "backen", title: "Backen & Mehl", icon: "🧁", kw: ["mehl","zucker","puderzucker","vanillezucker","vanille","backpulver","hefe","kakao","schokolade","schoko","kuvertüre","kuvertuere","backaroma","speisestärke","speisestaerke","stärke","staerke","natron","marzipan","honig","sirup","nuss","nüsse","nuesse","mandel","mandeln","walnuss","haselnuss","erdnuss","cashew","pistazie","rosine","kokosraspel","gelatine"] },
    { key: "vorrat", title: "Konserven & Vorrat", icon: "🥫", kw: ["dose","konserve","passierte","passata","kokosmilch","linsen","brühe","bruehe","fond","brühwürfel","bruehwuerfel","oliven","kapern","essiggurke","antipasti","instant","tütensuppe","tuetensuppe","suppe","backerbsen"] },
    { key: "gewuerz", title: "Gewürze, Öle & Saucen", icon: "🧂", kw: ["salz","pfeffer","paprikapulver","curry","currypaste","kurkuma","kümmel","kuemmel","muskat","zimt","nelke","lorbeer","oregano","thymian","majoran","cayenne","essig","balsamico","öl","olivenöl","olivenoel","rapsöl","rapsoel","sonnenblumenöl","sesamöl","sesamoel","kokosöl","pflanzenöl","sojasauce","sojasosse","fischsauce","sauce","sosse","dressing","mayonnaise","mayo","ketchup","senf","pesto","tahini","brühpulver"] },
  ];
  const SHOP_OTHER = { key: "sonst", title: "Sonstiges", icon: "📦" };
  function shopCategory(label) {
    const toks = label.toLowerCase().replace(/ß/g, "ss").replace(/[0-9]+/g, " ").replace(/[^a-zäöü]+/g, " ").split(/\s+/).filter(Boolean);
    for (let c = 0; c < SHOP_CATS.length; c++) {
      const kws = SHOP_CATS[c].kw;
      for (let k = 0; k < kws.length; k++) {
        const kw = kws[k];
        for (let t = 0; t < toks.length; t++) {
          const tok = toks[t];
          if (tok === kw) return SHOP_CATS[c];
          if (kw.length >= 4 && (tok.indexOf(kw) === 0 || tok.slice(-kw.length) === kw)) return SHOP_CATS[c];
        }
      }
    }
    return SHOP_OTHER;
  }
  const SHOP_DONE_KEY = "wochenkueche_shop_v1";
  function loadShopDone() { try { return new Set(JSON.parse(localStorage.getItem(SHOP_DONE_KEY) || "[]")); } catch (e) { return new Set(); } }
  function saveShopDone(set) { try { localStorage.setItem(SHOP_DONE_KEY, JSON.stringify(Array.from(set))); } catch (e) {} }

  // Einkaufsliste als Klartext (Warengruppe als Ueberschrift, Zutaten mit Punkt). Eine Quelle
  // fuer "Als Text kopieren" und fuers Teilen ueber den nativen Dialog - sonst laufen die
  // beiden Formate frueher oder spaeter auseinander.
  function shoppingText(groups) {
    return groups.map(g => g.cat.title.toUpperCase() + "\n"
      + g.items.map(it => "• " + it.label + (it.count > 1 ? " (×" + it.count + ")" : "")).join("\n")).join("\n\n");
  }
  // Aggregiert die Zutaten der relevanten Tage zu einer sortierten, nach Warengruppe
  // gruppierten Einkaufsliste. Ausgelagert aus openShopping() (Paket B3), damit der neue
  // PDF-Export (shopPdfString/planShopPages) dieselbe Aggregation nutzt statt sie zu duplizieren.
  // persons: fuer wie viele Personen eingekauft wird. Default ist die Kontoeinstellung -
  // alle Aufrufer (Modal, Text, PDF, Teilen) erben die Zahl dadurch automatisch, ohne dass
  // jeder sie selbst durchreichen muss.
  function buildShoppingList(persons) {
    const per = sanitizeShopPersons(persons === undefined ? shopPersons() : persons);
    // In der aktuellen Woche zaehlen nur heute und die kommenden Tage - fuer bereits
    // vergangene Tage wird nicht mehr eingekauft, ihre Zutaten sollen die Summe also
    // nicht mehr aufblaehen. In der naechsten Woche gibt es aus heutiger Sicht kein
    // "vergangen", dort zaehlt die ganze Woche wie bisher.
    const todayIdx = DAYS.findIndex(d => d.key === todayDayKey());
    const relevantDays = state.viewWeek === "next" ? DAYS : DAYS.slice(todayIdx);
    // Zusammenfassen: gleiche Zutat + gleiche Einheit werden addiert (7 × 400 ml Milch
    // -> "2,8 L Milch"). Zutaten ohne Menge (Freitext wie "Salz, Pfeffer") haben nichts
    // zu addieren und werden wie bisher gezaehlt.
    const map = new Map(); // key -> {label, count, qty, unit, name}
    relevantDays.forEach(d => MEALS.forEach(m => state.plan[d.key][m.key].forEach(rid => {
      const r = getRecipe(rid);
      if (!r || !r.ingredients) return;
      r.ingredients.forEach(i => {
        const o = ingObj(i);
        const name = String(o.name || "").trim();
        const qty = nutNum(o.grams);
        const unit = ingUnit(o);
        // Ohne Menge zaehlt der ganze Text (Altbestand), sonst Name+Einheit als Schluessel
        const norm = qty
          ? name.toLowerCase() + "|" + unit
          : ingLabel(i).toLowerCase().trim();
        if (!norm || (!qty && !name)) return;
        const hit = map.get(norm);
        if (hit) { hit.count++; if (qty) hit.qty += qty; }
        else map.set(norm, { norm: norm, name: name, qty: qty, unit: unit, count: 1 });
      });
    })));
    // Hochrechnen auf die Personenzahl - vor der Label-Bildung, damit qtyLabel unten anhand
    // der ENDgueltigen Summe ueber g/kg bzw. ml/L entscheidet. Zutaten ohne Menge (Freitext
    // wie "Salz, Pfeffer") bleiben unangetastet: ihr "×count" heisst "in N Meals der Woche",
    // nicht "N Stueck" - mal 2 genommen waere es schlicht falsch.
    if (per > 1) map.forEach(it => { if (it.qty) it.qty *= per; });
    // it.norm bleibt bewusst unberuehrt (Name + Einheit, ohne Menge): daran haengt der
    // abgehakte Zustand in SHOP_DONE_KEY - er soll eine geaenderte Personenzahl ueberleben.
    // Anzeige-Label erst am Ende bilden — die Summe entscheidet ueber g/kg bzw. ml/L
    map.forEach(it => { it.label = it.qty ? qtyLabel(it.qty, it.unit) + " " + it.name : it.name; });
    // nach Zutatennamen sortieren, nicht nach Label — sonst ordnet die Menge die Liste
    const items = Array.from(map.values()).sort((a, b) => (a.name || a.label).localeCompare(b.name || b.label, "de"));
    // nach Warengruppe gruppieren; Reihenfolge = SHOP_CATS, "Sonstiges" ganz am Ende
    const gmap = {};
    items.forEach(it => { const c = shopCategory(it.name || it.label); (gmap[c.key] || (gmap[c.key] = { cat: c, items: [] })).items.push(it); });
    const groups = SHOP_CATS.concat([SHOP_OTHER]).map(c => gmap[c.key]).filter(Boolean);
    return { items, groups, todayIdx, persons: per };
  }

  // "2 Personen" / "1 Person" - eine Stelle, damit Knopf-Beschriftung und Vorlesetext
  // nicht auseinanderlaufen koennen.
  function personsLabel(n) { return n + (n === 1 ? " Person" : " Personen"); }

  function openShopping() {
    // cur wird beim Aendern der Personenzahl neu berechnet; items/todayIdx bleiben dabei
    // gueltig, weil die Personenzahl nur die MENGEN skaliert - Anzahl der Positionen,
    // Sortierung und Warengruppen aendern sich nicht.
    let cur = buildShoppingList();
    const { items, todayIdx } = cur;
    const done = loadShopDone();

    const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
    let body;
    if (items.length === 0) {
      body = `<div class="shop-empty">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <p>Noch keine Zutaten – plane zuerst ein paar Mahlzeiten im Wochenplan, dann sammeln wir die Zutaten hier automatisch.</p>
      </div>`;
    } else {
      let idx = 0;
      const listHtml = cur.groups.map(g => `
        <div class="shop-group">
          <div class="shop-cat"><span class="shop-cat-ic" aria-hidden="true">${g.cat.icon}</span>${esc(g.cat.title)}<span class="shop-cat-n">${g.items.length}</span></div>
          ${g.items.map(it => {
            const id = "s" + (idx++);
            return `<label class="shop-item">
              <input type="checkbox" class="shop-check" id="${id}" data-norm="${esc(it.norm)}"${done.has(it.norm) ? " checked" : ""}>
              <span class="box" aria-hidden="true">${checkSvg}</span>
              <span class="lbl"${it.qty && it.count > 1 ? ` title="summiert aus ${it.count} Meals der Woche"` : ""}>${esc(it.label)}</span>
              ${!it.qty && it.count > 1 ? `<span class="qty" title="in ${it.count} Meals der Woche">×${it.count}</span>` : ""}
            </label>`;
          }).join("")}
        </div>`).join("");
      const minus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>`;
      const plus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
      body = `
        <div class="shop-persons">
          <span class="lbl">Einkauf für</span>
          <div class="step" role="group" aria-label="Personenanzahl">
            <button type="button" class="pbtn" data-pers="-1" aria-label="Eine Person weniger">${minus}</button>
            <span class="pnum" id="shop-pers" aria-live="polite">${esc(personsLabel(cur.persons))}</span>
            <button type="button" class="pbtn" data-pers="1" aria-label="Eine Person mehr">${plus}</button>
          </div>
        </div>
        <div class="shop-progress">
          <span class="ptext" id="shop-count">0 von ${items.length} erledigt</span>
          <div class="bar"><i id="shop-bar"></i></div>
          <button class="toggle-all" id="shop-toggle" type="button">Alle abhaken</button>
        </div>
        <div class="shop-list">${listHtml}</div>`;
    }

    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Einkaufsliste">
      <div class="modal-head">
        <div class="shop-head" style="flex:1">
          <div class="cart" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></div>
          <div><div class="kicker">${items.length} Position${items.length===1?"":"en"} · ${state.viewWeek !== "next" && todayIdx > 0 ? "ab heute" : "diese Woche"}</div><h3 style="margin:2px 0 0">Einkaufsliste der Woche</h3></div>
        </div>
        <button class="btn ghost sm" data-close>✕</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        ${items.length ? (canShare()
          ? `<button class="btn" data-share>Teilen</button>`
          : `<button class="btn ghost" data-pdf>Als PDF</button><button class="btn" data-copy>Als Text kopieren</button>`) : ""}
        <button class="btn primary" data-close>Schließen</button>
      </div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    // Personenzahl: nur die Mengen-Beschriftungen austauschen statt die Liste neu zu bauen.
    // Positionen, Reihenfolge und Abhak-Zustand bleiben dadurch unberuehrt, und der Fokus
    // bleibt auf dem gedrueckten Knopf - mehrfaches Tippen/Enter funktioniert weiter.
    if (items.length) {
      const persEl = node.querySelector("#shop-pers");
      const persBtns = Array.from(node.querySelectorAll(".shop-persons .pbtn"));
      const applyPersons = () => {
        persEl.textContent = personsLabel(cur.persons);
        persBtns.forEach(b => { b.disabled = cur.persons + Number(b.dataset.pers) < 1 || cur.persons + Number(b.dataset.pers) > 12; });
        const byNorm = new Map(cur.items.map(it => [it.norm, it.label]));
        node.querySelectorAll(".shop-check").forEach(c => {
          const lbl = c.parentElement.querySelector(".lbl");
          if (lbl && byNorm.has(c.dataset.norm)) lbl.textContent = byNorm.get(c.dataset.norm);
        });
      };
      persBtns.forEach(b => b.addEventListener("click", () => {
        const next = sanitizeShopPersons(cur.persons + Number(b.dataset.pers));
        if (next === cur.persons) return;
        state.shopPersons = next;
        cur = buildShoppingList();
        applyPersons();
        save();   // Kontoeinstellung: gilt auch fuer PDF, Text und das naechste Oeffnen
      }));
      applyPersons();

      const checks = Array.from(node.querySelectorAll(".shop-check"));
      const bar = node.querySelector("#shop-bar");
      const countEl = node.querySelector("#shop-count");
      const toggleBtn = node.querySelector("#shop-toggle");
      const updateProgress = () => {
        const done = checks.filter(c => c.checked).length;
        bar.style.width = Math.round(done / checks.length * 100) + "%";
        countEl.textContent = done + " von " + checks.length + " erledigt";
        toggleBtn.textContent = done === checks.length ? "Zurücksetzen" : "Alle abhaken";
      };
      const persist = () => { const d = new Set(); checks.forEach(c => { if (c.checked) d.add(c.dataset.norm); }); saveShopDone(d); };
      checks.forEach(c => c.addEventListener("change", () => { updateProgress(); persist(); }));
      toggleBtn.addEventListener("click", () => { const allDone = checks.every(c => c.checked); checks.forEach(c => { c.checked = !allDone; }); updateProgress(); persist(); });
      updateProgress();
    }
    const copyBtn = node.querySelector("[data-copy]");
    if (copyBtn) copyBtn.addEventListener("click", () => {
      const text = shoppingText(cur.groups);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast("Liste kopiert")).catch(() => toast("Kopieren hat nicht geklappt"));
      } else toast("Kopieren hat nicht geklappt");
    });
    // Nativer Teilen-Dialog (nur wenn das Geraet ihn kann - sonst steht der Knopf gar nicht da)
    const shareBtn = node.querySelector("[data-share]");
    if (shareBtn) shareBtn.addEventListener("click", shareShopPdf);
    // Paket B3: Einkaufsliste als PDF, analog zum bestehenden Wochenplan-PDF (downloadPdf).
    const pdfBtn = node.querySelector("[data-pdf]");
    if (pdfBtn) pdfBtn.addEventListener("click", downloadShopPdf);
    openModal(node);
  }

  // ---------- Actions ----------
  // Meal-Verweise aus ALLEN gespeicherten Wochen entfernen, nicht nur aus der gerade
  // angezeigten - sonst bleibt in der anderen Woche ein Verweis auf ein geloeschtes
  // Meal stehen (faellt erst beim naechsten Laden weg, weil normalizePlan aufraeumt).
  function dropRecipeIds(idSet) {
    Object.keys(state.plans).forEach(key => {
      const p = state.plans[key];
      if (!p) return;
      DAYS.forEach(d => MEALS.forEach(m => {
        if (p[d.key] && p[d.key][m.key]) p[d.key][m.key] = asIdList(p[d.key][m.key]).filter(x => !idSet.has(x));
      }));
    });
    // Favoriten mitraeumen: ein Herz auf ein geloeschtes Meal waere ein Geisterverweis.
    if (Array.isArray(state.favs)) state.favs = state.favs.filter(x => !idSet.has(x));
  }
  function deleteRecipe(id) {
    const r = getRecipe(id); if (!r) return;
    confirmModal({
      title: "Meal löschen?",
      bodyHtml: `<p style="margin:0">„<strong>${esc(r.name)}</strong>" wird dauerhaft entfernt und aus dem Wochenplan gelöscht.</p>`,
      okLabel: "Löschen",
      onConfirm: () => {
        // dropRecipeIds raeumt in ALLEN gespeicherten Wochen auf (nicht nur der aktiven) -
        // fuers Rueckgaengig-Machen deshalb alle Wochen klonen, nicht nur state.plan.
        const plansBefore = JSON.parse(JSON.stringify(state.plans));
        const favsBefore = (state.favs || []).slice();
        state.recipes = state.recipes.filter(x => x.id !== id);
        dropRecipeIds(new Set([id]));
        markDeleted([id]);   // haelt das Meal beim naechsten Anmelden draussen (siehe sanitizeTombstones)
        save(); render();
        undoToast("Meal gelöscht", () => {
          unmarkDeleted([id]);
          state.recipes.push(r);
          state.plans = plansBefore;
          state.plan = state.plans[activeWeekKey()] || state.plan;
          state.favs = favsBefore;
          save(); render();
        });
      }
    });
  }

  function clearExamples() {
    const exIds = new Set(state.recipes.filter(isExample).map(r => r.id));
    if (!exIds.size) { toast("Keine Beispiele vorhanden"); return; }
    const n = exIds.size;
    confirmModal({
      title: "Beispiele entfernen?",
      text: `Die ${n} mitgelieferten Beispiel-Meal${n === 1 ? "" : "s"} werden entfernt und aus dem Wochenplan gelöscht. Deine eigenen Meals bleiben erhalten.`,
      okLabel: "Entfernen",
      onConfirm: () => {
        state.recipes = state.recipes.filter(r => !exIds.has(r.id));
        dropRecipeIds(exIds);
        markDeleted(Array.from(exIds));   // sonst kaemen sie beim naechsten Anmelden zurueck
        render(); toast("Beispiele entfernt");
      }
    });
  }

  // ---------- Rechtstexte (Impressum / Datenschutz) ----------
  function legalModal(title, bodyHtml) {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="${title}">
      <div class="modal-head"><h3>${title}</h3><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body legal">${bodyHtml}</div>
      <div class="modal-foot"><button class="btn primary" data-close>Schließen</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    openModal(node);
  }

  function clearWeek() {
    if (planStats() === 0) { toast("Der Plan ist schon leer"); return; }
    confirmModal({
      title: "Woche leeren?",
      text: "Alle Zuordnungen im Wochenplan werden entfernt. Deine Meals bleiben erhalten.",
      okLabel: "Woche leeren",
      onConfirm: () => {
        const key = activeWeekKey();
        const before = {}; DAYS.forEach(d => { before[d.key] = {}; MEALS.forEach(m => { before[d.key][m.key] = state.plan[d.key][m.key].slice(); }); });
        DAYS.forEach(d => MEALS.forEach(m => { state.plan[d.key][m.key] = []; }));
        save(); render();
        undoToast(state.viewWeek === "next" ? "Nächste Woche geleert" : "Woche geleert", () => {
          const p = state.plans[key]; if (!p) return;   // Woche existiert nach 5 s praktisch immer noch
          DAYS.forEach(d => MEALS.forEach(m => { p[d.key][m.key] = before[d.key][m.key]; }));
          save(); render();
        });
      }
    });
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;   // wird u. a. aus save() gerufen, das sehr frueh laufen kann
    t.classList.remove("has-undo");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); clearTimeout(undoTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
  }
  // ---------- Toast mit Rueckgaengig (Paket B1) ----------
  // Fuer destruktive Aktionen, die sich direkt danach noch leicht zuruecknehmen lassen (Slot
  // entfernen, Meal verschieben, Woche leeren, Meal loeschen, Wiegung loeschen): laenger sichtbar
  // als der normale Toast UND mit eigenem Knopf statt automatischem Verschwinden. Text per
  // textContent (nicht innerHTML) gesetzt, weil Meal-/Wochentagsnamen im Text stehen koennen -
  // kein Injection-Risiko durch Nutzereingaben.
  let undoTimer = null;
  function undoToast(msg, undoFn) {
    const t = document.getElementById("toast");
    if (!t) return;
    clearTimeout(toastTimer); clearTimeout(undoTimer);
    t.textContent = "";
    const span = document.createElement("span"); span.textContent = msg;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "toast-undo"; btn.textContent = "Rückgängig";
    t.appendChild(span); t.appendChild(btn);
    t.classList.add("show", "has-undo");
    const finish = () => { t.classList.remove("show", "has-undo"); t.textContent = ""; };
    btn.addEventListener("click", () => { clearTimeout(undoTimer); finish(); undoFn(); });
    undoTimer = setTimeout(finish, 5000);
  }

  // ---------- Event delegation ----------
  // Meal-Foto ueber das "+" auf der Karte (ein globales, wiederverwendetes file-input)
  const photoInput = document.createElement("input");
  photoInput.type = "file"; photoInput.accept = "image/*"; photoInput.className = "visually-hidden";
  document.body.appendChild(photoInput);
  let photoTargetId = null;
  photoInput.addEventListener("change", () => {
    const f = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    const r = photoTargetId ? getRecipe(photoTargetId) : null;
    photoTargetId = null;
    if (!f || !r) return;
    if (!canEdit()) return;   // laeuft nicht ueber die Delegation, deshalb hier eigens
    if (!/^image\//.test(f.type)) { toast("Bitte ein Bild verwenden"); return; }
    readAndDownscale(f, dataUrl => { if (dataUrl) { r.image = dataUrl; save(); render(); toast("Foto übernommen"); } else toast("Bild konnte nicht geladen werden"); });
  });

  // Profilbild ueber "Profil bearbeiten" (eigenes file-input, bewusst nicht photoInput
  // wiederverwendet - das haengt an Rezept-IDs, hier gibt es kein Zielobjekt dieser Art).
  const avatarInput = document.createElement("input");
  avatarInput.type = "file"; avatarInput.accept = "image/*"; avatarInput.className = "visually-hidden";
  document.body.appendChild(avatarInput);
  let avatarCropCb = null;
  avatarInput.addEventListener("change", () => {
    const f = avatarInput.files && avatarInput.files[0];
    avatarInput.value = "";
    const cb = avatarCropCb; avatarCropCb = null;
    if (!f || !cb) return;

  // und mit den Entwicklerwerkzeugen umgehbar.
  const WRITE_ACTIONS = ["new-recipe", "edit", "delete", "photo", "pick", "unassign", "clear-week", "clear-examples"];
  function blockedByRole() {
    if (canEdit()) return false;

  document.addEventListener("click", e => {

      const id = t.dataset.id;
      // Die Favoriten-Gruppe entsteht bzw. verschwindet OBERHALB der geklickten Karte - ohne
      // Ausgleich rutscht die ganze Ansicht weg. scrollY absolut zu konservieren (wie render()
      // es tut) reicht dafuer nicht: der Inhalt wandert ja tatsaechlich. Deshalb die Verschiebung
      // eines Ankers messen und die Differenz aufs Scrolling addieren.
      //
      // Anker ist bewusst die LETZTE Karte mit dieser rid, nicht die angeklickte: Ein Favorit

      //
      // Zweiter Anker als Rueckfall: Steht die Karte nach dem Repaint NIRGENDWO mehr, greift

      // Anker - sie liegt immer unter der Favoriten-Gruppe und ueberlebt den Repaint.
      const cardTop = list => (list.length ? list[list.length - 1].getBoundingClientRect().top : null);
      const groupTop = () => {
        const g = view.querySelector("#r-groups .catgroup:not(.favgroup)");
        return g ? g.getBoundingClientRect().top : null;
      };
      const before = cardTop(view.querySelectorAll(`.rcard[data-rid="${id}"]`));
      const beforeGroup = groupTop();
      const hadFocus = t === document.activeElement;

      if (!state.favs) state.favs = [];
      state.favs = isFav(id) ? state.favs.filter(x => x !== id) : sanitizeFavs(state.favs.concat(id));
      save();               // persistiert + scheduleCloudPush()
      paintRecipeGroups();  // nur die Liste neu zeichnen, sonst faellt der Fokus aus dem Suchfeld

      const post = view.querySelectorAll(`.rcard[data-rid="${id}"]`);
      const anchor = post.length ? post[post.length - 1] : null;
      const shift = anchor && before !== null
        ? anchor.getBoundingClientRect().top - before

      // scrollX mitnehmen statt hart 0 - hier gibt es heute keinen Querlauf, aber ein

      if (shift) window.scrollTo(window.scrollX, window.scrollY + shift);

      if (hadFocus) {

        const back = btn || view.querySelector("#r-groups .cathead[data-action]") || view.querySelector("#r-search");

    else if (a === "unassign") {

    }
    else if (a === "shopping") openShopping();
    else if (a === "week") { if ((t.dataset.week === "next") !== (state.viewWeek === "next")) { setViewWeek(t.dataset.week); render(); } }
    else if (a === "wyear") { if (String(state.viewYear) !== t.dataset.year) { state.viewYear = +t.dataset.year; render(); } }
    else if (a === "weigh") openWeighForm();
    else if (a === "weight-goal") openWeightGoalForm();
    else if (a === "weight-menu") toggleWeightMenu(t);
    else if (a === "weight-consent-in") weightConsentModal();
    else if (a === "weight-manage") openWeighForm(true);

    else if (a === "recalc-goal") startOnboarding({ first: false });
    else if (a === "share") openShare();
    else if (a === "profile-menu") toggleProfileMenu();
    else if (a === "impressum") openImpressum();
    else if (a === "datenschutz") openDatenschutz();
  });

  // ---------- Drag & drop between slots ----------
  let dragSrc = null;
  view.addEventListener("dragstart", e => {
    const f = e.target.closest(".filled[data-slot-src]");
    if (!f) return;

    // sichtbares Zieh-Feedback, das dann folgenlos bleibt - das wirkt kaputt.
    if (!canEdit()) { e.preventDefault(); return; }
    dragSrc = f.dataset.slotSrc;
    f.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragSrc); } catch (err) {}
  });
  view.addEventListener("dragend", e => {
    const f = e.target.closest(".filled"); if (f) f.classList.remove("dragging");

  // Kategorie des gerade gezogenen Meals – "day:meal:idx" -> Rezept
  function draggedCat() {
    if (!dragSrc) return null;

    return r ? r.category : null;

  view.addEventListener("drop", e => {

    const [sd, sm, si] = dragSrc.split(":");
    const [td, tm] = target.split(":");
    if (sd === td && sm === tm) { render(); return; } // gleicher Slot – nichts tun

  // ---------- Foto per Drag & Drop auf eine Meal-Karte (Desktop) ----------

  function isFileDrag(e) { return !!(e.dataTransfer && e.dataTransfer.types && Array.prototype.includes.call(e.dataTransfer.types, "Files")); }

    if (card && !card.contains(e.relatedTarget)) card.classList.remove("dragover-file");
  });
  view.addEventListener("drop", e => {
    const card = e.target.closest(".rcard[data-rid]");

    if (modalRoot.children.length) return;
    if (state.tab !== "recipes" || !hoveredCardId) return;
    if (!canEdit()) return;   // laeuft nicht ueber die Delegation
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;

    for (const it of items) { if (it.type && it.type.indexOf("image/") === 0) { file = it.getAsFile(); break; } }
    if (!file) return; // kein Bild im Clipboard - normales Text-Einfuegen (z. B. im Namensfeld) unangetastet lassen
    e.preventDefault();

  });

  // ---------- Profil (lokal) & Teilen ----------
  const PROFILE_KEY = "wochenkueche_profile_v1";
  const LAST_KEY = "wochenkueche_lastprofile_v1";
  function jget(key, fb) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fb : v; } catch (e) { return fb; } }
  let profile = jget(PROFILE_KEY, null);
  function saveProfile() { try { if (profile) localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); else localStorage.removeItem(PROFILE_KEY); } catch (e) {} }
  function rememberLast() { try { localStorage.setItem(LAST_KEY, JSON.stringify(profile)); } catch (e) {} }
  function initials(name) { return (name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] ? w[0].toUpperCase() : "").join("") || "?"; }
  function validEmail(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); }

  let pendingShare = null;

  let pendingInvite = null;

  // Zeitpunkt, an dem ueber die ersten Schritte entschieden wird, schon wieder null –
  // das Modal des geteilten Plans steht dann aber noch aus.
  let shareOnStart = false;
  function readSharedFromUrl() {
    try {
      // ?g= ist die Gruppen-Einladung, ?s= der alte Teilen-Link (Momentaufnahme).
      // Beide raeumen die Adresszeile auf, damit ein Neuladen nicht erneut fragt.
      const g = (location.search || "").match(/[?&]g=([A-Za-z0-9_-]+)/);
      if (g) {
        pendingInvite = g[1];
        history.replaceState(null, "", location.pathname);
        return;
      }
      const m = (location.search || "").match(/[?&]s=([A-Za-z0-9_-]+)/);
      if (!m) return;
      pendingShare = m[1];
      history.replaceState(null, "", location.pathname);
    } catch (e) {}
  }
  let authMode = "local";
  let cloudSignalled = false;
  let verifyPollTimer = null;   // Paket B4: Hintergrund-Poll in renderVerifyPending
  function enterLocalMode() {
    if (cloudSignalled) return;
    cloudSignalled = true; authMode = "local";
    if (!profile) renderAuthLocal(); else enterApp();
  }
  function handleCloudUser(user) {
    cloudSignalled = true; authMode = "cloud";
    if (user && user.emailVerified) {
      profile = {
        name: user.displayName || (user.email ? user.email.split("@")[0] : "Ich"),
        email: user.email || "", uid: user.uid, cloud: true
      };
      saveProfile(); rememberLast();
      enterApp();
      startCloudSync(user.uid);
    } else if (user && !user.emailVerified) {
      stopCloudSync();
      renderVerifyPending(user);
    } else {
      stopCloudSync();
      renderAuthCloud();
    }
  }
  function boot() {
    const fy = document.getElementById("foot-year"); if (fy) fy.textContent = new Date().getFullYear();
    // Paket C1: jetzt (state existiert) vergangene Wochen archivieren + verwerfen — in load()

    imagesReady = hydrateImages();

  function loadSharedById(id) {

  function openSharedImport(d) {

    </div>` : `<div class="modal" role="dialog" aria-modal="true" aria-label="Geteilter Plan">

      <div class="modal-body"><p style="margin:0"><strong>${who}</strong> hat einen Wochenplan mit dir geteilt (${nrec} Meal${nrec === 1 ? "" : "s"}). Möchtest du ihn übernehmen? Deine eigenen Meals bleiben erhalten, neue kommen dazu – dein aktueller Wochenplan wird durch den geteilten ersetzt.</p></div>
      <div class="modal-foot"><button class="btn ghost" data-close>Später</button><button class="btn primary" data-take>Plan übernehmen</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("[data-take]").addEventListener("click", () => applySharedData(d, !isMeal));

  }

  // Avatar eines Mitglieds: Bild, sonst Initialen. Im ueberlappenden Stack nur EIN
  // Buchstabe - der zweite laege unter dem naechsten Kreis und waere angeschnitten
  // ("AB" las sich als "AE"). In der Mitgliederliste, wo nichts ueberlappt, beide.
  function memberAvatarHtml(m, short) {
    const ini = initials(m.name || "?");
    // safeImage() ist Pflicht, weil dieses Feld von einer ANDEREN Person kommt: Es laesst
    // nur data:image-URLs durch. Ohne die Pruefung koennte ein Mitglied dort eine fremde
    // http-Adresse eintragen - der Browser jedes anderen Mitglieds wuerde sie abrufen und
    // damit seine IP-Adresse an einen Dritten senden, ohne dass jemand es merkt.
    // (Ein Ausbruch aus dem Attribut ist durch esc() ohnehin ausgeschlossen, das auch
    // Anfuehrungszeichen wandelt - hier geht es um den Abruf selbst.)
    const src = safeImage(m.avatar);
    const inner = src ? `<img src="${esc(src)}" alt="">` : esc(short ? ini.slice(0, 1) : ini);
    return `<span class="avatar" aria-hidden="true">${inner}</span>`;
  }

  // Die anderen Mitglieder der Gruppe, links neben dem eigenen Avatar. Ab vier Personen
  // wird abgekuerzt - mehr Kreise als das passen im Kopf neben die Reiter nicht, und die
  // vollstaendige Liste steht ohnehin einen Klick entfernt im Gruppen-Dialog.
  const MSTACK_MAX = 3;
  function memberStackHtml() {
    if (!syncGid || !groupMembers.length) return "";
    const others = groupMembers.filter(m => m.uid !== syncUid);
    if (!others.length) return "";
    const shown = others.slice(0, MSTACK_MAX);
    const rest = others.length - shown.length;
    const names = others.map(m => firstName(m.name) || "Jemand").join(", ");
    return `<span class="mstack" title="${esc(names)}" aria-label="Gemeinsam mit ${esc(names)}">`
      + shown.map(m => memberAvatarHtml(m, true)).join("")
      + (rest > 0 ? `<span class="more" aria-hidden="true">+${rest}</span>` : "")
      + `</span>`;
  }

  function renderProfileChip() {

  // Gemeinsames Schliessverhalten aller .menu-Dropdowns (Profil, Gewicht): Klick daneben,
  // Escape mit Fokus zurueck auf den Ausloeser, aria-expanded am Ausloeser, Fokus beim
  // Oeffnen auf den ersten Eintrag. Ein zweites Mal von Hand gebaut waeren es zwei Muster
  // mit zwei Luecken. Liefert close() zurueck und haengt es als __close ans Menue, damit
  // ein erneuter Klick auf den Ausloeser sauber schliesst statt nur das DOM zu entfernen.
  function attachMenuDismiss(menu, trigger) {
    if (trigger) trigger.setAttribute("aria-expanded", "true");
    const close = back => {
      menu.remove();
      document.removeEventListener("mousedown", onDown, true);
      document.removeEventListener("keydown", onKey, true);
      if (!trigger) return;
      trigger.setAttribute("aria-expanded", "false");
      if (back && trigger.isConnected) trigger.focus();
    };
    // Nach einem render() ist das Menue aus dem DOM, ohne dass close() lief - dann hier
    // aufraeumen, damit keine Zuhoerer am document zurueckbleiben.
    const onDown = e => {
      if (!menu.isConnected) { close(false); return; }
      if (menu.contains(e.target) || (trigger && trigger.contains(e.target))) return;
      close(false);
    };
    const onKey = e => {
      if (!menu.isConnected) { close(false); return; }
      if (e.key === "Escape") { e.stopPropagation(); close(true); }
    };
    setTimeout(() => {
      document.addEventListener("mousedown", onDown, true);
      document.addEventListener("keydown", onKey, true);
    }, 0);
    const first = menu.querySelector("[role='menuitem']");
    if (first) first.focus();
    menu.__close = close;
    return close;
  }

  function closeMenuNode(node) { if (node.__close) node.__close(false); else node.remove(); }

      <button data-mi="group" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>${syncGid ? "Gruppe" : "Gemeinsam planen"}</button>

    menu.querySelector("[data-mi='group']").addEventListener("click", () => { close(false); openGroupModal(); });
    menu.querySelector("[data-mi='signout']").addEventListener("click", () => { close(false); signOut(); });
    menu.querySelector("[data-mi='delete']").addEventListener("click", () => { close(false); authMode === "cloud" ? deleteAccountFlow() : deleteLocalDataFlow(); });

  // Menue hinter dem roten Plus der Gewichtskarte. Beide Eintraege oeffnen die Dialoge,
  // die frueher an den Knoepfen "Wiegen" / "Ziel aendern" unter der Karte hingen.
