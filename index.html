    // Zwei Kreise je Messung: der sichtbare kleine und ein unsichtbarer grosser als
    // Trefferflaeche - ein 4-px-Punkt ist mit dem Finger nicht zu treffen. Der Radius
    // waechst mit dem Monatsabstand (eine SVG-Einheit = ein Bildschirmpunkt), bleibt
    // aber bei 18 gedeckelt: auf breiten Schirmen braucht es keine 60-px-Flaechen, auf
    // schmalen duerfen sich die Flaechen leicht ueberlappen - getroffen wird ohnehin
    // der oberste Punkt, und zu klein waere hier das groessere Uebel.
    // Trefferflaeche: Der Wochenabstand ist rund ein Fuenftel des frueheren Monatsabstands,
    // eine daran gekoppelte Flaeche waere unbrauchbar klein. Deshalb weiterhin mindestens
    // 11 px - Punkte duerfen sich ueberlappen, getroffen wird der oberste, und zu klein
    // waere hier das groessere Uebel.
    const hitR = Math.max(11, Math.min(18, plotW / 11 / 2)).toFixed(1);
    const dots = rows.map(r =>
      `<g class="wch-pt" tabindex="0" role="img" data-m="${r.m}" aria-label="${esc(weekKeyLabel(r.m))}: ${kgfmt(r.kg)} Kilogramm">
         <title>${esc(weekKeyLabel(r.m))}: ${kgfmt(r.kg)} kg</title>
         <circle class="wch-hit" cx="${px(weekNumOf(r.m)).toFixed(1)}" cy="${py(r.kg).toFixed(1)}" r="${hitR}"/>
         <circle class="wch-dot" cx="${px(weekNumOf(r.m)).toFixed(1)}" cy="${py(r.kg).toFixed(1)}" r="4"/>
       </g>`).join("");

    return `<svg class="wch-svg" viewBox="0 0 ${g.W} ${g.H}" width="${g.W}" height="${g.H}"
        role="img" aria-label="Gewichtsverlauf ${year}, ${rows.length} Messung${rows.length === 1 ? "" : "en"}">
        ${grid}${months}${zielEl}${line}${avgLine}${dots}
      </svg>`;
  }

  // Ohne Einwilligung entfaellt Diagramm/Menue komplett - Gewicht ist ein Gesundheitsdatum
  // (Art. 9 DSGVO, Ziffer 3b der Datenschutzerklaerung) und wird nicht stillschweigend
  // mitgetrackt, auch wenn schon ein Gewicht aus der Ziel-Berechnung vorliegt.
  function weightConsentHtml() {
    // Widerruf loescht keine Bestandsdaten (siehe weightConsentRevokeModal/Ziffer 3b) - das
    // Recht, sie einzusehen und einzeln zu loeschen, darf deshalb nicht an der Einwilligung
    // haengen. Nur "Gewicht eintragen" (neue Erfassung) ist an sie gebunden.
    const hasData = (state.weights || []).length > 0;
    return `<div class="wg-col wch">
        <div class="wch-head">
          <div>
            <div class="wg-lbl">Ziele ${activeYear()}</div>
            <h3 class="wg-h">Gewicht</h3>
          </div>
        </div>
        <button class="btn primary" data-action="weight-consent-in">Verlauf aktivieren</button>
        ${hasData ? `<button class="btn ghost sm" data-action="weight-manage" style="margin-top:8px">Bestehende Einträge verwalten</button>` : ""}
      </div>`;
  }

  // Die ganze Karte: Kopf mit Jahr und Kennzahlen, Jahreswechsel, Diagramm, Legende.
  function weightHtml() {
    if (!hasWeightConsent()) return weightConsentHtml();
    const year = activeYear();
    const all = state.weights || [];
    const rows = all.filter(e => e.m.slice(0, 4) === year);
    const ziel = (state.weightGoals || {})[year];
    const first = rows.length ? rows[0] : null;
    const last = rows.length ? rows[rows.length - 1] : null;
    const diff = first && last ? last.kg - first.kg : null;

    // Kennzahlen statt Fliesstext: Start, aktueller Stand, Ziel. Die Veraenderung traegt
    // ihr Vorzeichen sichtbar, damit "-2,4 kg" nicht als Zunahme gelesen wird.
    // Bezugspunkt ist seit B2 eine Kalenderwoche, nicht mehr ein Monat: "Seit KW 12".
    const fromLbl = first ? "KW " + weekNumOf(first.m) : "";
    // Gruen heisst „naeher am Ziel", NICHT „weniger". Die Richtung kommt deshalb aus dem
    // Jahresziel (liegt es ueber dem Startgewicht, ist eine Zunahme der Fortschritt),
    // ersatzweise aus dem Ziel des Rechners. Ohne beides bleibt Abnehmen die Annahme.
    // Fest an „runter = gut" gekoppelt haette die App jedem, der aufbaut, seinen Erfolg
    // in Alarmrot gezeigt - in einer App, die ausdruecklich auch fuer Muskelaufbau rechnet.
    const zunahmeIstZiel = ziel != null ? ziel > (first ? first.kg : 0)
      : !!(state.goal && state.goal.mode === "gain");
    const towardGoal = zunahmeIstZiel ? diff >= 0 : diff <= 0;
    // Die Kennzahlen stehen unter dem Diagramm, nicht in der Kopfzeile: oben steht jetzt der
    // Plus-Knopf, und die Zahlen lesen sich als Bilanz nach der Kurve besser als davor.
    // Ohne Messung und ohne Ziel entfaellt der Block ganz — sonst bliebe eine Trennlinie
    // ueber einer leeren Zeile stehen.
    const stats = (last || ziel != null) ? `<div class="wch-stats wch-foot">
        ${last ? `<div class="wch-s"><small>Aktuell</small><b>${kgfmt(last.kg)}<span>kg</span></b></div>` : ""}
        ${diff != null && rows.length > 1 ? `<div class="wch-s"><small>Seit ${fromLbl}</small><b class="${towardGoal ? "is-toward" : "is-away"}">${diff > 0 ? "+" : "−"}${kgfmt(Math.abs(diff))}<span>kg</span></b></div>` : ""}
        ${ziel != null ? `<div class="wch-s"><small>Ziel</small><b>${kgfmt(ziel)}<span>kg</span></b></div>` : ""}
      </div>` : "";

    // Jahreswechsel nur zeigen, wenn es etwas zu wechseln gibt. Gleiche Knopfoptik wie
    // der Wochenwechsel im Plan (.week-switch/.ws-btn) statt eines zweiten Musters.
    // Seit B7 baut ihn jahrLeisteHtml() - dieselbe Leiste traegt auch die Kalenderkarte,
    // und beide lesen state.viewYear. Sie stehen bewusst je an ihrer Karte statt einmal
    // ueber der Seite: ohne Gewichts-Einwilligung gibt es die untere Karte gar nicht, und
    // eine Leiste, deren Wirkung erst zwei Karten weiter unten sichtbar wird, erklaert
    // sich nicht selbst.
    const yearBar = jahrLeisteHtml(year);

    let body;
    if (!rows.length) {
      // Leerer Zustand mit Handlung statt leerer Flaeche.
      body = `<p class="wch-empty">Noch keine Messung ${year === String(new Date().getFullYear()) ? "in diesem Jahr" : "in " + year}.</p>`;
    } else {
      // Der Plot bleibt hier leer: initWeightChart misst die tatsaechliche Breite und
      // zeichnet erst dann - nur so stimmt die Schriftgroesse auf jedem Bildschirm.
      body = `<div class="wch-plot"></div>`
        // Legende ist Pflicht, sobald zwei Serien im Bild sind.
        // Nur "Ziel", nicht "Ziel 75,0 kg": die Zahl steht schon in der Kennzahlenreihe
        // darueber - zweimal dieselbe Zahl im selben Bild ist Fuellung, keine Information.
        // Ab vier Messungen kommt der 4-Wochen-Schnitt als eigene Serie dazu (B2) - dann
        // braucht es die Legende auch ohne Jahresziel.
        + ((ziel != null || rows.length >= 4) ? `<div class="wch-leg">
            <span><i class="k-line"></i>Gemessen</span>${rows.length >= 4 ? `<span><i class="k-avg"></i>Ø 4 Wochen</span>` : ""}${ziel != null ? `<span><i class="k-goal"></i>Ziel</span>` : ""}
          </div>` : "")
        // Ausgabefeld fuer den angetippten Punkt - ohne Bedienhinweis. Dass ein Punkt
        // antippbar ist, zeigt er selbst; ein Satz daneben waere genau die Erklaerung,
        // die die Textmenge-Vorgabe untersagt. Bei nur einer Messung steht hier der Wert,
        // weil es dort nichts zu vergleichen gibt.
        + `<div class="wch-tip" aria-live="polite">${rows.length > 1 ? "" : weekKeyLabel(last.m) + " · " + kgfmt(last.kg) + " kg"}</div>`;
    }

    // B1: Das Plus traegt jetzt die haeufigste Handlung direkt - ein Tipp, und das
    // Eingabefeld steht offen. Wiegen ist fuer die Zielgruppe woechentliche Routine und lag
    // vorher hinter einem Menue (vier Taps ab Kaltstart). Jahresziel und Widerruf sind
    // seltene Aktionen und wandern ins Ueberlaufmenue daneben.
    return `<div class="wg-col wch">
        <div class="wch-head">
          <div>
            <div class="wg-lbl">Ziele ${year}</div>
            <h3 class="wg-h">Gewicht</h3>
          </div>
          <div class="wch-menu">
            <button class="wch-more" data-action="weight-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Weitere Gewichts-Einstellungen">⋯</button>
            <button class="wch-add" data-action="weigh" aria-label="Gewicht eintragen">+</button>
          </div>
        </div>
        ${yearBar}
        ${body}
        ${stats}
      </div>`;
  }

  // Startreiter: Begruessungs-Hero + Kalorien-Uebersicht (Heute/Woche-Ringe), beide vormals
  // oben im Wochenplan. Dort war es voll, bevor man ueberhaupt beim Tagesraster war - jetzt
  // eigene Landingpage, der Wochenplan startet direkt mit "Dein Wochenplan".
  // Seit B8 beantwortet jeder Reiter genau eine Frage. Home: "wie steht meine Woche?" -
  // Hero und Wochenziele. Rueckblick und Gewicht sind in den Reiter "Fortschritt" gezogen;
  // sie beantworten "wie lief es bisher?" und hatten auf einer Startseite, die vier Themen
  // gleichzeitig zeigte, den UX-Grundsatz "ein Screen, ein Problem" gebrochen.
  function renderHome() {
    view.innerHTML = `${appHeroHtml()}${weekNutHtml()}`;
    resetCarousels();
    initCarousel(view.querySelector(".wg-cols"), view.querySelector(".wgbar"), null, null, { fixedHeight: true });
    animateProgressCount();
  }

  // Vierter Reiter: "wie lief es bisher?" - Rueckblick auf die vergangenen Wochen und der
  // Gewichtsverlauf. Beide Bausteine sind unveraendert die aus renderHome(); umgezogen ist
  // ihr Ort, nicht ihre Funktion.
  function renderProgress() {
    // Kein eigener Leerzustand noetig: weightHtml() liefert immer eine Karte - ohne
    // Einwilligung die Einladung dazu (weightConsentHtml), ohne Messung den leeren Zustand
    // mit Handlung. Der Reiter ist also nie eine leere Flaeche.
    // Reihenfolge: acht Wochen, dann das Jahr, dann das Gewicht - von der kurzen zur
    // langen Sicht. Kein fuenfter Reiter: der Kalender beantwortet dieselbe Frage wie der
    // Rueckblick ("wie lief es bisher?"), nur ueber einen laengeren Zeitraum.
    view.innerHTML = `${rueckblickHtml()}${kalenderHtml()}${weightHtml()}`;
    resetCarousels();
    initWeightChart();
    initRueckblick();
    initKalender();
  }

  // Kurzform eines Wochenschluessels fuers Label: "2026-W29" -> "KW 29".
  function weekKwLabel(wk) { const m = /-W(\d+)$/.exec(wk); return m ? "KW " + Number(m[1]) : wk; }
  // Paket C1: Rueckblick auf Home — Streak (Wochen in Folge geplant) + Mini-Trend der
  // durchschnittlichen Tageskalorien der letzten Wochen + Ziel-Treffer-Quote. Quelle ist das
  // schlanke Archiv state.weekStats (abgelaufene Wochen, siehe archiveWeek). Ohne Ziel oder ohne
  // jede Historie/ Streak faellt der Block ganz weg (kein leerer Kasten fuer neue Nutzer).
  // Mittleres Tagesziel nach dem HEUTIGEN Stand — Rueckfall fuer Wochen, die vor B10
  // archiviert wurden und deshalb kein eingefrorenes `target` tragen.
  function avgDailyTargetToday() {
    let sum = 0, n = 0;
    DAYS.forEach(d => { const t = goalTargetsForDay(d.key); if (t && t.kcal) { sum += t.kcal; n++; } });
    return n ? Math.round(sum / n) : 0;
  }
  // Eine Woche zaehlt fuer den Streak erst ab so vielen geplanten Tagen. Vorher genuegte
  // EINE Mahlzeit — ein Streak, den man nicht verlieren kann, motiviert niemanden.
  const STREAK_MIN_DAYS = 5;

  // Zweite Serie: Tage am Stueck (Paket 6, B8).
  //
  // Sie steht NEBEN der Wochenserie, nicht an ihrer Stelle. "5 Wochen in Folge geplant"
  // (STREAK_MIN_DAYS) ist eine festgehaltene Produktentscheidung (docs/PRODUCT.md) und
  // bleibt unangetastet - andere Einheit, andere Aussage, deshalb auch nicht die Flamme:
  // die gehoert der Wochenserie.
  //
  // Die Bits kommen aus kalWoche(), also aus derselben Quelle wie der Kalender. Die
  // Doppelung zwischen beiden Zaehlweisen wird ueber diesen geteilten Maskenzugriff
  // vermieden, nicht ueber eine gemeinsame Streak-Logik - die Regeln sind verschieden.
  function dayStreak() {
    // null = unbekannt. Nicht dasselbe wie 0: eine Woche MIT Datensatz aber OHNE Maske
    // (vor dem 29.08.2026 archiviert) als lauter Nullen zu lesen waere eine Luege.
    // Abbrechen unterschaetzt die Serie nur - das ist die harmlosere Richtung.
    const bitAn = d => {
      const info = kalWoche(isoWeekKey(d));
      if (!info || info.mask === null) return null;
      return info.mask.charAt((d.getDay() || 7) - 1) === "1" ? 1 : 0;
    };
    const cur = new Date();
    // Der eine bewusste Off-by-one: Ist heute noch nichts geplant, beginnt die Zaehlung
    // bei gestern. Ein Vormittag, an dem man noch nicht geplant hat, darf eine laufende
    // Serie nicht abraeumen - das waere Bestrafung fuer den Tagesverlauf.
    if (bitAn(cur) !== 1) cur.setDate(cur.getDate() - 1);
    let n = 0, deckel = 400;                  // Deckel: das Archiv reicht ueber Jahre
    while (deckel-- > 0 && bitAn(cur) === 1) { n++; cur.setDate(cur.getDate() - 1); }
    return n;
  }

  function rueckblickHtml() {
    if (!state.goal) return "";
    const stats = state.weekStats || {};
    const keys = Object.keys(stats).sort();
    // Streak: aufeinanderfolgende Wochen rueckwaerts, die den Anspruch erfuellen; die
    // aktuelle zaehlt mit, sobald sie ihn ebenfalls erfuellt.
    const curKey = weekKeyFor("cur");
    const curPlan = state.plans[curKey];
    const curDays = curPlan ? DAYS.filter(d => hasNut(dayNutOf(curPlan, d.key))).length : 0;
    let streak = 0; const dcur = new Date(); dcur.setDate(dcur.getDate() - 7);
    while (true) { const wk = isoWeekKey(dcur); if (stats[wk] && stats[wk].days >= STREAK_MIN_DAYS) { streak++; dcur.setDate(dcur.getDate() - 7); } else break; }
    if (curDays >= STREAK_MIN_DAYS) streak++;
    if (!keys.length && !streak) return "";
    // ZWEI ABGELEITETE LISTEN AUS EINEM ARCHIV - bitte nicht "vereinfachen":
    //
    // Der STREAK oben laeuft ueber ALLE Wochen. Er fragt nur "wurde geplant?" und braucht
    // dafuer kein Ziel - wer ohne Ziel plant, hat trotzdem eine Serie.
    //
    // Die GRAFIK darunter zeigt dagegen Wochen GEGEN IHR ZIEL. Eine Woche ohne eigenes
    // `target` gehoert dort nicht hinein. Seit archiveWeek() auch ohne Ziel archiviert
    // (Paket 6, B2), entstehen solche Wochen regelmaessig - genau auf dem normalen Weg:
    // erst ein paar Wochen planen, spaeter das erste Ziel setzen.
    //
    // Vorher fielen sie auf avgDailyTargetToday() zurueck, wurden also am HEUTIGEN Ziel
    // gemessen - der Fehler, gegen den seinerzeit B10 gebaut wurde - und die Tippzeile
    // behauptete "0 von 5 Tagen im Ziel" fuer eine Woche, in der es gar kein Ziel gab.
    // Das ist keine fehlende Aussage, sondern eine falsche.
    const zielKeys = keys.filter(k => stats[k].target);
    const shownKeys = zielKeys.slice(-8);
    if (!shownKeys.length && !streak) return "";
    // Erst ab zwei Tagen: "1 Tag am Stueck" ist keine Serie, sondern ein Dienstag.
    const tage = dayStreak();
    const tageS = tage >= 2 ? `<div class="rueck-s"><small>Am Stück</small><b>${tage}<span>Tage</span></b></div>` : "";
    let chart = "";
    if (shownKeys.length) {
      const bars = shownKeys.map(k => {
        const s = stats[k];
        const target = s.target;   // garantiert gesetzt, siehe Filter oben
        // Verhaeltnis zum Ziel; gezeichnet wird bis 140 %, alles darueber laeuft an die
        // Decke (der genaue Wert steht in der Tippzeile).
        const ratio = s.kcal / target;
        const h = Math.max(4, Math.min(100, Math.round(ratio / 1.4 * 100)));
        const hit = Math.abs(s.kcal - target) <= target * 0.1;
        const label = `${weekKwLabel(k)} · Ø ${nfmt(s.kcal)} kcal · Ziel ${nfmt(target)} · ${s.hit} von ${s.days} Tagen im Ziel`;
        return `<button type="button" class="rueck-bar${hit ? " hit" : ""}" data-tip="${esc(label)}" aria-label="${esc(label)}"><i style="height:${h}%"></i></button>`;
      }).join("");
      const kws = shownKeys.map(k => `<span>${esc(weekKwLabel(k).replace("KW ", ""))}</span>`).join("");
      const totDays = shownKeys.reduce((a, k) => a + stats[k].days, 0);
      const totHit = shownKeys.reduce((a, k) => a + stats[k].hit, 0);
      const vals = shownKeys.map(k => stats[k].kcal);
      const avgKcal = Math.round(vals.reduce((a, v) => a + v, 0) / vals.length);
      const lastKey = shownKeys[shownKeys.length - 1];
      const lastS = stats[lastKey];
      const lastTarget = lastS.target;
      const firstTip = `${weekKwLabel(lastKey)} · Ø ${nfmt(lastS.kcal)} kcal · Ziel ${nfmt(lastTarget)} · ${lastS.hit} von ${lastS.days} Tagen im Ziel`;
      chart = `<div class="rueck-plot">
          <div class="rueck-band"></div>
          <div class="rueck-bandlbl">Ziel ±10 %</div>
          <div class="rueck-bars" role="group" aria-label="Wochen im Rückblick">${bars}</div>
        </div>
        <div class="rueck-kws" aria-hidden="true">${kws}</div>
        <p class="rueck-tip" aria-live="polite">${esc(firstTip)}</p>
        <div class="rueck-foot">
          <div class="rueck-s"><small>&#216; pro Tag</small><b>${nfmt(avgKcal)}<span>kcal</span></b></div>
          <div class="rueck-s"><small>Ziel getroffen</small><b>${totHit}<span>/${totDays} Tage</span></b></div>
          ${tageS}
        </div>`;
    }
    // Ohne Grafik gibt es keinen Fuss, in den die Kennzahl koennte - dann traegt sie ihren
    // eigenen. Wer ohne Ziel plant, hat trotzdem eine Serie (siehe archiveWeek, B2).
    if (!chart && tageS) chart = `<div class="rueck-foot">${tageS}</div>`;
    const flame = `<svg class="rueck-fl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2c.4 3-1.6 4.2-2.9 5.6C9.2 9 8 10.4 8 12.6a4 4 0 0 0 8 .2c0-1.3-.5-2.3-1-3 .9.4 1.7 1.2 2.2 2.3.3-.7.5-1.6.5-2.6 0-3.4-2.3-5.4-4.2-7.5z"/></svg>`;
    const streakLine = streak
      ? `<div class="rueck-streak">${flame}<span><b>${streak}</b> Woche${streak === 1 ? "" : "n"} in Folge geplant</span></div>`
      : "";
    // Die Klartextzeile ist kein Schmuck: ohne sie liest man die Grafik als Verlauf des
    // tatsaechlich Gegessenen. Sie zeigt GEPLANTE Kalorien - das ist Absicht (Planer, kein
    // Tracker), steht aber nirgends sonst.
    return `<section class="rueck">
        <div class="wg-lbl">Rückblick</div>
        <p class="rueck-note">Ø geplante Kalorien je Tag, gegen dein Ziel.</p>
        ${streakLine}
        ${chart}
      </section>`;
  }
  // Werte per Tipp statt nur im title-Attribut: auf dem Handy gibt es kein Hover, dort war
  // die Grafik bisher vollstaendig unbeschriftet. Klick UND Fokus, damit die Tastatur
  // denselben Weg hat (gleiches Muster wie initWeightChart).
  function initRueckblick() {
    const tip = view.querySelector(".rueck-tip");
    if (!tip) return;
    view.querySelectorAll(".rueck-bar").forEach(b => {
      const show = () => { tip.textContent = b.dataset.tip || ""; };
      b.addEventListener("click", show);
      b.addEventListener("focus", show);
      // Hover ergaenzt (Befund aus dem Pruefdurchgang): Am Rechner erwartet man Werte beim
      // Darueberfahren. Ohne diese Zeile schwieg die Grafik dort, weil mit dem title-
      // Attribut auch der einzige Hover-Weg entfallen war. Gleiches Muster wie
      // initWeightChart() - dort steht mouseenter seit jeher neben click und focus.
      b.addEventListener("mouseenter", show);
    });
  }

  // ---------- Fortschritt-Kalender (Paket 6, B7/B11) ----------
  //
  // Zwei Ansichten aus EINER Grundform: ein Monatsgitter gross (Monatsansicht) oder
  // zwoelf davon klein (Jahresansicht). Je Zelle EIN Bit - an diesem Tag war etwas
  // geplant oder nicht. Keine Intensitaetsabstufung und keine Note: die App plant, sie
  // bewertet nicht, WIE VIEL oder WIE GUT geplant wurde (CLAUDE.md Abschnitt 6).
  //
  // Es sind echte <table>-Elemente. Eine Tabelle liefert Zeilen- und Spaltennavigation
  // umsonst, und der Screenreader sagt beim Hineinspringen von selbst "Mittwoch, Maerz,
  // geplant". Ein Grid oder display:contents auf Tabellenelementen naehme ihm genau das.
  //
  // Bis zum 30.08.2026 stand hier ein 7x53-Band im Stil eines Beitragsdiagramms. Es ist
  // dem Monatsgitter gewichen, weil eine 5-px-Zelle zwar ein Muster zeigt, aber keinen
  // Tag - und "habe ich den 17. geplant?" ist die Frage, die man an einen Kalender hat.
  // Mit ihm sind KAL_MON_KURZ (Monatsband) und isoWochenImJahr() (Spaltenzahl) entfallen;
  // beide hatten ausserhalb des Bandes keinen Aufrufer.
  const KAL_MON_LANG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

  // Was ueber eine Woche bekannt ist - EINE Quelle fuer beide Faelle.
  //
  // Die laufende und die naechste Woche stehen NICHT in weekStats; das ist der Sinn von
  // pruneWeeks(). Sie kommen direkt aus state.plans, und zwar ueber denselben weekMaskOf(),
  // den auch archiveWeek() benutzt. Zwei getrennte Fassungen wuerden sich in genau dem
  // Moment widersprechen, in dem eine laufende Woche archiviert wird.
  //
  // Rueckgabe:
  //   { mask: "1101100", tage: 4 }   Tage bekannt
  //   { mask: null, tage: n }        Woche bekannt, Tage nicht - vor B3 archiviert, kein `d`
  //   null                           ueber die Woche ist nichts bekannt
  function kalWoche(wk) {
    const pl = state.plans && state.plans[wk];
    if (pl) { const m = weekMaskOf(pl); return { mask: m, tage: maskDays(m) }; }
    const s = (state.weekStats || {})[wk];
    if (!s) return null;
    if (/^[01]{7}$/.test(s.d || "")) return { mask: s.d, tage: maskDays(s.d) };
    // Datensatz ohne Maske: die Woche WURDE geplant (days steht fest), nur an welchen Tagen
    // ist unbekannt. Sie als sieben Nullen zu zeichnen waere eine Aussage, die niemand
    // erhoben hat - deshalb ein eigener, neutral gefuellter Zustand statt einer stillen Luege.
    return { mask: null, tage: Math.max(0, Math.round(Number(s.days) || 0)) };
  }

  // Zustand EINES Tages - die gemeinsame Lesart fuer Monatsgitter und Tages-Serie.
  //
  // Dieselben vier Faelle wie im Jahresband, nur tagweise adressiert statt ueber die
  // Position in der Wochenschleife. Rueckgabe ist die CSS-Klasse bzw. null:
  //   "on"   geplant
  //   "off"  nichts geplant
  //   "unk"  Woche bekannt, Tage nicht (vor dem 29.08.2026 archiviert)
  //   null   ueber die Woche ist nichts bekannt - Zukunft und die Zeit vor der ersten
  //          Nutzung sehen absichtlich gleich aus, beides ist "keine Aussage"
  //
  // Der Bit-Index ist (getDay()||7)-1, also Mo=0 wie in DAYS und wie in weekMaskOf(). Ueber
  // den MONATSTAG zu greifen waere der naheliegende Fehler - dagegen laeuft die Gegenprobe
  // in tools/pruefstand-kalender.py.
  function kalTagStatus(d) {
    const info = kalWoche(isoWeekKey(d));
    if (!info) return null;
    if (info.mask === null) return "unk";
    return info.mask.charAt((d.getDay() || 7) - 1) === "1" ? "on" : "off";
  }

  // Monatsgitter (Yazio-Vorbild). Sieben Spalten, montagsbeginnend, eine Zeile je Woche.
  //
  // Warum es das NEBEN dem Jahresband gibt: Im Band ist eine Zelle rund 5 px gross - man
  // sieht ein Muster, aber keinen Tag. Wer wissen will "habe ich den 17. geplant?", findet
  // das dort nicht. Der Monat beantwortet genau diese Frage, das Band die nach dem Jahr.
  //
  // KEINE Bewertung: gruener Haken heisst "geplant", nicht "Ziel erreicht". Ein rotes X
  // waere eine Note fuer den Nutzer (CLAUDE.md Abschnitt 6) - und die Daten dafuer gibt es
  // ohnehin nur je WOCHE (`hit` in archiveWeek), nicht je Tag.
  // EIN Monatsgitter - die gemeinsame Grundform beider Ansichten.
  //
  // `mini` unterscheidet die Dichte, nicht die Bedeutung:
  //   false  Monatsansicht: grosse Zelle, Zahl UND Haken-Symbol, Wochentag zweibuchstabig
  //   true   Jahresansicht: zwoelf davon nebeneinander, rund 20-30 px je Zelle. Dort passt
  //          kein Symbol mehr neben die Zahl - den Zustand traegt die Flaeche HINTER ihr.
  //
  // In beiden Faellen haengt der Zustand nicht an der Farbe allein: "geplant" hat eine
  // Flaeche, "nichts geplant" eine Kante, "keine Daten" gar nichts. Das ist dieselbe
  // Staffelung wie im frueheren Jahresband, nur in Zellen statt in Punkten.
  function kalGitterHtml(year, mon, mini) {
    const jahr = +year;
    const erster = new Date(jahr, mon, 1);
    const tage = new Date(jahr, mon + 1, 0).getDate();
    const vorlauf = (erster.getDay() || 7) - 1;        // Mo=0: wie viele Leerzellen davor
    const heute = new Date();
    const heuteStr = heute.getFullYear() + "-" + String(heute.getMonth() + 1).padStart(2, "0") + "-" + String(heute.getDate()).padStart(2, "0");

    // Erst die Daten, dann das Markup - gleiche Reihenfolge wie im Band, damit die
    // Klartextzeile ueber demselben Bestand steht, den das Gitter zeichnet.
    const zellen = [];
    let geplant = 0;
    for (let i = 0; i < vorlauf; i++) zellen.push(null);
    for (let t = 1; t <= tage; t++) {
      const d = new Date(jahr, mon, t);
      const st = kalTagStatus(d);
      if (st === "on") geplant++;
      zellen.push({ t: t, st: st, iso: jahr + "-" + String(mon + 1).padStart(2, "0") + "-" + String(t).padStart(2, "0") });
    }
    while (zellen.length % 7 !== 0) zellen.push(null);

    // ZWEI Fassungen desselben Satzes, und das ist keine Doppelung:
    // `satz` steht in der <caption> und muss allein stehen koennen - wer die Tabelle nicht
    // sieht, bekommt hier den ganzen Zusammenhang. `notiz` steht sichtbar direkt UNTER der
    // Navigationszeile, die den Monat schon nennt; ihn dort zu wiederholen waere genau der
    // Erklaersatz, den CLAUDE.md Abschnitt 6 nicht will.
    const satz = geplant
      ? `${KAL_MON_LANG[mon]} ${year}: ${geplant} von ${tage} Tagen geplant`
      : `${KAL_MON_LANG[mon]} ${year}: noch kein geplanter Tag.`;
    const notiz = geplant ? `${geplant} von ${tage} Tagen geplant` : "Noch kein geplanter Tag.";

    // Der Einstieg fuer die Tastatur ist "heute"; liegt heute nicht in diesem Monat, der
    // Monatserste. Genau EIN Tabstopp, in ihm bewegen die Pfeiltasten (initKalender).
    const heuteImMonat = zellen.some(z => z && z.iso === heuteStr);
    const einstieg = heuteImMonat ? heuteStr : (zellen.find(z => z) || {}).iso;

    // Im Mini-Gitter ist die Spalte rund 20 px breit - "Mo" passt dort nicht mehr, ein
    // Buchstabe schon. Mehrdeutig ist das nur ohne Zusammenhang: In einem Kalender mit
    // sieben Spalten liest niemand "M D M D F S S" falsch. Der volle Wochentag steht in
    // beiden Faellen unsichtbar daneben, und er ist es, den der Screenreader vorliest.
    const kopf = DAYS.map(d =>
      `<th scope="col" class="kal-wd"><span aria-hidden="true">${mini ? d.short.charAt(0) : d.short}</span><span class="visually-hidden">${d.label}</span></th>`).join("");

    let zeilen = "";
    for (let i = 0; i < zellen.length; i += 7) {
      zeilen += "<tr>" + zellen.slice(i, i + 7).map(z => {
        // Fuellzellen vor dem Ersten und nach dem Letzten: leer, ohne Zahl, fuer den
        // Screenreader gar nicht vorhanden. Sie tragen keinen Zustand - ein leerer Kreis
        // waere hier die Aussage "nichts geplant" ueber einen Tag, den es im Monat nicht gibt.
        if (!z) return `<td class="kal-t pad" aria-hidden="true"></td>`;
        const wort = z.st === "on" ? "geplant" : z.st === "unk" ? "Tage nicht aufgezeichnet" : z.st === "off" ? "nichts geplant" : "keine Daten";
        const ist = z.iso === heuteStr;
        return `<td class="kal-t${z.st ? " " + z.st : ""}${ist ? " today" : ""}" data-d="${z.iso}"`
          + ` tabindex="${z.iso === einstieg ? 0 : -1}"${ist ? ` aria-current="date"` : ""}>`
          + `<span class="kal-num">${z.t}</span>`
          + (mini ? "" : `<span class="kal-sym" aria-hidden="true">${z.st === "on" ? ICON_CHECK : ""}</span>`)
          + `<span class="visually-hidden">${wort}</span></td>`;
      }).join("") + "</tr>";
    }

    // Die <caption> ist der natuerliche Ort fuer den Monatsnamen - im Jahr SICHTBAR (zwoelf
    // Gitter ohne Beschriftung waeren ein Raetsel), im Monat verborgen, weil die
    // Navigationszeile ihn dort schon nennt. Beide Male traegt sie zusaetzlich den ganzen
    // Satz fuer den Screenreader: Jede Tabelle muss allein stehen koennen.
    const caption = mini
      ? `<caption class="kal-cap"><span aria-hidden="true">${KAL_MON_LANG[mon]}</span><span class="visually-hidden">${esc(satz)}</span></caption>`
      : `<caption class="visually-hidden">${esc(satz)}</caption>`;

    return {
      satz: satz,
      notiz: notiz,
      geplant: geplant,
      tage: tage,
      tabelle: `<table class="kal-grid${mini ? " mini" : " monat"}" data-year="${year}" data-mon="${mon}" aria-describedby="kal-hilfe">
            ${caption}
            <thead><tr>${kopf}</tr></thead>
            <tbody>${zeilen}</tbody>
          </table>`
    };
  }

  // Die Monatsansicht ist genau ein Gitter in voller Groesse.
  function kalMonatHtml(year, mon) { return kalGitterHtml(year, mon, false); }

  // Monatsnavigation: ein Pfeil je Richtung, dazwischen der Zeitraum. Die Grenzen sind die
  // Jahre aus weightYears() - weiter zu blaettern hiesse, in garantiert leere Monate zu
  // laufen. Ein Schritt ueber die Jahresgrenze verstellt AUCH state.viewYear; Kalender und
  // Gewichtskarte teilen sich dieses eine Jahr (siehe Kommentar bei weightYears).
  function kalNavHtml(year, mon) {
    const ys = weightYears();
    const amAnfang = year === ys[0] && mon === 0;
    const amEnde = year === ys[ys.length - 1] && mon === 11;
    const knopf = (step, label, gesperrt) =>
      `<button class="kal-nb" data-action="kalnav" data-step="${step}" aria-label="${label}"${gesperrt ? " disabled aria-disabled=\"true\"" : ""}>${step < 0 ? ICON_CHEV_L : ICON_CHEV_R}</button>`;
    return `<div class="kal-nav">
        ${knopf(-1, "Vorheriger Monat", amAnfang)}
        <span class="kal-nm" aria-live="polite">${KAL_MON_LANG[mon]} ${year}</span>
        ${knopf(1, "Nächster Monat", amEnde)}
      </div>`;
  }

  // Der gezeigte Monat. Wie activeYear() eine Absicherung gegen einen unsinnigen Wert im
  // State, nicht bloss ein Feldzugriff.
  function activeMonth() {
    const m = Number(state.kalMonth);
    return (m >= 0 && m <= 11) ? Math.floor(m) : new Date().getMonth();
  }

  // Die Huelle: Kopf, Ansichtswahl, Zeitraumwahl, Klartextzeile, Gitter, Tipp-Zeile.
  // Welches Gitter, entscheidet state.kalMode - beide liefern denselben { satz, tabelle }.
  function kalenderHtml() {
    const year = activeYear();
    const monat = state.kalMode !== "jahr";
    const mon = activeMonth();
    const daten = monat ? kalMonatHtml(year, mon) : kalJahrHtml(year);

    // Zwei Bedienzeilen sind das Maximum. In der Monatsansicht traegt die Navigation den
    // Zeitraum, die Jahresleiste entfaellt deshalb dort - verloren geht sie nicht, die
    // Gewichtskarte darunter baut sich ihre eigene (jahrLeisteHtml).
    const zeitraum = monat ? kalNavHtml(year, mon) : jahrLeisteHtml(year);
    // EIN Hilfetext fuer beide Ansichten, seit beide aus derselben Gitterform bestehen.
    // Der Zusatz gilt nur im Jahr: dort ist jeder Monat ein eigenes Gitter mit eigenem
    // Tabstopp, und wer das nicht weiss, sucht den Weg von Januar nach Februar mit den
    // Pfeiltasten - vergeblich.
    const hilfe = "Mit den Pfeiltasten zwischen den Tagen bewegen; Pos1 und Ende springen an den Anfang und das Ende der Woche."
      + (monat ? "" : " Mit der Tabulatortaste zum nächsten Monat.");

    return `<div class="wg-col kal">
        <div class="wch-head">
          <div>
            ${monat ? "" : `<div class="wg-lbl">Jahr ${year}</div>`}
            <h3 class="wg-h">Geplante Tage</h3>
          </div>
          <div class="week-switch" role="tablist" aria-label="Ansicht wählen">
            <button class="ws-btn${monat ? " active" : ""}" data-action="kalmode" data-mode="monat" role="tab" aria-selected="${monat}">Monat</button>
            <button class="ws-btn${monat ? "" : " active"}" data-action="kalmode" data-mode="jahr" role="tab" aria-selected="${!monat}">Jahr</button>
          </div>
        </div>
        ${zeitraum}
        <p class="kal-note${monat ? " monat" : ""}">${esc(daten.notiz || daten.satz)}</p>
        <div class="kal-wrap">${daten.tabelle}</div>
        <p class="kal-tip" aria-live="polite"></p>
        <p id="kal-hilfe" class="visually-hidden">${hilfe}</p>
      </div>`;
  }

  // Die Jahresansicht: zwoelf Monatsgitter statt eines Bandes (seit 30.08.2026).
  //
  // Vorher stand hier ein 7x53-Band im Stil eines Beitragsdiagramms. Es zeigte viel auf
  // einmal, aber eine Zelle war rund 5 px gross - man las ein Muster, keinen Tag. Zwoelf
  // kleine Kalender beantworten dieselbe Frage ("wie lief das Jahr?") und obendrein die,
  // an der das Band scheiterte: WANN genau. Es ist dieselbe Form wie in der Monatsansicht,
  // nur dichter - ein Muster statt zweier.
  //
  // Die Jahreszahl steht NICHT an jedem Gitter: sie steht einmal im Umschalter darueber.
  // Zwoelfmal "2026" waere Fuellung, kein Hinweis.
  function kalJahrHtml(year) {
    let geplant = 0, tage = 0;
    const gitter = [];
    for (let m = 0; m < 12; m++) {
      const g = kalGitterHtml(year, m, true);
      geplant += g.geplant;
      tage += g.tage;
      gitter.push(g.tabelle);
    }

    // Gezaehlt werden TAGE, nicht mehr Wochen. Das Band rechnete in Wochen, weil eine
    // Spalte eine Woche war; hier ist eine Zelle ein Tag, und zwei verschiedene Einheiten
    // fuer dieselbe Karte waeren nur verwirrend. Der Monat sagt "18 von 31 Tagen", das
    // Jahr sagt es im selben Vokabular.
    const satz = geplant
      ? `${year}: ${geplant} von ${tage} Tagen geplant`
      : `${year}: noch kein geplanter Tag.`;
    const notiz = geplant ? `${geplant} von ${tage} Tagen geplant` : "Noch kein geplanter Tag.";

    return {
      satz: satz,
      notiz: notiz,
      tabelle: `<div class="kal-jahr">${gitter.join("")}</div>`
    };
  }

  // Jahr-Umschalter. Steht als eigener Helfer da, weil ihn seit B7 ZWEI Karten benutzen
  // (Kalender und Gewicht) und beide dasselbe state.viewYear lesen - ein Tipp bewegt
  // sichtbar beide. Die Jahre kommen aus weightYears(), das die Archivjahre seinerseits
  // ueber archivJahreZeigen() bezieht (docs/ARCHITECTURES.md, "Archivfenster").
  function jahrLeisteHtml(year) {
    const years = weightYears();
    if (years.length < 2) return "";
    return `<div class="week-switch" role="tablist" aria-label="Jahr wählen">
        ${years.map(y => `<button class="ws-btn${y === year ? " active" : ""}" data-action="wyear" data-year="${y}" role="tab" aria-selected="${y === year}">${y}</button>`).join("")}
      </div>`;
  }

  // Werte per Tipp statt per Titel-Attribut - dasselbe Muster wie initRueckblick(): auf dem
  // Handy gibt es kein Hover.
  //
  // Seit die Jahresansicht aus zwoelf Monatsgittern besteht, bedient diese Funktion 1 oder
  // 12 Tabellen DERSELBEN Bauart. Das ist der eigentliche Gewinn des Umbaus: Vorher gab es
  // zwei Gitterarten mit zwei Zellklassen, zwei Spaltenzaehlungen (das Band hatte einen
  // Zeilenkopf, das Monatsgitter nicht) und zwei Wegen, aus einer Zelle ihr Datum zu
  // gewinnen. Jetzt gibt es einen.
  //
  // JEDES Gitter traegt genau EINEN Tabstopp - in der Jahresansicht also zwoelf, einen je
  // Monat. Das ist Absicht und nicht dasselbe wie die 371 Tabstopps, gegen die das Band
  // seinerzeit gebaut wurde: Mit zwoelf springt man gezielt in einen Monat, mit 371 kaeme
  // man aus der Karte nicht mehr heraus.
  function initKalender() {
    const tabs = view.querySelectorAll(".kal-grid");
    const tip = view.querySelector(".kal-tip");
    if (!tabs.length || !tip) return;

    const zustandVon = td => td.classList.contains("on") ? "geplant"
      : td.classList.contains("unk") ? "Tage nicht aufgezeichnet"
      : td.classList.contains("off") ? "nichts geplant"
      : "keine Daten";
    // Das Datum kommt aus data-d, nicht aus der Position: Wegen der Fuellzellen ist die
    // Spalte kein verlaesslicher Traeger. 31 Attribute je Gitter sind dabei kein Ballast -
    // im frueheren Band waeren es 371 in EINER Tabelle gewesen.
    const zeig = td => {
      const iso = td.dataset.d;
      if (!iso) return;
      const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
      tip.textContent = `${DAYS[(d.getDay() || 7) - 1].short}, ${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)} · ${zustandVon(td)}`;
    };

    // Der Tabstopp wandert mit, aber nur INNERHALB seines Gitters: Wer im Mai war und
    // zurueckkommt, landet im Mai. Wuerde er ueber alle zwoelf wandern, haetten elf
    // Monate zwischendurch gar keinen Einstieg mehr.
    function setzeEinstieg(td) {
      const tab = td.closest("table");
      const alt = tab.querySelector('td.kal-t[tabindex="0"]');
      if (alt && alt !== td) alt.tabIndex = -1;
      td.tabIndex = 0;
    }

    tabs.forEach(tab => {
      // Fokus zeigt denselben Tipp wie Klick und Hover - sonst haette die Tastatur zwar
      // einen Weg in die Tabelle, aber keine Antwort darin (gleiches Muster wie
      // initRueckblick und initWeightChart).
      tab.querySelectorAll("td.kal-t:not(.pad)").forEach(td => {
        td.addEventListener("click", () => { setzeEinstieg(td); zeig(td); });
        td.addEventListener("mouseenter", () => zeig(td));
        td.addEventListener("focus", () => zeig(td));
      });

      // Pfeiltasten im Gitter. Ohne sie waere die Zelle zwar fokussierbar, aber nur EINE -
      // die Tastatur haette Zugang zu genau einem Tag des Monats.
      tab.addEventListener("keydown", e => {
        const td = e.target;
        if (!td.classList || !td.classList.contains("kal-t")) return;
        const zeile = td.parentElement, koerper = zeile.parentElement;
        let z = zeile.sectionRowIndex, sp = td.cellIndex;
        const letzteSp = zeile.cells.length - 1;
        let schritt = 0;
        if (e.key === "ArrowRight") { sp++; schritt = 1; }
        else if (e.key === "ArrowLeft") { sp--; schritt = -1; }
        else if (e.key === "ArrowDown") z++;
        else if (e.key === "ArrowUp") z--;
        else if (e.key === "Home") { sp = 0; schritt = 1; }
        else if (e.key === "End") { sp = letzteSp; schritt = -1; }
        else return;
        if (z < 0 || z >= koerper.rows.length || sp < 0 || sp > letzteSp) return;
        let ziel = koerper.rows[z].cells[sp];
        // Fuellzellen ueberspringen. Waagerecht laeuft die Bewegung weiter in ihre
        // Richtung; senkrecht gibt es kein "weiter" - dort ist die Fuellzelle der Rand.
        while (ziel && ziel.classList.contains("pad") && schritt) {
          sp += schritt;
          if (sp < 0 || sp > letzteSp) return;
          ziel = koerper.rows[z].cells[sp];
        }
        if (!ziel || ziel.classList.contains("pad")) return;
        e.preventDefault();          // sonst scrollt die Seite unter der Bewegung weg
        setzeEinstieg(ziel);
        ziel.focus();
      });
    });
  }

  // Zeichnet das Diagramm in der gemessenen Breite und haengt die Bedienung dran.
  // Punkt antippen/anfahren -> Datum und Gewicht in die Zeile darunter. Ein reiner
  // Hover-Tooltip haette auf dem Handy gar nichts gezeigt, deshalb Klick UND Fokus
  // (letzterer bedient zugleich die Tastatur).
  function initWeightChart() {
    const host = view.querySelector(".wch-plot");
    if (!host) return;
    const tip = view.querySelector(".wch-tip");
    const base = tip ? tip.textContent : "";
    const year = activeYear();
    const rows = (state.weights || []).filter(e => e.m.slice(0, 4) === year);
    const ziel = (state.weightGoals || {})[year];
    if (!rows.length) return;

    host.innerHTML = weightChartSvg(year, rows, ziel != null ? ziel : null, host.clientWidth);
    host.querySelectorAll(".wch-pt").forEach(pt => {
      const show = () => {
        const row = rows.filter(e => e.m === pt.dataset.m)[0];
        if (row && tip) tip.textContent = weekKeyLabel(row.m) + " · " + kgfmt(row.kg) + " kg";
        host.querySelectorAll(".wch-pt").forEach(o => o.classList.toggle("is-on", o === pt));
      };
      pt.addEventListener("click", show);
      pt.addEventListener("focus", show);
      pt.addEventListener("mouseenter", show);
    });
    const svg = host.querySelector(".wch-svg");
    if (svg) svg.addEventListener("mouseleave", () => {
      if (tip) tip.textContent = base;
      host.querySelectorAll(".wch-pt").forEach(o => o.classList.remove("is-on"));
    });
  }
  // Breite aendert sich (Drehen, Fenster ziehen) -> neu zeichnen, sonst behielte das
  // SVG seine alte Pixelbreite und stuende zu schmal oder abgeschnitten da.
  window.addEventListener("resize", () => { if (view.querySelector(".wch-plot")) initWeightChart(); });

  // sameTab: von render() durchgereicht - der dortige sameTab-Wert gilt VOR der
  // Zuweisung von lastRenderTab, genau der Zeitpunkt, der hier fuer die Anker-Regel
  // zaehlt ("kommt man gerade von einem anderen Tab?"). lastRenderTab selbst waere an
  // dieser Stelle schon auf "plan" gesetzt und wuerde einen Tabwechsel nicht mehr sehen.
  function renderPlan(sameTab) {
    let html = `<div class="section-head plan-head">
        <div class="title">
          <h2>Dein Wochenplan</h2>
        </div>
        <div class="plan-tools">
          <div class="week-switch" role="tablist" aria-label="Woche wählen">
            <span class="ws-ind" aria-hidden="true"></span>
            <!-- " Woche" steht in einem eigenen Span, weil es auf schmalen Geraeten per CSS
                 entfaellt (.ws-w). Uebrig bleibt "Aktuelle"/"Naechste" - im Wochenplan mit
                 der MO-SO-Leiste darunter eindeutig. Das aria-label traegt weiterhin den
                 vollen Text, damit eine Sprachausgabe nicht nur "Aktuelle" sagt. -->
            <button class="ws-btn${state.viewWeek === "next" ? "" : " active"}" data-action="week" data-week="cur" role="tab" aria-label="Aktuelle Woche" aria-selected="${state.viewWeek === "next" ? "false" : "true"}">Aktuelle<span class="ws-w"> Woche</span></button>
            <button class="ws-btn${state.viewWeek === "next" ? " active" : ""}" data-action="week" data-week="next" role="tab" aria-label="Nächste Woche" aria-selected="${state.viewWeek === "next" ? "true" : "false"}">Nächste<span class="ws-w"> Woche</span></button>
          </div>
          <!-- Einstieg in die Einkaufsliste. "Einkaufsliste" steht in einem eigenen Span,
               weil es auf schmalen Geraeten per CSS entfaellt (.sh-w) - genau wie " Woche"
               beim Umschalter darueber. Uebrig bleibt das Wagen-Symbol neben dem
               Muelleimer. Das aria-label traegt in BEIDEN Faellen den vollen Text: sichtbar
               steht am Rechner nur "Einkaufsliste", gemeint ist die der gezeigten Woche. -->
          <button class="btn ghost icon-gh shop-ic" data-action="shopping" title="Einkaufsliste der Woche" aria-label="Einkaufsliste der Woche">${TOOL_ICONS.cart}<span class="sh-w">Einkaufsliste</span></button>
          <!-- D2: Auto-Wochenplaner. Sichtbar nur MIT gesetztem Ziel - ohne Ziel gibt es
               nichts zu treffen, ein Knopf, der nur erklaeren kann, warum er nicht geht,
               ist keiner. Nicht ins Ueberlaufmenue: er ist das Pro-Zugpferd.
               Anders als der Einkaufsknopf behaelt er sein Wort auch auf dem Handy - er
               rutscht dort per CSS (.plan-auto) in eine eigene Zeile, weil "Woche planen"
               als Symbol allein nicht erratbar waere. -->
          ${canEdit() && goalTargets(1) ? `<button class="btn ghost icon-gh plan-auto" data-action="auto-plan" title="Woche automatisch planen" aria-label="Woche automatisch planen">${TOOL_ICONS.wand}<span class="pa-w">Woche planen</span></button>` : ""}
          <!-- B3: "Woche leeren" stand hier bis 13.08.2026 gleichrangig neben der
               Einkaufsliste - eine destruktive Aktion mit derselben Prominenz wie das
               meistgenutzte Werkzeug, direkt daneben. Jetzt im Ueberlaufmenue; die
               Rueckfrage im confirmModal bleibt zusaetzlich bestehen. -->
          ${canEdit() ? `<div class="plan-menu">
            <button class="btn ghost icon-gh" data-action="plan-menu" aria-haspopup="menu" aria-expanded="false" title="Weitere Aktionen" aria-label="Weitere Aktionen">⋯</button>
          </div>` : ""}
        </div>
      </div>`;

    // In der Naechste-Woche-Ansicht gibt es kein „heute“ – sonst wuerde derselbe
    // Wochentag faelschlich als heutiger markiert.
    const todayKey = state.viewWeek === "next" ? null : todayDayKey();

    // Tagesleiste: nur auf dem Handy sichtbar (CSS), dort Anzeige und Sprungziel des
    // Karussells. Kein role="tablist" – es sind keine Reiter, sondern Sprungmarken
    // in einen Streifen, der auch gewischt werden kann. Die Kurzform steht sichtbar,
    // der volle Wochentag im aria-label; sonst laese eine Sprachausgabe nur „Mo“.
    // Tagesleiste und Streifen sitzen zusammen im Sheet: auf dem Handy eine Flaeche fester
    // Hoehe (Leiste oben fest, Meals darin scrollend), am Rechner ein simpler Wrapper ohne
    // eigene Wirkung. Siehe .plan-sheet im 680px-Block.
    html += `<div class="plan-sheet">`;
    html += `<nav class="daybar" aria-label="Zum Wochentag springen"><span class="db-ind" aria-hidden="true"></span>`;
    DAYS.forEach(d => {
      const isToday = d.key === todayKey;
      // Gleicher Ausdruck wie unten in der Tageskarten-Schleife: ohne gesetztes Ziel
      // gibt es keine Trainingstage, dann bleibt der Reiter wie bisher.
      const isTrain = !!state.goal && isTrainingDay(d.key);
      html += `<button type="button" class="db-b${isToday ? " is-today" : ""}${isTrain ? " is-train" : ""}"
         aria-label="${esc(d.label)}${isTrain ? ", Trainingstag " + esc(trainLevel(goalTraining()[d.key].level).label) : ""}${isToday ? " (heute)" : ""}">
         <span>${d.short}</span>
         <span class="db-mk">${isTrain ? ICON_DUMBBELL : ""}<span class="db-dot" aria-hidden="true"></span></span>
       </button>`;
    });
    html += `</nav><div class="week">`;

    DAYS.forEach(d => {
      const isToday = d.key === todayKey;
      // dOver faerbt nur noch die Kopfzeile am Rechner (.day.over) - der Klartext
      // "120 kcal drüber" steht seit dem Badge-Wegfall wieder in der Fussbilanz
      // (goalBarHtml/dayGoalsHtml), das Badge selbst gibt es nicht mehr.
      const dTarget = goalTargetsForDay(d.key);
      const dSum = dayNut(d.key);
      const dOver = dTarget && hasNut(dSum) && goalState(dSum.kcal, dTarget.kcal) === "over";
      // Die Trainings-Markierung haengt am gespeicherten Ziel: ohne Ziel gibt es auch
      // keine Tagestypen, dann bleibt die Karte wie bisher.
      const isTrain = !!state.goal && isTrainingDay(d.key);
      html += `<section class="day${isToday ? " today" : ""}${dOver ? " over" : ""}${isTrain ? " training" : ""}" role="group" aria-label="${esc(d.label)}${isToday ? ", heute" : ""}"><div class="day-head"><span class="dname">${d.label}</span>${isTrain ? trainBadgeHtml(d.key) : ""}<span class="dtag">${isToday ? "Heute" : d.short}</span></div><div class="slots">`;
      MEALS.forEach(m => {
        const ids = state.plan[d.key][m.key];
        html += `<div class="slot" data-meal="${m.key}" data-slot="${d.key}:${m.key}">
          <div class="mlabel sec-h">${iconSvg(MEAL_ICON[m.key], "mlabel-ic")}${m.label}</div>`;
        const drag = canEdit();
        const showPencil = drag && groupMembers.length >= 2;
        // Die Karten stehen in der Reihenfolge, in der sie eingeplant wurden - es gibt
        // KEINE abweichende Anzeige-Sortierung mehr.
        //
        // Frueher wurden sie nach Zuweisung gruppiert (gemeinsam -> eigene -> andere),
        // damit fremde Gerichte gebuendelt am Ende stehen und sich einklappen lassen. Das
        // hatte einen Preis, der am Geraet auffiel: Weist man ein Gericht jemandem zu,
        // wechselt es die Gruppe und rutscht im selben Moment an eine andere Stelle - bei
        // zwei Mitgliedern schaltet das Personen-Icon sogar ohne Zwischenmenue durch, der
        // Sprung passiert also direkt unter dem Finger. Dieselbe Fehlerklasse wie beim
        // Makro-Aufklapper (docs/TROUBLESHOOTING.md, Punkt 59): ein Bedienelement, das
        // sich beim Benutzen wegbewegt, ist kaputt, auch wenn die Logik stimmt.
        //
        // Die Gruppierung loeste einen selteneren Fall (ab vier fremden Gerichten in EINEM
        // Slot, siehe SLOT_OTHERS_MAX), der Sprung traf jede einzelne Zuweisung. Das
        // Einklappen funktioniert auch ohne sie - siehe otherSeen unten.
        //
        // Der Original-Index bleibt jeder Karte ueber data-slot-src fest zugeordnet. Das
        // ist weiterhin wichtig: Er zeigt in state.plan, nicht auf die Anzeigeposition.
        const cards = [];
        ids.forEach((entry, idx) => {
          const r = getRecipe(entryId(entry));
          if (!r) return;
          const uids = entryUids(entry);
          // 0 = gemeinsam, 1 = eigene (ich bin dabei), 2 = andere
          const grp = uids === null ? 0 : (uids.indexOf(syncUid) !== -1 ? 1 : 2);
          cards.push({ r, idx, uids, grp });
        });
        const shown = cards.length;
        const otherTotal = cards.filter(c => c.grp === 2).length;
        const slotKey = d.key + ":" + m.key;
        const collapsed = otherTotal > SLOT_OTHERS_MAX && !expandedOthers.has(slotKey);
        const otherVisible = collapsed ? SLOT_OTHERS_MAX : otherTotal;
        let otherSeen = 0;
        cards.forEach(c => {
          const { r, idx, uids, grp } = c;
          if (grp === 2) {
            otherSeen++;
            // Ab dem (otherVisible + 1)-ten fremden Gericht ausblenden - gezaehlt in
            // Plan-Reihenfolge, nicht mehr am Listenende gebuendelt. Sichtbar bleiben
            // also die zuerst eingeplanten, der Rest steckt in "+N weitere".
            if (otherSeen > otherVisible) return;
          }
          const badge = grp !== 0 ? memberBadgeHtml(uids) : "";
          // Badges sind aria-hidden (rein dekorativ) - wer das Gericht isst, muss deshalb
          // im Titel stehen, sonst bleibt die Zuweisung fuer Screenreader unsichtbar.
          const assignNote = uids ? " – nur für " + uids.map(u => (memberByUid(u) ? firstName(memberByUid(u).name) : null) || "Jemanden").join(", ") : "";
          html += `<div class="filled"${drag ? ` draggable="true"` : ""} data-action="view" data-id="${r.id}" data-slot-src="${d.key}:${m.key}:${idx}" title="${esc(r.name)}${esc(assignNote)}${drag ? " – ziehen zum Verschieben" : ""}">
              <span class="r-thumb-wrap">${thumbHtml(r, "r-thumb", true)}${badge}</span>
              <div class="r-body"><div class="r-name">${esc(r.name)}</div>${recipeNut(r).kcal ? `<div class="r-meta">${nfmt(recipeNut(r).kcal)} kcal</div>` : ""}</div>
              ${showPencil ? `<button class="pencil" data-action="assign" data-slot-src="${d.key}:${m.key}:${idx}" aria-label="Zuweisung ändern" title="Zuweisung ändern">${ICON_PEOPLE}</button>` : ""}
              ${drag ? `<button class="x" data-action="unassign" data-slot-src="${d.key}:${m.key}:${idx}" aria-label="Entfernen" title="Entfernen">✕</button>` : ""}
            </div>`;
        });
        if (collapsed) html += `<button class="add more" data-action="toggle-others" data-slot="${slotKey}">+${otherTotal - otherVisible} weitere</button>`;
        else if (otherTotal > SLOT_OTHERS_MAX) html += `<button class="add more" data-action="toggle-others" data-slot="${slotKey}">Weniger anzeigen</button>`;
        if (canEdit()) html += `<button class="add${shown ? " more" : ""}" data-action="pick" data-day="${d.key}" data-meal="${m.key}">+ ${shown ? "Noch ein Meal" : "Meal wählen"}</button>`;
        html += `</div>`;
      });
      html += `</div>${dayNutHtml(dayNut(d.key), d.key)}</section>`;
    });

    // Tagesbilanz des gerade sichtbaren Tages. Steht AUSSERHALB von .week, weil dieser
    // Streifen wegen overflow-x auch senkrecht ein Scroll-Kontext ist - ein position:sticky
    // darin richtete sich an ihm aus statt am Bildschirm und bliebe einfach stehen (siehe
    // Kommentar bei .week). Nur auf dem Handy sichtbar; am Rechner traegt jede der sieben
    // Spalten ihre eigene Bilanz in der Karte. Gefuellt von paintDayBalance().
    html += `</div><div class="day-bal" id="day-bal" aria-live="polite"></div></div>`;
    view.innerHTML = html;
    // Waagerechte Position SOFORT wiederherstellen - noch vor resetCarousels()/initCarousel(),
    // damit deren Messungen (markActive/fitHeight/syncIndicator) nie den Montag-Zwischenstand
    // (scrollLeft 0, direkt nach view.innerHTML) sehen. Siehe pendingWeekX-Deklaration bei render().
    const weekStrip = view.querySelector(".week");
    if (pendingWeekX && weekStrip) weekStrip.scrollLeft = pendingWeekX;
    pendingWeekX = 0;
    syncStickyOffsets();
    resetCarousels(); // die Streifen des vorigen Durchlaufs sind gerade weggeworfen worden
    // fixedHeight: der Streifen wird EINMAL so hoch wie die hoechste Karte, statt bei
    // jedem Scroll-Bild der gerade sichtbaren zu folgen. Genau dieses laufende Schreiben
    // war die Ursache von TROUBLESHOOTING Ziffer 42 (Snap-Verlust beim Zurueckwischen).
    // Der Leerraum unter kurzen Tagen, der frueher dagegen sprach, faellt in der
    // Listen-Optik nicht mehr auf - es gibt keine Kartenrahmen mehr, die ihn einrahmen.
    //
    // onChange haelt die klebende Tagesbilanz unter dem Streifen aktuell. Der Rueckruf
    // existiert seit jeher (der Rechner haengt seinen Fussknopf daran), es kommt also kein
    // zweiter Beobachter fuer denselben Wechsel dazu.
    const planCarousel = initCarousel(
      weekStrip, view.querySelector(".daybar"), null,
      // Ohne Argument: paintDayBalance liest den Tag aus der Tagesleiste, die setActive()
      // unmittelbar davor gesetzt hat. Den Index hier durchzureichen war die Quelle eines
      // Fehlers (siehe dort).
      () => paintDayBalance(),
      { fixedHeight: true }
    );

    // Anker-Regel: "Aktuelle Woche" zeigt immer heute, "Nächste Woche" immer Montag -
    // beim Betreten des Tabs UND bei jedem Wochenwechsel, nie durch Zufall (siehe
    // Plan-Kontext). pendingDayTarget kommt vom week-Handler (Wochenwechsel) und wird
    // hier einmalig verbraucht; ohne gesetztes Ziel greift beim Tabwechsel "heute".
    let target = pendingDayTarget; pendingDayTarget = null;
    if (target == null && !sameTab) target = "today"; // Tabwechsel auf den Plan
    if (target === "today") target = todayKey ? DAYS.findIndex(d => d.key === todayKey) : 0;
    // "jump" ist bewusst nicht an "target > 0" gekoppelt: auch ein Sprung NACH Montag
    // (Index 0, z. B. "Nächste Woche") ist ein Sprung im Sinn der Anker-Regel. Kein
    // weekJumpDone mehr noetig (siehe pendingWeekX-Deklaration bei render()): render()
    // schreibt ".week" gar nicht mehr selbst, planCarousel.go() unten ueberschreibt die
    // gerade erst wiederhergestellte Position bewusst noch einmal mit dem Sprungziel.
    const jump = target != null;
    if (jump && planCarousel && target > 0) planCarousel.go(target, true); // quiet: Startzustand, keine Sprung-Bewegung

    // Die klebende Bilanz braucht hier KEINE Erstbefuellung: initCarousel() startet mit
    // activeIdx = -1 und ruft am Ende markActive(), onChange feuert also bei jedem Aufbau
    // von selbst - und go() weiter unten meldet einen Sprung ebenso.
    //
    // Ein zusaetzlicher Aufruf an dieser Stelle war sogar schaedlich: Er las den Index
    // ueber planCarousel.index() ein zweites Mal und ueberschrieb damit das Ergebnis des
    // Rueckrufs. Nach dem Entfernen eines Meals stand in der Leiste die Summe von Montag,
    // obwohl Dienstag angezeigt war. Eine Quelle fuer den aktiven Tag, nicht zwei.

    // Wochenwechsel-Uebergang (Schritt 5): Richtung kommt ausschliesslich aus
    // pendingWeekDir, einmalig konsumiert - render() laeuft auch bei jedem Meal-Einplanen
    // und jedem Cloud-Snapshot, dort darf nichts blitzen.
    const weekDir = pendingWeekDir; pendingWeekDir = 0;
    if (weekDir) slideIn(view.querySelector(".week"), weekDir);
    syncWeekSwitchPill(view.querySelector(".week-switch"), weekDir);
  }

  // Bewusst nicht gespeichert: beim Neuladen gilt wieder die Standardvorbelegung unten.
  const collapsedCats = new Set();
  // Vorbelegung laeuft nur einmal: sonst wuerfe jeder renderRecipes()-Aufruf (z. B. nach
  // dem Aufklappen einer Kategorie) die eigene Auswahl des Nutzers wieder um.
  let collapsedCatsSeeded = false;
  // Bewusst nicht gespeichert (wie collapsedCats): beim Neuladen ist die Liste wieder voll.
  let recipeQuery = "";
  // Welche Ansicht im Meals-Reiter: der eigene Bestand oder das Rezeptbuch. Wie recipeQuery
  // bewusst NICHT gespeichert - wer die App startet, will seine eigenen Meals sehen, nicht
  // den Katalog, in dem er zuletzt gestoebert hat.
  let recipeTab = "meine";
  // Suche und Filter des Rezeptbuchs sind BEWUSST getrennt von denen der eigenen Meals:
  // Es sind zwei Bestaende. Wer im Katalog nach "vegan" filtert und zurueckwechselt, will
  // seine eigene Liste vollstaendig sehen, nicht denselben Filter darauf.
  let cookbookQuery = "";
  const cookbookFilters = new Set();
  // Das Ernaehrungsprofil ist im Rezeptbuch kein VORFILTER mehr, sondern ein vorbelegter,
  // abschaltbarer Chip. Vorher war es eine unsichtbare Wand: Wer "vegetarisch" gewaehlt hatte,
  // kam an den Rest des Katalogs nur heran, indem er sein ZIEL umstellte - und genau dafuer
  // ist das Ziel nicht da. Jetzt sieht man, WARUM die Liste kuerzer ist, und kann es fuer
  // einen Blick abschalten. Die Automatik bleibt streng: cookbookVisible() ist unveraendert
  // und filtert weiter hart (Startmeals, Picker-Vorschlaege, Auto-Planer).
  //
  // Vorbelegt wird ueber eine SIGNATUR aus diet + avoid, nicht ueber ein Flag wie
  // collapsedCatsSeeded: Das Profil kann sich aus drei Richtungen aendern (erste Schritte,
  // "Ziele neu berechnen", Cloud-Snapshot in onRemote). Ein Flag muesste an jeder dieser
  // Stellen von Hand zurueckgesetzt werden - eine davon uebersieht der naechste Umbau, und
  // dann filtert die Ansicht stillschweigend nach dem alten Profil weiter. Die Signatur
  // merkt es von selbst.
  //
  // Abgewaehlte Chips bleiben innerhalb der Sitzung abgewaehlt, beim Neustart gilt wieder das
  // Profil. Umgekehrtes Vorzeichen zu recipeFilters (Kommentar unten): Dort ist der leere
  // Zustand der erklaerte, hier der vorbelegte.
  let cookbookSeedSig = null;
  function seedCookbookFilters() {
    const g = state.goal || {};
    const diet = DIET_KEYS.indexOf(g.diet) !== -1 ? g.diet : "alles";
    // Aus AVOID_KEYS neu aufbauen: sonst haengt die Signatur an der Tippreihenfolge.
    const avoid = Array.isArray(g.avoid) ? AVOID_KEYS.filter(k => g.avoid.indexOf(k) !== -1) : [];
    const sig = diet + "|" + avoid.join(",");
    if (sig === cookbookSeedSig) return;
    cookbookSeedSig = sig;
    cookbookFilters.clear();
    // Die Schluessel von DIETS/AVOIDS sind bewusst dieselben wie die von RECIPE_TAGS - es
    // braucht keine Uebersetzungstabelle, nur das "tag:"-Praefix aus recipeFilterHtml().
    if (diet !== "alles") cookbookFilters.add("tag:" + diet);
    avoid.forEach(k => cookbookFilters.add("tag:" + k));
  }
  // Alle Kategorien starten eingeklappt - siehe paintCookbook().
  const cookbookCollapsed = new Set(CATEGORIES);
  // Aktive Merkmals-Filter (B7), UND-verknuepft. Wie recipeQuery bewusst nicht gespeichert:
  // ein Filter, den man beim naechsten Start nicht mehr auf dem Schirm hat, erklaert eine
  // halb leere Liste nicht - er laesst sie kaputt aussehen.
  let recipeFilters = new Set();

  // "von Anna" auf der Karte - nur in einer Gruppe, nur bei fremden Meals, nur der Vorname.
  //
  // Das Meal speichert bei "by" ausschliesslich die uid, nie den Namen: der wird erst zur
  // Anzeigezeit aus der Mitgliederliste aufgeloest. Dadurch verschwindet der Personenbezug
  // automatisch, sobald jemand die Gruppe verlaesst oder sein Konto loescht - ohne dass in
  // n Meal-Dokumenten nachgeraeumt werden muss. Ist die uid unbekannt, steht schlicht nichts da.
  function recipeAuthorHtml(r) {
    if (!syncGid || !r || !r.by || r.by === syncUid) return "";
    const who = firstName((memberByUid(r.by) || {}).name);
    if (!who) return "";
    return `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(who)}</span>`;
  }

  // Kollidiert mit keiner echten Kategorie - Schluessel der Favoriten-Gruppe in der Map.
  const FAV_KEY = "__favs";

  // Baut nur Kopfzeile + (bei Meals) Suchfeld + leeren Container und haengt den
  // input-Listener an. Ein voller render() ueber view.innerHTML zerstoert bei jedem
  // Tastendruck Fokus und Cursor im Suchfeld - deshalb schreibt nur paintRecipeGroups()
  // danach in #r-groups, genau wie paint(q) im Planer-Picker nur nach #p-list schreibt.
  function renderRecipes() {
    // Zwei Ansichten im selben Reiter: der eigene Bestand und der Katalog. Bewusst KEIN
    // fuenfter Reiter - "entdecken" ist der Schritt vor "verwalten", nicht daneben, und ein
    // uebernommenes Rezept landet ohnehin hier (Befund des ux-reviewers, 15.08.2026).
    // Der Umschalter nutzt dieselbe gleitende Pille wie der Wochenwechsel (CLAUDE.md §11)
    // und denselben Helfer - .week-switch/.ws-btn/.ws-ind samt syncWeekSwitchPill().
    const imBuch = recipeTab === "buch";
    // Der VOLLE Katalog, nicht cookbookVisible(): die Einschraenkung entsteht jetzt ueber die
    // vorbelegten Chips (seedCookbookFilters) und ist damit sichtbar und abschaltbar.
    seedCookbookFilters();
    const buch = COOKBOOK;
    let html = `
      <div class="section-head">
        <div class="title">
          <div class="week-switch" role="tablist" aria-label="Ansicht wählen">
            <span class="ws-ind" aria-hidden="true"></span>
            <button class="ws-btn${imBuch ? "" : " active"}" data-rtab="meine" role="tab" aria-selected="${imBuch ? "false" : "true"}">Meine Meals</button>
            <button class="ws-btn${imBuch ? " active" : ""}" data-rtab="buch" role="tab" aria-selected="${imBuch ? "true" : "false"}">Rezeptbuch</button>
          </div>
        </div>
        ${imBuch ? "" : `${canEdit() ? `<button class="btn primary" data-action="new-recipe">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Neues Meal
        </button>` : ""}`}
      </div>
      ${imBuch ? cookbookHtml(buch) : `
      ${libraryRecipes().length > 0 ? `<div class="recipe-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="r-search" placeholder="Meal suchen …" autocomplete="off" value="${esc(recipeQuery)}" aria-label="Meals durchsuchen">
      </div>` : ""}
      ${recipeFilterHtml()}
      <div id="r-groups"></div>`}`;
    view.innerHTML = html;
    // Umschalter: Die Pille gleitet, der Inhalt kommt gerichtet herein (CLAUDE.md §11).
    // syncWeekSwitchPill() muss NACH dem Einhaengen laufen - vorher hat der Knopf keine
    // Geometrie und die Pille saesse auf Breite 0.
    const rswitch = view.querySelector(".week-switch");
    syncWeekSwitchPill(rswitch);
    view.querySelectorAll("[data-rtab]").forEach(b => b.addEventListener("click", () => {
      const ziel = b.dataset.rtab;
      if (ziel === recipeTab) return;
      const vor = recipeTab === "meine";      // von links nach rechts?
      recipeTab = ziel;
      render();
      slideIn(view.querySelector("#r-groups") || view.querySelector(".cookbook"), vor ? 1 : -1);
      syncWeekSwitchPill(view.querySelector(".week-switch"), vor ? 1 : -1);
    }));
    if (imBuch) {
      const cbSearch = view.querySelector("#cb-search");
      if (cbSearch) cbSearch.addEventListener("input", () => { cookbookQuery = cbSearch.value; paintCookbook(); });
      // Wie im Meals-Reiter: Die Chip-Reihe wird NICHT neu gebaut, sondern am Knopf
      // umgeschaltet - ein Neuaufbau setzte die waagerechte Scrollposition zurueck.
      view.querySelectorAll("#cb-filters button").forEach(b => b.addEventListener("click", () => {
        const key = b.dataset.f;
        if (cookbookFilters.has(key)) cookbookFilters.delete(key); else cookbookFilters.add(key);
        b.setAttribute("aria-pressed", cookbookFilters.has(key) ? "true" : "false");
        paintCookbook();
      }));
      paintCookbook();
      return;
    }
    const searchEl = view.querySelector("#r-search");
    if (searchEl) searchEl.addEventListener("input", () => { recipeQuery = searchEl.value; paintRecipeGroups(); });
    // Filter-Chips liegen ausserhalb von #r-groups und werden deshalb NICHT neu gebaut -
    // umgeschaltet wird direkt am Knopf. Ein Neuaufbau der Reihe waere hier sogar schaedlich:
    // die Reihe ist waagerecht scrollbar, ein Neuaufbau setzte die Scrollposition zurueck.
    view.querySelectorAll("#r-filters button").forEach(b => b.addEventListener("click", () => {
      const key = b.dataset.f;
      if (recipeFilters.has(key)) recipeFilters.delete(key); else recipeFilters.add(key);
      b.setAttribute("aria-pressed", recipeFilters.has(key) ? "true" : "false");
      paintRecipeGroups();
    }));
    paintRecipeGroups();
  }

  // Rezeptbuch-Ansicht. Bewusst dieselbe Kartenform wie die eigenen Meals (.rcard) statt
  // einer eigenen Optik: Es ist derselbe Gegenstand, nur noch nicht der eigene. Unterschied
  // ist allein der Knopf unten - "Übernehmen" statt der Bearbeiten-Aktionen.
  // Kein Leerzustand und kein Hinweistext mehr: `liste` ist der vollstaendige Katalog, also
  // nie leer, und was gerade filtert, sagen die Chips selbst (CLAUDE.md §7). Trifft Suche
  // oder Filter nichts, meldet das paintCookbook() an der Stelle, an der es passiert.
  function cookbookHtml(liste) {
    seedCookbookFilters();
    return `<div class="cookbook">
      <div class="recipe-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="cb-search" placeholder="Rezept suchen …" autocomplete="off" value="${esc(cookbookQuery)}" aria-label="Rezeptbuch durchsuchen">
      </div>
      ${recipeFilterHtml(liste, cookbookFilters, "cb-filters")}
      <div id="cb-groups"></div>
    </div>`;
  }

  // Gruppierung wie bei den eigenen Meals - dieselben Kategorien, dieselben Klassen,
  // dieselben Symbole. Ein zweites Ordnungssystem fuer denselben Gegenstand waere genau die
  // Sorte Abweichung, vor der CLAUDE.md bei den Makro-Formen warnt.
  //
  // EIN Unterschied, und der ist Absicht: Hier starten ALLE Kategorien eingeklappt, bei den
  // eigenen Meals nur die ab der zweiten. Bei zwoelf selbst angelegten Meals waere Klappen
  // laestig; bei hundert fremden ist die Uebersicht ueber die Kategorien der eigentliche
  // Einstieg - man sieht "Hauptgericht 45" und entscheidet, ob man hineingeht.
  function paintCookbook() {
    const container = view.querySelector("#cb-groups");
    if (!container) return;
    const q = cookbookQuery.toLowerCase().trim();
    seedCookbookFilters();
    let pool = COOKBOOK;
    if (q) pool = pool.filter(r => r.name.toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q));
    if (cookbookFilters.size) pool = pool.filter(r => recipeMatchesFilters(r, cookbookFilters));

    const groups = new Map();
    CATEGORIES.forEach(c => groups.set(c, []));
    pool.forEach(r => {
      const c = groups.has(r.category) ? r.category : "Sonstige";
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(r);
    });

    // Nur die TEXTSUCHE klappt alles auf und nimmt den Klappknopf weg: Wer tippt, sucht ein
    // bestimmtes Rezept und will es nicht in einer zugeklappten Kategorie verstecken.
    //
    // Aktive Chips tun das ausdruecklich NICHT (mehr). Ein Filter grenzt eine Menge ein, er
    // sucht kein Einzelstueck - und seit die Chips aus dem Ernaehrungsprofil vorbelegt sind,
    // ist ein dauerhaft aktiver Filter hier der REGELFALL. Beides zusammen haette die
    // Kategorien praktisch nie mehr klappbar gemacht, und das Klappen ist bei 34 Rezepten der
    // eigentliche Einstieg. Die alte Sorge (Zahl auf einer leeren Flaeche) trifft nur die
    // statische Kopfzeile ohne Caret - mit Caret ist der Klick da, wo er hingehoert.
    const filtering = !!q;
    let html = "";
    let etwas = false;
    for (const [cat, items] of groups) {
      if (!items.length) continue;
      etwas = true;
      items.sort((a, b) => a.name.localeCompare(b.name, "de"));
      const icon = CAT_ICON[cat] || "pot";
      const iconCls = "cicon" + (CAT_CLASS[cat] ? " " + CAT_CLASS[cat] : "");
      const open = filtering || !cookbookCollapsed.has(cat);
      html += `<section class="catgroup">`;
      html += filtering
        ? `<div class="cathead static">
            <span class="cname">${iconSvg(icon, iconCls)}${esc(cat)}</span>
            <span class="ccount">${items.length}</span>
          </div>`
        : `<button class="cathead" data-cbcat="${esc(cat)}" aria-expanded="${open}">
            <svg class="caret${open ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            <span class="cname">${iconSvg(icon, iconCls)}${esc(cat)}</span>
            <span class="ccount">${items.length}</span>
          </button>`;
      if (!open) { html += `</section>`; continue; }
      html += `<div class="recipes">` + items.map(r => {
        const drin = isAdopted(r.id);
        // Dasselbe Stretched-Link-Muster wie bei den eigenen Meals: Der Titel ist der Knopf,
        // sein ::after spannt die ganze Karte auf - so ist das Bild mit anklickbar, ohne dass
        // eine zweite Trefferflaeche entsteht. Der Uebernehmen-Knopf liegt per z-index
        // darueber (.cb-foot), sonst faenge der Stretched Link ihn ab.
        return `<article class="rcard">
          ${cardImageHtml(r)}
          <div class="rbody">
            <div class="top"><h3><button type="button" class="rcard-open" data-cbview="${esc(r.id)}">${esc(r.name)}</button></h3></div>
            <div class="rstats">${cardStatsHtml(r)}</div>
            <div class="cb-foot">
              ${drin
                ? `<span class="cb-drin">In deinen Meals</span>`
                : `<button class="btn primary sm" data-adopt="${esc(r.id)}">Übernehmen</button>`}
            </div>
          </div>
        </article>`;
      }).join("") + `</div></section>`;
    }
    container.innerHTML = etwas ? html : `<p style="color:var(--text-muted);margin:0">Kein Rezept gefunden.</p>`;
    container.querySelectorAll("[data-adopt]").forEach(b =>
      b.addEventListener("click", () => adoptFromCookbook(b.dataset.adopt)));
    // Ansicht mit Zutaten und Zubereitung - dieselbe wie bei den eigenen Meals, damit
    // niemand blind uebernimmt. Die Karte wird als Ursprung uebergeben (FLIP am Rechner).
    container.querySelectorAll("[data-cbview]").forEach(b => b.addEventListener("click", () =>
      openMealSheet(b.dataset.cbview, null, b.closest(".rcard"))));
    container.querySelectorAll("[data-cbcat]").forEach(b => b.addEventListener("click", () => {
      const c = b.dataset.cbcat;
      if (cookbookCollapsed.has(c)) cookbookCollapsed.delete(c); else cookbookCollapsed.add(c);
      paintCookbook();
    }));
  }

  // Filter-Chips (B7). Gezeigt wird nur, was im Bestand tatsaechlich vorkommt: eine Reihe
  // aus acht Merkmalen, von denen sieben nie zutreffen, ist keine Hilfe, sondern Ballast.
  // Bei weniger als sechs Meals gibt es gar keine Reihe - dort ist die Liste ueberschaubar
  // und das Suchfeld genuegt.
  // Zwei Bestaende, dieselbe Reihe: der eigene (Meals-Reiter) und der Katalog (Rezeptbuch).
  // Deshalb Liste, Zustand und Kennung als Parameter - der Aufbau ist identisch, und zwei
  // fast gleiche Funktionen waeren genau die Sorte Duplikat, die spaeter auseinanderlaeuft.
  function recipeFilterHtml(liste, aktive, id) {
    liste = liste || libraryRecipes();
    aktive = aktive || recipeFilters;
    id = id || "r-filters";
    // Schwelle 4, nicht 6: addStarterMeals() legt nach dem Onboarding genau
    // STARTER_ANZAHL = 5 Meals an. Bei "< 6" bekam also JEDER neue Nutzer seine Startmeals
    // ohne eine einzige Filterzeile zu sehen, bis er das sechste Meal anlegte - die Schwelle
    // stand genau eine Position neben der Zahl, die die App selbst erzeugt. Bei zwei oder
    // drei selbst angelegten Meals bleibt die Reihe weg, dort waere sie wirklich sinnlos.
    if (liste.length < 4) { aktive.clear(); return ""; }
    // Ein Merkmal wird nur zum Chip, wenn es auf MINDESTENS EINEN und NICHT AUF ALLE
    // Eintraege zutrifft. Ein Filter ist ein Werkzeug zum Wegnehmen; trifft er auf alles zu,
    // nimmt er nichts weg. Ohne diese Bedingung stuenden ueber den fuenf Startmeals eines
    // Veganers sechs Chips, davon zwei ("Vegan", "Vegetarisch") ohne jede Wirkung - das
    // Problem waere nur verlagert. Dass die eigene Sammlung komplett vegan ist, liest man
    // an den Karten ab; eine Filterzeile ist der falsche Ort dafuer.
    const chips = [];
    const trifft = (f) => {
      let n = 0;
      liste.forEach(r => { if (f(r)) n++; });
      return n > 0 && n < liste.length;
    };
    if (trifft(r => r.mealPrep)) chips.push({ k: "mealPrep", label: "Meal-Prep" });
    RECIPE_TAGS.forEach(t => {
      if (trifft(r => (r.tags || []).indexOf(t.key) !== -1)) chips.push({ k: "tag:" + t.key, label: t.label });
    });
    if (!chips.length) { aktive.clear(); return ""; }
    // Ein Filter, dessen Chip gerade weggefallen ist (letztes passendes Meal geloescht),
    // wuerde sonst unsichtbar weiterfiltern.
    const valid = new Set(chips.map(c => c.k));
    aktive.forEach(k => { if (!valid.has(k)) aktive.delete(k); });
    return `<div class="mtags rfilters" id="${id}" role="group" aria-label="Meals filtern">${
      chips.map(c => `<button type="button" data-f="${esc(c.k)}" aria-pressed="${aktive.has(c.k) ? "true" : "false"}">${esc(c.label)}</button>`).join("")
    }</div>`;
  }
  // UND-Verknuepfung: jeder gesetzte Filter muss zutreffen. Oder-Logik waere bei
  // "Vegan + Meal-Prep" das Gegenteil dessen, was jemand erwartet, der beides antippt.
  function recipeMatchesFilters(r, aktive) {
    // Auf `instanceof Set` pruefen, nicht bloss auf truthy: Wird die Funktion versehentlich
    // direkt als filter-Callback uebergeben, kommt hier der Array-INDEX an. `aktive || …`
    // fiel darauf herein und lief in einen TypeError - eine Zahl ist nicht iterierbar.
    // So kann derselbe Fehler nicht ein zweites Mal entstehen.
    const set = (aktive instanceof Set) ? aktive : recipeFilters;
    for (const k of set) {
      if (k === "mealPrep") { if (!r.mealPrep) return false; continue; }
      if (k.slice(0, 4) === "tag:" && (r.tags || []).indexOf(k.slice(4)) === -1) return false;
    }
    return true;
  }

  // Schreibt ausschliesslich nach #r-groups - Kopfzeile und Suchfeld bleiben unberuehrt,
  // damit ein Tastendruck im Suchfeld weder Fokus noch Cursorposition verliert.
  function paintRecipeGroups() {
    const container = view.querySelector("#r-groups");
    if (!container) return;

    const library = libraryRecipes();
    if (library.length === 0) {
      container.innerHTML = `<div class="empty">
        <svg class="em-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7l-4-3H5a1 1 0 0 0-1 1Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <h3>${canEdit() ? "Noch keine Meals" : "Hier ist noch nichts"}</h3>
        <p>${canEdit() ? "Lege dein erstes Meal an – danach kannst du es im Wochenplan auf die Tage verteilen." : "Sobald jemand aus eurer Gruppe ein Meal anlegt, siehst du es hier."}</p>
        ${canEdit() ? `<button class="btn primary" data-action="new-recipe">Erstes Meal anlegen</button>` : ""}
      </div>`;
      return;
    }

    const q = recipeQuery.toLowerCase().trim();
    // Barcode-Schnellzugriff-Meals (quick: true) sind eine bewusste Ausnahme: sie stehen
    // weder hier noch im Picker (beide ueber libraryRecipes), bleiben aber ueber Plan,
    // Einkaufsliste und Druck normal erreichbar. Verwaiste raeumt pruneQuickRecipes()
    // spaeter weg - siehe quickAddByBarcode.
    let pool = library;
    if (q) pool = pool.filter(r => r.name.toLowerCase().includes(q) || (r.category || "").toLowerCase().includes(q));
    // NICHT `pool.filter(recipeMatchesFilters)`: Array.filter uebergibt als zweites Argument
    // den INDEX, und der landete im Parameter `aktive`. Bei Index 0 (falsy) griff der
    // Rueckfall zufaellig noch, ab Index 1 warf `for (const k of 1)` - paintRecipeGroups()
    // brach mitten drin ab und liess die ungefilterte Liste stehen. Der Filter sah damit aus
    // wie "zeigt immer alles" (siehe docs/TROUBLESHOOTING.md 92).
    if (recipeFilters.size) pool = pool.filter(r => recipeMatchesFilters(r, recipeFilters));

    // Favoriten stehen oben UND bleiben in ihrer Kategorie: wer ein Meal dort sucht, soll es
    // dort auch finden - sonst werden die Kategorien loechrig, sobald jemand viel favorisiert.
    // Der doppelte Eintrag erklaert sich durch das rote Herz. Dass zwei Karten dieselbe
    // data-rid tragen, ist unkritisch - Foto-Drop und Strg+V treffen ohnehin dasselbe Meal.
    const groups = new Map();
    const favItems = pool.filter(r => isFav(r.id));
    if (favItems.length) groups.set(FAV_KEY, favItems); // immer als erster Map-Eintrag
    CATEGORIES.forEach(c => groups.set(c, []));
    pool.forEach(r => {
      const c = groups.has(r.category) && r.category !== FAV_KEY ? r.category : "Sonstige";
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(r);
    });

    // Erste Kategorie mit Inhalt bleibt offen, alle anderen starten eingeklappt - bei vielen
    // Meals in mehreren Kategorien war "alles auf einmal offen" beim ersten Blick eine sehr
    // lange Liste. Laeuft nur bei leerer Suche, sonst schriebe die erste Suche die
    // Klapp-Vorbelegung auf dem gefilterten Bestand fest. Favoriten zaehlen hier nicht mit,
    // sonst waere die Favoriten-Gruppe die "erste Kategorie mit Inhalt" und alle echten
    // Kategorien starteten eingeklappt.
    // Nur die Textsuche klappt auf und nimmt den Klappknopf weg - aktive Chips lassen die
    // Klappmechanik unangetastet. Dieselbe Regel wie im Rezeptbuch (siehe paintCookbook),
    // ein zweites Verhalten an der zweiten Liste waere genau die Abweichung, vor der
    // CLAUDE.md §8 warnt.
    const filtering = !!q;
    // Die Klapp-Vorbelegung haengt weiter an BEIDEM: Auf einem gefilterten Bestand
    // festgeschrieben, waere "erste Kategorie mit Inhalt" die erste Kategorie des Filters.
    if (!q && !recipeFilters.size && !collapsedCatsSeeded) {
      collapsedCatsSeeded = true;
      let firstSeen = false;
      for (const [cat, items] of groups) {
        if (cat === FAV_KEY || items.length === 0) continue;
        if (firstSeen) collapsedCats.add(cat); else firstSeen = true;
      }
    }

    let html = "";
    let anyRendered = false;
    for (const [cat, items] of groups) {
      if (items.length === 0) continue;
      anyRendered = true;
      items.sort((a, b) => a.name.localeCompare(b.name, "de"));
      const isFavGroup = cat === FAV_KEY;
      const label = isFavGroup ? "Favoriten" : cat;
      const icon = isFavGroup ? "heart" : (CAT_ICON[cat] || "pot");
      // Dieselbe Farbklasse wie die Kategorie-Chips (CAT_CLASS kennt nur Fruehstueck und
      // Hauptgericht). Damit tragen die Symbole hier dieselben Farben wie im Wochenplan -
