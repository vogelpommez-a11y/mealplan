      <button data-mi="weigh" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>Gewicht eintragen</button>
      <button data-mi="goal" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>${hatZiel ? "Ziel ändern" : "Jahresziel setzen"}</button>

  // Einwilligung erteilen (Art. 9 Abs. 2 lit. a DSGVO): eigener kurzer Dialog statt einer
  // Checkbox mitten im Wiegen-Formular, weil die Zustimmung eine bewusste, einzelne
  // Entscheidung sein soll - kein Haekchen, das man beim Ausfuellen mitwegklickt.
  function weightConsentModal() {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Gewichtsverlauf aktivieren">
      <div class="modal-head"><h3>Gewichtsverlauf aktivieren</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <p style="margin:0">Dein Gewicht ist ein Gesundheitsdatum. Mit „Zustimmen" speichern wir deine Wiegungen als Verlauf – jederzeit widerrufbar über das Menü der Karte.</p>
      </div>
      <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="wc-in-ok">Zustimmen</button></div>
    </div>`);

    node.querySelector("#wc-in-ok").addEventListener("click", () => {
      setWeightConsent(true);
      // Liegt aus der Ziel-Berechnung schon ein Gewicht vor, gleich als ersten Punkt
      // uebernehmen - sonst startete das Diagramm trotz vorhandenem Wert leer.
      noteWeightFromGoal();
      save(); closeModal(); render();
      toast("Gewichtsverlauf aktiviert");
    });
    openModal(node);
  }

  // Widerruf: bestaetigen statt sofort ausfuehren - loescht keine bestehenden Daten (die
  // stehen weiter im Diagramm/koennen einzeln geloescht werden), stoppt nur kuenftige
  // automatische Eintraege aus dem Rechner und blendet die Karte wieder auf den Einstieg zurueck.
  function weightConsentRevokeModal() {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Einwilligung widerrufen">
      <div class="modal-head"><h3>Einwilligung widerrufen</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <p style="margin:0">Dein bisheriger Verlauf bleibt gespeichert, es kommen nur keine neuen Einträge mehr automatisch dazu.</p>
      </div>
      <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="wc-out-ok">Widerrufen</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("#wc-out-ok").addEventListener("click", () => {
      setWeightConsent(false); save(); closeModal(); render();
      toast("Einwilligung widerrufen");
    });
    openModal(node);
  }

  // ---------- Kalorienrechner (Baustein 1: Tages-/Wochenbedarf → state.goal) ----------
  // ACTIVITY, TRAIN_LEVELS und ihre Helfer stehen bewusst weit oben bei DAYS/MEALS und
  // nicht hier: sanitizeGoal() braucht sie, und das laeuft schon in `let state = load()`.
  // Von hier aus waeren sie dort noch in der temporalen Todeszone — die App wuerde beim
  // Start mit einem ReferenceError sterben, ohne dass ein catch greift.
  // Anpassung des Erhaltungsbedarfs je nach Ziel/Tempo (kcal/Tag).
  function paceAdjust(mode, pace) {
    if (mode === "lose") return ({ light: -250, moderate: -500, strong: -750 })[pace] || -500;
    if (mode === "gain") return ({ light: 250, moderate: 500 })[pace] || 500;
    return 0;
  }
  // Koerperfettanteil in Prozent, oder null wenn nicht angegeben. Eine Quelle fuer alle
  // Stellen, die den Wert aus einem Ziel oder einer Eingabe holen — er ist freiwillig,
  // also muss jede davon mit "nicht da" umgehen koennen.
  function sanitizeBodyfat(v) {
    const n = +v;
    if (v == null || v === "" || !isFinite(n)) return null;
    return (n >= BF_MIN && n <= BF_MAX) ? Math.round(n * 10) / 10 : null;
  }
  // BMR × PAL = Alltagsbedarf → Ziel-Anpassung = RUHETAG-Ziel.
  // Der Alltagsbedarf gilt an jedem Tag; an Trainingstagen kommt der Trainingsverbrauch
  // obendrauf (siehe dayKcal). Am Ruhetag ist er der ganze Bedarf.
  // Zwei Formeln fuer den Grundumsatz, je nachdem was bekannt ist:
  //  - mit Koerperfettanteil: Katch-McArdle ueber die fettfreie Masse. Mifflin kennt nur
  //    Gewicht und Groesse und haelt 85 kg Muskeln fuer dasselbe wie 85 kg Fett — bei
  //    Kraftsportlern liegt es deshalb systematisch zu niedrig.
  //  - ohne: Mifflin-St-Jeor wie bisher. Der KFA ist freiwillig, also muss dieser Weg
  //    unveraendert bestehen bleiben; missingCalc fordert Alter/Groesse weiterhin.
  // Makros: Protein 2 g/kg (ab BMI 27 auf das Gewicht bei BMI 27 gedeckelt),
  // Fett 25 % der Kalorien (weicht zurueck, wenn sonst die Summe nicht aufgeht), Rest KH.
  function computeGoal(inp) {
    const w = +inp.weight, h = +inp.height, age = +inp.age;
    const bf = sanitizeBodyfat(inp.bodyfat);
    const bmr = bf != null
      ? 370 + 21.6 * (w * (1 - bf / 100))
      : 10 * w + 6.25 * h - 5 * age + (inp.sex === "m" ? 5 : -161);
    const tdee = bmr * activityFactor(inp.activity);
    const adjust = paceAdjust(inp.mode, inp.pace);
    // Untergrenze geschlechtsabhaengig: die gaengigen Empfehlungen liegen bei 1200 kcal
    // (weiblich) bzw. 1500 kcal (maennlich). Ein pauschales Minimum von 1000 lag
    // darunter und haette bei kleinen Personen mit starkem Defizit gegriffen.
    // Sie greift auf dem Ruhetag, also dem niedrigsten Tag der Woche.
    const floor = inp.sex === "m" ? 1500 : 1200;
    const kcal = Math.max(floor, Math.round(tdee + adjust));
    const bmi = Math.round(w / ((h / 100) * (h / 100)) * 10) / 10;
    // Protein NICHT am tatsaechlichen Gewicht bemessen: bei starkem Uebergewicht
    // ergaeben 2 g/kg absurde Mengen (150 kg -> 300 g). Fett speichert kein Eiweiss,
    // deshalb wird ab einem BMI von 27 auf das Gewicht bei BMI 27 gedeckelt.
    // Bewusst 27 und nicht 25: Muskuloese Sportler liegen oft bei BMI 25-27, ohne
    // Fett anzusetzen - die sollen ihre vollen 2 g/kg behalten.
    const refW = bmi > 27 ? 27 * (h / 100) * (h / 100) : w;
    const protein = Math.round(2.0 * refW);
    let fat = Math.round(kcal * 0.25 / 9);
    let carbs = Math.round((kcal - protein * 4 - fat * 9) / 4);
    if (carbs < 0) {
      // Protein + Fett allein sprengen schon das Kalorienziel. Fett zurueckfahren
      // (Protein schuetzt im Defizit die Muskulatur), aber nicht unter das
      // essentielle Minimum von rund 0,5 g/kg.
      const minFat = Math.round(0.5 * refW);
      fat = Math.max(minFat, Math.round((kcal - protein * 4) / 9));
      carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    }
    return { sex: inp.sex, age: age, height: h, weight: w, activity: inp.activity, mode: inp.mode, pace: inp.pace,
             // null = kein KFA angegeben. Muss mit ins Ziel, sonst faellt die Angabe beim
             // naechsten Wiegen (syncGoalWeight rechnet aus state.goal neu) still heraus
             // und der Grundumsatz spraenge zurueck auf Mifflin.
             bodyfat: bf,
             bmr: Math.round(bmr), tdee: Math.round(tdee), adjust: adjust, kcal: kcal,
             protein: protein, carbs: carbs, fat: fat, bmi: bmi,
             // Trainingsplan je Wochentag: { mon: { level, min } }. Leer = keine
             // Trainingstage, dann gilt das Ruhetag-Ziel an allen sieben Tagen.
             training: sanitizeTraining(inp.training),
             updatedAt: Date.now() };
  }
  // Welche Tempo-Stufen es zu einem Ziel gibt, samt Beschriftung – die EINE Quelle dafuer.
  // Frueher standen die Schluessel in paceKeys() und die Knoepfe noch einmal in fillPace();
  // mit den ersten Schritten waere das die dritte Stelle geworden. Wer hier etwas aendert,
  // muss paceAdjust() mitziehen – dort haengen die kcal an denselben Schluesseln.
  function paceOptions(mode) {
    if (mode === "lose") return [["light", "Leicht", "0,25 kg/Wo."], ["moderate", "Moderat", "0,5 kg/Wo."], ["strong", "Stark", "0,75 kg/Wo."]];
    if (mode === "gain") return [["light", "Leicht", "0,25 kg/Wo."], ["moderate", "Moderat", "0,5 kg/Wo."]];
    return [];
  }
  function paceKeys(mode) { return paceOptions(mode).map(o => o[0]); }

  // ---------- Wiegen: speichern, loeschen, ans Ziel koppeln ----------
  // Ein Monat, ein Wert - erneutes Wiegen im selben Monat ersetzt den Eintrag.
  function setWeight(m, kg) {
    const list = (state.weights || []).filter(e => e.m !== m);
    list.push({ m: m, kg: Math.round(kg * 10) / 10 });
    list.sort((a, b) => a.m < b.m ? -1 : 1);
    state.weights = list;
    syncGoalWeight();
  }
  function removeWeight(m) {
    state.weights = (state.weights || []).filter(e => e.m !== m);
    syncGoalWeight();
  }
  function latestWeight() { const w = state.weights || []; return w.length ? w[w.length - 1] : null; }

  // Das Kalorienziel haengt am Gewicht (BMR, Protein), also zieht die JUENGSTE Messung es
  // nach. Bewusst nur die juengste: traegt man im Juli den Januar nach, darf das aktuelle
  // Ziel nicht auf den alten Wert zurueckspringen - sonst macht Nachtragen die Tagesziele
  // kaputt. Ohne gespeichertes Ziel gibt es nichts nachzuziehen (der Verlauf laeuft
  // trotzdem weiter, er haengt nicht am Rechner).
  function syncGoalWeight() {
    const last = latestWeight();
    if (!state.goal || !last || state.goal.weight === last.kg) return;
    state.goal = computeGoal(Object.assign({}, state.goal, { weight: last.kg }));
  }
  // Die Gegenrichtung zu syncGoalWeight: Das Gewicht wird auch im Rechner und in den
  // ersten Schritten abgefragt: Wer dort etwas eintraegt, hat sich gewogen - das gehoert
  // in den Verlauf, sonst zeigt die Kurve weiter den alten Wert.
  //  - noch nichts gemessen -> Startpunkt zum Monat des Ziels (der Verlauf braucht einen Anfang)
  //  - schon Messungen da, Rechner-Gewicht weicht ab -> als Messung dieses Monats
  // Beide Richtungen pruefen auf Gleichheit und laufen sich deshalb nicht gegenseitig hoch.
  // (Ziffer 3b der Datenschutzerklaerung nennt diesen zweiten Weg ausdruecklich.)
  function noteWeightFromGoal() {
    if (!state.goal || !hasWeightConsent()) return;
    const kg = Math.round(+state.goal.weight * 10) / 10;
    if (!(kg >= KG_MIN && kg <= KG_MAX)) return;
    const last = latestWeight();
    if (!last) {
      // Durch sanitizeWeights schicken statt direkt zuzuweisen: updatedAt kommt aus
      // gespeicherten Daten und koennte beschaedigt sein - ein "NaN-NaN" als Monat
      // wuerde sonst bis ins Diagramm durchlaufen.
      state.weights = sanitizeWeights([{ m: monthKey(new Date(state.goal.updatedAt || Date.now())), kg: kg }]);
    } else if (last.kg !== kg) {
      setWeight(monthKey(), kg);
    }
  }

  // Was fehlt noch, in Worten? Eine Quelle fuer beides: den Hinweis im Assistenten
  // und den Text der leeren Ergebniskarte. Reihenfolge wie im Formular, damit der
  // erste Eintrag auch das erste fehlende Feld ist.
  // Nichts ist mehr vorbelegt – Geschlecht, Alltagsbewegung, Ziel und Tempo muessen
  // bewusst gewaehlt werden. Eine Voreinstellung wird sonst leicht ueberlesen und
  // geht als bewusste Angabe in die Rechnung ein, was sie nicht ist.
  function missingCalc(i) {
    const m = [];
    if (i.sex !== "m" && i.sex !== "f") m.push("dein Geschlecht");
    if (!(i.age >= 10 && i.age <= 120)) m.push("dein Alter");
    if (!(i.height >= 100 && i.height <= 250)) m.push("deine Größe");
    if (!(i.weight >= 30 && i.weight <= 400)) m.push("dein Gewicht");
    if (!ACTIVITY.some(a => a.key === i.activity)) m.push("deine Bewegung im Alltag");
    if (["lose", "hold", "gain"].indexOf(i.mode) === -1) m.push("dein Ziel");
    else if (i.mode !== "hold" && paceKeys(i.mode).indexOf(i.pace) === -1) m.push("dein Tempo");
    return m;
  }
  // ---------- Erste Schritte (Onboarding) ----------
  // Eine Frage je Bildschirm statt eines Formulars: die Koerperdaten sind heikel genug,
  // dass jede Frage ihre eigene Begruendung verdient ("wozu willst du mein Gewicht?").
  // Dies ist der EINZIGE Weg, ein Ziel zu setzen oder neu zu berechnen (der fruehere
  // Kalorienrechner-Reiter ist entfallen). Ohne Ziel ist die App nicht benutzbar, daher
  // ist der Ablauf ohne vorhandenes Ziel nicht ueberspringbar (siehe maybeStartOnboarding).
  // Genutzt wird computeGoal/ACTIVITY/paceOptions samt missingCalc fuer die Pflichtfelder.

  // Kurzfassung eines Ziels – gebraucht auf der Ergebnisseite, am Ende und auf der
  // Startseite fuer "Mein Ziel behalten".
  function goalSummaryHtml(g) {
    if (!g) return "";
    return `<b>${g.kcal.toLocaleString("de-DE")} kcal</b> am Tag · ${g.protein} g Eiweiß · ${g.fat} g Fett · ${g.carbs} g Kohlenhydrate`;
  }

  // Reihenfolge der Bildschirme. Verwandte Fragen stehen zusammen auf EINEM Bildschirm:
  // Koerperdaten, Training (Tage + Haerte + Dauer), Ziel + Tempo, Zielgewicht +
  // Einwilligung. Frueher war jede Frage ein eigener Schritt — das ergab 16 Bildschirme,
  // bevor die App ueberhaupt zu sehen war.
  //
  // Heraus fallen koennen nur noch "name" (steht meist schon fest) sowie "hi"/"go" beim
  // Neuberechnen. Alle drei entscheiden sich VOR dem ersten Rendern und aendern sich
  // waehrend eines Laufs nicht mehr. Damit ist die Gesamtzahl konstant und der
  // Fortschrittsbalken kann nicht mehr zurueckspringen — frueher warf "Gewicht halten"
  // das Tempo und "kein Trainingstag" zwei weitere Schritte mitten im Ablauf heraus,
  // und aus "Schritt 9 von 16" wurde unvermittelt "von 14".
  const ONB_ORDER = ["hi", "name", "body", "bodyfat", "activity", "training", "goal",
                     "target", "result", "go"];
  // Zahlenfelder. `lab` ist die Feldbeschriftung auf den Sammel-Bildschirmen (dort traegt
  // nicht mehr die Ueberschrift die Bedeutung, also braucht jedes Feld ein eigenes
  // <label>), `miss` der Klartext fuer den Hinweis, wenn es leer bleibt.
  const ONB_NUM = {
    age:    { unit: "Jahre", min: 10,      max: 120,          lab: "Alter",   miss: "dein Alter" },
    height: { unit: "cm",    min: 100,     max: 250,          lab: "Größe",   miss: "deine Größe" },
    weight: { unit: "kg",    min: KG_MIN,  max: KG_MAX,       lab: "Gewicht", miss: "dein Gewicht" },
    tmin:   { unit: "Min.",  min: TRAIN_MIN_MIN, max: TRAIN_MIN_MAX, lab: "Dauer", miss: "die Dauer einer Einheit" }
  };
  const ONB_TEXT = {
    name: { q: "Wie heißt du?", max: 40, placeholder: "Dein Vorname" }
  };

  // Koerperfett-Stufen je Geschlecht. Vier Stufen statt eines Prozent-Felds: Eine Skizze
  // trifft fast jeder auf Anhieb, den genauen Wert kennen die wenigsten.
  //  - `v`   Mittelwert der Stufe, geht so in Katch-McArdle ein.
  //  - `r`   die Spanne, sichtbar auf der Kachel. Wer seinen KFA schon einmal hat rechnen
  //          lassen, sucht danach und muss nicht ueber die Zeichnung gehen. Bewusst eine
  //          Spanne und keine einzelne Zahl: die Stufe IST ein Bereich, ein exakter Wert
  //          waere eine Genauigkeit, die vier Kacheln nicht hergeben.
  // Die Spannen schliessen luckenlos aneinander an und liegen um `v` herum, damit Bild,
  // Zahl und Rechnung dasselbe sagen. Frauen tragen bei gleicher Optik rund 8 Punkte mehr.
  const BODYFAT = {
    m: [{ v: 12, r: "10–14 %", label: "Definiert", hint: "Bauchmuskeln sichtbar" },
        { v: 18, r: "15–20 %", label: "Athletisch", hint: "flacher Bauch" },
        { v: 25, r: "21–28 %", label: "Normal", hint: "kein sichtbarer Ansatz" },
        { v: 32, r: "ab 29 %", label: "Kräftig", hint: "deutlicher Bauchansatz" }],
    f: [{ v: 20, r: "17–22 %", label: "Definiert", hint: "Bauchmuskeln sichtbar" },
        { v: 26, r: "23–29 %", label: "Athletisch", hint: "flacher Bauch" },
        { v: 33, r: "30–36 %", label: "Normal", hint: "kein sichtbarer Ansatz" },
        { v: 40, r: "ab 37 %", label: "Kräftig", hint: "deutlicher Bauchansatz" }]
  };
  // Die Silhouetten, je Geschlecht ein eigener Satz — dieselben Prozentwerte sehen an
  // einem weiblichen und einem maennlichen Koerper deutlich verschieden aus, eine
  // gemeinsame Zeichnung waere fuer die Haelfte der Nutzer die falsche Vorlage.
  // Selbst gezeichnet: fremde Vorlagen kaemen mit einer Lizenzfrage, die dieses Projekt
  // bei Bildern konsequent vermeidet (siehe PHOTO_CREDITS).
  //
  // Innerhalb eines Satzes bleibt die Schulterbreite gleich, damit allein Taille und
  // Bauchzeichnung den Unterschied tragen. Zwischen den Saetzen unterscheiden sie sich:
  // maennlich x 7..37 mit V-Form nach unten, weiblich x 10..34 mit breiterer Huefte.
  // Wenige Linien, damit die Zeichnung auf einer kleinen Kachel lesbar bleibt.
  // `currentColor` erbt die Farbe der Kachel, womit hell/dunkel und der ausgewaehlte
  // Zustand ohne eigene Regeln stimmen.
  const BF_SHAPES = {
    m: [
      { d: "M15 6h14c5 1 8 4 8 9c0 6-7 8-7 19c0 8 1 14 2 21H12c1-7 2-13 2-21c0-11-7-13-7-19c0-5 3-8 8-9Z",
        det: '<path d="M22 18v22M16 24h12M16 31h12M17 38h10"/>' },
      { d: "M15 6h14c5 1 8 4 8 9c0 6-5 8-5 19c0 8 0 14 1 21H11c1-7 1-13 1-21c0-11-5-13-5-19c0-5 3-8 8-9Z",
        det: '<path d="M22 20v18M16 27h12"/>' },
      { d: "M15 6h14c5 1 8 4 8 9c0 6-2 8-2 19c0 8 0 14-1 21H10c-1-7-1-13-1-21c0-11-2-13-2-19c0-5 3-8 8-9Z",
        det: '<path d="M22 33v4"/>' },
      { d: "M15 6h14c5 1 8 4 8 9c0 6 2 8 2 19c0 8-2 14-4 21H9c-2-7-4-13-4-21c0-11 2-13 2-19c0-5 3-8 8-9Z",
        det: '<path d="M14 34c3 6 13 6 16 0"/>' }
    ],
    f: [
      { d: "M17 6h10c4 1 7 4 7 8c0 6-6 8-6 20c0 8 5 14 5 21H11c0-7 5-13 5-21c0-12-6-14-6-20c0-4 3-7 7-8Z",
        det: '<path d="M15 20c2 3 5 3 7 0M29 20c-2 3-5 3-7 0"/><path d="M22 26v12M17 31h10"/>' },
      { d: "M17 6h10c4 1 7 4 7 8c0 6-5 8-5 20c0 8 5 14 5 21H10c0-7 5-13 5-21c0-12-5-14-5-20c0-4 3-7 7-8Z",
        det: '<path d="M15 20c2 3 5 3 7 0M29 20c-2 3-5 3-7 0"/><path d="M22 28v9"/>' },
      { d: "M17 6h10c4 1 7 4 7 8c0 6-3 8-3 20c0 8 4 14 4 21H9c0-7 4-13 4-21c0-12-3-14-3-20c0-4 3-7 7-8Z",
        det: '<path d="M15 20c2 3 5 3 7 0M29 20c-2 3-5 3-7 0"/><path d="M22 34v4"/>' },
      { d: "M17 6h10c4 1 7 4 7 8c0 6 0 8 0 20c0 8 3 14 3 21H7c0-7 3-13 3-21c0-12 0-14 0-20c0-4 3-7 7-8Z",
        det: '<path d="M15 20c2 3 5 3 7 0M29 20c-2 3-5 3-7 0"/><path d="M13 35c4 6 14 6 18 0"/>' }
    ]
  };
  function bfSvg(sex, i) {
    const s = (BF_SHAPES[sex] || BF_SHAPES.m)[i];
    return `<svg class="onb-bf-fig" viewBox="0 0 44 60" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${s.d}"/>${s.det}</svg>`;
  }

  let onb = null;          // null = laeuft gerade nicht
  let onbGateDone = false; // die Startentscheidung faellt genau einmal je Sitzung
  let lastOnbStep = null;  // fuer die Fortschritts-Animation, siehe animateOnbProgress()

  // Nach dem Namen fragen wir nur, wenn wirklich keiner da ist. Bei der Registrierung
  // per E-Mail wird er abgefragt (registerEmail schreibt ihn als displayName), und Google
  // liefert den Klarnamen — in beiden Faellen waere die Frage eine Wiederholung.
  // Uebrig bleibt der eine Fall, in dem handleCloudUser mangels displayName den Teil vor
  // dem @ einsetzt: "fleischmann-patrick" will niemand als Anrede lesen. Das ist exakt
  // pruefbar, nicht geraten.
  function onbNameFehlt() {
    const n = String((profile && profile.name) || "").trim();
    if (!n) return true;
    const vorm = String((profile && profile.email) || "").split("@")[0];
    return !!vorm && n === vorm;
  }
  function onbSteps() {
    return ONB_ORDER.filter(id => {
      if (id === "name") return onbNameFehlt();
      // Begruessung und Schlussbild nur beim Erstkontakt: Wer sein Ziel neu berechnet,
      // kennt die App und will zu seinen Zahlen, nicht durch eine Vorstellung.
      if (id === "hi" || id === "go") return onb.first;
      return true;
    });
  }

  // Startentscheidung. Idempotent, weil sie aus mehreren Richtungen kommt: lokal aus
  // enterApp(), im Cloud-Modus aus startCloudSync() (dort erst, wenn der Stand aus der
  // Cloud da ist – sonst blitzten die ersten Schritte bei jedem Login kurz auf).
  function maybeStartOnboarding() {
    if (onbGateDone) return;
    onbGateDone = true;
    // Die App ist ohne Ziel nicht benutzbar: allein das Vorhandensein von state.goal
    // entscheidet, nicht mehr das onboarded-Flag. Wer kein Ziel hat (neu ODER nach einem
    // "neu berechnen", das das Ziel ersetzt), landet zwingend in den ersten Schritten.
    if (state.goal) return;
    // Ein geteilter Plan wartet schon als Modal – zwei Dinge gleichzeitig waeren zu viel.
    // Die ersten Schritte kommen dann beim naechsten Start, das Flag bleibt ungesetzt.
    if (shareOnStart) return;
    startOnboarding({ first: true });
  }

  function startOnboarding(opts) {
    const g = state.goal || {};
    // Trainingstage aus einem gespeicherten Ziel: die Stufe und die Dauer des ersten
    // Tages gelten hier fuer alle. Der Rechner erlaubt je Tag eigene Werte – wer die
    // gesetzt hat und die ersten Schritte erneut durchlaeuft, gleicht sie damit an.
    // Bewusst so: sieben Bildschirme fuer sieben Dauern waeren der falsche Einstieg.
    const tk = trainingKeys(g.training);
    lastOnbStep = null; // neuer Lauf, alte Animationsposition verwirft sich
    onb = {
      first: !(opts && opts.first === false),
      i: 0,
      // Vorbelegt aus einem vorhandenen Ziel (Bestandskonten sehen die ersten Schritte
      // einmalig), sonst leer. Nichts vorgeben, was als bewusste Angabe durchginge.
      cur: {
        name: (profile && profile.name) || "",
        sex: g.sex || null,
        age: g.age != null ? String(g.age) : "",
        height: g.height != null ? String(g.height) : "",
        weight: g.weight != null ? String(g.weight) : "",
        weightGoal: (state.weightGoals && state.weightGoals[activeYear()] != null)
          ? String(state.weightGoals[activeYear()]) : "",
        // null = noch nie entschieden (Frage erscheint), sonst "yes"/"no" - vorbelegt aus
        // einer schon getroffenen Entscheidung, damit ein erneuter Durchlauf sie nicht
        // stillschweigend zuruecksetzt.
        weightConsent: sanitizeConsent(state.weightConsent).at
          ? (sanitizeConsent(state.weightConsent).given ? "yes" : "no") : null,
        // Als Zeichenkette gehalten wie die anderen Felder, damit der Vergleich in
        // onbOpt() ohne Sonderfall auskommt. Drei Zustaende: null = noch nicht gefragt,
        // "" = ausdruecklich "weiss ich nicht" (dann rechnet Mifflin), sonst der Prozentwert.
        bodyfat: g.bodyfat != null ? String(g.bodyfat) : null,
        activity: ACTIVITY.some(a => a.key === g.activity) ? g.activity : null,
        mode: g.mode || null,
        pace: g.pace || null,
        tdays: tk,
        tlevel: tk.length ? g.training[tk[0]].level : null,
        tmin: tk.length ? String(g.training[tk[0]].min) : ""
      }
    };
    // Beim Neu-Berechnen faengt der Ablauf bei den Koerperdaten an, nicht bei der
    // Begruessung: Geschlecht und Groesse aendern sich praktisch nie, das GEWICHT schon —
    // und genau das steht auf diesem Bildschirm mit drauf, vorbelegt. Korrigieren,
    // "Weiter", fertig. Ein eigener Sprung ist dafuer nicht noetig, weil onbSteps()
    // "hi" bei first === false bereits herausfiltert; damit ist "body" von sich aus der
    // erste Schritt (oder "name", falls ausnahmsweise noch keiner feststeht).
    // Frueher sprang der Ablauf hier direkt aufs Ergebnis — wer sein Gewicht anpassen
    // wollte, musste sich rueckwaerts durchklicken.
    appEl.classList.add("onboarding");
    renderOnboardStep();
    syncStickyOffsets(); // erst jetzt: die Reiterleiste ist weg, --tabbar-h muss auf 0
  }

  // Beendet den Ablauf. Das Flag wird IMMER gesetzt, auch beim Ueberspringen – sonst
  // stuende der Ablauf beim naechsten Start wieder da, obwohl er abgelehnt wurde.
  function finishOnboarding(msg) {
    onb = null;
    state.onboarded = true;
    appEl.classList.remove("onboarding");
    state.tab = "home";
    save();
    render();
    syncStickyOffsets();
    if (msg) toast(msg);
  }

  // Was fehlt auf dem aktuellen Bildschirm? Leerer String = alles gut. Der Text landet
  // im Toast, wenn jemand auf den gesperrten Weiter-Knopf tippt – ein toter Knopf
  // erklaert nichts (gleiche Ueberlegung wie bei .is-off im Rechner).
  function onbMissing(id) {
    const c = onb.cur;
    if (id === "name" && !String(c.name || "").trim()) return "Wie sollen wir dich nennen?";
    if (id === "body") {
      if (c.sex !== "m" && c.sex !== "f") return "Wähle noch dein Geschlecht";
      // Reihenfolge wie im Bildschirm, damit der Hinweis das oberste leere Feld benennt.
      const f = ["age", "height", "weight"].map(onbNumMissing).filter(Boolean);
      if (f.length) return f[0];
    }
    // "bodyfat" hat bewusst keine Pflicht: "Weiß ich nicht" ist eine gueltige Antwort,
    // und ohne Wert rechnet computeGoal wie bisher nach Mifflin.
    if (id === "activity" && !c.activity) return "Wähle noch deine Bewegung im Alltag";
    // Keine Trainingstage ist eine gueltige Antwort — erst wer welche waehlt, muss auch
    // Haerte und Dauer angeben.
    if (id === "training" && c.tdays.length) {
      if (!c.tlevel) return "Wähle noch, wie hart du trainierst";
      const m = onbNumMissing("tmin"); if (m) return m;
    }
    if (id === "goal") {
      if (!c.mode) return "Wähle noch dein Ziel";
      if (c.mode !== "hold" && !c.pace) return "Wähle noch dein Tempo";
    }
    if (id === "target") {
      if (c.weightConsent !== "yes" && c.weightConsent !== "no") return "Sag noch, ob wir dein Gewicht speichern dürfen";
      // Das Zielgewicht steht nur bei erteilter Einwilligung ueberhaupt da.
      if (c.weightConsent === "yes") {
        const v = c.weightGoal;
        if (v === "" || v == null) return "";  // optional, leer ist gueltig
        const n = Number(v);
        if (!isFinite(n) || n < KG_MIN || n > KG_MAX) return `Bitte ein Zielgewicht zwischen ${KG_MIN} und ${KG_MAX} kg oder leer lassen`;
      }
    }
    if (id === "result") { const f = missingCalc(onbGoalInput()); if (f.length) return "Es fehlt noch " + f.join(" und "); }
    return "";
  }
  // Ein einzelnes Zahlenfeld pruefen. Eigene Funktion, weil auf den Sammel-Bildschirmen
  // mehrere davon nebeneinanderstehen und der Hinweis sagen muss, welches gemeint ist.
  function onbNumMissing(k) {
    // Nicht jedes Zahlenfeld ist ein Pflichtfeld aus ONB_NUM: das Zielgewicht auf
    // "target" ist freiwillig und wird in onbMissing("target") eigens geprueft.
    const num = ONB_NUM[k]; if (!num) return "";
    const raw = onb.cur[k], v = Number(raw);
    if (!raw || !isFinite(v)) return "Trag noch " + num.miss + " ein";
    if (v < num.min || v > num.max) return `${num.lab}: bitte ein Wert zwischen ${num.min} und ${num.max} ${num.unit}`;
    return "";
  }

  function onbGoalInput() {
    const c = onb.cur;
    // Eine Stufe und eine Dauer fuer alle gewaehlten Tage – das Datenmodell bleibt aber
    // das des Rechners (je Tag { level, min }), damit gespeicherte Ziele und computeGoal()
    // unberuehrt bleiben und man im Rechner hinterher je Tag nachjustieren kann.
    const training = {};
    const lvl = c.tlevel || "mod";
    const min = +c.tmin || trainLevel(lvl).defMin;
    c.tdays.forEach(k => { training[k] = { level: lvl, min: min }; });
    return { sex: c.sex, mode: c.mode, pace: c.pace, activity: c.activity, training: training,
             age: +c.age, height: +c.height, weight: +c.weight,
             // "" ist die ausdrueckliche Antwort "weiss ich nicht", null die noch nicht
             // gestellte Frage — beide fuehren zu Mifflin statt Katch-McArdle.
             bodyfat: (c.bodyfat === "" || c.bodyfat == null) ? null : +c.bodyfat };
  }

  // Nach welcher Kachelauswahl darf der Ablauf von selbst weiterspringen? Frueher hing
  // das daran, dass die Auswahlgruppe zufaellig genauso hiess wie der Schritt – auf den
  // Sammel-Bildschirmen stimmt das nicht mehr (Gruppe "sex" auf Schritt "body"), also
  // steht es hier ausdruecklich. Ein Sprung ist nur richtig, wenn der Bildschirm mit
  // dieser einen Antwort vollstaendig beantwortet ist.
  function onbAutoNext(stepId) {
    const c = onb.cur;
    if (stepId === "bodyfat" || stepId === "activity") return true;
    // "goal" traegt zwei Fragen: nach dem Ziel erscheint erst das Tempo. Springen also
    // nur, wenn beides steht – bei "Halten" gibt es kein Tempo.
    if (stepId === "goal") return !!c.mode && (c.mode === "hold" || !!c.pace);
    return false;
  }

  function onbGo(delta) {
    const steps = onbSteps();
    const next = onb.i + delta;
    if (next < 0) return;
    if (next >= steps.length) { finishOnboarding(onb.first ? "Viel Erfolg!" : null); return; }
    onb.i = next;
    renderOnboardStep();
  }

  // Auswahlkachel. Die Auswahl haengt NICHT allein an der Farbe – das Haekchen traegt
  // sie mit, sonst waere sie fuer Farbfehlsichtige nicht zu erkennen.
  const ONB_TICK = `<svg class="onb-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
  function onbOpt(grp, v, label, hint) {
    const on = onb.cur[grp] === v;
    return `<button type="button" class="onb-opt${on ? " on" : ""}" data-opt="${grp}" data-v="${esc(v)}" aria-pressed="${on ? "true" : "false"}">
      <span class="onb-opt-t">${esc(label)}</span>${hint ? `<span class="onb-opt-h">${esc(hint)}</span>` : ""}${on ? ONB_TICK : ""}</button>`;
  }

  // Ein beschriftetes Zahlenfeld fuer die Sammel-Bildschirme. Auf den frueheren
  // Ein-Frage-Bildschirmen trug die Ueberschrift die Bedeutung des Felds; stehen
  // mehrere nebeneinander, braucht jedes sein eigenes <label for>. numField() liefert
  // am Handy ein <select> (Auswahlrad) statt eines Zahlenfelds – das bleibt so.
  function onbNumField(k) {
    const num = ONB_NUM[k];
    return `<div class="onb-f">
      <label class="onb-f-l" for="onb-${k}">${esc(num.lab)}</label>
      <div class="onb-f-in">
        ${numField({ id: "onb-" + k, cls: "onb-num", min: num.min, max: num.max,
                     step: k === "tmin" ? 5 : 1, value: onb.cur[k], placeholder: "–",
                     pickerPlaceholder: "–", extra: 'data-num="' + k + '"' })}
        <span class="onb-f-u">${esc(num.unit)}</span>
      </div>
    </div>`;
  }

  function onbStepHtml(id) {
    const c = onb.cur;
    if (id === "hi") {
      // Frueher stand hier ein Knopf "Mein Ziel behalten". Der konnte nie erscheinen:
      // "hi" gibt es nur beim Erstkontakt, und den startet maybeStartOnboarding
      // ausschliesslich, wenn noch KEIN Ziel existiert. Mitsamt seinem Handler entfernt,
      // der auf den inzwischen aufgeloesten Schritt "how" gesprungen waere.
      //
      // Steht der Name schon fest, wird er hier zur Begruessung – dann ist die Frage
      // danach ueberfluessig (siehe onbNameFehlt) und der Name trotzdem sichtbar.
      const vorname = onbNameFehlt() ? "" : String(c.name || "").trim().split(/\s+/)[0];
      return `<div class="onb-hi">
        <div class="onb-mark" aria-hidden="true"></div>
        ${vorname ? `<p class="onb-kicker">Willkommen, ${esc(vorname)}</p>` : ""}
        <h2 class="onb-q">Plan it. Cook it. Lift it.</h2>
        <ul class="onb-list">
          <li><b>Ziel</b> – Kalorien und Makros aus deinen Daten.</li>
          <li><b>Wochenplan</b> – Frühstück, Mittag, Abend.</li>
          <li><b>Einkaufsliste</b> – automatisch aus deinem Plan.</li>
        </ul></div>`;
    }
    const txt = ONB_TEXT[id];
    if (txt) {
      return `<label class="onb-q" for="onb-text" tabindex="-1">${txt.q}</label>
        <input type="text" id="onb-text" class="onb-text" maxlength="${txt.max}"
               autocomplete="given-name" placeholder="${esc(txt.placeholder)}" value="${esc(c[id])}">`;
    }
    // Koerperdaten: Geschlecht plus die drei Zahlen. Zusammen auf einem Bildschirm, weil
    // sie zusammengehoeren und niemand vier Mal "Weiter" tippen will, um sein Alter,
    // seine Groesse und sein Gewicht zu nennen. Jedes Feld traegt sein eigenes <label>.
    if (id === "body") {
      return `<h2 class="onb-q" tabindex="-1">Erzähl uns von dir</h2>
        <div class="onb-opts onb-opts-2">${onbOpt("sex", "f", "Weiblich")}${onbOpt("sex", "m", "Männlich")}</div>
        <div class="onb-grid">${onbNumField("age")}${onbNumField("height")}${onbNumField("weight")}</div>`;
    }
    if (id === "bodyfat") {
      const list = BODYFAT[c.sex] || BODYFAT.m;
      return `<h2 class="onb-q" tabindex="-1">Was kommt deinem Körper am nächsten?</h2>
        <p class="onb-why">Damit rechnen wir genauer als mit Gewicht allein.</p>
        <div class="onb-bf">${list.map((o, i) => {
          const on = c.bodyfat === String(o.v);
          return `<button type="button" class="onb-bf-o${on ? " on" : ""}" data-opt="bodyfat" data-v="${o.v}" aria-pressed="${on ? "true" : "false"}">
            ${bfSvg(c.sex, i)}
            <span class="onb-bf-p">${esc(o.r)}</span>
            <span class="onb-bf-t">${esc(o.label)}</span>
            <span class="onb-bf-h">${esc(o.hint)}</span>${on ? ONB_TICK : ""}</button>`;
        }).join("")}</div>
        <button type="button" class="btn ghost sm onb-bf-skip${c.bodyfat === "" ? " on" : ""}" data-opt="bodyfat" data-v="" aria-pressed="${c.bodyfat === "" ? "true" : "false"}">Weiß ich nicht</button>`;
    }
    if (id === "activity") {
      return `<h2 class="onb-q" tabindex="-1">Wie viel bewegst du dich im Alltag?</h2>
        <p class="onb-why">Nur Beruf und Alltag – Training zählt separat.</p>
        <div class="onb-opts onb-opts-1">${ACTIVITY.map(a => onbOpt("activity", a.key, a.label, a.hint)).join("")}</div>`;
    }
    // Training: Tage, Haerte und Dauer auf einem Bildschirm. Haerte und Dauer erscheinen
    // erst, wenn ein Tag gewaehlt ist – frueher fielen dafuer zwei ganze Schritte weg
    // und die Gesamtzahl sprang mitten im Ablauf.
    if (id === "training") {
      const hat = c.tdays.length > 0;
      return `<h2 class="onb-q" tabindex="-1">Wann trainierst du?</h2>
        <div class="tdays onb-tdays" role="group" aria-label="Trainingstage">
          ${DAYS.map(d => `<button type="button" data-tday="${d.key}" aria-pressed="${c.tdays.indexOf(d.key) !== -1 ? "true" : "false"}" aria-label="${esc(d.label)}">${d.short}</button>`).join("")}
        </div>
        ${hat ? `<div class="onb-sub">
          <h3 class="onb-sub-q">Wie hart?</h3>
          <div class="onb-opts onb-opts-1">${TRAIN_LEVELS.map(lv => onbOpt("tlevel", lv.key, lv.label, lv.ex)).join("")}</div>
          <div class="onb-grid onb-grid-1">${onbNumField("tmin")}</div>
        </div>` : `<p class="onb-why">Kein Trainingstag? Lass die Woche einfach leer.</p>`}`;
    }
    // Ziel und Tempo zusammen: Das Tempo hat je nach Ziel nur zwei bis drei Kacheln und
    // ergibt ohne das Ziel darueber ohnehin keinen Sinn. Bei "Halten" bleibt der untere
    // Block leer, statt dass ein ganzer Schritt verschwindet.
    if (id === "goal") {
      const pace = paceOptions(c.mode);
      return `<h2 class="onb-q" tabindex="-1">Was ist dein Ziel?</h2>
        <div class="onb-opts onb-opts-1">${onbOpt("mode", "lose", "Abnehmen", "Kalorien unter dem Bedarf")}${onbOpt("mode", "hold", "Gewicht halten", "Kalorien auf Bedarfshöhe")}${onbOpt("mode", "gain", "Zunehmen", "Kalorien über dem Bedarf")}</div>
        ${pace.length ? `<div class="onb-sub">
          <h3 class="onb-sub-q">Wie schnell?</h3>
          <div class="onb-opts onb-opts-1">${pace.map(o => onbOpt("pace", o[0], o[1], o[2])).join("")}</div>
        </div>` : ""}`;
    }
    // Einwilligung und Zielgewicht gehoeren zusammen: Das Zielgewicht setzt voraus, dass
    // wir das Gewicht ueberhaupt speichern duerfen, und erscheint deshalb erst danach.
    if (id === "target") {
      return `<h2 class="onb-q" tabindex="-1">Dürfen wir dein Gewicht speichern?</h2>
        <p class="onb-why">Gesundheitsdatum – jederzeit widerrufbar.</p>
        <div class="onb-opts">${onbOpt("weightConsent", "yes", "Ja, speichern", "Diagramm & Zielgewicht")}${onbOpt("weightConsent", "no", "Nein, danke")}</div>
        ${c.weightConsent === "yes" ? `<div class="onb-sub">
          <div class="onb-grid onb-grid-1">
            <div class="onb-f">
              <label class="onb-f-l" for="onb-weightGoal">Zielgewicht dieses Jahr <span class="onb-f-opt">optional</span></label>
              <div class="onb-f-in">
                ${numField({ id: "onb-weightGoal", cls: "onb-num", min: KG_MIN, max: KG_MAX, step: 0.1,
                             value: c.weightGoal, placeholder: "–", pickerPlaceholder: "–",
                             extra: 'data-num="weightGoal"' })}
                <span class="onb-f-u">kg</span>
              </div>
            </div>
          </div>
        </div>` : ""}`;
    }
    if (id === "result") {
      // Kann eigentlich nicht vorkommen (der Weiter-Knopf laesst niemanden mit Luecken
      // hierher), aber ueber Zurueck-Navigation und alte Ziele ist es denkbar. Lieber
      // eine Ansage als eine Karte voller NaN.
      const fehlt = missingCalc(onbGoalInput());
      if (fehlt.length) {
        return `<h2 class="onb-q" tabindex="-1">Da fehlt noch etwas</h2>
          <p class="onb-why">Für die Rechnung fehlt ${esc(fehlt.join(" und "))}. Geh mit <b>Zurück</b> ein paar Schritte zurück.</p>`;
      }
      const g = computeGoal(onbGoalInput());
      const hatT = c.tdays.length > 0;
      // Mit Trainingstagen den Wert dafuer gleich mitzeigen: „an Trainingstagen kommt
      // etwas obendrauf" bleibt sonst eine Behauptung, mit der niemand rechnen kann.
      // Dieselben Helfer wie im Rechner, damit beide nie auseinanderlaufen.
      const tPlus = hatT ? trainKcal(c.tlevel || "mod", +c.tmin, g.weight) : 0;
      const tTag = hatT ? trainFromRest({ kcal: g.kcal, carbs: g.carbs, protein: g.protein, fat: g.fat }, tPlus) : null;
      return `<h2 class="onb-q" tabindex="-1">Dein Ziel steht</h2>
        ${hatT ? `<p class="onb-why">Wert für einen Tag ohne Training.</p>` : ""}
        <div class="onb-res">
          <div class="onb-res-k">${g.kcal.toLocaleString("de-DE")}<span>kcal / ${hatT ? "Ruhetag" : "Tag"}</span></div>
          <div class="onb-res-m">
            <div class="t-prot"><b>${g.protein} g</b><span>Eiweiß</span></div>
            <div class="t-carb"><b>${g.carbs} g</b><span>Kohlenhydrate</span></div>
            <div class="t-fat"><b>${g.fat} g</b><span>Fett</span></div>
          </div>
          ${hatT ? `<div class="onb-res-t">
            <span>An Trainingstagen (${esc(trainLevel(c.tlevel || "mod").label)}, ${+c.tmin || trainLevel(c.tlevel || "mod").defMin} Min.)</span>
            <b>${tTag.kcal.toLocaleString("de-DE")} kcal</b>
          </div>` : ""}
        </div>
        ${g.adjust <= -750 ? `<p class="onb-warn">
          <svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span><b>${Math.abs(g.adjust)} kcal unter deinem Bedarf.</b> Das ist viel für einen langen Zeitraum – halte die Phase kurz oder sprich sie mit einer Ärztin, einem Arzt oder einer Ernährungsberatung ab.</span>
        </p>` : ""}
        <details class="calc-note onb-note"><summary>
          <svg class="ci" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span>Rechnerische Richtwerte – keine ärztliche Beratung</span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </summary>
        <div class="cn-body">Alle Werte sind <strong>rechnerische Richtwerte</strong>: Grundumsatz nach Katch-McArdle (mit Körperfettanteil) oder Mifflin-St-Jeor (ohne), Alltagsbedarf über einen Aktivitätsfaktor (PAL). Der tatsächliche Verbrauch kann davon deutlich abweichen. Sie ersetzen keine ärztliche oder ernährungsmedizinische Beratung. Bei Erkrankungen, in Schwangerschaft und Stillzeit oder vor einer stärkeren Ernährungsumstellung sprich bitte mit einer Ärztin oder einem Arzt.</div></details>`;
    }
    // "go" – Schlussbild, nur beim Erstkontakt. Der frueher eigene Schritt "how"
    // ("So laeuft deine Woche") ist hier als Liste aufgegangen: Nach dem Ergebnis noch
    // zwei reine Textbildschirme zu zeigen, liess den Hoehepunkt verpuffen.
    const g = state.goal;
    const vorname = String(c.name || "").trim().split(/\s+/)[0];
    return `<div class="onb-hi">
      <div class="onb-mark" aria-hidden="true"></div>
      <h2 class="onb-q" tabindex="-1">${vorname ? "Alles bereit, " + esc(vorname) : "Alles bereit"}</h2>
      ${g ? `<p class="onb-why">${goalSummaryHtml(g)}</p>` : ""}
      <ul class="onb-list">
        <li><b>Meals</b> – vier Beispiele sind schon da.</li>
        <li><b>Einkaufsliste</b> – automatisch, unter dem Wochenplan.</li>
        <li><b>Teilen</b> – deine Woche als Link.</li>
      </ul>
    </div>`;
  }

  // Gleiches Prinzip wie animateProgressCount() auf Home: weich hochzaehlen (und beim
  // "Zurueck" ebenso weich runter), aber nur bei echtem Schrittwechsel - ein Re-Render
  // desselben Schritts (z.B. Trainingstage antippen) soll nicht erneut animieren.
  function animateOnbProgress() {
    const span = view.querySelector(".wg-progress-bar > span");
    const count = view.querySelector(".onb-count");
    if (!span) { lastOnbStep = null; return; } // kein .onb-top auf diesem Schritt
    const step = +span.dataset.step, total = +span.dataset.total;
    const from = lastOnbStep == null ? Math.max(1, step - 1) : lastOnbStep;
    lastOnbStep = step;
    if (from === step || reducedMotion()) {
      span.style.width = Math.round(step / total * 100) + "%";
      if (count) count.textContent = `Schritt ${step} von ${total}`;
      return;
    }
    const dur = 700, t0 = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const cur = from + (step - from) * eased;
      span.style.width = Math.round(cur / total * 100) + "%";
      if (count) count.textContent = `Schritt ${Math.round(cur)} von ${total}`;
      if (p < 1) requestAnimationFrame(frame);
      else { span.style.width = Math.round(step / total * 100) + "%"; if (count) count.textContent = `Schritt ${step} von ${total}`; }
    }
    requestAnimationFrame(frame);
  }

  function renderOnboardStep() {
    const steps = onbSteps();
    const id = steps[onb.i];
    const last = onb.i === steps.length - 1;
    const showTop = onb.i > 0;
    const pct = Math.round((onb.i + 1) / steps.length * 100);
    const nextLabel = id === "result" ? "Ziel übernehmen" : last ? (onb.first ? "Zum Wochenplan" : "Fertig") : "Weiter";
    const miss = onbMissing(id);

    view.innerHTML = `<div class="onb">
      ${showTop ? `<div class="onb-top">
        <div class="wg-progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="${steps.length}" aria-valuenow="${onb.i + 1}" aria-label="Fortschritt der Einführung"><span style="width:${pct}%" data-step="${onb.i + 1}" data-total="${steps.length}"></span></div>
        <div class="onb-count">Schritt ${onb.i + 1} von ${steps.length}</div>
      </div>` : ""}
      <div class="onb-stage">${onbStepHtml(id)}</div>
      <div class="onb-foot">
        <button type="button" class="btn primary onb-next${miss ? " is-off" : ""}"${miss ? ' aria-disabled="true"' : ""}>${nextLabel}</button>
        <div class="onb-foot2">
          <button type="button" class="btn ghost sm onb-back"${onb.i === 0 ? ' style="visibility:hidden"' : ""}>Zurück</button>
          ${state.goal ? `<button type="button" class="btn ghost sm onb-skip">Schließen</button>` : ""}
        </div>
      </div>
    </div>`;
    animateOnbProgress();

    // Fokus auf die neue Frage: sonst bliebe er am Weiter-Knopf haengen und ein
    // Screenreader bekaeme vom Bildschirmwechsel nichts mit. Das Zahlenfeld bewusst
    // NICHT fokussieren – die Tastatur schoebe sich auf dem Handy ueber den Weiter-Knopf.
    const q = view.querySelector(".onb-q");
    if (q) setTimeout(() => { try { q.focus({ preventScroll: true }); } catch (e) { q.focus(); } }, 30);

    // Den Weiter-Knopf an den aktuellen Stand angleichen, ohne den Bildschirm neu zu
    // bauen – ein Re-Render bei jedem Tastendruck wuerde den Fokus aus dem Feld werfen.
    const refreshNext = () => {
      const m = onbMissing(id);
      const nb = view.querySelector(".onb-next");
      nb.classList.toggle("is-off", !!m);
      if (m) nb.setAttribute("aria-disabled", "true"); else nb.removeAttribute("aria-disabled");
    };

    view.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
      const grp = b.dataset.opt;
      onb.cur[grp] = b.dataset.v;
      // Passt das bisherige Tempo nicht mehr zum neuen Ziel, faellt es weg statt still
      // auf "Moderat" zu springen – dieselbe Ueberlegung wie in fillPace().
      if (grp === "mode" && !paceKeys(onb.cur.mode).some(k => k === onb.cur.pace)) onb.cur.pace = null;
      // Die uebliche Dauer der gewaehlten Stufe als Startwert – sie steht dann sichtbar im
      // Feld und ist damit keine unbemerkte Vorgabe, sondern ein Vorschlag zum Ueberschreiben.
      if (grp === "tlevel" && !onb.cur.tmin) onb.cur.tmin = String(trainLevel(onb.cur.tlevel).defMin);
      // Die Koerperfett-Stufen sind je Geschlecht andere Prozentwerte. Wer das Geschlecht
      // wechselt, haette sonst eine Auswahl stehen, zu der keine Kachel mehr passt.
      if (grp === "sex" && onb.cur.bodyfat) {
        const list = BODYFAT[onb.cur.sex] || [];
        if (!list.some(o => String(o.v) === onb.cur.bodyfat)) onb.cur.bodyfat = null;
      }
      // Die Einwilligung darf sofort verbindlich werden: Ihr Schritt faellt nicht mehr
      // aus der Liste (frueher tat er das, weshalb sie erst nach der Haken-Pause
      // committet werden durfte – sonst sprang der Ablauf ohne sichtbaren Haken weiter).
      if (grp === "weightConsent") { setWeightConsent(b.dataset.v === "yes"); save(); }
      renderOnboardStep();
      // Weiterspringen statt einen zweiten Tipp zu verlangen – aber nur auf Bildschirmen,
      // die mit dieser einen Antwort fertig beantwortet sind. Kurz warten, damit die
      // Auswahl noch zu sehen ist; ohne Bewegungswunsch sofort.
      if (!onbAutoNext(id)) return;
      setTimeout(() => {
        if (!onb || onbSteps()[onb.i] !== id) return;   // inzwischen woanders
        onbGo(1);
      }, reducedMotion() ? 0 : 260);
    }));

    // Auf den Sammel-Bildschirmen stehen mehrere Zahlenfelder nebeneinander, deshalb
    // ueber data-num statt einer festen Kennung. "change" zusaetzlich zu "input", weil
    // das Auswahlrad auf dem Handy nur darueber meldet.
    view.querySelectorAll("[data-num]").forEach(inp => {
      const k = inp.dataset.num;
      const onNum = () => { onb.cur[k] = inp.value; refreshNext(); };
      inp.addEventListener("input", onNum);
      inp.addEventListener("change", onNum);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); view.querySelector(".onb-next").click(); } });
    });

    const textEl = view.querySelector("#onb-text");
    if (textEl) {
      textEl.addEventListener("input", () => { onb.cur[id] = textEl.value; refreshNext(); });
      textEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); view.querySelector(".onb-next").click(); } });
    }

    // Trainingstage: Mehrfachauswahl, deshalb aria-pressed und KEIN Weiterspringen –
    // wer Mo/Mi/Fr trainiert, ist mit dem ersten Tipp noch nicht fertig.
    const tdaysEl = view.querySelector(".onb-tdays");
    if (tdaysEl) tdaysEl.addEventListener("click", e => {
      const b = e.target.closest("button[data-tday]"); if (!b) return;
      const k = b.dataset.tday;
      const i = onb.cur.tdays.indexOf(k);
      if (i === -1) onb.cur.tdays.push(k); else onb.cur.tdays.splice(i, 1);
      // In der Reihenfolge der Woche halten, nicht in der des Antippens.
      onb.cur.tdays = DAYS.filter(d => onb.cur.tdays.indexOf(d.key) !== -1).map(d => d.key);
      renderOnboardStep();
    });

    view.querySelector(".onb-next").addEventListener("click", () => {
      const m = onbMissing(id);
      if (m) {
        toast(m);
        // Auf den Sammel-Bildschirmen in das erste lückenhafte Feld springen, nicht
        // pauschal ins erste – sonst zeigt der Hinweis auf "Gewicht" und der Fokus steht
        // im Alter. Gibt es kein passendes Feld (reine Kachelauswahl), bleibt der Fokus.
        const first = Array.prototype.find.call(view.querySelectorAll("[data-num]"),
          el2 => onbNumMissing(el2.dataset.num));
        if (first) first.focus(); else if (textEl) textEl.focus();
        return;
      }
      // Der Name gehoert ins Firebase-Profil, nicht nur in den lokalen Zustand: sonst
      // ueberschreibt handleCloudUser ihn bei der naechsten Anmeldung mit dem displayName.
      // Bewusst ohne await – ein langsames Netz darf den Ablauf nicht anhalten.
      if (id === "name") {
        const nm = String(onb.cur.name).trim();
        applyDisplayName(nm).catch(() => {
          // Cloud-Update gescheitert (offline). Lokal trotzdem uebernehmen, damit der Name
          // wenigstens oben rechts steht, und das ehrlich sagen: bei der naechsten Anmeldung
          // gewinnt sonst wieder der alte displayName.
          profile = Object.assign({}, profile, { name: nm });
          saveProfile(); rememberLast(); renderProfileChip();
          toast("Dein Name steht auf diesem Gerät, konnte aber nicht in deinem Konto gespeichert werden");
        });
      }
      // Das Zielgewicht steht jetzt auf "target" (zusammen mit der Einwilligung, die es
      // voraussetzt) statt auf einem eigenen Bildschirm.
      if (id === "target") {
        const v = onb.cur.weightGoal;
        if (v !== "" && v != null) {
          const n = Number(v);
          if (isFinite(n)) {
            if (!state.weightGoals) state.weightGoals = {};
            state.weightGoals[activeYear()] = Math.round(n * 10) / 10;
            save();
          }
        }
      }
      if (id === "result") { state.goal = computeGoal(onbGoalInput()); noteWeightFromGoal(); save(); }
      onbGo(1);
    });
    view.querySelector(".onb-back").addEventListener("click", () => onbGo(-1));
    // Der Schliessen-Knopf existiert nur, wenn bereits ein Ziel gesetzt ist (ohne Ziel
    // ist der Ablauf nicht verlassbar – siehe maybeStartOnboarding).
    const sk = view.querySelector(".onb-skip");
    if (sk) sk.addEventListener("click", () => finishOnboarding(null));
  }

  // ---------- Erscheinungsbild ----------
  // Bewusst nur lokal und NICHT im Cloud-State: Das Geraet entscheidet, nicht das
  // Konto — Handy dunkel und Laptop hell soll unabhaengig bleiben. Deshalb eigener
  // localStorage-Key statt eines Feldes in state.
  const THEME_KEY = "wochenkueche_theme_v1";
  function getTheme() {
    try { const t = localStorage.getItem(THEME_KEY); return (t === "light" || t === "dark") ? t : "system"; }
    catch (e) { return "system"; }
  }
  function applyTheme(mode) {
    const root = document.documentElement;
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    // Browser-/Statusleiste auf dem Handy mitziehen. Das zweite theme-color-Meta traegt
    // die dunkle Farbe: "all" erzwingt sie, "not all" schaltet sie ab (dann greift das
    // erste, rote Meta), und bei "system" wieder die urspruengliche Media-Abfrage.
    const m = document.querySelector('meta[name="theme-color"][media]');
    if (m) m.setAttribute("media", mode === "dark" ? "all" : mode === "light" ? "not all" : "(prefers-color-scheme: dark)");
    try {
      if (mode === "system") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, mode);
    } catch (e) {}
  }

  // ---------- Einstellungen ----------
  function openSettings() {
    const hasEx = state.recipes.some(isExample);
    const th = getTheme();
    const thBtn = (v, label) => `<button type="button" role="radio" data-th="${v}" aria-checked="${th === v}" tabindex="${th === v ? 0 : -1}"${th === v ? ' class="on"' : ""}>${label}</button>`;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Einstellungen">
      <div class="modal-head"><h3>Einstellungen</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <div class="setlist">
          <button type="button" class="setrow" data-si="profile"><span><b>Profil bearbeiten</b><small>Name und E-Mail</small></span></button>
          <div class="setpick">
            <b id="setth-l">Erscheinungsbild</b>
            <div class="seg" data-thgrp role="radiogroup" aria-labelledby="setth-l">${thBtn("light", "Hell")}${thBtn("dark", "Dunkel")}${thBtn("system", "System")}</div>
          </div>
          ${hasEx ? `<button type="button" class="setrow" data-si="examples"><span><b>Beispiel-Meals entfernen</b><small>Die mitgelieferten Meals löschen</small></span></button>` : ""}
        </div>
      </div>
      <div class="modal-foot"><button class="btn primary" data-close>Schließen</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    // Erscheinungsbild: greift sofort, das Modal bleibt offen — der Wechsel ist die
    // Rueckmeldung. Rollende tabindex-Vergabe, weil eine Radiogruppe per Pfeiltaste
    // bedient wird und nicht per Tab durch alle drei Knoepfe.
    const thBtns = Array.from(node.querySelectorAll("[data-th]"));
    function pickTheme(b) {
      applyTheme(b.dataset.th);
      thBtns.forEach(x => {
        const on = x === b;
        x.classList.toggle("on", on);
        x.setAttribute("aria-checked", String(on));
        x.tabIndex = on ? 0 : -1;
      });
      b.focus();
    }
    thBtns.forEach((b, i) => {
      b.addEventListener("click", () => pickTheme(b));
      b.addEventListener("keydown", e => {
        const d = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1
                : (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        pickTheme(thBtns[(i + d + thBtns.length) % thBtns.length]);
      });
    });

  // Aktuelle Kalenderwoche + Datumsbereich, z. B. "Woche 29 · 13.–19. Juli"
  function weekLabel(offsetWeeks) {
    const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    const now = new Date();
    if (offsetWeeks) now.setDate(now.getDate() + offsetWeeks * 7);
    const dow = now.getDay();                              // 0=So … 6=Sa
    const mon = new Date(now); mon.setHours(0, 0, 0, 0);
    mon.setDate(now.getDate() + (dow === 0 ? -6 : 1 - dow)); // Montag dieser Woche
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    // ISO-Kalenderwoche über den Donnerstag der Woche
    const thu = new Date(Date.UTC(mon.getFullYear(), mon.getMonth(), mon.getDate() + 3));
    const firstThu = new Date(Date.UTC(thu.getUTCFullYear(), 0, 4));
    firstThu.setUTCDate(firstThu.getUTCDate() - ((firstThu.getUTCDay() + 6) % 7) + 3);
    const week = 1 + Math.round((thu - firstThu) / 6048e5);  // 6048e5 ms = 1 Woche
    const range = mon.getMonth() === sun.getMonth()
      ? `${mon.getDate()}.–${sun.getDate()}. ${MON[sun.getMonth()]}`
      : `${mon.getDate()}. ${MON[mon.getMonth()]} – ${sun.getDate()}. ${MON[sun.getMonth()]}`;
    return `Woche ${week} · ${range}`;
  }

  function renderVerifyPending(user) {
    authMode = "cloud";
    appEl.classList.add("authing");
    profileSlot.innerHTML = "";
    // onAuthStateChanged feuert beim Anmelden mehrfach (siehe Kommentare bei handleCloudUser) -
    // ein erneuter Aufruf hier soll nicht einen zweiten Poll-Timer nebenher laufen lassen.
    clearInterval(verifyPollTimer); verifyPollTimer = null;
    const email = user && user.email ? user.email : "";
    view.innerHTML = `<div class="auth"><div class="auth-card">
      <div class="verify-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>

      <p class="auth-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg><span>Keine Mail erhalten? Schau auch im <strong>Spam-Ordner</strong> nach. Der Link ist einige Zeit gültig.</span></p>
    </div></div>`;
    const card = view.querySelector(".auth-card");
    const errEl = view.querySelector("#v-err");
    const setBusy = on => card.classList.toggle("auth-busy", !!on);

    view.querySelector("#v-check").addEventListener("click", async () => {
      errEl.textContent = ""; setBusy(true);
      try {
        const u = await window.CloudAuth.reloadUser();
        if (u && u.emailVerified) { clearInterval(verifyPollTimer); handleCloudUser(u); }
        else { setBusy(false); errEl.textContent = "Noch nicht bestätigt. Bitte klicke zuerst den Link in der E-Mail."; }
      } catch (e) { setBusy(false); errEl.textContent = cloudErrMsg(e); }
    });
    view.querySelector("#v-resend").addEventListener("click", async () => {
      errEl.textContent = ""; setBusy(true);
      try { await window.CloudAuth.resendVerification(); toast("Bestätigungsmail gesendet"); }
      catch (e) { errEl.textContent = cloudErrMsg(e); }
      setBusy(false);
    });
    view.querySelector("#v-back").addEventListener("click", () => {
      clearInterval(verifyPollTimer);
      try { window.CloudAuth.logout(); } catch (e) {}
      cloudMode = "login";
    });
    // Paket B4: automatisch pruefen statt nur auf Knopfdruck zu warten - alle 5 s im
    // Hintergrund, still (kein Busy-Zustand, keine Fehlermeldung bei "noch nicht bestaetigt",
    // das waere staendiges Rauschen). Wird bestaetigt, uebernimmt derselbe Weg wie der Knopf.
    verifyPollTimer = setInterval(async () => {
      try {
        const u = await window.CloudAuth.reloadUser();
        if (u && u.emailVerified) { clearInterval(verifyPollTimer); handleCloudUser(u); }
      } catch (e) { /* still - ein Netzwerkfehler beim Hintergrund-Poll ist kein Nutzerfehler */ }
    }, 5000);
  }

        </div>`);
        const stage = node.querySelector(".crop-stage");
        const imgEl = stage.querySelector("img");
        imgEl.src = e.target.result;
        function clampPan() {
          const dispW = natW * scale, dispH = natH * scale;
          const maxX = Math.max(0, (dispW - STAGE) / 2);
          const maxY = Math.max(0, (dispH - STAGE) / 2);
          tx = Math.min(maxX, Math.max(-maxX, tx));
          ty = Math.min(maxY, Math.max(-maxY, ty));
        }
        // Waehrend des Ziehens: sanfter Widerstand ueber den Rand hinaus statt hartem
        // Stopp (Skill-Regel "friction over hard stops"). clampPan() bleibt der harte
        // Clamp fuer Zoom/Initialwerte und fuer den Snap-back beim Loslassen.
        function dampPan() {
          const dispW = natW * scale, dispH = natH * scale;
          const maxX = Math.max(0, (dispW - STAGE) / 2);
          const maxY = Math.max(0, (dispH - STAGE) / 2);
          const damp = (v, max) => {
            if (v >= -max && v <= max) return v;
            const over = v > max ? v - max : v + max;
            return (v > max ? max : -max) + over * 0.35;
          };
          tx = damp(tx, maxX);
          ty = damp(ty, maxY);
        }
        function paint() {
          const dispW = natW * scale, dispH = natH * scale;
          imgEl.style.width = dispW + "px"; imgEl.style.height = dispH + "px";
          imgEl.style.transform = `translate(${STAGE / 2 - dispW / 2 + tx}px, ${STAGE / 2 - dispH / 2 + ty}px)`;
        }
        clampPan(); paint();
        let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
        stage.addEventListener("pointerdown", e => {
          dragging = true; stage.classList.add("dragging");
          dragStartX = e.clientX; dragStartY = e.clientY; panStartX = tx; panStartY = ty;
          stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener("pointermove", e => {
          if (!dragging) return;
          tx = panStartX + (e.clientX - dragStartX);
          ty = panStartY + (e.clientY - dragStartY);
          dampPan(); paint();
        });
        function endDrag() {
          dragging = false; stage.classList.remove("dragging");
          clampPan();
          imgEl.style.transition = "transform 200ms var(--ease-out, ease-out)";
          paint();
          setTimeout(() => { imgEl.style.transition = ""; }, 220);
        }
        stage.addEventListener("pointerup", endDrag);
        stage.addEventListener("pointercancel", endDrag);
        function zoom(factor) {
          scale = Math.min(maxScale, Math.max(minScale, scale * factor));
          clampPan(); paint();
        }
        node.querySelector("[data-zoom-in]").addEventListener("click", () => zoom(1.2));
        node.querySelector("[data-zoom-out]").addEventListener("click", () => zoom(1 / 1.2));
        node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
        node.querySelector("[data-ok]").addEventListener("click", () => {
          const c = document.createElement("canvas"); c.width = OUT; c.height = OUT;
          const ctx = c.getContext("2d");
          const exportScale = OUT / STAGE;
          const dispW = natW * scale, dispH = natH * scale;
          const left = STAGE / 2 - dispW / 2 + tx, top = STAGE / 2 - dispH / 2 + ty;
          ctx.drawImage(img, 0, 0, natW, natH, left * exportScale, top * exportScale, dispW * exportScale, dispH * exportScale);
          let dataUrl = null;
          try { dataUrl = c.toDataURL("image/jpeg", 0.85); } catch (err) { dataUrl = null; }
          closeModal();
          onDone(dataUrl);
        });
        openModal(node);
      };
      img.onerror = () => toast("Bild konnte nicht geladen werden");
      img.src = e.target.result;
    };
    reader.onerror = () => toast("Bild konnte nicht geladen werden");
    reader.readAsDataURL(file);
  }

  function signOut() {
    confirmModal({
      title: "Abmelden?",
      text: "Dein Plan und deine Meals bleiben auf diesem Gerät gespeichert. Du kannst dich jederzeit wieder anmelden.",
      okLabel: "Abmelden",
      onConfirm: () => {
        if (authMode === "cloud" && window.CloudAuth && window.CloudAuth.logout) {
          cloudMode = "login";
          // Einen noch ausstehenden Push (800-ms-Sperre in scheduleCloudPush) vorher
          // abschliessen: stopCloudSync() wirft ihn sonst per clearTimeout weg, und eine
          // gerade geloeschte Sache bliebe in der Cloud stehen. Nach 2 s trotzdem weiter,
          // damit ein schlechtes Netz das Abmelden nicht blockiert - die Grabsteine holen
          // die Loeschung beim naechsten Anmelden ohnehin nach.
          Promise.race([
            pushNow().catch(() => {}),
            new Promise(res => setTimeout(res, 2000))
          ]).then(() => {
            stopCloudSync();
            window.CloudAuth.logout().catch(() => {});
          });
          // onAuthStateChanged rendert danach die Anmeldung
        } else {
          profile = null; saveProfile(); renderAuthLocal();
        }
      }
    });
  }

  // Alles, was dieses Geraet ueber den Nutzer lokal gespeichert hat, entfernen –
  // gemeinsame Endstrecke fuer beide Loesch-Wege (Cloud-Konto und lokales Profil).
  function wipeLocalData() {
    [STORE_KEY, PROFILE_KEY, LAST_KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  }

  // Konto vollstaendig loeschen (Cloud-Konten, Art. 17 DSGVO / Datenschutz Ziffer 10).
  // Loescht zusaetzlich alle bekannten Teilen-Links, damit kein Snapshot verwaist zurueckbleibt.
  function deleteAccountFlow() {
    // Als Inhaber einer Gruppe erst eine Entscheidung erzwingen: bliebe die Gruppe ohne
    // Inhaber zurueck, koennte niemand mehr Rollen vergeben oder sie aufloesen - und die
    // Zusage aus Ziffer 10 der Datenschutzerklaerung waere nicht mehr wahr.
    if (syncGid && groupRole() === "owner") {
      const others = groupMembers.filter(m => m.uid !== syncUid).length;
      confirmModal({
        title: "Erst die Gruppe auflösen",
        text: others
          ? `Du bist Inhaber eurer Gruppe mit ${others} weiteren ${others === 1 ? "Person" : "Personen"}. Löse sie zuerst auf oder übergib sie – danach kannst du dein Konto löschen.`
          : "Du bist Inhaber einer Gruppe. Löse sie zuerst auf – danach kannst du dein Konto löschen.",
        okLabel: "Zur Gruppe",
        onConfirm: () => openGroupModal()
      });
      return;
    }
    const user = (window.CloudAuth && window.CloudAuth.current) ? window.CloudAuth.current() : null;
    const pid = user && user.providerData[0] ? user.providerData[0].providerId : null;
    const isPw = pid === "password";
    const n = (state.shares || []).length;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Konto löschen">
      <div class="modal-head"><h3>Konto endgültig löschen?</h3><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 12px">Dein Konto, dein Wochenplan, deine Meals und dein gespeichertes Ziel werden unwiderruflich gelöscht${n ? ` – ebenso ${n} geteilte${n === 1 ? "r" : ""} Wochenplan-Link${n === 1 ? "" : "e"}` : ""}. Das kann nicht rückgängig gemacht werden.</p>
        ${isPw
          ? `<div class="field"><label for="del-pw">Passwort zur Bestätigung</label><input type="password" id="del-pw" autocomplete="current-password" placeholder="Dein Passwort"></div>`
          : `<p class="share-hint" style="margin:0">Zur Bestätigung öffnet sich gleich noch einmal das Anmeldefenster.</p>`}
        <p class="auth-err" id="del-err" role="alert"></p>
      </div>
      <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn danger" data-confirm>Konto löschen</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const btn = node.querySelector("[data-confirm]");
    const err = node.querySelector("#del-err");
    btn.addEventListener("click", async () => {
      const pw = isPw ? node.querySelector("#del-pw").value : null;
      if (isPw && !pw) { err.textContent = "Bitte gib dein Passwort ein."; return; }
      err.textContent = "";
      btn.disabled = true; btn.textContent = "Wird gelöscht …";
      try {
        // Frisch aus der Cloud laden statt state.recipes zu nehmen: auf einem zweiten
        // Geraet angelegte Rezepte, die dieses Geraet noch nicht per Live-Sync erhalten
        // hat, muessen trotzdem mitgeloescht werden (Art. 17 DSGVO) - state.recipes waere
        // sonst potenziell unvollstaendig.
        const cloudRecipeIds = (window.CloudSync && window.CloudSync.loadRecipes && user)
          ? (await window.CloudSync.loadRecipes(["users", user.uid])).map(r => r.id)
          : state.recipes.map(r => r.id);
        // groupId mitgeben, damit der eigene Mitglieder-Eintrag (Name, Bild) nicht in einer
        // fremden Gruppe zurueckbleibt - er haengt nicht unter users/{uid} und wird deshalb
        // nicht mitgeloescht.
        await window.CloudAuth.deleteAccount({
          password: pw, shareIds: state.shares || [], recipeIds: cloudRecipeIds,
          groupId: syncGid || "", inviteCodes: state.inviteCodes || []
        });
        closeModal();
        stopCloudSync();
        wipeLocalData();
        toast("Konto und Daten wurden gelöscht");
        // Neu laden statt nur weiterzurendern: wipeLocalData() leert nur den
        // localStorage, nicht das im Speicher gehaltene state-Objekt (Rezepte, Plan,
        // Ziel) - ohne Reload wuerde ein direkt danach neu registriertes Konto genau
        // diese stehengebliebenen Daten wieder hochsynchronisieren, als waeren sie neu.
        setTimeout(() => location.reload(), 900);
      } catch (e) {
        if (e && e.dataAlreadyDeleted) {
          // Firestore-Daten sind schon weg, nur das Loeschen des Login-Zugangs selbst
          // ist fehlgeschlagen. Sauber abmelden statt einen Zwischenzustand zu zeigen -
          // ein erneuter Versuch nach dem Wieder-Anmelden schliesst die Loeschung ab.
          closeModal();
          stopCloudSync();
          wipeLocalData();
          try { window.CloudAuth.logout(); } catch (er) {}
          toast("Deine Daten wurden gelöscht. Bitte melde dich einmal neu an und wiederhole „Konto löschen“, um auch den Zugang zu entfernen.");
          setTimeout(() => location.reload(), 900);
          return;
        }
        err.textContent = cloudErrMsg(e);
        btn.disabled = false; btn.textContent = "Konto löschen";
      }
    });
    openModal(node);
  }

  // Lokales Profil (kein Cloud-Konto): Daten liegen ausschliesslich auf diesem Geraet,
  // daher genuegt das Leeren des lokalen Speichers.

  // ================= Gemeinsam planen (Gruppe) =================
  const ROLE_LABEL = { owner: "Inhaber", edit: "Mitplanen", view: "Nur ansehen" };

  // Eigene Meals in die Gruppe kopieren. Beispiel-Meals bleiben aussen vor - sie sind ein
  // einmaliges Willkommens-Angebot und haetten in einer fremden Sammlung nichts verloren
  // (gleicher Filter wie beim Konto-Merge in startCloudSync).
  async function copyOwnRecipesToGroup(gid) {
    const mine = state.recipes.filter(r => r && r.id && !isExample(r));
    if (!mine.length) return;
    // In Haeppchen: writeBatch vertraegt hoechstens 500 Vorgaenge, und Meals mit Fotos
    // sind gross - lieber mehrere kleine Batches als einer, der ganz scheitert.
    for (let i = 0; i < mine.length; i += 20) {
      await window.CloudSync.saveRecipesBatch(["groups", gid], mine.slice(i, i + 20), []);
    }
  }

  async function createGroup() {
    if (!syncUid || !window.CloudGroup) { toast("Dafür brauchst du dein Cloud-Konto."); return; }
    const gid = shareId();
    try {
      await window.CloudGroup.create(gid, {
        name: "", owner: syncUid, createdAt: Date.now(),
        settings: { shopForAll: true, changeHints: true }
      });
      await window.CloudGroup.putMember(gid, syncUid, {
        name: profile.name || "", avatar: await smallAvatar(state.profileImage),
        role: "owner", joinedAt: Date.now()
      });
      // Erst die Meals, dann umschalten: enterGroupSync ersetzt state.recipes durch den
      // Gruppenbestand - waeren die eigenen noch nicht oben, waeren sie danach weg.
      await copyOwnRecipesToGroup(gid);
      // Der eigene Wochenplan wandert ebenfalls mit, sonst startet die Gruppe leer,
      // obwohl gerade noch eine geplante Woche zu sehen war.
      for (const wk of Object.keys(state.plans || {})) {
        const flat = flattenWeek(state.plans[wk]);
        if (Object.keys(flat).length) await window.CloudGroup.savePlanWeek(gid, wk, Object.assign(flat, { by: syncUid, at: Date.now() }));
      }
      // Erst die Cloud, dann der lokale Stand: Scheitert der Schreibvorgang, darf hier kein
      // groupId zurueckbleiben, das nur dieses Geraet kennt - der naechste save() haette es
      // ins localStorage geschrieben, waehrend das Konto in der Cloud gar keine Gruppe hat.
      await window.CloudSync.save(syncUid, { groupId: gid });
      state.groupId = gid;
      await switchGroup(gid);
      toast("Gruppe steht – jetzt jemanden einladen");
      openGroupModal();
    } catch (e) {
      state.groupId = "";
      toast("Die Gruppe konnte nicht angelegt werden. Versuch es gleich noch einmal.");
    }
  }

  // Einladungslink erzeugen. Der Code ist der Zugang (80 Bit, wie die Teilen-Links) -
  // deshalb ist er in Firestore ausdruecklich nicht auflistbar.
  async function createInviteLink(role) {
    const code = shareId();
    await window.CloudGroup.createInvite(code, { gid: syncGid, role: role, by: syncUid, createdAt: Date.now() });
    // Code im eigenen Konto merken - genau wie die Teilen-Links (state.shares). Ohne das
    // liesse er sich spaeter nicht mehr zurueckziehen und bliebe beim Loeschen des Kontos
    // als offene Tuer in die Gruppe zurueck.
    state.inviteCodes = unionIds(state.inviteCodes, [code]);
    save();
    return location.origin + location.pathname + "?g=" + code;
  }

  async function joinGroup(code) {
    if (!syncUid || !window.CloudGroup) return;
    try {
      const inv = await window.CloudGroup.fetchInvite(code);
      if (!inv || !inv.gid) { toast("Diese Einladung gilt nicht mehr."); return; }
      if (syncGid === inv.gid) { toast("Du bist schon dabei."); return; }
      const role = inv.role === "view" ? "view" : "edit";
      await window.CloudGroup.putMember(inv.gid, syncUid, {
        name: profile.name || "", avatar: await smallAvatar(state.profileImage),
        role: role, via: code, joinedAt: Date.now()
      });
      // Nur mitlesende Mitglieder duerfen laut Regel gar nichts in die Gruppe schreiben -
      // ihre eigenen Meals bleiben deshalb im eigenen Konto liegen, statt hier an einer
      // abgelehnten Schreiboperation haengen zu bleiben.
      if (role !== "view") await copyOwnRecipesToGroup(inv.gid);
      // Cloud zuerst, siehe Begruendung in createGroup().
      await window.CloudSync.save(syncUid, { groupId: inv.gid });
      state.groupId = inv.gid;
      await switchGroup(inv.gid);
      toast("Ihr plant jetzt gemeinsam");
    } catch (e) {
      state.groupId = "";
      toast("Der Beitritt hat nicht geklappt. Bitte den Link noch einmal öffnen.");
    }
  }

  // Gruppe vollstaendig aufloesen (nur der Inhaber, ueber "Auflösen"). Erst der Batch aus
  // CloudGroup.dissolve (Gruppendokument + ALLE Mitglieder + ALLE Plaene + ALLE Meals in einem
  // Rutsch - Firestore loescht Unterkollektionen sonst nie mit), danach dieselbe lokale
  // Aufraeumarbeit wie beim einfachen Verlassen. Der eigene Mitglieder-Eintrag ist durch den
  // Batch schon weg; removeMember() darin (in leaveGroup()) ist dann ein folgenloser
  // Zweitversuch auf ein bereits geloeschtes Dokument.
  async function dissolveGroup() {
    if (!syncGid || !syncUid) return;
    const gid = syncGid;
    try {
      const [members, plans, recipes] = await Promise.all([
        window.CloudGroup.fetchMembers(gid),
        window.CloudGroup.loadPlans(gid),
        window.CloudGroup.loadRecipes(["groups", gid])
      ]);
      await window.CloudGroup.dissolve(gid, members.map(m => m.uid), plans.map(p => p.week), recipes.map(r => r.id));
      // Eigene Einladungscodes fuer GENAU diese Gruppe zusaetzlich loeschen. invites/{code} ist
      // bewusst nicht auflistbar (siehe firestore.rules) - deshalb ueber state.inviteCodes gehen,
      // dieselbe Liste, die auch beim Konto-Loeschen benutzt wird (deleteAccountFlow), und nur
      // die Codes entfernen, die wirklich zu dieser Gruppe gehoeren (die Liste koennte theoretisch
      // Codes einer laengst verlassenen frueheren Gruppe enthalten).
      const ownCodes = [];
      for (const code of (state.inviteCodes || [])) {
        try {
          const inv = await window.CloudGroup.fetchInvite(code);
          if (inv && inv.gid === gid) ownCodes.push(code);
        } catch (e) {}
      }
      for (const code of ownCodes) {
        try { await window.CloudGroup.deleteInvite(code); } catch (e) {}
      }
      if (ownCodes.length) state.inviteCodes = (state.inviteCodes || []).filter(c => ownCodes.indexOf(c) === -1);
    } catch (e) {
      // Batch schlug fehl (z. B. offline) - lieber lokal trotzdem aufraeumen, statt den Nutzer
      // in einer Gruppe festzuhalten, die er gerade aufloesen wollte. Auf dem Server bleibt sie
      // dann zwar bestehen, leaveGroup() unten entfernt zumindest den eigenen Zugriff.
    }
    await leaveGroup();
  }

  // Gruppe verlassen. Plan und Meals bleiben als eigene Kopie erhalten - sie stehen ja
  // schon vollstaendig im lokalen State; sie werden nur wieder ins eigene Konto geschrieben.
  async function leaveGroup() {
    if (!syncGid || !syncUid) return;
    const gid = syncGid;
    const keepRecipes = state.recipes.slice();
    const keepPlans = JSON.parse(JSON.stringify(state.plans || {}));
    try {
      await window.CloudGroup.removeMember(gid, syncUid);
    } catch (e) { /* schon entfernt - der Rest muss trotzdem laufen */ }
    state.groupId = "";
    leaveGroupState();
    state.recipes = keepRecipes;
    state.plans = keepPlans;
    setViewWeek(state.viewWeek);
    try {
      await window.CloudSync.save(syncUid, { groupId: "", plans: keepPlans });
      // Baseline leeren, damit der naechste Zyklus alle Meals als "neu" ins eigene
      // Konto schreibt - dort liegen sie ja noch nicht.
      lastPushedRecipes = new Map();
      lastPushedJSON = null;
    } catch (e) {}
    await switchGroup(null);
    toast("Du planst wieder für dich – deine Meals sind mitgekommen");
  }

  function openGroupModal() {
    if (authMode !== "cloud") {
      confirmModal({
        title: "Cloud-Konto nötig",
        text: "Gemeinsam planen geht nur mit einem Cloud-Konto – nur so kommt euer Plan auf beide Geräte.",
        okLabel: "Cloud-Konto anmelden",
        onConfirm: () => { authMode = "cloud"; renderAuthCloud(); }

    }
    let createdUrl = null;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Gemeinsam planen">

    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));

    function paint() {
      title.textContent = syncGid ? "Eure Gruppe" : "Zu zweit planen";
      body.innerHTML = syncGid ? groupHtml() : startHtml();
      wire();
    }

    // Zwei Schalter, mehr braucht eine Gruppe aus zwei Leuten nicht. Sie stehen direkt
    // unter der Mitgliederliste statt hinter einem eigenen Reiter - fuer zwei Zeilen
    // waere ein Reiterwechsel ein Klick zu viel, und "Einkauf fuer alle rechnen" soll
    // man sehen, nicht suchen.
    function settingsHtml() {

  // Der Link ist der einzige Schutz des geteilten Plans, also muss die ID unerratbar sein.
  // Math.random() ist dafuer ungeeignet (nicht kryptografisch) und ein Zeitstempel erst recht.
  // 16 Zeichen aus einem 32er-Alphabet = 80 Bit; 32 teilt 256 glatt, daher kein Modulo-Bias.
  function shareId() {
    const abc = "abcdefghijkmnpqrstuvwxyz23456789"; // ohne l/o/0/1 (verwechselbar)
    const c = window.crypto || window.msCrypto;
    const a = new Uint8Array(16);
    c.getRandomValues(a);
    let s = "";
    for (let i = 0; i < a.length; i++) s += abc[a[i] % abc.length];

  function copyToClipboard(text, okMsg) {
