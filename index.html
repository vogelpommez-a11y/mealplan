  .pitem .pfav { display: inline-flex; flex: none; color: var(--accent); }
  .pitem .pfav svg { width: 13px; height: 13px; fill: currentColor; }
  .pitem.suggest { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .pitem.offcat .pn, .pitem.offcat .pc { color: var(--text-muted); }
  .pitem.offcat img.pthumb { opacity: .55; }
  .pmore {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 8px; padding-top: 9px; border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--text-muted);
  }

  /* Detail / shopping */
  .detail .dbanner { height: 150px; border-radius: 12px; display: grid; place-items: center; position: relative; margin-bottom: 16px; overflow: hidden; }
  .detail .dbanner::after { content: ""; position: absolute; inset: 0; background: radial-gradient(180px 90px at 80% 14%, rgba(255,255,255,.30), transparent); }
  .detail .dbanner.has-photo::after { display: none; }
  .detail dl { margin: 0; }
  .detail .dsec { margin-top: 14px; }
  .detail .dsec h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 0 0 6px; }
  .detail ul { margin: 0; padding-left: 18px; line-height: 1.6; }
  .detail .steps { white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
  .shop-head { display: flex; align-items: center; gap: 13px; }
  .shop-head .cart { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--accent-contrast); background: linear-gradient(150deg, var(--accent), var(--accent-strong)); box-shadow: var(--shadow); }
  /* Personenanzahl: eine Zeile im Stil der .shop-item-Reihen darunter, damit sie als Teil
     der Liste liest und nicht als fremdes Bedienfeld. 44px-Knoepfe sind Pflicht (Touch),
     ergeben hier zufaellig genau die Hoehe einer .shop-item-Zeile - passt also auch optisch. */
  .shop-persons { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 4px 4px 4px 14px; margin-bottom: 13px; }
  .shop-persons .lbl { font-size: 14.5px; }
  .shop-persons .step { display: flex; align-items: center; flex: none; }
  .shop-persons .pnum { min-width: 96px; text-align: center; font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .shop-persons .pbtn {
    width: 44px; height: 44px; flex: none; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    border-radius: 10px; cursor: pointer; touch-action: manipulation;
    transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast), background var(--dur-fast), opacity var(--dur-fast);
  }
  .shop-persons .pbtn svg { width: 17px; height: 17px; }
  .shop-persons .pbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
  /* Rueckmeldung im Moment des Drucks, nicht erst beim Loslassen */
  .shop-persons .pbtn:active:not(:disabled) { transform: scale(.94); }
  /* Am Anschlag ausgegraut statt versteckt: ein verschwindender Knopf laesst den zweiten
     springen und nimmt dem Nutzer die Orientierung, wo die Grenze liegt. */
  .shop-persons .pbtn:disabled { opacity: .35; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .shop-persons .pbtn { transition: none; } .shop-persons .pbtn:active:not(:disabled) { transform: none; } }
  .shop-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
  .shop-progress .bar { flex: 1; height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .shop-progress .bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width var(--dur-slow) ease; }
  .shop-progress .ptext { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .shop-progress .toggle-all { font: inherit; font-size: 12.5px; font-weight: 550; color: var(--accent-strong); background: none; border: 0; cursor: pointer; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
  .shop-progress .toggle-all:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .shop-list { display: flex; flex-direction: column; gap: 7px; max-height: 46vh; overflow-y: auto; margin: 0 -6px; padding: 2px 6px; }
  .shop-item { display: flex; align-items: center; gap: 13px; padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; transition: border-color var(--dur-fast), background var(--dur-fast); }
  .shop-item:hover { border-color: var(--border-strong); }
  .shop-item:has(.shop-check:checked) { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 24%, var(--border)); }
  .shop-check { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .shop-item .box { flex: none; width: 23px; height: 23px; border-radius: 7px; border: 2px solid var(--border-strong); display: grid; place-items: center; color: #fff; transition: background var(--dur-fast), border-color var(--dur-fast); }
  .shop-item .box svg { width: 13px; height: 13px; opacity: 0; transform: scale(.5); transition: opacity var(--dur-fast), transform var(--dur-fast); }
  .shop-check:checked + .box { background: var(--accent); border-color: var(--accent); }
  .shop-check:checked + .box svg { opacity: 1; transform: none; }
  .shop-check:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shop-item .lbl { flex: 1; font-size: 14.5px; line-height: 1.35; word-break: break-word; }
  .shop-check:checked ~ .lbl { text-decoration: line-through; color: var(--text-muted); }
  .shop-item .qty { flex: none; font-size: 11.5px; font-weight: 650; color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-radius: 999px; padding: 3px 9px; font-variant-numeric: tabular-nums; }
  .shop-check:checked ~ .qty { opacity: .5; }
  .shop-empty { text-align: center; padding: 20px 10px 4px; color: var(--text-muted); }
  .shop-empty .ic { width: 46px; height: 46px; margin: 0 auto 12px; color: var(--accent); opacity: .85; }
  .shop-empty p { margin: 0 auto; max-width: 34ch; line-height: 1.5; }
  .shop-group { display: flex; flex-direction: column; gap: 7px; }
  .shop-group:not(:first-child) { margin-top: 10px; }
  .shop-cat { display: flex; align-items: center; gap: 8px; margin: 0 2px 1px; font-family: var(--font-display); font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .shop-cat-ic { font-size: 15px; line-height: 1; }
  .shop-cat-n { margin-left: auto; font-family: var(--font-body); font-size: 11px; font-weight: 650; letter-spacing: 0; color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); z-index: 90;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 550;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Undo-Variante (Paket B1): waehrend sie steht, darf der Knopf getroffen werden - der
     normale Text-Toast bleibt bewusst pointer-events:none, damit er nie etwas verdeckt. */
  #toast.has-undo.show { pointer-events: auto; }
  .toast-undo {
    position: relative;
    margin-left: 12px; background: transparent; border: 1px solid currentColor; color: inherit;
    font: inherit; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px;
    cursor: pointer; transition: background var(--dur-fast) var(--ease-out);
  }
  /* Zeitkritisch (5 s Fenster) am Daumen - die sichtbare Pille bleibt kompakt, die Trefferflaeche
     erreicht trotzdem 44px, gleiches hitSlop-Muster wie .btn.icon-gh::after. */
  .toast-undo::after { content: ""; position: absolute; inset: -10px; }
  .toast-undo:hover { background: color-mix(in srgb, currentColor 15%, transparent); }

  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); border:0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ---------- Profil (Login) & Teilen ---------- */
  .app.authing .tabs, .app.authing #profile-slot { display: none; }
  .profile { position: relative; display: flex; align-items: center; }
  .profile-btn { display: flex; align-items: center; gap: 9px; font: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px 4px 4px; color: var(--text); transition: border-color var(--dur-fast); }
  .profile-btn:hover { border-color: var(--accent); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; color: var(--accent-contrast); background: linear-gradient(150deg, var(--accent), var(--accent-strong)); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .profile-btn .pname { font-size: 13.5px; font-weight: 550; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Mitglieder der Gruppe, links neben dem eigenen Avatar. Ueberlappend statt in einer
     Reihe: das signalisiert "gehoert zusammen" und spart im Kopf den knappen Platz.
     Der Rand in --bg trennt die Kreise optisch voneinander (nicht --surface: der Stack
     sitzt auf dem Seitenhintergrund, nicht auf einer Karte). */
  .mstack { display: flex; align-items: center; flex: none; padding-right: 10px; }
  .mstack > * { margin-right: -9px; border: 2px solid var(--bg); box-sizing: content-box; }
  /* Ohne eigenes Foto neutral statt im Akzent-Verlauf: drei rote Kreise nebeneinander
     verschwimmen zu einem Klumpen, in dem niemand mehr zu erkennen ist. Rot bleibt dem
     eigenen Avatar - so liest der Stack sofort als "die anderen" plus "ich". */
  .mstack .avatar { width: 26px; height: 26px; font-size: 11px; background: var(--surface-2); color: var(--text-muted); }
  .mstack .avatar:has(img) { background: none; }
  /* "+3", wenn mehr Mitglieder da sind als Platz. Neutral gehalten - der Akzent gehoert
     dem eigenen Avatar, nicht der Zaehlung. */
  .mstack .more { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--text-muted); background: var(--surface-2); }
  /* Ab hier ist der Name schon ausgeblendet (siehe .pname unten) - dann muss auch der
     Stack schrumpfen, sonst draengt er die Reiter aus dem Kopf. */
  @media (max-width: 560px) {
    .mstack .avatar, .mstack .more { width: 23px; height: 23px; font-size: 10px; }
    .mstack > * { margin-right: -9px; }
  }
  .profile-btn .caret { color: var(--text-muted); }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; min-width: 216px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 18px 50px rgba(0,0,0,.28); padding: 6px; animation: pop .14s ease-out; }
  .menu .mhead { padding: 8px 11px 11px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .menu .mhead .mn { font-weight: 650; font-size: 14px; }
  .menu .mhead .me { font-size: 12px; color: var(--text-muted); word-break: break-all; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 13.5px; cursor: pointer; background: transparent; border: 0; border-radius: var(--radius-sm); padding: 9px 11px; color: var(--text); }
  .menu button:hover { background: var(--surface-2); }
  .menu button svg { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  /* Abmelden ist nicht destruktiv – es geht nichts verloren, und der Klick fuehrt
     ohnehin in einen Bestaetigungsdialog. Daher neutral wie die uebrigen Eintraege;
     abgesetzt wird es durch die Trennlinie darueber, die – anders als eine
     Hover-Faerbung – auch auf dem Touchscreen sichtbar ist. Rot bleibt echten
     Loeschaktionen vorbehalten. */
  .menu button.danger:hover { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--accent); }
  .menu button.danger:hover svg { color: var(--accent); }
  /* Konto/Daten loeschen IST destruktiv und unwiderruflich – anders als Abmelden
     durchgehend rot, nicht erst im Hover, plus eigene Trennlinie zur Abgrenzung
     von den ungefaehrlichen Eintraegen (destructive-emphasis). */
  .menu button.destructive, .menu button.destructive svg { color: var(--accent); }
  .menu button.destructive:hover { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 4px; }
  .sync-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); flex: none; }
  .sync-dot.ok { background: var(--ok); }
  .sync-dot.busy { background: var(--fr); animation: syncpulse 1s ease-in-out infinite; }
  .sync-dot.err { background: var(--danger); }
  .sync-dot.off { background: var(--border-strong); }
  .av-wrap { position: relative; display: inline-flex; }
  .sync-dot.chip { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border: 2px solid var(--surface); box-sizing: border-box; }
  .menu .msync { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 12px; color: var(--text-muted); }
  @keyframes syncpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  /* Profilbild-Vorschau im "Profil bearbeiten"-Formular - gleiche Gradient/Initialen-
     Optik wie der Header-Avatar, nur groesser. Rund-Button zum Aendern nach Vorbild
     .rcard .imgadd (gleiche Masse/Farbe), hier relativ zum Vorschau-Kreis positioniert. */
  .avatar-edit-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .avatar-edit { position: relative; width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 24px; font-weight: 700; color: var(--accent-contrast); background: linear-gradient(150deg, var(--accent), var(--accent-strong)); }
  .avatar-edit img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .avatar-edit-btn {
    position: absolute; bottom: -2px; right: -2px; width: 28px; height: 28px; border: 2px solid var(--surface);
    border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0;
    color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform var(--dur-fast) ease;
  }
  /* Sichtbar bleibt 28px wie beim Meal-Foto-Button (.rcard .imgadd) - die Trefferflaeche
     wird per Pseudo-Element auf 44x44 erweitert, gleiches hitSlop-Muster wie .btn.icon-gh. */
  .avatar-edit-btn::after { content: ""; position: absolute; inset: -8px; }
  .avatar-edit-btn:hover { transform: scale(1.12); }
  .avatar-edit-btn svg { width: 14px; height: 14px; }

  /* ---------- Profilbild-Zuschnitt (Kreis-Crop) ---------- */
  .crop-stage { position: relative; width: 260px; height: 260px; max-width: 100%; aspect-ratio: 1; margin: 0 auto; overflow: hidden; border-radius: var(--radius-sm); background: var(--surface-2); cursor: grab; touch-action: none; }
  .crop-stage.dragging { cursor: grabbing; }
  .crop-stage img { position: absolute; top: 0; left: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  /* Kreis-Fenster per riesigem box-shadow statt SVG-Maske - dieselbe Abdunklung wie
     .overlay, damit ausserhalb des Kreises sichtbar "verworfen" wirkt. */
  .crop-guide { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 9999px color-mix(in srgb, #0a0c07 55%, transparent); border: 2px solid rgba(255,255,255,.7); box-sizing: border-box; }
  .crop-zoom { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }

  .auth { min-height: calc(100vh - 170px); display: grid; place-items: center; padding: 16px 0 60px; }
  /* Intro-Hero über dem Wochenplan */
  .app-hero { margin: 2px 0 22px; }
  .app-hero .eyebrow { display: inline-block; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .22em; font-size: 12px; font-weight: 600; color: var(--accent-strong); margin-bottom: 8px; }
  .app-hero h2 { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: clamp(30px, 4.4vw, 50px); line-height: .96; letter-spacing: .5px; margin: 0; text-wrap: balance; }
  .app-hero h2 em { color: var(--accent); font-style: normal; }
  .app-hero .hero-sub { color: var(--text-muted); font-size: 15.5px; line-height: 1.5; margin: 12px 0 0; max-width: 60ch; }

  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  /* Segmented control (Geschlecht/Ziel) im Stil der Wochen-Umschalter */
  .seg { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 0; background: transparent; color: var(--text-muted); padding: 9px 8px; border-radius: 999px; white-space: nowrap; transition: color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast); }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong)); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 32%, transparent); }
  .seg .seg-hint { font-weight: 500; font-size: 10.5px; opacity: .82; }
  /* Aktivität als vertikale Knopf-Liste (Label links, Hinweis rechts) */
  /* Trainingstage: sieben Umschalter, Mehrfachauswahl. Bewusst NICHT .seg, obwohl es
     so aussieht — .seg ist eine Einfachauswahl (genau ein .on). Gleiche Optik, aber
     eigene Klasse, damit niemand die Seg-Logik darauf loslaesst. */
  .tdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; }
  .tdays button {
    font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; border: 0;
    background: transparent; color: var(--text-muted); padding: 9px 2px; min-height: 44px;
    border-radius: var(--radius-sm); transition: color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast);
  }
  .tdays button:hover { color: var(--text); }
  /* Im RECHNER ist die Auswahl rot wie jede andere Auswahl im Formular. Das Blau ist der
     Statusfarbe im Wochenplan vorbehalten, wo es einen Tag als Trainingstag markiert —
     hier waere es nur ein zweiter Akzent ohne eigene Bedeutung. */
  .tdays button[aria-pressed="true"] {
    color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .tdays-note { font-size: 11.5px; color: var(--text-muted); margin: 8px 0 15px; line-height: 1.45; }
  .tdays-note b { color: var(--text); font-weight: 600; }
  /* Eine Zeile je Trainingstag: Kuerzel, Stufe, Dauer, Aufschlag.
     Abfragebasis ist die Breite des FELDES, nicht die des Bildschirms — wie bei den
     Makro-Beschriftungen der Tageskarten. Eine Bildschirm-Query war hier nachweislich
     falsch: im zweispaltigen Rechner-Layout ist die Formularspalte auch auf einem
     breiten Monitor schmal, die Zeile lief dann um 67px ueber ihren Container hinaus. */
  #c-tdetail { container-type: inline-size; }
  .trow {
    /* Frueher standen hier pro Zeile zusaetzlich ein Minutenfeld, der Kalorien-Aufschlag
       und ein „auf alle"-Knopf — bei sieben Tagen ein Feld aus Zahlen und roten Flaechen.
       Die Dauer gilt jetzt einmal fuer alle (.tmin darueber), der Aufschlag steht im
       Ergebnis, wo er hingehoert. Bleibt: Tag, Stufe, Beispiel. */
    display: grid; grid-template-columns: 30px 1fr;
    grid-template-areas: "d lv" "def def";
    align-items: center; gap: 8px; row-gap: 6px;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .trow-d { grid-area: d; } .trow-lv { grid-area: lv; }

  /* Eine Dauer fuer alle Einheiten. Steht ueber den Tageszeilen, weil sie fuer alle
     gilt — als Feld IN einer Tageszeile haette sie faelschlich nach „nur dieser Tag"
     ausgesehen. */
  .tmin {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px; margin-bottom: 4px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .tmin label { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .tmin-f { display: flex; align-items: center; gap: 6px; }
  .tmin-f span { font-size: 11.5px; color: var(--text-muted); }
  .tmin-f input {
    width: 66px; text-align: center; padding: 8px 4px; font-size: 16px; /* 16px gegen iOS-Zoom */
    font-variant-numeric: tabular-nums; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  }
  /* Umschalter fuer eine gemeinsame Intensitaetszeile statt einer je Trainingstag -
     bei vielen gewaehlten Tagen sonst zu viele Segmented-Controls auf einer Karte. */
  .tsame {
    display: flex; align-items: center; gap: 9px; min-height: 36px;
    padding: 2px 2px 10px; font-size: 12.5px; font-weight: 600; color: var(--text);
    cursor: pointer;
  }
  .tsame input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .tmin-f input:focus-visible { outline: 2px solid var(--train); outline-offset: 1px; }
  /* Beispiele zur GEWAEHLTEN Stufe. Stehen sichtbar in der Zeile und nicht nur im
     title-Attribut: auf dem Handy gibt es keine Tooltips, dort waeren sie unsichtbar —
     und genau dort wird die App benutzt. */
  .trow-def {
    grid-area: def; font-size: 11px; line-height: 1.45; color: var(--text-muted);
    padding-left: 38px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .trow-def > span { flex: 1; }
  @container (max-width: 379px) { .trow-def { padding-left: 0; } }
  .trow:first-child { border-top: 0; }
  /* Das Tageskuerzel war rot. Es ist aber nur die Beschriftung der Zeile, keine
     Auswahl und keine Warnung — Rot hat hier nichts zu sagen und nahm dem Akzent
     seine Bedeutung. Jetzt normale Textfarbe. */
  .trow-d { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text); }
  /* Die gewaehlte Stufe ist BLAU, nicht rot: Training ist im Wochenplan bereits blau
     (--train, siehe .day.training), und im Rechner stand dafuer bisher Rot — dieselbe
     Sache in zwei Farben. Zugleich war Rot pro Zeile mehrfach vertreten und trug damit
     keine Aussage mehr. Rot bleibt jetzt den Tages-Chips darueber, wo tatsaechlich
     ausgewaehlt wird. Erkennbar bleibt die Stufe an Flaeche UND Text, nie an Farbe
     allein — das Beispiel darunter nennt sie zusaetzlich in Worten. */
  .trow-lv { padding: 2px; gap: 1px; }
  .trow-lv button.on {
    color: var(--train-contrast);
    background: linear-gradient(135deg, var(--train), var(--train-strong));
    box-shadow: 0 2px 8px color-mix(in srgb, var(--train) 32%, transparent);
  }
  /* min-height, damit die Stufen mit dem Daumen zu treffen sind: ohne sie waren die
     Buttons 26px hoch, waehrend die Wochentag-Umschalter direkt darueber 44px haben.
     Bei sieben Trainingstagen stehen 21 dieser Buttons gleichzeitig auf dem Schirm. */
  .trow-lv button { padding: 8px 4px; font-size: 11.5px; min-height: 40px; }
  /* Vorschau je Trainingstag im Ergebnis */
  .tprev { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; }
  .tprev + .tprev { border-top: 1px dashed var(--border); }
  .tprev-d { font-size: 12px; font-weight: 700; color: var(--text); }
  .tprev-d span { font-weight: 400; color: var(--text-muted); margin-left: 6px; font-size: 11px; }
  .tprev-v { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tprev-v b { color: var(--text); font-size: 13px; }
  .tprev-v span { margin-left: 8px; }
  /* Ruhetag-Werte im Ergebnis: zweite Makro-Zeile, klar als Ableitung erkennbar. */
  .rest-macros { border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 12px; }
  .rest-macros .rm-h { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 8px; }
  .rest-macros .rm-h svg { width: 13px; height: 13px; flex: none; color: var(--accent-strong); }

  .seg-col { flex-direction: column; gap: 3px; border-radius: var(--radius-sm); padding: 4px; }
  .seg-col button { flex-direction: row; justify-content: space-between; align-items: center; border-radius: var(--radius-sm); padding: 11px 14px; }
  .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .calc-note { max-width: var(--maxw); font-size: 12px; line-height: 1.55; color: var(--text-muted); margin: 20px 0 0; padding-top: 6px; border-top: 1px solid var(--border); }
  .calc-note > summary {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    min-height: 44px; /* Tippflaeche */
    list-style: none; font-size: 12px;
  }
  .calc-note > summary::-webkit-details-marker { display: none; }
  .calc-note > summary:hover { color: var(--text); }
  .calc-note .ci { width: 15px; height: 15px; flex: none; color: var(--accent); }
  .calc-note .caret { width: 14px; height: 14px; flex: none; margin-left: auto; transition: transform var(--dur-fast) ease; }
  .calc-note[open] .caret { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .calc-note .caret { transition: none; } }
  .calc-note .cn-body { padding: 0 0 12px 24px; }
  .calc-note strong { color: var(--text); font-weight: 600; }
  .breakdown { margin-top: 18px; text-align: left; }
  .bd-row { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; padding: 8px 2px; border-top: 1px solid var(--border); color: var(--text-muted); }
  .bd-row span:last-child { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bd-row.bd-mid { color: var(--text); font-weight: 600; }
  .bd-row.bd-mid span:last-child { font-weight: 700; }
  .auth-card { width: 100%; max-width: 430px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 34px 30px 26px; text-align: center; }
  .auth-card .mark { width: 116px; height: 116px; border-radius: 50%; margin: 0 auto 20px; overflow: hidden; background: center / cover no-repeat var(--logo); }
  .auth-card h2 { font-family: var(--font-display); font-size: 25px; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
  .auth-card .lead { color: var(--text-muted); font-size: 14.5px; margin: 0 0 22px; line-height: 1.5; text-wrap: balance; }
  .auth-card .field { text-align: left; }
  .auth-card .btn.primary { width: 100%; justify-content: center; padding: 12px; font-size: 15px; margin-top: 4px; }
  .auth-switch { margin: 14px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .auth-note { font-size: 12px; color: var(--text-muted); margin: 16px 0 0; line-height: 1.5; display: flex; gap: 8px; align-items: flex-start; text-align: left; border-top: 1px solid var(--border); padding-top: 14px; }
  .auth-note svg { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--accent); }
  .auth-card .field + .field { margin-top: 10px; }
  .auth-err { color: var(--danger); font-size: 12.5px; margin: 12px 0 0; text-align: left; line-height: 1.45; min-height: 0; }
  .auth-forgot { display: block; text-align: right; font-size: 12px; color: var(--accent-strong); background: 0; border: 0; cursor: pointer; margin: 8px 0 0; padding: 0; }
  .auth-forgot:hover { text-decoration: underline; }
  .auth-or { display: flex; align-items: center; gap: 12px; margin: 18px 0 16px; color: var(--text-muted); font-size: 12px; }
  .auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .btn.social { width: 100%; justify-content: center; gap: 10px; padding: 11px; font-size: 14.5px; font-weight: 550; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); }
  .btn.social:hover { border-color: var(--accent); background: var(--surface); }
  .btn.social + .btn.social { margin-top: 9px; }
  .btn.social svg, .btn.social img { width: 18px; height: 18px; flex: none; }
  .btn.social.apple { background: #000; border-color: #000; color: #fff; }
  .btn.social.apple:hover { background: #111; border-color: #111; }
  .verify-icon { width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-strong); }
  .verify-icon svg { width: 30px; height: 30px; }
  .auth-mail { font-weight: 650; color: var(--text); word-break: break-all; }
  .auth-busy { opacity: .6; pointer-events: none; }

  .segbar { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .segbar button { flex: 1; font: inherit; font-size: 13.5px; font-weight: 550; cursor: pointer; border: 0; background: transparent; color: var(--text-muted); padding: 8px; border-radius: 7px; }
  .segbar button[aria-selected="true"] { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow); }
  .share-hint { font-size: 13px; color: var(--text-muted); line-height: 1.55; margin: 0 0 12px; }
  .share-hint em { color: var(--text); font-style: normal; font-weight: 550; }
  .share-code { width: 100%; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; line-height: 1.4; min-height: 92px; resize: vertical; word-break: break-all; }
  .share-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .share-sub { display: block; font-size: 12px; font-weight: 650; letter-spacing: .01em; margin: 2px 0 6px; }
  .link-row { display: flex; gap: 8px; }
  .share-link { flex: 1; font-size: 12.5px; }
  .share-mini { font-size: 12px; color: var(--text-muted); margin: 9px 0 0; line-height: 1.5; }
  .share-mini.warn { color: var(--danger); }
  .share-more { margin-top: 16px; }
  .share-more summary { cursor: pointer; font-size: 13px; font-weight: 550; color: var(--accent-strong); }
  .share-more summary:hover { text-decoration: underline; }
  .share-more .share-code { margin-top: 10px; }

  @media (max-width: 560px) { .profile-btn .pname { display: none; } }

  /* ---------- PDF / Druck ---------- */
  #print-area { display: none; }
  #print-area .pt-doc { font-family: var(--font-body); color: #1a1a1a; }
  /* Feste Hex-Werte statt --accent: Diese Ansicht ist fuers Papier gedacht (siehe #1a1a1a/
     #666 daneben) und darf nicht das grelle Dark-Theme-Neonrot uebernehmen, falls gerade
     das dunkle Theme aktiv ist. */
  #print-area .pt-head { border-bottom: 3px solid #DC2626; padding-bottom: 12px; margin-bottom: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  #print-area h1 { font-family: var(--font-display); font-size: 30px; font-weight: 600; margin: 0; color: #1a1a1a; }
  #print-area .pt-meta { color: #666; font-size: 13px; text-align: right; }
  #print-area .pt-table { width: 100%; border-collapse: collapse; }
  #print-area .pt-table th, #print-area .pt-table td { border: 1px solid #cfcfc7; padding: 11px 13px; text-align: left; font-size: 13px; vertical-align: top; }
  /* Kopfzeile war frueher gruen (#eef3ec/#2A5A3B) - ein Rest aus der Zeit vor der
     Rot-Umstellung der App. Jetzt Rot passend zur Marke, gemessen 6,09:1 (vorher 7,11:1),
     beides ueber der 4,5:1-Schwelle fuer Normaltext. */
  #print-area .pt-table thead th { background: #FBE9E9; color: #B01218; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #print-area .pt-table tbody th { background: #f6f6f1; font-weight: 600; width: 96px; font-size: 14px; }
  #print-area .pt-empty { color: #bcbcbc; }
  #print-area .pt-foot { margin-top: 18px; color: #999; font-size: 11px; text-align: right; }

  @media print {
    html, body { background: #fff !important; }
    .app, #modal-root, #toast { display: none !important; }
    #print-area { display: block !important; padding: 8px; }
    @page { margin: 16mm; }
  }

  /* Weniger statt null: Bewegung (Transform/Keyframes) aus, aber Opacity-Ueberblendungen
     bleiben, weil sie Zustandswechsel (Modal/Toast/Onboarding) verstehbar halten. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    .modal, #toast, .onb-stage, .onb-opt, .onb-bf-o { transition: opacity var(--dur-fast) ease !important; transform: none !important; animation: none !important; }
    * { transition-property: opacity, color, background-color, border-color, box-shadow !important; }
  }
  /* ---------- Mobile / Smartphone ---------- */
  @media (max-width: 720px) {
    .head-inner { gap: 10px 12px; padding: 11px 0; }
    .brand h1 { font-size: 19px; }
  }
  /* Nur das schmale Band zwischen Handy-Balken (bis 680) und voller Breite: hier bleibt
     die Leiste im Kopf und darf scrollen. Bewusst mit min-width abgegrenzt — ohne das
     ueberschriebe dieser Block das Innenmass des unteren Balkens. */
  @media (min-width: 681px) and (max-width: 720px) {
    .tabs { width: 100%; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: none; white-space: nowrap; padding: 9px 12px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 14px; }
    main { padding: 20px 0 64px; }
    /* Auf sehr schmalen Geraeten etwas naeher an den Rand — sonst wird die Kapsel innen eng. */
    .tabs { left: 10px; right: 10px; }
    .row2 { grid-template-columns: 1fr; }
    /* Drei Kennzahlen nebeneinander werden auf schmalen Geraeten eng - etwas kleinere
       Zahlen und weniger Abstand halten sie in einer Zeile, statt sie umbrechen zu lassen. */
    .wch-stats { gap: 12px; }
    .wch-s b { font-size: 18px; }
    /* Ausnahme: die vier Makro-Werte sind kurze Zahlen. Einspaltig waere die Summe
       viermal so hoch wie noetig, vierspaltig brechen die Beschriftungen um und die
       Felder stehen versetzt. Deshalb 2x2: aussen eine Spalte, innen zwei. */
    .nut-total > .row2 { grid-template-columns: 1fr; gap: 10px; }
    .nut-total .row2 .row2 { grid-template-columns: 1fr 1fr; gap: 10px; }
    .nut-total .field > label.hint { font-size: 10.5px; }
    /* Ohne diese Regel wickelt .wg-macros Protein+Kohlenhydrate in eine Zeile und
       Fett allein in die naechste (flex-wrap trifft bei ~340-400px Breite genau diesen
       ungleichen Schnitt) - auf dem Handy sieht das schief aus. Erzwingt stattdessen
       immer einen Balken pro Zeile, wie es die schmale .wg-col-macros-Spalte ohnehin
       schon macht. Betrifft sowohl die Tageskarten im Wochenplan als auch "Deine Ziele".
       flex:0 0 auto ist zwingend noetig (siehe Kommentar bei .wg-col-macros): die
       150px-Basis von .wg-macros .gm ist fuer Reihen (Breite) gedacht, in Spalten
       wuerde sie sonst zur Hoehe und riesige Abstaende erzeugen. */
    .wg-macros { flex-direction: column; }
    .wg-macros .gm { flex: 0 0 auto; }
    .brand p { display: none; }
    .brand .mark { width: 38px; height: 38px; }
    .section-head { margin-bottom: 18px; }
    .section-head h2 { font-size: 22px; }
    .section-head .btn { flex: 1; justify-content: center; }
    /* Die Icon-Knoepfe (Woche teilen/leeren) bleiben quadratisch neben den Tabs -
       ohne diese Ausnahme wuerden sie durch die Regel darueber in die Breite gezogen. */
    .plan-tools .icon-gh { flex: none; }
    .week { gap: 12px; }
    .recipes { gap: 12px; }
    .imgfield { flex-direction: column; align-items: stretch; }
    .imgprev { width: 100%; }
    /* Zutaten: Name volle Breite, Menge + Buttons in zweiter Zeile */
    .ing-top { flex-wrap: wrap; }
    .ing-nrow { flex: 1 0 100%; }
    /* Auf sehr schmalen Geraeten (320 px) passen die vier Makro-Kuerzel nicht mehr neben
       "Makros · je 100 g" - sie brechen dann rechtsbuendig in eine zweite Zeile, was dank
       der 44 px Mindesthoehe von .ing-nsum keine zusaetzliche Hoehe kostet. Nur etwas
       enger, NICHT kleiner: Zahlen, die man pruefen soll, bleiben lesbar. */
    .ing-brief { font-size: 11px; gap: 8px; }
    .ing-gwrap { flex: 1; width: auto; }
    .ing-ic { width: 44px; height: 44px; }
    .ing-barcode { height: 44px; padding: 0 13px; } /* Touch-Ziel */
    .ing-nut input { padding: 8px 4px; }
    .ing-ac-item { min-height: 44px; } /* Touch-Ziel */
    .auth-card { padding: 26px 20px 22px; }
    /* min-height gehoert hierher, nicht dem Zufall ueberlassen: Die Fuss-Buttons kamen
       bisher nur deshalb ueber 44px, weil ihr Text auf schmalen Geraeten umbrach. Sobald
       einer mehr Platz hat und einzeilig bleibt (z. B. im 2x2-Raster unten), faellt er
       sonst auf 39px - gemessen bei 320-414px. */
    .modal-foot .btn { flex: 1; justify-content: center; min-height: 44px; }
    /* Die Meal-Detailansicht hat vier Fuss-Buttons: mit reinem "flex:1" passen drei
       schmale (Bearbeiten/Teilen/Loeschen) noch in eine Zeile, nur "Schliessen" faellt
       allein und ueber die volle Breite gestreckt in die naechste - wirkt schief.
       Feste 50%-Basis erzwingt ein sauberes 2x2-Raster unabhaengig von der Textlaenge. */
    .modal.detail .modal-foot .btn { flex: 1 1 calc(50% - 4px); }
    .foot-inner { flex-direction: column; gap: 8px; text-align: center; }
    /* iOS zoomt Eingabefelder < 16px beim Fokus – das verhindern wir */
    input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="search"], select, textarea { font-size: 16px; }
  }

  /* ---------- Handy: Wochenplan und Wochenziele werden gewischt ----------
     Untereinander ergaben die sieben Tageskarten auf dem Handy ein Band von weit
     ueber 3.000 px Hoehe – Donnerstag erreichte man nur durch langes Scrollen, und
     nach jedem Einplanen begann die Reise von vorn. Quer liegt jeder Tag auf einer
     eigenen Bildschirmbreite und wird seitlich gewischt.
     Die Knopfleiste darueber ist zweierlei zugleich: Anzeige, auf welcher Karte man
     steht (ein Karussell ohne Anzeige verraet nicht, dass es weitergeht), und
     Sprungziel. Deshalb 44 px hoch – sie ist Bedienelement, keine Dekoration.
     Die beiden Leisten stehen ausserhalb der Handy-Abfrage auf display:none; im
     Markup sind sie immer da, damit renderPlan() nicht zwei Faelle kennen muss. */
  .daybar, .wgbar { display: none; }

  @media (max-width: 680px) {
    .daybar {
      display: flex; gap: 4px;
      position: sticky; top: var(--head-h, 70px); z-index: 20;
      margin: 0 0 10px; padding: 6px 0;
      /* Deckend und BEWUSST ohne backdrop-filter: die Leiste klebt genau ueber dem
         Streifen, der beim Scrollen in Bewegung ist. Ein Weichzeichner muesste den
         Hintergrund dann in jedem Bild neu rechnen – auf dem Handy die haeufigste
         Ursache fuer ruckelndes Scrollen. Der Kopf darueber hat bereits einen;
         ein zweiter, gestapelter kostet doppelt und bringt hier nichts, weil
         darunter ohnehin nur --bg liegt. */
      background: var(--bg);
      box-shadow: 0 6px 12px -8px rgba(0, 0, 0, .45);
    }
    .db-b {
      flex: 1 1 0; min-width: 0; min-height: 44px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font: inherit; font-family: var(--font-display); font-size: 13px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
      color: var(--text-muted); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      transition: color var(--dur-fast), background var(--dur-fast), border-color var(--dur-fast);
    }
    /* „Heute" ist im Streifen bewusst nur ein Punkt: die Aussage steht ohnehin als
       Wort im Kopf der Tageskarte, hier ist sie Wiederholung zur Orientierung. */
    .db-b .db-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0; }
    .db-b.is-today { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .db-b.is-today .db-dot { opacity: 1; }
    .db-b.active {
      color: var(--accent-contrast); border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 34%, transparent);
    }

    .week {
      display: flex; gap: 12px;
      scroll-snap-type: x mandatory;
      /* Der Wisch darf nicht die Seite darunter mitziehen (Zurueck-Geste, Neuladen). */
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      /* Waagerecht scrollen heisst zwangslaeufig auch: senkrechter Scrollbehaelter.
         overflow-y: clip waere die Ausnahme, aber die Spezifikation rechnet clip
         neben overflow-x: auto zu hidden zurueck – im Pruefstand gemessen, nicht
         vermutet. Folge: eine klebende Kopfzeile INNERHALB einer Tageskarte kann es
         hier nicht geben, sie richtete sich an .week statt am Bildschirm aus und
         bliebe einfach stehen. Den Wochentag fixiert deshalb die Tagesleiste
         darueber – die haengt am Bildschirm und klebt zuverlaessig.
         Geklemmt wird nichts: .week ist so hoch wie die hoechste Karte. */
      overflow-x: auto; overflow-y: hidden;
    }
    .week::-webkit-scrollbar { display: none; }
    /* flex-start statt des voreingestellten stretch: sonst wird JEDE Tageskarte so
       hoch wie die hoechste der Woche, und ein leerer Tag bekommt unter "Abendessen"
       die Leerflaeche des vollsten Tages geschenkt. Die passende Hoehe des Streifens
       setzt fitHeight() nach, sonst bliebe die Luecke nur ausserhalb der Karte. */
    .week { align-items: flex-start; }
    .week > .day { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
    /* Auf dem Handy gibt es kein echtes Hover – beim Wischen setzt der Browser den
       Zustand trotzdem auf die beruehrte Karte. Sie bliebe dann angehoben stehen,
       und der weiche Schatten wuerde mitten im Scrollen ueber eine Uebergangszeit
       neu gezeichnet: grosse Weichzeichnungsflaeche, jedes Bild neu – genau die
       Art Arbeit, die das Scrollen stocken laesst. Hier also komplett aus. */
    .week > .day:hover {
      transform: none;
      border-color: var(--border);
      box-shadow: var(--shadow);
    }
    .week > .day.today:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .week > .day.training:hover { border-color: color-mix(in srgb, var(--train) 55%, var(--border)); }
    .week > .day { transition: none; }

    /* Ziele der Woche: gleiches Muster mit zwei Karten (Heute / Diese Woche). */
    .wgbar { display: flex; gap: 6px; margin: 0 0 10px; }
    .wg-b {
      flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 10px;
      font: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-muted); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      transition: color var(--dur-fast), background var(--dur-fast), border-color var(--dur-fast);
    }
    .wg-b.active {
      color: var(--accent-contrast); border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    }
    .wg-cols {
      flex-direction: row; gap: 12px;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
      scrollbar-width: none;
      /* Gegenteil von .week: hier SOLLEN beide Karten (Heute/Woche) gleich hoch wirken.
         fitHeight() (initCarousel) setzt schon die Scroller-Hoehe aufs Maximum beider Karten -
         ohne stretch behielt die kuerzere .wg-col trotzdem ihre eigene, kleinere Innenhoehe. */
      align-items: stretch;
    }
    .wg-cols::-webkit-scrollbar { display: none; }
    .wg-cols > .wg-col { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }

    /* "Ziele neu berechnen" wird hier zur flachen Aktionsflaeche ueber die volle Breite, in
       derselben Optik wie die Zielkarten (.wg-col) - so gehoert der Knopf sichtbar zum
       Ziele-Bereich, statt als schwebender Textlink darunter zu haengen. 44px, weil er das
       einzige Bedienelement unter dem Streifen ist. Die Hover-Zeile muss sein: .btn.ghost:hover
       ist eine Klasse spezifischer und wuerde die Flaeche sonst beim Beruehren wieder leeren. */
    .wg-actions { margin-top: 12px; }
    .wg-actions .wg-recalc {
      flex: 1 1 auto; justify-content: center; min-height: 44px;
      background: var(--surface-2); border-color: var(--border); color: var(--text);
    }
    .wg-actions .wg-recalc:hover { background: var(--surface-2); border-color: var(--accent); }
  }

  /* ---------- Erste Schritte (Onboarding) ----------
     Eine Frage je Bildschirm. Waehrend der Einfuehrung ist die Reiterleiste weg, damit auf
     dem Handy kein zweites Bedienelement um den unteren Rand konkurriert. Ohne gesetztes Ziel
     ist der Ablauf bewusst nicht verlassbar (Schliessen erscheint erst, wenn ein Ziel
     existiert). syncStickyOffsets() setzt
     --tabbar-h dann von selbst auf 0, weil die ausgeblendete Leiste 0 hoch ist.
     Alle Farben kommen aus den Tokens, damit Light und Dark ohne eigenen Block tragen. */
  .app.onboarding .tabs { display: none; }
  .onb { max-width: 560px; margin: 0 auto; }

  /* Fortschritt: schlanke Schiene mit Glut am Ende statt eines dicken Balkens. Das Glimmen
     ist derselbe Akzent, nur als Schein – es macht den Fortschritt spuerbar, ohne eine
     zweite Farbe einzufuehren. */
  .onb-top { margin-bottom: 24px; }
  .onb-top .wg-progress-bar { height: 6px; }
  .onb-top .wg-progress-bar > span { box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent); }
  .onb-count {
    margin-top: 9px; font-family: var(--font-display); font-size: 12px; color: var(--text-muted);
    letter-spacing: .14em; text-transform: uppercase;
  }
  /* Expo-out: startet schnell, laeuft weich aus – dieselbe Kurve wie bei den Karten der App. */
  .onb-stage { animation: onbin .26s cubic-bezier(.16, 1, .3, 1); }
  @keyframes onbin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .onb-q {
    display: block; font-family: var(--font-display); font-size: 30px; line-height: 1.08;
    letter-spacing: -.005em; margin: 0 0 9px; color: var(--text); text-wrap: balance;
  }
  .onb-kicker {
    margin: 0 0 6px; font-family: var(--font-display); font-size: 13px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent);
  }
  /* Der Fokus wandert beim Schrittwechsel programmatisch auf die Frage, damit ein
     Screenreader sie vorliest. Sichtbar soll er dort NICHT sein: das Element traegt
     tabindex="-1" und ist per Tastatur nie anwaehlbar – ein Rahmen um die Ueberschrift
     sieht aus wie ein Eingabefeld. */
  .onb-q:focus { outline: none; }
  .onb-why { margin: 0 0 20px; color: var(--text-muted); font-size: 14.5px; line-height: 1.55; }
  .onb-why b { color: var(--text); }
  .onb-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  /* Akzentkante links: macht aus einer Aufzaehlung eine Liste mit Richtung. */
  .onb-list li {
    padding: 13px 15px; border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm); background: var(--surface-2);
    font-size: 14px; line-height: 1.5; color: var(--text-muted);
  }
  .onb-list li b { color: var(--text); font-weight: 650; }

  /* Hinweis bei starkem Defizit auf dem Ergebnis. Bewusst KEIN roter Alarmkasten:
     --danger ist in diesem Theme auf --accent gelegt, ein roter Kasten ginge zwischen
     den ohnehin roten Elementen unter — und die Marke hilft, sie bewertet nicht. Also
     dieselbe ruhige Kante wie .onb-list li, nur mit Info-Zeichen davor. */
  .onb-warn {
    display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0;
    padding: 12px 14px; border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm); background: var(--surface-2);
    font-size: 13px; line-height: 1.5; color: var(--text-muted);
  }
  .onb-warn .ci { flex: none; width: 16px; height: 16px; margin-top: 1px; color: var(--accent); }
  .onb-warn b { color: var(--text); font-weight: 650; }

  /* Auswahlkacheln. Die Auswahl haengt nie allein an der Farbe – das Haekchen traegt sie
     mit (sonst waere sie fuer Farbfehlsichtige nicht erkennbar). */
  .onb-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .onb-opts-1 { grid-template-columns: 1fr; }
  /* Kacheln mit etwas Tiefe: leichter Verlauf statt einer flachen Flaeche, eine helle
     Kante oben (Licht von oben) und beim Druecken ein Nachgeben. Gewaehlt heisst: Akzent-
     Kante plus warmer Schein – die Tiefe macht den Unterschied, nicht eine neue Farbe. */
  .onb-opt {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: 3px;
    min-height: 68px; padding: 15px 46px 15px 17px; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    color: var(--text); border: 1.5px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 7%, transparent);
    font: inherit; transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
    opacity: 0; transform: translateY(6px); animation: onbin var(--dur-slow) var(--ease-out) forwards;
  }
  .onb-opt:nth-child(1) { animation-delay: 0ms; }
  .onb-opt:nth-child(2) { animation-delay: 40ms; }
  .onb-opt:nth-child(3) { animation-delay: 80ms; }
  .onb-opt:nth-child(4) { animation-delay: 120ms; }
  .onb-opt:nth-child(n+5) { animation-delay: 160ms; }
  .onb-opt:hover { border-color: var(--text-muted); }
  .onb-opt:active { transform: scale(.985); }
  .onb-opt.on {
    border-color: var(--accent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--surface)), var(--surface));
    box-shadow: 0 0 0 1px var(--accent), 0 6px 20px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .onb-opt:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 34%, transparent); }
  .onb-opt-t { font-weight: 650; font-size: 16px; letter-spacing: .005em; }
  .onb-opt-h { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; }
  .onb-tick { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); width: 21px; height: 21px; color: var(--accent); }

  /* Zahlenfelder. Frueher stand eines gross und allein auf seinem Bildschirm; jetzt
     stehen drei nebeneinander (Alter/Groesse/Gewicht), also kleiner gesetzt und jedes
     mit eigener Beschriftung – die Ueberschrift traegt die Bedeutung nicht mehr allein.
     Die Einheit steht neben dem Feld, damit darin nur die Zahl steht (sonst stolpert die
     Tastatur darueber). */
  .onb-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; }
  .onb-grid-1 { grid-template-columns: 1fr; max-width: 250px; }
  .onb-f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .onb-f-l { font-size: 12.5px; font-weight: 650; color: var(--text-muted); letter-spacing: .01em; }
  .onb-f-opt { font-weight: 500; opacity: .75; }
  .onb-f-in { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  /* Zwei Klassen, nicht eine: die globale Regel fuer Eingabefelder trifft ueber
     input[type="number"] und liegt damit (Attributselektor!) ueber einer einzelnen
     Klasse – Breite und Schriftgroesse waeren sonst still ueberstimmt worden. */
  .onb-f-in .onb-num {
    width: 100%; min-width: 0; text-align: center; font-family: var(--font-display);
    font-size: 24px; padding: 10px 6px; letter-spacing: .02em;
    -moz-appearance: textfield;
  }
  .onb-num::-webkit-outer-spin-button, .onb-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .onb-f-u { flex: none; font-size: 13px; color: var(--text-muted); font-weight: 600; }

  /* Zweite Frage auf demselben Bildschirm (Tempo unter dem Ziel, Haerte unter den
     Trainingstagen). Eine feine Linie trennt sie, statt sie nur tiefer zu setzen. */
  .onb-sub { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  /* Farbe ausdruecklich, nicht geerbt: die Textfarbe haengt sonst an .app weit oben im
     Baum – eine Ueberschrift soll nicht davon abhaengen, wo sie eingehaengt wird. */
  .onb-sub-q { font-family: var(--font-display); font-size: 17px; font-weight: 650; letter-spacing: .01em; color: var(--text); margin: 0 0 10px; }

  /* Koerperfett: 2x2, damit alle vier Skizzen gleichzeitig zu sehen und damit
     vergleichbar sind – untereinander ginge genau der Vergleich verloren, auf den die
     Auswahl hinauslaeuft. Bleibt deshalb auch auf dem Handy zweispaltig. */
  .onb-bf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .onb-bf-o {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 12px 10px 11px; cursor: pointer; font: inherit; text-align: center;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    color: var(--text-muted); border: 1.5px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 7%, transparent);
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast), color var(--dur-fast);
    opacity: 0; transform: translateY(6px); animation: onbin var(--dur-slow) var(--ease-out) forwards;
  }
  .onb-bf-o:nth-child(1) { animation-delay: 0ms; }
  .onb-bf-o:nth-child(2) { animation-delay: 40ms; }
  .onb-bf-o:nth-child(3) { animation-delay: 80ms; }
  .onb-bf-o:nth-child(4) { animation-delay: 120ms; }
  .onb-bf-o:hover { border-color: var(--text-muted); }
  .onb-bf-o:active { transform: scale(.985); }
  .onb-bf-o.on {
    border-color: var(--accent); color: var(--accent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--surface)), var(--surface));
    box-shadow: 0 0 0 1px var(--accent), 0 6px 20px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .onb-bf-o:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 34%, transparent); }
  /* Die Skizze erbt ueber currentColor die Farbe der Kachel – hell/dunkel und der
     gewaehlte Zustand stimmen damit ohne eine einzige eigene Regel. */
  .onb-bf-fig { flex: none; width: 48px; height: 66px; margin-bottom: 2px; }
  /* Die Spanne traegt die Kachel: Wer seinen Wert kennt, sucht genau danach und soll ihn
     nicht aus dem Kleingedruckten fischen muessen. Ziffernbreite fest, damit die vier
     Zahlen untereinander fluchten. */
  .onb-bf-p {
    font-family: var(--font-display); font-size: 16px; font-weight: 700;
    color: var(--text); letter-spacing: .02em; font-variant-numeric: tabular-nums;
  }
  .onb-bf-t { font-size: 13px; font-weight: 650; color: var(--text); }
  .onb-bf-h { font-size: 11px; line-height: 1.3; color: var(--text-muted); }
  /* Das Haekchen sitzt hier oben in der Ecke, nicht mittig rechts wie auf einer
     Textkachel – in der Mitte laege es sonst auf der Zeichnung. */
  .onb-bf-o .onb-tick { top: 9px; right: 9px; transform: none; width: 17px; height: 17px; }
  .onb-bf-skip { width: 100%; margin-top: 11px; justify-content: center; }
  .onb-bf-skip.on { color: var(--accent); border-color: var(--accent); }

  /* Textfeld (Name) – zwei Klassen aus demselben Grund wie beim Zahlenfeld: die globale
     Regel trifft ueber input[type="text"] und liegt damit ueber einer einzelnen Klasse. */
  .onb-stage .onb-text { width: 100%; font-size: 17px; padding: 13px 14px; }

  /* Trainingstage: Mehrfachauswahl. .tdays bringt das Raster schon mit, hier nur die
     Groesse fuer den Einstieg – sieben Knoepfe muessen auf 320 px Breite passen. */
  .onb-tdays { margin-top: 4px; }
  .onb-tdays button { min-height: 52px; font-size: 14px; }
  /* Die frueher darunter stehende Zeile "Montag, Mittwoch, Freitag" (.onb-sel) ist
     entfallen: Die hervorgehobenen Knoepfe sagen dasselbe schon. */

  /* Ergebniskarte: der Moment, auf den der ganze Ablauf hinarbeitet. Deshalb ein Hauch
     Buehne – ein Akzentschimmer von oben hinter der Zahl, sonst nichts Zusaetzliches. */
  .onb-res {
    position: relative; overflow: hidden;
    border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
    box-shadow: var(--shadow); padding: 26px 18px 22px; text-align: center;
  }
  .onb-res::before {
    content: ""; position: absolute; inset: -60% 0 auto 0; height: 150px; pointer-events: none;
    background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%);
  }
  .onb-res-k {
    position: relative; font-family: var(--font-display); font-size: 58px; line-height: .95;
    letter-spacing: -.02em; color: var(--accent); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 34px color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .onb-res-k span {
    display: block; margin-top: 9px; font-family: var(--font-display); font-size: 12px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); text-shadow: none;
  }
  .onb-res-m { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .onb-res-m > div + div { border-left: 1px solid var(--border); }
  /* Dieselben Makrofarben wie ueberall sonst in der App (.macro, .nutfacts, .wg-macros) –
     bewusst dieselben Tokens, nicht neu erfunden, damit Protein/KH/Fett app-weit auf
     einen Blick zuzuordnen sind. Die Farbe ist dabei die schnellere, nicht die einzige
     Spur: Das Label darunter nennt das Makro immer aus (siehe Token-Kommentar oben).
     Einzige Stelle der App, an der eine Makro-Farbe als Schriftfarbe dient — deshalb
     haengt an ihr die 3:1-Schwelle fuer grosse Schrift (21px/19px fett). */
  .onb-res-m .t-prot { --tc: var(--prot); } .onb-res-m .t-carb { --tc: var(--carb); } .onb-res-m .t-fat { --tc: var(--fat); }
  .onb-res-m b { display: block; font-family: var(--font-display); font-size: 21px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--tc, var(--text)); }
  .onb-res-m span { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .onb-res-m span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--tc, var(--accent)); }
  .onb-res-t {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 18px; padding: 12px 14px; border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--train) 12%, transparent);
    text-align: left; font-size: 12.5px; color: var(--text-muted); line-height: 1.35;
  }
  .onb-res-t b { font-family: var(--font-display); font-size: 20px; color: var(--train); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .onb-hi { text-align: center; }
  .onb-hi .onb-q { font-size: 34px; }
  .onb-hi .onb-list { text-align: left; margin-top: 22px; }
  /* Das Logo mit einem Schein dahinter statt nackt auf der Flaeche – gibt der Startseite
     einen Mittelpunkt, ohne ein zusaetzliches Bild zu brauchen. */
  .onb-mark {
    position: relative; width: 88px; height: 88px; border-radius: 50%; margin: 6px auto 20px;
    background: center / cover no-repeat var(--logo);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 10%, transparent),
                0 10px 34px color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .onb-note { margin-top: 18px; }

  /* Die Miniatur des Wochenplans (.onb-mock) sass auf dem eigenen Schritt "how" nach dem
     Ergebnis. Der Schritt ist entfallen – zwei reine Textbildschirme nach dem Ergebnis
     liessen den Hoehepunkt verpuffen –, damit auch seine Regeln. */

  .onb-foot { margin-top: 28px; }
  .onb-foot .onb-next {
    width: 100%; justify-content: center; min-height: 52px;
    font-family: var(--font-display); font-size: 18px; letter-spacing: .04em;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .onb-foot .onb-next.is-off { box-shadow: none; }
  .onb-foot2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .onb-foot2 .btn { min-height: 44px; }

  /* Einstellungen-Dialog: Zeilenliste im Modal. */
  .setlist { display: grid; gap: 9px; }
  .setrow {
    display: flex; align-items: center; width: 100%; text-align: left; cursor: pointer;
    padding: 13px 15px; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm); font: inherit;
  }
  .setrow:hover { border-color: var(--border-strong); }
  .setrow:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent); }
  .setrow b { display: block; font-size: 14.5px; font-weight: 650; }
  .setrow small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--text-muted); }
  /* Zeile mit Direktauswahl statt Sprungziel (Erscheinungsbild) — gleiche Huelle wie
     .setrow, aber kein Knopf: die Auswahl steckt im .seg darunter. */
  .setpick { padding: 13px 15px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .setpick > b { display: block; font-size: 14.5px; font-weight: 650; margin-bottom: 9px; }
  /* Die Knoepfe im Rechner sind zweizeilig (Label + Hinweis) und dadurch von selbst
     hoch genug. Hier steht nur ein Wort, das ergaebe knapp 35 px — zu wenig zum
     Treffen mit dem Daumen. Deshalb hier die 44 px erzwingen, nicht global in .seg. */
  .setpick .seg button { min-height: 44px; }

  /* ---------- Gemeinsam planen (Gruppe) ---------- */
  /* Eine Zeile je Mitglied, gleiche Huelle wie .setrow - die Liste soll wie die uebrigen
     Einstellungen lesen, nicht wie eine Nutzerverwaltung. */
  .grp-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .grp-m { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .grp-m .avatar { width: 34px; height: 34px; font-size: 13px; }
  /* Basis 140px statt 0: mit `flex: 1` bekaeme der Name nur den REST, und die Rollenwahl
     daneben quetschte ihn auf ein paar Pixel ("Anna Beispiel" wurde zu "M…"). Reicht der
     Platz trotzdem nicht, bricht die Zeile um (flex-wrap oben) statt abzuschneiden. */
  .grp-m .who { flex: 1 1 120px; min-width: 0; }
  .grp-m .who b { display: block; font-size: 14px; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp-m .who small { display: block; font-size: 12px; color: var(--text-muted); }
  /* Rollenwahl je Mitglied. Nur der Inhaber sieht sie; fuer alle anderen steht die Rolle
     als reiner Text in .who small - ein ausgegrautes Bedienelement waere nur Rauschen.
     Eigene Zeile unter dem Namen, eingerueckt um 46px (Avatar 34 + gap 12), damit sie
     buendig darunter beginnt: neben dem Namen passte sie bei 390px nicht mehr mit dem
     Entfernen-Knopf zusammen, und der rutschte dann allein in die zweite Zeile. */
  .grp-m select { flex: 0 0 calc(100% - 46px); margin-left: 46px; width: auto; font: inherit; font-size: 13px; min-height: 44px; padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .grp-m .btn.icon-gh { flex: none; }
  /* Der rechtliche Hinweis beim Gruppenstart gehoert hinter ein <details>: er ist Pflicht,
     aber keine Information, die im Regelfall gebraucht wird. */
  .grp-note { margin: 12px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .grp-note summary { cursor: pointer; font-weight: 600; color: var(--text); }
  .grp-note p { margin: 8px 0 0; line-height: 1.55; }

  @media (max-width: 560px) {
    /* Zwei Kacheln nebeneinander werden hier zu schmal fuer die Beschriftung. */
    .onb-opts { grid-template-columns: 1fr; }
    /* Ausnahme: "Weiblich"/"Männlich" ist kurz genug und steht auf dem Koerperdaten-
       Bildschirm ueber drei Feldern – untereinander waere der Bildschirm zu hoch. */
    .onb-opts-2 { grid-template-columns: 1fr 1fr; }
    .onb-q { font-size: 26px; }
    .onb-hi .onb-q { font-size: 29px; }
    /* Drei Felder nebeneinander auf schmalem Schirm: Schrift und Innenabstand zurueck,
       damit dreistellige Werte nicht abgeschnitten werden. */
    .onb-grid { gap: 7px; }
    .onb-f-in { gap: 4px; }
    .onb-f-in .onb-num { font-size: 20px; padding: 10px 3px; }
    .onb-f-u { font-size: 12px; }
    .onb-bf-fig { width: 42px; height: 58px; }
    .onb-bf-p { font-size: 15px; }
    .onb-bf-h { font-size: 10.5px; }
    .onb-res-k { font-size: 48px; }
    .onb-res-m b { font-size: 19px; }
  }
