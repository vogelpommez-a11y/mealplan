      // Fruehstueck Amber, Hauptgericht/Mittagessen Teal. Alles Weitere bleibt grau: das
      // Theme hat keine freien Toene mehr, und Farbe nur dort, wo sie schon existiert, ist
      // dieselbe Regel wie bei den Snacks im Plan.
      const iconCls = "cicon" + (isFavGroup ? "" : (CAT_CLASS[cat] ? " " + CAT_CLASS[cat] : ""));
      // Bei aktiver Suche zaehlt collapsedCats nicht - sonst laege ein Treffer in einer
      // eingeklappten Kategorie, die Zaehlung zeigte "1", die Karte waere unsichtbar.
      const open = filtering || !collapsedCats.has(cat);
      // Waehrend der Suche ist ohnehin alles offen - die Kopfzeile deshalb NICHT als Knopf
      // ausgeben: ein Klick wuerde zwar collapsedCats umlegen, aber sichtbar passierte
      // nichts (open bleibt true). Ein toter Klick liest sich wie ein Fehler. Ohne Caret
      // ist auch optisch klar, dass hier gerade nichts zu klappen ist.
      // favgroup als eigene Klasse: der Scroll-Ausgleich in toggle-fav braucht einen Anker,
      // der NICHT die Favoriten-Gruppe ist (die entsteht und verschwindet ja gerade). Ueber
      // data-cat ginge das nicht - bei aktiver Suche ist die Kopfzeile ein div ohne Attribut.
      html += `<section class="catgroup${isFavGroup ? " favgroup" : ""}">`;
      html += filtering
        ? `<div class="cathead static">
          <span class="cname">${iconSvg(icon, iconCls)}${esc(label)}</span>
          <span class="ccount">${items.length}</span>
        </div>`
        : `<button class="cathead" data-action="toggle-cat" data-cat="${esc(cat)}" aria-expanded="${open}">
          <svg class="caret${open ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <span class="cname">${iconSvg(icon, iconCls)}${esc(label)}</span>
          <span class="ccount">${items.length}</span>
        </button>`;
      if (!open) { html += `</section>`; continue; }
      html += `<div class="recipes">`;
      items.forEach(r => {
      // Stretched-Link-Muster (plans/MealAnsicht.MD Schritt 3): .rcard-open ist ein
      // vollstaendig zurueckgesetzter Knopf, dessen ::after die ganze Karte ueberspannt
      // (CSS). Das Herz liegt als Geschwister DARUEBER (hoeherer z-index) und bleibt damit
      // eigenstaendig klickbar - "kein Button im Button". Tab-Reihenfolge: Titel -> Herz.
      const statsInner = cardStatsHtml(r);
      const authorHtml = recipeAuthorHtml(r);
      html += `<article class="rcard" data-rid="${r.id}">
        ${cardImageHtml(r)}
        <button type="button" class="btn fav-ic on-photo${isFav(r.id) ? " on" : ""}" data-action="toggle-fav" data-id="${r.id}"
                aria-pressed="${isFav(r.id)}"
                title="${isFav(r.id) ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen"}"
                aria-label="${isFav(r.id) ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen"}">${iconSvg("heart", "")}</button>
        <div class="rbody">
        <div class="top">
          <h3><button type="button" class="rcard-open" data-action="view" data-id="${r.id}">${esc(r.name)}</button></h3>
        </div>
        <div class="rstats">
          ${statsInner || `<p class="ms-empty-ings">Noch keine Nährwerte</p>`}
          ${authorHtml ? `<span class="meta">${authorHtml}</span>` : ""}
        </div>
        </div>
      </article>`;
      });
      html += `</div></section>`;
    }
    container.innerHTML = anyRendered ? html : `<p style="color:var(--text-muted);margin:0">Kein Meal gefunden.</p>`;
  }

  // ---------- Zurueck-Taste (D5) ----------
  // Android hat eine Systemtaste "Zurueck", iOS die Wischgeste am linken Rand. Ohne eigenen
  // History-Eintrag beenden beide die App, waehrend ein Overlay offen ist - der erste Griff
  // jedes Android-Testers und ein sicherer Kritikpunkt im Play Store.
  //
  // Modell: Jedes geoeffnete Overlay legt GENAU EINEN History-Eintrag an, dessen Marke
  // (pmOverlay) die Stapeltiefe an dieser Stelle festhaelt, und hinterlegt seine
  // Schliessfunktion. Zurueck vergleicht die Marke mit dem Stapel und schliesst alles, was
  // darueber liegt. Ein auf normalem Weg geschlossenes Overlay (✕, Escape, Backdrop, "Fertig")
  // nimmt seinen Eintrag selbst zurueck, damit kein toter Eintrag stehenbleibt.
  //
  // Die beiden Richtungen kommen sich nicht ins Gehege, weil der Stapel schon gekuerzt ist,
  // bevor das eigene go() sein popstate ausloest - die Schleife unten laeuft dann gar nicht
  // erst an. Ein Zaehler eigener Ereignisse waere hier die naheliegende, aber falsche Loesung:
  // Wie viele popstate ein Sprung ueber mehrere Eintraege ausloest, ist Browsersache.
  const overlayStack = [];
  let offeneRuecknahmen = 0;   // geschlossen, aber der History-Eintrag ist noch da
  let ruecknahmeTimer = 0;

  // Die Ruecknahmen eines Ticks werden gebuendelt: Zwei history.back() direkt hintereinander
  // fuehrt der Browser NICHT beide aus - gemessen am 23.08.2026 im Pruefstand, Fall 5b. Genau
  // das passiert aber im Alltag, weil closeModal() zuerst einen laufenden Sucher beendet und
  // dann sich selbst. Uebrig blieb ein toter Eintrag, und der naechste Druck auf Zurueck tat
  // sichtbar nichts - der Fehler, den D5 gerade abstellen soll.
  function ruecknahmeAusfuehren() {
    ruecknahmeTimer = 0;
    const n = offeneRuecknahmen;
    offeneRuecknahmen = 0;
    if (n > 0) { try { history.go(-n); } catch (e) { noteError("back:go", e); } }
  }

  function overlayOpened(close) {
    overlayStack.push(close);
    if (offeneRuecknahmen > 0) {
      // Im selben Tick geschlossen und sofort wieder geoeffnet - "Teilen" etwa schliesst die
      // Meal-Ansicht und oeffnet danach das Teilen-Modal. Der noch nicht zurueckgenommene
      // Eintrag wird weiterverwendet, sonst ginge das gebuendelte go() einen Schritt zu weit
      // und risse das eben geoeffnete Fenster gleich wieder mit.
      offeneRuecknahmen--;
      try { history.replaceState({ pmOverlay: overlayStack.length }, ""); }
      catch (e) { noteError("back:replace", e); }
      return;
    }
    // Kein neuer Pfad, nur ein Eintrag: pushState(state, "") laesst die Adresszeile in Ruhe.
    // Ein "#modal" o. Ae. waere sichtbar und landete in Lesezeichen und geteilten Links.
    try { history.pushState({ pmOverlay: overlayStack.length }, ""); }
    catch (e) { noteError("back:push", e); overlayStack.pop(); }
  }

  function overlayClosed(close) {
    // lastIndexOf statt indexOf: Jedes Overlay bringt eine eigene Funktion mit (closeModal ist
    // je Modal dieselbe, aber es ist auch nur EINES offen; der Sucher baut sich seine bei jedem
    // Start neu). Faende hier doch einmal etwas doppelt, trifft es das obere - das ist das,
    // welches gerade geschlossen wurde.
    const i = overlayStack.lastIndexOf(close);
    if (i < 0) return;   // kam aus popstate, der Eintrag ist schon vom Stapel
    overlayStack.splice(i, 1);
    offeneRuecknahmen++;
    if (!ruecknahmeTimer) ruecknahmeTimer = setTimeout(ruecknahmeAusfuehren, 0);
  }

  // Der Abgleich laeuft ueber die Marke im History-Eintrag, nicht ueber einen Zaehler eigener
  // Ereignisse: history.go(-2) loest je nach Browser EIN popstate aus oder zwei. Die Marke sagt
  // dagegen unmissverstaendlich, wie viele Overlays an dieser Stelle der History offen waren -
  // alles darueber ist weggefallen und wird geschlossen. Nach einem selbst ausgeloesten go()
  // ist der Stapel bereits kurz genug, die Schleife laeuft dann gar nicht erst an.
  window.addEventListener("popstate", function (e) {
    const marke = (e.state && e.state.pmOverlay) || 0;
    while (overlayStack.length > marke) {
      const close = overlayStack.pop();
      let verweigert = false;
      try { verweigert = close() === false; } catch (err) { noteError("back:close", err); }
      if (verweigert) { overlayOpened(close); break; }
    }
  });

  // ---------- Modal ----------
  const modalRoot = document.getElementById("modal-root");
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  let lastFocused = null;   // Element, das den Dialog geoeffnet hat
  // Haengt sich VOR das eigentliche Schliessen: openMealSheet() nutzt den Hook, um beim
  // Verlassen ohne Namen den Schliessvorgang abzubrechen (Fokus + Toast statt Verwerfen)
  // bzw. spaeter (Schritt 4) die FLIP-Exit-Animation zu spielen, bevor modalRoot geleert
  // wird. Escape, Backdrop-Klick, ✕ und "Fertig" laufen alle ueber closeModal() - der Hook
  // greift dadurch ueberall gleich, ohne dass jeder Aufrufer ihn einzeln kennen muesste.
  let modalCloseHook = null;
  function closeModal() {
    // Rueckgabe: false, wenn ein Hook das Schliessen VERWEIGERT hat (Meal-Formular ohne Namen).
    // Die Zurueck-Taste braucht diese Auskunft - ihr History-Eintrag ist zu dem Zeitpunkt schon
    // zurueckgenommen und muss neu angelegt werden, sonst verlaesst der naechste Druck die App,
    // obwohl noch etwas offen steht. Am DOM ablesen liesse sich das nicht: Waehrend der
    // Exit-Animation steht das Overlay genauso noch da.
    if (modalCloseHook) { const hook = modalCloseHook; modalCloseHook = null; return hook() !== false; }
    // Sicherheitsnetz: schliesst irgendetwas das Formular, waehrend der Live-Scanner
    // laeuft, darf die Kamera nicht weiterlaufen.
    if (liveScanStop) liveScanStop();
    groupModalRepaint = null;   // sonst zeichnete ein spaeterer Mitglieder-Snapshot in ein totes DOM
    modalRoot.innerHTML = "";
    document.removeEventListener("keydown", modalKeys);
    // Fokus dorthin zurueckgeben, wo er herkam - sonst landet er beim Schliessen am
    // Seitenanfang und Tastaturnutzer verlieren ihre Position.
    if (lastFocused && document.contains(lastFocused)) { try { lastFocused.focus(); } catch (e) { noteError("modal:restoreFocus", e); } }
    lastFocused = null;
    // Zuletzt: den History-Eintrag dieses Overlays abraeumen.
    overlayClosed(closeModal);
    return true;
  }
  // Escape schliesst; Tab bleibt im Dialog gefangen (sonst wandert der Fokus hinter
  // den Dialog in die Seite, die visuell gar nicht bedienbar ist).
  function modalKeys(e) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key !== "Tab") return;
    const box = modalRoot.querySelector(".modal");
    if (!box) return;
    const items = Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE), el => el.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  // opts.focus: optionales Fokusziel-Element, ersetzt die Standardsuche (erstes
  // input/textarea/select/button) - z. B. fuer openMealSheet(), das lieber gar keinen
  // Feldfokus setzt (Autosave beim allerersten Tipp waere verfrueht) oder gezielt das
  // Namensfeld eines neuen Entwurfs fokussieren will.
  // opts.overlayClass: zusaetzliche Klasse am Overlay - eine Ansicht kann damit ihr eigenes
  // Aussenlayout waehlen, ohne dass es alle anderen Modals trifft. Heute nur von
  // openMealSheet() genutzt ("sheet-overlay", das Bottom-Sheet am Handy).
  function openModal(node, opts) {
    // VOR dem Leeren messen: Die Meal-Ansicht wechselt per openModal() in den Bearbeiten-Zweig,
    // ohne vorher closeModal() zu rufen (siehe openMealSheet). Das ist EIN Overlay, das seinen
    // Inhalt tauscht - ein zweiter History-Eintrag wuerde daraus zwei Zurueck-Druecke fuer ein
    // sichtbares Fenster machen.
    const ersetztOffenes = modalRoot.childElementCount > 0;
    hoveredCardId = null;   // Maus steht ab jetzt ueber dem Overlay, nicht mehr auf einer Karte
    lastFocused = document.activeElement;
    const overlay = document.createElement("div");
    overlay.className = "overlay" + ((opts && opts.overlayClass) ? " " + opts.overlayClass : "");
    overlay.addEventListener("mousedown", e => { if (e.target === overlay) closeModal(); });
    overlay.appendChild(node);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
    document.addEventListener("keydown", modalKeys);
    const focusEl = (opts && "focus" in opts) ? opts.focus : node.querySelector("input, textarea, select, button");
    if (focusEl) setTimeout(() => focusEl.focus(), 30);
    if (!ersetztOffenes) overlayOpened(closeModal);
  }

  // Einheitlicher Ja/Nein-Dialog. Ersetzt fuenf fast identische Modal-Bloecke; damit
  // sehen Bestaetigungen ueberall gleich aus und verhalten sich gleich.
  //   title, text (oder bodyHtml fuer Auszeichnungen), okLabel, onConfirm
  function confirmModal(o) {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">
      <div class="modal-head"><h3>${esc(o.title)}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">${o.bodyHtml || `<p style="margin:0">${esc(o.text || "")}</p>`}</div>
      <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn danger" data-confirm>${esc(o.okLabel || "Löschen")}</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("[data-confirm]").addEventListener("click", () => { closeModal(); o.onConfirm(); });
    openModal(node);
  }

  // ---------- Wiegen ----------
  // Ein Formular fuer beides: diese Woche wiegen und frühere Wochen nachtragen (B2 - vorher
  // Monate). Bewusst zwei Auswahlfelder und kein <input type="week">: das kennt Safari auf
  // dem iPhone nicht und faellt dort auf ein nacktes Textfeld zurueck - ausgerechnet auf
  // dem Geraet, auf dem die App laufen soll.
  // manageOnly (Art. 9 DSGVO): ohne Einwilligung darf kein NEUER Eintrag entstehen, das
  // Recht auf Loeschung bestehender Eintraege bleibt aber unabhaengig davon bestehen -
  // deshalb Eingabefelder und "Speichern" ausblenden, die Liste mit den Loeschen-Knoepfen
  // bleibt unveraendert. Siehe weightConsentHtml() fuer den Aufrufweg ohne Einwilligung.
  function openWeighForm(manageOnly) {
    const nowY = new Date().getFullYear();
    const nowKey = weightKeyNow();
    const last = latestWeight();
    // Vorbelegt ist das Jahr, das gerade im Diagramm steht - nicht stur das laufende.
    // Wer ueber den Jahreswechsel auf „Ziele 2025" schaut und dort etwas nachtragen
    // will, muesste sonst erst zurueckschalten.
    const startY = activeYear();
    // Auswaehlbare Jahre: die letzten drei plus alle, in denen schon etwas steht.
    const yset = {};
    for (let i = 0; i < 3; i++) yset[nowY - i] = 1;
    yset[startY] = 1;
    (state.weights || []).forEach(e => { yset[e.m.slice(0, 4)] = 1; });
    const years = Object.keys(yset).sort().reverse();

    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="${manageOnly ? "Verlauf verwalten" : "Wiegen"}">
      <div class="modal-head"><h3>${manageOnly ? "Verlauf verwalten" : "Wiegen"}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        ${manageOnly ? "" : `<div class="field"><label for="w-kg">Gewicht</label>${numField({ id: "w-kg", min: KG_MIN, max: KG_MAX, step: 0.1, unit: "kg", placeholder: "kg", value: last ? String(last.kg) : "" })}</div>
        <div class="row2">
          <div class="field"><label for="w-m">Woche</label><select id="w-m"></select></div>
          <div class="field"><label for="w-y">Jahr</label><select id="w-y">
            ${years.map(y => `<option value="${y}"${y === startY ? " selected" : ""}>${y}</option>`).join("")}
          </select></div>
        </div>`}
        <div id="w-list"></div>
      </div>
      <div class="modal-foot">${manageOnly ? `<button class="btn primary" data-close>Fertig</button>` : `<button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="w-ok">Speichern</button>`}</div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));

    const mEl = node.querySelector("#w-m"), yEl = node.querySelector("#w-y");
    // Im laufenden Jahr endet die Liste bei der aktuellen Woche: ein Gewicht fuer die
    // naechste Woche kann niemand gemessen haben. Jede Woche traegt ihr Montagsdatum -
    // "KW 33" allein ordnet im Alltag kaum jemand ein.
    function fillWeeks() {
      if (!mEl || !yEl) return;
      const sel = mEl.value;
      const y = +yEl.value;
      // 53 nur, wenn es die Woche in diesem Jahr wirklich gibt (der 28.12. liegt per
      // ISO-Definition immer in der letzten Woche des Jahres).
      const maxW = y === nowY ? weekNumOf(nowKey) : weekNumOf(weightKeyNow(new Date(y, 11, 28)));
      let out = "";
      for (let w = maxW; w >= 1; w--) {
        const key = y + "-W" + String(w).padStart(2, "0");
        out += `<option value="${String(w).padStart(2, "0")}">${esc(weekKeyLabel(key))}</option>`;
      }
      mEl.innerHTML = out;
      mEl.value = (sel && +sel <= maxW) ? sel : String(maxW).padStart(2, "0");
    }
    fillWeeks();
    if (yEl) yEl.addEventListener("change", fillWeeks);

    const listEl = node.querySelector("#w-list");
    function paintList() {
      const rows = (state.weights || []).slice().reverse();
      listEl.innerHTML = rows.length
        ? `<h4 style="margin:18px 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)">Verlauf</h4>`
          + rows.map(r => `<div class="wl-row"><span class="wl-d">${esc(weekKeyLabel(r.m))}</span><span class="wl-k">${kgfmt(r.kg)} kg</span>
              <button class="btn ghost sm" data-del="${r.m}" aria-label="Eintrag ${esc(weekKeyLabel(r.m))} löschen">✕</button></div>`).join("")
        : `<p class="wl-empty">Noch keine Messung.</p>`;
      listEl.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
        const m = b.dataset.del;
        // Loeschen der juengsten Wiegung kann syncGoalWeight() das Kalorienziel still neu
        // berechnen (Paket B6) - Vorher/Jetzt merken, um es sichtbar zu machen statt es
        // unbemerkt zu lassen. Fuer Rueckgaengig (Paket B1) reichen der Eintrag und das Ziel.
        const removedEntry = (state.weights || []).find(e => e.m === m);
        const oldKcal = state.goal ? state.goal.kcal : null;
        const oldGoal = state.goal;
        removeWeight(m);
        const newKcal = state.goal ? state.goal.kcal : null;
        save(); paintList(); render();
        const undo = () => {
          if (removedEntry) { state.weights = (state.weights || []).concat([removedEntry]).sort((a, b) => a.m < b.m ? -1 : 1); }
          state.goal = oldGoal;
          save(); paintList(); render();
        };
        if (oldKcal != null && newKcal != null && oldKcal !== newKcal && removedEntry) {
          goalAdjustModal("Kalorienziel angepasst", oldKcal, newKcal, "Du hast eine Wiegung gelöscht, dein Energiebedarf wurde neu berechnet.", undo);
        } else {
          undoToast("Wiegung gelöscht", undo);
        }
      }));
    }
    paintList();

    if (manageOnly) { openModal(node); return; }

    node.querySelector("#w-ok").addEventListener("click", () => {
      const kgEl = node.querySelector("#w-kg");
      // nutParse akzeptiert Komma wie Punkt - auf deutschen Tastaturen wird das Komma getippt.
      const kg = nutParse(kgEl.value);
      if (!(kg >= KG_MIN && kg <= KG_MAX)) { kgEl.focus(); kgEl.style.borderColor = "var(--danger)"; toast("Bitte ein Gewicht zwischen " + KG_MIN + " und " + KG_MAX + " kg eintragen"); return; }
      const m = yEl.value + "-W" + mEl.value;
      // Zeichenkettenvergleich reicht: "2026-W07" < "2026-W33" stimmt, weil die Wochenzahl
      // zweistellig aufgefuellt ist - dieselbe Eigenschaft, auf der schon state.plans beruht.
      if (!validWeightKey(m) || m > nowKey) { toast("Bitte eine Woche bis heute wählen"); return; }
      const neu = !(state.weights || []).some(e => e.m === m);
      const oldKcal = state.goal ? state.goal.kcal : null;
      setWeight(m, kg);
      const newKcal = state.goal ? state.goal.kcal : null;
      // Auf das Jahr springen, in das der Eintrag gehoert - sonst traegt man den Januar
      // nach und sieht ihn nicht, weil noch ein anderes Jahr im Bild steht.
      state.viewYear = +yEl.value;
      save(); closeModal(); render();
      if (oldKcal != null && newKcal != null && oldKcal !== newKcal) {
        goalAdjustModal(`Neues Gewicht: ${kgfmt(kg)} kg`, oldKcal, newKcal, "Dein Körpergewicht hat sich verändert und dein Energiebedarf wurde neu berechnet.");
      } else {
        toast(m === nowKey ? "Gewicht gespeichert" : (neu ? "Nachgetragen: " : "Geändert: ") + weekKeyLabel(m));
      }
    });
    openModal(node);
  }

  // Zeigt nach dem Wiegen, falls syncGoalWeight() das Kalorienziel neu berechnet hat,
  // Vorher/Jetzt/Differenz - sonst merkt der Nutzer die stille Neuberechnung nicht.
  // undoFn optional (Paket B1): bei der geloeschten Wiegung faellt sonst gleichzeitig ein Toast
  // MIT Rueckgaengig-Knopf und dieser Dialog an - "zwei Dinge gleichzeitig waeren zu viel" (gleiche
  // Ueberlegung wie beim Teilen-Modal, das das Onboarding zurueckstellt). Das Rueckgaengig steckt
  // hier stattdessen im Dialog selbst.
  function goalAdjustModal(title, oldKcal, newKcal, reason, undoFn) {
    const diff = newKcal - oldKcal;
    const sign = diff > 0 ? "+" : "−";
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Kalorienziel angepasst">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 4px">Dein Kalorienziel wurde angepasst:</p>
        <div class="bd-row"><span>Vorher</span><span>${nfmt(oldKcal)} kcal</span></div>
        <div class="bd-row"><span>Jetzt</span><span>${nfmt(newKcal)} kcal</span></div>
        <div class="bd-row bd-mid"><span>Änderung</span><span>${sign}${nfmt(Math.abs(diff))} kcal</span></div>
        <p class="tdays-note" style="margin-bottom:0">Grund: ${esc(reason)}</p>
      </div>
      <div class="modal-foot">${undoFn ? `<button class="btn ghost" data-undo>Rückgängig</button>` : ""}<button class="btn primary" data-close>Alles klar</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    if (undoFn) { const ub = node.querySelector("[data-undo]"); if (ub) ub.addEventListener("click", () => { closeModal(); undoFn(); }); }
    openModal(node);
  }

  // Jahres-Zielgewicht. Eigener kleiner Dialog, weil es genau ein Feld ist und nicht in
  // jedem Wiegen-Vorgang im Weg stehen soll.
  function openWeightGoalForm() {
    const year = activeYear();
    const cur = (state.weightGoals || {})[year];
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Jahresziel ${year}">
      <div class="modal-head"><h3>Ziel ${year}</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <div class="field"><label for="wg-kg">Wunschgewicht zum Jahresende</label>${numField({ id: "wg-kg", min: KG_MIN, max: KG_MAX, step: 0.1, unit: "kg", placeholder: "kg", value: cur != null ? String(cur) : "" })}</div>
      </div>
      <div class="modal-foot">
        ${cur != null ? `<button class="btn ghost" id="wg-del">Ziel entfernen</button>` : `<button class="btn ghost" data-close>Abbrechen</button>`}
        <button class="btn primary" id="wg-ok">Speichern</button>
      </div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const del = node.querySelector("#wg-del");
    if (del) del.addEventListener("click", () => {
      delete state.weightGoals[year]; save(); closeModal(); render(); toast("Jahresziel entfernt");
    });
    node.querySelector("#wg-ok").addEventListener("click", () => {
      const inp = node.querySelector("#wg-kg");
      const kg = nutParse(inp.value);
      if (!(kg >= KG_MIN && kg <= KG_MAX)) { inp.focus(); inp.style.borderColor = "var(--danger)"; toast("Bitte ein Gewicht zwischen " + KG_MIN + " und " + KG_MAX + " kg eintragen"); return; }
      if (!state.weightGoals) state.weightGoals = {};
      state.weightGoals[year] = Math.round(kg * 10) / 10;
      save(); closeModal(); render(); toast("Ziel für " + year + " gespeichert");
    });
    openModal(node);
  }

  // ---------- Ziel von Hand justieren (B4) ----------
  // Wer sein Defizit um 100 kcal korrigieren will, musste bis 13.08.2026 durch den
  // kompletten Rechner (Alter, Groesse, Aktivitaet, Trainingstage). Fuer eine Zielgruppe,
  // die genau das regelmaessig tut, ist das der falsche Weg. Der Rechner bleibt daneben
  // stehen - er ist weiterhin der Weg, wenn sich die Grundlagen aendern.
  //
  // Gespeichert werden dieselben vier Felder, die goalTargets() ohnehin liest. Zusaetzlich
  // `manual: true`: Ohne diese Marke haette die naechste Wiegung die Handanpassung still
  // ueberschrieben (syncGoalWeight rechnet mit computeGoal neu). Ein "Ziele neu berechnen"
  // im Rechner setzt die Marke automatisch zurueck - computeGoal baut ein frisches Objekt.
  function openGoalTuneForm() {
    const g = state.goal;
    if (!g) { startOnboarding({ first: false }); return; }
    const f = (id, label, val, unit, max) =>
      `<div class="field"><label for="${id}">${label}</label>${numField({ id: id, min: 0, max: max, step: 1, unit: unit, placeholder: "0", value: val != null ? String(val) : "" })}</div>`;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Ziel anpassen">
      <div class="modal-head"><h3>Ziel anpassen</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">
        <p class="hint" style="margin:0 0 14px">Gilt für Ruhetage. Trainingstage bekommen ihren Aufschlag weiterhin oben drauf.</p>
        <div class="onb-grid">
          ${f("gt-kcal", "Kalorien", nutNum(g.kcal), "kcal", 20000)}
          ${f("gt-carbs", "Kohlenhydrate", nutNum(g.carbs), "g", 2000)}
          ${f("gt-protein", "Protein", nutNum(g.protein), "g", 2000)}
          ${f("gt-fat", "Fett", nutNum(g.fat), "g", 2000)}
        </div>
        <p class="hint" id="gt-sum" aria-live="polite" style="margin:12px 0 0"></p>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-close>Abbrechen</button>
        <button class="btn primary" id="gt-ok">Speichern</button>
      </div>
    </div>`);
    const val = id => nutParse(node.querySelector("#" + id).value);
    // Kein Zwang zur Deckungsgleichheit, nur eine Rueckmeldung: Makros und Kalorien
    // duerfen auseinanderliegen (viele rechnen bewusst mit Puffer). Erst ab 3 % Abweichung
    // gemeldet, sonst blinkt der Hinweis bei jedem Rundungsschritt.
    function updateSum() {
      const kcal = val("gt-kcal"), c = val("gt-carbs"), p = val("gt-protein"), fat = val("gt-fat");
      const sum = (c || 0) * 4 + (p || 0) * 4 + (fat || 0) * 9;
      const el2 = node.querySelector("#gt-sum");
      el2.textContent = (kcal && sum && Math.abs(sum - kcal) > kcal * 0.03)
        ? `Deine Makros ergeben ${nfmt(sum)} kcal.` : "";
    }
    node.addEventListener("input", updateSum);
    updateSum();
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("#gt-ok").addEventListener("click", () => {
      const kcal = val("gt-kcal");
      const inp = node.querySelector("#gt-kcal");
      if (!(kcal >= 500 && kcal <= 20000)) {
        inp.focus(); inp.style.borderColor = "var(--danger)";
        toast("Bitte ein Kalorienziel zwischen 500 und 20.000 eintragen");
        return;
      }
      state.goal = Object.assign({}, state.goal, {
        kcal: Math.round(kcal),
        carbs: Math.round(val("gt-carbs") || 0),
        protein: Math.round(val("gt-protein") || 0),
        fat: Math.round(val("gt-fat") || 0),
        manual: true,
        updatedAt: Date.now()
      });
      save(); closeModal(); render(); toast("Ziel angepasst");
    });
    openModal(node);
  }

  // Sucht die aktuell im DOM stehende Karte/den Wochenplan-Slot zu einer Meal-ID - fuer den
  // FLIP-Exit UND die Fokus-Rueckgabe (plans/MealAnsicht.MD Schritt 4) IMMER neu aufgerufen,
  // nie den beim Oeffnen gemessenen Knoten behalten: Name, Kategorie oder Gruppenzustand
  // koennen sich waehrend der offenen Ansicht geaendert haben, und paintRecipeGroups()
  // ersetzt die Karte bei jedem Autosave-Commit. Bei Favoriten steht dieselbe rid zweimal im
  // DOM (Favoriten-Gruppe + eigene Kategorie) - letzte Instanz treffen, gleiches Muster wie
  // toggle-fav().
  function findMealOrigin(id) {
    if (!id) return null;
    const cards = view.querySelectorAll('.rcard[data-rid="' + id + '"]');
    if (cards.length) return cards[cards.length - 1];
    return view.querySelector('.filled[data-id="' + id + '"]');
  }

  // ---------- Meal-Ansicht (Karte -> grosse Ansicht, ersetzt das fruehere Ansehen/
  // Bearbeiten-Modalpaar openRecipeDetail/openRecipeForm) ----------
  // prefill: nur bei neuem Meal (id == null) genutzt - fuellt Name/Kategorie/Barcode und
  // optional eine Zutaten-Zeile (ingredients, Naehrwerte je 100 g) vor, wenn
  // quickAddByBarcode() OFF-Daten nicht sicher genug fuer die stille Uebernahme findet
  // (z. B. keine auswertbare Portionsgroesse). prefill.assignTo (day/meal) plant das Meal
  // nach dem ersten Speichern direkt im urspruenglichen Slot ein. originEl: das angeklickte
  // Element (schon von der Klick-Delegation gemessen, siehe "view"-Fall weiter unten) - Basis
  // fuer die FLIP-Oeffnung (Schritt 4). Ohne originEl (Knopf "Neues Meal", Barcode-
  // Schnellzugriff, Picker-Leerzustand) bleibt es bei der alten Modal-Pop-Animation.
  //
  // Autosave statt Speichern-Knopf, siehe plans/MealAnsicht.MD: Referenz nie halten (rec()
  // holt bei jedem Zugriff frisch aus getRecipe()/draft), openSheetId setzt den
  // Remote-Merge fuer dieses eine Meal aus, waehrend die Ansicht offen ist.
  //
  // startInEdit (Nachtrag Abnahme Phase 2, 08.08.2026): ein bestehendes Meal oeffnet IMMER
  // zuerst lesend, egal ob aus dem Wochenplan-Slot oder der Meal-Karte (.rcard-open) im
  // Meals-Reiter - "was esse ich Dienstag?" soll kein versehentliches Bearbeiten ausloesen,
  // und beide Einstiege sollen sich gleich verhalten. Bearbeiten ist ueberall nur einen Tipp
  // auf den "Bearbeiten"-Knopf entfernt. Einzige Ausnahmen, die DIREKT im Bearbeiten-Zweig
  // starten: ein neues Meal (isNew, es gibt noch nichts anzusehen) und der Barcode-Weg
  // (quickAddByBarcode uebergibt ein prefill, ist also ebenfalls isNew). startInEdit ist
  // deshalb bewusst positiv formuliert (statt einer doppelten Verneinung wie zuvor
  // forceReadOnly) und wird nur vom "Bearbeiten"-Knopf selbst gesetzt. canEdit() bleibt
  // allein zustaendig fuer die BERECHTIGUNG (Rolle "view" bekommt nie einen Bearbeiten-
  // Knopf), startInEdit nur fuer den EINSTIEGS-Modus bei vorhandener Berechtigung.
  function openMealSheet(id, prefill, originEl, startInEdit) {
    const canEditNow = canEdit();
    const isNew = !id;
    const readOnly = !canEditNow || (!isNew && !startInEdit);
    if (isNew && !canEditNow) return; // sollte ueber WRITE_ACTIONS ohnehin nie passieren

    // ---------- Bewegung: FLIP am Rechner, Bottom-Sheet am Handy ----------
    // Am Handy ist FLIP wirkungslos: dort ist die Karte fast so breit wie die Ansicht, und
    // flipDelta() leitet die Skalierung allein aus der BREITE ab (s = from.width/to.width).
    // s liegt damit bei ~1,0, uebrig bliebe eine kaum sichtbare Verschiebung - fuer den
    // Nutzer sah es aus, als gaebe es gar keine Animation (Abnahme 08.08.2026, siehe
    // TROUBLESHOOTING). Unter 560px faehrt deshalb ein Bottom-Sheet von unten hoch und beim
    // Schliessen wieder herunter: gleicher Weg hin wie zurueck.
    // asSheet beschreibt das LAYOUT und gilt deshalb auch unter reducedMotion() - eine feste
    // Sheet-Groesse ist keine Bewegung. Nur die Animationen haengen an withMotion; ohne sie
    // bleibt es beim reinen Fade des globalen reduced-motion-Blocks im CSS.
    const asSheet = sheetLayout();
    const withMotion = !reducedMotion();
    // FLIP-Rect JETZT messen (nicht erst beim tatsaechlichen Animieren) - originEl ist exakt
    // das Element, auf das geklickt wurde, eine erneute Suche waere bei Favoriten falsch
    // (Karte kann zweimal im DOM stehen). Siehe .modal.flip-anim (CSS) und TROUBLESHOOTING #39.
    const flipFrom = (originEl && !asSheet && withMotion) ? originEl.getBoundingClientRect() : null;
    // Der "Bearbeiten"-Knopf tauscht den Knoten in-place gegen den Bearbeiten-Zweig aus
    // (rekursiver Aufruf weiter unten) und unterdrueckt die Eintrittsbewegung am Rechner
    // allein ueber originEl = null. Am Handy haengt sie nicht mehr an originEl - ohne diese
    // Pruefung wuerde das Sheet beim Moduswechsel ein zweites Mal hochfahren, obwohl es
    // laengst an seinem Platz steht.
    const sheetEnter = asSheet && withMotion && !modalRoot.querySelector(".mealsheet");
    // Beantwortet zwei Fragen mit derselben Bedingung, absichtlich in EINER Variablen: Spielt
    // dieser Vorgang eine eigene WAAPI-Bewegung? Wenn ja, braucht er den Exit (sonst uebernimmt
    // closeModal() direkt) UND die Klasse .flip-anim, die die CSS-eigene pop-Animation abschaltet.
    // Zwei getrennte Flags dafuer wuerden frueher oder spaeter auseinanderlaufen.
    const useAnimExit = !!flipFrom || (asSheet && withMotion);

    // Gemeinsame Sheet-Bewegung fuer Eintritt und Austritt. Die Strecke ist bewusst KURZ
    // (SHEET_SLIDE) und wird vom Einblenden begleitet, statt das Sheet ueber die ganze
    // Bildschirmhoehe zu schieben: Ein Transform ueber 680px zwingt den Browser, in jedem Bild
    // ein grosses Foto UND einen aktiven Scroll-Container neu zu rastern. Am Geraet fiel dabei
    // reproduzierbar der eine oder andere Frame aus - sichtbar als kurz falsch stehende
    // Fusszeile, umso haeufiger, je laenger die Zutatenliste war (Rueckmeldung 08.08.2026,
    // siehe TROUBLESHOOTING). Das Layout selbst war dabei nachweislich stabil.
    // Zwei Gegenmittel gehoeren zwingend dazu:
    //   1. will-change hebt das Sheet vorab auf eine eigene Compositor-Schicht - dasselbe
    //      Muster wie in flipIn()/flipOut(). Unbedenklich nach TROUBLESHOOTING #25: auf dem
    //      Sheet laeuft waehrenddessen keine Paint-Transition (.modal.flip-anim schaltet die
    //      CSS-transition ab), der Overlay-Fade liegt auf einem anderen Element.
    //   2. Der Body wird fuer die Dauer der Bewegung ruhiggestellt (overflow: hidden), damit
    //      kein zweiter Scroll-Layer mitgerastert wird.
    // Beides MUSS wieder weg, egal wie die Animation endet - bleibt overflow haengen, laesst
    // sich eine lange Zutatenliste nie wieder scrollen. Deshalb der finished-Handler mit
    // beiden Zweigen (eine abgebrochene Animation rejectet).
    // fill: nur der Austritt haelt seinen Endzustand ("forwards"), sonst blitzte das Sheet
    // zwischen Animationsende und dem closeModal() im finished-Handler ein Bild lang wieder
    // an seinem Platz auf. Der Eintritt endet ohnehin genau im CSS-Normalzustand und braucht
    // deshalb kein fill - eine gefuellte Animation bliebe nur unnoetig am Element haengen.
    const SHEET_SLIDE = 48;
    function sheetMove(node, keyframes, dur, fill) {
      const body = node.querySelector(".modal-body");
      node.style.willChange = "transform, opacity";
      if (body) body.style.overflow = "hidden";
      const anim = node.animate(keyframes, { duration: dur, easing: MOTION.ease, fill: fill || "none" });
      const clear = () => {
        node.style.willChange = "";
        if (body) body.style.overflow = "";   // leeren, nicht auf auto setzen - die CSS-Regel soll wieder greifen
      };
      anim.finished.then(clear, clear);
      return anim;
    }
    // Spielt den Eintritt NACH openModal() (das Ziel-Rect existiert erst, wenn der Knoten im
    // DOM steht). Am Rechner zwei WAAPI-Animationen im selben Tick: der Container waechst per
    // flipIn(), der Inhalt blendet erst ab ~38% ein - der wachsende Kasten liest sich zuerst
    // als Karte. Am Handy gleitet das Sheet nur ein kurzes Stueck herein und blendet dabei auf.
    function playEnter(node) {
      const overlayEl = node.parentElement;
      const fadeIn = () => { if (overlayEl) overlayEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: parseFloat(MOTION.base) || 200, easing: MOTION.ease }); };
      if (sheetEnter) {
        sheetMove(node, [
          { transform: "translateY(" + SHEET_SLIDE + "px)", opacity: 0 },
          { transform: "none", opacity: 1 },
        ], parseFloat(MOTION.slow) || 300);
        fadeIn();
        return;
      }
      if (!flipFrom) return;
      const toRect = node.getBoundingClientRect();
      const anim = flipIn(node, flipFrom, toRect);
      if (!anim) return;
      const dur = parseFloat(MOTION.slow) || 300;
      Array.prototype.forEach.call(node.children, k => k.animate(
        [{ opacity: 0 }, { opacity: 0, offset: .38 }, { opacity: 1 }],
        { duration: dur, easing: MOTION.ease }
      ));
      fadeIn();
    }
    // Gegenstueck zu playEnter(). Am Handy faehrt das Sheet denselben Weg zurueck, den es
    // gekommen ist - und zwar unabhaengig davon, ob der Eintritt gespielt wurde: wer ueber
    // "Bearbeiten" im Sheet gelandet ist, erwartet beim Schliessen trotzdem die Bewegung
    // nach unten. Am Rechner die umgekehrte FLIP-Bewegung; das Ziel wird HIER neu gesucht
    // (findMealOrigin, nie den beim Oeffnen gemessenen Knoten). Fehlt das Ziel (Karte
    // ausserhalb des Sichtfelds, gefiltert, gescrollt): schlichtes Ausblenden mit MOTION.fast
    // statt FLIP ins Leere. Exits sind ueberall kuerzer als Entries.
    // `finish` erledigt die eigentliche Aufraeumarbeit (closeModal()).
    function closeWithMotion(node, closeId, finish) {
      const overlayEl = node.parentElement;
      // Nicht das beim Oeffnen gemerkte asSheet verwenden, sondern JETZT pruefen, ob die
      // Ansicht auch gerade wirklich als Sheet dasteht: Wer das Handy dreht, waehrend die
      // Ansicht offen ist, wechselt die Media-Query-Seite - das CSS folgt sofort, eine
      // gemerkte Variable nicht. Es braucht beides, die Klasse (so geoeffnet) UND die noch
      // greifende Breite; sonst faehrt ein zentriertes Modal nach unten weg, statt zu seiner
      // Karte zurueckzuschrumpfen. Faellt einer der beiden Teile weg, uebernimmt der
      // FLIP-Zweig darunter - der sucht sein Ziel ohnehin frisch.
      const nochSheet = !!overlayEl && overlayEl.classList.contains("sheet-overlay") && sheetLayout();
      if (nochSheet) {
        // Spiegelbild des Eintritts, nur kuerzer (MOTION.base gegen MOTION.slow) - Exits
        // bleiben ueberall kuerzer als Entries.
        const dur = parseFloat(MOTION.base) || 200;
        const a = sheetMove(node, [
          { transform: "none", opacity: 1 },
          { transform: "translateY(" + SHEET_SLIDE + "px)", opacity: 0 },
        ], dur, "forwards");
        if (overlayEl) overlayEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur, easing: MOTION.ease });
        a.finished.then(finish, finish);
        return;
      }
      const target = findMealOrigin(closeId);
      if (!target) {
        const a = node.animate([{ opacity: 1 }, { opacity: 0 }], { duration: parseFloat(MOTION.fast) || 160, easing: MOTION.ease });
        if (overlayEl) overlayEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: parseFloat(MOTION.fast) || 160, easing: MOTION.ease });
        a.finished.then(finish, finish);
        return;
      }
      const toRect = node.getBoundingClientRect();
      const fromRect = target.getBoundingClientRect();
      const anim = flipOut(node, fromRect, toRect);
      if (!anim) { finish(); return; }
      if (overlayEl) overlayEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: parseFloat(MOTION.base) || 200, easing: MOTION.ease });
      anim.finished.then(finish, finish);
    }
    // Fokus zurueckgeben: die urspruenglich geoeffnete Karte kann durch einen Repaint
    // (Umbenennen, Favorit, Foto) ersetzt worden sein - lastFocused zeigt dann auf einen
    // entfernten Knoten, closeModal()s Standard-Restore (document.contains) greift ins Leere.
    // Deshalb die aktuelle Karte/den Slot NEU suchen und als Fokusziel VOR dem eigentlichen
    // closeModal() setzen - dessen vorhandene Restore-Logik uebernimmt den Rest. Rueckfall
    // auf das Suchfeld, wenn auch das nicht existiert (Ansicht ueber dem Wochenplan).
    function restoreFocusTarget(closeId) {
      const origin = findMealOrigin(closeId);
      const btn = origin && origin.matches(".rcard") ? origin.querySelector(".rcard-open") : origin;
      if (btn) { lastFocused = btn; return; }
      const s = view.querySelector("#r-search");
      if (s) lastFocused = s;
    }

    // ---------- Nur-Lese-Zweig: keine Eingabefelder, kein Autosave, kein Loeschen ----------
    // Zwei Wege hierher: Rolle "view" (kein canEditNow, kein Bearbeiten-Knopf) und jedes
    // bestehende Meal beim ersten Oeffnen ohne startInEdit, egal ob Wochenplan-Slot oder
    // Meal-Karte (canEdit()=true, MIT Bearbeiten-Knopf - Nachtrag Abnahme Phase 2).
    // openSheetId/openSheetRemovedCb bleiben hier unangetastet: es wird lokal nichts
    // editiert, ein Remote-Update darf ganz normal durchschlagen.
    if (readOnly) {
      // Bis zum 17.08.2026 stand hier, getRecipe() duerfe eine Katalog-ID NIE sehen, weil ein
      // Plan-Eintrag immer auf ein Meal im eigenen Bestand zeige. Genau diese Annahme ist mit
      // dem Katalog-Umbau gefallen: der Wochenplan-Slot ist seither der einzige NEUE Weg
      // hierher, und ein Slot kann jetzt direkt auf eine Katalog-id zeigen. getRecipe() faellt
      // deshalb selbst auf den Katalog zurueck (state.recipes zuerst, siehe dort) - hier
      // reicht ein einziger Aufruf.
      //
      // `ausBuch` wird trotzdem separat ermittelt: Es entscheidet NICHT, ob das Rezept
      // gefunden wird (das erledigt getRecipe() allein), sondern ob Bearbeiten/Teilen oder der
      // Uebernehmen-Knopf angeboten wird - eine Katalog-id gehoert dem Nutzer noch nicht, egal
      // ob sie aus der Rezeptbuch-Liste oder einem Slot kommt.
      const ausBuch = COOKBOOK.find(x => x.id === id) || null;
      const r = getRecipe(id);
      if (!r) return;
      const cls = CAT_CLASS[r.category] || "cat-x";
      const statsInner = mealStatsHtml(r);
      const statsHtml = statsInner
        ? `<div class="dsec"><h4 class="sec-h">Makros gesamt</h4>${statsInner}</div>`
        : `<p class="ms-empty-ings">Noch keine Nährwerte</p>`;
      const ingHtml = (r.ingredients && r.ingredients.length)
        ? `<div class="ing-list">${r.ingredients.map(i => roIngRowHtml(i)).join("")}</div>`
        : `<p class="ms-empty-ings">Noch keine Zutaten</p>`;
      // Ein Katalog-Rezept gehoert dem Nutzer noch nicht: Bearbeiten waere gegenstandslos
      // (er wuerde eine Vorlage aendern, die beim naechsten Start wieder dasteht), und
      // Teilen erzeugte einen shared-Eintrag fuer etwas, das ohnehin jeder in der App hat.
      // An ihre Stelle tritt unten im Fuss der Uebernehmen-Knopf.
      const node = el(`<div class="modal detail mealsheet${useAnimExit ? " flip-anim" : ""}" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
        <div class="modal-head">
          ${canEditNow && !ausBuch ? `<button type="button" class="ms-photobtn ms-edit-btn" data-edit>Bearbeiten</button>` : ""}
          ${ausBuch ? "" : `<button type="button" class="btn ghost icon-gh on-photo" data-share title="Meal teilen" aria-label="Meal teilen">${TOOL_ICONS.share}</button>`}
          <button type="button" class="btn ghost icon-gh on-photo" data-close aria-label="Schließen">✕</button>
        </div>
        <div class="ms-photo has-photo"><img src="${photoFor(r)}" alt="${esc(r.name)}"></div>
        <div class="modal-body">
          <div class="ms-head"><h3 class="ms-title">${esc(r.name)}</h3><span class="chip ${cls}">${esc(r.category || "Gericht")}</span></div>
          ${mealFlagsHtml(r)}
          ${statsHtml}
          <div class="ms-ings"><h4 class="sec-h">Zutaten</h4>${ingHtml}</div>
          ${r.steps ? `<div class="dsec"><h4 class="sec-h">Zubereitung</h4><div class="steps">${esc(r.steps)}</div></div>` : ""}
        </div>
        <div class="modal-foot">${ausBuch
          ? (isAdopted(r.id)
              ? `<span class="cb-drin">In deinen Meals</span><button class="btn primary" data-close>Schließen</button>`
              : `<button class="btn ghost" data-close>Schließen</button><button class="btn primary" data-adopt-close>Übernehmen</button>`)
          : `<button class="btn primary" data-close>Schließen</button>`}</div>
      </div>`);
      function finishClose() { restoreFocusTarget(id); closeModal(); }
      modalCloseHook = () => {
        modalCloseHook = null;
        if (useAnimExit) closeWithMotion(node, id, finishClose); else finishClose();
      };
      node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
      const shareBtn = node.querySelector("[data-share]");
      if (shareBtn) shareBtn.addEventListener("click", () => { closeModal(); shareRecipeNow(r.id); });
      // Uebernehmen aus der Ansicht heraus: erst schliessen, dann kopieren - adoptFromCookbook
      // ruft render(), und das baut die Ansicht unter dem offenen Sheet weg.
      const adoptBtn = node.querySelector("[data-adopt-close]");
      if (adoptBtn) adoptBtn.addEventListener("click", () => { closeModal(); adoptFromCookbook(r.id); });
      // "Bearbeiten" (nur bei canEditNow gerendert): tauscht den Knoten OHNE FLIP gegen den
      // Bearbeiten-Zweig aus (originEl bewusst null) - die Ansicht ist schon offen und an
      // ihrem Platz, siehe plans/MealAnsicht.MD Nachtrag. openModal() im rekursiven Aufruf
      // ersetzt modalRoot.innerHTML vollstaendig, ein vorheriges closeModal() ist unnoetig.
      const editBtn = node.querySelector("[data-edit]");
      if (editBtn) editBtn.addEventListener("click", () => {
        modalCloseHook = null;
        openMealSheet(id, null, null, true);
      });
      openModal(node, { overlayClass: asSheet ? "sheet-overlay" : "" });
      playEnter(node);
      return;
    }

    // ---------- Bearbeiten-Zweig ----------
    let recId = id || null;
    let draftPushed = false; // wird true, sobald ein neuer Entwurf erstmals einen Namen traegt und in state.recipes einzieht
    const pre = (isNew && prefill) ? prefill : null;
    const draft = isNew ? {
      id: uid(), name: (pre && pre.name) || "", category: (pre && pre.category) || "",
      nutrition: null, ingredients: [], steps: "",
    } : null;
    // Einzige erlaubte Zugriffsart auf das Meal-Objekt (siehe plans/MealAnsicht.MD,
    // "Referenz nie halten"): onRecipesRemote() ERSETZT das Objekt bei jedem Remote-Update,
    // eine gehaltene Referenz wuerde dann in ein abgehaengtes Waisenobjekt schreiben.
    const rec = () => (recId ? getRecipe(recId) : draft);
    if (!isNew && !rec()) return; // Meal existiert nicht (mehr)
    if (recId) openSheetId = recId;

    const initial = rec();
    const opts = CATEGORIES.map(c => `<option value="${c}" ${initial.category === c ? "selected" : ""}>${c}</option>`).join("");
    const isOwnPhoto = !!initial.image;
    const node = el(`<div class="modal detail mealsheet${useAnimExit ? " flip-anim" : ""}" role="dialog" aria-modal="true" aria-label="${isNew ? "Neues Meal" : "Meal bearbeiten"}">
      <div class="modal-head">
        <button type="button" class="btn ghost icon-gh on-photo" data-share title="Meal teilen" aria-label="Meal teilen">${TOOL_ICONS.share}</button>
        <button type="button" class="btn ghost icon-gh on-photo" data-close aria-label="Schließen">✕</button>
      </div>
      <div class="ms-photo has-photo">
        <img src="${photoFor(initial)}" alt="${esc(initial.name || "")}">
        <div class="ms-photobar">
          <button type="button" class="ms-photobtn" data-photo-remove${isOwnPhoto ? "" : " hidden"}>Foto entfernen</button>
          <button type="button" class="ms-photobtn" data-photo>${isOwnPhoto ? "Foto ändern" : "Foto wählen"}</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="ms-head">
          <input type="text" id="f-name" class="ms-name" placeholder="Name des Meals" value="${esc(initial.name || "")}" maxlength="80">
          <select id="f-cat" class="ms-cat">${opts}</select>
        </div>
        <!-- Makro-Kacheln (Nachtrag Abnahme Phase 2, 08.08.2026): dieselbe .nutfacts-Optik
             wie im Nur-Lese-Zweig (mealStatsHtml) und auf der Karte, nur mit Eingabefeldern
             statt Text - kein eigener Ruhezustand mehr, siehe openMealSheet()-Kommentar. -->
        <div class="ms-nut" id="ms-nut">
          <div class="nut-total"><h4 class="sec-h">Makros gesamt <span class="hint" id="f-nut-hint" hidden></span> <button type="button" id="f-nut-reset" class="btn ghost sm" hidden>Automatisch übernehmen</button></h4></div>
          <div class="nutfacts nutfacts-edit">
            <div class="nf t-kcal"><div class="v"><input type="number" inputmode="numeric" id="f-kcal" min="0" max="99999" step="1" value="${initial.nutrition && initial.nutrition.kcal != null ? esc(initial.nutrition.kcal) : ""}" placeholder="520"><span class="u">kcal</span></div><label class="k" for="f-kcal">Kcal</label></div>
            <div class="nf t-carb"><div class="v"><input type="number" inputmode="decimal" id="f-carbs" min="0" max="9999" step="0.1" value="${initial.nutrition && initial.nutrition.carbs != null ? esc(initial.nutrition.carbs) : ""}" placeholder="60"><span class="u">g</span></div><label class="k" for="f-carbs">KH</label></div>
            <div class="nf t-prot"><div class="v"><input type="number" inputmode="decimal" id="f-protein" min="0" max="9999" step="0.1" value="${initial.nutrition && initial.nutrition.protein != null ? esc(initial.nutrition.protein) : ""}" placeholder="30"><span class="u">g</span></div><label class="k" for="f-protein">P</label></div>
            <div class="nf t-fat"><div class="v"><input type="number" inputmode="decimal" id="f-fat" min="0" max="9999" step="0.1" value="${initial.nutrition && initial.nutrition.fat != null ? esc(initial.nutrition.fat) : ""}" placeholder="18"><span class="u">g</span></div><label class="k" for="f-fat">F</label></div>
          </div>
        </div>
        <div class="ms-ings">
          <h4 class="sec-h">Zutaten</h4>
          <div id="f-ings"></div>
          <p class="ms-empty-ings" id="ms-ing-empty" hidden>Noch keine Zutaten</p>
          <!-- #f-ing-add ist der alte, versteckte "+ Weitere Zutat"-Knopf: updateMacroSum()
               (unveraendert uebernommen) schaltet weiterhin dessen hidden-Attribut, das
               Element bleibt aber dauerhaft unsichtbar (siehe CSS) - #ms-ing-add ist der
               sichtbare Einstieg der neuen Ansicht. -->
          <button type="button" class="btn sm" id="f-ing-add" hidden>+ Weitere Zutat</button>
          <button type="button" class="btn ghost ms-ing-add" id="ms-ing-add">+ Zutat hinzufügen</button>
          <input type="file" id="f-ing-barcode" accept="image/*" capture="environment" class="visually-hidden">
        </div>
        <div class="field">
          <label for="f-steps">Zubereitung <span class="hint">– optional</span></label>
          <textarea id="f-steps" placeholder="Beschreibe die Schritte …">${esc(initial.steps || "")}</textarea>
        </div>
        ${mealMetaEditHtml(initial)}
      </div>
      <!-- Fusszeile vereinheitlicht (Nachtrag Abnahme Phase 1): beide Knoepfe in einer
           Zeile, gleiche Bauform (Hoehe/Radius/Schrift), nur die Gewichtung unterscheidet
           sich - ms-danger bleibt ghost mit --accent-Text, Fertig bleibt primary. -->
      <div class="modal-foot">
        <button type="button" class="btn danger ms-danger" data-del>${isNew ? "Verwerfen" : "Meal löschen"}</button>
        <button class="btn primary" data-close>Fertig</button>
      </div>
    </div>`);

    // --- Autosave: input mutiert nur lokal, change/blur committen, 1500ms Leerlauf-Timer als Netz ---
    let idleTimer = null;
    // Hat sich in dieser Sitzung wirklich etwas geaendert? Nur dann muss die Ansicht
    // darunter nach dem Schliessen neu gezeichnet werden (siehe finishClose).
    //
    // NICHT einfach in commitNow() auf true setzen: Die Funktion laeuft auch beim blossen
    // Oeffnen-und-wieder-Schliessen - attemptClose() ruft sie, und jedes focusout ebenfalls,
    // auch wenn niemand etwas getippt hat. Der Wochenplan wuerde dann bei jedem Blick in ein
    // Meal komplett neu gezeichnet.
    //
    // Verglichen wird gegen den Stand BEIM OEFFNEN, nicht gegen den Stand kurz vor dem
    // Schreiben. Der erste Entwurf tat das und maass nichts: scheduleCommit() ruft
    // mutateLocal() bereits beim "input"-Ereignis, das nachfolgende commitNow() sah also
    // vorher wie nachher denselben, laengst geaenderten Wert. Die Marke blieb false, und der
    // Fehler sah behoben aus, ohne behoben zu sein.
    //
    // Die Signatur beschreibt AUSDRUECKLICH nur die Felder, die dieses Formular schreibt -
    // und in derselben normalisierten Form, in der mutateLocal() sie ablegt. Ein
    // canonJSON() ueber das ganze Objekt taugt dafuer NICHT:
    //   * mutateLocal() normalisiert nebenbei. Ein Meal ohne `steps` bekommt "", ein leeres
    //     `tags: []` wird geloescht. Das ist keine Nutzeraenderung, zaehlte aber als eine -
    //     und der Wochenplan wurde nach jedem blossen Hineinsehen neu gezeichnet.
    //   * `image` traegt bei einem eigenen Foto ein Base64-Bild. Der Vergleich waere ein
    //     megabytegrosser String; die beiden Foto-Knoepfe melden sich stattdessen selbst.
    //   * Felder, die dieses Formular gar nicht anfasst (`by`, `barcode`, `lib`, `quick`),
    //     gehen es nichts an.
    function sheetSig() {
      const r = rec();
      if (!r) return "";
      return canonJSON({
        name: r.name || "",
        category: r.category || "",
        ingredients: r.ingredients || [],
        nutrition: r.nutrition || null,
        steps: r.steps || "",
        tags: (r.tags && r.tags.length) ? r.tags : null,
        mealPrep: !!r.mealPrep
      });
    }
    // Einmal beim Oeffnen. Bei einem neuen Meal ist das die Signatur des leeren Entwurfs -
    // wer ihn unveraendert wieder schliesst, loest damit korrekt KEIN Neuzeichnen aus.
    const sigBeimOeffnen = sheetSig();
    let fotoGeaendert = false;
    function sheetDirty() { return fotoGeaendert || sheetSig() !== sigBeimOeffnen; }
    function mutateLocal() {
      const target = rec();
      if (!target) return;
      target.name = node.querySelector("#f-name").value;
      target.category = node.querySelector("#f-cat").value;
      target.ingredients = collectIngs();
      const kcal = nutParse(node.querySelector("#f-kcal").value);
      const carbs = nutParse(node.querySelector("#f-carbs").value);
      const protein = nutParse(node.querySelector("#f-protein").value);
      const fat = nutParse(node.querySelector("#f-fat").value);
      const hasAnyNut = kcal != null || carbs != null || protein != null || fat != null;
      target.nutrition = hasAnyNut ? { kcal, carbs, protein, fat } : null;
      target.steps = node.querySelector("#f-steps").value;
      // Merkmale (B6) aus den Schaltern lesen. Reihenfolge kommt aus RECIPE_TAG_KEYS und
      // damit aus der DOM-Reihenfolge - siehe sanitizeTags(): eine wechselnde Reihenfolge
      // waere ein Dauer-Diff gegen die Cloud. Leere Werte werden geloescht statt auf null
      // gesetzt, damit ein Meal ohne Merkmale genauso aussieht wie vorher.
      const tags = Array.from(node.querySelectorAll("#f-tags [data-tag]"))
        .filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.dataset.tag);
      if (tags.length) target.tags = tags; else delete target.tags;
      target.mealPrep = node.querySelector("#f-tags [data-flag='mealPrep']").getAttribute("aria-pressed") === "true";
    }
    function commitNow() {
      clearTimeout(idleTimer);
      mutateLocal();
      const name = node.querySelector("#f-name").value.trim();
      if (!name) return; // kein Speichern ohne Namen - siehe attemptClose() fuer die Sperre beim Schliessen
      if (isNew && !draftPushed) {
        draftPushed = true;
        draft.name = name;
        if (syncGid) draft.by = syncUid;
        if (pre && pre.barcode) draft.barcode = pre.barcode;
        state.recipes.push(draft);
        recId = draft.id;
        openSheetId = recId;
        openSheetRemovedCb = handleRemoteRemoval; // ab jetzt existiert ein echtes Dokument, das ein anderes Geraet loeschen koennte
        if (delBtn) delBtn.textContent = "Meal löschen";
        if (pre && pre.assignTo) {
          const { day, meal } = pre.assignTo;
          state.plan[day][meal].push(slotIsShared(day, meal) ? draft.id : makeEntry(draft.id, [syncUid]));
          pre.assignTo = null;
          toast("Meal angelegt und eingeplant");
        } else {
          toast("Meal angelegt");
        }
      }
      save();
      // Steht die Ansicht ueber der Meals-Liste, dort neu zeichnen (Teil-Repaint statt
      // render(), sonst faellt der Eingabefokus aus dem gerade offenen Feld). Steht sie ueber
      // dem Wochenplan, gibt es #r-groups nicht - dort wird NACH dem Schliessen gezeichnet,
      // siehe finishClose() in attemptClose().
      if (view.querySelector("#r-groups")) paintRecipeGroups();
    }
    function scheduleCommit() {
      mutateLocal();
      clearTimeout(idleTimer);
      idleTimer = setTimeout(commitNow, 1500);
    }
    // Delegation auf node statt pro Feld: "change"/"focusout" bubblen (anders als "blur")
    // und treffen dadurch automatisch auch jede spaeter per addIngRow() erzeugte
    // Zutatenzeile, ohne addIngRow() selbst anzufassen.
    // Merkmale sind Knoepfe, keine Formularfelder - sie loesen weder "input" noch "change"
    // aus und brauchen deshalb einen eigenen Klickweg. Sofort committen statt zu warten:
    // ein Tipp ist eine abgeschlossene Entscheidung, anders als ein halb getippter Name.
    node.addEventListener("click", e => {
      const chip = e.target.closest("#f-tags button");
      if (!chip) return;
      chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") === "true" ? "false" : "true");
      commitNow();
    });
    node.addEventListener("input", e => { if (e.target.matches("input, textarea, select")) scheduleCommit(); });
    node.addEventListener("change", e => { if (e.target.matches("input, textarea, select")) commitNow(); });
    node.addEventListener("focusout", e => { if (e.target.matches("input, textarea, select")) commitNow(); });

    // --- Schliessen: ueber closeModal() -> modalCloseHook (Escape/Backdrop/✕/Fertig laufen
    // alle darueber, siehe closeModal()) ---
    function draftHasContent() {
      if (node.querySelector("#f-steps").value.trim()) return true;
      if (collectIngs().length) return true;
      return ["f-kcal", "f-carbs", "f-protein", "f-fat"].some(fid => node.querySelector("#" + fid).value.trim());
    }
    function attemptClose() {
      if (openIngRowEl) closeIngRow(openIngRowEl); // offene Zutatenzeile zuerst zurueckschreiben
      const name = node.querySelector("#f-name").value.trim();
      if (!name) {
        if (isNew && !draftPushed && !draftHasContent()) {
          // leerer Entwurf: still verwerfen, nie in state.recipes gestanden
        } else {
          const nameInp = node.querySelector("#f-name");
          nameInp.focus(); nameInp.style.borderColor = "var(--danger)";
          toast("Bitte gib einen Namen ein");
          // closeModal() hat den Hook vor dem Aufruf geleert - ohne diese Zeile waere der
          // ZWEITE Schliessversuch ungeprueft durchgegangen und haette den Entwurf still
          // verworfen. Faellt seit D5 auf, weil die Zurueck-Taste denselben Weg nimmt.
          modalCloseHook = attemptClose;
          return false; // Schliessen bleibt aus
        }
      } else {
        commitNow();
      }
      openSheetId = null;
      openSheetRemovedCb = null;
      modalCloseHook = null;
      // Exit-Bewegung (Schritt 4): FLIP zurueck zur Karte bzw. am Handy das Herunterfahren
      // des Sheets, siehe useAnimExit/closeWithMotion oben.
      // recId statt id: ein frisch gespeicherter Entwurf (draftPushed) hat inzwischen eine
      // echte ID, unter der die Karte im Raster steht. Fokus geht erst NACH der Animation
      // zurueck (finishClose), sonst haette ein Screenreader schon "angekommen" gemeldet,
      // waehrend die Karte optisch noch waechst/schrumpft.
      // Das fehlende render(): Ueber dem WOCHENPLAN blieben die Zahlen nach dem Bearbeiten
      // stehen - die kcal je Slot-Karte, die Tagesbilanz und die klebende Leiste #day-bal.
      // Der Zustand war korrekt, nur die Anzeige alt, bis irgendetwas anderes neu zeichnete
      // (Reiterwechsel, Drag&Drop, ein Cloud-Snapshot). Der Kommentar in commitNow()
      // versprach dieses render() ausdruecklich - es hat nie existiert.
      //
      // Drei Dinge daran sind Absicht:
      //  * NICHT im Meals-Reiter: dort hat commitNow() ueber paintRecipeGroups() schon
      //    gezeichnet, ein zweiter Durchlauf waere doppelte Arbeit und ein sichtbarer Sprung.
      //  * VOR restoreFocusTarget(): das merkt sich einen KNOTEN, und render() ersetzt view
      //    komplett per innerHTML. Andersherum waere der gemerkte Knopf danach abgehaengt,
      //    closeModal() prueft document.contains() - und der Fokus fiele ins Nichts.
      //    (Der Plan sah "nach closeModal()" vor; das galt fuer ein render() VOR der
      //    Exit-Animation. finishClose laeuft ohnehin erst danach, siehe closeWithMotion.)
      //  * Nur bei echter Aenderung: sonst zeichnete jeder Blick in ein Meal den Wochenplan
      //    neu - commitNow() laeuft naemlich auch beim blossen Schliessen (siehe sheetDirty).
      function finishClose() {
        if (sheetDirty() && !view.querySelector("#r-groups")) render();
        restoreFocusTarget(recId);
        closeModal();
      }
      if (useAnimExit) closeWithMotion(node, recId, finishClose); else finishClose();
    }
    modalCloseHook = attemptClose;
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));

    // --- Gegenprobe: ein ANDERES Geraet loescht genau dieses Meal, waehrend die Ansicht
    // hier offen ist (siehe onRecipesRemote(), "removed"-Zweig). Keine stille
    // Wiederauferstehung gegen die fremde Loeschung - die Ansicht schliesst sich selbst,
    // mit einem Toast statt eines Autosaves ins Leere. modalCloseHook wird VOR closeModal()
    // geleert, sonst riefe closeModal() erneut attemptClose() (das versucht zu speichern,
    // obwohl rec() schon undefined ist). Kein FLIP-Exit: das Ursprungselement ist gerade
    // aus dem Raster verschwunden.
    function handleRemoteRemoval() {
      modalCloseHook = null;
      closeModal();
      toast("Dieses Meal wurde auf einem anderen Gerät gelöscht");
    }
    if (recId) openSheetRemovedCb = handleRemoteRemoval;

    // --- Teilen / Loeschen: Ansicht zuerst schliessen, dann die eigentliche Aktion (siehe
    // plans/MealAnsicht.MD und TROUBLESHOOTING #40 - kein await vor navigator.share) ---
    node.querySelector("[data-share]").addEventListener("click", () => {
      if (!recId) { toast("Bitte zuerst einen Namen eingeben"); return; }
      const shareId = recId;
      openSheetId = null; openSheetRemovedCb = null; modalCloseHook = null; closeModal();
      shareRecipeNow(shareId);
    });
    const delBtn = node.querySelector("[data-del]");
    delBtn.addEventListener("click", () => {
      const delId = recId;
      openSheetId = null; openSheetRemovedCb = null; modalCloseHook = null; closeModal();
      if (delId) deleteRecipe(delId); // Entwurf ohne recId war nie in state.recipes - nichts zu loeschen
    });

    // --- Foto: waehlen/aendern/entfernen, aktualisiert nur die offene Ansicht (photoDoneCb) ---
    const photoImg = node.querySelector(".ms-photo img");
    const photoBtn = node.querySelector("[data-photo]");
    const photoRemoveBtn = node.querySelector("[data-photo-remove]");
    photoBtn.addEventListener("click", () => {
      photoDoneCb = dataUrl => {
        const target = rec();
        if (!target) return;
        target.image = dataUrl;
        fotoGeaendert = true;   // sheetSig() laesst image bewusst aus - siehe dort
        commitNow();
        photoImg.src = photoFor(target);
        photoBtn.textContent = "Foto ändern";
        photoRemoveBtn.hidden = false;
        toast("Foto übernommen");
      };
      photoInput.click();
    });
    photoRemoveBtn.addEventListener("click", () => {
      const target = rec();
      if (!target) return;
      target.image = null;
      fotoGeaendert = true;   // wie beim Setzen: sheetSig() sieht image nicht
      commitNow();
      photoImg.src = photoFor(target);
      photoBtn.textContent = "Foto wählen";
      photoRemoveBtn.hidden = true;
    });

    // --- Zutaten-Zeilen (Name, Menge, Naehrwerte pro 100 g, Barcode-Scan) ---
    // addIngRow/rowData/collectIngs/paintNut/updateMacroSum/syncUnit/convertNutValues/
    // applyBarcode und die Autocomplete sind UNVERAENDERT aus dem fruehren openRecipeForm
    // uebernommen (siehe plans/MealAnsicht.MD) - sie lesen weiterhin ueber .value aus dem
    // DOM, unabhaengig davon, ob die Zeile gerade sichtbar ist. Neu ist ausschliesslich:
    // die zusaetzliche .ing-view-Anzeigezeile im Markup, paintIngView()/openIngEdit()/
    // closeIngRow() fuer den Ruhezustand/Bearbeiten-Wechsel, und je eine zusaetzliche
    // Zeile an drei Stellen (.ing-del-Klick, "+ Zutat hinzufuegen", Zeilen-Fokusverlust).
    const ingsWrap = node.querySelector("#f-ings");
    const barcodeInput = node.querySelector("#f-ing-barcode");
    let barcodeRow = null;
    let acSeq = 0; // laufende Nummer fuer die Listbox-IDs (aria-activedescendant)
    let openIngRowEl = null; // immer nur eine Zeile gleichzeitig im Bearbeiten-Zustand
    function nutVal(v) { return v != null ? esc(v) : ""; }
    function updateEmptyIngNote() {
      node.querySelector("#ms-ing-empty").hidden = ingsWrap.children.length > 0;
    }
    // Zeichnet die Ruhezustand-Anzeige einer Zeile aus rowData() - denselben Werten, die
    // auch collectIngs() sieht. qtyLabel()/ingContrib() sind die vorhandenen Helfer (4800/
    // 4792), hier bewusst wiederverwendet statt neu gebaut.
    function paintIngView(row) {
      const d = rowData(row);
      const o = (d && typeof d === "object") ? d : (d ? { name: d } : null);
      if (!o) return;
      const v = row.querySelector(".ing-view");
      v.querySelector(".ing-view-qty").textContent = nutNum(o.grams) ? qtyLabel(nutNum(o.grams), ingUnit(o)) : "";
      v.querySelector(".ing-view-name").textContent = o.name;
      const kcalEl = v.querySelector(".ing-view-kcal"), macEl = v.querySelector(".ing-view-macros");
      // Dieselbe Entscheidung wie in roIngRowHtml() - bewusst ueber ingShowsNut() und nicht
      // zweimal ausgeschrieben: Die beiden Ansichten zeigen dieselbe Zeile, und eine Regel
      // an zwei Stellen laeuft auseinander, sobald sie sich einmal aendert.
      if (ingShowsNut(o)) {
        const c = ingContrib(o);
        kcalEl.textContent = nfmt(c.kcal) + " kcal";
        macEl.innerHTML = macroLineHtml(c);
        kcalEl.hidden = false; macEl.hidden = false;
      } else {
        kcalEl.hidden = true; macEl.hidden = true;
      }
    }
    // Schreibt eine offene Zeile in den Ruhezustand zurueck. Ohne Namen war es eine leere,
    // gerade erst per "+ Zutat hinzufuegen" angelegte Zeile - die verschwindet wieder,
    // statt als leere Karte stehen zu bleiben.
    function closeIngRow(row) {
      if (!row.classList.contains("editing")) return;
      if (!rowData(row)) {
        row.remove();
        if (openIngRowEl === row) openIngRowEl = null;
        updateEmptyIngNote();
        commitNow();
        return;
      }
      row.classList.remove("editing");
      paintIngView(row);
      if (openIngRowEl === row) openIngRowEl = null;
    }
    function openIngEdit(row, focusName) {
      if (openIngRowEl && openIngRowEl !== row) closeIngRow(openIngRowEl);
      row.classList.add("editing");
      openIngRowEl = row;
      if (focusName) row.querySelector(".ing-name").focus();
    }
    function addIngRow(o) {
      o = o || {};
      if (o.unit == null && node.querySelector("#f-cat").value === "Getränk") o.unit = "ml";
      const u = ingUnit(o);
      // tabindex="-1": macht die Zeile programmatisch fokussierbar. Gebraucht beim Aufklappen
      // per Klick - siehe den Klick-Handler auf .ing-view-name weiter unten. Nicht entfernen.
      const row = el(`<div class="ing-row" tabindex="-1">
        <div class="ing-view">
          <span class="ing-view-qty"></span>
          <button type="button" class="ing-view-name"></button>
          <span class="ing-view-kcal" hidden></span>
          <span class="ing-view-macros" hidden></span>
          <button type="button" class="ing-view-del" title="Zutat entfernen" aria-label="Zutat entfernen">✕</button>
        </div>
        <div class="ing-top">
          <span class="ing-nrow">
            <span class="ing-nwrap">
              <input type="text" class="ing-name" placeholder="Zutat, z. B. Reis" maxlength="60" autocomplete="off" value="${esc(o.name || "")}">
              <ul class="ing-ac" role="listbox" hidden></ul>
            </span>

              <option value="el"${u === "el" ? " selected" : ""}>EL</option>
              <option value="tl"${u === "tl" ? " selected" : ""}>TL</option>

        </div>
        <details class="ing-nut">
          <summary class="ing-nsum">
            <span class="ing-ntitle">Makros <span class="ing-per">${ingPerLabel(u)}</span></span>
            <span class="ing-brief"></span>
          </summary>
          <div class="ing-vals">
            <label class="t-kcal"><span class="ing-lbl">Kcal</span><input type="number" class="ing-kcal" min="0" max="9999" step="1" value="${nutVal(o.kcal)}"></label>
            <label class="t-carb"><span class="ing-lbl">KH</span><input type="number" class="ing-carbs" min="0" max="999" step="0.1" value="${nutVal(o.carbs)}"></label>
            <label class="t-prot"><span class="ing-lbl">P</span><input type="number" class="ing-prot" min="0" max="999" step="0.1" value="${nutVal(o.protein)}"></label>
            <label class="t-fat"><span class="ing-lbl">F</span><input type="number" class="ing-fat" min="0" max="999" step="0.1" value="${nutVal(o.fat)}"></label>
          </div>
        </details>
        <div class="ing-done-row">
          <button type="button" class="btn ghost sm ing-done">Fertig</button>
        </div>
      </div>`);
      // Stretched-Link-Muster (Nachtrag Abnahme Phase 1, wie .rcard-open in Schritt 3):
      // .ing-view-name oeffnet die Zeile, .ing-view selbst hat keinen eigenen Klick-Handler
      // mehr - der Stift entfaellt, der Name uebernimmt seine Aufgabe.
      // Der Fokus MUSS hier in der Zeile landen, sonst klappt sie sofort wieder zu:
      // Der geklickte Knopf liegt in .ing-view, und openIngEdit() blendet .ing-view aus
      // (.ing-row.editing .ing-view { display:none }). Ein ausgeblendetes Element verliert
      // den Fokus an <body> -> der focusout-Handler unten sieht activeElement ausserhalb der
      // Zeile und ruft closeIngRow(). Oeffnen und Schliessen passierten im selben Tick.
      // Bewusst die Zeile selbst statt .ing-name: auf dem Handy wuerde ein fokussiertes
      // Textfeld die Tastatur aufziehen und die Naehrwertfelder verdecken, obwohl der Nutzer
      // vielleicht nur die Menge aendern will.
      row.querySelector(".ing-view-name").addEventListener("click", () => {
        openIngEdit(row);
        row.focus({ preventScroll: true });
      });
      // Sichtbarer Schliessweg (Nachtrag Abnahme Phase 1) neben den drei unsichtbaren
      // (Enter, Fokusverlust, andere Zeile oeffnen) - closeIngRow() schreibt die Zeile in
      // den Ruhezustand zurueck, siehe dort.
      row.querySelector(".ing-done").addEventListener("click", () => closeIngRow(row));
      // Entfernen gibt es an zwei Stellen: im Formular (.ing-del) und direkt in der
      // Anzeigezeile (.ing-view-del) - dieselbe Funktion, damit beide Wege nicht
      // auseinanderlaufen koennen.
      function removeRow() {
        row.remove();
        updateMacroSum();
        updateEmptyIngNote();
        if (openIngRowEl === row) openIngRowEl = null;
        commitNow();
      }
      row.querySelector(".ing-del").addEventListener("click", removeRow);
      // .ing-view-del ist ein Geschwister von .ing-view-name, nicht dessen Kind (Nachtrag
      // Abnahme Phase 1) - ein Klick bubbelt also nicht mehr in dessen Oeffnen-Handler,
      // stopPropagation() ist damit nicht mehr noetig.
      row.querySelector(".ing-view-del").addEventListener("click", removeRow);
      row.querySelector(".ing-barcode").addEventListener("click", () => { startBarcodeFlow(row); });
      // Kurzfassung fuer die zugeklappte Zeile. Die vier Felder bleiben im DOM und
      // werden nur ausgeblendet - rowData() liest sie unveraendert ueber .value.
      function paintNut() {
        const g = sel => nutParse(row.querySelector(sel).value);
        // Eine Nachkommastelle behalten: nfmt() rundet auf ganze Zahlen und machte
        // aus 0,6 g Fett eine 1.
        const nz = v => (Math.round(v * 10) / 10).toLocaleString("de-DE");
        const k = g(".ing-kcal"), kh = g(".ing-carbs"), p = g(".ing-prot"), fa = g(".ing-fat");
        const t = [];
        if (k != null) t.push(`<span class="ing-lbl t-kcal">${nfmt(k)} kcal</span>`);
        const macroLine = macroLineHtml({ carbs: kh, protein: p, fat: fa }, nz);
        if (macroLine) t.push(`<span class="ing-brief-macros">${macroLine}</span>`);
        // "–" statt eines Aufforderungstexts: Der Pfeil rechts zeigt bereits, dass sich
        // die Zeile oeffnen laesst, und "eintragen" war nicht zu unterscheiden von einem
        // Zustand ("leer"). Gleiches Zeichen wie beim leeren Auswahlrad im Onboarding.
        // k/kh/p/fa sind Zahlen aus nfmt()/nz()/macroLineHtml() (kein Nutzertext) -
        // innerHTML ist hier sicher.
        row.querySelector(".ing-brief").innerHTML = t.length ? t.join("") : "–";
      }
      row.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => { updateMacroSum(); paintNut(); }));
      // Einheit umstellen: Bezugsgroesse der Naehrwerte mitziehen. Bei Stueck gibt es keine
      // 100er-Basis — der Barcode-Scan liefert aber immer pro 100 g und stellt die Einheit
      // ohnehin selbst zurueck, deshalb bleibt der Knopf hier sichtbar.
      const uSel = row.querySelector(".ing-u");
      // Feste Umrechnung beim Wechsel zwischen "pro-100"-Einheiten (g/ml) und
      // Loeffelmassen (EL/TL) - 1 EL = 15 ml/g, 1 TL = 5 ml/g (Kuechen-Konvention,
      // Naeherung fuer Fluessigkeiten wie Feststoffe gleichermassen). "st" bleibt aussen
      // vor, wie bisher schon keine feste Bezugsgroesse.
      const UNIT_BASIS = { g: 100, ml: 100, el: 15, tl: 5 };
      let prevUnit = u; // Einheit VOR dem Wechsel, fuer die Umrechnung noetig
      function convertNutValues(oldUnit, newUnit) {
        if (oldUnit === newUnit || !(oldUnit in UNIT_BASIS) || !(newUnit in UNIT_BASIS)) return;
        const ratio = UNIT_BASIS[newUnit] / UNIT_BASIS[oldUnit];
        const kcalEl = row.querySelector(".ing-kcal"), carbsEl = row.querySelector(".ing-carbs"),
              protEl = row.querySelector(".ing-prot"), fatEl = row.querySelector(".ing-fat");
        const k = nutParse(kcalEl.value), kh = nutParse(carbsEl.value), p = nutParse(protEl.value), fa = nutParse(fatEl.value);
        if (k != null) kcalEl.value = Math.round(k * ratio);
        if (kh != null) carbsEl.value = Math.round(kh * ratio * 10) / 10;
        if (p != null) protEl.value = Math.round(p * ratio * 10) / 10;
        if (fa != null) fatEl.value = Math.round(fa * ratio * 10) / 10;
      }
      function syncUnit() {
        const cur = uSel.value;
        row.querySelector(".ing-per").textContent = ingPerLabel(cur);
        row.querySelector(".ing-g").placeholder = cur === "st" ? "2" : "200";
        updateMacroSum();
        paintNut();
      }
      // Umrechnung nur bei echtem Nutzer-Wechsel (change-Event) - nicht beim initialen
      // Zeilenaufbau und nicht in acPick() (setzt Einheit+Werte direkt aus der
      // Zutaten-Datenbank, ruft syncUnit() ohne change-Event auf).
      uSel.addEventListener("change", () => {
        const newUnit = uSel.value;
        convertNutValues(prevUnit, newUnit);
        prevUnit = newUnit;
        syncUnit();
      });
      syncUnit();

      // --- Zutaten-Suche (ARIA-Combobox auf dem Namensfeld) ---
      // Sucht in FOODS und fuellt bei Auswahl Einheit und alle vier Naehrwerte. Wer nichts
      // auswaehlt, tippt wie bisher frei weiter — die Liste ist ein Angebot, kein Zwang.
      const nameInp = row.querySelector(".ing-name");
      const acBox = row.querySelector(".ing-ac");
      const acId = "ing-ac-" + (++acSeq);
      acBox.id = acId;
      nameInp.setAttribute("role", "combobox");
      nameInp.setAttribute("aria-expanded", "false");
      nameInp.setAttribute("aria-autocomplete", "list");

      function acClose() {
