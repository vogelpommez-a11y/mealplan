  function firstName(n) { return String(n || "").trim().split(/\s+/)[0] || ""; }

  function normalizePlan(rawPlan, recipes) {
    const plan = makeEmptyPlan();
    const ids = new Set((recipes || []).map(r => r.id));
    if (rawPlan) DAYS.forEach(d => MEALS.forEach(m => {
      const raw = rawPlan[d.key] && rawPlan[d.key][m.key];
      plan[d.key][m.key] = asIdList(raw).filter(id => ids.has(id));
    }));
    return plan;
  }
  function normalizePlans(rawPlans, recipes) {
    const out = {};
    if (rawPlans && typeof rawPlans === "object") Object.keys(rawPlans).forEach(k => { out[k] = normalizePlan(rawPlans[k], recipes); });
    return out;
  }
  // Liefert das Wochen-Dictionary eines Datensatzes; toleriert das alte Einzelplan-Format.
  // ---------- Wochenplan flach <-> verschachtelt (fuer Gruppen-Dokumente) ----------
  // Ein Gruppen-Wochendokument speichert jeden Slot als eigenes Feld ("mon_fr", "sat_ab"),
  // damit zwei gleichzeitig planende Leute sich nicht gegenseitig ueberschreiben (siehe
  // die Begruendung bei window.CloudGroup). LEERE Slots werden bewusst NICHT geschrieben:
  // sonst legte jedes Betrachten einer noch leeren Woche 21 Felder an und jeder Wechsel
  // der Wochenansicht loeste einen Schreibvorgang aus.
  function flattenWeek(plan) {
    const out = {};
    if (!plan) return out;
    DAYS.forEach(d => MEALS.forEach(m => {
      const ids = plan[d.key] && plan[d.key][m.key];
      if (Array.isArray(ids) && ids.length) out[d.key + "_" + m.key] = ids.slice();
    }));
    return out;
  }
  // Gegenrichtung. Unbekannte Feldnamen (etwa "by", das den Schreiber mitfuehrt) werden
  // uebergangen - ein Wochendokument darf mehr enthalten als nur Slots.
  function unflattenWeek(fields) {
    const plan = makeEmptyPlan();
    if (!fields) return plan;
    DAYS.forEach(d => MEALS.forEach(m => {
      const ids = fields[d.key + "_" + m.key];
      if (Array.isArray(ids)) plan[d.key][m.key] = ids.filter(x => typeof x === "string");
    }));
    return plan;
  }

  function plansField(d) {
    if (d && d.plans && typeof d.plans === "object") return d.plans;
    if (d && d.plan) { const o = {}; o[weekKeyFor("cur")] = d.plan; return o; }
    return {};
  }
  // Vergleichs-Signatur ohne "tab" – ein reiner Tab-Wechsel soll keinen Cloud-Write auslösen.
  // "onboarded" gehoert dagegen hinein, sonst wuerde das Abschliessen der ersten Schritte
  // nie gepusht und der Ablauf startete auf jedem weiteren Geraet erneut. Die Normalisierung
  // auf !! ist wichtig: alte Konten haben das Feld nicht, undefined vs. false wuerde sie
  // sonst dauerhaft als "veraendert" erscheinen lassen und bei jedem Start einen Write ausloesen.
  // weights/weightGoals MUESSEN hier stehen: fehlen sie, sieht der Vergleich eine neue
  // Wiegung nie als Aenderung - sie wuerde nie in die Cloud gepusht (gleiche Falle wie
  // oben bei "onboarded" beschrieben).
  // KEIN "recipes"-Feld mehr: Rezepte leben seit dem Subcollection-Umbau in eigenen
  // Dokumenten (siehe syncRecipes()/onRecipesRemote()) und werden ueber lastPushedRecipes
  // separat verglichen. Wuerde hier trotzdem "recipes" auftauchen, laege state.recipes
  // (immer voll) permanent quer zu d.recipes (nie mehr vorhanden) - der Vergleich griffe
  // nie mehr, jeder Remote-Snapshot loeste unnoetig render()/Toast aus.
  // shopPersons gehoert mit hinein und MUSS durch den Sanitizer: alte Konten haben das Feld
  // nicht (undefined), der lokale State immer eine Zahl - ohne die Normalisierung auf 1
  // laege beides dauerhaft quer und jeder eingehende Snapshot galte als Aenderung
  // (dieselbe Falle wie oben bei "onboarded").
  // In einer Gruppe MUSS "plans" hier herausfallen: der Wochenplan liegt dann in
  // groups/{gid}/plans, waehrend das Konto-Dokument noch den eingefrorenen alten Stand
  // traegt. Bliebe das Feld drin, laege state.plans (= Gruppenplan) dauerhaft quer zu
  // data.plans (= alter Kontostand) - jeder eingehende Snapshot galte als Aenderung,
  // Endlos-Toast und Endlos-Push. Exakt die Falle, die oben schon fuer "recipes" steht.
  function dataJSON(d) { return JSON.stringify({ plans: syncGid ? null : plansField(d), goal: (d && d.goal) || null, shares: (d && d.shares) || [], onboarded: !!(d && d.onboarded), weights: (d && d.weights) || [], weightGoals: (d && d.weightGoals) || {}, profileImage: (d && d.profileImage) || null, weightConsent: (d && d.weightConsent) || noConsent(), shopPersons: sanitizeShopPersons(d && d.shopPersons), inviteCodes: (d && d.inviteCodes) || [], favs: sanitizeFavs(d && d.favs), deleted: sanitizeTombstones(d && d.deleted) }); }

  function scheduleCloudPush() {
    if (!syncUid) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 800);
  }
  // Firestore laesst pro Dokument hoechstens 1 MiB zu. Frueher lagen alle Meals samt
  // ihren Fotos in EINEM Dokument, die Grenze war mit ein paar Dutzend eigenen Bildern
  // erreicht. Seit dem Subcollection-Umbau (syncRecipes()) gilt die Grenze pro Rezept,
  // nicht mehr fuers ganze Konto - dieser Check bleibt trotzdem als Sicherheitsnetz fuers
  // (jetzt winzige) Hauptdokument bestehen, loest praktisch nie mehr aus.
  const CLOUD_DOC_MAX = 900000;      // Sicherheitsabstand zur 1-MiB-Grenze
  let cloudTooBigWarned = false;
  // Rezepte einzeln synchronisieren (users/{uid}/recipes/{id}), diff-basiert genau wie
  // der Rest des States: lastPushedRecipes ist die zuletzt bestaetigte Baseline (Map
  // id -> JSON-String). Nur was sich seitdem geaendert hat, wird geschrieben/geloescht -
  // keine der Rezept-Mutationsstellen (Formular, Loeschen, Foto-Upload, Import) muss
  // dafuer angefasst werden, sie rufen weiterhin nur render()/save() wie bisher.
  async function syncRecipes() {
    if (!syncUid || !window.CloudSync || !window.CloudSync.saveRecipesBatch) return;
    const cur = new Map(state.recipes.map(r => [r.id, JSON.stringify(r)]));
    const prev = lastPushedRecipes || new Map();
    const puts = [], delIds = [];
    cur.forEach((json, id) => {
      if (prev.get(id) === json) return;
      if (json.length > CLOUD_DOC_MAX) {
        toast(`Das Foto bei „${JSON.parse(json).name}" ist zu groß für die Cloud – wähle ein kleineres Bild.`);
        return; // dieses eine Rezept bleibt lokal, bis das Foto verkleinert wird
      }
      puts.push(JSON.parse(json));
    });
    prev.forEach((_, id) => { if (!cur.has(id)) delIds.push(id); });
    if (!puts.length && !delIds.length) { if (!lastPushedRecipes) lastPushedRecipes = cur; return; }
    try {
      await window.CloudSync.saveRecipesBatch(recipeBase(), puts, delIds);
      puts.forEach(r => prev.set(r.id, JSON.stringify(r)));
      delIds.forEach(id => prev.delete(id));
      lastPushedRecipes = prev; // dieselbe Map weiterfuehren, nie komplett ersetzen -
      // sonst koennte ein waehrend des await hereingekommener Remote-Change (onRecipesRemote
      // mutiert dieselbe Map) wieder verloren gehen.
      recipesSyncFailed = false;
    } catch (e) {
      // Still bleiben wie bei "offline" waere hier gefaehrlich: der Hauptdokument-Push
      // laeuft unabhaengig weiter und zeigt "synced", waehrend Rezeptfotos nie ankommen -
      // z.B. wenn die neue Firestore-Regel noch nicht veroeffentlicht wurde. Einmalig
      // melden, damit das nicht unbemerkt bleibt (analog cloudTooBigWarned oben).
      if (!recipesSyncFailed) {
        recipesSyncFailed = true;
        toast("Deine Meal-Fotos konnten gerade nicht mit der Cloud synchronisiert werden – wird automatisch erneut versucht.");
      }
      // lastPushedRecipes bleibt unveraendert -> naechster Zyklus versucht denselben Diff erneut
    }
  }
  // Gemeinsamen Wochenplan schreiben - diff-basiert wie syncRecipes(), nur auf Feldebene
  // statt auf Dokumentebene. lastPushedSlots ist die zuletzt bestaetigte Baseline
  // (Map "weekKey.slotFeld" -> JSON) und entscheidet, was ueberhaupt in den Patch kommt.
  //
  // Der Fall, der ohne Zutun falsch liefe: Ein GELEERTER Slot taucht in flattenWeek()
  // gar nicht mehr auf (bewusst so, siehe dort). Wuerde nur ueber die neuen Felder
  // iteriert, bliebe der alte Eintrag in der Cloud stehen - das Meal kaeme beim naechsten
  // Snapshot zurueck. Deshalb unten die zweite Schleife ueber die Baseline, die
  // verschwundene Felder ausdruecklich als leeres Array schreibt.
  async function pushGroupPlan() {
    if (!syncGid || !window.CloudGroup || !canEdit()) return;   // Nur-Ansehen schreibt nie
    const prev = lastPushedSlots || new Map();
    const weeks = Object.keys(state.plans || {});
    const patches = {};   // weekKey -> Feld-Patch
    const mark = (wk, field, json) => {
      (patches[wk] || (patches[wk] = {}))[field] = JSON.parse(json);
    };
    const seen = new Set();
    weeks.forEach(wk => {
      const flat = flattenWeek(state.plans[wk]);
      Object.keys(flat).forEach(field => {
        const key = wk + "." + field, json = JSON.stringify(flat[field]);
        seen.add(key);
        if (prev.get(key) !== json) mark(wk, field, json);
      });
    });
    // Was frueher belegt war und jetzt fehlt: aktiv leeren (siehe Kommentar oben).
    // Ist die GANZE Woche verschwunden (pruneWeeks raeumt vergangene Wochen weg), wird
    // stattdessen das ganze Dokument geloescht - sonst sammelten sich in der Gruppe
    // Woche fuer Woche tote Dokumente an, die niemand mehr liest.
    const deadWeeks = new Set();
    prev.forEach((_, key) => {
      if (seen.has(key)) return;
      const dot = key.indexOf(".");
      const wk = key.slice(0, dot), field = key.slice(dot + 1);
      if (weeks.indexOf(wk) === -1) { deadWeeks.add(wk); return; }
      mark(wk, field, "[]");
    });
    for (const wk of deadWeeks) {
      try {
        await window.CloudGroup.deletePlanWeek(syncGid, wk);
        Array.from(prev.keys()).forEach(k => { if (k.indexOf(wk + ".") === 0) prev.delete(k); });
      } catch (e) { /* naechster Zyklus versucht es erneut */ }
    }
    const wkList = Object.keys(patches);
    if (!wkList.length) { if (!lastPushedSlots) lastPushedSlots = prev; return; }
    try {
      for (const wk of wkList) {
        // "by" faehrt mit, damit der Empfaenger sagen kann, WER geaendert hat - Firestore
        // liefert den Schreiber nicht mit, und eine Serverseite gibt es hier nicht.
        await window.CloudGroup.savePlanWeek(syncGid, wk, Object.assign({}, patches[wk], { by: syncUid, at: Date.now() }));
        // Geleerte Felder aus der Baseline ENTFERNEN statt sie mit "[]" zu merken: sonst
        // faende die Schleife oben den Slot bei jedem weiteren Push erneut als "fehlt in
        // flattenWeek" und schriebe dieselbe Leerung endlos weiter - bei jedem render().
        // Die Baseline bleibt so deckungsgleich mit dem, was flattenWeek() liefert.
        Object.keys(patches[wk]).forEach(field => {
          const json = JSON.stringify(patches[wk][field]);
          if (json === "[]") prev.delete(wk + "." + field);
          else prev.set(wk + "." + field, json);
        });
      }
      lastPushedSlots = prev;   // dieselbe Map weiterfuehren, nie ersetzen (wie bei lastPushedRecipes)
    } catch (e) {
      // Baseline unveraendert lassen -> naechster Zyklus versucht denselben Diff erneut.
      setSyncStatus("offline");
    }
  }

  async function pushNow() {
    if (!syncUid || !window.CloudSync) return;
    await syncRecipes();
    await pushGroupPlan();
    const d = { tab: state.tab, goal: state.goal || null, shares: state.shares || [], onboarded: state.onboarded === true, weights: state.weights || [], weightGoals: state.weightGoals || {}, profileImage: state.profileImage || null, weightConsent: state.weightConsent || noConsent(), shopPersons: shopPersons(), groupId: syncGid || "", inviteCodes: state.inviteCodes || [], favs: sanitizeFavs(state.favs), deleted: sanitizeTombstones(state.deleted) };
    // In einer Gruppe wandert der Wochenplan nach groups/{gid}/plans - dann NICHT auch noch
    // ins Kontodokument schreiben. Dank merge:true bleibt das dortige "plans"-Feld als
    // Stand von vor dem Beitritt liegen; beim Verlassen wird der Gruppenplan bewusst
    // hineinkopiert (leaveGroup), statt ihn hier fortlaufend zu ueberschreiben.
    if (!syncGid) d.plans = state.plans;
    const j = dataJSON(d);
    if (j === lastPushedJSON) return;
    if (j.length > CLOUD_DOC_MAX) {
      // Nicht als "offline" ausgeben: das Problem loest sich nicht von selbst und
      // verlangt eine Entscheidung des Nutzers. Seit dem Subcollection-Umbau enthaelt
      // dieses Dokument keine Meal-Fotos mehr - der alte Text waere hier irrefuehrend,
      // treffen kann es jetzt nur noch sehr grosse Gewichtsverlaeufe/Freigabelisten/das
      // Profilbild.
      setSyncStatus("toobig");
      if (!cloudTooBigWarned) {
        cloudTooBigWarned = true;
        toast("Deine Kontodaten sind zu groß für die Cloud – neue Änderungen bleiben nur auf diesem Gerät.");
      }
      return;
    }
    cloudTooBigWarned = false;
    lastPushedJSON = j;
    setSyncStatus("saving");
    try {
      await window.CloudSync.save(syncUid, Object.assign({}, d, { updatedAt: Date.now() }));
      setSyncStatus("synced");
    } catch (e) {
      lastPushedJSON = null; setSyncStatus("offline"); /* z. B. offline – nächster Save versucht es erneut */
    }
  }
  function onRemote(data, pending) {
    // KEIN Array.isArray(data.recipes)-Check mehr: das Hauptdokument hat seit dem
    // Subcollection-Umbau nie mehr ein "recipes"-Feld. Wuerde der Check bleiben, wuerde
    // JEDER eingehende Snapshot dauerhaft ignoriert - Plan/Ziel/Gewichte/Profilbild
    // wuerden nie mehr geraeteuebergreifend synchronisiert.
    if (pending || !data) return; // eigener Schreibvorgang → ignorieren
    // Beitritt/Austritt auf einem ANDEREN Geraet: das Konto-Dokument ist der einzige Ort,
    // an dem beide Geraete sich darueber verstaendigen. Muss vor dem Vergleich unten
    // stehen und bricht hier ab - switchGroup() baut den Sync komplett neu auf.
    const remoteGid = typeof data.groupId === "string" && data.groupId ? data.groupId : null;
    if (remoteGid !== syncGid) { switchGroup(remoteGid); return; }
    const j = dataJSON(data);
    if (j === dataJSON(state) || j === lastPushedJSON) return; // nichts Neues
    // state.recipes wird hier NICHT mehr ersetzt - Rezepte kommen ausschliesslich ueber
    // onRecipesRemote() (eigener Listener auf die recipes-Subcollection).
    // In einer Gruppe kommt der Plan aus groups/{gid}/plans (onGroupPlansRemote) - das
    // Feld im Kontodokument ist dann der eingefrorene Stand von vor dem Beitritt und
    // wuerde den Gruppenplan ueberschreiben.
    if (!syncGid) state.plans = pruneWeeks(normalizePlans(plansField(data), state.recipes));
    state.goal = sanitizeGoal(data.goal);
    state.shares = unionIds(state.shares, data.shares); // nie einen Link verlieren, der nur lokal bekannt ist
    state.inviteCodes = unionIds(state.inviteCodes, data.inviteCodes); // desgleichen fuer Einladungscodes
    state.weights = mergeWeights(data.weights, state.weights); // desgleichen fuer Wiegungen
    state.weightGoals = Object.assign({}, sanitizeWeightGoals(state.weightGoals), sanitizeWeightGoals(data.weightGoals));
    state.weightConsent = mergeConsent(data.weightConsent, state.weightConsent); // juengste Entscheidung gewinnt
    if (data.profileImage !== undefined) state.profileImage = typeof data.profileImage === "string" ? data.profileImage : null;
    if (data.shopPersons !== undefined) state.shopPersons = sanitizeShopPersons(data.shopPersons);
    if (data.favs !== undefined) state.favs = sanitizeFavs(data.favs); // Cloud gewinnt, kein Union (siehe sanitizeFavs)
    // Grabsteine immer vereinigen, nie ersetzen: ein Loeschen, das dieses Geraet gerade erst
    // vorgemerkt und noch nicht gepusht hat, darf durch einen eingehenden Snapshot nicht
    // verschwinden - sonst kaeme das Meal genau auf dem Weg zurueck, den das hier verhindert.
    state.deleted = mergeTombstones(state.deleted, data.deleted);
    if (data.onboarded) state.onboarded = true;         // nur in eine Richtung, siehe startCloudSync
    setViewWeek(state.viewWeek);
    lastPushedJSON = j;
    save(); render(); renderProfileChip();
    setSyncStatus("synced");
    // Nicht bei jedem eingehenden Schreibvorgang melden: wer auf einem Geraet plant,
    // erzeugt alle 800 ms (Debounce von scheduleCloudPush) einen Push — auf dem zweiten
    // Geraet prasselten dann im Minutentakt Dutzende Meldungen. Der Stand ist ohnehin
    // schon uebernommen und der Sync-Punkt zeigt „synced"; die Meldung sagt nur, DASS
    // sich etwas von aussen geaendert hat, und dafuer reicht ein Hinweis pro Minute.
    const now = Date.now();
    if (now - lastRemoteToast >= REMOTE_TOAST_GAP) {
      lastRemoteToast = now;
      toast("Von anderem Gerät aktualisiert");
    }
  }
  // Eingehende Aenderungen aus der recipes-Subcollection (ein Eintrag je geaendertem/
  // geloeschtem Dokument, siehe watchRecipes()). Aktualisiert state.recipes granular
  // statt es komplett zu ersetzen, und haelt lastPushedRecipes synchron mit - sonst
  // wuerde der naechste eigene pushNow()-Zyklus denselben, gerade erst empfangenen
  // Stand fuer unveraendert halten oder ihn faelschlich erneut schreiben (Ping-Pong).
  function onRecipesRemote(changes) {
    let changed = false;
    changes.forEach(c => {
      if (c.pending) return; // eigener Schreibvorgang → ignorieren
      if (c.type === "removed") {
        if (getRecipe(c.id)) {
          state.recipes = state.recipes.filter(r => r.id !== c.id);
          dropRecipeIds(new Set([c.id])); // sonst bleibt auf diesem Geraet ein Geisterverweis im Wochenplan
          changed = true;
        }
        if (lastPushedRecipes) lastPushedRecipes.delete(c.id);
      } else {
        const incoming = sanitizeRecipe(Object.assign({}, c.data, { id: c.id }));
        if (!incoming) return;
        const json = JSON.stringify(incoming);
        // Traegt die ID einen Grabstein, ist das ein Nachzuegler: ein anderes Geraet hat das
        // Meal noch einmal geschrieben, bevor es die Loeschung gesehen hat. Nicht aufnehmen,
        // aber in die Baseline schreiben - dadurch faellt es beim naechsten syncRecipes()
        // unter delIds und verschwindet auch in der Cloud. Nur ausserhalb der Gruppe, dort
        // gibt es keine persoenlichen Grabsteine (siehe markDeleted).
        if (!syncGid && isDeleted(c.id)) { if (lastPushedRecipes) lastPushedRecipes.set(c.id, json); return; }
        const idx = state.recipes.findIndex(r => r.id === c.id);
        if (idx === -1) { state.recipes.push(incoming); changed = true; }
        else if (JSON.stringify(state.recipes[idx]) !== json) { state.recipes[idx] = incoming; changed = true; }
        if (lastPushedRecipes) lastPushedRecipes.set(c.id, json);
      }
    });
    if (changed) { save(); render(); }
  }

  // ---------- Empfaenger fuer die Gruppe ----------
  // Spiegelt onRecipesRemote(): pending-Filter, Baseline mitpflegen, Baseline nie ersetzen.
  // Das Mitpflegen ist der entscheidende Teil - ohne es hielte der naechste eigene
  // pushGroupPlan() den gerade empfangenen Stand fuer eine eigene Aenderung und schriebe
  // ihn zurueck (Ping-Pong zwischen zwei Geraeten).
  function onGroupPlansRemote(changes) {
    let changed = false;
    const touchedDays = [];
    let author = null;
    changes.forEach(c => {
      if (c.pending) return; // eigener Schreibvorgang → ignorieren
      if (c.type === "removed") {
        if (state.plans[c.week]) { delete state.plans[c.week]; changed = true; }
        if (lastPushedSlots) Array.from(lastPushedSlots.keys()).forEach(k => { if (k.indexOf(c.week + ".") === 0) lastPushedSlots.delete(k); });
        return;
      }
      const incoming = normalizePlan(unflattenWeek(c.fields), state.recipes);
      if (JSON.stringify(state.plans[c.week]) !== JSON.stringify(incoming)) {
        // Welcher Tag hat sich geaendert? Nur fuer die Meldung, deshalb bewusst grob.
        DAYS.forEach(d => {
          const before = state.plans[c.week] ? JSON.stringify(state.plans[c.week][d.key]) : null;
          if (before !== JSON.stringify(incoming[d.key]) && touchedDays.indexOf(d.label) === -1) touchedDays.push(d.label);
        });
        state.plans[c.week] = incoming;
        changed = true;
      }
      if (typeof c.fields.by === "string" && c.fields.by !== syncUid) author = c.fields.by;
      if (lastPushedSlots) {
        const flat = flattenWeek(incoming);
        Array.from(lastPushedSlots.keys()).forEach(k => { if (k.indexOf(c.week + ".") === 0) lastPushedSlots.delete(k); });
        Object.keys(flat).forEach(f => lastPushedSlots.set(c.week + "." + f, JSON.stringify(flat[f])));
      }
    });
    if (!changed) return;
    setViewWeek(state.viewWeek);
    save(); render();
    setSyncStatus("synced");
    const now = Date.now();
    if (now - lastRemoteToast < REMOTE_TOAST_GAP) return;
    lastRemoteToast = now;
    // Mit Namen, wenn die Gruppeneinstellung es will und der Schreiber bekannt ist -
    // sonst der neutrale Text. Ersetzt die Meldung, kommt nicht zusaetzlich.
    const who = author && groupSetting("changeHints") ? firstName((memberByUid(author) || {}).name) : "";
    if (who && touchedDays.length === 1) toast(who + " hat " + touchedDays[0] + " geändert");
    else if (who) toast(who + " hat den Plan geändert");
    else toast("Plan aktualisiert");
  }

  // Mitgliederliste: treibt den Avatar-Stack im Kopf und die eigene Rolle.
  function onMembersRemote(list) {
    groupMembers = Array.isArray(list) ? list : [];
    const me = memberByUid(syncUid);
    const roleBefore = myRole;
    if (!me) {
      // Aus der Gruppe entfernt worden - nicht stillschweigend weiterlaufen lassen,
      // sonst schriebe man ins Leere und wunderte sich, warum nichts ankommt.
      toast("Du bist nicht mehr Teil der Gruppe.");
      switchGroup(null);
      return;
    }
    myRole = me.role === "owner" || me.role === "edit" || me.role === "view" ? me.role : "view";
    renderProfileChip();
    if (groupModalRepaint) groupModalRepaint();   // offener Dialog zeigt sonst einen alten Stand
    // Ein Rollenwechsel aendert, welche Knoepfe ueberhaupt dastehen -> neu zeichnen.
    if (roleBefore !== myRole) {
      render();
      if (roleBefore) toast(myRole === "view" ? "Du kannst den Plan jetzt nur noch ansehen." : "Du kannst jetzt mitplanen.");
    }
  }

  function onGroupRemote(data) {
    groupInfo = data || null;
    renderProfileChip();
  }

  // Eine Gruppeneinstellung lesen. Standard so gewaehlt, dass eine alte Gruppe ohne
  // settings-Feld sich vernuenftig verhaelt.
  function groupSetting(key) {
    const s = (groupInfo && groupInfo.settings) || {};
    if (s[key] !== undefined) return s[key];
    return key === "changeHints";
  }

  // Winziges Abbild des Profilbilds fuer den Mitglieder-Eintrag. Das volle Bild (bis 640px)
  // gehoert NICHT in die Gruppe: es wuerde bei jedem Snapshot an alle Mitglieder
  // uebertragen, und angezeigt wird es dort nur als 26px-Kreis im Kopf.
  const MEMBER_AV = 64;
  function smallAvatar(dataUrl) {
    return new Promise(resolve => {
      if (!dataUrl || typeof dataUrl !== "string") { resolve(""); return; }
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = c.height = MEMBER_AV;
          c.getContext("2d").drawImage(img, 0, 0, MEMBER_AV, MEMBER_AV);
          resolve(c.toDataURL("image/jpeg", 0.7));
        } catch (e) { resolve(""); }
      };
      img.onerror = () => resolve("");
      img.src = dataUrl;
    });
  }

  // Eigenen Mitglieder-Eintrag aktuell halten (Name, kleines Bild). Die Rolle wird hier
  // NICHT mitgeschrieben - sie gehoert dem Inhaber, und die Firestore-Regel lehnt eine
  // Rollenaenderung an sich selbst ohnehin ab.
  // Die E-Mail steht bewusst nicht drin: sie ist die einzige Angabe, die die Person
  // ausserhalb der App identifizierbar macht, und die Datenschutzerklaerung sagt zu,
  // dass sie nicht geteilt wird.
  async function syncMyMember() {
    if (!syncGid || !window.CloudGroup || !syncUid) return;
    try {
      await window.CloudGroup.putMember(syncGid, syncUid, {
        name: profile.name || "",
        avatar: await smallAvatar(state.profileImage)
      });
    } catch (e) { /* nicht kritisch: Name/Bild sind Beiwerk, der Sync laeuft weiter */ }
  }

  // In den Gruppenmodus wechseln. Liefert false, wenn die Gruppe nicht (mehr) erreichbar
  // ist oder man kein Mitglied mehr ist - der Aufrufer laeuft dann persoenlich weiter.
  async function enterGroupSync(gid) {
    if (!gid || !window.CloudGroup || !window.CloudGroup.enabled) return false;
    try {
      const info = await window.CloudGroup.fetch(gid);
      // Die Gruppe ist weg (aufgeloest). dissolveGroup() raeumt inzwischen alle Mitglieder in
      // einem Batch mit auf, aber falls hier trotzdem noch ein eigener Eintrag haengt (aeltere,
      // vor diesem Fix aufgeloeste Gruppe; oder die Gruppe wurde ausserhalb der App entfernt):
      // aktiv nachraeumen statt nur lokal state.groupId zu leeren, sonst bliebe Name+Bild fuer
      // immer in einer nicht mehr existierenden Gruppe stehen.
      if (!info) {
        try { await window.CloudGroup.removeMember(gid, syncUid); } catch (e) {}
        return false;
      }
      const members = await window.CloudGroup.fetchMembers(gid);
      const me = members.filter(m => m.uid === syncUid)[0];
      if (!me) return false;                        // entfernt worden
      syncGid = gid;
      state.groupId = gid;    // mit syncGid synchron halten - save() persistiert es lokal
      groupInfo = info;
      groupMembers = members;
      myRole = me.role === "owner" || me.role === "edit" ? me.role : "view";

      // Meals der Gruppe ERSETZEN den lokalen Bestand, nicht ergaenzen: in einer Gruppe
      // ist die Gruppe die Wahrheit. Wuerde gemergt, saehe jeder zusaetzlich seine alten
      // Meals, die die anderen gar nicht haben - der Plan waere nicht mehr gemeinsam
      // lesbar. Die eigenen Meals sind beim Beitritt in die Gruppe kopiert worden.
      const gRecipes = sanitizeRecipes(await window.CloudSync.loadRecipes(["groups", gid]));
      state.recipes = gRecipes;
      lastPushedRecipes = new Map(gRecipes.map(r => [r.id, JSON.stringify(r)]));

      // Wochenplan der Gruppe uebernehmen (ebenfalls ersetzen, gleiche Begruendung).
      const weeks = await window.CloudGroup.loadPlans(gid);
      const plans = {};
      const slots = new Map();
      weeks.forEach(w => {
        const plan = normalizePlan(unflattenWeek(w.fields), state.recipes);
        plans[w.week] = plan;
        const flat = flattenWeek(plan);
        Object.keys(flat).forEach(f => slots.set(w.week + "." + f, JSON.stringify(flat[f])));
      });
      state.plans = pruneWeeks(plans);
      // Baseline aus dem geladenen Stand vorbefuellen statt leer lassen - sonst schriebe
      // der erste pushGroupPlan() nach jedem Login alle Slots erneut (gleiche Begruendung
      // wie bei lastPushedRecipes unten).
      lastPushedSlots = slots;
      setViewWeek(state.viewWeek);

      syncUnsubGroup = window.CloudGroup.watch(gid, onGroupRemote);
      syncUnsubMembers = window.CloudGroup.watchMembers(gid, onMembersRemote);
      syncUnsubGroupPlans = window.CloudGroup.watchPlans(gid, onGroupPlansRemote);
      syncUnsubRecipes = window.CloudSync.watchRecipes(["groups", gid], onRecipesRemote);
      syncMyMember();          // bewusst ohne await: Name/Bild duerfen den Start nicht aufhalten
      return true;
    } catch (e) {
      // Haeufigster Fall: die Firestore-Regeln sind noch nicht veroeffentlicht, jeder
      // Gruppen-Zugriff scheitert. Nicht still bleiben - sonst sieht der Nutzer nur einen
      // leeren Plan und haelt seine Daten fuer verloren.
      leaveGroupState();
      toast("Die Gruppe ist gerade nicht erreichbar – du planst vorerst für dich.");
      return false;
    }
  }

  // Nur den lokalen Gruppenzustand abbauen (Listener + Variablen), ohne die Cloud
  // anzufassen. Getrennt von leaveGroup(), das die Mitgliedschaft wirklich beendet.
  function leaveGroupState() {
    if (syncUnsubGroup) { try { syncUnsubGroup(); } catch (e) {} syncUnsubGroup = null; }
    if (syncUnsubMembers) { try { syncUnsubMembers(); } catch (e) {} syncUnsubMembers = null; }
    if (syncUnsubGroupPlans) { try { syncUnsubGroupPlans(); } catch (e) {} syncUnsubGroupPlans = null; }
    syncGid = null; groupInfo = null; groupMembers = []; myRole = null; lastPushedSlots = null;
  }

  // Gruppenwechsel zur Laufzeit (Beitritt/Austritt auf einem anderen Geraet, Kick).
  // Baut den Sync komplett neu auf - das ist ehrlicher als zu versuchen, den halben
  // Zustand umzubiegen, und passiert selten genug, dass die Sekunde nicht stoert.
  async function switchGroup(gid) {
    const uid = syncUid;
    if (!uid) return;
    stopCloudSync();
    state.groupId = gid || "";
    await startCloudSync(uid);
  }

  async function startCloudSync(uid) {
    if (!window.CloudSync || !window.CloudSync.enabled) { maybeStartOnboarding(); return; }
    if (syncUid === uid) return;                 // läuft schon
    stopCloudSync();
    syncUid = uid;
    setSyncStatus("connecting");
    await imagesReady;   // Paket A3: lokale Bilder muessen im State sein, bevor der Merge/pushNow
                         // laeuft - sonst schriebe der Baseline-Push bildlose Rezepte in die Cloud.
    try {
      const remote = await window.CloudSync.load(uid);
      // Vor dem Rezept-Merge und ausserhalb davon: ein Konto ohne Rezepte laeuft am Block
      // unten vorbei, haette die ersten Schritte aber trotzdem schon hinter sich. Und nur
      // in eine Richtung — waere das Flag zurueckziehbar, startete der Ablauf auf Geraet 2
      // erneut, solange Geraet 1 seinen Stand noch nicht hochgeschrieben hat.
      if (remote && remote.onboarded) state.onboarded = true;
      // Aus demselben Grund hier oben und nicht im Block darunter: wer sich wiegt, aber
      // (noch) keine Meals angelegt hat, verloere seinen Verlauf sonst beim Anmelden.
      if (remote) {
        state.weights = mergeWeights(remote.weights, state.weights);
        state.weightGoals = Object.assign({}, sanitizeWeightGoals(state.weightGoals), sanitizeWeightGoals(remote.weightGoals));
        state.weightConsent = mergeConsent(remote.weightConsent, state.weightConsent);
        if (remote.profileImage && typeof remote.profileImage === "string") { state.profileImage = remote.profileImage; renderProfileChip(); }
        // Cloud gewinnt: die Personenzahl ist eine Kontoeinstellung, kein Geraetezustand -
        // sonst ueberschriebe ein frisch angemeldetes zweites Geraet sie mit seiner 1.
        if (remote.shopPersons !== undefined) state.shopPersons = sanitizeShopPersons(remote.shopPersons);
        if (remote.favs !== undefined) state.favs = sanitizeFavs(remote.favs); // Cloud gewinnt, kein Union
        // Muss VOR dem Rezept-Merge stehen: der fragt die Grabsteine ab, um zu entscheiden,
        // was ueberhaupt noch in den Bestand darf.
        state.deleted = mergeTombstones(state.deleted, remote.deleted);
      }
      // Rezepte zusammenführen (Cloud + eigene lokale, die es dort noch nicht gibt).
      // Beispiel-Meals werden NICHT in ein bestehendes Konto übernommen – sie sind nur
      // ein einmaliges Willkommens-Angebot für neue Konten. Ausgelagert, weil sowohl der
      // Normalfall (Subcollection) als auch die Alt-Migration (Inline-Array) dieselbe
      // Logik brauchen.
      // Grabsteine entscheiden hier ueber beide Richtungen (siehe sanitizeTombstones):
      // ein Meal mit Grabstein kommt weder aus der Cloud noch aus dem lokalen Bestand
      // wieder herein. Kommt es aus der Cloud, bleibt es in lastPushedRecipes stehen und
      // wird vom gleich folgenden pushNow()/syncRecipes() dort ausgeraeumt - so heilt sich
      // auch ein Loeschen, dessen Push seinerzeit nie durchlief.
      function mergeRemoteRecipes(list) {
        const map = {};
        sanitizeRecipes(list).forEach(r => { if (r && r.id && !isDeleted(r.id)) map[r.id] = r; });
        state.recipes.forEach(r => { if (r && r.id && !map[r.id] && !isExample(r) && !isDeleted(r.id)) map[r.id] = r; });
        state.recipes = Object.values(map);
        const rp = pruneWeeks(normalizePlans(plansField(remote), state.recipes));
        Object.keys(state.plans).forEach(k => { if (!rp[k]) rp[k] = state.plans[k]; }); // lokale Wochen behalten, die es remote nicht gibt
        state.plans = pruneWeeks(rp);
        if (remote.goal) state.goal = sanitizeGoal(remote.goal); // Ziel aus der Cloud übernehmen; lokales bleibt, falls remote keins hat
        state.shares = unionIds(state.shares, remote.shares);
        setViewWeek(state.viewWeek);
        // state.tab bewusst NICHT aus remote uebernehmen — Start bleibt immer der Wochenplan
        save(); render();
      }
      // Rezepte kommen jetzt aus der eigenen Subcollection statt aus dem Hauptdokument.
      // remote.recipes (Alt-Format) wird nur noch als Migrations-Quelle genutzt, falls
      // die Subcollection noch leer ist - verschwindet von selbst, sobald der naechste
      // Hauptdokument-Push (ohne "recipes"-Feld) durchlaeuft. Beide Quellen zusammenfuehren
      // statt Entweder-Oder: bei einer nur TEILWEISE abgeschlossenen Migration (z.B. ein
      // anderes Geraet hat schon einen Teil in die Subcollection geschrieben, aber das
      // Hauptdokument-Feld noch nicht geleert) wuerden sonst die restlichen Alt-Rezepte
      // uebersehen. legacyRecipes zuerst, cloudRecipes danach - bei gleicher ID gewinnt
      // die frischere Subcollection-Version (mergeRemoteRecipes ueberschreibt in Reihenfolge).
      // Gehoert das Konto zu einer Gruppe? Dann kommen Plan UND Meals von dort, und der
      // Zusammenfuehr-Block darunter entfaellt komplett. Persoenlich bleiben Ziel,
      // Gewichte, Profilbild und die Freigabe-Kennungen - die stehen weiter im Konto.
      const wantGid = (remote && typeof remote.groupId === "string" && remote.groupId) ? remote.groupId : null;
      const inGroup = wantGid ? await enterGroupSync(wantGid) : false;
      // Als Mitglied entfernt worden, waehrend dieses Geraet offline war: das Feld lokal
      // raeumen, sonst versucht es der naechste Start wieder.
      if (wantGid && !inGroup) state.groupId = "";

      if (inGroup) {
        if (remote.goal) state.goal = sanitizeGoal(remote.goal);
        state.shares = unionIds(state.shares, remote.shares);
        save(); render();
      } else {
        const cloudRecipes = window.CloudSync.loadRecipes ? await window.CloudSync.loadRecipes(["users", uid]) : [];
        const legacyRecipes = (remote && Array.isArray(remote.recipes)) ? remote.recipes : [];
        // Auch unabhaengig vom Merge unten: liegt hier noch ein Meal, das laut Grabstein
        // geloescht ist (Loeschung auf einem anderen Geraet, dieses war offline), muss es
        // raus, BEVOR pushNow() es wieder in die Cloud traegt. Der Merge-Zweig deckt nur
        // den Fall ab, dass die Cloud ueberhaupt Rezepte hat.
        const tombIds = Object.keys(state.deleted || {});
        if (tombIds.length) {
          state.recipes = state.recipes.filter(r => r && r.id && !isDeleted(r.id));
          dropRecipeIds(new Set(tombIds));   // Plan- und Favoritenverweise gleich mitraeumen
        }
        if (cloudRecipes.length || legacyRecipes.length) mergeRemoteRecipes(legacyRecipes.concat(cloudRecipes));
        // Baseline aus dem geladenen Cloud-Stand vorbefuellen statt auf null zu setzen:
        // so schreibt der folgende pushNow()-Lauf nur, was wirklich neu/geaendert ist
        // (Migration UND Normalfall gleichermassen abgedeckt), statt bei JEDEM Login alle
        // Rezepte erneut zu schreiben.
        lastPushedRecipes = new Map(cloudRecipes.map(r => [r.id, JSON.stringify(r)]));
        syncUnsubRecipes = window.CloudSync.watchRecipes ? window.CloudSync.watchRecipes(["users", uid], onRecipesRemote) : null;
      }
      lastPushedJSON = null;
      await pushNow();                            // zusammengeführten Stand als Baseline hochschreiben
      // Sperrfrist gleich mitstarten: direkt nach dem Verbinden sagt schon „Mit deiner
      // Cloud verbunden", dass Daten hereingekommen sind — ein zweiter Hinweis darauf
      // waere in derselben Sekunde nur Laerm.
      lastRemoteToast = Date.now();
      syncUnsub = window.CloudSync.watch(uid, onRemote);
      setSyncStatus("synced");
      toast(syncGid ? "Mit eurer Gruppe verbunden" : "Mit deiner Cloud verbunden");
      // Erst JETZT ueber die ersten Schritte entscheiden: enterApp() laeuft schon, waehrend
      // dieser Aufruf noch unterwegs ist. Wer den Ablauf dort startete, bekaeme ihn bei jedem
      // Login auf einem neuen Geraet kurz zu sehen, bevor das Flag aus der Cloud eintrifft.
      maybeStartOnboarding();
    } catch (e) {
      setSyncStatus("offline"); /* offline: App läuft lokal weiter, Sync greift beim nächsten Mal */
      maybeStartOnboarding();   // ohne Cloud entscheidet der lokale Stand
    }
  }
  function stopCloudSync() {
    if (syncUnsub) { try { syncUnsub(); } catch (e) {} syncUnsub = null; }
    if (syncUnsubRecipes) { try { syncUnsubRecipes(); } catch (e) {} syncUnsubRecipes = null; }
    leaveGroupState();   // Gruppen-Listener haengen sonst weiter und schreiben in den alten Zustand
    clearTimeout(pushTimer);
    syncUid = null; lastPushedJSON = null; lastPushedRecipes = null; recipesSyncFailed = false;
    setSyncStatus("off");
  }

  // Sync-Status für die Anzeige: "off" | "connecting" | "synced" | "saving" | "offline" | "toobig"
  let syncStatus = "off";
  function syncStatusInfo() {
    return ({
      connecting: { cls: "busy", label: "Verbinde …" },
      synced:     { cls: "ok",   label: "Synchronisiert" },
      saving:     { cls: "busy", label: "Wird gespeichert …" },
      offline:    { cls: "err",  label: "Offline – lokal gespeichert" },
      toobig:     { cls: "err",  label: "Zu viele Fotos für die Cloud" },
      off:        { cls: "off",  label: "Nicht verbunden" }
    })[syncStatus] || { cls: "off", label: "Nicht verbunden" };
  }
  function setSyncStatus(s) {
    if (syncStatus === s) return;
    syncStatus = s;
    updateSyncUI();
  }
  function updateSyncUI() {
    const info = syncStatusInfo();
    document.querySelectorAll("[data-sync-dot]").forEach(elm => {
      elm.classList.remove("ok", "busy", "err", "off");
      elm.classList.add(info.cls);
      elm.title = "Cloud-Sync: " + info.label;
    });
    document.querySelectorAll("[data-sync-label]").forEach(elm => { elm.textContent = info.label; });
  }

  function uid() { return "r" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  // Waehrend eines Render-Durchlaufs wird sehr oft nach Rezepten gesucht (jeder Slot,
  // jede Tagesbilanz). Der Index macht daraus einen Map-Zugriff statt einer linearen
  // Suche. Er lebt bewusst NUR innerhalb von render(): dort mutiert state.recipes nicht,
  // ausserhalb koennte er veralten - deshalb faellt getRecipe dann auf die Suche zurueck.
  let recipeIndex = null;
  function getRecipe(id) {
    if (recipeIndex) return recipeIndex.get(id) || null;
    return state.recipes.find(r => r.id === id) || null;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

  // ---------- Zahleneingabe: Rad am Handy, Tastatur am Rechner ----------
  // Ein <select> rendert Safari auf dem iPhone als natives Auswahlrad (UIPickerView),
  // Android als Auswahlliste. Am Rechner waere ein Aufklappmenue mit 150 Eintraegen
  // dagegen langsamer als zwei Tastenanschlaege — dort bleibt es beim Zahlenfeld.
  // Gefragt wird das Eingabegeraet ("pointer: coarse" = Finger), NICHT der User-Agent:
  // Kennungen luegen, und ein Tablet mit Maus soll die Tastatur-Variante bekommen.
  function coarsePointer() {
    try { return window.matchMedia("(pointer: coarse)").matches; } catch (e) { return false; }
  }

  // Liefert je nach Eingabegeraet <input type="number"> ODER <select> — beide mit
  // derselben id. Auslesende Stellen lesen weiterhin nur .value und brauchen nicht
  // zu wissen, was davon gerendert wurde.
  // Wichtig: Ein vorhandener Wert, der nicht auf dem Raster liegt (z. B. 82,4 kg bei
  // Ganzzahl-Schritten), wird als eigene Option ergaenzt — sonst faellt er beim
  // Rendern still auf einen Nachbarwert und die Eingabe des Nutzers waere verfaelscht.
  // ACHTUNG bei o.extra: Der Wert wird als fertiges Attribut eingesetzt und deshalb
  // NICHT escaped — esc() wuerde die Anfuehrungszeichen zerstoeren und das Attribut
  // unbrauchbar machen. Hier darf ausschliesslich hartkodierter Text hinein, niemals
  // etwas aus Nutzereingaben oder gespeicherten Daten.
  // o.step muss ein glatter Wert sein (1, 5, 0.1) - die Nachkommastellen werden aus
  // seiner Textdarstellung abgeleitet.
  //
  // Ab wie vielen Eintraegen das Rad umschlaegt: Dieselbe Abwaegung wie am Rechner, nur
  // spaeter. Ein Rad gewinnt, solange man das Ziel im Vorbeiziehen sieht - beim Gewicht
  // (30-400 kg in 0,1er-Schritten) waeren es 3.701 Eintraege, und bis 82,4 kg muesste man
  // 525 Zeilen weit scrollen. Auf dem iPhone federt das Schwungrad das noch ab, Android
  // rendert eine schlichte Liste: dort war die Eingabe im Test unbenutzbar. Ab dieser
  // Grenze ist Tippen schneller, deshalb dann auch am Handy das Zahlenfeld.
  // 200 liegt bewusst zwischen Groesse (151 Eintraege, bleibt Rad) und dem ganzzahligen
  // Gewicht (371) - Alter (111) und Trainingsdauer (47) bleiben ebenfalls Rad.
  const PICKER_MAX_OPTIONS = 200;
  function numField(o) {
    const step = o.step || 1;
    const val = (o.value == null || o.value === "") ? "" : String(o.value);
    const cls = o.cls ? ` class="${o.cls}"` : "";
    const extra = o.extra ? " " + o.extra : "";
    // In Ganzzahlen rechnen: 0.1er-Schritte per Addition sammeln Rundungsfehler an.
    // Steht vor der Verzweigung, weil schon das Abzaehlen der Eintraege es braucht.
    const f = step < 1 ? Math.round(1 / step) : 1;
    const lo = Math.round(o.min * f), hi = Math.round(o.max * f), sp = Math.round(step * f);
    const optionCount = Math.floor((hi - lo) / sp) + 1;
    if (!coarsePointer() || optionCount > PICKER_MAX_OPTIONS) {
      return `<input type="number" id="${o.id}"${cls} min="${o.min}" max="${o.max}" step="${step}"`
        + ` inputmode="${step < 1 ? "decimal" : "numeric"}" placeholder="${esc(o.placeholder || "")}"`
        + ` value="${esc(val)}"${extra}>`;
    }
    // NICHT runden: Ein gespeichertes 82,4 wuerde sonst auf 82 einrasten und der Wert
    // waere ohne Zutun des Nutzers veraendert. Verglichen wird mit Toleranz, weil
    // 82.4 * 10 in Gleitkomma 824.0000000000001 ergibt.
    const num = val === "" ? null : parseFloat(val) * f;
    let onGrid = false, out = "";
    // Der value bleibt mit Punkt (parseFloat liest ihn), nur die Anzeige bekommt das
    // im Deutschen uebliche Komma — "82,4 kg" im Rad, "82.4" im Datenmodell.
    const de = t => t.replace(".", ",");
    for (let v = lo; v <= hi; v += sp) {
      const shown = f === 1 ? String(v) : (v / f).toFixed(String(step).split(".")[1].length);
      const sel = (num != null && Math.abs(num - v) < 1e-6) ? (onGrid = true, " selected") : "";
      out += `<option value="${shown}"${sel}>${de(shown)}${o.unit ? " " + esc(o.unit) : ""}</option>`;
    }
    // Wert vorhanden, aber nicht auf dem Raster: unveraendert als eigene Option.
    if (num != null && !onGrid) {
      out = `<option value="${esc(val)}" selected>${de(esc(val))}${o.unit ? " " + esc(o.unit) : ""}</option>` + out;
    }
    // Eigener Platzhaltertext fuers Rad: Im Zahlenfeld ist "0" ein grauer Hinweis,
    // als Option saehe dasselbe "0" wie ein bereits gewaehlter Wert aus.
    const ph = `<option value=""${val === "" ? " selected" : ""}>${esc(o.pickerPlaceholder || o.placeholder || "Bitte wählen")}</option>`;
    return `<select id="${o.id}"${cls}${extra}>${ph}${out}</select>`;
  }

  // ---------- Sicherheitsnetz fuer fremde Bilddaten ----------
  // Ein Meal-Foto landet als data-URL direkt in einem src="..."-Attribut. Kaeme dort
  // ein fremder String an (etwa aus einem geteilten Plan), koennte er mit einem
  // Anfuehrungszeichen aus dem Attribut ausbrechen und eigenes JavaScript einschleusen.
  // Deshalb hier die strenge Gegenprobe: NUR echte Base64-Bild-URLs passieren, und
  // deren Alphabet (A-Z a-z 0-9 + / =) enthaelt per Definition kein Anfuehrungszeichen.
  // Angewendet an JEDEM Punkt, an dem Rezepte von aussen hereinkommen (localStorage,
  // Cloud, geteilte Plaene) - eigene Uploads erzeugt canvas.toDataURL ohnehin sauber.
  // Regex bewusst IM Funktionskoerper: safeImage wird schon von load() gebraucht, das
  // weit oben laeuft - eine const hier oben waere zu diesem Zeitpunkt noch nicht
  // initialisiert (Temporal Dead Zone) und wuerde das ganze Script abbrechen.
  function safeImage(v) {
    return (typeof v === "string" && /^data:image\/(jpeg|jpg|png|gif|webp);base64,[A-Za-z0-9+/]+=*$/.test(v)) ? v : null;
  }
  // Ein komplettes Rezept aus fremder Quelle auf unbedenkliche Werte bringen.
  function sanitizeRecipe(r) {
    if (!r || typeof r !== "object") return null;
    const out = Object.assign({}, r);
    out.image = safeImage(r.image);
    if (out.category) out.category = migrateCat(out.category);
    if (Array.isArray(r.ingredients)) out.ingredients = r.ingredients.map(sanitizeIng).filter(Boolean);
    return out;
  }
  function sanitizeRecipes(list) { return Array.isArray(list) ? list.map(sanitizeRecipe).filter(Boolean) : []; }

  // ---------- Strich-Icons fuer die Kategorie-Ueberschriften ----------
  // Nur diese sechs werden gebraucht; Meals selbst zeigen immer ein Foto (siehe photoFor).

    // Zweite Verteidigungslinie unmittelbar vor der Ausgabe: der Wert landet gleich
    // ungeschuetzt in einem src="..."-Attribut. Die Eingangspunkte filtern bereits
    // (sanitizeRecipes/safeImage), aber ein kuenftig neu hinzukommender Pfad, der
    // r.image setzt, waere hier automatisch mitabgesichert - statt die Luecke erneut
    // zu oeffnen. Greift nur fuer eigene Fotos; die mitgelieferten PHOTOS sind
    // Konstanten aus dieser Datei und brauchen keine Pruefung.
    if (r.image) { const ok = safeImage(r.image); if (ok) return ok; }
    const n = (r.name || "").toLowerCase();
    for (const [keys, key] of PHOTO_RULES) { if (keys.some(k => n.includes(k)) && PHOTOS[key]) return PHOTOS[key]; }
    const byCat = CAT_PHOTO[r.category];
    if (byCat && PHOTOS[byCat]) return PHOTOS[byCat];
    return PHOTOS.neutral;
  }
  // Bewertet die Makro-Verteilung ueber den Kalorienanteil (Protein/Kohlenhydrate x4,
  // Fett x9) und liefert 0 bis 2 Badges fuer die Meal-Karte: ein Haupt-Badge fuer das
  // dominante Makro und optional "Low Carb" als Zusatz. Ausgewogene Gerichte bekommen
  // bewusst gar keines - sonst traegt das Badge keine Information mehr.
  function macroBadges(r) {
    const n = recipeNut(r);
    const macroKcal = n.carbs * 4 + n.protein * 4 + n.fat * 9;
    // Unter ~100 kcal ist ein Makro-Anteil reines Rauschen: ein Kaffee mit einem Schuss
    // Milch (je 1 g Makro) kaeme sonst auf 53 % Fettanteil und waere "Fettreich".
    // Prozentual richtig, als Aussage ueber das Gericht aber falsch.
    if (macroKcal < 100) return [];
    const proteinShare = (n.protein * 4) / macroKcal;
    const carbShare = (n.carbs * 4) / macroKcal;
    const fatShare = (n.fat * 9) / macroKcal;
    const out = [];
    // Haupt-Badge: nur eines von beiden. Protein geht vor Fett - ein fettreiches
    // Gericht mit viel Eiweiss ist fuer den Trainingsplan zuerst eine Eiweissquelle.
    if (proteinShare >= 0.30) out.push({ label: "Proteinreich", cls: "good" });
    else if (fatShare >= 0.45) out.push({ label: "Fettreich", cls: "fat" });
    // Zusatz-Badge, nicht Ersatz. Anteil UND absolute Menge muessen niedrig sein:
    // 15 % einer 1400-kcal-Portion waeren 52 g Kohlenhydrate - kein Low Carb mehr.
    // Steht nie allein: bei <=15 % Kohlenhydraten ergeben Protein + Fett zwingend
    // >=85 %, damit ist immer eine der beiden Schwellen oben gerissen.
    if (carbShare <= 0.15 && n.carbs <= 20) out.push({ label: "Low Carb", cls: "good" });
    return out;
  }
  function cardImageHtml(r) {
    const mb = macroBadges(r);
    const badges = mb.length
      ? `<div class="mbadges">${mb.map(b => `<span class="mbadge ${b.cls}">${esc(b.label)}</span>`).join("")}</div>`
      : "";
    // Keine Kategorie-Chip mehr im Bild: die Karten stehen bereits unter ihrer
    // Kategorie-Ueberschrift gruppiert - die Angabe war doppelt.
    return `<div class="rimg has-photo">${badges}<img class="rphoto" src="${photoFor(r)}" alt="${esc(r.name)}" loading="lazy"></div>`;
  }
  function thumbHtml(r, cls) {
    return `<img class="${cls}" src="${photoFor(r)}" alt="" loading="lazy">`;
  }
  // read a file and downscale to <=640px JPEG data URL (keeps localStorage small)
  function readAndDownscale(file, cb) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640, scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL("image/jpeg", 0.82)); } catch (err) { cb(null); }
      };
      img.onerror = () => cb(null);
      img.src = e.target.result;
    };
    reader.onerror = () => cb(null);
    reader.readAsDataURL(file);
  }

  // ---------- Rendering ----------
  const view = document.getElementById("view");

  // Reiter des letzten Durchlaufs. Ein Reiterwechsel soll oben beginnen, jeder andere
  // Neuaufbau (Meal eingeplant, entfernt, Woche gewechselt) soll die Position halten.
  let lastRenderTab = null;

  function render() {
    // Solange die ersten Schritte laufen, gehoert <main> ihnen. render() kommt aus mehreren
    // Richtungen, die waehrenddessen ganz normal weiterlaufen: onRemote() beim ersten
    // Firestore-Snapshot (und bei jeder Aenderung von einem anderen Geraet) und enterApp(),
    // weil onAuthStateChanged beim Anmelden regelmaessig MEHRFACH feuert. Ohne diese Sperre
    // blitzte der Ablauf nur kurz auf und wurde sofort vom Wochenplan ueberschrieben.
    // Der Zustand wird trotzdem uebernommen - nur gezeichnet wird er erst nach dem Abschluss,
    // denn finishOnboarding() ruft render() selbst auf.
    if (onb) return;
    hoveredCardId = null; // Kartenknoten werden gleich ersetzt - alte Hover-Referenz waere sonst veraltet
    // Gleiche Ueberlegung fuer den Tastaturfokus: liegt er gerade auf einem Element in
    // <main>, wird dieses gleich mitsamt innerHTML ersetzt und der Fokus faellt auf
    // <body>. Das trifft besonders den Weg "Loeschen bestaetigen" - closeModal() gibt
    // den Fokus zwar an den ausloesenden Knopf zurueck, aber der verschwindet direkt
    // danach mit dem Neuaufbau. Deshalb hier merken und unten auffangen.
    const focusWasInView = view.contains(document.activeElement);
    // Scrollposition ueber den Neuaufbau retten. view.innerHTML = … wirft den ganzen
    // Inhalt weg, der Browser klemmt die Position dabei auf 0 – nach dem Einplanen
    // eines Meals landete man deshalb wieder ganz oben. Waagerecht gilt dasselbe fuer
    // die Handy-Karussells: sonst springt man von Donnerstag zurueck auf Montag.
    const sameTab = lastRenderTab === state.tab;
    lastRenderTab = state.tab;
    const keepY = sameTab ? window.scrollY : 0;
    const weekEl = view.querySelector(".week"), wgEl = view.querySelector(".wg-cols");
    const keepWeekX = sameTab && weekEl ? weekEl.scrollLeft : 0;
    const keepWgX = sameTab && wgEl ? wgEl.scrollLeft : 0;
    // Caches nur fuer die Dauer dieses Durchlaufs aufspannen; finally stellt sicher,
    // dass sie auch bei einem Fehler nicht als veraltete Kopie zurueckbleiben.
    recipeIndex = new Map(state.recipes.map(r => [r.id, r]));
    dayNutCache = {};
    try {
      document.getElementById("recipe-count").textContent = state.recipes.length;
      document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
      if (state.tab === "recipes") renderRecipes();
      else if (state.tab === "plan") renderPlan();
      else renderHome();
    } finally {
      recipeIndex = null;
      dayNutCache = null;
    }
    // Fokus nur dann einfangen, wenn er beim Neuaufbau tatsaechlich verloren ging -
    // der aktive Reiter ist ein stabiler Anker, von dem aus man weitertabben kann.
    if (focusWasInView && (!document.activeElement || document.activeElement === document.body)) {
      const t = document.querySelector('.tab[aria-selected="true"]');
      if (t) t.focus();
    }
    // Erst jetzt zuruecksetzen – der neue Inhalt steht, die Seite ist wieder hoch genug.
    // Ohne Sanftlauf: das hier ist Wiederherstellen, keine Bewegung, die jemand sehen soll.
    const newWeek = view.querySelector(".week"), newWg = view.querySelector(".wg-cols");
    if (keepWeekX && newWeek) newWeek.scrollLeft = keepWeekX;
    if (keepWgX && newWg) newWg.scrollLeft = keepWgX;
    window.scrollTo(0, keepY);
    save();
  }

  function planStats() {
    let filled = 0;
    DAYS.forEach(d => MEALS.forEach(m => { if (state.plan[d.key][m.key].length) filled++; }));
    return filled;
  }

  // ---------- Nährwerte ----------
  function nutNum(x) { const n = Number(x); return isFinite(n) && n > 0 ? n : 0; }
  function nutParse(v) { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) && n >= 0 ? n : null; }
  function recipeNut(r) { const n = (r && r.nutrition) || {}; return { kcal: nutNum(n.kcal), carbs: nutNum(n.carbs), protein: nutNum(n.protein), fat: nutNum(n.fat) }; }
  function addNut(a, b) { return { kcal: a.kcal + b.kcal, carbs: a.carbs + b.carbs, protein: a.protein + b.protein, fat: a.fat + b.fat }; }
  // Die Tagesbilanz wird pro Render mehrfach gebraucht (Wochensumme, Ringe, Tageskarte,
  // Zaehlung der geplanten Tage). Innerhalb eines Durchlaufs aendert sich der Plan nicht,
  // also genuegt eine Berechnung je Tag - der Cache wird in render() gesetzt und geleert.
  let dayNutCache = null;
  // Von state.plan entkoppelt, damit "heute" in weekGoalHtml auch in der
  // Naechste-Woche-Ansicht gegen den Plan der AKTUELLEN Woche rechnen kann.
  function dayNutOf(plan, dayKey) {
    let s = { kcal: 0, carbs: 0, protein: 0, fat: 0 };
    MEALS.forEach(m => { plan[dayKey][m.key].forEach(rid => { const r = getRecipe(rid); if (r) s = addNut(s, recipeNut(r)); }); });
    return s;
  }
  function dayNut(dayKey) {
    if (dayNutCache && dayNutCache[dayKey]) return dayNutCache[dayKey];
    const s = dayNutOf(state.plan, dayKey);
    if (dayNutCache) dayNutCache[dayKey] = s;
    return s;
  }
  function weekNut() { let s = { kcal: 0, carbs: 0, protein: 0, fat: 0 }; DAYS.forEach(d => { s = addNut(s, dayNut(d.key)); }); return s; }
  function hasNut(s) { return !!(s.kcal || s.carbs || s.protein || s.fat); }
  function nfmt(n) { return Math.round(n).toLocaleString("de-DE"); }

  // ---------- Strukturierte Zutaten ----------
  // Eine Zutat ist entweder ein String (Altbestand, reiner Freitext) oder ein Objekt
  // { name, grams, unit, kcal, carbs, protein, fat }. `grams` ist die eingesetzte Menge
  // (der Feldname bleibt aus Kompatibilitaet, siehe Namensdualitaet in CLAUDE.md), `unit`
  // sagt worin: "g", "ml" oder "st" (Stueck). Fehlendes `unit` = "g" — so bleiben alle
  // Altbestaende gueltig. Die Naehrwerte gelten pro 100 g / pro 100 ml bzw. PRO STUECK;
  // ingContrib rechnet entsprechend hoch. (ING_UNITS selbst steht ganz oben im Script,
  // weil sanitizeIng schon von load() gebraucht wird - eine const hier waere zu diesem
  // fruehen Zeitpunkt noch nicht initialisiert und haette das ganze Script abgebrochen.
  // Echter Absturz auf dem Live-Server gewesen, siehe Commit-Historie.)
  function ingUnit(o) { const u = o && o.unit; return ING_UNITS.indexOf(u) >= 0 ? u : "g"; }
  function unitShort(u) { return ({ st: "Stück", el: "EL", tl: "TL" })[u] || u; }
  // Bezugsgroesse der Naehrwertfelder — bei Stueck/EL/TL gibt es keine 100er-Basis,
  // der Naehrwert gilt direkt je Einheit. Steht als Zusatz in der Kopfzeile neben
  // "Makros" (Muster wie bei der Meal-Detailansicht "Makros · je Portion").
  function ingPerLabel(u) {
    if (u === "st") return "· je Stück";
    if (u === "el" || u === "tl") return "· je " + unitShort(u);
    return "· je 100 " + u;
  }
  function ingObj(i) { return (i && typeof i === "object") ? i : { name: String(i == null ? "" : i) }; }
  function ingLabel(i) {
    const o = ingObj(i), n = String(o.name || "").trim(), q = nutNum(o.grams);
    return q ? qtyLabel(q, ingUnit(o)) + " " + n : n;
  }
  function ingHasNut(i) { const o = ingObj(i); return o.kcal != null || o.carbs != null || o.protein != null || o.fat != null; }
  function ingContrib(i) {
    const o = ingObj(i);
    const u = ingUnit(o);
    // Stueck/EL/TL: Naehrwert gilt je Einheit (×Menge). g/ml: Naehrwert gilt je 100 (×Menge/100).
    const f = (u === "st" || u === "el" || u === "tl") ? nutNum(o.grams) : nutNum(o.grams) / 100;
    return { kcal: nutNum(o.kcal) * f, carbs: nutNum(o.carbs) * f, protein: nutNum(o.protein) * f, fat: nutNum(o.fat) * f };
  }
  // Menge lesbar machen: ab 1000 auf die grosse Einheit (2800 ml -> 2,8 L, 1500 g -> 1,5 kg).
  function qtyLabel(n, u) {
    if (u === "st") return numLabel(n) + "×"; // "35× Ei" liest sich besser als "35 Stück Ei"
    if (u === "el" || u === "tl") return numLabel(n) + " " + unitShort(u);
    if (n >= 1000) return numLabel(Math.round(n / 10) / 100) + (u === "ml" ? " L" : " kg");
    return numLabel(n) + " " + u;
  }
  function numLabel(n) { return (Math.round(n * 100) / 100).toLocaleString("de-DE"); }
  // Import/Sync-Sicherung: fremde Zutaten-Eintraege auf die zwei erlaubten Formen bringen
  function sanitizeIng(x) {
    if (x == null) return null;
    if (typeof x !== "object") { const s = String(x).trim(); return s || null; }
    const name = String(x.name || "").trim(); if (!name) return null;
    const o = { name };
    ["grams", "kcal", "carbs", "protein", "fat"].forEach(k => { const v = nutParse(x[k]); if (v != null) o[k] = v; });
    if (ING_UNITS.indexOf(x.unit) > 0) o.unit = x.unit; // "g" ist Default, muss nicht mit
    return Object.keys(o).length > 1 ? o : name;
  }
