<!-- Begrenzt den Schaden, wenn doch einmal fremder Inhalt ins DOM gerät - die gefährlichste
     Quelle ist ein geteilter Plan, siehe docs/SECURITY.md. Bewusst nur diese drei Direktiven:

     base-uri 'self'    verhindert, dass ein eingeschleustes <base> alle relativen Pfade der
                        Seite auf einen fremden Host umbiegt. Klassische XSS-Eskalation.
     form-action 'self' verhindert, dass ein eingeschleustes Formular Eingaben nach draußen
                        schickt. Die App hat selbst kein einziges <form>.
     object-src 'none'  verbietet Plugin-Einbettungen. Die App nutzt keine.

     Was hier BEWUSST fehlt und warum:
     * script-src  Die App ist vollständig inline geschrieben (fünf script-Blöcke ohne
                   src-Attribut; die spitzen Klammern fehlen hier mit Absicht - als Text im
                   Kommentar hält syntax-check.py sie für den Beginn eines echten Blocks und
                   meldet einen Fehler, den es nicht gibt. Beim Schreiben dieses Kommentars
                   prompt passiert, gefunden vom Syntax-Hook).
                   Ohne Build-Schritt bliebe nur 'unsafe-inline' - das erlaubt genau
                   das, wogegen die Direktive schützen soll. Hashes müssten bei jeder
                   Änderung neu berechnet werden; dafür gibt es hier keine Toolchain.
     * frame-ancestors und X-Frame-Options  Beide wirken NUR als HTTP-Header, in einem
                   <meta> werden sie ignoriert. GitHub Pages kann keine Header setzen -
                   das gehört in den Cloudflare Worker, sobald der deployt ist. -->
<meta http-equiv="Content-Security-Policy" content="base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<script>
  /* Sammelpunkt fuer geschluckte Fehler. Steht ganz oben und in DIESEM Block, weil er in
     allen spaeteren Bloecken zur Verfuegung stehen muss - auch im Firebase-Modul.
     Vorher standen an 34 Stellen leere catch-Bloecke. Was das kostet, steht in
     docs/TROUBLESHOOTING.md §29: ein verschluckter TypeError liess "Gruppe aufloesen"
     monatelang nie wirklich aufraeumen, ohne dass irgendwo etwas auffiel.
     NICHT "reportError" genannt: window.reportError ist eine echte Plattform-API
     (reicht einen Fehler an die globalen Handler weiter). Sie zu ueberschreiben waere
     ein stiller Nebeneffekt an einer Stelle, an der es um genau das Gegenteil geht.
     Bewusste Grenzen:
     * Kein Versand irgendwohin. Ein Telemetrie-Dienst waere ein Empfaenger personen-
       bezogener Daten und muesste in die Datenschutzerklaerung (CLAUDE.md §20/§23).
       Wenn Store-Telemetrie kommt (Plan D), ist DIESE Funktion die eine Stelle dafuer.
     * Kein localStorage. Fehlermeldungen koennen Nutzerinhalte tragen; im Speicher
       gehalten sind sie mit dem Schliessen des Tabs weg.
     * Wirft nie selbst. Ein Melder, der den Fehlerpfad zerlegt, waere schlimmer als keiner.
     Und der Grund, warum er GANZ oben steht: Ein leerer catch war unzerstoerbar, ein catch mit
     noteError() darin nicht mehr - fehlte die Funktion, wuerde JEDER dieser Blocks mit einem
     ReferenceError nachlegen, also genau das Gegenteil bewirken. Der Melder darf deshalb nie
     hinter etwas rutschen, das vorher scheitern kann, und nichts nachladen. */
  window.noteError = (function () {
    var seen = Object.create(null);   // Kennung -> wie oft schon gesehen
    var log = [];
    var MAX_PER_TAG = 3;              // gedrosselt: Sync-Listener und Schleifen wuerden fluten
    var MAX_LOG = 50;
    function note(tag, err) {
      try {
        var n = (seen[tag] = (seen[tag] || 0) + 1);
        if (n > MAX_PER_TAG) return;
        var msg = String((err && err.message) || err || "?");
        log.push({ t: new Date().toISOString(), tag: String(tag), msg: msg });
        if (log.length > MAX_LOG) log.shift();
        if (window.console && console.warn) {
          console.warn("[Mealplan] " + tag + ": " + msg
            + (n === MAX_PER_TAG ? "  (weitere zu \"" + tag + "\" werden unterdrueckt)" : ""));
        }
      } catch (ignored) {}
    }
    note.dump = function () { return log.slice(); };   // Abruf in den DevTools
    return note;
  })();

  /* Erscheinungsbild vor dem ersten Paint setzen — sonst blitzt beim Laden kurz das
     falsche Theme auf. Ohne gespeicherte Wahl bleibt das Attribut weg, dann greift
     wie bisher prefers-color-scheme. Laeuft absichtlich vor allem anderen. */
  try {
    var t = localStorage.getItem("wochenkueche_theme_v1");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"][media]');
      if (m) m.setAttribute("media", t === "dark" ? "all" : "not all");
    }
  } catch (e) { noteError("theme:restore", e); }
</script>

     Cloud-Anmeldung (Firebase) — lädt als ES-Modul aus vendor/,
     nicht vom gstatic-CDN: Apple 2.5.2 verbietet nachgeladenen
     Code, und ohne Netz käme der Kaltstart sonst nie an.
     Gepflegt über tools/firebase-vendor.py — Pfade dort NICHT
     von Hand nachziehen.
     Solange die Config unten Platzhalter enthält ODER das Modul
     nicht lädt, fällt die App automatisch auf den lokalen Login
     zurück – es bricht nichts.
     ============================================================ -->
<script src="lib/basis.js"></script>
<script src="data/ikonen.js"></script>

<script type="module">
  import { initializeApp } from "./vendor/firebase/10.12.5/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, sendEmailVerification, signOut,
    updateProfile, sendPasswordResetEmail, setPersistence,
    browserLocalPersistence, GoogleAuthProvider, OAuthProvider, signInWithPopup,
    signInWithRedirect, getRedirectResult,
    deleteUser, reauthenticateWithPopup, reauthenticateWithCredential, EmailAuthProvider
  } from "./vendor/firebase/10.12.5/firebase-auth.js";
  import {
    getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    terminate, clearIndexedDbPersistence,
    doc, collection, getDoc, getDocs, getDocsFromServer, setDoc, updateDoc, deleteDoc, writeBatch, increment, onSnapshot
  } from "./vendor/firebase/10.12.5/firebase-firestore.js";

  /* ▼▼▼ HIER die Werte aus der Firebase-Konsole eintragen ▼▼▼
     (Projekt-Einstellungen → Deine Apps → Web-App → SDK-Konfiguration) */
  const firebaseConfig = {
    apiKey: "AIzaSyAr6kx7lByKgoUrnNJsRD06PKSs3ivplLE",
    authDomain: "paddys-mealplan.firebaseapp.com",
    projectId: "paddys-mealplan",
    storageBucket: "paddys-mealplan.firebasestorage.app",
    messagingSenderId: "1045496121634",
    appId: "1:1045496121634:web:c43390145fe7b52789bd7b"
  };
  /* ▲▲▲ ------------------------------------------------------- ▲▲▲ */

  const CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("DEIN_") !== 0;
  window.CloudAuth = { configured: !!CONFIGURED };

  if (!CONFIGURED) {
    window.dispatchEvent(new CustomEvent("cloudauth:disabled"));
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      auth.languageCode = "de";
      setPersistence(auth, browserLocalPersistence).catch(function () {});

      function popupFallback(e, provider) {
        const c = e && e.code;
        if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
          return signInWithRedirect(auth, provider);
        }
        throw e;
      }
      // Nach signInWithRedirect verlaesst die Seite den Tab komplett und laedt danach neu -
      // das Ergebnis (oder ein Fehler wie "account-exists-with-different-credential") kommt
      // erst hier an, nie ueber das Promise von loginGoogle/loginApple. onAuthStateChanged holt
      // den erfolgreich angemeldeten User ohnehin automatisch ab; hier wird nur der Fehlerfall
      // eingefangen, damit er nicht stillschweigend verschwindet.
      getRedirectResult(auth).catch(function (e) { window.CloudAuth.redirectError = e; });

      Object.assign(window.CloudAuth, {
        registerEmail: async function (name, email, pw) {
          const cred = await createUserWithEmailAndPassword(auth, email, pw);
          if (name) { try { await updateProfile(cred.user, { displayName: name }); } catch (e) { window.noteError("auth:setDisplayName", e); } }
          await sendEmailVerification(cred.user);
          return cred.user;
        },
        loginEmail: function (email, pw) { return signInWithEmailAndPassword(auth, email, pw); },
        // In-App-Browser (Instagram, Facebook, TikTok) blockieren OAuth-Popups routinemaessig -
        // dort kommt "auth/popup-blocked", und "Erlaube Pop-ups" laesst sich dort nicht befolgen
        // (es gibt keine Popup-Einstellung). Ausweg: bei genau diesen Fehlercodes auf einen
        // vollen Seitenwechsel (signInWithRedirect) umsteigen. Das Ergebnis holt getRedirectResult()
        // weiter unten ab, sobald die Seite danach neu laedt.
        loginGoogle: function () {
          const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
          return signInWithPopup(auth, p).catch(function (e) { return popupFallback(e, p); });
        },
        loginApple: function () {
          const p = new OAuthProvider("apple.com"); p.addScope("email"); p.addScope("name");
          return signInWithPopup(auth, p).catch(function (e) { return popupFallback(e, p); });
        },
        resendVerification: function () {
          return auth.currentUser ? sendEmailVerification(auth.currentUser) : Promise.reject(new Error("no-user"));
        },
        resetPassword: function (email) { return sendPasswordResetEmail(auth, email); },
        updateName: function (name) {
          return auth.currentUser ? updateProfile(auth.currentUser, { displayName: name }) : Promise.reject(new Error("no-user"));
        },
        reloadUser: function () {
          return auth.currentUser ? auth.currentUser.reload().then(function () { return auth.currentUser; }) : Promise.resolve(null);
        },
        logout: function () { return signOut(auth); },
        current: function () { return auth.currentUser; },
        // Konto vollstaendig loeschen (Art. 17 DSGVO). Reihenfolge ist wichtig: die
        // Firestore-Dokumente muessen VOR deleteUser() weg, weil die Security Rules
        // "request.auth.uid == uid" pruefen - nach deleteUser waere der Nutzer nicht
        // mehr angemeldet und der Zugriff wuerde verweigert.
        // opts.password fuer Email/Passwort-Konten, sonst per Popup erneut bestaetigt
        // (Firebase verlangt fuer diese sensible Aktion eine kuerzliche Anmeldung).
        deleteAccount: async function (opts) {
          const user = auth.currentUser;
          if (!user) throw new Error("no-user");
          const pid = (user.providerData[0] || {}).providerId;
          if (pid === "password") {
            if (!opts || !opts.password) throw new Error("password-required");
            await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, opts.password));
          } else if (pid === "google.com") {
            await reauthenticateWithPopup(user, new GoogleAuthProvider());
          } else if (pid === "apple.com") {
            await reauthenticateWithPopup(user, new OAuthProvider("apple.com"));
          }
          const uid = user.uid;
          // shared/{id}, groups/{gid}/members/{uid} und invites/{code} pruefen in ihrer
          // delete-Regel jeweils resource.data (siehe firestore.rules) - anders als bei einer
          // reinen Pfad-Regel liefert das FUER EIN NICHT MEHR EXISTIERENDES Dokument ebenfalls
          // "permission-denied" statt eines stillen Erfolgs, weil "resource" dann null ist.
          // Ein Eintrag, der ausserdem einer fremden UID gehoert (z. B. durch einen frueheren
          // Datenfehler in state.shares), erzeugt denselben Fehlercode. Ein erneuter Versuch
          // wuerde in beiden Faellen IMMER wieder genau hier scheitern - anders als bei einem
          // echten Netz-/Regel-Problem. Deshalb NUR "permission-denied" verzeihen (das Dokument
          // war fuer dieses Konto ohnehin nie loeschbar), jeden anderen Fehler weiterhin
          // durchreichen und die Loeschung abbrechen, damit der Nutzer es erneut versuchen kann.
          async function deleteBestEffort(ref) {
            try {
              await deleteDoc(ref);
            } catch (e) {
              if (e && e.code === "permission-denied") return;
              throw e;
            }
          }
          const shareIds = (opts && opts.shareIds) || [];
          for (let i = 0; i < shareIds.length; i++) {
            await deleteBestEffort(doc(db, "shared", shareIds[i]));
          }
          // Rezepte liegen seit dem Subcollection-Umbau in eigenen Dokumenten - Firestore
          // loescht Subcollections NICHT automatisch mit, wenn das Elternobjekt verschwindet.
          // Die Regel hier ist rein pfadbasiert (kein resource.data-Zugriff) - ein bereits
          // geloeschtes Rezept liefert deshalb, anders als oben, weiterhin einen stillen Erfolg.
          const recipeIds = (opts && opts.recipeIds) || [];
          for (let i = 0; i < recipeIds.length; i++) {
            await deleteDoc(doc(db, "users", uid, "recipes", recipeIds[i]));
          }
          // Mitgliedschaft in einer Gruppe: Name und Bild liegen in einem Dokument, das
          // NICHT unter users/{uid} haengt und deshalb sonst zurueckbliebe - in einer
          // fremden Gruppe, fuer immer, ohne dass es danach noch jemand loeschen koennte
          // (die Regel verlangt genau diese uid). Anders als bei shared/ und invites/ pruefend
          // die Loeschregel hier NICHT resource.data - der Pfad traegt bereits die eigene uid,
          // "request.auth.uid == uid" greift per Kurzschluss unabhaengig vom Dokumentinhalt.
          // deleteBestEffort() ist hier also v. a. Konsistenz mit den anderen beiden Stellen,
          // nicht dieselbe Notwendigkeit.
          //
          // Seit dem Mitgliederlimit (16.08.2026) MUSS das als Batch samt memberCount laufen.
          // Eine Einzelloeschung wird von der Regel abgelehnt - und zwar mit
          // "permission-denied", das deleteBestEffort() ausdruecklich VERZEIHT. Der Austritt
          // waere damit still gescheitert und Name samt Profilbild blieben in fremder Gruppe
          // stehen, ohne jede Fehlermeldung: genau der Zustand, den der Kommentar oben
          // ausschliessen soll (Ziffer 10 der Datenschutzerklaerung, Art. 17 DSGVO).
          //
          // Deshalb hier bewusst KEIN deleteBestEffort: Der Batch ist entweder erlaubt oder
          // es liegt ein echter Fehler vor, den der Loeschvorgang melden soll. Die Ausnahme
          // ist eine bereits aufgeloeste Gruppe - dann gibt es nichts mehr zu loeschen.
          //
          // Verziehen wird nur, was NACHWEISLICH schon erledigt ist. Der Unterschied zu
          // deleteBestEffort() ist genau der: Dort genuegt der Fehlercode, hier wird
          // nachgesehen. Ein "permission-denied" heisst naemlich zweierlei - entweder ist
          // der Eintrag laengst weg (dann ist das Ziel erreicht), oder die Regel hat
          // tatsaechlich abgelehnt (dann muss die Loeschung scheitern und es sagen).
          //
          // Der Fall ist real: Wurde man auf einem anderen Geraet gerade aus der Gruppe
          // entfernt, waehrend syncGid lokal noch steht, trifft KEIN Zweig der update-Regel
          // mehr zu (Zweig 3 verlangt exists(memberPath)). Ohne diese Unterscheidung braeche
          // daran die GESAMTE Kontoloeschung ab - schlimmer als der alte Zustand, und ein
          // Verstoss gegen "jederzeit selbst und sofort loeschen" (Ziffer 10, Art. 17 DSGVO).
          if (opts && opts.groupId) {
            const mref = doc(db, "groups", opts.groupId, "members", uid);
            try {
              const gref = doc(db, "groups", opts.groupId);
              const gsnap = await getDoc(gref);
              if (gsnap.exists()) {
                const b = writeBatch(db);
                b.delete(mref);
                b.update(gref, { memberCount: increment(-1) });
                await b.commit();
              }
            } catch (e) {
              const weg = await getDoc(mref).then(s => !s.exists()).catch(() => false);
              if (!weg) throw e;
            }
          }
          // Selbst erzeugte Einladungscodes: sie zeigen auf die Gruppe und traegen die
          // eigene uid im Feld "by". Gleiche resource.data-Regel wie oben.
          const inviteCodes = (opts && opts.inviteCodes) || [];
          for (let i = 0; i < inviteCodes.length; i++) {
            await deleteBestEffort(doc(db, "invites", inviteCodes[i]));
          }
          // Pro-Berechtigung (D1). Sie haengt NICHT unter users/{uid} und bliebe sonst als
          // verwaistes Dokument mit Personenbezug stehen - Art. 17 DSGVO verlangt aber, dass
          // ALLE zuordenbaren Daten verschwinden. Deshalb darf der Client dieses eine Dokument
          // loeschen (nur loeschen, nicht anlegen oder aendern - siehe firestore.rules).
          // Das ist sicherheitstechnisch unbedenklich: Loeschen kann nur zum eigenen Nachteil
          // ausfallen, und ein Store-Webhook wuerde es beim naechsten Ereignis neu schreiben.
          // deleteBestEffort, weil die Regel bei fehlendem Dokument bzw. abweichender Rechtelage
          // "permission-denied" liefert - eine fehlende Berechtigung (der Normalfall!) darf die
          // Kontoloeschung nicht blockieren (dieselbe Falle wie in TROUBLESHOOTING §48).
          await deleteBestEffort(doc(db, "entitlements", uid));
          await deleteDoc(doc(db, "users", uid));
          try {
            await deleteUser(user);
          } catch (e) {
            // Daten sind zu diesem Zeitpunkt bereits weg; nur noch der Login-Account
            // besteht. Markieren, damit die App eine passende Meldung zeigen kann.
            e.dataAlreadyDeleted = true;
            throw e;
          }
        }
      });

      // ----- Cloud-Sync (Firestore): pro Nutzer ein Dokument users/{uid} -----
      // Persistenz ist ein Komfortgewinn, keine Voraussetzung. Scheitert sie (Privatmodus ohne
      // IndexedDB, exotische WebView), darf das nicht die ganze Cloud kosten: der umgebende catch
      // (wenige Zeilen unten) wirft sonst "cloudauth:disabled" und die App faellt auf den
      // lokalen Login zurueck. Deshalb eigenes try/catch mit Fallback auf den fluechtigen Cache.
      // Der Multi-Tab-Manager ist Pflicht: ohne ihn schaltet der zweite Tab die Persistenz
      // stillschweigend ab. Siehe docs/TROUBLESHOOTING.md ("fromCache ist kein Beweis").
      // ignoreUndefinedProperties: das Netz unter den Sanitizern. Firestore lehnt sonst das
      // GANZE Dokument ab, sobald irgendwo ein Feld auf undefined steht - und der Push
      // wiederholt denselben Wurf bei jedem save(). Genau so blieb ein "goal.diet: undefined"
      // wochenlang unbemerkt liegen (docs/TROUBLESHOOTING.md). Damit verhaelt sich die Cloud
      // wie JSON.stringify und canonJSON(): fehlt ein Wert, fehlt das Feld. Die Sanitizer
      // bleiben trotzdem die Quelle der Wahrheit - ein still fallengelassenes Feld ist eine
      // Notbremse, kein sauberer Datensatz.
      // Der Fallback muss es MITTRAGEN: sonst verliert ein Geraet ohne IndexedDB das Netz
      // wieder. Deshalb dort ebenfalls initializeFirestore, nur ohne persistenten Cache.
      let db;
      try {
        db = initializeFirestore(app, {
          ignoreUndefinedProperties: true,
          localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
      } catch (e) {
        try { db = initializeFirestore(app, { ignoreUndefinedProperties: true }); }
        catch (e2) { db = getFirestore(app); }
      }
      // Rezepte liegen zweimal in derselben Struktur: unter users/{uid}/recipes fuer das
      // eigene Konto und unter groups/{gid}/recipes fuer eine gemeinsame Gruppe. Deshalb
      // nehmen die Rezept-Funktionen unten einen Basispfad ["users", uid] bzw.
      // ["groups", gid] statt einer uid - ein Parameter statt zweier fast gleicher
      // Funktionspaare, die auseinanderlaufen koennten.
      function recipesCol(base) { return collection(db, base[0], base[1], "recipes"); }
      function recipeDoc(base, id) { return doc(db, base[0], base[1], "recipes", id); }

      // ----- Fehlerbehandlung fuer onSnapshot -----
      //
      // Vier Listener trugen bis zum 28.08.2026 ein leeres `function () {}` als
      // Fehlerbehandlung. Das ist teurer, als es aussieht: Ein onSnapshot, der mit einem
      // Fehler endet, wird von Firestore ENDGUELTIG beendet - er versucht es nicht erneut.
      // Der Listener ist danach tot, und niemand erfaehrt es. Der Sync-Punkt zeigte weiter
      // "Synchronisiert", weil setSyncStatus("synced") am Ende von startCloudSync() gesetzt
      // wird und nichts es je zuruecknahm.
      //
      // Genau dieser Zustand war am 28.08.2026 messbar: Die App konnte weder lesen noch
      // schreiben, die Anzeige sagte "Synchronisiert". Ein Nutzer haelt seine Daten fuer
      // gesichert, waehrend nichts mehr ankommt - dieselbe Fehlerklasse wie die leeren
      // catch-Bloecke aus docs/TROUBLESHOOTING.md 29 und der freundliche Toast aus 121.
      //
      // Der Melder tut zwei Dinge und nichts weiter: Er protokolliert ueber noteError
      // (gedrosselt, drei je Kennung) und reicht den Fall an die App durch, damit sie den
      // Status ehrlich stellen kann. Bewusst KEIN automatisches Neuanhaengen: Ein Listener,
      // der wegen einer Regel scheitert, scheitert beim naechsten Versuch genauso, und eine
      // Wiederanhaenge-Schleife waere ein Dauerfeuer gegen Firestore.
      function watchFehler(kennung) {
        return function (e) {
          window.noteError(kennung, e);
          if (typeof window.__onCloudWatchError === "function") {
            try { window.__onCloudWatchError(kennung, e); } catch (e2) { window.noteError("sync:watchMelder", e2); }
          }
        };
      }

      // ----- Pro-Berechtigung (D1): eigenes Dokument entitlements/{uid}, NUR lesbar -----
      // Bewusst nicht im Kontodokument: das darf der Nutzer selbst schreiben (siehe
      // firestore.rules). Ein Feld dort waere mit den Entwicklerwerkzeugen sofort auf true
      // zu setzen. Hier kommt der Status ausschliesslich vom Server.
      // Fehler werden verschluckt und als "kein Pro" behandelt - fehlt das Dokument (der
      // Normalfall) oder verweigert die Regel den Zugriff, ist die Antwort dieselbe.
      window.CloudEntitlement = {
        watch: function (uid, cb) {
          return onSnapshot(doc(db, "entitlements", uid),
            function (snap) { cb(snap.exists() ? snap.data() : null); },
            function (e) { window.noteError("entitlement:watch", e); cb(null); });
        }
      };

      window.CloudSync = {
        enabled: true,
        load: function (uid) {
          return getDoc(doc(db, "users", uid)).then(function (snap) {
            return snap.exists() ? snap.data() : null;
          });
        },
        // Schreibt nur die uebergebenen Felder und laesst alles andere stehen. Wichtig,
        // sobald der Wochenplan in einer Gruppe liegt: das Kontodokument wird dann ohne
        // "plans" gepusht - ohne diese Semantik wuerde jeder Push das Feld beim Verlassen
        // der Gruppe geloescht zuruecklassen. Auch ohne Gruppe die sicherere Variante.
        //
        // mergeFields und NICHT merge:true - das war jahrelang das falsche Werkzeug fuer
        // genau die Absicht, die der Absatz darueber beschreibt:
        //   merge:true    mischt Maps BLATTWEISE. Ein "goal" ohne "diet" loescht goal.diet
        //                 nicht. "Vegetarisch -> Alles" war damit ueberhaupt nicht
        //                 wegzuschreiben, und ein einmal gesetztes goal.manual kam nach
        //                 jedem "Ziele neu berechnen" aus der Cloud zurueck.
        //   mergeFields   ersetzt die genannten Felder GANZ und laesst alle uebrigen
        //                 unangetastet. Genau das ist gemeint.
        // Object.keys(data) heisst: was der Aufrufer schickt, wird gesetzt; was er weglaesst,
        // bleibt liegen. Die Teil-Schreibvorgaenge ({ pendingGroupId: ... }) verhalten sich
        // dadurch unveraendert. Alle Feldnamen sind einfache Bezeichner, FieldPath ist nicht
        // noetig. Ein leeres Objekt waere fuer Firestore ein Fehler - dann gibt es aber auch
        // nichts zu schreiben.
        save: function (uid, data, merge) {
          if (merge === false) return setDoc(doc(db, "users", uid), data);
          const felder = Object.keys(data);
          if (!felder.length) return Promise.resolve();
          return setDoc(doc(db, "users", uid), data, { mergeFields: felder });
        },
        watch: function (uid, cb) {
          return onSnapshot(doc(db, "users", uid), function (snap) {
            if (snap.exists()) cb(snap.data(), snap.metadata.hasPendingWrites);
          }, watchFehler("sync:watchKonto"));
        },
        // ----- Rezepte: eigenes Dokument je Meal (users/{uid}/recipes/{id}) -----
        // Batch statt Einzel-setDoc/deleteDoc: batch.commit() ist atomar - entweder
        // landen alle Aenderungen dieses Zyklus, oder keine. Bricht ein Netzabbruch
        // mitten in commit() ab, bleibt die lokale Baseline unveraendert und der
        // naechste Zyklus versucht denselben Diff erneut (siehe syncRecipes()).
        loadRecipes: function (base) {
          return getDocs(recipesCol(base)).then(function (snap) {
            return snap.docs.map(function (d) { return d.data(); });
          });
        },
        // Ausdruecklich vom SERVER lesen - fuer den einen Fall, in dem ein leeres Ergebnis
        // eine Entscheidung traegt: den Dubletten-Abgleich beim Gruppenbeitritt
        // (copyOwnRecipesToGroup). Mit persistentLocalCache WIRFT getDocs offline nicht,
        // sondern liefert stillschweigend das leere Cache-Ergebnis - und die Rezepte einer
        // Gruppe, der man gerade erst beigetreten ist, hat dieser Cache noch NIE gesehen.
        // "Die Gruppe hat noch keine Meals" und "ich weiss es nicht" saehen damit gleich aus,
        // und der Abgleich lieferte genau dann nichts, wenn er gebraucht wird. Dieselbe
        // Fehlerklasse wie bei CloudGroup.fetch() ("fromCache ist kein Beweis"), hier aber
        // ohne Ausweg ueber ein Flag: ein leeres Array traegt keine Herkunft.
        // getDocsFromServer WIRFT offline - das ist hier die gewuenschte Eigenschaft, der
        // Aufrufer faengt es ab und faellt auf das alte Verhalten zurueck.
        loadRecipesFromServer: function (base) {
          return getDocsFromServer(recipesCol(base)).then(function (snap) {
            return snap.docs.map(function (d) { return d.data(); });
          });
        },
        saveRecipesBatch: function (base, puts, delIds) {
          const batch = writeBatch(db);
          puts.forEach(function (r) { batch.set(recipeDoc(base, r.id), r); });
          delIds.forEach(function (id) { batch.delete(recipeDoc(base, id)); });
          return batch.commit();
        },
        watchRecipes: function (base, cb) {
          return onSnapshot(recipesCol(base), function (snap) {
            cb(snap.docChanges().map(function (c) {
              return { type: c.type, id: c.doc.id, data: c.doc.data(), pending: c.doc.metadata.hasPendingWrites };
            }));
          }, watchFehler("sync:watchRezepte"));
        },
        // Loescht den Firestore-Offline-Cache (IndexedDB) - Teil der Loeschzusage aus
        // Datenschutz Ziffer 10, seit der Cache Inhaltsdaten (Meals, Wochenplan) spiegelt.
        // Nur unmittelbar vor einem Reload aufrufen: nach terminate() ist die db-Instanz tot.
        // Reihenfolge ist zwingend - clearIndexedDbPersistence() verlangt eine beendete Instanz.
        wipeCache: async function () {
          await terminate(db);
          await clearIndexedDbPersistence(db);
        }
      };

      // ----- Teilen per Cloud-Link: öffentlich lesbare Snapshots in shared/{id} -----
      window.CloudShare = {
        enabled: true,
        publish: function (id, data) { return setDoc(doc(db, "shared", id), data); },
        fetch: function (id) {
          return getDoc(doc(db, "shared", id)).then(function (s) { return s.exists() ? s.data() : null; });
        }
      };

      // ----- Gemeinsam planen: groups/{gid} mit Mitgliedern, Wochenplan und Meals -----
      // Bewusst ein eigenes Fenster-Objekt neben CloudSync/CloudShare statt eines weiteren
      // Anbaus an CloudSync: es ist eine eigene Datenwelt mit eigenen Regeln.
      //
      // Warum ein Dokument JE WOCHE mit flachen Slot-Feldern ("mo_fr", "di_ab", …) und
      // nicht ein "plans"-Objekt wie im Kontodokument: In einer Gruppe schreiben mehrere
      // Leute gleichzeitig. Ein ganzes plans-Objekt zu setzen hiesse, dass der zweite
      // Push den ersten ueberschreibt (der Debounce betraegt 800 ms - abends plant ein
      // Paar genau gleichzeitig). Mit flachen Feldern und merge:true kollidieren nur noch
      // Schreibvorgaenge auf DENSELBEN Slot desselben Tages; dort ist "letzter gewinnt"
      // die erwartete Semantik. Und je Woche ein Dokument, damit pruneWeeks() eine
      // vergangene Woche wirklich loeschen kann, statt tote Felder anzuhaeufen.
      function groupDoc(gid) { return doc(db, "groups", gid); }
      window.CloudGroup = {
        enabled: true,
        create: function (gid, data) { return setDoc(groupDoc(gid), data); },
        // Liefert fromCache mit: mit persistentLocalCache WIRFT getDoc offline nicht mehr,
        // sondern liefert stillschweigend den letzten bekannten Stand. Ein Cache-Treffer ist
        // damit kein Beweis mehr fuer "existiert nicht" - siehe docs/TROUBLESHOOTING.md
        // ("fromCache ist kein Beweis").
        fetch: function (gid) {
          return getDoc(groupDoc(gid)).then(function (s) {
            return { data: s.exists() ? s.data() : null, fromCache: s.metadata.fromCache };
          });
        },
        watch: function (gid, cb) {
          return onSnapshot(groupDoc(gid), function (s) { if (s.exists()) cb(s.data(), s.metadata.hasPendingWrites); }, watchFehler("sync:watchGruppe"));
        },
        // updateDoc statt setDoc(merge): scheitert laut, wenn die Gruppe nicht mehr da ist.
        setSettings: function (gid, settings) { return updateDoc(groupDoc(gid), { settings: settings }); },
        setName: function (gid, name) { return updateDoc(groupDoc(gid), { name: name }); },
        // Beendet den Wartezustand (status:"pending" -> "active"), rein informativ - die
        // massgebliche Wahrheit fuer den Owner ist users/{uid}.pendingGroupId.
        activate: function (gid) { return updateDoc(groupDoc(gid), { status: "active" }); },
        remove: function (gid) { return deleteDoc(groupDoc(gid)); },
        // Vollstaendiges Aufloesen: Gruppendokument + ALLE Mitglieder + ALLE Wochenplaene +
        // ALLE Meals in einem Batch. Firestore loescht Unterkollektionen NIE automatisch mit dem
        // Elterndokument - ohne dies blieben die Eintraege der uebrigen Mitglieder sowie Plaene/
        // Meals fuer immer als Karteileichen stehen (das widersprach Ziffer 10 der
        // Datenschutzerklaerung woertlich). Der eigene Mitglieder-Eintrag steckt bewusst MIT im
        // Batch statt separat geloescht zu werden: Firestore prueft Regeln fuer jede Operation
        // eines Batches gegen den Stand VOR dem Commit, die eigene Owner-Mitgliedschaft (die
        // isOwner() fuer alle anderen Loeschungen braucht) muss also beim Abschicken noch
        // bestehen, nicht erst danach geloescht werden.
        dissolve: function (gid, memberUids, planWeeks, recipeIds) {
          const batch = writeBatch(db);
          memberUids.forEach(function (uid) { batch.delete(doc(db, "groups", gid, "members", uid)); });
          planWeeks.forEach(function (wk) { batch.delete(doc(db, "groups", gid, "plans", wk)); });
          recipeIds.forEach(function (id) { batch.delete(doc(db, "groups", gid, "recipes", id)); });
          batch.delete(groupDoc(gid));
          return batch.commit();
        },

        // ----- Mitglieder: ein Dokument je Person, damit Rollenrechte pro Dokument gelten -----
        // fromCache mit zurueckgeben - gleicher Grund wie bei fetch() oben.
        fetchMembers: function (gid) {
          return getDocs(collection(db, "groups", gid, "members")).then(function (snap) {
            return {
              members: snap.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); }),
              fromCache: snap.metadata.fromCache
            };
          });
        },
        watchMembers: function (gid, cb) {
          return onSnapshot(collection(db, "groups", gid, "members"), function (snap) {
            cb(snap.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); }), snap.metadata.fromCache);
          }, function (e) {   // Lesefehler als null melden, NICHT als leere Liste - sonst laese der Aufrufer daraus einen Rauswurf
            watchFehler("sync:watchMitglieder")(e);
            cb(null, false);
          });
        },
        putMember: function (gid, uid, data) { return setDoc(doc(db, "groups", gid, "members", uid), data, { merge: true }); },
        // Bin ich in DIESER Gruppe schon eingetragen? Liefert null, wenn die Frage nicht
        // beantwortbar ist (ein Nichtmitglied darf die Mitgliederliste nicht lesen - genau
        // dann lautet die Antwort aber ohnehin "nein, noch nicht").
        istMitglied: function (gid, uid) {
          return getDoc(doc(db, "groups", gid, "members", uid))
            .then(function (s) { return s.exists(); })
            .catch(function () { return false; });
        },
        setRole: function (gid, uid, role) { return updateDoc(doc(db, "groups", gid, "members", uid), { role: role }); },
        removeMember: function (gid, uid) { return deleteDoc(doc(db, "groups", gid, "members", uid)); },

        // ----- Mitgliederlimit: Beitritt und Austritt sind ATOMAR -----
        //
        // Das Gruppendokument fuehrt memberCount, und die Firestore-Regel koppelt es per
        // getAfter() hart an die Mitgliedschaft: Wer beitritt, MUSS im selben Batch
        // hochzaehlen, wer austritt, herunter. Einzelne Schreibvorgaenge werden abgelehnt -
        // deshalb geht ab jetzt jede Mitgliedschaftsaenderung ueber diese beiden Methoden.
        //
        // increment() statt "gelesener Wert + 1": Zwei gleichzeitige Beitritte laegen sonst
        // auf derselben veralteten Basis, und die Regel wiese den zweiten ab. Firestore wertet
        // die Transformation vor der Regelpruefung aus, die Regel sieht also das Ergebnis.
        //
        // Seit dem 17.08.2026 faehrt ein DRITTES Dokument mit: der Einladungscode wird im
        // selben Batch als verbraucht markiert. Ein weitergereichter Link war sonst dauerhaft
        // eine offene Tuer - wer ihn je gesehen hat, kam herein, sobald ein Platz frei wurde.
        // Atomar ist hier keine Kuer: Ein Verbrauch ohne Beitritt (oder umgekehrt) waere
        // schlimmer als der heutige Zustand.
        //
        // Gespeichert wird nur `used: true`, keine UID des Beitretenden - wer dabei ist, sagt
        // die Mitgliederliste (CLAUDE.md, Ziffer 20).
        //
        // Die via-Pruefung ist Absicherung gegen einen Aufruf ohne Code: doc(db, "invites",
        // undefined) wuerde werfen und den ganzen Beitritt mitnehmen. Im Regelfall traegt
        // jeder Beitritt einen Code, der Gruender geht gar nicht ueber diesen Weg.
        joinAtomic: function (gid, uid, data) {
          const batch = writeBatch(db);
          batch.set(doc(db, "groups", gid, "members", uid), data, { merge: true });
          batch.update(groupDoc(gid), { memberCount: increment(1) });
          if (data && data.via) batch.update(doc(db, "invites", data.via), { used: true });
          return batch.commit();
        },
        leaveAtomic: function (gid, uid) {
          const batch = writeBatch(db);
          batch.delete(doc(db, "groups", gid, "members", uid));
          batch.update(groupDoc(gid), { memberCount: increment(-1) });
          return batch.commit();
        },
        // Einmalige Migration einer Gruppe aus der Zeit vor dem Limit. Nur der Inhaber darf
        // das Gruppendokument schreiben, und die Regel laesst genau diesen Fall zu, solange
        // das Feld noch fehlt.
        setCount: function (gid, n) { return updateDoc(groupDoc(gid), { memberCount: n }); },

        // ----- Wochenplan -----
        loadPlans: function (gid) {
          return getDocs(collection(db, "groups", gid, "plans")).then(function (snap) {
            return snap.docs.map(function (d) { return { week: d.id, fields: d.data() }; });
          });
        },
        // Vom SERVER, aus demselben Grund wie CloudSync.loadRecipesFromServer(): Wer seinen
        // eigenen Wochenplan in die Gruppe nachtraegt, fuellt nur die Slots, die dort NOCH
        // LEER sind (mergeOwnPlanIntoGroup). Ein leeres Cache-Ergebnis liesse jeden Slot leer
        // aussehen - und der Nachtrag ueberschriebe genau das, was er schonen soll.
        loadPlansFromServer: function (gid) {
          return getDocsFromServer(collection(db, "groups", gid, "plans")).then(function (snap) {
            return snap.docs.map(function (d) { return { week: d.id, fields: d.data() }; });
          });
        },
        savePlanWeek: function (gid, week, patch) {
          return setDoc(doc(db, "groups", gid, "plans", week), patch, { merge: true });
        },
        deletePlanWeek: function (gid, week) { return deleteDoc(doc(db, "groups", gid, "plans", week)); },
        watchPlans: function (gid, cb) {
          return onSnapshot(collection(db, "groups", gid, "plans"), function (snap) {
            cb(snap.docChanges().map(function (c) {
              return { type: c.type, week: c.doc.id, fields: c.doc.data(), pending: c.doc.metadata.hasPendingWrites };
            }));
          }, watchFehler("sync:watchPlaene"));
        },

        // ----- Einladungscodes -----
        // Gleiches Modell wie die Teilen-Links: der Code IST der Zugang (80 Bit aus
        // crypto.getRandomValues, siehe shareId()), und die Regel erlaubt ausdruecklich
        // nur "get" - waere "list" erlaubt, koennte jeder Angemeldete alle Codes und
        // damit alle Gruppen auflisten. Genau dieser Fehler steckte einmal in shared/.
        createInvite: function (code, data) { return setDoc(doc(db, "invites", code), data); },
        fetchInvite: function (code) {
          return getDoc(doc(db, "invites", code)).then(function (s) { return s.exists() ? s.data() : null; });
        },
        deleteInvite: function (code) { return deleteDoc(doc(db, "invites", code)); }
      };

      onAuthStateChanged(auth, function (user) {
        if (typeof window.__onCloudAuth === "function") window.__onCloudAuth(user);
      });
    } catch (e) {
      window.dispatchEvent(new CustomEvent("cloudauth:disabled"));
    }
  }
</script>

<script>
(function () {
  "use strict";

  // Gemeinsame Helfer aus lib/basis.js. Lokale Referenzen, damit die bestehenden
  // Aufrufstellen von esc() und el() im Kern unveraendert bleiben.
  const esc = PM.esc, el = PM.el;
  // Barcode-Infrastruktur aus lib/barcode.js und der PDF-Schreiber aus lib/pdf.js.
  const { BARCODE_FORMATS, BARCODE_SVG, QR_FORMATS, detectBarcode, fetchOffNutrition,
          loadZXing, offServingSize, qrSvg } = PM.barcode;
  const { pdfBrandHeader, pdfBytes, pdfEsc, pdfSlimHeader, prepareLogoForPdf, saveBlob, trunc } = PM.pdf;

  // ---------- Testumgebung von den echten Daten trennen ----------
  // localStorage haengt an der Origin, die Cloud nicht: http://localhost:8000 und
  // https://www.paddysmealplan.de sind zwei getrennte Speicher, melden sich aber an
  // DEMSELBEN Firebase-Projekt mit derselben UID an. Der lokale Teststand schrieb dadurch in
  // die echte Cloud - und weil mergeRemoteRecipes() ein nur lokal vorhandenes Meal als "neu,
  // noch nicht hochgeladen" wertet, tauchten dort laengst geloeschte Meals immer wieder auf.

  //    ist jedes frische Produkt geschuetzt, egal welchen Sync-Stand dieses Geraet sieht.

  // Bestandsprodukte ohne "created" sind aelter als diese Aenderung und damit per Definition
  // aelter als die Grenze.
  const QUICK_TTL = 21 * 24 * 3600 * 1000;   // > die zwei Wochen, die pruneWeeks haelt
  function pruneQuickRecipes() {
    const verplant = new Set();
    Object.keys(state.plans || {}).forEach(wk => {
      const pl = state.plans[wk];
      if (pl) DAYS.forEach(d => MEALS.forEach(m => {
        asIdList(pl[d.key] && pl[d.key][m.key]).forEach(e => verplant.add(entryId(e)));
      }));
    });
    const grenze = Date.now() - QUICK_TTL;
    const vorher = state.recipes.length;
    state.recipes = state.recipes.filter(r =>
      r.quick !== true || verplant.has(r.id) || !(typeof r.created !== "number" || r.created < grenze));
    return vorher - state.recipes.length;
  }

  // Welche Wochentage einer Woche beplant sind, als 7-Zeichen-Maske "1101100":
  // Index 0 = Montag ... 6 = Sonntag, Position ueber den DAYS-Index, nie ueber
  // Wochentagsarithmetik.

  // kalWoche() der Fortschritt-Kalender und die Tages-Serie. Genau dafuer stand sie
  // getrennt - der Kalender zeichnet die noch NICHT archivierten Wochen direkt aus
  // state.plans, und zwar nach derselben Regel. Zwei getrennte Fassungen wuerden sich in
  // genau dem Moment widersprechen, in dem eine laufende Woche archiviert wird. Der
  // frueher hier stehende Vorbehalt ("kommt der Kalender nicht, gehoert sie zurueck in
  // archiveWeek") ist damit erledigt.

  // Dazu ist "1101100" in der Firestore-Konsole lesbar, 108 nicht.
  function weekMaskOf(pl) {
    if (!pl) return "0000000";

  }
  function maskDays(m) { return (String(m || "").match(/1/g) || []).length; }

  // Zahlen, keine Meal-Referenzen — winzig, kein Foto-Ballast. Ziel-Treffer = Tag geplant UND
  // Tageskalorien innerhalb +/-10 % des (heutigen) Tagesziels. Ohne Ziel keine Treffer-Quote.
  // B10: Zusaetzlich wird das damals gueltige Tagesziel MITGESPEICHERT (`target`, Schnitt ueber
  // die geplanten Tage — Trainingstage haben ein hoeheres Ziel als Ruhetage). Ohne das misst
  // der Rueckblick jede vergangene Woche gegen das HEUTIGE Ziel: Wer sein Defizit aendert,
  // aendert damit rueckwirkend die Bedeutung seiner gesamten Historie.
  //
  // Paket 6: Der Ziel-Guard steht jetzt INNEN. Frueher stieg die Funktion bei !state.goal
  // sofort aus — damit hatte jeder, der ohne Ziel plant, ueberhaupt keine Vergangenheit,
  // und der Kalender waere fuer ihn dauerhaft leer geblieben. Geschuetzt gehoert nur der
  // goalTargetsForDay()-Aufruf, nicht die ganze Funktion: `days`/`kcal`/`d` sind vom Ziel
  // unabhaengig, `hit`/`target` sind es nicht.
  function archiveWeek(wk, pl) {

    const mask = weekMaskOf(pl);                // eine Quelle fuer "welcher Tag ist beplant"
    let sum = 0, days = 0, hit = 0, tsum = 0, tdays = 0;
    DAYS.forEach((d, i) => {
      if (mask.charAt(i) !== "1") return;
      const n = dayNutOf(pl, d.key);
      days++; sum += n.kcal;
      if (!state.goal) return;
      const t = goalTargetsForDay(d.key);
      if (t && t.kcal) { tsum += t.kcal; tdays++; }
      if (t && t.kcal && Math.abs(n.kcal - t.kcal) <= t.kcal * 0.1) hit++;
    });
    if (!days) return;                          // leere Woche hat keinen Rueckblick-Wert
    if (!state.weekStats) state.weekStats = {};
    const rec = { kcal: Math.round(sum / days), days: days, hit: hit, d: mask };
    if (tdays) rec.target = Math.round(tsum / tdays);
    state.weekStats[wk] = mergeArchived(state.weekStats[wk], rec);

  // Einen frisch gerechneten Wochendatensatz mit dem bereits gespeicherten vereinigen,

  //
  // Das repariert einen Fehler, den es auch ohne die Tagesmaske schon gab: pruneWeeks()

  // Baseline-Merge in startCloudSync). Ein Geraet, das lange offline war, sieht von einer
  // Vergangenheitswoche nur seinen duenneren Plan — und ueberschrieb damit bisher den
  // reicheren Datensatz, den der Sync gerade erst hergestellt hatte. Mit der Maske waere
  // daraus ein sichtbares Verschwinden von Tagen geworden.
  //
  // Die Regeln, und sie sind bewusst nicht dieselben fuer alle Felder:
  //
  // * `d` wird VEREINIGT (bitweises ODER). Ein Tag, den nur ein Geraet kennt, ist eine
  //   Beobachtung, kein Widerspruch — er darf nie verschwinden.
  // * `days` = Maximum aus beiden Zaehlern UND der Anzahl Einsen der vereinigten Maske.
  //   Nur so ist der Zaehler nie kleiner als die Maske hergibt und nie kleiner als ein
  //   frueher gemessener Wert. Bei Altwochen ohne `d` bleibt schlicht das Maximum uebrig.
  //   Ein Rest-Widerspruch bleibt moeglich (`days` groesser als die Maske, wenn die alte
  //   Woche vor Einfuehrung der Maske archiviert wurde) und ist gewollt: `days` traegt den
  //   Rueckblick, `d` den Kalender.
  // * `kcal`/`hit`/`target` kommen vom Lauf, der MEHR Tage gesehen hat. Der aermere Lauf
  //   gewinnt nicht — derselbe wertbasierte Gedanke wie im Tiebreak von mergeWeekStats().
  function mergeArchived(alt, neu) {
    if (!alt) return neu;

    // Seite uebernehmen, statt eine echte Zahl durch eine Null zu ersetzen.
    const ander = reicher === neu ? alt : neu;
    if (!out.target && ander.target) { out.target = ander.target; out.hit = ander.hit; }
    out.d = d;

  // Das Archivfenster — und warum die beiden Zahlen NICHT gleich sind.

  // haette ihm den Januar weggeschnitten, sobald der Juli da ist.

  // Ein einziges Geraet, das am Neujahrstag startet, kappt das Archiv auch in der Cloud und
  // auf allen anderen Geraeten. Unwiederbringlich.
  //
  // Mit dem Puffer faellt am Stichtag nur ein Jahrgang, der bereits ein volles Jahr lang

  // rund 3,7 KB gegen CLOUD_DOC_MAX = 900000.
  //
  // ⚠️ Die ANZEIGE muss ihre Jahre ueber archivJahreZeigen() beziehen — nie ueber
  // Object.keys(weekStats) und nie ueber ein aus dem Schluessel gerechnetes Datum. Sonst
  // bietet der Umschalter das Pufferjahr mit an, und der Puffer ist keiner mehr.
  //
  // Funktionen statt const, und das ist kein Geschmack: sanitizeWeekStats() wird aus load()
  // gerufen, und load() laeuft schon in `let state = load()` frueh im Script. Eine const an
  // dieser Stelle waere dort noch in der temporalen Totzone und wuerde die App beim Start
  // beenden - #view bleibt leer, syntax-check.py meldet sauber. Genau das ist am 29.08.2026
  // passiert; dieselbe Falle wie bei ING_UNITS und noConsent(), Einzelheiten in
  // docs/TROUBLESHOOTING.md Punkt 139. Funktionsdeklarationen werden komplett gehoistet.
  function archivJahre(anzahl) {

  // Archiv saeubern: nur gueltige "YYYY-Www"-Eintraege, geklemmte Werte, hoechstens die

      const days = Math.max(0, Math.min(7, Math.round(Number(s.days) || 0)));
      if (!days) return;
      out[k] = { kcal: Math.max(0, Math.round(Number(s.kcal) || 0)), days: days, hit: Math.max(0, Math.min(days, Math.round(Number(s.hit) || 0))) };
      // Eingefrorenes Tagesziel (B10). Nur uebernehmen, wenn es plausibel ist — sonst lieber
      // gar keins: der Rueckblick faellt dann auf das heutige Ziel zurueck, statt einen
      // kaputten Wert als Messlatte zu zeichnen. Woche ohne `target` = vor dieser Aenderung
      // archiviert, das ist ein Normalfall und keine Fehlerlage.
      const tgt = Math.round(Number(s.target) || 0);
      if (tgt >= 500 && tgt <= 20000) out[k].target = tgt;

      // Der Widerspruch bleibt gewollt stehen — `days` traegt den Rueckblick, `d` den
      // Kalender (siehe mergeArchived).

      if (typeof s.d === "string" && /^[01]{7}$/.test(s.d)) out[k].d = s.d;

    const behalte = archivJahreBehalten();

    Object.keys(out).sort().forEach(k => { if (behalte.indexOf(k.slice(0, 4)) >= 0) trimmed[k] = out[k]; });
    return trimmed;
  }
  // Zwei Archive zusammenfuehren. Notwendig geworden, als weekStats in den Cloud-Sync kam:

  // archivieren dieselbe Vergangenheit unabhaengig voneinander (pruneWeeks laeuft bei jedem
  // Laden), also wuerde ohne Vereinigung das zuletzt schreibende Geraet die Wochen des
  // anderen loeschen - dieselbe Fehlerklasse wie in TROUBLESHOOTING 34/44. Vereinigt wird
  // deshalb, nie ersetzt, genau wie bei shares, inviteCodes, weights und deleted.
  //
  // Der Tiebreak ist bewusst REIN WERTBASIERT und kennt kein "remote gewinnt": Sonst naehme
  // A den Wert von B und B gleichzeitig den von A, und die beiden tauschten eine Runde lang
  // hin und her, bevor sie sich einigen. Wertbasiert kommen beide Geraete unabhaengig zum
  // selben Ergebnis - es gibt nichts zu tauschen.
  //
  // Mehr `days` gewinnt, weil das Geraet mit mehr geplanten Tagen den vollstaendigeren Plan
  // gesehen hat (ein Handy, das zwei Wochen aus war, archiviert dieselbe Woche duenner).
  // Danach `hit`, `kcal`, `target` - nur als Entscheider bei Gleichstand, damit das Ergebnis
  // eindeutig ist und nicht von der Reihenfolge abhaengt.
  //
  // Bekanntes Limit, bewusst in Kauf genommen: Sind days/hit/kcal identisch und nur die
  // eingefrorenen Ziele verschieden (der Nutzer hat zwischen den beiden Archivierungen sein
  // Ziel geaendert), gewinnt schlicht das hoehere `target`. Das ist fachlich willkuerlich -
  // aber Eindeutigkeit ist hier mehr wert als die Wahl des "richtigeren" Ziels: Ein Tiebreak,
  // der die Geraete uneinig laesst, kostet nicht eine Kennzahl, sondern erzeugt einen
  // Dauerkonflikt. Der Fall verlangt drei identische Werte und ist entsprechend selten.
  //
  // Die Tagesmaske `d` steht bewusst NICHT in weekStatRang(). Der Rang entscheidet, welche
  // Seite ihre ZAHLEN durchsetzt; die Maske wird unabhaengig davon vereinigt. Naehme man sie
  // in den Rang auf ("mehr Einsen gewinnt"), loeschte man genau die Tage, die nur ein Geraet
  // kennt — der Fehler, gegen den das Feld ueberhaupt gebaut wurde.
  function weekStatRang(s) { return [s.days || 0, s.hit || 0, s.kcal || 0, s.target || 0]; }

  // Der Unterschied ist genau einer und er ist der ganze Sinn: mergeArchived() bevorzugt bei
  // Gleichstand den NEUEN Lauf (>=), weil der frisch gerechnete Wert der aktuellere ist.
  // Hier muss der Gleichstand richtungsunabhaengig aufgeloest werden - sonst nimmt Geraet A
  // den Wert von B und B gleichzeitig den von A (TROUBLESHOOTING 34/44).
  function mergeWeekStats(prim, sec) {

    const out = Object.assign({}, a);

      const alt = out[k];
      if (!alt) { out[k] = b[k]; return; }
      const ra = weekStatRang(alt), rb = weekStatRang(b[k]);
      let sieger = alt;

        if (rb[i] === ra[i]) continue;
        if (rb[i] > ra[i]) sieger = b[k];
        break;
      }
      out[k] = Object.assign({}, sieger);

      // von mergeArchived(). Die beiden Funktionen sehen sich damit aehnlich und duerfen
      // trotzdem NICHT zusammengelegt werden: mergeArchived() bevorzugt bei Gleichstand den
      // neuen Lauf, mergeWeekStats() muss richtungsunabhaengig bleiben (siehe oben).
      // Hat keine Seite eine Maske, entsteht auch keine — "0000000" waere eine erfundene
      // Aussage ueber eine Woche, die vor der Maske archiviert wurde.
      if (alt.d || b[k].d) {

        for (let i = 0; i < 7; i++) {

    // Archive kann Wochen aus einem zu alten Jahr einbringen, wenn ein Geraet lange nicht

    // NICHT das Mittel gegen zwei aufschaukelnde Geraete - das leistet allein der
    // wertbasierte Tiebreak oben.
    return sanitizeWeekStats(out);
  }

  function setViewWeek(which) {

    const key = activeWeekKey();
    if (!state.plans[key]) state.plans[key] = makeEmptyPlan();
    state.plan = state.plans[key];
  }

  // Trainingsplan auf gueltige Wochentage eindampfen: fremde Schluessel raus, Stufe auf

  // Bewusst eine `function` und keine `const`-Arrow — load() laeuft frueh, eine spaeter
  // deklarierte Konstante waere dort noch in der temporalen Todeszone und wuerde die

  function sanitizeTraining(t) {

    if (Array.isArray(t)) {

      return out;

      const e = t[d.key];
      if (!e || typeof e !== "object") return;

    delete out.trainingDays;

    else if (!ACTIVITY.some(a => a.key === out.activity)) out.activity = "pal14";

  function validMonthKey(s) {
    if (typeof s !== "string" || !/^\d{4}-\d{2}$/.test(s)) return false;

  async function pushGroupPlan() {
    if (!syncGid || !window.CloudGroup || !canEdit()) return;   // Nur-Ansehen schreibt nie
    const prev = lastPushedSlots || new Map();
    const weeks = Object.keys(state.plans || {});
    const patches = {};   // weekKey -> Feld-Patch
    // Direkt aus flat[field] schreiben statt ueber die Vergleichs-Zeichenkette - siehe Regel
    // bei dataJSON(): canonJSON dient NUR dem Vergleich, nie dem Schreiben.
    const mark = (wk, field, value) => {
      (patches[wk] || (patches[wk] = {}))[field] = value;
    };
    const seen = new Set();
    weeks.forEach(wk => {
      const flat = flattenWeek(state.plans[wk]);
      Object.keys(flat).forEach(field => {
        // canonJSON statt JSON.stringify: ein Slot-Eintrag ist heute zufaellig alphabetisch
        // ({id, uids}), ein kuenftiges drittes Feld risse die Falle sonst lautlos wieder auf
        // (siehe Plan-Kommentar zu Ursache A).
        const key = wk + "." + field, json = canonJSON(flat[field]);

    // Woche fuer Woche tote Dokumente an, die niemand mehr liest.

      mark(wk, field, []);

      try {
        await window.CloudGroup.deletePlanWeek(syncGid, wk);
        Array.from(prev.keys()).forEach(k => { if (k.indexOf(wk + ".") === 0) prev.delete(k); });

        await window.CloudGroup.savePlanWeek(syncGid, wk, Object.assign({}, patches[wk], { by: syncUid, at: Date.now() }));
        // Geleerte Felder aus der Baseline ENTFERNEN statt sie mit "[]" zu merken: sonst

        Object.keys(patches[wk]).forEach(field => {
          const value = patches[wk][field];
          if (Array.isArray(value) && !value.length) prev.delete(wk + "." + field);
          else prev.set(wk + "." + field, canonJSON(value));
        });
      }
      lastPushedSlots = prev;   // dieselbe Map weiterfuehren, nie ersetzen (wie bei lastPushedRecipes)
    } catch (e) {
      // Baseline unveraendert lassen -> naechster Zyklus versucht denselben Diff erneut.
      setSyncStatus("offline");
    }
  }

  async function pushNow() {

    const now = Date.now();
