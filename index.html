  // ---------- Auto-Wochenplaner (D2) ----------
  //
  // Ein Klick fuellt die offenen Slots der gezeigten Woche gegen das Kalorienziel. Kein
  // Konfigurationsdialog, kein Regler fuer Abwechslung: ein Ergebnis, Rueckgaengig daneben.
  //
  // Fuenf Regeln, die den ganzen Ablauf tragen:
  //   1. Nur fuellen, was FUER MICH leer ist. Bestehendes wird nie ueberschrieben.
  //   2. Meal-Prep vor Abwechslung - wenige Gerichte, die sich wiederholen. 21 verschiedene
  //      Gerichte sind das Gegenteil dessen, wofuer die App da ist.
  //   3. Das Ernaehrungsprofil ist eine harte Grenze, keine Gewichtung (fitsDiet).
  //   4. Die Kategorie muss zum Slot passen (catFitsMeal), genaue Treffer zuerst.
  //   5. In der Gruppe wird ein schon eingeplantes Gericht UEBERNOMMEN statt ein zweites
  //      gewaehlt: ein Topf, zwei Mengen. Nur wenn es zum eigenen Profil nicht passt, wird
  //      ein anderes gesucht.
  //
  // Pro-Gating: In einer Gruppe darf JEDES Mitglied planen, auch ohne eigenes Pro - in der
  // Gruppe zahlt der Inhaber, und ohne das liefe Regel 5 fuer Eingeladene leer. Die Sperre
  // ist hier ausnahmsweise reine UI: Der Planer schreibt nur Slots, die derselbe Nutzer auch
  // von Hand schreiben duerfte, es gibt also nichts serverseitig durchzusetzen (CLAUDE.md
  // §18 betrifft den Zugriff auf Daten, nicht den Komfort).

  // Anteile am Tagesziel. Der Snack steht bewusst NICHT in dieser Tabelle: er bekommt den
  // REST des Tages (Schritt 5), sonst muesste sich die Rundung der drei Hauptslots
  // irgendwo verstecken.
  const PLAN_SHARE = { fr: 0.25, mi: 0.35, ab: 0.30 };
  // So viele Gerichte je Slot-Art fuer die ganze Woche. Zwei waeren oede, sieben waeren
  // sieben Einkaeufe und sieben Kochabende (Regel 2). Mittag und Abend bekommen JE drei aus
  // getrennten Mengen - macht sechs verschiedene Hauptgerichte je Woche.
  const PLAN_VARIANTEN = 3;
  // Aus so vielen der bestbewerteten wird gezogen. Der Pool ist der Unterschied zwischen
  // "jede Woche derselbe Plan" (Pool = VARIANTEN) und "jede Woche wuerfeln" (Pool = alles):
  // Acht laesst die Auswahl deutlich streuen und haelt schwache Gerichte trotzdem draussen.
  const PLAN_POOL = 8;
  // Darunter waere der Plan eine Wiederholung desselben Tages - dann lieber ein klarer
  // Hinweis als ein magerer Plan.
  const PLAN_MIN_KANDIDATEN = 6;
  // Deckel je Slot: Bei einem 90-kcal-Snack und 900 kcal offenem Budget kaemen sonst zehn
  // Eintraege in eine einzige Zeile.
  const PLAN_MAX_PRO_SLOT = 4;
  // Ab dieser Abweichung wird die Woche beim Namen genannt statt schoengerechnet.
  const PLAN_TOLERANZ = 0.1;

  // Ist dieser Slot fuer MICH leer? Ein Eintrag, der nur anderen Mitgliedern zugewiesen ist,
  // zaehlt nicht - genau wie in dayNutOf(), das dieselbe Frage fuer die Bilanz beantwortet.
  function slotOpenForMe(dayKey, mealKey) {
    return !state.plan[dayKey][mealKey].some(e => {
      const uids = entryUids(e);
      return !uids || uids.indexOf(syncUid) !== -1;
    });
  }
  // Was kommt ueberhaupt in Frage? ZWEI Quellen, und die zweite ist der Grund, warum der
  // Planer ueberhaupt brauchbar ist:
  //
  //   1. der eigene Bestand (libraryRecipes)
  //   2. das Rezeptbuch (cookbookVisible), sofern noch nicht uebernommen
  //
  // Ohne Quelle 2 plant die App nach dem Onboarding aus FUENF Startmeals - bei drei
  // Haupt-Slots landet die Rotation dann zwangslaeufig sieben Tage lang auf demselben
  // Gericht. Genau das ist am 16.08.2026 passiert (sechsmal derselbe Joghurt zum Mittag),
  // waehrend 34 kuratierte Rezepte danebenlagen.
  //
  // cookbookVisible() filtert bereits ueber fitsDiet() - der Katalog kann also nie etwas
  // liefern, das der Ernaehrungsform widerspricht. isAdopted() haelt Dubletten heraus: Ein
  // schon uebernommenes Rezept liegt im eigenen Bestand und kommt ueber Quelle 1.
  //
  // Ohne Naehrwerte laesst sich nicht rechnen - solche Meals werden ausgeschlossen und NICHT
  // geschaetzt (in einer Fitness-App ist eine erfundene Zahl schlimmer als ein fehlendes
  // Gericht). Barcode-Schnellprodukte (quick) bleiben ueber libraryRecipes() ohnehin draussen.
  //
  // `__cb` markiert einen Katalog-Kandidaten. Es sitzt an einer FLACHEN KOPIE, nie am
  // Katalogeintrag selbst: COOKBOOK ist gemeinsamer Bestand, ein Feld daran wuerde die
  // Rezeptbuch-Ansicht und jede spaetere Uebernahme mitverschmutzen.
  function planKandidaten() {
    const eigene = libraryRecipes().filter(r => fitsDiet(r) && recipeNut(r).kcal > 0);
    const katalog = cookbookVisible()
      .filter(r => !isAdopted(r.id) && recipeNut(r).kcal > 0)
      .map(r => Object.assign({}, r, { __cb: true }));
    return eigene.concat(katalog);
  }
  // Welche Gerichte waren zuletzt dran? Zwei Quellen, und die erste kostet nichts:
  //
  //   1. die ANDERE Woche, die ohnehin im Speicher liegt (state.plans haelt aktuelle +
  //      naechste). Wer die naechste Woche plant, sieht damit die aktuelle - und zwar
  //      einschliesslich der von HAND eingeplanten Gerichte, die im Gedaechtnis nie stehen.
  //   2. state.planned, das Gedaechtnis ueber den Wochenwechsel hinaus.
  //
  // Rueckgabe: Set der ids aus der anderen Woche. Fuer das Gedaechtnis fragt planRang direkt.
  function planRecentIds() {
    const ids = new Set();
    const andere = weekKeyFor(state.viewWeek === "next" ? "cur" : "next");
    const p = (state.plans || {})[andere];
    if (!p) return ids;
    DAYS.forEach(d => MEALS.forEach(m => {
      (p[d.key] && p[d.key][m.key] || []).forEach(e => ids.add(entryId(e)));
    }));
    return ids;
  }
  // Bewertung eines Gerichts fuer einen Slot. Die Stufen liegen so weit auseinander, dass
  // eine hoehere nie von einer niedrigeren eingeholt wird: Kategorie schlaegt alles, dann
  // kommt die Wiederholung, dann Meal-Prep, dann Proteinanteil und Budget-Passung.
  //
  // `budget` ist das kcal-Budget des Slots an einem Ruhetag (optional), `letzte` das Set aus
  // planRecentIds().
  function planRang(r, mealKey, budget, letzte) {
    let s = 0;
    if (catSuggestsMeal(r.category, mealKey)) s += 100;   // genau dieser Slot statt nur "erlaubt"

    // ----- Wiederholung: was zuletzt dran war, rutscht nach hinten -----
    // Beide Werte liegen UEBER Meal-Prep (10) und Protein (max. 9), aber UNTER der Kategorie
    // (100): Ein kuerzlich gekochtes Gericht verliert damit gegen jedes frische, kann aber
    // nie in einen falschen Slot geraten.
    //
    // Bewusst ein Malus und KEINE Sperre: Bei sechs eigenen Meals wuerde ein Ausschluss Slots
    // leer lassen; so wirkt er gleichmaessig und das Ergebnis bleibt brauchbar. Mit 150
    // Rezepten fuehrt dieselbe Regel dazu, dass praktisch jede Woche andere Gerichte oben
    // stehen - eine Regel, die ueber beide Groessenordnungen traegt.
    const lib = r.__cb ? null : r.id;
    const w = lib && state.planned ? state.planned[lib] : null;
    if (w === weekKeyBack(0) || w === weekKeyBack(1)) s -= 40;
    else if (w === weekKeyBack(2)) s -= 20;
    if (letzte && lib && letzte.has(lib)) s -= 40;

    if (r.mealPrep === true) s += 10;
    const n = recipeNut(r);
    s += Math.min(9, (n.protein * 4 / n.kcal) * 20);      // Proteinanteil je kcal, gedeckelt

    // ----- Passt die Groesse zum Slot? -----
    // Seit dem 16.08.2026 gibt es je Hauptmahlzeit nur noch EINE Portion (siehe autoPlanWeek).
    // Damit entscheidet die Groesse des Gerichts darueber, wie gut der Tag gefuellt wird: Wer
    // 3200 kcal plant, soll die grossen Gerichte bekommen und nicht das proteinreichste mit
    // 400 kcal. Gedeckelt auf 5 - unter Meal-Prep, damit die Rangfolge darueber steht.
    if (budget > 0 && n.kcal > 0) s += 5 * Math.max(0, 1 - Math.abs(n.kcal - budget) / budget);

    // ----- In der Gruppe: was zu MEHR Profilen passt, kommt weiter nach vorn -----
    // Ein veganes Hauptgericht kann auch der Fleischesser mitessen (dietOk laesst es zu),
    // umgekehrt nicht. Wer als Erster plant, waehlt damit haeufiger etwas, dem die andere
    // Person spaeter BEITRETEN kann (Regel 5) - beide kochen einmal statt jeder fuer sich.
    //
    // Ohne fremde Profile zu lesen: bewertet wird allein das Gericht, nicht das Gegenueber.
    // Ziffer 8a der Datenschutzerklaerung bleibt unberuehrt.
    //
    // Hoechstens 8 und damit UNTER dem Wiederholungs-Malus (40): sonst stuende jede Woche
    // dasselbe vegane Gericht oben. Es ist ein Ausschlag bei annaehernd gleichem Rang, keine
    // Vorentscheidung. Allein (kein syncGid) aendert sich am Ergebnis NICHTS - der Solo-Planer
    // soll nicht ploetzlich vegetarisch bevorzugen.
    //
    // Der Deckel steht als Math.min() im CODE, nicht bloss im Kommentar. Die Summe ergibt heute
    // von selbst hoechstens 8 (5 + 1,5 + 1,5), aber nur weil es genau diese vier Tags gibt und
    // vegan/vegetarisch sich per else-if ausschliessen. Eine fuenfte Unvertraeglichkeit wuerde
    // den Beitrag sonst still ueber die 40 heben - eine Zusage, die von der Laenge einer Liste
    // abhaengt, ist keine.
    //
    // Wirkungslos und harmlos, wenn ich selbst schon vegan bin: dann sind alle Kandidaten vegan
    // (planKandidaten/cookbookVisible filtern ueber fitsDiet), der Beitrag ist konstant.
    if (syncGid && groupMembers.length > 1) {
      const tags = r.tags || [];
      let vertraeglich = 0;
      if (tags.indexOf("vegan") !== -1) vertraeglich += 5;
      else if (tags.indexOf("vegetarisch") !== -1) vertraeglich += 3;
      if (tags.indexOf("glutenfrei") !== -1) vertraeglich += 1.5;
      if (tags.indexOf("laktosefrei") !== -1) vertraeglich += 1.5;
      s += Math.min(8, vertraeglich);
    }

    // Gleichstand geht an das EIGENE Meal. Bewusst kleiner als jeder andere Beitrag: Der
    // Katalog soll nicht verdraengt werden, aber wer ein Gericht selbst angelegt hat, will
    // es auch im Plan sehen.
    if (!r.__cb) s += 0.5;
    return s;
  }
  // Die Wochengerichte einer Slot-Art.
  //
  // Bis zum 16.08.2026 wurden strikt die besten PLAN_VARIANTEN genommen. Das war
  // reproduzierbar - und genau das war das Problem: Zweimal planen ergab zweimal denselben
  // Plan, und wer sich etwas anderes wuenschte, musste von Hand umbauen.
  //
  // Jetzt wird aus den besten PLAN_POOL gezogen, gewichtet nach Rangplatz. Der Unterschied zu
  // "einfach wuerfeln" ist wesentlich: Ein Gericht ausserhalb des Pools kommt NIE vor, ein
  // schwaches im Pool selten. Jeder Lauf ergibt einen anderen Plan - und jeder ist gut.
  function planWochengerichte(kandidaten, mealKey, budget, letzte) {
    const passend = kandidaten.filter(r => catPlanFitsMeal(r.category, mealKey));
    // Mischen vor dem Sortieren: entscheidet weiterhin bei exaktem Punktgleichstand, weil
    // Array.sort stabil ist.
    for (let i = passend.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = passend[i]; passend[i] = passend[j]; passend[j] = t;
    }
    const pool = passend
      .sort((a, b) => planRang(b, mealKey, budget, letzte) - planRang(a, mealKey, budget, letzte))
      .slice(0, PLAN_POOL);
    // Gewichtete Ziehung ohne Zuruecklegen: Platz 1 bekommt das hoechste Gewicht, der letzte
    // Poolplatz das kleinste (aber nie 0 - sonst waere er gar nicht im Pool).
    const gezogen = [];
    while (gezogen.length < PLAN_VARIANTEN && pool.length) {
      let summe = 0;
      const gew = pool.map((r, i) => { const g = pool.length - i; summe += g; return g; });
      let wurf = Math.random() * summe;
      let idx = 0;
      for (; idx < gew.length - 1; idx++) { wurf -= gew[idx]; if (wurf <= 0) break; }
      gezogen.push(pool.splice(idx, 1)[0]);
    }
    return gezogen;
  }
  // Regel 5: Steht im Slot schon das Gericht der anderen, wird DASSELBE genommen.
  //
  // Geliefert wird { r, idx } statt nur des Rezepts: autoPlanWeek TRITT dem vorhandenen Eintrag
  // BEI, statt einen zweiten daneben zu legen - dafuer braucht es die Position im Slot. Vor dem
  // 16.08.2026 entstanden so zwei Karten mit demselben Gericht und zwei Badges; der Plan zeigte
  // die Buchhaltung statt das Essen ("ein Topf, zwei Teller").
  function planUebernahme(dayKey, mealKey) {
    const eintraege = state.plan[dayKey][mealKey];
    for (let i = 0; i < eintraege.length; i++) {
      const r = getRecipe(entryId(eintraege[i]));
      if (r && fitsDiet(r) && recipeNut(r).kcal > 0 && catPlanFitsMeal(r.category, mealKey)) return { r: r, idx: i };
    }
    return null;
  }
  // Bis zum 17.08.2026 stand hier planAdopt(): Ein gewaehltes Katalog-Rezept wurde in den
  // eigenen Bestand kopiert, weil normalizePlan() jeden Slot-Eintrag gegen die vorhandenen
  // Rezept-IDs filterte und eine Katalog-id sonst beim naechsten Laden lautlos verschwunden
  // waere. Genau DAS filtert normalizePlan() jetzt nicht mehr aus (Teil 1.2 des
  // Katalog-Umbaus) - ein Slot-Eintrag darf direkt auf eine COOKBOOK-id zeigen, und der
  // Planer kopiert nicht mehr. Der Bestand waechst dadurch nicht mehr mit jedem Planerlauf.
  // Was steht an diesem Tag schon fuer mich? Wird vom Snack-Rest abgezogen - sonst zaehlte
  // ein von Hand eingetragenes Fruehstueck nicht mit und der Tag laege darueber.
  function planTagKcal(dayKey) {
    return dayNutOf(state.plan, dayKey).kcal;
  }

  function autoPlanWeek() {
    if (!canEdit()) return;
    // Ohne Ziel gibt es nichts zu treffen - dann wird der Knopf gar nicht erst angeboten
    // (siehe renderPlan). Der Riegel hier ist die Absicherung dahinter, deshalb stumm.
    if (!goalTargets(1)) return;
    // Bewusst OHNE den Zusatz "in einer Gruppe plant jedes Mitglied mit": Diese Meldung
    // sieht nur, wer KEINE Gruppe hat (sonst greift die Sperre gar nicht) - der Hinweis
    // ginge also immer an die Falschen. Beim Gruppen-Blatt liegt der Fall anders, dort
    // betrifft der Zusatz dieselbe Person.
    if (!isPro() && !syncGid) { toast("Automatisch planen gehört zu Pro"); return; }
    const kand = planKandidaten();
    if (kand.length < PLAN_MIN_KANDIDATEN) { toast("Zu wenige passende Meals – leg noch welche an."); return; }

    const key = activeWeekKey();
    const before = {};
    DAYS.forEach(d => { before[d.key] = {}; MEALS.forEach(m => { before[d.key][m.key] = state.plan[d.key][m.key].slice(); }); });
    // Auch das Gedaechtnis gehoert in den Schnappschuss - sonst gaelten nach "Rueckgaengig"
    // Gerichte als "zuletzt geplant", die nie im Plan gelandet sind.
    const plannedBefore = Object.assign({}, state.planned || {});

    // Die Wochengerichte stehen VOR der Tagesschleife fest - das ist Regel 2 in einer Zeile.
    //
    // Mittag und Abend werden NACHEINANDER gezogen, und der Abend nur aus dem, was uebrig
    // bleibt. Ohne das bekamen beide Slots dieselbe Liste (gleiche Kandidaten, gleiche
    // Bewertung, deterministische Sortierung) und mit demselben Rotationsindex jeden Tag
    // dasselbe Gericht - der haeufigste Beschwerdepunkt am ersten Planer.
    const letzte = planRecentIds();
    const tagesziel = goalTargets(1);
    const budgetFuer = mk => tagesziel && PLAN_SHARE[mk] ? tagesziel.kcal * PLAN_SHARE[mk] : 0;
    const wahl = {};
    wahl.fr = planWochengerichte(kand, "fr", budgetFuer("fr"), letzte);
    wahl.mi = planWochengerichte(kand, "mi", budgetFuer("mi"), letzte);
    wahl.ab = planWochengerichte(kand.filter(r => wahl.mi.indexOf(r) === -1), "ab", budgetFuer("ab"), letzte);
    // Rueckfall, wenn der Rest zu duenn ist: aus der VOLLEN Menge auffuellen. Ein leerer oder
    // magerer Abend waere schlechter als eine Wiederholung - dass an EINEM Tag nicht zweimal
    // dasselbe steht, sichert ohnehin die Kollisionsregel weiter unten.
    //
    // Der erste Anlauf pruefte hier `restFuerAbend.length` und lag damit falsch: Die Restmenge
    // enthaelt ja noch Fruehstuecke und Snacks, ist also nie leer - nur an HAUPTGERICHTEN
    // fehlte es. Bei genau zwei Hauptgerichten im Bestand blieb der Abend dadurch die ganze
    // Woche leer. Gefunden vom Pruefstand, nicht beim Lesen.
    if (wahl.ab.length < PLAN_VARIANTEN) {
      planWochengerichte(kand, "ab", budgetFuer("ab"), letzte).forEach(r => {
        if (wahl.ab.length < PLAN_VARIANTEN && wahl.ab.indexOf(r) === -1) wahl.ab.push(r);
      });
    }
    wahl.sn = planWochengerichte(kand, "sn", 0, letzte);

    // Katalog-Rezepte werden seit dem 17.08.2026 NICHT mehr kopiert (getRecipe() und
    // normalizePlan() kennen den Katalog jetzt direkt) - planId liefert einfach r.id. Die
    // Katalog-Nutzung wird trotzdem gemerkt: der Toast soll weiterhin sagen koennen, dass
    // Gerichte aus dem Rezeptbuch dabei waren, auch ohne dass dafuer etwas in den Bestand
    // wandert.
    const ausKatalog = new Set();
    const planId = r => { if (r.__cb) ausKatalog.add(r.id); return r.id; };
    const meineUids = () => syncGid && syncUid ? [syncUid] : null;

    let gesetzt = 0;
    DAYS.forEach((d, di) => {
      const ziel = goalTargetsForDay(d.key);
      if (!ziel) return;
      // Laufender Rest des Tages. Startet beim Ziel abzueglich dessen, was schon fuer mich
      // im Plan steht, und schrumpft mit jedem gesetzten Slot - am Ende bekommt ihn der Snack.
      let offen = ziel.kcal - planTagKcal(d.key);
      // Was heute mittags gewaehlt wurde - der Abend darf es nicht noch einmal bekommen.
      // MEALS laeuft in der Reihenfolge fr, mi, ab, sn, mi ist also vor ab dran.
      let mittagsGericht = null;
      MEALS.forEach(m => {
        if (!slotOpenForMe(d.key, m.key)) return;
        const liste = wahl[m.key];
        const uebernommen = planUebernahme(d.key, m.key);

        // Gilt das ERSTE Gericht in diesem Slot fuer alle? Dieselbe Frage, die der Picker
        // seit jeher stellt - dort steht an fuenf Stellen woertlich
        //
        //   state.plan[day][meal].push(slotIsShared(day, meal) ? id : makeEntry(id, [syncUid]));
        //
        // und slotIsShared() ist bei einem LEEREN Slot true (every auf leerem Array). Von Hand
        // eingeplant entsteht in einer leeren Zeile also ein "fuer alle"-Eintrag; der Planer war
        // die einzige Stelle der App, die stattdessen immer nur sich selbst eintrug.
        //
        // Die Folge sah man erst am Geraet zu zweit: 31 von 31 Eintraegen trugen ein Badge, der
        // gemeinsame Plan war voll und fuer die andere Person trotzdem leer. Gemeinsam kochen ist
        // der Normalfall - der muss ohne Zusatzklick entstehen.
        //
        // Das ist KEINE Fremdplanung: Ueber das Kalorienziel der anderen wird nichts entschieden
        // (jede Bilanz rechnet weiter gegen ihr eigenes), und ein Klick auf das Personen-Symbol
        // nimmt das Gericht wieder heraus. Entschieden wird nur, was gekocht wird.
        //
        // VOR der Schleife festgehalten: Nach dem ersten Einfuegen waere die Antwort eine andere,
        // und dann bekaeme auch die zweite Portion ein "fuer alle" - zwei Portionen fuer jeden
        // statt zwei fuer mich.
        const slotGemeinsam = slotIsShared(d.key, m.key);

        // Der Snack-Slot bekommt VERSCHIEDENE Snacks, nicht ein Vielfaches desselben.
        // Vorher rechnete auch er `round(rest / kcal)` - bei einem 150-kcal-Shake und
        // 600 kcal Rest ergab das vier Stueck desselben Getraenks. Als Mahlzeit isst man
        // zwei verschiedene Kleinigkeiten, nicht viermal dasselbe.
        //
        // Bei fr/mi/ab bleibt das Vielfache dagegen richtig: Es ist der Kern des
        // Gruppen-Konzepts (2x Porridge bei 3000 kcal, 1x bei 1800).
        if (m.key === "sn" && !uebernommen) {
          for (let k = 0; k < liste.length && state.plan[d.key][m.key].length < PLAN_MAX_PRO_SLOT; k++) {
            const s = liste[(di + k) % liste.length];
            const skcal = recipeNut(s).kcal;
            // Ein weiterer Snack nur, wenn der Rest ihn im Wesentlichen noch traegt -
            // sonst schoebe die Zeile den Tag ueber das Ziel.
            if (offen < skcal * 0.6) break;
            // Der erste Snack gilt fuer alle, jeder weitere nur mir: Die Zahl der Snacks haengt
            // an MEINEM Restbudget, und wer ein kleineres Ziel hat, soll nicht automatisch drei
            // Kleinigkeiten mitessen.
            state.plan[d.key][m.key].push(makeEntry(planId(s), k === 0 && slotGemeinsam ? null : meineUids()));
            offen -= skcal;
            gesetzt++;
          }
          return;
        }

        // Rotation ueber den Wochentag statt Zufall je Slot: dasselbe Gericht landet an
        // mehreren Tagen, und die Reihenfolge ist nachvollziehbar (Regel 2). Der Abend
        // bekommt einen Versatz von eins - zweite Absicherung gegen "Mittag = Abend", falls
        // die Listen sich im Rueckfall doch ueberschneiden.
        let r = uebernommen ? uebernommen.r : null;
        if (!r && liste.length) {
          const versatz = m.key === "ab" ? 1 : 0;
          r = liste[(di + versatz) % liste.length];
          // Harte Garantie am Ende der Kette: Am selben Tag nie zweimal dasselbe Gericht.
          // Alles davor macht es unwahrscheinlich - hier wird es ausgeschlossen.
          //
          // Verglichen wird OHNE planId(): Seit dem 17.08.2026 kopiert planId() zwar nichts
          // mehr, merkt sich aber die Katalog-Nutzung fuer den Toast (ausKatalog-Set) - ein
          // Aufruf hier wuerde einen gleich wieder verworfenen Kandidaten faelschlich
          // mitzaehlen. Zwei Vergleiche genuegen und decken beide Faelle ab: die
          // Objektidentitaet gegen das mittags gewaehlte Gericht (trifft auch Katalog-
          // Kandidaten, weil kand einmalig gebaut wird und dieselben Objektreferenzen fuer
          // mi und ab benutzt), und - nur fuer eigene Meals - die id gegen das, was mittags
          // schon im Plan steht.
          if (m.key === "ab" && liste.length > 1) {
            const mittags = state.plan[d.key].mi.map(entryId);
            const kollidiert = x => x === mittagsGericht || (!x.__cb && mittags.indexOf(x.id) !== -1);
            for (let k = 1; k <= liste.length && kollidiert(r); k++) {
              r = liste[(di + versatz + k) % liste.length];
            }
          }
        }
        if (!r) return;
        const kcal = recipeNut(r).kcal;
        // Beim Snack (nur noch im Uebernahme-Fall) gibt es KEIN Minimum von eins: Ist der
        // Tag rechnerisch voll, bleibt die Zeile leer, statt ihn ueber das Ziel zu schieben.
        //
        // Bei den Hauptmahlzeiten gibt es allein GENAU EINE Portion. Mehrere Eintraege
        // desselben Gerichts sind nur in der Gruppe sinnvoll: Dort tragen sie die eigentliche
        // Information ("ein Topf, verschiedene Kalorienziele" - drei Leute mit 3000/2000/1800
        // essen dasselbe Gericht unterschiedlich oft). Allein sieht dieselbe Zahl nur nach
        // einem Fehler aus; was zum Tagesziel fehlt, geht in die Snack-Zeile.
        const maxPort = syncGid ? 2 : 1;
        const n = m.key === "sn"
          ? Math.min(PLAN_MAX_PRO_SLOT, Math.round(offen / kcal))
          : Math.max(1, Math.min(maxPort, Math.round(ziel.kcal * PLAN_SHARE[m.key] / kcal)));
        if (n < 1) return;
        if (m.key === "mi") mittagsGericht = r;
        const rid = planId(r);
        for (let i = 0; i < n; i++) {
          // Erste Portion im Uebernahmefall: dem vorhandenen Eintrag BEITRETEN statt einen
          // zweiten daneben zu legen - derselbe Topf, ein Teller mehr. makeEntry() macht daraus
          // von selbst ein "fuer alle" (blanker String), sobald damit jedes Mitglied abgedeckt
          // ist; aus zwei Karten wird eine, ohne neue Logik.
          //
          // Braucht jemand ZWEI Portionen, kommt der zweite Eintrag regulaer dazu (i > 0). Das
          // ist dann eine echte Aussage ("ich esse davon zwei") und keine Doppelung.
          //
          // ERSETZEN, nicht mutieren: `before` haelt nur eine flache Kopie des Slot-Arrays. Ein
          // uids.push() am vorhandenen Objekt schluege durch den Undo-Pfad durch und veraenderte
          // den fremden Eintrag dauerhaft.
          //
          // Die Faelle "Eintrag ohne uids" und "uids enthaelt mich schon" koennen hier nicht
          // auftreten: beide machen den Slot ueber slotOpenForMe() fuer mich zu, der Planer
          // laeuft dort gar nicht erst.
          if (i === 0 && uebernommen && meineUids()) {
            const alt = state.plan[d.key][m.key][uebernommen.idx];
            const altUids = entryUids(alt);
            if (altUids) state.plan[d.key][m.key][uebernommen.idx] = makeEntry(entryId(alt), altUids.concat(syncUid));
            continue;
          }
          // makeEntry je Eintrag neu: eine gemeinsame Objektreferenz mehrfach im Plan waere
          // eine Falle fuer jede spaetere Aenderung an genau einem der Eintraege.
          //
          // Die erste Portion in einer leeren Zeile gilt fuer alle (siehe slotGemeinsam oben),
          // jede weitere nur mir: "wir essen dasselbe, ich zweimal" - genau die Aussage, fuer
          // die es die Mehrfacheintraege in der Gruppe ueberhaupt gibt.
          // Allein liefert makeEntry ohnehin die schlichte String-Form.
          state.plan[d.key][m.key].push(makeEntry(rid, i === 0 && slotGemeinsam ? null : meineUids()));
        }
        offen -= n * kcal;
        gesetzt += n;
      });
    });

    if (!gesetzt) { toast("Deine Woche ist schon geplant"); return; }

    // Gedaechtnis fortschreiben: Was dieser Lauf gesetzt hat, gilt fuer die geplante Woche als
    // "war dran" und wird beim naechsten Mal abgewertet. Erst NACH der Schleife, damit ein
    // Gericht, das in derselben Woche mehrfach vorkommt, nur einen Eintrag bekommt.
    if (!state.planned) state.planned = {};
    const geplanteWoche = key;
    DAYS.forEach(d => MEALS.forEach(m => {
      state.plan[d.key][m.key].forEach(e => { state.planned[entryId(e)] = geplanteWoche; });
    }));

    save(); render();

    // Schritt 7 - ehrlich sein. Eine Woche, die deutlich unter dem Ziel liegt, wird benannt
    // und nicht kaschiert; lieber ein offener Rest als ein schoengerechneter Plan.
    //
    // Geprueft werden BEIDE Saeulen. Der Planer rechnet die Mengen gegen kcal, Protein wirkt
    // nur ueber die Vorsortierung (planRang) - ein Plan kann also die Kalorien treffen und
    // das Proteinziel trotzdem verfehlen. In einer Fitness-App ist genau das der Fall, der
    // nicht verschwiegen werden darf. Beim Protein zaehlt nur ein DEFIZIT: Es ist eine
    // Untergrenze, darueber ist gut (dieselbe Lesart wie goalState(..., "min")).
    const wZiel = goalTargetsForDays(DAYS.map(d => d.key));
    const wIst = weekNut();
    const diff = wZiel ? wIst.kcal - wZiel.kcal : 0;
    const protFehlt = wZiel ? wZiel.protein - wIst.protein : 0;
    const wenigAuswahl = MEALS.some(m => m.key !== "sn" && wahl[m.key].length < 2);
    // Nur EIN Zusatz, damit der Toast kurz bleibt. Reihenfolge: die Zielverfehlung zuerst
    // (kcal vor Protein - wer 3000 kcal zu wenig plant, hat das groessere Problem), dann die
    // Nutzung des Rezeptbuchs. Seit dem 17.08.2026 entsteht dabei nichts mehr im eigenen
    // Bestand (kein stiller Zuwachs mehr) - genannt wird es trotzdem, weil es fuer die Person
    // eine relevante Information bleibt ("woher kommt die Abwechslung diese Woche").
    let msg = "Woche geplant";
    if (wZiel && Math.abs(diff) > wZiel.kcal * PLAN_TOLERANZ) {
      msg += diff < 0 ? ` · noch rund ${nfmt(-diff)} kcal offen` : ` · rund ${nfmt(diff)} kcal über dem Ziel`;
    } else if (wZiel && protFehlt > wZiel.protein * PLAN_TOLERANZ) {
      msg += ` · rund ${nfmt(protFehlt)} g Protein fehlen`;
    } else if (ausKatalog.size) {
      msg += ` · ${ausKatalog.size} Meal${ausKatalog.size === 1 ? "" : "s"} aus dem Rezeptbuch`;
    } else if (wenigAuswahl) {
      msg += " · mehr Meals bringen mehr Abwechslung";
    }
    // Den Vorschlag vollstaendig zuruecknehmen: nur noch die Slots und das Gedaechtnis - seit
    // dem 17.08.2026 gibt es keine still uebernommenen Rezeptbuch-Meals mehr, die dabei
    // mitgeraeumt werden muessten (siehe planId()-Kommentar oben). Ein Weg fuer BEIDE Knoepfe -
    // "Nochmal" ist nichts anderes als "Rueckgaengig und dann noch einmal planen", und zwei
    // getrennte Ruecknahmepfade waeren die sichere Art, dass einer von beiden etwas vergisst.
    const zuruecknehmen = () => {
      const p = state.plans[key]; if (!p) return false;   // Woche existiert praktisch immer noch
      DAYS.forEach(d => MEALS.forEach(m => { p[d.key][m.key] = before[d.key][m.key]; }));
      state.planned = plannedBefore;
      return true;
    };
    undoToast(msg, () => { if (zuruecknehmen()) { save(); render(); } }, {
      // "Nochmal" wuerfelt einen neuen Vorschlag: zuruecknehmen, dann derselbe Aufruf. Ohne
      // diesen Knopf muesste man ueber "Woche leeren" samt Rueckfrage gehen, um eine zweite
      // Fassung zu sehen - drei Schritte fuer etwas, das eine Meinungsfrage ist.
      // Ohne save()/render() dazwischen: autoPlanWeek macht beides selbst.
      label: "Nochmal",
      fn: () => { if (zuruecknehmen()) autoPlanWeek(); },
      // Ein Wochenplan will laenger angesehen werden als ein geloeschter Slot.
      ms: 9000
    });
  }

  function clearWeek() {
    if (planStats() === 0) { toast("Der Plan ist schon leer"); return; }
    confirmModal({
      title: "Woche leeren?",
      text: "Alle Zuordnungen im Wochenplan werden entfernt. Deine Meals bleiben erhalten.",
      okLabel: "Woche leeren",
      onConfirm: () => {
        const key = activeWeekKey();
        const before = {}; DAYS.forEach(d => { before[d.key] = {}; MEALS.forEach(m => { before[d.key][m.key] = state.plan[d.key][m.key].slice(); }); });
        DAYS.forEach(d => MEALS.forEach(m => { state.plan[d.key][m.key] = []; }));
        save(); render();
        undoToast(state.viewWeek === "next" ? "Nächste Woche geleert" : "Woche geleert", () => {
          const p = state.plans[key]; if (!p) return;   // Woche existiert nach 5 s praktisch immer noch
          DAYS.forEach(d => MEALS.forEach(m => { p[d.key][m.key] = before[d.key][m.key]; }));
          save(); render();
        });
      }
    });
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;   // wird u. a. aus save() gerufen, das sehr frueh laufen kann
    t.classList.remove("has-undo");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); clearTimeout(undoTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
  }
  // ---------- Toast mit Rueckgaengig (Paket B1) ----------
  // Fuer destruktive Aktionen, die sich direkt danach noch leicht zuruecknehmen lassen (Slot
  // entfernen, Meal verschieben, Woche leeren, Meal loeschen, Wiegung loeschen): laenger sichtbar
  // als der normale Toast UND mit eigenem Knopf statt automatischem Verschwinden. Text per
  // textContent (nicht innerHTML) gesetzt, weil Meal-/Wochentagsnamen im Text stehen koennen -
  // kein Injection-Risiko durch Nutzereingaben.
  let undoTimer = null;
  // `opts` ist optional und aendert am bestehenden Verhalten nichts - die sechs Altaufrufer
  // bleiben unveraendert bei einem Knopf und 5 Sekunden. Der Auto-Wochenplaner braucht einen
  // zweiten Knopf ("Nochmal") und mehr Zeit, weil ein Wochenplan laenger angesehen wird als
  // ein geloeschter Slot. Bewusst dieselbe Funktion statt einer zweiten daneben: sonst gibt
  // es zwei Toasts mit Knopf, die sich langsam auseinanderentwickeln.
  //   opts = { label, fn, ms }
  function undoToast(msg, undoFn, opts) {
    const t = document.getElementById("toast");
    if (!t) return;
    clearTimeout(toastTimer); clearTimeout(undoTimer);
    t.textContent = "";
    const span = document.createElement("span"); span.textContent = msg;
    t.appendChild(span);
    const finish = () => { t.classList.remove("show", "has-undo"); t.textContent = ""; };
    const knopf = (label, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "toast-undo"; b.textContent = label;
      b.addEventListener("click", () => { clearTimeout(undoTimer); finish(); fn(); });
      t.appendChild(b);
      return b;
    };
    // Reihenfolge: der Zusatzknopf zuerst, "Rueckgaengig" bleibt aussen rechts - dort sucht
    // man es nach sechs anderen Stellen in der App.
    if (opts && opts.fn) knopf(opts.label || "Nochmal", opts.fn);
    knopf("Rückgängig", undoFn);
    t.classList.add("show", "has-undo");
    undoTimer = setTimeout(finish, (opts && opts.ms) || 5000);
  }

  // ---------- Event delegation ----------
  // Meal-Foto in der grossen Ansicht (openMealSheet, "Foto waehlen"/"Foto aendern"): ein
  // globales, wiederverwendetes file-input. Frueher gab es hier zusaetzlich einen Klickpfad
  // ueber ein "+" direkt auf der Meal-Karte (photoTargetId, data-action="photo") - der
  // entfiel mit .imgadd (siehe plans/MealAnsicht.MD Schritt 3, das Herz ersetzt das Plus).
  // Datei-Drop und Strg+V auf die Karte (weiter unten) haengen NICHT an photoTargetId, sie
  // lesen ihr Ziel direkt aus .rcard[data-rid] bzw. hoveredCardId - beide bleiben unangetastet.
  const photoInput = document.createElement("input");
  photoInput.type = "file"; photoInput.accept = "image/*"; photoInput.className = "visually-hidden";
  document.body.appendChild(photoInput);
  // Gesetzt von openMealSheet(): bekommt die fertige dataUrl statt dass der Handler
  // render() ruft - die offene Ansicht aktualisiert damit nur ihr eigenes <img>, ohne den
  // Rest der Seite (und den gerade offenen Dialog) neu aufzubauen.
  let photoDoneCb = null;
  photoInput.addEventListener("change", () => {
    const f = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    const cb = photoDoneCb; photoDoneCb = null;
    if (!cb) return; // photoInput.click() kommt heute ausschliesslich aus openMealSheet()
    if (!f) return;
    if (!canEdit()) return;
    if (!/^image\//.test(f.type)) { toast("Bitte ein Bild verwenden"); return; }
    readAndDownscale(f, dataUrl => { if (dataUrl) cb(dataUrl); else toast("Bild konnte nicht geladen werden"); });
  });

  // Profilbild ueber "Profil bearbeiten" (eigenes file-input, bewusst nicht photoInput
  // wiederverwendet - das haengt an Rezept-IDs, hier gibt es kein Zielobjekt dieser Art).
  const avatarInput = document.createElement("input");
  avatarInput.type = "file"; avatarInput.accept = "image/*"; avatarInput.className = "visually-hidden";
  document.body.appendChild(avatarInput);
  let avatarCropCb = null;
  avatarInput.addEventListener("change", () => {
    const f = avatarInput.files && avatarInput.files[0];
    avatarInput.value = "";
    const cb = avatarCropCb; avatarCropCb = null;
    if (!f || !cb) return;
    if (!/^image\//.test(f.type)) { toast("Bitte ein Bild verwenden"); return; }
    openAvatarCropper(f, cb);
  });

  // Alles, was Meals oder den Wochenplan veraendert. Ein Nur-Ansehen-Mitglied wird hier
  // an EINER Stelle abgefangen, statt in acht einzelnen Zweigen - so kann kein neuer
  // Zweig die Sperre versehentlich umgehen.
  // Verbindlich ist trotzdem allein die Firestore-Regel: Was hier passiert, ist Komfort
  // und mit den Entwicklerwerkzeugen umgehbar.
  // "delete" und "share-recipe" standen hier mit, obwohl es die Aktionen nicht mehr gibt:
  // Meal loeschen und teilen laufen ueber die data-del-/data-share-Knoepfe im Meal-Sheet,
  // und dorthin kommt eine Nur-Lese-Rolle gar nicht erst (canEdit() in openMealSheet).
  // "clear-week" ist seit B3 keine data-action mehr: der Eintrag steht im Ueberlaufmenue
  // (togglePlanMenu) und ruft clearWeek() direkt auf. Das Menue selbst wird nur bei
  // canEdit() gerendert - dieselbe Lage wie bei den data-del-/data-share-Knoepfen im
  // Meal-Sheet.
  const WRITE_ACTIONS = ["new-recipe", "pick", "unassign", "assign"];
  function blockedByRole() {
    if (canEdit()) return false;
    toast("Du kannst diesen Plan ansehen – zum Mitplanen bitten die Inhaberin oder den Inhaber um Rechte.");
    return true;
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const a = t.dataset.action;
    if (WRITE_ACTIONS.indexOf(a) !== -1 && blockedByRole()) return;
    // Der Meals-Reiter startet IMMER bei den eigenen Meals, auch wenn zuletzt das Rezeptbuch
    // offen war. Wer den Reiter anwaehlt, will seinen Bestand sehen - der Katalog ist ein
    // Ausflug, kein Zustand. (Dieselbe Ueberlegung wie bei recipeQuery: nichts merken, was
    // beim naechsten Aufruf unerklaerlich waere.)
    if (a === "tab") { if (t.dataset.tab === "recipes") recipeTab = "meine"; state.tab = t.dataset.tab; render(); }
    else if (a === "new-recipe") openMealSheet(null);
    // originEl fuer die FLIP-Oeffnung (plans/MealAnsicht.MD Schritt 4) - trifft die
    // Meal-Karte (Klick auf .rcard-open, data-action liegt am inneren Knopf) UND den
    // Wochenplan-Slot (data-action liegt direkt an .filled) gleichermassen. Beide oeffnen
    // lesend (Nachtrag Abnahme Phase 2, 08.08.2026, vorher nur der Wochenplan-Slot) - ein
    // Vertipper beim blossen Nachschlagen soll nicht sofort autosaven, egal aus welchem
    // Reiter. Bearbeiten ist ueberall nur den "Bearbeiten"-Knopf im Kopf entfernt.
    else if (a === "view") {
      const origin = e.target.closest(".rcard, .filled");
      openMealSheet(t.dataset.id, null, origin);
    }
    else if (a === "toggle-cat") {
      const c = t.dataset.cat;
      if (collapsedCats.has(c)) collapsedCats.delete(c); else collapsedCats.add(c);
      render();
    }
    else if (a === "toggle-fav") {
      // Favoriten sind persoenlich (Konto-Dokument) - auch Nur-Ansehen-Mitglieder
      // einer Gruppe duerfen favorisieren, daher bewusst nicht in WRITE_ACTIONS.
      const id = t.dataset.id;
      // Die Favoriten-Gruppe entsteht bzw. verschwindet OBERHALB der geklickten Karte - ohne
      // Ausgleich rutscht die ganze Ansicht weg. scrollY absolut zu konservieren (wie render()
      // es tut) reicht dafuer nicht: der Inhalt wandert ja tatsaechlich. Deshalb die Verschiebung
      // eines Ankers messen und die Differenz aufs Scrolling addieren.
      //
      // Anker ist bewusst die LETZTE Karte mit dieser rid, nicht die angeklickte: Ein Favorit
      // steht zweimal im DOM (oben in der Gruppe, unten in seiner Kategorie), die Favoriten-Gruppe
      // ist immer die erste. "Letzte" trifft damit vor UND nach dem Repaint dieselbe Instanz -
      // die angeklickte zu nehmen waere falsch, sobald jemand das Herz oben in der Gruppe drueckt.
      //
      // Zweiter Anker als Rueckfall: Steht die Karte nach dem Repaint NIRGENDWO mehr, greift
      // der erste nicht. Das ist kein Randfall, sondern Alltag - nach jedem Neuladen ist nur
      // die erste Kategorie offen (collapsedCats ist bewusst fluechtig), die Favoriten-Gruppe
      // dagegen immer. Entfernt man dort den letzten Favoriten, verschwindet die Gruppe UND
      // die Kategorie-Karte ist eingeklappt. Dann dient die erste echte Kategorie-Gruppe als
      // Anker - sie liegt immer unter der Favoriten-Gruppe und ueberlebt den Repaint.
      const cardTop = list => (list.length ? list[list.length - 1].getBoundingClientRect().top : null);
      const groupTop = () => {
        const g = view.querySelector("#r-groups .catgroup:not(.favgroup)");
        return g ? g.getBoundingClientRect().top : null;
      };
      const before = cardTop(view.querySelectorAll(`.rcard[data-rid="${id}"]`));
      const beforeGroup = groupTop();
      const hadFocus = t === document.activeElement;

      if (!state.favs) state.favs = [];
      state.favs = isFav(id) ? state.favs.filter(x => x !== id) : sanitizeFavs(state.favs.concat(id));
      save();               // persistiert + scheduleCloudPush()
      paintRecipeGroups();  // nur die Liste neu zeichnen, sonst faellt der Fokus aus dem Suchfeld

      const post = view.querySelectorAll(`.rcard[data-rid="${id}"]`);
      const anchor = post.length ? post[post.length - 1] : null;
      const shift = anchor && before !== null
        ? anchor.getBoundingClientRect().top - before
        : (beforeGroup !== null && groupTop() !== null ? groupTop() - beforeGroup : 0);
      // scrollX mitnehmen statt hart 0 - hier gibt es heute keinen Querlauf, aber ein
      // stillschweigendes Zuruecksetzen waere eine Falle fuer spaetere breite Inhalte.
      if (shift) window.scrollTo(window.scrollX, window.scrollY + shift);

      // Der geklickte Knopf ist durch innerHTML ersetzt - ohne das hier faellt der Fokus auf
      // <body> und man tabbt nach jedem Herz wieder von vorn. preventScroll, damit das
      // Einfangen nicht die gerade gesetzte Scrollposition wieder verschiebt.
      if (hadFocus) {
        const btn = anchor && anchor.querySelector('[data-action="toggle-fav"]');
        // Ist die Karte weg (siehe oben), auf die naechste Kopfzeile ausweichen - irgendwo
        // in der Liste weitertabben zu koennen ist besser als der Sprung an den Seitenanfang.
        const back = btn || view.querySelector("#r-groups .cathead[data-action]") || view.querySelector("#r-search");
        if (back) back.focus({ preventScroll: true });
      }
    }
    else if (a === "toggle-day-goals") {
      const d = t.dataset.day;
      if (expandedDayGoals.has(d)) expandedDayGoals.delete(d); else expandedDayGoals.add(d);
      // Auf dem Handy nur die klebende Leiste neu zeichnen. Ein volles render() baute
      // #view neu auf und ruesste dabei die Scrollposition der Seite durcheinander -
      // ausgerechnet beim Aufklappen, wo man genau hinsieht.
      //
      // paintDayBalance() meldet selbst, ob es zustaendig war. Zuerst stand hier eine
      // Pruefung auf document.getElementById("day-bal") - die war falsch: die Leiste steht
      // in JEDEM Durchlauf im Markup und ist am Rechner nur per CSS versteckt. Der Zweig
      // griff also immer, und am Rechner wurde stillschweigend die unsichtbare Leiste
      // bemalt, waehrend die angeklickte Karte unveraendert stehen blieb.
      if (!paintDayBalance(d)) render();
    }
    else if (a === "toggle-others") {
      const s = t.dataset.slot;
      if (expandedOthers.has(s)) expandedOthers.delete(s); else expandedOthers.add(s);
      render();
    }
    else if (a === "pick") openPicker(t.dataset.day, t.dataset.meal);
    else if (a === "assign") { e.stopPropagation(); openAssignMenu(t); }
    else if (a === "unassign") {
      e.stopPropagation();
      const [d, m, i] = t.dataset.slotSrc.split(":");
      const idx = Number(i);
      const removedId = state.plan[d][m][idx];
      state.plan[d][m].splice(idx, 1);
      save(); render();
      undoToast("Entfernt", () => { state.plan[d][m].splice(idx, 0, removedId); save(); render(); });
    }
    else if (a === "shopping") openShopping();
    else if (a === "auto-plan") autoPlanWeek();
    else if (a === "week") {
      if ((t.dataset.week === "next") !== (state.viewWeek === "next")) {
        // Anker-Regel + Uebergangsrichtung fuer renderPlan() (Schritt 2/5): "next" setzt
        // auf Montag, "cur" auf heute; die Pfeilrichtung erzaehlt, woher man kommt.
        pendingWeekDir = t.dataset.week === "next" ? 1 : -1;
        pendingDayTarget = t.dataset.week === "next" ? 0 : "today";
        setViewWeek(t.dataset.week);
        render();
        // innerHTML zerstoert den gedrueckten Knopf, render() faengt den Fokus auf der
        // Haupt-Tableiste ab - das katapultiert aus dem Wochenumschalter heraus.
        // preventScroll ist Pflicht, sonst reisst der Fokus .week an eine andere
        // Position und torpediert den gerade gesetzten Sprung.
        const active = view.querySelector(".ws-btn.active");
        if (active) active.focus({ preventScroll: true });
      }
    }
    else if (a === "wyear") { if (String(state.viewYear) !== t.dataset.year) { state.viewYear = +t.dataset.year; render(); } }
    else if (a === "kalmode") { if (state.kalMode !== t.dataset.mode) { state.kalMode = t.dataset.mode; render(); } }
    // Monat blaettern. Ueber die Jahresgrenze wandert das Jahr mit - und zwar state.viewYear,
    // dasselbe, das die Gewichtskarte liest. Die Grenzen kommen aus weightYears(); ausserhalb
    // gibt es garantiert nichts zu sehen, deshalb sind die Pfeile dort gesperrt.
    else if (a === "kalnav") {
      const ys = weightYears();
      let y = +activeYear(), m = activeMonth() + (+t.dataset.step);
      if (m < 0) { m = 11; y--; }
      else if (m > 11) { m = 0; y++; }
      if (ys.indexOf(String(y)) === -1) return;
      state.viewYear = y; state.kalMonth = m; render();
    }
    else if (a === "weigh") openWeighForm();
    else if (a === "weight-menu") toggleWeightMenu(t);
    else if (a === "weight-consent-in") weightConsentModal();
    else if (a === "weight-manage") openWeighForm(true);
    else if (a === "plan-menu") togglePlanMenu(t);
    else if (a === "tune-goal") openGoalTuneForm();
    else if (a === "recalc-goal") startOnboarding({ first: false });
    else if (a === "profile-menu") toggleProfileMenu();
    else if (a === "impressum") openImpressum();
    else if (a === "datenschutz") openDatenschutz();
  });

  // ---------- Drag & drop between slots ----------
  let dragSrc = null;
  view.addEventListener("dragstart", e => {
    const f = e.target.closest(".filled[data-slot-src]");
    if (!f) return;
    // Beim Nur-Ansehen gar nicht erst greifen lassen: den Drop zu blockieren erzeugte
    // sichtbares Zieh-Feedback, das dann folgenlos bleibt - das wirkt kaputt.
    if (!canEdit()) { e.preventDefault(); return; }
    dragSrc = f.dataset.slotSrc;
    f.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragSrc); } catch (err) { noteError("plan:dragSetData", err); }
  });
  view.addEventListener("dragend", e => {
    const f = e.target.closest(".filled"); if (f) f.classList.remove("dragging");
    view.querySelectorAll(".slot.dragover, .slot.nodrop").forEach(s => s.classList.remove("dragover", "nodrop"));
    dragSrc = null;
  });
  // Kategorie des gerade gezogenen Meals – "day:meal:idx" -> Rezept
  function draggedCat() {
    if (!dragSrc) return null;
    const [d, m, i] = dragSrc.split(":");
    const r = getRecipe(entryId((state.plan[d] && state.plan[d][m] || [])[Number(i)]));
    return r ? r.category : null;
  }
  function dropAllowed(slot) {
    return catFitsMeal(draggedCat(), slot.dataset.meal);
  }
  view.addEventListener("dragover", e => {
    const slot = e.target.closest(".slot[data-slot]");
    if (!slot || !dragSrc) return;
    if (!dropAllowed(slot)) { e.dataTransfer.dropEffect = "none"; slot.classList.add("nodrop"); return; }
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    slot.classList.add("dragover");
  });
  view.addEventListener("dragleave", e => {
    const slot = e.target.closest(".slot[data-slot]");
    if (slot && !slot.contains(e.relatedTarget)) slot.classList.remove("dragover", "nodrop");
  });
  view.addEventListener("drop", e => {
    const slot = e.target.closest(".slot[data-slot]");
    if (!slot || !dragSrc || !dropAllowed(slot)) return;
    e.preventDefault();
    const target = slot.dataset.slot;
    const [sd, sm, si] = dragSrc.split(":");
    const [td, tm] = target.split(":");
    if (sd === td && sm === tm) { render(); return; } // gleicher Slot – nichts tun
    const moving = state.plan[sd][sm][Number(si)];
    if (moving == null) { render(); return; }
    const srcIdx = Number(si);
    state.plan[sd][sm].splice(srcIdx, 1);
    state.plan[td][tm].push(moving);
    save(); render();
    undoToast("Verschoben", () => {
      const back = state.plan[td][tm].lastIndexOf(moving);
      if (back !== -1) state.plan[td][tm].splice(back, 1);
      state.plan[sd][sm].splice(srcIdx, 0, moving);
      save(); render();
    });
  });

  // ---------- Foto per Drag & Drop auf eine Meal-Karte (Desktop) ----------
  // Eigene Listener auf demselben "view" wie oben - stoeren sich nicht, weil
  // ".rcard" (Meals-Tab) und ".slot" (Plan-Tab) nie gleichzeitig im DOM stehen.
  function isFileDrag(e) { return !!(e.dataTransfer && e.dataTransfer.types && Array.prototype.includes.call(e.dataTransfer.types, "Files")); }
  view.addEventListener("dragover", e => {
    const card = e.target.closest(".rcard[data-rid]");
    if (!card || !isFileDrag(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    card.classList.add("dragover-file");
  });
  view.addEventListener("dragleave", e => {
    const card = e.target.closest(".rcard[data-rid]");
    if (card && !card.contains(e.relatedTarget)) card.classList.remove("dragover-file");
  });
  view.addEventListener("drop", e => {
    const card = e.target.closest(".rcard[data-rid]");
    if (!card || !isFileDrag(e)) return;
    e.preventDefault();
    card.classList.remove("dragover-file");
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    const r = getRecipe(card.dataset.rid);
    if (!f || !r) return;
    // getRecipe() kann seit dem 17.08.2026 auch ein COOKBOOK-Objekt liefern - gemeinsamen,
    // mitgelieferten Bestand, der nie mutiert werden darf. Praktisch unerreichbar (Katalog-
    // Rezepte stehen nicht in der Meals-Liste), aber ein Riegel kostet eine Zeile.
    if (!state.recipes.some(x => x.id === r.id)) return;
    if (blockedByRole()) return;   // laeuft nicht ueber die Delegation
    if (!/^image\//.test(f.type)) { toast("Bitte ein Bild verwenden"); return; }
    readAndDownscale(f, dataUrl => { if (dataUrl) { r.image = dataUrl; save(); render(); toast("Foto übernommen"); } else toast("Bild konnte nicht geladen werden"); });
  });

  // ---------- Foto per Strg+V auf eine Meal-Karte einfuegen ----------
  // Gleiches Ziel-Prinzip wie beim Datei-Drop: die gerade mit der Maus ueberfahrene
  // Karte. Ohne Hover-Ziel passiert nichts - kein Rateraten, welches Meal gemeint ist.
  let hoveredCardId = null;
  view.addEventListener("mouseover", e => {
    const card = e.target.closest(".rcard[data-rid]");
    if (card) hoveredCardId = card.dataset.rid;
  });
  view.addEventListener("mouseout", e => {
    const card = e.target.closest(".rcard[data-rid]");
    if (card && !card.contains(e.relatedTarget)) hoveredCardId = null;
  });
  document.addEventListener("paste", e => {
    // Bei offenem Dialog nie auf eine Karte einfuegen: hoveredCardId zeigt dann noch
    // auf die Karte hinter dem Overlay, und ein Screenshot-Einfuegen im
    // Bearbeiten-Formular wuerde unbemerkt dort landen statt im Formular.
    if (modalRoot.children.length) return;
    if (state.tab !== "recipes" || !hoveredCardId) return;
    if (!canEdit()) return;   // laeuft nicht ueber die Delegation
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    let file = null;
    for (const it of items) { if (it.type && it.type.indexOf("image/") === 0) { file = it.getAsFile(); break; } }
    if (!file) return; // kein Bild im Clipboard - normales Text-Einfuegen (z. B. im Namensfeld) unangetastet lassen
    e.preventDefault();
    const r = getRecipe(hoveredCardId);
    if (!r) return;
    // Derselbe Riegel wie beim Datei-Drop oben - siehe Kommentar dort.
    if (!state.recipes.some(x => x.id === r.id)) return;
    readAndDownscale(file, dataUrl => { if (dataUrl) { r.image = dataUrl; save(); render(); toast("Foto eingefügt"); } else toast("Bild konnte nicht geladen werden"); });
  });

  // ---------- Profil (lokal) & Teilen ----------
  const PROFILE_KEY = localKey("wochenkueche_profile_v1");
  const LAST_KEY = localKey("wochenkueche_lastprofile_v1");
  function jget(key, fb) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fb : v; } catch (e) { return fb; } }
  let profile = jget(PROFILE_KEY, null);
  function saveProfile() { try { if (profile) localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); else localStorage.removeItem(PROFILE_KEY); } catch (e) { noteError("store:saveProfile", e); } }
  function rememberLast() { try { localStorage.setItem(LAST_KEY, JSON.stringify(profile)); } catch (e) { noteError("store:rememberLast", e); } }
  function initials(name) { return (name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] ? w[0].toUpperCase() : "").join("") || "?"; }
  function validEmail(e) { return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); }

  const appEl = document.querySelector(".app");
  const profileSlot = document.getElementById("profile-slot");

  let pendingShare = null;
  // Einladungscode aus ?g=, bis die Anmeldung durch ist (siehe enterApp).

  // ---------- Kontowechsel auf demselben Geraet ----------
  // Die Ursache von docs/TROUBLESHOOTING.md 134, nicht nur ihr Symptom.
  //
  // Der Firestore-Zwischenspeicher liegt pro URSPRUNG, nicht pro Konto. Meldet sich auf
  // demselben Geraet ein anderes Konto an, trifft es auf den Cache des vorigen - und genau
  // dort war am 28.08.2026 der Zustand messbar, in dem JEDER Zugriff `permission-denied`
  // liefert, dauerhaft, ohne Erholung. Die Produktionsdomain, auf der nie gewechselt wurde,
  // blieb gesund.

  // Bewiesen ist der Zusammenhang damit nicht - er deckt aber alle Beobachtungen, und ein
  // geleerter Cache kostet nichts ausser einem Neuladen: Meals, Plan und Konto liegen in der
  // Cloud, der Cache ist nur ihre Spiegelung.

  //   2. Cache leeren
  //   3. neu laden

  // NICHT erneut gewischt. Stuende das Merken hinter dem Wischen, entstuende eine
  // Neulade-Schleife - der teuerste denkbare Fehler an dieser Stelle.
  const LETZTE_UID_KEY = localKey("wochenkueche_lastuid_v1");
  function kontoWechselAufraeumen(uid) {
    let vorige = null;
    try { vorige = localStorage.getItem(LETZTE_UID_KEY); } catch (e) { return false; }
    try { localStorage.setItem(LETZTE_UID_KEY, uid); } catch (e) { noteError("store:lastUid", e); return false; }

    // Neuladen beim allerersten Login waere ein unerklaerlicher Ruckler.
    if (!vorige || vorige === uid) return false;
    if (!(window.CloudSync && window.CloudSync.wipeCache)) return false;
    window.CloudSync.wipeCache()
      .then(() => location.reload())
      .catch(e => {
        // Scheitert meist an einem zweiten offenen Tab (clearIndexedDbPersistence verlangt,
        // dass sonst keine Instanz laeuft). Kein Grund, die Anmeldung aufzuhalten - die App
        // startet normal weiter, und im schlechtesten Fall bleibt der Knopf in den
        // Einstellungen ("Cloud-Verbindung zuruecksetzen", Ziffer 134).
        noteError("cloud:wipeOnSwitch", e);
        enterApp();
        startCloudSync(uid);
      });

  }

      // ein Neuladen laeuft; dann ist hier Schluss, die Seite kommt gleich frisch wieder.
      if (kontoWechselAufraeumen(user.uid)) return;

  // Avatar eines Mitglieds: Bild, sonst Initialen. Im ueberlappenden Stack nur EIN

  // ("AB" las sich als "AE"). In der Mitgliederliste, wo nichts ueberlappt, beide.
  function memberAvatarHtml(m, short) {

    // nur data:image-URLs durch. Ohne die Pruefung koennte ein Mitglied dort eine fremde

  // Die anderen Mitglieder der Gruppe, links neben dem eigenen Avatar. Ab vier Personen
  // wird abgekuerzt - mehr Kreise als das passen im Kopf neben die Reiter nicht, und die
  // vollstaendige Liste steht ohnehin einen Klick entfernt im Gruppen-Dialog.
  // Farbring-Slot eines Mitglieds: Ausgangspunkt ist ein simpler Hash der UID selbst,
  // NICHT der Index in groupMembers - der kommt aus getDocs() ohne orderBy und
  // verschiebt sich zuverlaessig, sobald jemand die Gruppe verlaesst.
  function memberColorHash(uid) {
    let h = 0;
    const s = String(uid || "");
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (Math.abs(h) % 6) + 1;
  }
  // Der reine Hash reicht nicht: bei sechs Farben und schon zwei Personen liegt die
  // Wahrscheinlichkeit, dass beide DIESELBE Farbe ziehen, bei rund einem Sechstel. Dann
  // waeren zwei Mitglieder, deren Kuerzel sich ebenfalls gleicht ("Anna"/"Anne" -> beide
  // "AN"), auf der Karte gar nicht mehr auseinanderzuhalten. Kollisionen werden deshalb
  // aufgeloest: der naechste freie Slot zaehlt. Durchlaufen wird dabei die nach UID

  // waere der schlechtere Tausch.
  function memberColorSlot(uid) {
    const uids = groupMembers.map(m => m.uid).sort();
    // Ab sieben Personen gibt es zwangslaeufig Doppelungen - dann bleibt es beim Hash,
    // sonst suchte die Schleife unten nach einem freien Slot, den es nicht gibt.
    if (uids.length > 6 || uids.indexOf(uid) === -1) return memberColorHash(uid);
    const belegt = {};
    for (let i = 0; i < uids.length; i++) {
      let s = memberColorHash(uids[i]);
      while (belegt[s]) s = (s % 6) + 1;
      belegt[s] = true;
      if (uids[i] === uid) return s;
    }
    return memberColorHash(uid);
  }
  // Badge auf der Meal-Karte: Initiale + Farbring, eines pro zugewiesener Person. Nur

  // Bei zweistelligen Kuerzeln passt nur einer, siehe memberBadgeHtml().
  const BADGE_MAX = 2;
  // Kuerzel eines Mitglieds fuer den Badge: n Zeichen, bei n > 1 aus Vor- UND Nachname

  // ("Anna" -> "AN"). Array.from statt [0]/[1]: ein Emoji im Namen besteht aus zwei
  // Code-Einheiten und laege halbiert als Ersatzzeichen im Kreis.
  function memberIni(name, n) {
    const parts = String(name || "?").trim().split(/\s+/);
    const first = Array.from(parts[0] || "?");
    const out = [first[0] || "?"];
    if (n > 1) out.push(parts.length > 1 ? Array.from(parts[1])[0] : first[1]);
    return out.filter(Boolean).join("").toUpperCase();
  }
  // Ein Buchstabe reicht nur, solange er in der Gruppe eindeutig ist. Bei "Anna" und
  // "Alex" stuende sonst auf beiden Karten dasselbe "A" - und der Farbring allein traegt
  // die Unterscheidung nicht: er ist aria-hidden und faellt bei Farbfehlsichtigkeit aus.
  // Dann bekommen BEIDE das zweistellige Kuerzel; nur eines zu verlaengern saehe aus, als
  // waeren es zwei verschiedene Arten von Badge.
  function memberBadgeIni(uid, mem) {
    const one = memberIni(mem ? mem.name : "?", 1);
    const clash = groupMembers.some(o => o.uid !== uid && memberIni(o.name, 1) === one);
    return clash ? memberIni(mem ? mem.name : "?", 2) : one;
  }
  function memberBadgeHtml(uids) {
    if (!uids || !uids.length) return "";
    const kuerzel = uids.map(uid => memberBadgeIni(uid, memberByUid(uid)));
    // Zweistellige Kuerzel sind breiter. Zwei davon passen noch (gemessen: 34 px), zwei davon
    // PLUS "+N" liefen dagegen 5 px links aus der Karte heraus. Nur in dem Fall auf EIN gut
    // lesbares Kuerzel zurueckgehen - wer mitisst, steht ohnehin vollstaendig im title der
    // Karte, die Kreise sind aria-hidden und nur eine schnelle Wiedererkennung.
    const breit = kuerzel.slice(0, BADGE_MAX).some(k => Array.from(k).length > 1);
    const max = breit && uids.length > BADGE_MAX ? 1 : BADGE_MAX;
    const shown = uids.slice(0, max).map((uid, i) => {
      const wide = Array.from(kuerzel[i]).length > 1;
      return `<span class="r-badge${wide ? " wide" : ""}" style="--member-c:var(--member-${memberColorSlot(uid)})">${esc(kuerzel[i])}</span>`;
    }).join("");
    const rest = uids.length - max;
    const more = rest > 0 ? `<span class="r-badge r-badge-more">+${rest}</span>` : "";
    return `<span class="r-badges" aria-hidden="true">${shown}${more}</span>`;
  }

  // Wie viele FREMDE Gerichte ein Slot zeigt, bevor der Rest hinter "+N weitere" verschwindet.
  //
  // Seit dem Mitgliederlimit von vier ist 3 die richtige Zahl, nicht mehr 2: In einer vollen
  // Gruppe gibt es genau drei andere Personen. Bei 2 waere das Einklappen der Dauerzustand
  // gewesen - man muesste jeden Slot aufklappen, um zu sehen, was die Familie isst. Ein
  // Aufklapper, der immer da ist, ist kein Aufklapper mehr, sondern eine Hürde.
  const SLOT_OTHERS_MAX = 3;
  const MSTACK_MAX = 3;
  function memberStackHtml() {
    if (!syncGid || !groupMembers.length) return "";
    const others = groupMembers.filter(m => m.uid !== syncUid);
    if (!others.length) return "";
    const shown = others.slice(0, MSTACK_MAX);
    const rest = others.length - shown.length;
    const names = others.map(m => firstName(m.name) || "Jemand").join(", ");
    return `<span class="mstack" title="${esc(names)}" aria-label="Gemeinsam mit ${esc(names)}">`

  // Gemeinsames Schliessverhalten aller .menu-Dropdowns (Profil, Gewicht): Klick daneben,
  // Escape mit Fokus zurueck auf den Ausloeser, aria-expanded am Ausloeser, Fokus beim
  // Oeffnen auf den ersten Eintrag. Ein zweites Mal von Hand gebaut waeren es zwei Muster
  // mit zwei Luecken. Liefert close() zurueck und haengt es als __close ans Menue, damit
  // ein erneuter Klick auf den Ausloeser sauber schliesst statt nur das DOM zu entfernen.
  function attachMenuDismiss(menu, trigger) {
    if (trigger) trigger.setAttribute("aria-expanded", "true");
    const close = back => {
      menu.remove();
      document.removeEventListener("mousedown", onDown, true);
      document.removeEventListener("keydown", onKey, true);
      if (!trigger) return;
      trigger.setAttribute("aria-expanded", "false");
      if (back && trigger.isConnected) trigger.focus();
    };
    // Nach einem render() ist das Menue aus dem DOM, ohne dass close() lief - dann hier
    // aufraeumen, damit keine Zuhoerer am document zurueckbleiben.
    const onDown = e => {
      if (!menu.isConnected) { close(false); return; }
      if (menu.contains(e.target) || (trigger && trigger.contains(e.target))) return;
      close(false);
    };
    const onKey = e => {
      if (!menu.isConnected) { close(false); return; }
      if (e.key === "Escape") { e.stopPropagation(); close(true); }
    };
    setTimeout(() => {
      document.addEventListener("mousedown", onDown, true);
      document.addEventListener("keydown", onKey, true);
    }, 0);
    const first = menu.querySelector("[role='menuitem']");
    if (first) first.focus();
    menu.__close = close;
    return close;
  }

  function closeMenuNode(node) { if (node.__close) node.__close(false); else node.remove(); }

  // Zuweisung eines geplanten Gerichts aendern (Stift-Symbol auf der Meal-Karte).
  // Bei genau zwei Mitgliedern reicht ein Klick-Zyklus, ab drei ein Chip-Popover mit
  // Mehrfachauswahl. Orphan-Schutz: wuerde eine Abwahl die letzte Person entfernen,
  // wird stattdessen der ganze Eintrag geloescht (derselbe Pfad wie "unassign").
  function openAssignMenu(btn) {
    const [d, m, i] = btn.dataset.slotSrc.split(":");
    const idx = Number(i);
    const entry = state.plan[d][m][idx];
    if (!entry) return;
    const id = entryId(entry);

    function apply(uids) {
      if (uids && uids.length === 0) {
        const removed = state.plan[d][m][idx];
        state.plan[d][m].splice(idx, 1);
        save(); render();
        undoToast("Entfernt", () => { state.plan[d][m].splice(idx, 0, removed); save(); render(); });
        return;
      }
      state.plan[d][m][idx] = makeEntry(id, uids);
      save(); render();
    }

    if (groupMembers.length === 2) {
      const curUids = entryUids(entry);
      const other = groupMembers.find(x => x.uid !== syncUid);
      let next;
      if (curUids === null) next = [syncUid];
      else if (curUids.indexOf(syncUid) !== -1 && curUids.length === 1) next = other ? [other.uid] : null;
      else next = null; // zurueck zu "fuer alle"
      apply(next);
      return;
    }

    const open = document.querySelector(".assign-menu");
    if (open) closeMenuNode(open);
    const curUids = entryUids(entry) || groupMembers.map(x => x.uid);
    // "Für alle" als eigener Chip ganz oben, nicht nur als Ergebnis vollstaendigen Anhakens.
    //
    // Bei zwei Mitgliedern war der Rueckweg auf "fuer alle" ein einziger Klick (der Zyklus
    // oben). Ab drei fuehrte er nur noch ueber das Anhaken JEDER einzelnen Person - bei vier
    // also drei Tipser fuer den haeufigsten Fall ueberhaupt, denn gemeinsam essen ist der
    // Normalfall und individuell zuweisen die Ausnahme. Der Sammelchip stellt das gerade.
    //
    // Er setzt uids auf null - genau das, was makeEntry() ohnehin erzeugt, sobald alle
    // abgedeckt sind. Kein zweiter Weg zum selben Zustand, nur eine Abkuerzung dorthin.
    const alleAn = entryUids(entry) === null;
    const menu = el(`<div class="menu assign-menu" role="menu">
      <button class="assign-chip${alleAn ? " on" : ""}" data-all="1" role="menuitem"><span class="avatar-spacer" aria-hidden="true"></span><span>Für alle</span></button>
      <div class="assign-sep" aria-hidden="true"></div>
      ${groupMembers.map(mem => `<button class="assign-chip${curUids.indexOf(mem.uid) !== -1 ? " on" : ""}" data-uid="${esc(mem.uid)}" role="menuitem">${memberAvatarHtml(mem, true)}<span>${esc(firstName(mem.name) || "Jemand")}</span></button>`).join("")}
    </div>`);
    // An <body> haengen statt an die Karte: .day hat overflow:hidden (fuer die mobilen
    // Karussell-Streifen) und wuerde ein absolut positioniertes Popover abschneiden.
    // Deshalb Position wie ein Portal aus dem Klick-Ziel berechnen, nicht per CSS erben.
    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect();
    menu.style.position = "fixed";
    menu.style.top = (r.bottom + 8) + "px";
    menu.style.right = "auto";
    const mw = menu.offsetWidth || 180;
    menu.style.left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8)) + "px";
    const close = attachMenuDismiss(menu, btn);
    // Fixed-Popover folgt der Seite beim Scrollen nicht mit - lieber sauber schliessen
    // als schwebend an falscher Stelle stehen zu bleiben. close() ist idempotent (mehrfacher
    // Aufruf harmlos), { once: true } entfernt den Listener nach dem ersten Scroll von selbst.
    window.addEventListener("scroll", () => close(false), { capture: true, once: true });
    const alleChip = menu.querySelector("[data-all]");
    if (alleChip) alleChip.addEventListener("click", () => { close(false); apply(null); });
    menu.querySelectorAll("[data-uid]").forEach(chip => chip.addEventListener("click", () => {
      const uid = chip.dataset.uid;
      const nowUids = entryUids(state.plan[d][m][idx]) || groupMembers.map(x => x.uid);
      const nextUids = nowUids.indexOf(uid) !== -1 ? nowUids.filter(x => x !== uid) : nowUids.concat(uid);
      close(false);
      apply(nextUids);
    }));
  }

  // Einwilligung erteilen (Art. 9 Abs. 2 lit. a DSGVO): eigener kurzer Dialog statt einer
  // Checkbox mitten im Wiegen-Formular, weil die Zustimmung eine bewusste, einzelne
  // Entscheidung sein soll - kein Haekchen, das man beim Ausfuellen mitwegklickt.
  function weightConsentModal() {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Gewichtsverlauf aktivieren">

      noteWeightFromGoal();
      save(); closeModal(); render();
      toast("Gewichtsverlauf aktiviert");
    });
    openModal(node);
  }

  // Widerruf: bestaetigen statt sofort ausfuehren - loescht keine bestehenden Daten (die
  // stehen weiter im Diagramm/koennen einzeln geloescht werden), stoppt nur kuenftige
  // automatische Eintraege aus dem Rechner und blendet die Karte wieder auf den Einstieg zurueck.
  function weightConsentRevokeModal() {
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Einwilligung widerrufen">
      <div class="modal-head"><h3>Einwilligung widerrufen</h3><button class="btn ghost sm" data-close aria-label="Schließen">✕</button></div>
      <div class="modal-body">

      </div>

    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("#wc-out-ok").addEventListener("click", () => {
      setWeightConsent(false); save(); closeModal(); render();
      toast("Einwilligung widerrufen");
    });
    openModal(node);
  }

  // ---------- Kalorienrechner (Baustein 1: Tages-/Wochenbedarf → state.goal) ----------
  // ACTIVITY, TRAIN_LEVELS und ihre Helfer stehen bewusst weit oben bei DAYS/MEALS und
  // nicht hier: sanitizeGoal() braucht sie, und das laeuft schon in `let state = load()`.
  // Von hier aus waeren sie dort noch in der temporalen Todeszone — die App wuerde beim
  // Start mit einem ReferenceError sterben, ohne dass ein catch greift.
  // Anpassung des Erhaltungsbedarfs je nach Ziel/Tempo (kcal/Tag).
  function paceAdjust(mode, pace) {
    if (mode === "lose") return ({ light: -250, moderate: -500, strong: -750 })[pace] || -500;
    if (mode === "gain") return ({ light: 250, moderate: 500 })[pace] || 500;
    return 0;
  }
  // Koerperfettanteil in Prozent, oder null wenn nicht angegeben. Eine Quelle fuer alle
  // Stellen, die den Wert aus einem Ziel oder einer Eingabe holen — er ist freiwillig,
  // also muss jede davon mit "nicht da" umgehen koennen.
  function sanitizeBodyfat(v) {
    const n = +v;
    if (v == null || v === "" || !isFinite(n)) return null;
    return (n >= BF_MIN && n <= BF_MAX) ? Math.round(n * 10) / 10 : null;
  }
  // BMR × PAL = Alltagsbedarf → Ziel-Anpassung = RUHETAG-Ziel.
  // Der Alltagsbedarf gilt an jedem Tag; an Trainingstagen kommt der Trainingsverbrauch
  // obendrauf (siehe dayKcal). Am Ruhetag ist er der ganze Bedarf.
  // Zwei Formeln fuer den Grundumsatz, je nachdem was bekannt ist:
  //  - mit Koerperfettanteil: Katch-McArdle ueber die fettfreie Masse. Mifflin kennt nur
  //    Gewicht und Groesse und haelt 85 kg Muskeln fuer dasselbe wie 85 kg Fett — bei
  //    Kraftsportlern liegt es deshalb systematisch zu niedrig.
  //  - ohne: Mifflin-St-Jeor wie bisher. Der KFA ist freiwillig, also muss dieser Weg
  //    unveraendert bestehen bleiben; missingCalc fordert Alter/Groesse weiterhin.
  // Makros: Protein 2 g/kg (ab BMI 27 auf das Gewicht bei BMI 27 gedeckelt),
  // Fett 25 % der Kalorien (weicht zurueck, wenn sonst die Summe nicht aufgeht), Rest KH.
  function computeGoal(inp) {
    const w = +inp.weight, h = +inp.height, age = +inp.age;
    const bf = sanitizeBodyfat(inp.bodyfat);
    const bmr = bf != null
      ? 370 + 21.6 * (w * (1 - bf / 100))
      : 10 * w + 6.25 * h - 5 * age + (inp.sex === "m" ? 5 : -161);
    const tdee = bmr * activityFactor(inp.activity);
    const adjust = paceAdjust(inp.mode, inp.pace);
    // Untergrenze geschlechtsabhaengig: die gaengigen Empfehlungen liegen bei 1200 kcal
    // (weiblich) bzw. 1500 kcal (maennlich). Ein pauschales Minimum von 1000 lag
    // darunter und haette bei kleinen Personen mit starkem Defizit gegriffen.
    // Sie greift auf dem Ruhetag, also dem niedrigsten Tag der Woche.
    const floor = inp.sex === "m" ? 1500 : 1200;
    const kcal = Math.max(floor, Math.round(tdee + adjust));
    const bmi = Math.round(w / ((h / 100) * (h / 100)) * 10) / 10;
    // Protein NICHT am tatsaechlichen Gewicht bemessen: bei starkem Uebergewicht
    // ergaeben 2 g/kg absurde Mengen (150 kg -> 300 g). Fett speichert kein Eiweiss,
    // deshalb wird ab einem BMI von 27 auf das Gewicht bei BMI 27 gedeckelt.
    // Bewusst 27 und nicht 25: Muskuloese Sportler liegen oft bei BMI 25-27, ohne
    // Fett anzusetzen - die sollen ihre vollen 2 g/kg behalten.
    const refW = bmi > 27 ? 27 * (h / 100) * (h / 100) : w;
    const protein = Math.round(2.0 * refW);
    let fat = Math.round(kcal * 0.25 / 9);
    let carbs = Math.round((kcal - protein * 4 - fat * 9) / 4);
    if (carbs < 0) {
      // Protein + Fett allein sprengen schon das Kalorienziel. Fett zurueckfahren
      // (Protein schuetzt im Defizit die Muskulatur), aber nicht unter das
      // essentielle Minimum von rund 0,5 g/kg.
      const minFat = Math.round(0.5 * refW);
      fat = Math.max(minFat, Math.round((kcal - protein * 4) / 9));
      carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
    }
    return { sex: inp.sex, age: age, height: h, weight: w, activity: inp.activity, mode: inp.mode, pace: inp.pace,
             // null = kein KFA angegeben. Muss mit ins Ziel, sonst faellt die Angabe beim
             // naechsten Wiegen (syncGoalWeight rechnet aus state.goal neu) still heraus
             // und der Grundumsatz spraenge zurueck auf Mifflin.
             bodyfat: bf,
             // Aus demselben Grund hier: Die Rueckgabe zaehlt ihre Felder ausdruecklich auf,
             // ein nicht genanntes Feld waere nach jedem Neuberechnen verschwunden - und das
             // Ernaehrungsprofil ueberlebte weder eine Wiegung noch "Ziele neu berechnen".
             // Sie gehen unveraendert durch: computeGoal rechnet nicht mit ihnen, es reicht
             // sie durch. undefined bleibt undefined, sanitizeGoal raeumt es danach weg.
             diet: inp.diet, avoid: inp.avoid,
             bmr: Math.round(bmr), tdee: Math.round(tdee), adjust: adjust, kcal: kcal,
             protein: protein, carbs: carbs, fat: fat, bmi: bmi,
             // Trainingsplan je Wochentag: { mon: { level, min } }. Leer = keine
             // Trainingstage, dann gilt das Ruhetag-Ziel an allen sieben Tagen.
             training: sanitizeTraining(inp.training),
             updatedAt: Date.now() };
  }
  // Welche Tempo-Stufen es zu einem Ziel gibt, samt Beschriftung – die EINE Quelle dafuer.
  // Frueher standen die Schluessel in paceKeys() und die Knoepfe noch einmal in fillPace();
  // mit den ersten Schritten waere das die dritte Stelle geworden. Wer hier etwas aendert,
  // muss paceAdjust() mitziehen – dort haengen die kcal an denselben Schluesseln.
  function paceOptions(mode) {
    if (mode === "lose") return [["light", "Leicht", "0,25 kg/Wo."], ["moderate", "Moderat", "0,5 kg/Wo."], ["strong", "Stark", "0,75 kg/Wo."]];
    if (mode === "gain") return [["light", "Leicht", "0,25 kg/Wo."], ["moderate", "Moderat", "0,5 kg/Wo."]];
    return [];
  }
  function paceKeys(mode) { return paceOptions(mode).map(o => o[0]); }

  // ---------- Wiegen: speichern, loeschen, ans Ziel koppeln ----------
  // Eine Woche, ein Wert - erneutes Wiegen in derselben Woche ersetzt den Eintrag (B2).
  function setWeight(m, kg) {
    const list = (state.weights || []).filter(e => e.m !== m);
    list.push({ m: m, kg: Math.round(kg * 10) / 10 });
    list.sort((a, b) => a.m < b.m ? -1 : 1);
    state.weights = list;
    syncGoalWeight();
  }
  function removeWeight(m) {
    state.weights = (state.weights || []).filter(e => e.m !== m);
    syncGoalWeight();
  }
  function latestWeight() { const w = state.weights || []; return w.length ? w[w.length - 1] : null; }

  // Das Kalorienziel haengt am Gewicht (BMR, Protein), also zieht die JUENGSTE Messung es
  // nach. Bewusst nur die juengste: traegt man im Juli den Januar nach, darf das aktuelle
  // Ziel nicht auf den alten Wert zurueckspringen - sonst macht Nachtragen die Tagesziele
  // kaputt. Ohne gespeichertes Ziel gibt es nichts nachzuziehen (der Verlauf laeuft
  // trotzdem weiter, er haengt nicht am Rechner).
  function syncGoalWeight() {
    const last = latestWeight();
    if (!state.goal || !last || state.goal.weight === last.kg) return;
    // Von Hand justierte Ziele (B4) NICHT neu rechnen - das waere genau die stille
    // Ueberschreibung, gegen die die Handanpassung gemacht ist. Das Gewicht selbst zieht
    // trotzdem mit: daran haengt der Trainingstag-Aufschlag (dayTrainKcal).
    if (state.goal.manual) { state.goal = Object.assign({}, state.goal, { weight: last.kg }); return; }
    // sanitizeGoal um das frische Ergebnis: computeGoal reicht diet/avoid unveraendert
    // durch (siehe dort), und hier fehlen die Schluessel im Eingangsziel meistens ganz -
    // dann traegt das Ergebnis "diet: undefined". Lokal faellt das nicht auf (JSON.stringify
    // verschluckt es), Firestore lehnt aber das GANZE Kontodokument ab. Siehe
    // docs/TROUBLESHOOTING.md.
    state.goal = sanitizeGoal(computeGoal(Object.assign({}, state.goal, { weight: last.kg })));
  }
  // Die Gegenrichtung zu syncGoalWeight: Das Gewicht wird auch im Rechner und in den
  // ersten Schritten abgefragt: Wer dort etwas eintraegt, hat sich gewogen - das gehoert
  // in den Verlauf, sonst zeigt die Kurve weiter den alten Wert.
  //  - noch nichts gemessen -> Startpunkt zum Monat des Ziels (der Verlauf braucht einen Anfang)
  //  - schon Messungen da, Rechner-Gewicht weicht ab -> als Messung dieses Monats
  // Beide Richtungen pruefen auf Gleichheit und laufen sich deshalb nicht gegenseitig hoch.
  // (Ziffer 3b der Datenschutzerklaerung nennt diesen zweiten Weg ausdruecklich.)
  function noteWeightFromGoal() {
    if (!state.goal || !hasWeightConsent()) return;
    const kg = Math.round(+state.goal.weight * 10) / 10;
    if (!(kg >= KG_MIN && kg <= KG_MAX)) return;
    const last = latestWeight();
    if (!last) {
      // Durch sanitizeWeights schicken statt direkt zuzuweisen: updatedAt kommt aus
      // gespeicherten Daten und koennte beschaedigt sein - ein "NaN-NaN" als Schluessel
      // wuerde sonst bis ins Diagramm durchlaufen.
      const t = new Date(state.goal.updatedAt || Date.now());
      state.weights = sanitizeWeights([{ m: weightKeyNow(isNaN(t.getTime()) ? new Date() : t), kg: kg }]);
    } else if (last.kg !== kg) {
      setWeight(weightKeyNow(), kg);
    }
  }

  // Was fehlt noch, in Worten? Eine Quelle fuer beides: den Hinweis im Assistenten
  // und den Text der leeren Ergebniskarte. Reihenfolge wie im Formular, damit der
  // erste Eintrag auch das erste fehlende Feld ist.
  // Nichts ist mehr vorbelegt – Geschlecht, Alltagsbewegung, Ziel und Tempo muessen
  // bewusst gewaehlt werden. Eine Voreinstellung wird sonst leicht ueberlesen und
  // geht als bewusste Angabe in die Rechnung ein, was sie nicht ist.
  function missingCalc(i) {
    const m = [];
    if (i.sex !== "m" && i.sex !== "f") m.push("dein Geschlecht");
    if (!(i.age >= 10 && i.age <= 120)) m.push("dein Alter");
    if (!(i.height >= 100 && i.height <= 250)) m.push("deine Größe");
    if (!(i.weight >= 30 && i.weight <= 400)) m.push("dein Gewicht");
    if (!ACTIVITY.some(a => a.key === i.activity)) m.push("deine Bewegung im Alltag");
    if (["lose", "hold", "gain"].indexOf(i.mode) === -1) m.push("dein Ziel");
    else if (i.mode !== "hold" && paceKeys(i.mode).indexOf(i.pace) === -1) m.push("dein Tempo");
    return m;
  }
  // ---------- Erste Schritte (Onboarding) ----------
  // Eine Frage je Bildschirm statt eines Formulars: die Koerperdaten sind heikel genug,
  // dass jede Frage ihre eigene Begruendung verdient ("wozu willst du mein Gewicht?").
  // Dies ist der EINZIGE Weg, ein Ziel zu setzen oder neu zu berechnen (der fruehere
  // Kalorienrechner-Reiter ist entfallen). Ohne Ziel ist die App nicht benutzbar, daher
  // ist der Ablauf ohne vorhandenes Ziel nicht ueberspringbar (siehe maybeStartOnboarding).
  // Genutzt wird computeGoal/ACTIVITY/paceOptions samt missingCalc fuer die Pflichtfelder.

  // Kurzfassung eines Ziels – gebraucht auf der Ergebnisseite, am Ende und auf der
  // Startseite fuer "Mein Ziel behalten".
  function goalSummaryHtml(g) {
    if (!g) return "";
    return `<b>${g.kcal.toLocaleString("de-DE")} kcal</b> am Tag · ${g.protein} g Eiweiß · ${g.fat} g Fett · ${g.carbs} g Kohlenhydrate`;
  }

  // Reihenfolge der Bildschirme. Verwandte Fragen stehen zusammen auf EINEM Bildschirm:
  // Koerperdaten, Training (Tage + Haerte + Dauer), Ziel + Tempo, Zielgewicht +
  // Einwilligung. Frueher war jede Frage ein eigener Schritt — das ergab 16 Bildschirme,
  // bevor die App ueberhaupt zu sehen war.
  //
  // Heraus fallen koennen nur noch "name" (steht meist schon fest) sowie "hi"/"go" beim
  // Neuberechnen. Alle drei entscheiden sich VOR dem ersten Rendern und aendern sich
  // waehrend eines Laufs nicht mehr. Damit ist die Gesamtzahl konstant und der
  // Fortschrittsbalken kann nicht mehr zurueckspringen — frueher warf "Gewicht halten"
  // das Tempo und "kein Trainingstag" zwei weitere Schritte mitten im Ablauf heraus,
  // und aus "Schritt 9 von 16" wurde unvermittelt "von 14".
  // "diet" sitzt zwischen Zielwahl und Ergebnis: Bis dahin ging es um den Koerper, ab hier
