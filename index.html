  // ================= Gemeinsam planen (Gruppe) =================
  const ROLE_LABEL = { owner: "Inhaber", edit: "Mitplanen", view: "Nur ansehen" };

  // Eine Gruppe traegt hoechstens vier Personen: Paar, WG oder Familie. Wer mehr braucht, ist
  // kein Haushalt mehr - und Pro traegt einen Haushalt, keine Verteilerliste.
  //
  // Dieselbe Zahl steht in firestore.rules (maxMitglieder). VERBINDLICH ist ausschliesslich
  // die Regel; diese Konstante ist nur die freundliche Oberflaeche davor, damit niemand erst
  // in eine technische Fehlermeldung laeuft (CLAUDE.md, Ziffer 18).
  const MAX_GROUP_MEMBERS = 4;

  // Eigene Meals in die Gruppe kopieren. Seit dem 15.08.2026 ohne Ausnahme: Es gibt keine
  // mitgelieferten Attrappen mehr, die man aussen vor lassen muesste - die Startmeals aus dem
  // Rezeptbuch sind echte Meals des Nutzers (siehe addStarterMeals).
  //
  // Seit dem 17.08.2026 mit Abgleich (Teil 2 des Katalog-Umbaus): Startmeals und bewusst
  // uebernommene Rezepte sind echte Kopien mit `lib` als Herkunft. Treffen zwei Konten mit
  // demselben Katalog-Rezept aufeinander - der Normalfall, weil die Startmeals je
  // Ernaehrungsform fest verdrahtet sind (STARTER) - entstuenden ohne Abgleich zwei
  // Dokumente mit gleichem `lib`. Verglichen wird AUSSCHLIESSLICH ueber `lib`: Meals ohne
  // `lib` (selbst angelegte) werden nie dedupliziert, sonst verschluckte ein Namensabgleich
  // fremde Meals ("Banane" darf es zweimal geben).
  async function copyOwnRecipesToGroup(gid) {
    const mine = state.recipes.filter(r => r && r.id);
    if (!mine.length) return;
    // Der Abgleich ist eine KUER, der Beitritt die Pflicht: Dieser Lesevorgang kam mit dem
    // Umbau neu in den Beitrittspfad, und er liegt im try von joinGroup() - ohne das catch
    // hier risse ein Netzfehler beim LESEN den ganzen Beitritt zurueck, obwohl joinAtomic()
    // die Mitgliedschaft in Firestore laengst geschrieben hat. Genau diese Fehlerklasse hat
    // am 16.08.2026 den Beitritt fuer alle ausser dem Inhaber unmoeglich gemacht.
    //
    // Faellt der Abgleich aus, bleibt es beim alten Verhalten (alles hochladen): ein paar
    // Dubletten sind aergerlich, ein gescheiterter Beitritt ist schlimmer. Die naechste
    // Migration raeumt sie ohnehin weg (dedupeAgainstCatalog).
    //
    // Gelesen wird ausdruecklich vom SERVER (loadRecipesFromServer), nicht aus dem Cache:
    // Hier traegt ein LEERES Ergebnis eine Entscheidung - "die Gruppe hat dieses Meal noch
    // nicht, also lade ich meines hoch". Der Offline-Cache hat die Rezepte einer gerade erst
    // beigetretenen Gruppe aber noch nie gesehen und liefert genau dieses leere Ergebnis,
    // ohne zu werfen. Der Abgleich fiele damit lautlos aus und JEDES eigene Meal ginge hoch -
    // bei fest verdrahteten Startmeals (STARTER) garantiert fuenf Paare, also exakt der
    // Zustand, den Ziffer 102 beseitigt hat. Fehlt die Funktion (aeltere Fassung im Cache
    // des Service Workers), bleibt es beim bisherigen Weg.
    let vorhanden = [];
    try {
      const lies = window.CloudSync.loadRecipesFromServer || window.CloudSync.loadRecipes;
      vorhanden = await lies(["groups", gid]) || [];
    } catch (e) { noteError("group:copyOwnRecipesRead", e); }
    const libZuId = new Map();
    vorhanden.forEach(r => { if (r && r.lib && !libZuId.has(r.lib)) libZuId.set(r.lib, r.id); });
    const hochladen = [];
    mine.forEach(r => {
      const treffer = r.lib ? libZuId.get(r.lib) : null;
      if (treffer && treffer !== r.id) {
        // Meine Kopie ist ueberfluessig und wird NICHT hochgeladen. Meine eigenen
        // Planeintraege zeigen aber noch auf sie - vor dem Hochladen des Plans (siehe
        // prepareGroup()/den Beitrittspfad) muessen sie auf die Gruppen-id umgeschrieben
        // werden, sonst wirft normalizePlan() sie beim naechsten Laden weg. rewritePlanIds()
        // ist derselbe Helfer wie bei adoptFromCookbook() (Teil 1.5) - eine Umschreibung,
        // nicht zwei.
        rewritePlanIds(r.id, treffer);
      } else {
        hochladen.push(r);
      }
    });
    if (!hochladen.length) return;
    // In Haeppchen: writeBatch vertraegt hoechstens 500 Vorgaenge, und Meals mit Fotos
    // sind gross - lieber mehrere kleine Batches als einer, der ganz scheitert.
    for (let i = 0; i < hochladen.length; i += 20) {
      await window.CloudSync.saveRecipesBatch(["groups", gid], hochladen.slice(i, i + 20), []);
    }
  }

  // Gegenstueck zu copyOwnRecipesToGroup(): raeumt beim Verlassen einer Gruppe die
  // Meal-Dokumente aus dem EIGENEN Konto, die der mitgebrachte Gruppenstand nicht mehr
  // enthaelt.
  //
  // Warum das noetig ist: Beim Beitritt wandert der eigene Bestand in die Gruppe
  // (copyOwnRecipesToGroup) und wird lokal durch den Gruppenbestand ERSETZT
  // (enterGroupSync, "in einer Gruppe ist die Gruppe die Wahrheit"). In
  // users/{uid}/recipes bleibt er jedoch unangetastet liegen. Beim Verlassen mischt
  // startCloudSync() diesen Altbestand ueber mergeRemoteRecipes() wieder unter die
  // mitgebrachten Gruppen-Meals - beide Fassungen tragen dieselbe `lib`, aber eigene
  // IDs. Jedes Katalog-Meal steht danach zweimal da, nach dem naechsten Beitritt
  // dreimal. Genau das war am 28.08.2026 auf dem echten Konto zu sehen: 43 Meals in der
  // Gruppe, 81 im eigenen Konto, 14 doppelte `lib`.
  //
  // Eine leere Baseline (lastPushedRecipes = new Map()) reicht dagegen NICHT: syncRecipes()
  // bildet delIds aus "prev ohne cur" - was nie in der Baseline stand, wird auch nie
  // geloescht. Aufgeraeumt werden muss ausdruecklich.
  //
  // Kuer, nicht Pflicht - dieselbe Abwaegung wie beim Abgleich im Beitrittspfad: Scheitert
  // das Lesen oder Loeschen, bleibt es beim alten Verhalten (Dubletten). Ein abgebrochener
  // Austritt waere schlimmer als ein doppelter Eintrag.
  async function pruneOwnRecipes(behalten) {
    const behalte = (behalten || []).filter(r => r && r.id);
    const behalteIds = new Set(behalte.map(r => r.id));
    // Ein leerer Behalten-Stand ist kein Auftrag zum Leerraeumen, sondern ein Hinweis
    // darauf, dass der Snapshot zu spaet gezogen wurde (docs/TROUBLESHOOTING.md 101).
    if (!behalteIds.size) return;
    // Geloescht wird NUR, was nachweislich eine Dublette ist: ein zweites Meal mit derselben
    // `lib`. Der erste seiner Art bleibt immer stehen - egal ob er aus der Gruppe kommt oder
    // aus dem Altbestand.
    //
    // Die erste Fassung loeschte pauschal alles, was nicht im Gruppenstand lag, und stuetzte
    // sich dabei auf die Annahme "mein Bestand ist beim Beitritt vollstaendig in die Gruppe
    // gewandert". Die Annahme ist falsch, und der Push-Check hat den Gegenfall gefunden:
    // Ein Mitglied tritt als NUR-LESER bei - joinGroup() kopiert dann ausdruecklich nichts
    // (`role !== "view"`) - und wird spaeter vom Inhaber ueber setRole() zum Mitplaner
    // befoerdert. Beim Verlassen ist `warNurLeser` dann false, und die pauschale Fassung
    // haette den GESAMTEN eigenen Bestand geloescht. Ein Meal ohne Gegenstueck darf dieser
    // Weg unter keinen Umstaenden anfassen.
    //
    // Meals ohne `lib` (selbst angelegte) bleiben damit immer stehen - dieselbe Grenze wie
    // beim Beitritt, wo ein Namensabgleich fremde Meals verschluecken wuerde ("Banane" darf
    // es zweimal geben, siehe copyOwnRecipesToGroup).
    let vorhanden = [];
    try { vorhanden = await window.CloudSync.loadRecipes(["users", syncUid]) || []; }
    catch (e) { noteError("group:pruneOwnRead", e); return; }
    // Je `lib` bleibt genau EINER stehen; der aus dem mitgebrachten Gruppenstand hat Vorrang.
    //
    // Die zweite Fassung fragte nur "ist diese `lib` in der Gruppe vertreten?" - und traf
    // damit den haeufigsten Fall nicht. Am echten Konto gemessen: Von 37 Altbestaenden lagen
    // 11 als PAARE untereinander, 8 davon mit einer `lib`, die die Gruppe gar nicht kennt.
    // Die Regel loeschte 9 von 37, und der Bestand trug danach immer noch Dubletten
    // (maxGleicheLib 2). Sie war sicher, aber sie loeste das gemeldete Problem nicht.
    //
    // Diese Fassung zaehlt stattdessen je `lib` mit: Der erste bleibt, jeder weitere geht.
    // Damit ist ein Meal, dessen `lib` nur EINMAL vorkommt, strukturell unantastbar - der
    // Nur-Leser aus dem Nachtrag oben verliert also weiterhin nichts.
    //
    // Sortiert nach id, damit zwei Geraete unabhaengig voneinander dieselbe Kopie behalten -
    // dieselbe Ueberlegung wie bei memberColorSlot() und sanitizeTombstones().
    const gesehen = new Set(behalte.map(r => r.lib).filter(Boolean));
    const weg = [];
    vorhanden
      .filter(r => r && r.id && !behalteIds.has(r.id) && r.lib)   // ohne `lib`: nie anfassen
      .sort((a, b) => a.id < b.id ? -1 : (a.id > b.id ? 1 : 0))
      .forEach(r => {
        if (gesehen.has(r.lib)) { weg.push(r.id); return; }
        gesehen.add(r.lib);
      });
    if (!weg.length) return;
    // In Haeppchen wie beim Hochladen: writeBatch vertraegt hoechstens 500 Vorgaenge.
    for (let i = 0; i < weg.length; i += 100) {
      try { await window.CloudSync.saveRecipesBatch(["users", syncUid], [], weg.slice(i, i + 100)); }
      catch (e) { noteError("group:pruneOwnWrite", e); return; }
    }
  }

  // Den EIGENEN Wochenplan in die Gruppe nachtragen - aber nur in Slots, die dort noch LEER
  // sind. Wer schon etwas eingeplant hat, dessen Eintrag bleibt stehen.
  //
  // EINE Funktion fuer beide Wege, statt zweier Kopien, die auseinanderlaufen:
  //   * finalizeGroupActivation() - der Owner traegt nach, was er seit prepareGroup() geplant hat
  //   * joinGroup()               - der Beitretende bringt seine Woche mit (28.08.2026)
  //
  // Der zweite Weg fehlte bis zum 28.08.2026 ganz: enterGroupSync() ERSETZT state.plans durch
  // den Gruppenplan, hochgeladen wurde der eigene aber nur beim Owner - die Woche des
  // Beitretenden war damit lautlos weg. Dass das nicht so gemeint war, stand im Code selbst:
  // copyOwnRecipesToGroup() biegt die Planverweise des Beitretenden auf die Gruppen-ids um
  // und begruendet das mit "vor dem Hochladen des Plans (siehe prepareGroup()/den
  // Beitrittspfad)" - auf dem Beitrittspfad wurde nie einer hochgeladen.
  //
  // Reihenfolge zwingend: erst copyOwnRecipesToGroup() (biegt die Verweise um), dann dies.
  // Umgekehrt zeigten die nachgetragenen Slots auf ids, die es in der Gruppe nicht gibt, und
  // normalizePlan() wuerfe sie beim naechsten Laden lautlos weg.
  async function mergeOwnPlanIntoGroup(gid) {
    // Gelesen wird vom SERVER: Hier traegt ein leeres Ergebnis eine Entscheidung ("der Slot
    // ist frei, ich schreibe hinein"), und der Offline-Cache hat die Plaene einer gerade erst
    // beigetretenen Gruppe noch nie gesehen. Dieselbe Falle wie in
    // docs/TROUBLESHOOTING.md 126. Scheitert das Lesen, wird NICHTS geschrieben - ein
    // nicht nachgetragener Plan ist ein Aergernis, ein ueberschriebener fremder Plan ein
    // Datenverlust.
    let existing;
    try {
      const lies = window.CloudGroup.loadPlansFromServer || window.CloudGroup.loadPlans;
      existing = await lies(gid);
    } catch (e) { noteError("group:mergePlanRead", e); return; }
    const have = {};
    existing.forEach(w => { have[w.week] = w.fields || {}; });
    for (const wk of Object.keys(state.plans || {})) {
      const flat = flattenWeek(state.plans[wk]);
      const already = have[wk] || {};
      const missing = {};
      Object.keys(flat).forEach(slot => { if (!already[slot]) missing[slot] = flat[slot]; });
      if (Object.keys(missing).length) {
        await window.CloudGroup.savePlanWeek(gid, wk, Object.assign(missing, { by: syncUid, at: Date.now() }));
      }
    }
  }

  // Gruppe vorbereiten, aber noch nicht scharf schalten: der Owner bleibt in seinen eigenen
  // Daten (state.groupId bleibt leer), bis wirklich jemand beitritt (siehe watchPendingGroup()/
  // activateGroup() unten). Wer nur mal auf "Person einladen" klickt und es dabei belaesst,
  // sitzt so nicht dauerhaft in einer Einpersonen-Gruppe.
  async function prepareGroup() {
    if (!syncUid || !window.CloudGroup) { toast("Dafür brauchst du dein Cloud-Konto."); return null; }
    // D2b: Eine Gruppe GRUENDET, wer Pro hat - beitreten darf jeder (siehe joinGroup()).
    // Der Hinweis ist die Sperre in der Oberflaeche; verbindlich ist die Firestore-Regel,
    // die beim Anlegen von groups/{gid} dieselbe Berechtigung prueft.
    if (!isPro()) { toast("Gemeinsam planen gehört zu Pro – eingeladen werden kannst du aber jederzeit."); return null; }
    const gid = shareId();
    try {
      await window.CloudGroup.create(gid, {
        name: "", owner: syncUid, createdAt: Date.now(), status: "pending",
        // Der Gruender ist das erste Mitglied - sein eigener Eintrag unten zaehlt deshalb
        // NICHT noch einmal hoch (die Regel verlangt hier ausdruecklich die 1).
        memberCount: 1,
        settings: { shopForAll: true, changeHints: true }
      });
      await window.CloudGroup.putMember(gid, syncUid, {
        name: profile.name || "", avatar: await smallAvatar(state.profileImage),
        role: "owner", joinedAt: Date.now()
      });
      // Schon jetzt hochladen, nicht erst bei der Aktivierung: wer beitritt, soll sofort
      // einen gefuellten Plan sehen statt auf den naechsten Login des Owners zu warten.
      await copyOwnRecipesToGroup(gid);
      for (const wk of Object.keys(state.plans || {})) {
        const flat = flattenWeek(state.plans[wk]);
        if (Object.keys(flat).length) await window.CloudGroup.savePlanWeek(gid, wk, Object.assign(flat, { by: syncUid, at: Date.now() }));
      }
      const url = await createInviteLink("edit", gid);
      await window.CloudSync.save(syncUid, { pendingGroupId: gid, pendingInviteUrl: url });
      state.pendingGroupId = gid;
      state.pendingInviteUrl = url;
      save();
      watchPendingGroup(gid);
      return url;
    } catch (e) {
      try { await dissolveGroupFirestore(gid); } catch (e2) {}
      state.pendingGroupId = ""; state.pendingInviteUrl = ""; save();
      toast("Die Gruppe konnte nicht vorbereitet werden. Versuch es gleich noch einmal.");
      return null;
    }
  }

  // Nachtrag der Aenderungen seit prepareGroup(): neue/geloeschte Meals, Wochenplan-Slots,
  // die der Owner in der Zwischenzeit angelegt hat. Ruft bewusst NICHT switchGroup() auf -
  // der Aufrufer entscheidet, ob ein kompletter Sync-Neustart noetig ist (activateGroup(): ja;
  // der Aktivierungspfad in startCloudSync() nimmt den neuen Stand ohnehin im selben Durchlauf mit).
  async function finalizeGroupActivation(gid) {
    await copyOwnRecipesToGroup(gid);
    const deletedIds = Object.keys(state.deleted || {});
    if (deletedIds.length) await window.CloudSync.saveRecipesBatch(["groups", gid], [], deletedIds);
    // Nur Slots nachtragen, die in der Gruppe noch LEER sind - sonst ueberschriebe der
    // Owner-Push die Slots, die der Beitretende in der Zwischenzeit selbst gefuellt hat.
    // Seit dem 28.08.2026 in mergeOwnPlanIntoGroup(), gemeinsam mit dem Beitrittspfad.
    await mergeOwnPlanIntoGroup(gid);
    try { await window.CloudGroup.activate(gid); } catch (e) { noteError("group:activate", e); }
    await window.CloudSync.save(syncUid, { groupId: gid, pendingGroupId: "", pendingInviteUrl: "" });
  }

  // Live-Listener fuer den Wartezustand: sobald ein zweites Mitglied auftaucht, aktivieren.
  // Getrennt von den Gruppen-Listenern in enterGroupSync() - die laufen erst NACH dem Beitritt.
  function watchPendingGroup(gid) {
    unwatchPending();
    if (!window.CloudGroup) return;
    syncUnsubPending = window.CloudGroup.watchMembers(gid, members => {
      if (Array.isArray(members) && members.length > 1) { unwatchPending(); activateGroup(gid, members); }
    });
  }
  function unwatchPending() {
    if (syncUnsubPending) { try { syncUnsubPending(); } catch (e) { noteError("sync:unsubPending", e); } syncUnsubPending = null; }
  }

  // Live-Aktivierung (jemand tritt bei, waehrend der Owner online ist). Der Start-Pfad in
  // startCloudSync() deckt den Fall ab, dass der Owner offline war.
  async function activateGroup(gid, members) {
    // Ab hier bis switchGroup() ist syncGid noch null, waehrend finalizeGroupActivation() die
    // Cloud-groupId schon setzt. Ein in dieses Fenster fallender Push wuerde sie mit "" wieder
    // ausloeschen - und weil pendingGroupId dann ebenfalls leer ist, waere die Gruppe fuer den
    // Owner weder aktiv noch wartend, obwohl der Beitretende laengst drin ist.
    groupTransition = true;
    clearTimeout(pushTimer);   // bereits geplanten Push zuruecknehmen, statt auf sein Timing zu hoffen
    try {
      await finalizeGroupActivation(gid);
      state.pendingGroupId = ""; state.pendingInviteUrl = ""; save();
      const joiner = (members || []).filter(m => m.uid !== syncUid)[0];
      // Der eigene Erfolgs-Toast ersetzt den generischen aus startCloudSync() ("Mit eurer
      // Gruppe verbunden") - sonst saehe man zwei Meldungen fuer dasselbe Ereignis.
      if (joiner && joiner.name) suppressConnectToast = true;
      await switchGroup(gid);
      if (joiner && joiner.name) toast(firstName(joiner.name) + " ist dabei – ihr plant jetzt gemeinsam");
    } catch (e) {
      // Trotz Fehlschlag erneut lauschen: sonst waere die Aktivierung fuer den Rest der
      // Sitzung tot, obwohl das zweite Mitglied laengst da ist.
      watchPendingGroup(gid);
      // Die Cloud-groupId kann hier bereits gesetzt sein (finalizeGroupActivation schreibt sie
      // als letzten Schritt), waehrend switchGroup() nie lief - syncGid ist also null, obwohl die
      // Gruppe steht. Ohne diese Sperre loeschte der naechste Push sie sofort wieder. Der Zeiger
      // bleibt gesperrt, bis ein vollstaendiger startCloudSync() den Zustand geklaert hat.
      groupSyncFailed = true;
      lastGroupAttempt = gid || null;   // siehe onRemote(): sonst zieht jeder Snapshot den Versuch neu auf
      toast("Der Beitritt konnte nicht übernommen werden – versucht es gleich noch einmal.");
    } finally {
      groupTransition = false;
    }
  }

  // Wartezustand vollstaendig zuruecknehmen: die vorbereitete Gruppe wird komplett aufgeloest,
  // danach ist der Zustand exakt wie vor "Person einladen" - keine Karteileiche in Firestore.
  async function withdrawPendingInvite() {
    const gid = state.pendingGroupId;
    if (!gid) return;
    unwatchPending();
    try { await dissolveGroupFirestore(gid); } catch (e) { noteError("group:dissolve", e); }
    state.pendingGroupId = ""; state.pendingInviteUrl = ""; save();
    try { await window.CloudSync.save(syncUid, { pendingGroupId: "", pendingInviteUrl: "" }); } catch (e) { noteError("sync:clearPendingInvite", e); }
    toast("Einladung zurückgezogen");
  }

  // Einladungslink erzeugen. Der Code ist der Zugang (80 Bit, wie die Teilen-Links) -
  // deshalb ist er in Firestore ausdruecklich nicht auflistbar.
  async function createInviteLink(role, gid) {
    gid = gid || syncGid;
    // Sicherheitsnetz neben prepareGroup(): Einladen ist Inhaber-Sache, und Inhaber sein
    // setzt Pro voraus. Wirft statt still zu scheitern - die beiden Aufrufer zeigen den
    // Fehler ohnehin schon an.
    if (!isPro()) throw new Error("pro-required");
    const code = shareId();
    await window.CloudGroup.createInvite(code, { gid: gid, role: role, by: syncUid, createdAt: Date.now() });
    // Code im eigenen Konto merken - genau wie die Teilen-Links (state.shares). Ohne das
    // liesse er sich spaeter nicht mehr zurueckziehen und bliebe beim Loeschen des Kontos
    // als offene Tuer in die Gruppe zurueck.
    state.inviteCodes = unionIds(state.inviteCodes, [code]);
    save();
    return location.origin + location.pathname + "?g=" + code;
  }

  async function joinGroup(code) {
    if (!syncUid || !window.CloudGroup) return;
    // Wie in activateGroup(): zwischen dem Cloud-Write unten und switchGroup() ist syncGid noch
    // null. Ein Debounce-Push in dieses Fenster naehme den Beitritt sofort wieder zurueck.
    const prevGid = state.groupId;
    groupTransition = true;
    clearTimeout(pushTimer);
    // Ausserhalb von try deklariert (nicht const IM try): der catch-Block braucht inv.gid fuer
    // lastGroupAttempt - ein try{} und sein catch{} sind eigene Bloecke, eine dort deklarierte
    // const waere im catch schlicht nicht sichtbar (ReferenceError), unabhaengig davon, ob sie
    // vorher erfolgreich zugewiesen wurde.
    let inv = null;
    try {
      inv = await window.CloudGroup.fetchInvite(code);
      if (!inv || !inv.gid) { toast("Diese Einladung gilt nicht mehr."); return; }
      if (syncGid === inv.gid) { toast("Du bist schon dabei."); return; }
      // Derselbe Guard wie in openInviteModal() (dort ausfuehrlich kommentiert) - hier
      // zusaetzlich noetig, weil joinGroup() auch direkt aufgerufen werden kann.
      if (state.pendingGroupId === inv.gid) { toast("Das ist deine eigene Einladung."); return; }

      // KEIN Vorab-Check auf "ist noch Platz": Ein Nichtmitglied darf das Gruppendokument
      // nicht lesen ("allow get: if isMember(gid)"), und diese Regel zu lockern, um eine
      // huebschere Meldung zu bekommen, waere der falsche Handel - die Mitgliederzahl einer
      // fremden Gruppe geht Aussenstehende nichts an.
      //
      // Stattdessen entscheidet die Regel, und der catch-Block uebersetzt ihre Absage. Das
      // ist ohnehin die ehrlichere Reihenfolge: Es gibt nur EINE Quelle der Wahrheit, und
      // zwischen Pruefung und Beitritt koennte sonst jemand anderes den letzten Platz nehmen.
      const role = inv.role === "view" ? "view" : "edit";
      const daten = {
        name: profile.name || "", avatar: await smallAvatar(state.profileImage),
        role: role, via: code, joinedAt: Date.now()
      };
      // Stehe ich in dieser Gruppe SCHON? Dann ist das kein Beitritt, sondern eine Rueckkehr -
      // etwa wenn das Konto zwischenzeitlich auf eine andere Gruppe zeigte. Dann darf der
      // Zaehler NICHT steigen: Es kommt ja niemand hinzu.
      //
      // Ohne diese Unterscheidung waere die Rueckkehr sogar unmoeglich - die update-Regel
      // verlangt fuer den +1-Zweig ausdruecklich, dass ich vorher KEIN Mitglied bin, der Batch
      // fiele also komplett durch. Genau dieser Fall ist am 16.08.2026 aufgetreten.
      if (await window.CloudGroup.istMitglied(inv.gid, syncUid)) {
        await window.CloudGroup.putMember(inv.gid, syncUid, daten);
      } else {
        // Ein verbrauchter Code ist keine Einladung mehr. Die Pruefung steht bewusst HIER und
        // nicht oben bei den anderen Riegeln: Die Rueckkehr eines noch bestehenden Mitglieds
        // laeuft ueber putMember() und muss weiterhin gehen, auch wenn der Code laengst
        // verbraucht ist - sonst sperrte der Verbrauch genau die Leute aus, die schon dabei
        // sind.
        //
        // Das ist eine freundliche Meldung, keine Grenze: Verbindlich ist die Regel, die den
        // Batch ablehnt (firestore.rules, Stufe 2). Hier geht es darum, dass der Nutzer den
        // Grund erfaehrt, statt an einem "permission-denied" zu scheitern.
        if (inv.used) { toast("Diese Einladung wurde schon benutzt – frag nach einer neuen."); return; }
        // Atomar: Mitgliedschaft, memberCount und der Verbrauch des Codes in EINEM Batch.
        // Einzeln wuerde die Regel es ablehnen (siehe CloudGroup.joinAtomic).
        await window.CloudGroup.joinAtomic(inv.gid, syncUid, daten);
      }
      // Nur mitlesende Mitglieder duerfen laut Regel gar nichts in die Gruppe schreiben -
      // ihre eigenen Meals bleiben deshalb im eigenen Konto liegen, statt hier an einer
      // abgelehnten Schreiboperation haengen zu bleiben.
      if (role !== "view") {
        await copyOwnRecipesToGroup(inv.gid);
        // ... und die eigene Woche mitbringen, in die Slots, die in der Gruppe noch leer
        // sind. NACH copyOwnRecipesToGroup(): das biegt die Planverweise erst auf die
        // Gruppen-ids um. Kuer wie der Meal-Abgleich daneben - ein eigenes catch, damit ein
        // Netzfehler beim Nachtragen nicht den ganzen Beitritt zurueckrollt, obwohl
        // joinAtomic() die Mitgliedschaft laengst geschrieben hat (Ziffer 102).
        try { await mergeOwnPlanIntoGroup(inv.gid); }
        catch (e) { noteError("group:joinMergePlan", e); }
      }
      // Cloud zuerst, siehe Begruendung in prepareGroup().
      await window.CloudSync.save(syncUid, { groupId: inv.gid });
      // Eine eigene, noch offene Einladung fuer eine ANDERE Gruppe erst JETZT zuruecknehmen -
      // NACHDEM der Beitritt zur neuen Gruppe oben nachweislich geglueckt ist. Vorher wuerde
      // ein Netzfehler zwischen dem Zuruecknehmen und dem Beitritt beide Gruppen kosten: die
      // alte waere schon aufgeloest, die neue noch nicht abgeschlossen. Scheitert das
      // Zuruecknehmen selbst, ist das nicht fatal - der Beitritt zur neuen Gruppe steht schon,
      // die alte bliebe hoechstens als spaeter manuell aufraeumbare Karteileiche stehen.
      if (state.pendingGroupId && state.pendingGroupId !== inv.gid) {
        try { await withdrawPendingInvite(); } catch (e) { noteError("group:withdrawInvite", e); }
      }
      state.groupId = inv.gid;
      await switchGroup(inv.gid);
      toast("Ihr plant jetzt gemeinsam");
    } catch (e) {
      // Nur zuruecknehmen, was dieser Aufruf angerichtet hat: der Zeiger kehrt auf seinen Stand
      // von vorher zurueck. Frueher stand hier pauschal "" - das kostete auch dann die
      // Mitgliedschaft, wenn der Cloud-Write oben laengst durch war und erst ein spaeterer
      // Schritt scheiterte. Zusaetzlich sperren: welcher Schritt gescheitert ist, wissen wir
      // hier nicht, also darf kein Push den Zeiger anfassen, bis der naechste Start ihn klaert.
      state.groupId = prevGid;
      groupSyncFailed = true;
      // Der Versuch galt inv.gid, nicht prevGid: steht der Cloud-Write schon, meldet der naechste
      // Snapshot genau diese Gruppe - und ohne das Flag liefe switchGroup() endlos erneut an.
      // inv kann hier noch null sein (fetchInvite() selbst ist gescheitert, bevor inv zugewiesen
      // wurde) - dann bleibt lastGroupAttempt null, statt beim Lesen von inv.gid erneut zu werfen.
      lastGroupAttempt = (inv && inv.gid) || null;
      // Die Meldung nennt MOEGLICHE Gruende und behauptet keinen bestimmten.
      //
      // Vorher stand hier "Diese Gruppe ist schon voll", sobald ein "permission-denied" kam -
      // mit der Begruendung, das heisse beim Beitritt "praktisch immer" genau das. Das war eine
      // Annahme, und sie war falsch: Am 16.08.2026 lehnte die Regel den Beitritt ab, weil der
      // Client bereits den Zaehler mitschrieb, die neuen Regeln aber noch nicht veroeffentlicht
      // waren. Die App behauptete daraufhin ein volles Haus bei einer Gruppe mit einer einzigen
      // Person, und die Fehlersuche lief eine Stunde in die falsche Richtung.
      //
      // Eine Fehlermeldung darf raten - aber sie muss es kenntlich machen. Aus einem Fehlercode
      // auf EINE Ursache zu schliessen ist nur zulaessig, wenn es wirklich nur eine gibt.
      const abgelehnt = e && e.code === "permission-denied";
      toast(abgelehnt
        ? "Der Beitritt wurde abgelehnt. Vielleicht ist die Gruppe voll oder die Einladung gilt nicht mehr."
        : "Der Beitritt hat nicht geklappt. Bitte den Link noch einmal öffnen.");
    } finally {
      groupTransition = false;
    }
  }

  // Aufloesen einer Gruppe in Firestore: Gruppendokument + ALLE Mitglieder + ALLE Plaene +
  // ALLE Meals in einem Batch (CloudGroup.dissolve - Firestore loescht Unterkollektionen
  // sonst nie mit dem Elterndokument mit), danach die eigenen Einladungscodes fuer GENAU
  // diese Gruppe. Reine Firestore-Arbeit ohne lokalen Zustand - wird sowohl beim regulaeren
  // Aufloesen einer aktiven Gruppe (dissolveGroup()) als auch beim Zuruecknehmen/Fehlschlagen
  // einer noch unbeigetretenen, vorbereiteten Gruppe gebraucht (withdrawPendingInvite(),
  // prepareGroup()).
  async function dissolveGroupFirestore(gid) {
    const [membersRes, plans, recipes] = await Promise.all([
      window.CloudGroup.fetchMembers(gid),
      window.CloudGroup.loadPlans(gid),
      window.CloudSync.loadRecipes(["groups", gid])
    ]);
    const members = membersRes.members;
    await window.CloudGroup.dissolve(gid, members.map(m => m.uid), plans.map(p => p.week), recipes.map(r => r.id));
    // invites/{code} ist bewusst nicht auflistbar (siehe firestore.rules) - deshalb ueber
    // state.inviteCodes gehen, dieselbe Liste, die auch beim Konto-Loeschen benutzt wird
    // (deleteAccountFlow), und nur die Codes entfernen, die wirklich zu dieser Gruppe
    // gehoeren (die Liste koennte theoretisch Codes einer laengst verlassenen frueheren
    // Gruppe enthalten).
    const ownCodes = [];
    for (const code of (state.inviteCodes || [])) {
      try {
        const inv = await window.CloudGroup.fetchInvite(code);
        if (inv && inv.gid === gid) ownCodes.push(code);
      } catch (e) { noteError("group:fetchInvite", e); }
    }
    for (const code of ownCodes) {
      try { await window.CloudGroup.deleteInvite(code); } catch (e) { noteError("group:deleteInvite", e); }
    }
    if (ownCodes.length) state.inviteCodes = (state.inviteCodes || []).filter(c => ownCodes.indexOf(c) === -1);
  }

  // Nach dem Verlassen oder Aufloesen ist JEDER eigene Einladungscode wertlos: Erzeugen darf
  // ihn nur der Inhaber einer Gruppe (firestore.rules), und in dieser Gruppe ist man danach
  // nicht mehr.
  //
  // Bis zum 17.08.2026 blieben sie liegen. dissolveGroupFirestore() raeumt nur Codes der
  // GERADE aufgeloesten Gruppe (inv.gid === gid) - ein Code aus einer frueheren Gruppe faellt
  // durch genau diese Pruefung und wird nie wieder angefasst; der Kommentar dort nannte den
  // Fall sogar ausdruecklich. Ueber mehrere Gruppenwechsel sammelten sich so tote Codes an
  // (vier Stueck an einem Abend), die beim Anklicken nur noch "Die Einladung konnte nicht
  // geladen werden" ergaben - und in Firestore als Karteileichen mit gid-Verweis liegen
  // blieben.
  //
  // Die delete-Regel traegt das auch bei laengst geloeschter Gruppe: Ihr erster Zweig prueft
  // nur resource.data.by == request.auth.uid und braucht kein get() auf das Gruppendokument.
  //
  // Nur ERFOLGREICH geloeschte fliegen aus der Liste. Was offline scheitert, bleibt stehen und
  // wird beim naechsten Verlassen erneut versucht - eine lokal geleerte Liste waere die sichere
  // Art, das Dokument nie wieder loeschen zu koennen (dieselbe Liste benutzt auch
  // deleteAccountFlow). Ein Code in der Liste kostet nichts, er taucht in keiner Ansicht auf.
  async function dropAllInviteCodes() {
    const codes = (state.inviteCodes || []).slice();
    if (!codes.length) return;
    const weg = [];
    for (const code of codes) {
      try { await window.CloudGroup.deleteInvite(code); weg.push(code); }
      catch (e) { noteError("group:deleteInvite", e); }
    }
    if (weg.length) state.inviteCodes = (state.inviteCodes || []).filter(c => weg.indexOf(c) === -1);
  }

  // Eigene Kopie von Meals und Plan aus dem aktuellen State. Tiefe Kopie beim Plan, weil
  // die Wochen verschachtelt sind und die Listener sie sonst unter der Hand mitleeren.
  function snapshotOwnData() {
    return {
      recipes: state.recipes.slice(),
      plans: JSON.parse(JSON.stringify(state.plans || {}))
    };
  }

  // Gruppe vollstaendig aufloesen (nur der Inhaber, ueber "Auflösen"), danach dieselbe lokale
  // Aufraeumarbeit wie beim einfachen Verlassen. Der eigene Mitglieder-Eintrag ist durch den
  // Batch in dissolveGroupFirestore() schon weg; removeMember() darin (in leaveGroup()) ist
  // dann ein folgenloser Zweitversuch auf ein bereits geloeschtes Dokument.
  //
  // Der Snapshot wird bewusst HIER gezogen und nicht erst in leaveGroup(): Sobald
  // dissolveGroupFirestore() die Gruppe geraeumt hat, feuern watchPlans/watchRecipes und
  // leeren state.plans bzw. state.recipes. Ein danach gebildeter "keep" ist leer - und
  // ueberschreibt beim Zurueckschreiben auch noch die letzte eigene Kopie.
  // Siehe docs/TROUBLESHOOTING.md, Punkt 101.
  async function dissolveGroup() {
    if (!syncGid || !syncUid) return;
    const gid = syncGid;
    const keep = snapshotOwnData();
    try {
      await dissolveGroupFirestore(gid);
    } catch (e) {
      // Batch schlug fehl (z. B. offline) - lieber lokal trotzdem aufraeumen, statt den Nutzer
      // in einer Gruppe festzuhalten, die er gerade aufloesen wollte. Auf dem Server bleibt sie
      // dann zwar bestehen, leaveGroup() unten entfernt zumindest den eigenen Zugriff.
    }
    await leaveGroup(keep);
  }

  // Gruppe verlassen. Plan und Meals bleiben als eigene Kopie erhalten - sie stehen ja
  // schon vollstaendig im lokalen State; sie werden nur wieder ins eigene Konto geschrieben.
  // "keep" darf von aussen kommen, wenn der Aufrufer den Stand VOR einem Eingriff sichern
  // musste (dissolveGroup(); dort steht die Begruendung). Ohne Argument bleibt es beim
  // bisherigen Verhalten: Der Snapshot entsteht hier, direkt aus dem aktuellen State.
  async function leaveGroup(keep) {
    if (!syncGid || !syncUid) return;
    const gid = syncGid;
    // VOR leaveGroupState() gelesen - das raeumt myRole weg. Nur-Leser haben ihre eigenen
    // Meals nie in die Gruppe kopiert (joinGroup(), `role !== "view"`); fuer sie ist der
    // Bestand in users/{uid}/recipes die EINZIGE Kopie und darf nicht aufgeraeumt werden.
    const warNurLeser = myRole === "view";
    const snap = keep || snapshotOwnData();
    const keepRecipes = snap.recipes;
    const keepPlans = snap.plans;
    try {
      // Atomar samt memberCount - einzeln lehnt die Regel es ab (CloudGroup.leaveAtomic).
      // Der leere catch traegt seit dem Limit einen Fall mehr: Nach dissolveGroup() ist das
      // Gruppendokument bereits weg, das update() darin scheitert also zwangslaeufig. Das ist
      // Normalbetrieb und kein Fehler - der Rest muss trotzdem laufen.
      await window.CloudGroup.leaveAtomic(gid, syncUid);
    } catch (e) { /* schon entfernt oder Gruppe aufgeloest - der Rest muss trotzdem laufen */ }
    state.groupId = "";
    leaveGroupState();
    state.recipes = keepRecipes;
    state.plans = keepPlans;
    setViewWeek(state.viewWeek);
    try {
      await window.CloudSync.save(syncUid, { groupId: "", plans: keepPlans });
      // Baseline leeren, damit der naechste Zyklus alle Meals als "neu" ins eigene
      // Konto schreibt - dort liegen sie ja noch nicht.
      lastPushedRecipes = new Map();
      lastPushedJSON = null;
      // ... und den Altbestand von VOR dem Beitritt ausdruecklich wegraeumen. Die leere
      // Baseline eine Zeile darueber loescht NICHTS (siehe pruneOwnRecipes()); ohne diesen
      // Schritt mischt der gleich folgende startCloudSync() den Altbestand wieder unter die
      // mitgebrachten Gruppen-Meals und jedes Katalog-Meal steht danach doppelt da.
      if (!warNurLeser) await pruneOwnRecipes(keepRecipes);
    } catch (e) { noteError("group:leaveSaveOwn", e); }
    // Aufraeumen erst NACH der Datensicherung, und das ist kein Schoenheitsfehler: Ein
    // Firestore-Schreibvorgang resolvt erst mit der Server-Bestaetigung, offline also gar
    // nicht. Stuende das Loeschen davor, haenge der Rueckweg des Wochenplans an einer
    // Aufraeumarbeit - Datenintegritaet vor Ordnung (CLAUDE.md, Ziffer 33).
    await dropAllInviteCodes();
    try {
      await window.CloudSync.save(syncUid, { inviteCodes: state.inviteCodes || [] });
    } catch (e) { noteError("group:leaveSaveCodes", e); }
    await switchGroup(null);
    toast("Du planst wieder für dich – deine Meals sind mitgekommen");
  }

  // QR-Code fuer eine Einladungs-URL in einen (bereits im DOM stehenden) Container laden.
  // Bewusst als eigener Schritt NACH dem synchronen paint(): qrSvg() laedt bei Bedarf erst
  // ZXing nach (vendor/zxing.min.js) - das darf das Zeichnen des restlichen Modals nicht
  // blockieren. Schlaegt es fehl (offline), verschwindet der Platz einfach wieder; die
  // Link-Zeile bleibt in jedem Fall stehen.
  function loadInviteQr(box, url) {
    if (!box || !url) return;
    qrSvg(url, 200).then(svg => { if (box.isConnected) box.appendChild(svg); })
      .catch(() => { if (box.isConnected) box.remove(); });
  }

  function openGroupModal() {
    if (authMode !== "cloud") {
      confirmModal({
        title: "Cloud-Konto nötig",
        text: "Gemeinsam planen geht nur mit einem Cloud-Konto – nur so kommt euer Plan auf alle Geräte.",
        okLabel: "Cloud-Konto anmelden",
        onConfirm: () => { authMode = "cloud"; renderAuthCloud(); }
      });
      return;
    }
    let createdUrl = null;   // Einladung fuer eine bereits AKTIVE Gruppe (weiteres Mitglied)
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Gemeinsam planen">
      <div class="modal-head"><div style="flex:1"><div class="kicker">Gemeinsam planen</div><h3 style="margin-top:2px" id="grp-title"></h3></div><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body"><div id="grp-body"></div></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const body = node.querySelector("#grp-body");
    const title = node.querySelector("#grp-title");

    // Drei Zustaende: A - noch nichts vorbereitet, B - Einladung offen (Wartezustand), noch
    // niemand beigetreten, C - Gruppe aktiv. syncGid ist erst ab C gesetzt (siehe Wartezustand-
    // Konzept in prepareGroup()/activateGroup()).
    function paint() {
      if (syncGid) {
        title.textContent = (groupInfo && groupInfo.name) || "Eure Gruppe";
        body.innerHTML = groupHtml();
        wire();
        if (createdUrl) loadInviteQr(body.querySelector("#grp-qr2"), createdUrl);
      } else if (state.pendingGroupId) {
        title.textContent = "Einladung offen";
        body.innerHTML = waitHtml();
        wire();
        loadInviteQr(body.querySelector("#grp-qr"), state.pendingInviteUrl);
      } else {
        title.textContent = "Gemeinsam planen";
        body.innerHTML = startHtml();
        wire();
      }
    }

    // Zwei Schalter, mehr braucht eine Gruppe aus zwei Leuten nicht. Sie stehen direkt
    // unter der Mitgliederliste statt hinter einem eigenen Reiter - fuer zwei Zeilen
    // waere ein Reiterwechsel ein Klick zu viel, und "Einkauf fuer alle rechnen" soll
    // man sehen, nicht suchen.
    function settingsHtml() {
      const row = (key, label, hint, on, off) => `
        <div class="setpick" style="margin-top:10px">
          <b>${label}</b>${hint ? `<small style="display:block;margin:-6px 0 9px;color:var(--text-muted);font-size:12.5px">${hint}</small>` : ""}
          <div class="seg" data-set="${key}" role="group" aria-label="${label}">
            <button type="button" data-v="1" class="${groupSetting(key) ? "on" : ""}">${on}</button>
            <button type="button" data-v="0" class="${groupSetting(key) ? "" : "on"}">${off}</button>
          </div>
        </div>`;
      return row("shopForAll", "Einkauf für alle rechnen", "Mengen × Mitglieder", "An", "Aus")
        + row("changeHints", "Hinweis bei Änderungen", "", "An", "Aus");
    }

    // Zustand A: noch keine Einladung vorbereitet. Kein Rollen-Umschalter mehr vorab -
    // Default ist "Mitplanen", aenderbar spaeter direkt am Mitglied (Zustand C).
    function startHtml() {
      // D2b: Einladen gehoert zu Pro, Beitreten nicht. Der Scan-Knopf bleibt deshalb stehen -
      // wer eingeladen wird, soll nicht vor einer Bezahlschranke landen, nur weil er das
      // Blatt ueber denselben Weg oeffnet.
      const invite = isPro()
        ? `<button class="btn primary" id="grp-invite-start" style="width:100%">Person einladen</button>`
        : `<p class="share-mini" style="margin:0 0 8px"><b>Einladen gehört zu Pro.</b> Eingeladen werden kannst du jederzeit – Pro braucht nur, wer die Gruppe gründet.</p>`;
      // Ausweg aus einer Gruppe, die nicht mehr erreichbar ist (docs/TROUBLESHOOTING.md 133).
      //
      // Wer aus einer Gruppe ENTFERNT wird, behaelt den Zeiger: CloudGroup.fetch() wirft fuer
      // ein Nichtmitglied `permission-denied`, enterGroupSync() macht daraus "error" statt
      // "gone" - und "error" heisst ausdruecklich "wir wissen es nicht", laesst den Zeiger
      // also stehen. Bei jedem Start dieselbe Meldung, ohne Ausweg.
      //
      // Automatisch raeumen waere gefaehrlich: Genau dieser Fehlercode kam am 28.08.2026 auch
      // FAELSCHLICH (Ziffer 134), und ein Fehlurteil kostete die Gruppe auf allen Geraeten.
      // Deshalb entscheidet der Nutzer - er sieht ja, dass es nicht mehr geht.
      //
      // Sichtbar nur in genau dieser Lage: Zeiger gesetzt, aber keine laufende Gruppensitzung.
      const haengt = !syncGid && !!state.groupId;
      const loesen = haengt ? `
        <p class="share-mini" style="margin:0 0 8px"><b>Diese Gruppe ist nicht erreichbar.</b>
        Vielleicht wurde sie aufgelöst oder du bist nicht mehr dabei.</p>
        <button class="btn ghost" id="grp-loesen" style="width:100%;margin-bottom:8px">Verbindung lösen</button>` : "";
      return `
        <p class="share-hint">Plant euren Wochenplan gemeinsam – einer trägt ein, alle sehen es sofort. Kalorienziel und Gewicht bleiben privat.</p>
        ${loesen}
        ${invite}
        <button class="btn ghost" id="grp-scan-start" style="width:100%;margin-top:8px">Einladung scannen</button>
        <details class="grp-note">
          <summary>Was teile ich damit?</summary>
          <p>Alle Mitglieder sehen deinen Namen, dein Profilbild, deine Meals samt Fotos und den Wochenplan – und wer welches Meal angelegt hat. <b>Nicht</b> geteilt werden dein Kalorien- und Makroziel, deine Angaben aus den Einführungsfragen, dein Gewichtsverlauf und deine E-Mail-Adresse.</p>
        </details>`;
    }

    // Zustand B: Einladung offen, noch niemand beigetreten. Der Owner plant unveraendert
    // weiter (deshalb kein Hinweis auf Einstellungen hier - die betreffen die Gruppe, die es
    // technisch schon gibt, aber noch nicht "seine" ist).
    function waitHtml() {
      return `
        <div class="grp-wait" role="status">
          ${memberAvatarHtml({ name: (profile && profile.name) || "", avatar: state.profileImage })}
          <span>Warten auf Beitritt …</span>
        </div>
        <div class="grp-qr" id="grp-qr"></div>
        <div class="link-row">
          <input type="text" class="share-link" id="grp-link" readonly value="${esc(state.pendingInviteUrl || "")}">
          <button class="btn primary" id="grp-copy">${canShare() ? "Senden" : "Kopieren"}</button>
        </div>
        <p class="share-mini">Du planst normal weiter – die Gruppe startet, sobald jemand beitritt.</p>
        <button class="btn ghost sm" id="grp-revoke" style="margin-top:8px">Einladung zurückziehen</button>`;
    }

    // Zustand C: Gruppe aktiv.
    function groupHtml() {
      const owner = groupRole() === "owner";
      const rows = groupMembers.map(m => {
        const me = m.uid === syncUid;
        const label = ROLE_LABEL[m.role] || ROLE_LABEL.view;
        // Rollenwahl nur beim Inhaber und nie fuer ihn selbst - er soll sich nicht
        // versehentlich degradieren und die Gruppe fuehrungslos machen. Steht sie da,
        // entfaellt der Rollen-Text unter dem Namen: er saesse sonst zweimal in derselben
        // Zeile, einmal als Text und einmal als gewaehlte Option.
        const pick = (owner && !me && m.role !== "owner")
          ? `<select data-role-for="${esc(m.uid)}" aria-label="Rechte von ${esc(firstName(m.name) || "Mitglied")}">
               <option value="edit"${m.role === "edit" ? " selected" : ""}>Mitplanen</option>
               <option value="view"${m.role === "view" ? " selected" : ""}>Nur ansehen</option>
             </select>`
          : "";
        // Als Symbol statt "Entfernen": in einer Zeile mit Name und Rollenwahl waere der
        // Text der Tropfen, der das Fass auf schmalen Geraeten zum Ueberlaufen bringt.
        // Die Beschriftung steckt im aria-label und im title.
        const kick = (owner && !me)
          ? `<button class="btn ghost icon-gh" data-kick="${esc(m.uid)}" title="${esc(firstName(m.name) || "Mitglied")} entfernen" aria-label="${esc(firstName(m.name) || "Mitglied")} entfernen">${ACT_ICONS.del}</button>`
          : "";
        // kick vor pick: die Rollenwahl bricht per flex-basis in die zweite Zeile um, und
        // stuende sie im Markup davor, schoebe sie den Entfernen-Knopf in eine dritte.
        return `<div class="grp-m">
          ${memberAvatarHtml(m)}
          <span class="who"><b>${esc(m.name || "Ohne Namen")}${me ? " (du)" : ""}</b>${pick ? "" : `<small>${esc(label)}</small>`}</span>
          ${kick}${pick}
        </div>`;
      }).join("");
      // Kein Rollen-Umschalter mehr vor dem Link: Default ist "Mitplanen", so wie beim
      // ersten Einladen auch - aendern kann der Inhaber die Rolle jederzeit oben am Mitglied.
      const inviteBlock = owner ? (createdUrl ? `
        <span class="share-sub">Einladungslink</span>
        <div class="grp-qr" id="grp-qr2"></div>
        <div class="link-row">
          <input type="text" class="share-link" id="grp-link" readonly value="${esc(createdUrl)}">
          <button class="btn primary" id="grp-copy">${canShare() ? "Senden" : "Kopieren"}</button>
        </div>
        <p class="share-mini">Wer den Link öffnet und sich anmeldet, ist dabei. Zurückziehen kannst du ihn unten.</p>
        <button class="btn ghost sm" id="grp-revoke" style="margin-top:8px">Link zurückziehen</button>`
      : (groupMembers.length >= MAX_GROUP_MEMBERS
          // Voll: der Knopf verschwindet ganz, statt deaktiviert dazustehen. Ein grauer Knopf
          // sieht nach Fehler aus, ein Satz erklaert es. Die Zahl darf hier stehen - das ist
          // die eigene Gruppe, kein Fremder.
          ? `<p class="share-mini" style="margin:0"><b>Ihr seid vollzählig</b> – mehr als ${MAX_GROUP_MEMBERS} Personen passen nicht in eine Gruppe. Geht jemand, wird ein Platz frei.</p>`
          : `<button class="btn primary" id="grp-invite" style="width:100%">Person einladen</button>`)) : "";
      const settingsBlock = owner ? `
        <span class="share-sub" style="margin-top:16px;display:block">Einstellungen</span>
        <div class="setpick">
          <b style="display:block;margin-bottom:8px">Gruppenname</b>
          <input type="text" id="grp-name" maxlength="40" placeholder="z. B. Team Küche" value="${esc((groupInfo && groupInfo.name) || "")}">
        </div>
        ${settingsHtml()}` : "";
      return `<div class="grp-list">${rows}</div>${inviteBlock}${settingsBlock}
        <hr style="border:0;border-top:1px solid var(--border);margin:16px 0 12px">
        <button class="btn ghost sm" id="grp-leave">${owner ? "Gruppe auflösen" : "Gruppe verlassen"}</button>`;
    }

    function wire() {
      // Einstellungs-Schalter. Sofort speichern statt "Sichern"-Knopf: eine Einstellung
      // ist kein Formular, und die Firestore-Regel prueft die Rolle ohnehin serverseitig.
      body.querySelectorAll("[data-set]").forEach(grp => grp.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", async () => {
        const key = grp.dataset.set;
        const val = b.dataset.v === "1";
        const next = Object.assign({}, (groupInfo && groupInfo.settings) || {});
        next[key] = val;
        grp.querySelectorAll("[data-v]").forEach(x => x.classList.toggle("on", x === b));
        try {
          await window.CloudGroup.setSettings(syncGid, next);
          groupInfo = Object.assign({}, groupInfo, { settings: next });
          if (key === "shopForAll") save();   // wirkt auf die Einkaufsliste
        } catch (e) { toast("Die Einstellung konnte nicht gespeichert werden."); paint(); }
      })));

      const nameInput = body.querySelector("#grp-name");
      if (nameInput) nameInput.addEventListener("change", async () => {
        const val = nameInput.value.trim().slice(0, 40);
        nameInput.value = val;
        try {
          await window.CloudGroup.setName(syncGid, val);
          groupInfo = Object.assign({}, groupInfo, { name: val });
          title.textContent = val || "Eure Gruppe";
        } catch (e) { toast("Der Name konnte nicht gespeichert werden."); }
      });

      // Zustand A: "Person einladen" bereitet die Gruppe vor (Wartezustand) und springt
      // direkt zu Zustand B - der Nutzer muss dafuer nichts auswaehlen.
      // "Verbindung loesen": nur den Zeiger raeumen, sonst nichts. KEIN leaveGroup() -
      // das schriebe Meals und Plan zurueck und wuerde die Mitgliedschaft beenden wollen,
      // die es hier gar nicht mehr gibt. Der eigene Bestand bleibt unangetastet.
      const loesenBtn = body.querySelector("#grp-loesen");
      if (loesenBtn) loesenBtn.addEventListener("click", () => {
        confirmModal({
          title: "Verbindung lösen?",
          bodyHtml: `<p style="margin:0">Diese Gruppe wird nicht mehr geladen. Deine Meals und dein
            Wochenplan bleiben, wie sie sind – du planst danach wieder für dich.</p>`,
          okLabel: "Lösen",
          onConfirm: async () => {
            state.groupId = "";
            save();
            // Auch in der Cloud raeumen, sonst holt der naechste Start den Zeiger von dort
            // zurueck (wantGid = remote.groupId || state.groupId, siehe Selbstheilung).
            try { await window.CloudSync.save(syncUid, { groupId: "" }); }
            catch (e) { noteError("group:loesen", e); }
            closeModal();
            toast("Verbindung gelöst – du planst wieder für dich");
            render();
          }
        });
      });
      const inviteStart = body.querySelector("#grp-invite-start");
      if (inviteStart) inviteStart.addEventListener("click", async () => {
        inviteStart.disabled = true; inviteStart.textContent = "Wird vorbereitet …";
        const url = await prepareGroup();
        if (url) paint();
        else { inviteStart.disabled = false; inviteStart.textContent = "Person einladen"; }
      });
      const scanStart = body.querySelector("#grp-scan-start");
      if (scanStart) scanStart.addEventListener("click", () => scanInvite());

      // Zustand B: Einladung zurueckziehen loest die vorbereitete Gruppe komplett auf.
      const withdraw = body.querySelector("#grp-revoke");
      if (withdraw && !syncGid) withdraw.addEventListener("click", async () => {
        withdraw.disabled = true;
        await withdrawPendingInvite();
        paint();
      });

      // Zustand C, Inhaber ohne offene Zweit-Einladung: "Person einladen" fuer ein
      // weiteres Mitglied - dieselbe Rolle "Mitplanen" wie beim ersten Einladen.
      const inv = body.querySelector("#grp-invite");
      if (inv) inv.addEventListener("click", async () => {
        inv.disabled = true; inv.textContent = "Wird erstellt …";
        try { createdUrl = await createInviteLink("edit"); paint(); }
        catch (e) {
          inv.disabled = false; inv.textContent = "Person einladen";
          // Der Inhaber einer bestehenden Gruppe hat normalerweise Pro - laeuft es ab,
          // waehrend die Gruppe steht, ist das hier der ehrlichere Text als "ging nicht".
          toast(isPro() ? "Der Link konnte nicht erstellt werden." : "Weitere Einladungen gehören zu Pro.");
        }
      });

      const copy = body.querySelector("#grp-copy");
      if (copy) copy.addEventListener("click", () => {
        const url = syncGid ? createdUrl : state.pendingInviteUrl;
        const text = "Plan mit mir zusammen bei Paddy's Mealplan: " + url;
        // Auf dem Handy den Systemdialog nehmen - er trifft WhatsApp direkt, statt den
        // Link nur in die Zwischenablage zu legen.
        // Hier bleibt der catch bewusst leer: Bricht der Nutzer das Teilen-Blatt ab, wirft
        // navigator.share einen AbortError. Das ist Normalbetrieb, kein Fehler - eine
        // Meldung darueber wuerde den Melder mit Rauschen fuellen.
        if (canShare()) navigator.share({ title: "Gemeinsam planen", text: text }).catch(() => {});
        else copyToClipboard(url, "Link kopiert");
      });

      // Zustand C, Link zurueckziehen (Zweit-Einladung, NICHT der Wartezustand - siehe oben).
      const rev = body.querySelector("#grp-revoke");
      if (rev && syncGid) rev.addEventListener("click", async () => {
        const code = (createdUrl || "").split("?g=")[1];
        try { if (code) await window.CloudGroup.deleteInvite(code); } catch (e) { noteError("group:deleteInviteOnDeleteAccount", e); }
        if (code) { state.inviteCodes = (state.inviteCodes || []).filter(c => c !== code); save(); }
        createdUrl = null; paint(); toast("Link zurückgezogen");
      });

      body.querySelectorAll("[data-role-for]").forEach(sel => sel.addEventListener("change", async () => {
        try { await window.CloudGroup.setRole(syncGid, sel.dataset.roleFor, sel.value); toast("Rechte geändert"); }
        catch (e) { toast("Die Rechte konnten nicht geändert werden."); paint(); }
      }));

      body.querySelectorAll("[data-kick]").forEach(b => b.addEventListener("click", () => {
        const m = memberByUid(b.dataset.kick) || {};
        confirmModal({
          title: (firstName(m.name) || "Mitglied") + " entfernen?",
          text: "Die Person sieht euren gemeinsamen Plan dann nicht mehr. Die von ihr angelegten Meals bleiben bei euch.",
          okLabel: "Entfernen",
          onConfirm: async () => {
            // Atomar samt memberCount - sonst bliebe der Platz fuer immer belegt.
            try { await window.CloudGroup.leaveAtomic(syncGid, b.dataset.kick); } catch (e) { toast("Das hat nicht geklappt."); }
          }
        });
      }));

      const leave = body.querySelector("#grp-leave");
      if (leave) leave.addEventListener("click", () => {
        const owner = groupRole() === "owner";
        confirmModal({
          title: owner ? "Gruppe auflösen?" : "Gruppe verlassen?",
          text: owner
            ? "Alle verlieren den Zugriff auf den gemeinsamen Plan. Deine Meals und dein Wochenplan bleiben dir erhalten."
            : "Du planst danach wieder für dich. Deine Meals und der Wochenplan kommen als Kopie mit.",
          okLabel: owner ? "Auflösen" : "Verlassen",
          onConfirm: async () => {
            if (owner) await dissolveGroup(); else await leaveGroup();
            closeModal();
          }
        });
      });
    }

    paint();
    openModal(node);
    // Aendert sich die Mitgliederliste, waehrend der Dialog offen steht (jemand tritt bei),
    // soll er das zeigen statt zu veralten.
    groupModalRepaint = paint;
  }

  function shareMealPayload(recipeId) {
    const r = getRecipe(recipeId);
    if (!r) return null;
    // og: schlanke Link-Vorschau (Titel + Foto) fuer den Cloudflare Worker (docs/ARCHITECTURES.md).
    // Bei einem eigenen Foto steckt es bereits unveraendert in recipes[0].image - og.img bleibt
    // dann bewusst null (Firestore lehnt undefined im Payload ab) statt denselben Base64-String
    // ein zweites Mal einzubetten, das wuerde den Payload gegen die 400-KB-Grenze verdoppeln.
    // Der Worker faellt in diesem Fall auf recipes[0].image zurueck. Nur bei einem PHOTOS-Pfad
    // (kein eigenes Foto) traegt og.img den Wert direkt - photoFor(r) liefert dort ohnehin
    // nur einen "img/..."-Pfad, keine data:-URL.
    const ownPhoto = safeImage(r.image);
    return { app: "wochenkueche", v: 1, type: "meal", uid: syncUid || "", by: profile ? profile.name : "", when: Date.now(), recipes: [r], og: { t: r.name, img: ownPhoto ? null : photoFor(r) } };
  }
  // Der Link ist der einzige Schutz des geteilten Plans, also muss die ID unerratbar sein.
  // Math.random() ist dafuer ungeeignet (nicht kryptografisch) und ein Zeitstempel erst recht.
  // 16 Zeichen aus einem 32er-Alphabet = 80 Bit; 32 teilt 256 glatt, daher kein Modulo-Bias.
  function shareId() {
    const abc = "abcdefghijkmnpqrstuvwxyz23456789"; // ohne l/o/0/1 (verwechselbar)
    const c = window.crypto || window.msCrypto;
    const a = new Uint8Array(16);
    c.getRandomValues(a);
    let s = "";
    for (let i = 0; i < a.length; i++) s += abc[a[i] % abc.length];
    return s;
  }
  function copyToClipboard(text, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg || "Kopiert")).catch(() => toast("Kopieren hat nicht geklappt"));
    else { try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(okMsg || "Kopiert"); } catch (e) { toast("Kopieren hat nicht geklappt"); } }
  }
  function buildPrintable() {
    const rows = DAYS.map(d => {
      const cells = MEALS.map(m => {
        const names = state.plan[d.key][m.key].map(entry => { const r = getRecipe(entryId(entry)); return r ? esc(r.name) : null; }).filter(Boolean);
        return `<td>${names.length ? names.join("<br>") : "<span class='pt-empty'>–</span>"}</td>`;
      }).join("");
      return `<tr><th>${esc(d.label)}</th>${cells}</tr>`;
    }).join("");
    const dateStr = new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });
    return `<div class="pt-doc">
      <div class="pt-head">
        <h1>Wochenplan</h1>
        <div class="pt-meta">${profile ? esc(profile.name) + "<br>" : ""}${dateStr}</div>
      </div>
      <table class="pt-table">
        <thead><tr><th></th>${MEALS.map(m => `<th>${esc(m.label)}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="pt-foot">Erstellt mit Paddy’s Mealplan</div>
    </div>`;
  }
  // ----- Teilen ueber den nativen Dialog des Geraets (Web Share API) -----
  // Auf dem Handy der kuerzeste Weg: ein Tippen, dann waehlt der Nutzer WhatsApp, Signal,
  // Mail o. Ä. - kein Umweg ueber Zwischenablage oder mailto (das bei vollen Wochenplaenen
  // ohnehin an der ~2000-Zeichen-Grenze von Windows/Outlook scheitert).
  // canShareFiles() ist bewusst strenger als "navigator.share existiert": Desktop-Chrome
  // kennt share(), kann aber je nach System keine Dateien - dann lieber Text teilen als
  // einen Knopf anzubieten, der wirft.
  function canShare() { return typeof navigator !== "undefined" && typeof navigator.share === "function"; }
  function canShareFiles(files) {
    try { return canShare() && typeof navigator.canShare === "function" && navigator.canShare({ files: files }); }
    catch (e) { return false; }
  }
  // Teilt eine Datei, faellt auf Text zurueck, wenn das Geraet keine Dateien teilen kann.
  // Rueckgabe: true = geteilt, false = Nutzer hat abgebrochen oder es ging nicht.
  async function shareFileOrText(bytes, filename, title, fallbackText) {
    let file = null;
    try { file = new File([bytes], filename, { type: "application/pdf" }); } catch (e) { file = null; }
    try {
      if (file && canShareFiles([file])) { await navigator.share({ files: [file], title: title }); return true; }
      if (canShare()) { await navigator.share({ title: title, text: fallbackText }); return true; }
    } catch (e) {
      // AbortError = Nutzer hat den Dialog weggewischt. Das ist kein Fehler, nur ein Nein.
      if (e && e.name === "AbortError") return false;
      throw e;
    }
    return false;
  }
  // Teilt einen Link. Bewusst mit url: statt nur text: - Android/iOS erkennen den Typ
  // text/plain und zeigen dann die volle Direct-Share-Zeile mit Kontakten, genau wie
  // bei der Einkaufsliste. Rueckgabe: true = geteilt, false = abgebrochen/nicht moeglich.
  async function shareLink(title, text, url) {
    try { await navigator.share({ title: title, text: text, url: url }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; throw e; }
  }
  // ----- Einkaufsliste als PDF (Paket B3) -----
  // Die Einkaufsliste ist beliebig lang - deshalb mehrseitig statt einer festen Ein-Seiten-
  // Struktur. Baut je Seite einen eigenen Content-Stream und haengt sie am Ende zu einem
  // gemeinsamen PDF zusammen (gleiche Bausteine wie pdfEsc/trunc/WinAnsi-Fonts).
  // Reine Layout-Planung ohne Kopf-Text (planShopPages): verteilt Gruppen/Zutaten auf
  // Seiten, renderShopPage baut daraus die eigentlichen Content-Streams. Getrennt vom
  // Rendern, weil die Gesamtseitenzahl (fuer "Seite X von Y" im Kopf jeder Seite) erst nach
  // dem vollstaendigen Layout feststeht. Seite 1 hat wegen des vollen Marken-Kopfs weniger
  // Content-Hoehe als die Folgeseiten mit schlankem Kopf - deshalb die zwei TOP-Werte.
  function planShopPages(items, groups) {
    const TOP_FIRST = 700, TOP_CONT = 778, BOTTOM = 60;
    const pages = [];
    let page = [], y = TOP_FIRST;
    function newPage() { pages.push(page); page = []; y = TOP_CONT; }
    function ensureSpace(need) { if (y - need < BOTTOM) newPage(); }
    if (!items.length) {
      page.push({ kind: "empty" });
      y -= 20;
    } else {
      groups.forEach(g => {
        ensureSpace(20 + 16); // Gruppenkopf + mindestens eine Zeile zusammenhalten
        page.push({ kind: "group", title: g.cat.title });
        y -= 20;
        g.items.forEach(it => {
          ensureSpace(16);
          page.push({ kind: "item", label: it.label + (it.count > 1 ? " (×" + it.count + ")" : "") });
          y -= 16;
        });
        page.push({ kind: "gap", amount: 8 });
        y -= 8;
      });
    }
    ensureSpace(20);
    page.push({ kind: "footer" });
    pages.push(page);
    return pages;
  }
  // Rendert eine geplante Seite zu einem Content-Stream. Seite 1 bekommt den vollen
  // Marken-Kopf, jede weitere den schlanken Kopf mit Seitenzahl.
  function renderShopPage(entries, pageNum, totalPages, scope, dateStr, logo) {
    const L = 56, R = 539;
    let cs = pageNum === 1
      ? pdfBrandHeader(L, R, "Einkaufsliste", scope + "   ·   " + dateStr, logo)
      : pdfSlimHeader(L, R, pageNum, totalPages, logo);
    cs += "BT\n";
    let y = pageNum === 1 ? 700 : 778;
    entries.forEach(entry => {
      if (entry.kind === "empty") {
        cs += "0.5 0.5 0.5 rg /F1 12 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc("Noch keine Zutaten geplant.") + ") Tj\n0 0 0 rg\n";
        y -= 20;
      } else if (entry.kind === "group") {
        cs += "0 0 0 rg /F2 13 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc(entry.title) + ") Tj\n";
        y -= 20;
      } else if (entry.kind === "item") {
        cs += "0 0 0 rg /F1 11 Tf 1 0 0 1 " + (L + 18) + " " + y + " Tm (" + pdfEsc(trunc(entry.label, 58)) + ") Tj\n";
        y -= 16;
      } else if (entry.kind === "gap") {
        y -= entry.amount;
      } else if (entry.kind === "footer") {
        cs += "0.6 0.6 0.6 rg /F1 9 Tf 1 0 0 1 " + L + " " + y + " Tm (" + pdfEsc("Erstellt mit Paddy’s Mealplan") + ") Tj\n0 0 0 rg\n";
      }
    });
    cs += "ET\n";
    return cs;
  }
  function shopPdfString() {
    const { items, groups } = buildShoppingList();
    const dateStr = new Date().toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
    // Dieselbe Quelle wie die beiden Modal-Koepfe (planScopeLabel). Vorher stand hier eine
    // eigene Zeile, die zwar die richtige WOCHE nannte, aber das "ab heute" verschwieg: Das
    // PDF trug "Diese Woche" ueber einer Liste, die nur die restlichen Tage enthaelt. Wer es
    // ausdruckt, sieht dem Blatt nicht an, dass Montag bis Mittwoch fehlen - derselbe Fehler
    // wie im Modal-Kopf (TROUBLESHOOTING 124), nur andersherum.
    const { todayIdx } = planDaysAhead();
    const scope = planScopeTitle(todayIdx);
    const logo = PM.pdf.logoAsset();   // Cache aus lib/pdf.js, siehe dort
    const planned = planShopPages(items, groups);
    const n = planned.length;
    const pages = planned.map((p, i) => renderShopPage(p, i + 1, n, scope, dateStr, logo));

    const fontsStart = 3 + 2 * n; // Objekt-ID der ersten Schriftart, nach Catalog+Pages+je Seite (Page+Content)
    const imageId = fontsStart + 3, smaskId = fontsStart + 4;
    const objs = [];
    objs[0] = "<< /Type /Catalog /Pages 2 0 R >>";
    const kids = [];
    for (let i = 0; i < n; i++) kids.push((3 + 2 * i) + " 0 R");
    objs[1] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>";
    const fontRes = "/F1 " + fontsStart + " 0 R /F2 " + (fontsStart + 1) + " 0 R /F3 " + (fontsStart + 2) + " 0 R";
    const xobjRes = logo ? " /XObject << /Im0 " + imageId + " 0 R >>" : "";
    for (let i = 0; i < n; i++) {
      const pageId = 3 + 2 * i, contentId = 4 + 2 * i;
      objs[pageId - 1] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << " + fontRes + " >>" + xobjRes + " >> /Contents " + contentId + " 0 R >>";
      objs[contentId - 1] = "<< /Length " + pages[i].length + " >>\nstream\n" + pages[i] + "endstream";
    }
    objs[fontsStart - 1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    objs[fontsStart] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
    objs[fontsStart + 1] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>";
    if (logo) {
      objs[imageId - 1] = "<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode /SMask " + smaskId + " 0 R /Length " + logo.rgbLen + " >>\nstream\n" + logo.rgbStream + "\nendstream";
      objs[smaskId - 1] = "<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length " + logo.alphaLen + " >>\nstream\n" + logo.alphaStream + "\nendstream";
    }
    let pdf = "%PDF-1.4\n";
    const offsets = [];
    objs.forEach((o, i) => { offsets.push(pdf.length); pdf += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
    const xref = pdf.length;
    pdf += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n";
    offsets.forEach(off => { pdf += String(off).padStart(10, "0") + " 00000 n \n"; });
    pdf += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    return pdf;
  }
  async function downloadShopPdf() {
    try {
      await prepareLogoForPdf();
      saveBlob(new Blob([pdfBytes(shopPdfString())], { type: "application/pdf" }), "einkaufsliste.pdf");
      toast("PDF gespeichert");
    } catch (e) { toast("PDF konnte nicht erstellt werden"); }
  }
  async function shareShopPdf() {
    try {
      await prepareLogoForPdf();
      const ok = await shareFileOrText(pdfBytes(shopPdfString()), "einkaufsliste.pdf", "Einkaufsliste", shoppingText(buildShoppingList().groups));
      if (ok) toast("Einkaufsliste geteilt");
    } catch (e) { toast("Teilen hat nicht geklappt"); }
  }

  window.addEventListener("beforeprint", () => { const pa = document.getElementById("print-area"); if (pa) pa.innerHTML = buildPrintable(); });

  // Neuer Standardweg zum Teilen eines Meals: ein Tipp statt Modal -> Link erstellen -> kopieren.
  // Faellt auf openShareRecipe() zurueck, wenn das Geraet kein natives Share-Sheet hat, kein
  // Cloud-Konto besteht oder das Foto zu gross fuer den Payload ist - das Modal bleibt dafuer
  // vollstaendig erhalten.
  function shareRecipeNow(recipeId) {
    const r = getRecipe(recipeId);
    if (!r) return;
    const payload = shareMealPayload(recipeId);
    if (!payload || JSON.stringify(payload).length > 400000) { openShareRecipe(recipeId); return; }
    // CloudShare.enabled sagt nur, dass Firebase konfiguriert ist - nicht, dass diese Person
    // gerade per Cloud angemeldet ist (siehe loadSharedById() Zeile 8084). Ein lokales Profil
    // hat keine Firebase-Authentifizierung, publish() wuerde an den Firestore-Regeln scheitern
    // und der verschickte Link waere tot.
    const cloudOk = window.CloudShare && window.CloudShare.enabled && authMode === "cloud";
    if (!cloudOk || !canShare()) { openShareRecipe(recipeId); return; }
    // shareId() ist synchron, deshalb steht die URL sofort fest: publish() und das Share-Sheet
    // koennen parallel laufen, ohne die Nutzer-Aktivierung durch ein await zu verbrauchen
    // (siehe docs/TROUBLESHOOTING.md). state.shares wird erst nach erfolgreichem publish()
    // ergaenzt - sonst wuerden gescheiterte oder abgebrochene Uploads mitgezaehlt, obwohl nie
    // ein shared/{id}-Dokument entstanden ist.
    const id = shareId();
    const url = location.origin + location.pathname + "?s=" + id;
    window.CloudShare.publish(id, payload).then(() => {
      if (!(state.shares || []).includes(id)) { state.shares = unionIds(state.shares, [id]); save(); }
    }).catch(() => { toast("Der Link ist noch nicht gespeichert – teile ihn noch einmal, sobald du online bist."); });
    shareLink(r.name, "Mein Meal für dich: " + r.name, url).catch(() => { toast("Teilen hat nicht geklappt"); });
  }

  function openShareRecipe(recipeId) {
    const r = getRecipe(recipeId);
    if (!r) return;
    let createdUrl = null;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Meal teilen">
      <div class="modal-head"><div style="flex:1"><div class="kicker">Meal teilen</div><h3 style="margin-top:2px">${esc(r.name)} teilen</h3></div><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body"><div id="sr-body"></div></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const body = node.querySelector("#sr-body");
    function paint() {
      const cloudOk = window.CloudShare && window.CloudShare.enabled;
      if (!cloudOk) {
        body.innerHTML = `<p class="share-hint">Du brauchst ein <b>Cloud-Konto</b> zum Teilen.</p>`;
      } else if (createdUrl) {
        body.innerHTML = `
          <p class="share-hint">Fertig! Wer den Link öffnet, übernimmt dieses Meal als <b>Kopie</b>.</p>
          <span class="share-sub">Dein Teilen-Link</span>
          <div class="link-row">
            <input type="text" class="share-link" id="sl" readonly value="${esc(createdUrl)}">
            <button class="btn primary" id="sl-copy">Link kopieren</button>
          </div>
          <p class="share-mini">Der Empfänger meldet sich einmal kostenlos an und kann das Meal dann übernehmen.</p>
          <div class="share-actions"><button class="btn" id="sl-new">Neuen Link erstellen</button></div>`;
        body.querySelector("#sl-copy").addEventListener("click", () => { body.querySelector("#sl").select(); copyToClipboard(createdUrl, "Link kopiert"); });
        body.querySelector("#sl-new").addEventListener("click", () => { createdUrl = null; paint(); });
      } else {
        body.innerHTML = `
          <p class="share-hint">Der Link erstellt eine <b>Kopie</b> dieses Meals.</p>
          <button class="btn primary" id="mk-link" style="width:100%;justify-content:center">Meal-Link erstellen</button>
          <p class="share-mini" id="mk-note"></p>`;
        const btn = body.querySelector("#mk-link");
        const note = body.querySelector("#mk-note");
        btn.addEventListener("click", () => {
          const payload = shareMealPayload(recipeId);
          if (!payload) { note.className = "share-mini warn"; note.textContent = "Meal nicht gefunden."; return; }
          if (JSON.stringify(payload).length > 400000) { note.className = "share-mini warn"; note.textContent = "Das Foto dieses Meals ist zu groß zum Teilen."; return; }
          btn.disabled = true; btn.textContent = "Erstelle Link …"; note.className = "share-mini"; note.textContent = "";
          const id = shareId();
          window.CloudShare.publish(id, payload).then(() => {
            // unionIds statt concat: haelt die Liste sortiert. Angehaengt entstuende hier eine
            // Reihenfolge, die kein anderes Geraet reproduziert - und damit ein ueberfluessiger
            // Abgleich-Zyklus mit dem zweiten Geraet (siehe TROUBLESHOOTING Ziffer 34).
            if (!(state.shares || []).includes(id)) { state.shares = unionIds(state.shares, [id]); save(); }
            createdUrl = location.origin + location.pathname + "?s=" + id; paint();
          }).catch(() => { btn.disabled = false; btn.textContent = "Meal-Link erstellen"; note.className = "share-mini warn"; note.textContent = "Link konnte nicht erstellt werden. Bist du online und angemeldet?"; });
        });
      }
    }
    paint();
    openModal(node);
  }

  function applySharedData(data, takePlan) {
    if (!data || !Array.isArray(data.recipes)) { toast("Geteilter Plan konnte nicht gelesen werden"); return; }
    // Ein geteilter Plan wuerde hier in die GEMEINSAME Sammlung geschrieben - dafuer fehlen
    // einem Nur-Ansehen-Mitglied die Rechte, und der Vorgang liefe still ins Leere.
    if (blockedByRole()) { closeModal(); return; }
    const idMap = {};
    let added = 0;
    data.recipes.forEach(ir => {
      if (!ir || !ir.name) return;
      const existing = state.recipes.find(r => r.name.trim().toLowerCase() === ir.name.trim().toLowerCase());
      if (existing) { idMap[ir.id] = existing.id; return; }
      const nid = uid();
      idMap[ir.id] = nid;
      // image bewusst durch safeImage(): der Snapshot stammt von einer fremden Person,
      // und nur hier kaeme ein manipulierter Wert ungeprueft in den eigenen Bestand.
      state.recipes.push({ id: nid, name: ir.name, category: migrateCat(ir.category || "Gericht"), nutrition: (ir.nutrition && typeof ir.nutrition === "object") ? ir.nutrition : null, ingredients: Array.isArray(ir.ingredients) ? ir.ingredients.map(sanitizeIng).filter(Boolean) : [], steps: ir.steps || "", image: safeImage(ir.image) });
      added++;
    });
    if (takePlan && data.plan) {
      const np = makeEmptyPlan();
      DAYS.forEach(d => MEALS.forEach(m => {
        const raw = data.plan[d.key] && data.plan[d.key][m.key];
        np[d.key][m.key] = asIdList(raw).map(v => idMap[v]).filter(Boolean);
      }));
      state.plans[activeWeekKey()] = np;   // in die gerade angezeigte Woche importieren
      state.plan = np;
    }
    save(); closeModal();
    state.tab = "plan"; render();
    toast("Importiert" + (data.by ? " von " + data.by : "") + ": " + added + " neue Meal" + (added === 1 ? "" : "s"));
  }

  // ---------- Boot ----------
  boot();

})();
</script>
<script>
  /* Service Worker registrieren — rein additiv: die App muss ohne ihn voll funktionieren
     (Graceful Fallback, wie beim blockierten Firebase-CDN). Relativer Pfad + Scope: das
     stammt aus der Zeit unter .../mealplan/ und bleibt richtig, seit die App auf dem Root
     von www.paddysmealplan.de liegt - und es haelt den Capacitor-Weg offen. Erst nach
     'load', um den ersten Paint/Boot nicht zu verzoegern. Fehler still schlucken. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
    });
  }
</script>
</html>
