<!-- ============================================================
     Cloud-Anmeldung (Firebase) — lädt als ES-Modul.
     Solange die Config unten Platzhalter enthält ODER das CDN
     blockiert ist (z. B. im Claude-Artifact), fällt die App
     automatisch auf den lokalen Login zurück – es bricht nichts.
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, sendEmailVerification, signOut,
    updateProfile, sendPasswordResetEmail, setPersistence,
    browserLocalPersistence, GoogleAuthProvider, OAuthProvider, signInWithPopup,
    signInWithRedirect, getRedirectResult,
    deleteUser, reauthenticateWithPopup, reauthenticateWithCredential, EmailAuthProvider
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getFirestore, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, writeBatch, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  /* ▼▼▼ HIER die Werte aus der Firebase-Konsole eintragen ▼▼▼
     (Projekt-Einstellungen → Deine Apps → Web-App → SDK-Konfiguration) */
  const firebaseConfig = {
    apiKey: "AIzaSyAr6kx7lByKgoUrnNJsRD06PKSs3ivplLE",
    authDomain: "paddys-mealplan.firebaseapp.com",
    projectId: "paddys-mealplan",
    storageBucket: "paddys-mealplan.firebasestorage.app",
    messagingSenderId: "1045496121634",
    appId: "1:1045496121634:web:c43390145fe7b52789bd7b"
  };
  /* ▲▲▲ ------------------------------------------------------- ▲▲▲ */

  const CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("DEIN_") !== 0;
  window.CloudAuth = { configured: !!CONFIGURED };

  if (!CONFIGURED) {
    window.dispatchEvent(new CustomEvent("cloudauth:disabled"));
  } else {
    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      auth.languageCode = "de";
      setPersistence(auth, browserLocalPersistence).catch(function () {});

      function popupFallback(e, provider) {
        const c = e && e.code;
        if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
          return signInWithRedirect(auth, provider);
        }
        throw e;
      }
      // Nach signInWithRedirect verlaesst die Seite den Tab komplett und laedt danach neu -
      // das Ergebnis (oder ein Fehler wie "account-exists-with-different-credential") kommt
      // erst hier an, nie ueber das Promise von loginGoogle/loginApple. onAuthStateChanged holt
      // den erfolgreich angemeldeten User ohnehin automatisch ab; hier wird nur der Fehlerfall
      // eingefangen, damit er nicht stillschweigend verschwindet.
      getRedirectResult(auth).catch(function (e) { window.CloudAuth.redirectError = e; });

      Object.assign(window.CloudAuth, {
        registerEmail: async function (name, email, pw) {
          const cred = await createUserWithEmailAndPassword(auth, email, pw);
          if (name) { try { await updateProfile(cred.user, { displayName: name }); } catch (e) {} }
          await sendEmailVerification(cred.user);
          return cred.user;
        },
        loginEmail: function (email, pw) { return signInWithEmailAndPassword(auth, email, pw); },
        // In-App-Browser (Instagram, Facebook, TikTok) blockieren OAuth-Popups routinemaessig -
        // dort kommt "auth/popup-blocked", und "Erlaube Pop-ups" laesst sich dort nicht befolgen
        // (es gibt keine Popup-Einstellung). Ausweg: bei genau diesen Fehlercodes auf einen
        // vollen Seitenwechsel (signInWithRedirect) umsteigen. Das Ergebnis holt getRedirectResult()
        // weiter unten ab, sobald die Seite danach neu laedt.
        loginGoogle: function () {
          const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
          return signInWithPopup(auth, p).catch(function (e) { return popupFallback(e, p); });
        },
        loginApple: function () {
          const p = new OAuthProvider("apple.com"); p.addScope("email"); p.addScope("name");
          return signInWithPopup(auth, p).catch(function (e) { return popupFallback(e, p); });
        },
        resendVerification: function () {
          return auth.currentUser ? sendEmailVerification(auth.currentUser) : Promise.reject(new Error("no-user"));
        },
        resetPassword: function (email) { return sendPasswordResetEmail(auth, email); },
        updateName: function (name) {
          return auth.currentUser ? updateProfile(auth.currentUser, { displayName: name }) : Promise.reject(new Error("no-user"));
        },
        reloadUser: function () {
          return auth.currentUser ? auth.currentUser.reload().then(function () { return auth.currentUser; }) : Promise.resolve(null);
        },
        logout: function () { return signOut(auth); },
        current: function () { return auth.currentUser; },
        // Konto vollstaendig loeschen (Art. 17 DSGVO). Reihenfolge ist wichtig: die
        // Firestore-Dokumente muessen VOR deleteUser() weg, weil die Security Rules
        // "request.auth.uid == uid" pruefen - nach deleteUser waere der Nutzer nicht
        // mehr angemeldet und der Zugriff wuerde verweigert.
        // opts.password fuer Email/Passwort-Konten, sonst per Popup erneut bestaetigt
        // (Firebase verlangt fuer diese sensible Aktion eine kuerzliche Anmeldung).
        deleteAccount: async function (opts) {
          const user = auth.currentUser;
          if (!user) throw new Error("no-user");
          const pid = (user.providerData[0] || {}).providerId;
          if (pid === "password") {
            if (!opts || !opts.password) throw new Error("password-required");
            await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, opts.password));
          } else if (pid === "google.com") {
            await reauthenticateWithPopup(user, new GoogleAuthProvider());
          } else if (pid === "apple.com") {
            await reauthenticateWithPopup(user, new OAuthProvider("apple.com"));
          }
          const uid = user.uid;
          // Fehler beim Loeschen eines geteilten Plans NICHT verschlucken und weitermachen:
          // sonst koennte "Konto loeschen" durchlaufen, obwohl ein Snapshot liegen blieb -
          // und der waere danach fuer immer verwaist (die Regel verlangt einen Auth-User
          // mit genau dieser uid, den es nach deleteUser() nicht mehr gibt). Lieber
          // abbrechen und dem Nutzer einen erneuten Versuch ermoeglichen (das Wiederholen
          // ist unproblematisch: bereits geloeschte Dokumente ueberspringt deleteDoc still).
          const shareIds = (opts && opts.shareIds) || [];
          for (let i = 0; i < shareIds.length; i++) {
            await deleteDoc(doc(db, "shared", shareIds[i]));
          }
          // Rezepte liegen seit dem Subcollection-Umbau in eigenen Dokumenten - Firestore
          // loescht Subcollections NICHT automatisch mit, wenn das Elternobjekt verschwindet.
          const recipeIds = (opts && opts.recipeIds) || [];
          for (let i = 0; i < recipeIds.length; i++) {
            await deleteDoc(doc(db, "users", uid, "recipes", recipeIds[i]));
          }
          // Mitgliedschaft in einer Gruppe: Name und Bild liegen in einem Dokument, das
          // NICHT unter users/{uid} haengt und deshalb sonst zurueckbliebe - in einer
          // fremden Gruppe, fuer immer, ohne dass es danach noch jemand loeschen koennte
          // (die Regel verlangt genau diese uid). Aus demselben Grund wie oben bei den
          // geteilten Plaenen: Fehler nicht verschlucken, lieber abbrechen.
          if (opts && opts.groupId) {
            await deleteDoc(doc(db, "groups", opts.groupId, "members", uid));
          }
          // Selbst erzeugte Einladungscodes: sie zeigen auf die Gruppe und traegen die
          // eigene uid im Feld "by".
          const inviteCodes = (opts && opts.inviteCodes) || [];
          for (let i = 0; i < inviteCodes.length; i++) {
            await deleteDoc(doc(db, "invites", inviteCodes[i]));
          }
          await deleteDoc(doc(db, "users", uid));
          try {
            await deleteUser(user);
          } catch (e) {
            // Daten sind zu diesem Zeitpunkt bereits weg; nur noch der Login-Account
            // besteht. Markieren, damit die App eine passende Meldung zeigen kann.
            e.dataAlreadyDeleted = true;
            throw e;
          }
        }
      });

      // ----- Cloud-Sync (Firestore): pro Nutzer ein Dokument users/{uid} -----
      const db = getFirestore(app);
      // Rezepte liegen zweimal in derselben Struktur: unter users/{uid}/recipes fuer das
      // eigene Konto und unter groups/{gid}/recipes fuer eine gemeinsame Gruppe. Deshalb
      // nehmen die Rezept-Funktionen unten einen Basispfad ["users", uid] bzw.
      // ["groups", gid] statt einer uid - ein Parameter statt zweier fast gleicher
      // Funktionspaare, die auseinanderlaufen koennten.
      function recipesCol(base) { return collection(db, base[0], base[1], "recipes"); }
      function recipeDoc(base, id) { return doc(db, base[0], base[1], "recipes", id); }

      window.CloudSync = {
        enabled: true,
        load: function (uid) {
          return getDoc(doc(db, "users", uid)).then(function (snap) {
            return snap.exists() ? snap.data() : null;
          });
        },
        // merge=true schreibt nur die uebergebenen Felder und laesst alles andere stehen.
        // Wichtig, sobald der Wochenplan in einer Gruppe liegt: das Kontodokument wird dann
        // ohne "plans" gepusht - ohne merge wuerde jeder Push das Feld beim Verlassen der
        // Gruppe geloescht zuruecklassen. Ohne Gruppe ist es schlicht die sicherere Variante.
        save: function (uid, data, merge) {
          return setDoc(doc(db, "users", uid), data, { merge: merge !== false });
        },
        watch: function (uid, cb) {
          return onSnapshot(doc(db, "users", uid), function (snap) {
            if (snap.exists()) cb(snap.data(), snap.metadata.hasPendingWrites);
          }, function () {});
        },
        // ----- Rezepte: eigenes Dokument je Meal (users/{uid}/recipes/{id}) -----
        // Batch statt Einzel-setDoc/deleteDoc: batch.commit() ist atomar - entweder
        // landen alle Aenderungen dieses Zyklus, oder keine. Bricht ein Netzabbruch
        // mitten in commit() ab, bleibt die lokale Baseline unveraendert und der
        // naechste Zyklus versucht denselben Diff erneut (siehe syncRecipes()).
        loadRecipes: function (base) {
          return getDocs(recipesCol(base)).then(function (snap) {
            return snap.docs.map(function (d) { return d.data(); });
          });
        },
        saveRecipesBatch: function (base, puts, delIds) {
          const batch = writeBatch(db);
          puts.forEach(function (r) { batch.set(recipeDoc(base, r.id), r); });
          delIds.forEach(function (id) { batch.delete(recipeDoc(base, id)); });
          return batch.commit();
        },
        watchRecipes: function (base, cb) {
          return onSnapshot(recipesCol(base), function (snap) {
            cb(snap.docChanges().map(function (c) {
              return { type: c.type, id: c.doc.id, data: c.doc.data(), pending: c.doc.metadata.hasPendingWrites };
            }));
          }, function () {});
        }
      };

      // ----- Teilen per Cloud-Link: öffentlich lesbare Snapshots in shared/{id} -----
      window.CloudShare = {
        enabled: true,
        publish: function (id, data) { return setDoc(doc(db, "shared", id), data); },
        fetch: function (id) {
          return getDoc(doc(db, "shared", id)).then(function (s) { return s.exists() ? s.data() : null; });
        }
      };

      // ----- Gemeinsam planen: groups/{gid} mit Mitgliedern, Wochenplan und Meals -----
      // Bewusst ein eigenes Fenster-Objekt neben CloudSync/CloudShare statt eines weiteren
      // Anbaus an CloudSync: es ist eine eigene Datenwelt mit eigenen Regeln.
      //
      // Warum ein Dokument JE WOCHE mit flachen Slot-Feldern ("mo_fr", "di_ab", …) und
      // nicht ein "plans"-Objekt wie im Kontodokument: In einer Gruppe schreiben mehrere
      // Leute gleichzeitig. Ein ganzes plans-Objekt zu setzen hiesse, dass der zweite
      // Push den ersten ueberschreibt (der Debounce betraegt 800 ms - abends plant ein
      // Paar genau gleichzeitig). Mit flachen Feldern und merge:true kollidieren nur noch
      // Schreibvorgaenge auf DENSELBEN Slot desselben Tages; dort ist "letzter gewinnt"
      // die erwartete Semantik. Und je Woche ein Dokument, damit pruneWeeks() eine
      // vergangene Woche wirklich loeschen kann, statt tote Felder anzuhaeufen.
      function groupDoc(gid) { return doc(db, "groups", gid); }
      window.CloudGroup = {
        enabled: true,
        create: function (gid, data) { return setDoc(groupDoc(gid), data); },
        fetch: function (gid) {
          return getDoc(groupDoc(gid)).then(function (s) { return s.exists() ? s.data() : null; });
        },
        watch: function (gid, cb) {
          return onSnapshot(groupDoc(gid), function (s) { if (s.exists()) cb(s.data(), s.metadata.hasPendingWrites); }, function () {});
        },
        // updateDoc statt setDoc(merge): scheitert laut, wenn die Gruppe nicht mehr da ist.
        setSettings: function (gid, settings) { return updateDoc(groupDoc(gid), { settings: settings }); },
        remove: function (gid) { return deleteDoc(groupDoc(gid)); },
        // Vollstaendiges Aufloesen: Gruppendokument + ALLE Mitglieder + ALLE Wochenplaene +
        // ALLE Meals in einem Batch. Firestore loescht Unterkollektionen NIE automatisch mit dem
        // Elterndokument - ohne dies blieben die Eintraege der uebrigen Mitglieder sowie Plaene/
        // Meals fuer immer als Karteileichen stehen (das widersprach Ziffer 10 der
        // Datenschutzerklaerung woertlich). Der eigene Mitglieder-Eintrag steckt bewusst MIT im
        // Batch statt separat geloescht zu werden: Firestore prueft Regeln fuer jede Operation
        // eines Batches gegen den Stand VOR dem Commit, die eigene Owner-Mitgliedschaft (die
        // isOwner() fuer alle anderen Loeschungen braucht) muss also beim Abschicken noch
        // bestehen, nicht erst danach geloescht werden.
        dissolve: function (gid, memberUids, planWeeks, recipeIds) {
          const batch = writeBatch(db);
          memberUids.forEach(function (uid) { batch.delete(doc(db, "groups", gid, "members", uid)); });
          planWeeks.forEach(function (wk) { batch.delete(doc(db, "groups", gid, "plans", wk)); });
          recipeIds.forEach(function (id) { batch.delete(doc(db, "groups", gid, "recipes", id)); });
          batch.delete(groupDoc(gid));
          return batch.commit();
        },

        // ----- Mitglieder: ein Dokument je Person, damit Rollenrechte pro Dokument gelten -----
        fetchMembers: function (gid) {
          return getDocs(collection(db, "groups", gid, "members")).then(function (snap) {
            return snap.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); });
          });
        },
        watchMembers: function (gid, cb) {
          return onSnapshot(collection(db, "groups", gid, "members"), function (snap) {
            cb(snap.docs.map(function (d) { return Object.assign({ uid: d.id }, d.data()); }));
          }, function () {});
        },
        putMember: function (gid, uid, data) { return setDoc(doc(db, "groups", gid, "members", uid), data, { merge: true }); },
        setRole: function (gid, uid, role) { return updateDoc(doc(db, "groups", gid, "members", uid), { role: role }); },
        removeMember: function (gid, uid) { return deleteDoc(doc(db, "groups", gid, "members", uid)); },

        // ----- Wochenplan -----
        loadPlans: function (gid) {
          return getDocs(collection(db, "groups", gid, "plans")).then(function (snap) {
            return snap.docs.map(function (d) { return { week: d.id, fields: d.data() }; });
          });
        },
        savePlanWeek: function (gid, week, patch) {
          return setDoc(doc(db, "groups", gid, "plans", week), patch, { merge: true });
        },
        deletePlanWeek: function (gid, week) { return deleteDoc(doc(db, "groups", gid, "plans", week)); },
        watchPlans: function (gid, cb) {
          return onSnapshot(collection(db, "groups", gid, "plans"), function (snap) {
            cb(snap.docChanges().map(function (c) {
              return { type: c.type, week: c.doc.id, fields: c.doc.data(), pending: c.doc.metadata.hasPendingWrites };
            }));
          }, function () {});
        },

        // ----- Einladungscodes -----
        // Gleiches Modell wie die Teilen-Links: der Code IST der Zugang (80 Bit aus
        // crypto.getRandomValues, siehe shareId()), und die Regel erlaubt ausdruecklich
        // nur "get" - waere "list" erlaubt, koennte jeder Angemeldete alle Codes und
        // damit alle Gruppen auflisten. Genau dieser Fehler steckte einmal in shared/.
        createInvite: function (code, data) { return setDoc(doc(db, "invites", code), data); },
        fetchInvite: function (code) {
          return getDoc(doc(db, "invites", code)).then(function (s) { return s.exists() ? s.data() : null; });
        },
        deleteInvite: function (code) { return deleteDoc(doc(db, "invites", code)); }
      };

      onAuthStateChanged(auth, function (user) {
        if (typeof window.__onCloudAuth === "function") window.__onCloudAuth(user);
      });
    } catch (e) {
      window.dispatchEvent(new CustomEvent("cloudauth:disabled"));
    }
  }
</script>

<script>
(function () {
  "use strict";

  const STORE_KEY = "wochenkueche_v1";
  // Ganz oben, weil sanitizeIng() (Zutaten-Einheiten) schon von load() gebraucht wird,
  // das selbst frueh im Script laeuft (state = load()). Eine const weiter unten im
  // Script waere zu diesem Zeitpunkt noch nicht initialisiert (Temporal Dead Zone) -
  // genau das brach die App fuer jeden Nutzer mit einer strukturierten Zutat.
  const ING_UNITS = ["g", "ml", "st", "el", "tl"];

  const DAYS = [
    { key: "mon", label: "Montag",     short: "Mo" },
    { key: "tue", label: "Dienstag",   short: "Di" },
    { key: "wed", label: "Mittwoch",   short: "Mi" },
    { key: "thu", label: "Donnerstag", short: "Do" },
    { key: "fri", label: "Freitag",    short: "Fr" },
    { key: "sat", label: "Samstag",    short: "Sa" },
    { key: "sun", label: "Sonntag",    short: "So" },
  ];
  const MEALS = [
    { key: "fr", label: "Frühstück"  },
    { key: "mi", label: "Mittagessen" },
    { key: "ab", label: "Abendessen"  },
  ];
  // Plausible Gewichtsgrenzen, gleiche Werte wie im Rechner (missingCalc). Stehen aus
  // demselben Grund hier oben wie ACTIVITY darunter: sanitizeWeights() braucht sie und
  // laeuft schon in `let state = load()`. Weiter unten deklariert waren sie dort in der
  // temporalen Todeszone — die App startete mit „Cannot access 'KG_MIN' before
  // initialization" und blieb mit leerem #view stehen.
  const KG_MIN = 30, KG_MAX = 400;
  // Koerperfettanteil in Prozent. Aus demselben TDZ-Grund hier oben: sanitizeBodyfat()
  // haengt daran und laeuft ueber computeGoal/sanitizeGoal ebenfalls schon in `load()`.
  // Die Spanne ist bewusst weit — sie soll nur Unsinn abfangen, nicht bewerten.
  const BF_MIN = 3, BF_MAX = 65;

  // ---------- Aktivitaet und Training (Stammdaten des Kalorienrechners) ----------
  // Stehen hier oben und nicht beim Rechner, weil sanitizeGoal() sie braucht und das
  // bereits in `let state = load()` laeuft — weiter unten waeren sie dort noch in der
  // temporalen Todeszone und die App wuerde beim Start sterben.
  //
  // Alltags- und Berufsbewegung OHNE Sport (PAL-Systematik nach DGE bzw. FAO/WHO/UNU).
  // Bewusste Abkehr von den frueheren Faktoren 1,2/1,375/1,55/1,725/1,9: die waren mit
  // dem Sport DRIN definiert ("3-5x/Woche"). Solange das Training nicht separat erfasst
  // wurde, war das richtig — jetzt wuerde es das Training doppelt zaehlen, einmal im
  // Faktor und einmal ueber die Trainingstage. PAL-Werte sind genau fuer den Fall
  // gemacht, dass Sport obendrauf kommt.
  // Wer hier Werte aendert, muss ACTIVITY_MIGRATE mitziehen.
  const ACTIVITY = [
    { key: "pal12", f: 1.2, label: "Kaum Bewegung",  hint: "fast nur sitzend/liegend" },
    { key: "pal14", f: 1.4, label: "Sitzend",        hint: "Büro, Auto, abends Sofa" },
    { key: "pal16", f: 1.6, label: "Sitzend + Wege", hint: "Büro, aber viel zu Fuß" },
    { key: "pal18", f: 1.8, label: "Stehend/gehend", hint: "Verkauf, Pflege, Gastro" },
    { key: "pal20", f: 2.0, label: "Körperlich",     hint: "Bau, Handwerk, Landwirtschaft" }
  ];
  // Alte, sportinklusive Schluessel auf die neue Alltags-Skala. Verlustfrei geht das nicht:
  // in "3-5x/Woche" steckte Sport, dessen Umfang wir nicht kennen. Deshalb konservativ nach
  // unten gemappt — der Sport kommt jetzt ueber die Trainingstage dazu. Laeuft still, weil
  // die App noch keinen Nutzerkreis hat; sollte sich das aendern, gehoert an dieser Stelle
  // ein Hinweis in den Rechner, dass die Einstufung einmal zu pruefen ist.
  const ACTIVITY_MIGRATE = { sed: "pal14", light: "pal14", mod: "pal14", high: "pal16", ext: "pal18" };
  function activityFactor(k) { const a = ACTIVITY.find(x => x.key === k); return a ? a.f : 1.4; }

  // Trainingsstufen. netMet ist bewusst der NETTO-Wert (MET − 1): die uebliche Formel
  // kcal = MET × kg × h liefert den Bruttoumsatz inklusive dessen, was der Koerper in
  // derselben Zeit ohnehin verbraucht haette. Dieser Ruheanteil steckt hier aber schon im
  // Alltagsbedarf (BMR × PAL) — ihn nochmal mitzurechnen waere der zweite Doppelzaehler
  // und wuerde die Einheit je nach Laenge um 40-120 kcal zu teuer machen.
  // MET-Werte nach dem Compendium of Physical Activities: Krafttraining allgemein 3,5,
  // kraeftig 5-6, intensive Einheiten/HIIT ~7.
  // Die Stufen folgen der ACSM-Einteilung light/moderate/vigorous; eingeordnet wird ueber
  // die Beispiele in `ex`, die dem Nutzer in der Trainingszeile angezeigt werden.
  //
  // WICHTIG bei `ex`: Laufen, Spinning und zuegiges Radfahren gehoeren zu „Intensiv",
  // auch lockeres Joggen. Ausdauersport liegt im Compendium systematisch hoeher als
  // Krafttraining (Joggen ~7 MET, Laufen 8 km/h ~8,3, Radfahren 19-22 km/h ~8,0), weil
  // Krafttraining viele Pausen enthaelt. Wer Laufen unter „Normal" einordnet, unterschaetzt
  // sich um rund 40 % — deshalb stehen diese Sportarten namentlich in der intensiven Zeile.
  // Die Beispiele sind damit nicht nur Illustration, sondern die eigentliche Definition.
  // Die Schluessel (light/mod/hard) bleiben unveraendert, damit gespeicherte Plaene gelten.
  const TRAIN_LEVELS = [
    { key: "light", label: "Locker",   met: 3.5, netMet: 2.5, defMin: 30,
      ex: "Spaziergang, gemütliches Radeln, Yoga, Mobility, Krafttraining mit langen Pausen" },
    { key: "mod",   label: "Normal",   met: 5.0, netMet: 4.0, defMin: 60,
      ex: "Normales Krafttraining, zügiges Wandern, ruhiges Schwimmen, Radfahren im Alltagstempo" },
    { key: "hard",  label: "Intensiv", met: 7.0, netMet: 6.0, defMin: 75,
      ex: "HIIT, Intervalle, Laufen (auch lockeres Joggen), schweres Krafttraining, Spinning" }
  ];
  const TRAIN_MIN_MIN = 10, TRAIN_MIN_MAX = 240;
  function trainLevel(k) { return TRAIN_LEVELS.find(x => x.key === k) || TRAIN_LEVELS[1]; }
  // Zusatzverbrauch einer Einheit in kcal: netto-MET × Koerpergewicht × Stunden.
  // Haengt am Gewicht — dieselbe Einheit sind bei 55 kg gut 220 kcal und bei 120 kg 480.
  // Deshalb gibt es hier auch keine festen kcal-Spannen je Stufe.
  function trainKcal(levelKey, minutes, weightKg) {
    const lv = trainLevel(levelKey);
    const min = Math.max(TRAIN_MIN_MIN, Math.min(TRAIN_MIN_MAX, +minutes || lv.defMin));
    return Math.round(lv.netMet * (+weightKg || 0) * (min / 60));
  }

  const CATEGORIES = ["Frühstück", "Hauptgericht", "Snack", "Dessert", "Beilage", "Getränk"];
  const CAT_CLASS = { "Frühstück": "cat-fr", "Hauptgericht": "cat-ha" };
  // Ein Hauptgericht passt in Mittag UND Abend -> Werte sind Listen, nicht ein Slot.
  const CAT_TO_MEAL = { "Frühstück": ["fr"], "Hauptgericht": ["mi", "ab"] };
  // Einmal-Migration: "Mittagessen"/"Abendessen" sind zu "Hauptgericht" verschmolzen.
  // Laeuft ueber sanitizeRecipe() und greift damit an JEDEM Eingang.
  const CAT_LEGACY = { "Mittagessen": "Hauptgericht", "Abendessen": "Hauptgericht" };
  function migrateCat(c) { return CAT_LEGACY[c] || c; }
  // Snack/Dessert/Beilage passen in jeden Slot; alles ohne bekannte Kategorie ebenfalls,
  // damit geteilte oder ältere Meals nie unplanbar werden.
  function catFitsMeal(cat, mealKey) {
    const bound = CAT_TO_MEAL[cat];
    return !bound || bound.indexOf(mealKey) !== -1;
  }
  // Vorschlagsrang im Picker: passt die Kategorie GENAU zu diesem Slot (nicht nur "erlaubt")?
  function catSuggestsMeal(cat, mealKey) { return (CAT_TO_MEAL[cat] || []).indexOf(mealKey) !== -1; }

  // Beispiel-Meals mit Fitness-/Abnehm-Fokus (viel Protein, realistische Portionen fuers
  // Meal-Prep) statt generischer Alltagsgerichte - passend zum Zielpublikum der App.
  const SEED = [
    { name: "Protein-Porridge mit Beeren", category: "Frühstück", portions: 1, time: 10,
      nutrition: { kcal: 530, carbs: 64, protein: 43, fat: 11 },
      ingredients: [
        { name: "Haferflocken", grams: 60 },
        { name: "Milch", grams: 250, unit: "ml" },
        { name: "Whey-Protein Vanille", grams: 30 },
        { name: "Beeren, gemischt", grams: 100 },
        "1 TL Chiasamen", "Prise Zimt"
      ],
      steps: "Haferflocken mit Milch aufkochen und 3–4 Min. bei milder Hitze quellen lassen. Vom Herd nehmen, Whey-Protein unterrühren. In eine Schale füllen, mit Beeren, Chiasamen und Zimt toppen." },
    { name: "Hähnchen mit Pute und Reis", category: "Hauptgericht", portions: 2, time: 30,
      nutrition: { kcal: 620, carbs: 55, protein: 55, fat: 16 },
      ingredients: [
        { name: "Hähnchenbrust", grams: 200 },
        { name: "Putenbrust", grams: 150 },
        { name: "Basmatireis", grams: 200 },
        { name: "Paprika", grams: 1, unit: "st" },
        { name: "Zucchini", grams: 1, unit: "st" },
        "1 EL Olivenöl", "Sojasauce", "Paprikapulver, Salz, Pfeffer"
      ],
      steps: "Reis nach Packungsangabe kochen. Hähnchen- und Putenbrust würfeln, würzen und in Olivenöl scharf anbraten. Paprika und Zucchini kurz mitbraten, mit Sojasauce ablöschen. Alles auf dem Reis anrichten." },
    { name: "Eiweißshake mit Whey und Milch", category: "Snack", portions: 1, time: 5,
      nutrition: { kcal: 350, carbs: 39, protein: 35, fat: 6 },
      ingredients: [
        { name: "Milch", grams: 300, unit: "ml" },
        { name: "Whey-Protein", grams: 30 },
        { name: "Banane", grams: 1, unit: "st" },
        "Eiswürfel"
      ],
      steps: "Milch, Whey-Protein, Banane und ein paar Eiswürfel in den Mixer geben und cremig mixen." },
    { name: "Rindersteak mit Ofenkartoffeln", category: "Hauptgericht", portions: 1, time: 35,
      nutrition: { kcal: 650, carbs: 62, protein: 56, fat: 20 },
      ingredients: [
        { name: "Rindersteak (Rumpsteak)", grams: 200 },
        { name: "Kartoffeln", grams: 300 },
        { name: "Brokkoli", grams: 150 },
        "1 EL Olivenöl", "Rosmarin, Salz, Pfeffer"
      ],
      steps: "Kartoffeln würfeln, mit Olivenöl und Rosmarin vermengen und im Ofen bei 200 °C ca. 25 Min. rösten. Steak salzen, pfeffern und in einer heißen Pfanne von jeder Seite 2–3 Min. braten, kurz ruhen lassen. Brokkoli dämpfen und alles zusammen anrichten." },
  ];

  // Erkennt die mitgelieferten Beispiel-Meals: gleicher Name UND unveränderte Zubereitung.
  // Sobald der Nutzer ein Beispiel bearbeitet, gilt es als sein eigenes (kein Badge mehr).
  function isExample(r) {
    if (!r || !r.name) return false;
    const key = r.name.trim().toLowerCase();
    const s = SEED.find(x => x.name.trim().toLowerCase() === key);
    return !!s && String(r.steps || "").trim() === String(s.steps || "").trim();
  }
  // IDs aller Meals, die im Wochenplan wirklich eingeplant sind.
  function planRecipeIds() {
    const ids = new Set();
    DAYS.forEach(d => MEALS.forEach(m => { asIdList(state.plan[d.key][m.key]).forEach(id => ids.add(id)); }));
    return ids;
  }

  // ---------- State ----------
  let state = load();

  function makeEmptyPlan() {
    const p = {};
    DAYS.forEach(d => { p[d.key] = { fr: [], mi: [], ab: [] }; });
    return p;
  }
  // Ein Slot ist eine Liste von Rezept-IDs. Alte Pläne speicherten eine
  // einzelne ID (oder null) – asIdList normalisiert beide Formen.
  function asIdList(v) { return Array.isArray(v) ? v.slice() : (v ? [v] : []); }

  // ---------- Wochen (aktuelle + naechste, an ISO-Kalenderwochen gebunden) ----------
  // Plaene liegen unter state.plans["YYYY-Www"]. "Aktuell" ist die ISO-Woche von heute,
  // "Naechste" die von heute + 7 Tagen — dadurch rueckt am Montag alles automatisch weiter,
  // ganz ohne Rotationslogik. Verfallene (aeltere) Wochen entfernt pruneWeeks.
  function isoWeekKey(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7;                 // Mo=1 … So=7
    d.setUTCDate(d.getUTCDate() + 4 - day);         // Donnerstag der Woche (ISO-8601)
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((d - yearStart) / 864e5) + 1) / 7);
    return d.getUTCFullYear() + "-W" + String(week).padStart(2, "0");
  }
  function weekKeyFor(which) {
    const b = new Date();
    if (which === "next") b.setDate(b.getDate() + 7);
    return isoWeekKey(b);
  }
  function activeWeekKey() { return weekKeyFor(state.viewWeek === "next" ? "next" : "cur"); }
  // Nur aktuelle + naechste Woche behalten; alles Aeltere/Fremde verfaellt. Paket C1: bevor
  // eine VERGANGENE Woche verworfen wird, werden ihre Kennzahlen (Schnitt-kcal, geplante Tage,
  // Ziel-Treffer) fuer den Rueckblick archiviert. Nur zur Laufzeit aufrufen (archiveWeek greift
  // auf state zu) — load() ruft pruneWeeks daher NICHT mehr, sondern boot() nach dem State-Aufbau.
  function pruneWeeks(plans) {
    const cur = weekKeyFor("cur");
    const keep = {}; keep[cur] = 1; keep[weekKeyFor("next")] = 1;
    Object.keys(plans).forEach(k => {
      if (keep[k]) return;
      if (k < cur) archiveWeek(k, plans[k]);   // vergangene Woche als Kennzahlen sichern
      delete plans[k];
    });
    return plans;
  }
  // Kennzahlen einer abgelaufenen Woche fuer den Rueckblick festhalten. Bewusst NUR Summen/
  // Zahlen, keine Meal-Referenzen — winzig, kein Foto-Ballast. Ziel-Treffer = Tag geplant UND
  // Tageskalorien innerhalb +/-10 % des (heutigen) Tagesziels. Ohne Ziel keine Treffer-Quote.
  function archiveWeek(wk, pl) {
    if (!pl || !state.goal) return;
    let sum = 0, days = 0, hit = 0;
    DAYS.forEach(d => {
      const n = dayNutOf(pl, d.key);
      if (!hasNut(n)) return;
      days++; sum += n.kcal;
      const t = goalTargetsForDay(d.key);
      if (t && t.kcal && Math.abs(n.kcal - t.kcal) <= t.kcal * 0.1) hit++;
    });
    if (!days) return;                          // leere Woche hat keinen Rueckblick-Wert
    if (!state.weekStats) state.weekStats = {};
    state.weekStats[wk] = { kcal: Math.round(sum / days), days: days, hit: hit };
  }
  // Archiv saeubern: nur gueltige "YYYY-Www"-Eintraege, geklemmte Werte, hoechstens die letzten
  // 26 Wochen (halbes Jahr) — das Archiv soll nicht endlos wachsen.
  function sanitizeWeekStats(o) {
    const out = {};
    if (!o || typeof o !== "object") return out;
    Object.keys(o).forEach(k => {
      if (!/^\d{4}-W\d{2}$/.test(k)) return;
      const s = o[k]; if (!s || typeof s !== "object") return;
      const days = Math.max(0, Math.min(7, Math.round(Number(s.days) || 0)));
      if (!days) return;
      out[k] = { kcal: Math.max(0, Math.round(Number(s.kcal) || 0)), days: days, hit: Math.max(0, Math.min(days, Math.round(Number(s.hit) || 0))) };
    });
    const trimmed = {};
    Object.keys(out).sort().slice(-26).forEach(k => { trimmed[k] = out[k]; });
    return trimmed;
  }
  // Aktive Woche als Referenz spiegeln, damit alle bestehenden state.plan[..]-Zugriffe gelten.
  function setViewWeek(which) {
    state.viewWeek = which === "next" ? "next" : "cur";
    const key = activeWeekKey();
    if (!state.plans[key]) state.plans[key] = makeEmptyPlan();
    state.plan = state.plans[key];
  }

  // Trainingsplan auf gueltige Wochentage eindampfen: fremde Schluessel raus, Stufe auf

  // Bewusst eine `function` und keine `const`-Arrow — load() laeuft frueh, eine spaeter
  // deklarierte Konstante waere dort noch in der temporalen Todeszone und wuerde die
  // ganze App beim Start killen.
  function sanitizeTraining(t) {
    const out = {};

    // Zwischenstand-Format: ["mon","wed"] ohne Stufe/Dauer. Kam aus der ersten Fassung
    // der Trainingstage (nie veroeffentlicht, aber lokal getestet) — auf die Standard-
    // stufe heben, statt die Auswahl des Nutzers wegzuwerfen.
    if (Array.isArray(t)) {
      DAYS.forEach(d => { if (t.indexOf(d.key) !== -1) out[d.key] = { level: "mod", min: 60 }; });
      return out;
    }
    DAYS.forEach(d => {
      const e = t[d.key];
      if (!e || typeof e !== "object") return;
      const lv = TRAIN_LEVELS.some(x => x.key === e.level) ? e.level : "mod";
      const min = Math.max(TRAIN_MIN_MIN, Math.min(TRAIN_MIN_MAX, Math.round(+e.min) || trainLevel(lv).defMin));
      out[d.key] = { level: lv, min: min };

  }
  function trainingKeys(t) { return DAYS.filter(d => t && t[d.key]).map(d => d.key); }

  // Jedes von aussen kommende Ziel laeuft hier durch (localStorage, Cloud, Import).
  // Zwei Migrationen stecken hier drin, beide unvermeidlich:
  //  1. trainingDays (Liste) -> training (Objekt mit Stufe und Dauer)
  //  2. sportinklusive Aktivitaetsschluessel -> reine Alltags-PAL-Skala
  // (2) laeuft still, ohne Hinweis an den Nutzer: die App hat noch keinen Nutzerkreis,
  // dessen alte Einstufung man erklaeren muesste. Die Zuordnung selbst muss aber bleiben —
  // ein Schluessel wie "mod" haette in der neuen Skala sonst gar keinen gueltigen Faktor.
  function sanitizeGoal(g) {
    if (!g || typeof g !== "object") return null;
    const out = Object.assign({}, g);
    out.training = sanitizeTraining(g.training != null ? g.training : g.trainingDays);
    delete out.trainingDays;

    else if (!ACTIVITY.some(a => a.key === out.activity)) out.activity = "pal14";
    // Ziele aus der Zeit vor dem KFA haben das Feld gar nicht, beschaedigte koennten
    // Unsinn tragen. Beides wird hier zu null — dann rechnet computeGoal wie frueher
    // nach Mifflin weiter, statt mit einer kaputten fettfreien Masse.
    out.bodyfat = sanitizeBodyfat(out.bodyfat);
    return out;
  }

  // ---------- Gewichtsverlauf ----------
  // KG_MIN/KG_MAX stehen weiter oben bei den Stammdaten — siehe Begruendung dort.
  //
  // Ein Eintrag je MONAT, nicht je Tag. Ueber ein Jahr betrachtet sagt der Tag nichts:
  // Tagesschwankungen (Wasser, Mahlzeiten) liegen in derselben Groessenordnung wie die
  // echte Veraenderung eines Monats. Monatsgenau macht die Eingabe kuerzer und das
  // Diagramm ehrlicher.
  //
  // Monat IMMER lokal bilden, nie ueber toISOString(): das rechnet nach UTC um und
  // kippt in unserer Zeitzone am Monatsersten kurz nach Mitternacht in den Vormonat.
  function monthKey(dt) {
    const d = dt || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function validMonthKey(s) {
    if (typeof s !== "string" || !/^\d{4}-\d{2}$/.test(s)) return false;
    const m = +s.slice(5, 7);
    return m >= 1 && m <= 12;
  }
  function monthIdx(s) { return +s.slice(5, 7) - 1; }

  // Bewusst `function` und keine const-Arrow: laeuft aus load() heraus, also bevor die
  // meisten Konstanten deklariert sind (gleiche TDZ-Falle wie bei sanitizeTraining).
  // Ein Monat = ein Eintrag; der letzte gewinnt. Aufsteigend sortiert, damit alles
  // Weitere (Diagramm, "juengste Messung") sich darauf verlassen kann.
  function sanitizeWeights(w) {
    if (!Array.isArray(w)) return [];
    const map = {};
    w.forEach(e => {
      if (!e || typeof e !== "object") return;
      // Migration: die erste Fassung speicherte taggenau unter `d` ("2026-07-22").
      // Auf den Monat eindampfen statt wegzuwerfen - innerhalb eines Monats gewinnt
      // der zuletzt einsortierte Wert.
      let m = e.m;
      if (!m && typeof e.d === "string" && e.d.length >= 7) m = e.d.slice(0, 7);
      if (!validMonthKey(m)) return;
      const kg = Math.round((parseFloat(e.kg) || 0) * 10) / 10;
      if (!(kg >= KG_MIN && kg <= KG_MAX)) return;
      map[m] = { m: m, kg: kg };
    });
    return Object.keys(map).sort().map(k => map[k]);
  }
  // Zusammenfuehren zweier Verlaeufe (Cloud + lokal): Union ueber den Monat, nie eine
  // Messung verlieren, die nur auf einem Geraet steht - wie bei den Rezepten in
  // startCloudSync und in der Absicht von unionIds bei den Teilen-Links. Bei gleichem
  // Monat gewinnt `prim` (dort steht beim Sync die Cloud).

    sanitizeWeights(sec).forEach(e => { map[e.m] = e; });
    sanitizeWeights(prim).forEach(e => { map[e.m] = e; });
    return Object.keys(map).sort().map(k => map[k]);
  }
  // Jahres-Zielgewicht, je Jahr eines: { "2026": 75 }. Fremde Schluessel fliegen raus.
  function sanitizeWeightGoals(g) {
    const out = {};
    if (!g || typeof g !== "object") return out;
    Object.keys(g).forEach(y => {
      if (!/^\d{4}$/.test(y)) return;
      const kg = Math.round((parseFloat(g[y]) || 0) * 10) / 10;
      if (kg >= KG_MIN && kg <= KG_MAX) out[y] = kg;
    });

  }

  // erklaerung): { given: bool, at: ISOString|null }. `at` ist die letzte Entscheidung -
  // damit ein Widerruf auf Geraet A eine aeltere Zustimmung auf Geraet B beim Sync ueberstimmt.
  // Funktion statt const: load() laeuft schon in `let state = load()` frueh im Script

  // Totzone. Eine Funktionsdeklaration wird dagegen komplett gehoistet.

  // Personenanzahl der Einkaufsliste. Obergrenze 12 ist kein Geschmack, sondern ein Riegel:
  // die Zahl multipliziert jede Menge, ein verrutschter Wert liesse die Liste sinnlos werden.
  function sanitizeShopPersons(v) { const n = Math.round(nutNum(v)); return n >= 1 && n <= 12 ? n : 1; }
  // Einzige Quelle der Personenzahl - save(), dataJSON() und die Einkaufsliste fragen alle
  // hier. Laeuft sehr frueh (save() kann vor dem ersten render() feuern), deshalb defensiv
  // gegen ein state, das das Feld noch nicht traegt.
  // Steht "Einkauf für alle rechnen" in der Gruppe, gibt die Mitgliederzahl den Takt vor -
  // sonst kauft man fuer eine Person ein und kocht fuer zwei. Eine von Hand gesetzte Zahl
  // gewinnt trotzdem: Besuch, Meal-Prep oder ein Mitglied, das nicht mitisst.
  function shopPersons() {
    const own = sanitizeShopPersons(state && state.shopPersons);
    if (own > 1) return own;
    if (syncGid && groupSetting("shopForAll") && groupMembers.length > 1) return sanitizeShopPersons(groupMembers.length);
    return own;
  }

  // Favoriten sind persoenlich (Konto-Dokument, nie Gruppe). Deduplizieren UND sortieren:
  // dataJSON() vergleicht JSON-Strings; eine andere Reihenfolge auf zwei Geraeten laege sonst
  // dauerhaft quer -> jeder Snapshot galte als Aenderung (Endlos-Push).
  function sanitizeFavs(v) {
    return Array.isArray(v) ? Array.from(new Set(v.filter(x => typeof x === "string" && x))).sort() : [];
  }
  function isFav(id) { return (state.favs || []).indexOf(id) !== -1; }

  // ---------- Grabsteine geloeschter Meals ----------
  // Der Zusammenfuehr-Schritt beim Anmelden (mergeRemoteRecipes) kann von sich aus nicht
  // unterscheiden, ob ein nur lokal vorhandenes Meal NEU ist (noch nicht hochgeladen) oder
  // auf einem anderen Geraet GELOESCHT wurde - er entschied sich immer fuers Behalten.
  // Geloeschte Meals kamen dadurch beim naechsten Login zurueck und wurden von dort sogar
  // wieder in die Cloud geschrieben (also auch auf das Geraet, auf dem geloescht wurde).
  // Deshalb merkt sich jedes Loeschen die ID mit Zeitpunkt (state.deleted: id -> ms). Der
  // Eintrag reist im Kontodokument mit und heilt beide Richtungen: er haelt lokale Leichen
  // aus dem Merge heraus UND loescht in der Cloud nach, was ein abgebrochener Push (Tab zu,
  // Abmelden innerhalb der 800-ms-Sperre, offline) dort stehen liess.
  function sanitizeTombstones(v) {

    // ruft von dort hierher - eine const auf Modulebene waere zu dem Zeitpunkt noch in der
    // TDZ und riss die ganze App mit ("Cannot access 'TOMB_TTL' before initialization").
    const TOMB_TTL = 90 * 24 * 3600 * 1000;   // danach ist jedes Geraet laengst nachgezogen
    const out = {};

    // vergleicht lokalen und entfernten Stand als String, und Firestore gibt die Felder in
    // beliebiger Reihenfolge zurueck. Ohne die Sortierung gaelte jeder Snapshot als Aenderung

    Object.keys(v).sort().forEach(id => {

      const t = Number(v[id]);

    return out;
  }
  function isDeleted(id) { return !!(state.deleted && state.deleted[id]); }
  // In der Gruppe ist die Gruppe die Wahrheit: enterGroupSync ERSETZT den Bestand, es gibt
  // dort gar keinen Union-Merge und damit auch nichts zu heilen. Ein persoenlicher Grabstein
  // wuerde nur spaeter, nach einem Austritt, das gleichnamige eigene Meal mitreissen.
  function markDeleted(ids) {
    if (syncGid) return;
    if (!state.deleted) state.deleted = {};
    const now = Date.now();
    ids.forEach(id => { state.deleted[id] = now; });
  }
  function unmarkDeleted(ids) {
    if (!state.deleted) return;
    ids.forEach(id => { delete state.deleted[id]; });
  }

  function load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { data = null; }
    const curKey = weekKeyFor("cur");
    if (!data || !Array.isArray(data.recipes)) {
      const recipes = SEED.map(r => Object.assign({ id: uid() }, r));
      const plans = {}; plans[curKey] = makeEmptyPlan();
      return { recipes, plans, plan: plans[curKey], viewWeek: "cur", viewYear: new Date().getFullYear(), tab: "home", goal: null, shares: [], onboarded: false, weights: [], weightGoals: {}, weekStats: {}, profileImage: null, weightConsent: noConsent(), shopPersons: 1, groupId: "", inviteCodes: [], favs: [], deleted: {} };
    }
    const recipes = sanitizeRecipes(data.recipes);
    const plans = {};
    if (data.plans && typeof data.plans === "object") {                 // neues Format
      Object.keys(data.plans).forEach(k => { plans[k] = normalizePlan(data.plans[k], recipes); });
    } else if (data.plan) {                                             // Migration: alter Einzelplan
      plans[curKey] = normalizePlan(data.plan, recipes);
    }
    // Alte Wochen NICHT hier beschneiden: pruneWeeks archiviert seit Paket C1 vergangene Wochen
    // und braucht dafuer state (Ziel, Rezepte). Das laeuft noch nicht — state = load() ist gerade
    // erst am Entstehen. boot() ruft pruneWeeks(state.plans) direkt nach dem State-Aufbau nach.
    if (!plans[curKey]) plans[curKey] = makeEmptyPlan();
    return { recipes, plans, plan: plans[curKey], viewWeek: "cur", viewYear: new Date().getFullYear(), tab: data.tab === "recipes" ? "recipes" : "home", goal: sanitizeGoal(data.goal), shares: Array.isArray(data.shares) ? data.shares : [], onboarded: data.onboarded === true, weights: sanitizeWeights(data.weights), weightGoals: sanitizeWeightGoals(data.weightGoals), weekStats: sanitizeWeekStats(data.weekStats), profileImage: typeof data.profileImage === "string" ? data.profileImage : null, weightConsent: sanitizeConsent(data.weightConsent), shopPersons: sanitizeShopPersons(data.shopPersons), groupId: typeof data.groupId === "string" ? data.groupId : "", inviteCodes: Array.isArray(data.inviteCodes) ? data.inviteCodes : [], favs: sanitizeFavs(data.favs), deleted: sanitizeTombstones(data.deleted) };
  }

  // Schlaegt das lokale Speichern fehl (Speicher voll, privater Modus), darf das NICHT
  // stillschweigend passieren: der Nutzer legt sonst weiter Meals an, die beim naechsten
  // Laden alle weg sind. Einmalig warnen statt bei jedem Tastendruck.
  let storageFullWarned = false;
  function save() {
    try {
      // Paket A3: Meal-Fotos (r.image) und das Profilbild NICHT mehr ins localStorage-JSON -
      // sie liegen in IndexedDB (persistImagesNow). Hier bleibt nur Text/IDs, das war der
      // Engpass fuer "Speicher voll". state (RAM) und Firestore tragen die Bilder weiter.
      // ABER nur wenn IDB verfuegbar ist (idbOK): faellt es aus (privater Modus, blockiert),
      // bleiben die Bilder wie frueher im localStorage, sonst gingen sie beim Neuladen verloren.
      const recipesForLS = idbOK
        ? state.recipes.map(r => { const c = Object.assign({}, r); delete c.image; return c; })
        : state.recipes;
      localStorage.setItem(STORE_KEY, JSON.stringify({ recipes: recipesForLS, plans: state.plans, tab: state.tab, goal: state.goal || null, shares: state.shares || [], onboarded: state.onboarded === true, weights: state.weights || [], weightGoals: state.weightGoals || {}, weekStats: state.weekStats || {}, profileImage: idbOK ? null : (state.profileImage || null), weightConsent: state.weightConsent || noConsent(), shopPersons: shopPersons(), groupId: state.groupId || "", inviteCodes: state.inviteCodes || [], favs: state.favs || [], deleted: sanitizeTombstones(state.deleted) }));
      storageFullWarned = false;
    } catch (e) {
      if (!storageFullWarned) {
        storageFullWarned = true;
        toast(syncUid
          ? "Der Speicher dieses Geräts ist voll – deine Änderungen liegen nur noch in der Cloud. Entferne ein paar Meal-Fotos."
          : "Der Speicher dieses Geräts ist voll – neue Änderungen gehen beim Neuladen verloren. Entferne ein paar Meal-Fotos.");
      }
    }
    if (idbOK) persistImagesNow();   // Bilder nach IndexedDB (Meal-Fotos + Profilbild)
    scheduleCloudPush();
  }

  // ---------- Bilder in IndexedDB (Paket A3) ----------
  // Meal-Fotos (r.image) und das Profilbild sind Data-URLs und waren frueher Teil des
  // localStorage-JSON — genau der Engpass, an dem "Speicher voll" auftrat. Sie liegen jetzt
  // in IndexedDB (Store "images", Schluessel = Rezept-ID bzw. "__profile__"). In-Memory (state)
  // und Cloud (Firestore-Rezeptdokumente) tragen ihr Bild unveraendert weiter — nur der lokale
  // Persistenzpfad aendert sich. Faellt IDB aus (privater Modus o.ae.), bleiben Bilder in RAM
  // und (bei Cloud-Konten) in Firestore; die App bricht nie deswegen.
  let idbP = null, idbOK = false, imagesHydrated = false, imagesReady = Promise.resolve();
  let imgSaved = new Map();  // key -> Kurz-Signatur des zuletzt geschriebenen Bildes
  function idbOpen() {
    if (idbP) return idbP;
    idbP = new Promise((res, rej) => {
      let req; try { req = indexedDB.open("mealplan-media", 1); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains("images")) db.createObjectStore("images"); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
    return idbP;
  }
  function idbRW(fn) {
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction("images", "readwrite");
      fn(tx.objectStore("images"));
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    }));
  }
  function idbGetAllImages() {
    return idbOpen().then(db => new Promise((res, rej) => {
      const out = {}; const cur = db.transaction("images", "readonly").objectStore("images").openCursor();
      cur.onsuccess = e => { const c = e.target.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      cur.onerror = () => rej(cur.error);
    }));
  }
  function imgSig(u) { return u ? (u.length + "|" + u.slice(0, 24) + u.slice(-12)) : ""; }
  // Schreibt geaenderte Bilder nach IDB und loescht verwaiste (entferntes Meal / Profilbild weg).
  // Diff ueber imgSaved, damit unveraenderte (grosse) Blobs nicht bei jedem save neu geschrieben
  // werden. Nicht debounced: ein Foto-Wechsel ist eine bewusste Einzelaktion, kein Dauerfeuer.
  function persistImagesNow() {
    const wanted = new Map();
    state.recipes.forEach(r => { if (r && r.id && r.image) wanted.set(r.id, r.image); });
    if (state.profileImage) wanted.set("__profile__", state.profileImage);
    const puts = [], dels = [];
    wanted.forEach((v, k) => { if (imgSaved.get(k) !== imgSig(v)) puts.push([k, v]); });
    imgSaved.forEach((_, k) => { if (!wanted.has(k)) dels.push(k); });
    if (!puts.length && !dels.length) return Promise.resolve();
    return idbRW(store => { puts.forEach(([k, v]) => store.put(v, k)); dels.forEach(k => store.delete(k)); })
      .then(() => { puts.forEach(([k, v]) => imgSaved.set(k, imgSig(v))); dels.forEach(k => imgSaved.delete(k)); })
      .catch(() => {});
  }
  // Beim Start: Bilder aus IDB in den State ziehen (Karten zeigen bis dahin den photoFor-Fallback,
  // der immer ein Bild liefert), Alt-Konten mit Inline-Bildern im localStorage einmalig nach IDB
  // migrieren und das JSON schlank machen. Laeuft in boot() VOR Auth/Sync/Render (imagesReady),
  // damit kein Cloud-Push bildlose Rezepte hochschreibt.
  async function hydrateImages() {
    let map = {};
    // Timeout gegen ein IDB, das weder aufloest noch ablehnt (z.B. file://): die App muss
    // starten koennen. Faellt IDB aus, bleibt idbOK=false -> save() behaelt Bilder im
    // localStorage wie frueher (kein Datenverlust, nur der Speicher-Engpass bleibt bestehen).
    try {
      map = await Promise.race([
        idbGetAllImages(),
        new Promise((_, rej) => setTimeout(() => rej(new Error("idb-timeout")), 4000))
      ]);

    } catch (e) { idbOK = false; map = {}; }
    imagesHydrated = true;
    if (!idbOK) return;   // ohne IDB: nichts hydrieren/migrieren, alter localStorage-Pfad gilt
    state.recipes.forEach(r => { if (r && r.id && !r.image && map[r.id]) r.image = map[r.id]; });
    if (!state.profileImage && map.__profile__) state.profileImage = map.__profile__;
    // Baseline: was aus IDB kam, gilt als bereits gespeichert.
    imgSaved = new Map(Object.keys(map).map(k => [k, imgSig(map[k])]));

    // DANN das localStorage-JSON schlank speichern (Reihenfolge gegen Datenverlust).
    try { await persistImagesNow(); } catch (e) {}

  let syncUid = null, syncUnsub = null, syncUnsubRecipes = null, pushTimer = null,

  // Ist syncGid gesetzt, kommen Wochenplan UND Meals aus der Gruppe statt aus dem eigenen

  let syncGid = null, groupInfo = null, groupMembers = [], myRole = null,

  // Deklaration erst bei openGroupModal() waere fuer closeModal() eine temporale Todeszone.

  function recipeBase() { return syncGid ? ["groups", syncGid] : ["users", syncUid]; }
  // Rolle in der aktiven Gruppe: "owner" | "edit" | "view" | null (= keine Gruppe).
  function groupRole() { return syncGid ? myRole : null; }
  // Ohne Gruppe darf man immer alles - die Sperre gilt nur fuer Nur-Ansehen-Mitglieder.
  function canEdit() { return groupRole() !== "view"; }
