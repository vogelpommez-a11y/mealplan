      img.onload = () => {
        const natW = img.naturalWidth, natH = img.naturalHeight;
        const minScale = STAGE / Math.min(natW, natH);
        const maxScale = minScale * 3;
        let scale = minScale, tx = 0, ty = 0;
        const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Profilbild zuschneiden">
          <div class="modal-head"><h3>Profilbild zuschneiden</h3><button class="btn ghost sm" data-close>✕</button></div>
          <div class="modal-body">
            <div class="crop-stage"><img alt="" draggable="false"><div class="crop-guide"></div></div>
            <div class="crop-zoom">
              <button type="button" class="btn ghost icon-gh" data-zoom-out title="Verkleinern" aria-label="Verkleinern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
              <button type="button" class="btn ghost icon-gh" data-zoom-in title="Vergrößern" aria-label="Vergrößern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
          </div>
          <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" data-ok>Übernehmen</button></div>
        </div>`);
        const stage = node.querySelector(".crop-stage");
        const imgEl = stage.querySelector("img");
        imgEl.src = e.target.result;
        function clampPan() {
          const dispW = natW * scale, dispH = natH * scale;
          const maxX = Math.max(0, (dispW - STAGE) / 2);
          const maxY = Math.max(0, (dispH - STAGE) / 2);
          tx = Math.min(maxX, Math.max(-maxX, tx));
          ty = Math.min(maxY, Math.max(-maxY, ty));
        }
        // Waehrend des Ziehens: sanfter Widerstand ueber den Rand hinaus statt hartem
        // Stopp (Skill-Regel "friction over hard stops"). clampPan() bleibt der harte
        // Clamp fuer Zoom/Initialwerte und fuer den Snap-back beim Loslassen.
        function dampPan() {
          const dispW = natW * scale, dispH = natH * scale;
          const maxX = Math.max(0, (dispW - STAGE) / 2);
          const maxY = Math.max(0, (dispH - STAGE) / 2);
          const damp = (v, max) => {
            if (v >= -max && v <= max) return v;
            const over = v > max ? v - max : v + max;
            return (v > max ? max : -max) + over * 0.35;
          };
          tx = damp(tx, maxX);
          ty = damp(ty, maxY);
        }
        function paint() {
          const dispW = natW * scale, dispH = natH * scale;
          imgEl.style.width = dispW + "px"; imgEl.style.height = dispH + "px";
          imgEl.style.transform = `translate(${STAGE / 2 - dispW / 2 + tx}px, ${STAGE / 2 - dispH / 2 + ty}px)`;
        }
        clampPan(); paint();
        let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
        stage.addEventListener("pointerdown", e => {
          dragging = true; stage.classList.add("dragging");
          dragStartX = e.clientX; dragStartY = e.clientY; panStartX = tx; panStartY = ty;
          stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener("pointermove", e => {
          if (!dragging) return;
          tx = panStartX + (e.clientX - dragStartX);
          ty = panStartY + (e.clientY - dragStartY);
          dampPan(); paint();
        });
        function endDrag() {
          dragging = false; stage.classList.remove("dragging");
          clampPan();
          imgEl.style.transition = "transform 200ms var(--ease-out, ease-out)";
          paint();
          setTimeout(() => { imgEl.style.transition = ""; }, 220);
        }
        stage.addEventListener("pointerup", endDrag);
        stage.addEventListener("pointercancel", endDrag);
        function zoom(factor) {
          scale = Math.min(maxScale, Math.max(minScale, scale * factor));
          clampPan(); paint();
        }
        node.querySelector("[data-zoom-in]").addEventListener("click", () => zoom(1.2));
        node.querySelector("[data-zoom-out]").addEventListener("click", () => zoom(1 / 1.2));
        node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
        node.querySelector("[data-ok]").addEventListener("click", () => {
          const c = document.createElement("canvas"); c.width = OUT; c.height = OUT;
          const ctx = c.getContext("2d");
          const exportScale = OUT / STAGE;
          const dispW = natW * scale, dispH = natH * scale;
          const left = STAGE / 2 - dispW / 2 + tx, top = STAGE / 2 - dispH / 2 + ty;
          ctx.drawImage(img, 0, 0, natW, natH, left * exportScale, top * exportScale, dispW * exportScale, dispH * exportScale);
          let dataUrl = null;
          try { dataUrl = c.toDataURL("image/jpeg", 0.85); } catch (err) { dataUrl = null; }
          closeModal();
          onDone(dataUrl);
        });
        openModal(node);
      };
      img.onerror = () => toast("Bild konnte nicht geladen werden");
      img.src = e.target.result;
    };
    reader.onerror = () => toast("Bild konnte nicht geladen werden");
    reader.readAsDataURL(file);
  }

  function signOut() {
    confirmModal({
      title: "Abmelden?",
      text: "Dein Plan und deine Meals bleiben auf diesem Gerät gespeichert. Du kannst dich jederzeit wieder anmelden.",
      okLabel: "Abmelden",
      onConfirm: () => {
        if (authMode === "cloud" && window.CloudAuth && window.CloudAuth.logout) {
          cloudMode = "login";
          // Einen noch ausstehenden Push (800-ms-Sperre in scheduleCloudPush) vorher
          // abschliessen: stopCloudSync() wirft ihn sonst per clearTimeout weg, und eine
          // gerade geloeschte Sache bliebe in der Cloud stehen. Nach 2 s trotzdem weiter,
          // damit ein schlechtes Netz das Abmelden nicht blockiert - die Grabsteine holen
          // die Loeschung beim naechsten Anmelden ohnehin nach.
          Promise.race([
            pushNow().catch((e) => noteError("sync:finalPushBeforeSignOut", e)),
            new Promise(res => setTimeout(res, 2000))
          ]).then(() => {
            stopCloudSync();
            window.CloudAuth.logout().catch((e) => noteError("auth:logoutOnSignOut", e));
          });
          // onAuthStateChanged rendert danach die Anmeldung
        } else {
          profile = null; saveProfile(); renderAuthLocal();
        }
      }
    });
  }

  // Alles, was dieses Geraet ueber den Nutzer lokal gespeichert hat, entfernen –
  // gemeinsame Endstrecke fuer beide Loesch-Wege (Cloud-Konto und lokales Profil).
  // Die Meal-Fotos und das Profilbild liegen seit Paket A3 NICHT mehr im localStorage, sondern
  // in IndexedDB - sie ueberlebten das Loeschen deshalb stillschweigend. Besonders heikel war
  // das Profilbild: hydrateImages() zieht map.__profile__ nach dem Neustart wieder in den State
  // ("if (!state.profileImage && map.__profile__)"), ein direkt danach neu registriertes Konto
  // haette es also erneut in die Cloud geschrieben. Die Meal-Fotos blieben zwar unverknuepft
  // (ihre IDs sind mit dem State weg), aber eben auf dem Geraet liegen.
  //
  // store.clear() statt indexedDB.deleteDatabase(): eine gewoehnliche Transaktion, die nie
  // blockiert. deleteDatabase wartet dagegen auf das Schliessen JEDER offenen Verbindung -
  // idbOpen() haelt genau so eine - und bliebe sonst still in onblocked haengen.
  // Kann seit dem Firestore-Offline-Cache erstmals fehlschlagen (wipeCache() unten wirft
  // statt still zu bleiben) - alle Aufrufer brauchen deshalb ein eigenes try/catch, das eine
  // ehrliche Meldung statt "geloescht" zeigt und NICHT neu laedt.
  async function wipeLocalData() {
    [STORE_KEY, PROFILE_KEY, LAST_KEY, SHOP_DONE_KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) { noteError("store:wipeLocal", e); } });
    imgSaved = new Map();   // Baseline mitleeren, sonst gilt ein spaeter gleich benanntes Bild als schon gespeichert
    try { await idbRW(store => store.clear()); } catch (e) { noteError("store:wipeImages", e); }
    // Zuletzt: nach terminate() ist die Firestore-Instanz tot, die vorigen Schritte muessen
    // also zuerst durch. Kein leeres catch - der Fehler propagiert bewusst an die Aufrufer.
    if (window.CloudSync && window.CloudSync.wipeCache) await window.CloudSync.wipeCache();
  }

  // Konto vollstaendig loeschen (Cloud-Konten, Art. 17 DSGVO / Datenschutz Ziffer 10).
  // Loescht zusaetzlich alle bekannten Teilen-Links, damit kein Snapshot verwaist zurueckbleibt.
  function deleteAccountFlow() {
    // Als Inhaber einer Gruppe erst eine Entscheidung erzwingen: bliebe die Gruppe ohne
    // Inhaber zurueck, koennte niemand mehr Rollen vergeben oder sie aufloesen - und die
    // Zusage aus Ziffer 10 der Datenschutzerklaerung waere nicht mehr wahr.
    if (syncGid && groupRole() === "owner") {
      const others = groupMembers.filter(m => m.uid !== syncUid).length;
      confirmModal({
        title: "Erst die Gruppe auflösen",
        text: others
          ? `Du bist Inhaber eurer Gruppe mit ${others} weiteren ${others === 1 ? "Person" : "Personen"}. Löse sie zuerst auf oder übergib sie – danach kannst du dein Konto löschen.`
          : "Du bist Inhaber einer Gruppe. Löse sie zuerst auf – danach kannst du dein Konto löschen.",
        okLabel: "Zur Gruppe",
        onConfirm: () => openGroupModal()
      });
      return;
    }
    // Dieselbe Zusage gilt schon fuer eine erst VORBEREITETE Gruppe (Wartezustand): syncGid
    // ist dort noch leer, aber in Firestore steht bereits groups/{gid} mit dem eigenen
    // Mitgliedseintrag - ohne diesen Zweig bliebe sie beim Loeschen als Karteileiche zurueck,
    // niemand koennte sie je wieder aufloesen.
    if (state.pendingGroupId) {
      confirmModal({
        title: "Erst die Einladung zurückziehen",
        text: "Du hast gerade eine Einladung zu „Gemeinsam planen“ offen. Zieh sie zuerst zurück – danach kannst du dein Konto löschen.",
        okLabel: "Zur Einladung",
        onConfirm: () => openGroupModal()
      });
      return;
    }
    const user = (window.CloudAuth && window.CloudAuth.current) ? window.CloudAuth.current() : null;
    const pid = user && user.providerData[0] ? user.providerData[0].providerId : null;
    const isPw = pid === "password";
    const n = (state.shares || []).length;
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Konto löschen">
      <div class="modal-head"><h3>Konto endgültig löschen?</h3><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 12px">Dein Konto, dein Wochenplan, deine Meals und dein gespeichertes Ziel werden unwiderruflich gelöscht${n ? ` – ebenso ${n} geteilte${n === 1 ? "r" : ""} Meal-Link${n === 1 ? "" : "e"}` : ""}. Das kann nicht rückgängig gemacht werden.</p>
        ${isPw
          ? `<div class="field"><label for="del-pw">Passwort zur Bestätigung</label><input type="password" id="del-pw" autocomplete="current-password" placeholder="Dein Passwort"></div>`
          : `<p class="share-hint" style="margin:0">Zur Bestätigung öffnet sich gleich noch einmal das Anmeldefenster.</p>`}
        <p class="auth-err" id="del-err" role="alert"></p>
      </div>
      <div class="modal-foot"><button class="btn ghost" data-close>Abbrechen</button><button class="btn danger" data-confirm>Konto löschen</button></div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    const btn = node.querySelector("[data-confirm]");
    const err = node.querySelector("#del-err");
    btn.addEventListener("click", async () => {
      const pw = isPw ? node.querySelector("#del-pw").value : null;
      if (isPw && !pw) { err.textContent = "Bitte gib dein Passwort ein."; return; }
      err.textContent = "";
      btn.disabled = true; btn.textContent = "Wird gelöscht …";
      try {
        // Frisch aus der Cloud laden statt state.recipes zu nehmen: auf einem zweiten
        // Geraet angelegte Rezepte, die dieses Geraet noch nicht per Live-Sync erhalten
        // hat, muessen trotzdem mitgeloescht werden (Art. 17 DSGVO) - state.recipes waere
        // sonst potenziell unvollstaendig.
        const cloudRecipeIds = (window.CloudSync && window.CloudSync.loadRecipes && user)
          ? (await window.CloudSync.loadRecipes(["users", user.uid])).map(r => r.id)
          : state.recipes.map(r => r.id);
        // groupId mitgeben, damit der eigene Mitglieder-Eintrag (Name, Bild) nicht in einer
        // fremden Gruppe zurueckbleibt - er haengt nicht unter users/{uid} und wird deshalb
        // nicht mitgeloescht.
        await window.CloudAuth.deleteAccount({
          password: pw, shareIds: state.shares || [], recipeIds: cloudRecipeIds,
          groupId: syncGid || "", inviteCodes: state.inviteCodes || []
        });
        closeModal();
        stopCloudSync();
        // await: die Bilder-Loeschung in IndexedDB laeuft asynchron, der Reload unten darf ihr
        // nicht dazwischenfahren. wipeLocalData() kann seit dem Firestore-Cache fehlschlagen -
        // dann ehrlich melden statt "gelöscht" zu behaupten, und NICHT neu laden.
        try {
          await wipeLocalData();
          toast("Konto und Daten wurden gelöscht");
          // Neu laden statt nur weiterzurendern: wipeLocalData() leert die lokalen Speicher,
          // nicht das im Speicher gehaltene state-Objekt (Rezepte, Plan,
          // Ziel) - ohne Reload wuerde ein direkt danach neu registriertes Konto genau
          // diese stehengebliebenen Daten wieder hochsynchronisieren, als waeren sie neu.
          setTimeout(() => location.reload(), 900);
        } catch (wipeErr) {
          toast("Ein Teil der lokalen Daten ließ sich gerade nicht entfernen. Lade die Seite bitte neu und versuche es noch einmal.");
        }
      } catch (e) {
        if (e && e.dataAlreadyDeleted) {
          // Firestore-Daten sind schon weg, nur das Loeschen des Login-Zugangs selbst
          // ist fehlgeschlagen. Sauber abmelden statt einen Zwischenzustand zu zeigen -
          // ein erneuter Versuch nach dem Wieder-Anmelden schliesst die Loeschung ab.
          closeModal();
          stopCloudSync();
          try {
            await wipeLocalData();
            try { window.CloudAuth.logout(); } catch (er) { noteError("auth:logoutAfterDelete", er); }
            toast("Deine Daten wurden gelöscht. Bitte melde dich einmal neu an und wiederhole „Konto löschen“, um auch den Zugang zu entfernen.");
            setTimeout(() => location.reload(), 900);
          } catch (wipeErr) {
            toast("Ein Teil der lokalen Daten ließ sich gerade nicht entfernen. Lade die Seite bitte neu und versuche es noch einmal.");
          }
          return;
        }
        err.textContent = cloudErrMsg(e);
        btn.disabled = false; btn.textContent = "Konto löschen";
      }
    });
    openModal(node);
  }

  // Lokales Profil (kein Cloud-Konto): Daten liegen ausschliesslich auf diesem Geraet,
  // daher genuegt das Leeren des lokalen Speichers.
