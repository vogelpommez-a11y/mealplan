        // Traegt die ID einen Grabstein, ist das ein Nachzuegler: ein anderes Geraet hat das
        // Meal noch einmal geschrieben, bevor es die Loeschung gesehen hat. Nicht aufnehmen,
        // aber in die Baseline schreiben - dadurch faellt es beim naechsten syncRecipes()
        // unter delIds und verschwindet auch in der Cloud. Nur ausserhalb der Gruppe, dort
        // gibt es keine persoenlichen Grabsteine (siehe markDeleted).
        if (!syncGid && isDeleted(c.id)) { if (lastPushedRecipes) lastPushedRecipes.set(c.id, json); return; }
        const idx = state.recipes.findIndex(r => r.id === c.id);
        if (idx === -1) { state.recipes.push(incoming); changed = true; }
        else if (canonJSON(state.recipes[idx]) !== json) { state.recipes[idx] = incoming; changed = true; }
        if (lastPushedRecipes) lastPushedRecipes.set(c.id, json);
      }
    });
    if (changed) { save(); render(); }
  }

  // ---------- Empfaenger fuer die Gruppe ----------
  // Spiegelt onRecipesRemote(): pending-Filter, Baseline mitpflegen, Baseline nie ersetzen.
  // Das Mitpflegen ist der entscheidende Teil - ohne es hielte der naechste eigene
  // pushGroupPlan() den gerade empfangenen Stand fuer eine eigene Aenderung und schriebe
  // ihn zurueck (Ping-Pong zwischen zwei Geraeten).
  function onGroupPlansRemote(changes) {
    let changed = false;
    const touchedDays = [];
    let author = null;
    changes.forEach(c => {
      if (c.pending) return; // eigener Schreibvorgang → ignorieren
      if (c.type === "removed") {
        if (state.plans[c.week]) { delete state.plans[c.week]; changed = true; }
        if (lastPushedSlots) Array.from(lastPushedSlots.keys()).forEach(k => { if (k.indexOf(c.week + ".") === 0) lastPushedSlots.delete(k); });
        return;
      }
      const incoming = normalizePlan(unflattenWeek(c.fields), state.recipes);
      // canonJSON statt JSON.stringify: ein Slot-Eintrag ist heute zufaellig alphabetisch
      // ({id, uids}), ein kuenftiges drittes Feld risse die Falle sonst lautlos wieder auf.
      if (canonJSON(state.plans[c.week]) !== canonJSON(incoming)) {
        // Welcher Tag hat sich geaendert? Nur fuer die Meldung, deshalb bewusst grob.
        DAYS.forEach(d => {
          const before = state.plans[c.week] ? canonJSON(state.plans[c.week][d.key]) : null;
          if (before !== canonJSON(incoming[d.key]) && touchedDays.indexOf(d.label) === -1) touchedDays.push(d.label);
        });
        state.plans[c.week] = incoming;
        changed = true;
      }
      if (typeof c.fields.by === "string" && c.fields.by !== syncUid) author = c.fields.by;
      if (lastPushedSlots) {
        const flat = flattenWeek(incoming);
        Array.from(lastPushedSlots.keys()).forEach(k => { if (k.indexOf(c.week + ".") === 0) lastPushedSlots.delete(k); });
        Object.keys(flat).forEach(f => lastPushedSlots.set(c.week + "." + f, canonJSON(flat[f])));
      }
    });
    if (!changed) return;
    setViewWeek(state.viewWeek);
    save(); render();
    setSyncStatus("synced");
    const now = Date.now();
    if (now - lastRemoteToast < REMOTE_TOAST_GAP) return;
    lastRemoteToast = now;
    // Mit Namen, wenn die Gruppeneinstellung es will und der Schreiber bekannt ist -
    // sonst der neutrale Text. Ersetzt die Meldung, kommt nicht zusaetzlich.
    const who = author && groupSetting("changeHints") ? firstName((memberByUid(author) || {}).name) : "";
    if (who && touchedDays.length === 1) toast(who + " hat " + touchedDays[0] + " geändert");
    else if (who) toast(who + " hat den Plan geändert");
    else toast("Plan aktualisiert");
  }

  // Mitgliederliste: treibt den Avatar-Stack im Kopf und die eigene Rolle.
  function onMembersRemote(list, fromCache) {
    // Leere Liste ist KEIN Rauswurf: onSnapshot liefert offline das leere Ergebnis aus dem
    // (nur fluechtigen) Cache, ohne den Error-Callback zu benutzen - und watchMembers meldet
    // einen echten Lesefehler seit dem Gruppenverlust-Fix als null. Eine bestehende Gruppe hat
    // immer mindestens ein Mitglied; ist sie wirklich aufgeloest, kommt das ueber onGroupRemote().
    // Vorher warf ein einziger solcher Snapshot den Nutzer aus seiner Gruppe.
    if (!Array.isArray(list) || !list.length) return;
    groupMembers = list;
    const me = memberByUid(syncUid);
    const roleBefore = myRole;
    if (!me) {
      // fromCache ist kein Beweis: der Cache kann eine Mitgliederliste aus der Zeit VOR dem
      // eigenen Beitritt ausliefern - nicht leer, aber ohne die eigene UID. Erst ein
      // serverbestaetigtes Ergebnis darf zum Rauswurf fuehren, siehe enterGroupSync().
      if (fromCache) return;
      // Aus der Gruppe entfernt worden - nicht stillschweigend weiterlaufen lassen,
      // sonst schriebe man ins Leere und wunderte sich, warum nichts ankommt.
      toast("Du bist nicht mehr Teil der Gruppe.");
      switchGroup(null);
      return;
    }
    myRole = me.role === "owner" || me.role === "edit" || me.role === "view" ? me.role : "view";
    renderProfileChip();
    if (groupModalRepaint) groupModalRepaint();   // offener Dialog zeigt sonst einen alten Stand
    // Ein Rollenwechsel aendert, welche Knoepfe ueberhaupt dastehen -> neu zeichnen.
    if (roleBefore !== myRole) {
      render();
      if (roleBefore) toast(myRole === "view" ? "Du kannst den Plan jetzt nur noch ansehen." : "Du kannst jetzt mitplanen.");
    }
  }

  function onGroupRemote(data) {
    groupInfo = data || null;
    renderProfileChip();
  }

  // Eine Gruppeneinstellung lesen. Standard so gewaehlt, dass eine alte Gruppe ohne
  // settings-Feld sich vernuenftig verhaelt.
  function groupSetting(key) {
    const s = (groupInfo && groupInfo.settings) || {};
    if (s[key] !== undefined) return s[key];
    return key === "changeHints";
  }

  // Winziges Abbild des Profilbilds fuer den Mitglieder-Eintrag. Das volle Bild (bis 640px)
  // gehoert NICHT in die Gruppe: es wuerde bei jedem Snapshot an alle Mitglieder
  // uebertragen, und angezeigt wird es dort nur als 26px-Kreis im Kopf.
  const MEMBER_AV = 64;
  function smallAvatar(dataUrl) {
    return new Promise(resolve => {
      if (!dataUrl || typeof dataUrl !== "string") { resolve(""); return; }
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = c.height = MEMBER_AV;
          c.getContext("2d").drawImage(img, 0, 0, MEMBER_AV, MEMBER_AV);
          resolve(c.toDataURL("image/jpeg", 0.7));
        } catch (e) { resolve(""); }
      };
      img.onerror = () => resolve("");
      img.src = dataUrl;
    });
  }

  // Eigenen Mitglieder-Eintrag aktuell halten (Name, kleines Bild). Die Rolle wird hier
  // NICHT mitgeschrieben - sie gehoert dem Inhaber, und die Firestore-Regel lehnt eine
  // Rollenaenderung an sich selbst ohnehin ab.
  // Die E-Mail steht bewusst nicht drin: sie ist die einzige Angabe, die die Person
  // ausserhalb der App identifizierbar macht, und die Datenschutzerklaerung sagt zu,
  // dass sie nicht geteilt wird.
  async function syncMyMember() {
    if (!syncGid || !window.CloudGroup || !syncUid) return;
    try {
      await window.CloudGroup.putMember(syncGid, syncUid, {
        name: profile.name || "",
        avatar: await smallAvatar(state.profileImage)
      });
    } catch (e) { /* nicht kritisch: Name/Bild sind Beiwerk, der Sync laeuft weiter */ }
  }

  // Eine Gruppe aus der Zeit vor dem Mitgliederlimit (16.08.2026) hat kein memberCount. Die
  // neuen Firestore-Regeln brauchen das Feld aber, um ueberhaupt rechnen zu koennen - fehlt es,
  // koennte niemand mehr beitreten oder austreten.
  //
  // Deshalb traegt der INHABER es beim naechsten Betreten der Gruppe einmalig nach. Nur er darf
  // das Gruppendokument schreiben, und die update-Regel laesst genau diesen Fall ausdruecklich
  // zu, solange das Feld noch fehlt. Danach greift wieder die harte Sperre "der Inhaber aendert
  // den Zaehler nie".
  //
  // Selbstheilend statt einmalige Migration, wie die uebrigen Umstellungen im Projekt: Jedes
  // Geraet des Inhabers kommt zum selben Ergebnis, und ein zweiter Lauf tut nichts mehr.
  //
  // WICHTIG fuer die Reihenfolge beim Deployment: Diese Funktion muss LIVE sein, BEVOR die
  // neuen Regeln veroeffentlicht werden - sonst verlangen die Regeln ein Feld, das noch
  // niemand geschrieben hat. Siehe docs/TROUBLESHOOTING.md.
  async function migrateMemberCount(gid) {
    if (!gid || !window.CloudGroup || myRole !== "owner") return;
    if (!groupInfo || typeof groupInfo.memberCount === "number") return;
    const n = groupMembers.length;
    if (!n) return;                       // ungeklaertes Leseergebnis - lieber nichts schreiben
    try {
      await window.CloudGroup.setCount(gid, n);
      groupInfo = Object.assign({}, groupInfo, { memberCount: n });
    } catch (e) { noteError("group:migrateCount", e); }
  }

  // In den Gruppenmodus wechseln. Liefert DREI Zustaende, nicht true/false:
  //   "ok"    - drin, Listener haengen
  //   "gone"  - nachweislich draussen (Gruppe aufgeloest oder man wurde entfernt)
  //   "error" - Zugriff gerade gescheitert; ueber die Mitgliedschaft ist damit NICHTS gesagt
  //
  // Die Unterscheidung ist der Kern: frueher lieferte die Funktion nur false, und der Aufrufer
  // leerte daraufhin state.groupId. Ein einziger misslungener Firestore-Aufruf beim Start
  // (Netz weg, Regel-Deploy, Rate-Limit) reichte dann, um die Gruppenzugehoerigkeit zu
  // verwerfen - und pushNow() schrieb das leere Feld anschliessend in die Cloud, womit die
  // Gruppe auch fuer alle anderen Geraete unauffindbar war. "error" laesst den Zeiger stehen,
  // der naechste Start versucht es erneut.
  async function enterGroupSync(gid) {
    // Kein gid ist ein echtes "nicht in einer Gruppe"; fehlendes/abgeschaltetes CloudGroup ist
    // dagegen ein Umgebungsproblem und darf den gespeicherten Zeiger nicht kosten.
    if (!gid) return "gone";
    if (!window.CloudGroup || !window.CloudGroup.enabled) return "error";
    try {
      const { data: info, fromCache: infoFromCache } = await window.CloudGroup.fetch(gid);
      // Die Gruppe ist weg (aufgeloest). Bewusst OHNE removeMember(): fetch() liefert data:null
      // sowohl fuer "existiert nicht" als auch fuer jedes Leseergebnis ohne Dokument - aus so
      // einem Lesevorgang darf keine Loeschung folgen. Frueher warf sich das Geraet hier bei
      // einer nur kurz nicht lesbaren Gruppe selbst aus der Mitgliederliste, und in einer
      // Zweiergruppe stand die andere Person danach allein da. Verwaiste Mitgliedseintraege
      // raeumt dissolveGroupFirestore() ohnehin im Batch mit auf.
      // Mit persistentLocalCache kann "kein Dokument" auch bedeuten, dass der Cache es nie
      // gesehen hat (noch nicht synchronisiert) - dann ist es "error", nicht "gone".
      if (!info) return infoFromCache ? "error" : "gone";
      const { members, fromCache: membersFromCache } = await window.CloudGroup.fetchMembers(gid);
      // Gleiche Vorsicht wie bei fetch() oben, nur subtiler: getDocs() WIRFT offline nicht,
      // sondern liefert das leere Cache-Ergebnis. Eine leere Mitgliederliste ist deshalb kein
      // Beweis fuer einen Rauswurf, sondern ein ungeklaertes Leseergebnis -> "error", der Zeiger
      // bleibt stehen, der naechste Start versucht es erneut.
      if (!members.length) return "error";
      const me = members.filter(m => m.uid === syncUid)[0];
      // fromCache ist kein Beweis: der Cache kann eine Mitgliederliste aus der Zeit VOR dem
      // eigenen Beitritt liefern - nicht leer, aber ohne die eigene UID. Siehe
      // docs/TROUBLESHOOTING.md ("fromCache ist kein Beweis").
      if (!me) return membersFromCache ? "error" : "gone";   // entfernt worden
      syncGid = gid;
      state.groupId = gid;    // mit syncGid synchron halten - save() persistiert es lokal
      groupInfo = info;
      groupMembers = members;
      myRole = me.role === "owner" || me.role === "edit" ? me.role : "view";

      // Meals der Gruppe ERSETZEN den lokalen Bestand, nicht ergaenzen: in einer Gruppe
      // ist die Gruppe die Wahrheit. Wuerde gemergt, saehe jeder zusaetzlich seine alten
      // Meals, die die anderen gar nicht haben - der Plan waere nicht mehr gemeinsam
      // lesbar. Die eigenen Meals sind beim Beitritt in die Gruppe kopiert worden.
      const gRecipes = sanitizeRecipes(await window.CloudSync.loadRecipes(["groups", gid]));
      state.recipes = gRecipes;
      // canonJSON, nicht JSON.stringify: syncRecipes() vergleicht gleich darauf kanonisch gegen
      // diese Baseline. Wird sie roh geseedet, weicht der erste Vergleich fast immer ab und die
      // App schriebe direkt nach dem Gruppenbeitritt alle Rezepte einmal komplett neu hoch.
      lastPushedRecipes = new Map(gRecipes.map(r => [r.id, canonJSON(r)]));

      // Wochenplan der Gruppe uebernehmen (ebenfalls ersetzen, gleiche Begruendung).
      const weeks = await window.CloudGroup.loadPlans(gid);
      const plans = {};
      const slots = new Map();
      weeks.forEach(w => {
        const plan = normalizePlan(unflattenWeek(w.fields), state.recipes);
        plans[w.week] = plan;
        const flat = flattenWeek(plan);
        Object.keys(flat).forEach(f => slots.set(w.week + "." + f, canonJSON(flat[f])));   // kanonisch seeden, siehe lastPushedRecipes oben
      });
      state.plans = pruneWeeks(plans);
      // Baseline aus dem geladenen Stand vorbefuellen statt leer lassen - sonst schriebe
      // der erste pushGroupPlan() nach jedem Login alle Slots erneut (gleiche Begruendung
      // wie bei lastPushedRecipes unten).
      lastPushedSlots = slots;
      setViewWeek(state.viewWeek);

      syncUnsubGroup = window.CloudGroup.watch(gid, onGroupRemote);
      syncUnsubMembers = window.CloudGroup.watchMembers(gid, onMembersRemote);
      syncUnsubGroupPlans = window.CloudGroup.watchPlans(gid, onGroupPlansRemote);
      syncUnsubRecipes = window.CloudSync.watchRecipes(["groups", gid], onRecipesRemote);
      syncMyMember();          // bewusst ohne await: Name/Bild duerfen den Start nicht aufhalten
      migrateMemberCount(gid); // desgleichen: einmalige Nachpflege, kein Startblocker
      return "ok";
    } catch (e) {
      // Haeufigster Fall: die Firestore-Regeln sind noch nicht veroeffentlicht, jeder
      // Gruppen-Zugriff scheitert. Nicht still bleiben - sonst sieht der Nutzer nur einen
      // leeren Plan und haelt seine Daten fuer verloren.
      leaveGroupState();
      // Der Toast sagt dem Nutzer freundlich, was Sache ist - und verschluckte bis zum
      // 27.08.2026 den eigentlichen Fehler dabei vollstaendig. Wer wissen wollte, WARUM die
      // Gruppe nicht erreichbar war (fehlende Regel? falsche gid? offline?), stand ohne jede
      // Spur da: kein Log, keine Konsole, nichts. Genau der Zustand, den noteError()
      // verhindern soll. Der Nutzer sieht davon nichts, `noteError.dump()` in den DevTools
      // schon.
      noteError("group:switch", e);
      // "vorerst" ist woertlich gemeint: der Zeiger bleibt gespeichert, der naechste Start
      // verbindet wieder. Deshalb "error" und nicht "gone".
      toast("Die Gruppe ist gerade nicht erreichbar – du planst vorerst für dich.");
      return "error";
    }
  }

  // Nur den lokalen Gruppenzustand abbauen (Listener + Variablen), ohne die Cloud
  // anzufassen. Getrennt von leaveGroup(), das die Mitgliedschaft wirklich beendet.
  function leaveGroupState() {
    if (syncUnsubGroup) { try { syncUnsubGroup(); } catch (e) { noteError("sync:unsubGroup", e); } syncUnsubGroup = null; }
    if (syncUnsubMembers) { try { syncUnsubMembers(); } catch (e) { noteError("sync:unsubMembers", e); } syncUnsubMembers = null; }
    if (syncUnsubGroupPlans) { try { syncUnsubGroupPlans(); } catch (e) { noteError("sync:unsubGroupPlans", e); } syncUnsubGroupPlans = null; }
    syncGid = null; groupInfo = null; groupMembers = []; myRole = null; lastPushedSlots = null;
  }

  // Gruppenwechsel zur Laufzeit (Beitritt/Austritt auf einem anderen Geraet, Kick).
  // Baut den Sync komplett neu auf - das ist ehrlicher als zu versuchen, den halben
  // Zustand umzubiegen, und passiert selten genug, dass die Sekunde nicht stoert.
  async function switchGroup(gid) {
    const uid = syncUid;
    if (!uid) return;
    stopCloudSync();
    state.groupId = gid || "";
    await startCloudSync(uid);
  }

  async function startCloudSync(uid) {
    if (!window.CloudSync || !window.CloudSync.enabled) { maybeStartOnboarding(); return; }
    if (syncUid === uid) return;                 // läuft schon
    stopCloudSync();
    syncUid = uid;
    setSyncStatus("connecting");
    // Pro-Berechtigung (D1) mitlaufen lassen. Eigener Listener statt eines Feldes im
    // Kontodokument - siehe isPro(). Laeuft VOR dem await unten los: er haengt an nichts,
    // was der Merge erst herstellen muesste, und ein spaeter Start hiesse, dass die erste
    // Zeichnung nach dem Login den Status noch nicht kennt.
    if (window.CloudEntitlement) {
      entitlementUnsub = window.CloudEntitlement.watch(uid, function (d) {
        const vorher = isPro();
        proInfo = sanitizeEntitlement(d);
        // Nur zeichnen, wenn sich der Status tatsaechlich geaendert hat: der Listener
        // feuert auch bei jedem Server-Echo, und render() mitten im Tippen kostet den Fokus.
        if (isPro() !== vorher) { renderProfileChip(); render(); }
      });
    }
    await imagesReady;   // Paket A3: lokale Bilder muessen im State sein, bevor der Merge/pushNow
                         // laeuft - sonst schriebe der Baseline-Push bildlose Rezepte in die Cloud.
    try {
      const remote = await window.CloudSync.load(uid);
      // Vor dem Rezept-Merge und ausserhalb davon: ein Konto ohne Rezepte laeuft am Block
      // unten vorbei, haette die ersten Schritte aber trotzdem schon hinter sich. Und nur
      // in eine Richtung — waere das Flag zurueckziehbar, startete der Ablauf auf Geraet 2
      // erneut, solange Geraet 1 seinen Stand noch nicht hochgeschrieben hat.
      if (remote && remote.onboarded) state.onboarded = true;
      // Aus demselben Grund hier oben und nicht im Block darunter: wer sich wiegt, aber
      // (noch) keine Meals angelegt hat, verloere seinen Verlauf sonst beim Anmelden.
      if (remote) {
        state.weights = mergeWeights(remote.weights, state.weights);
        state.weightGoals = Object.assign({}, sanitizeWeightGoals(state.weightGoals), sanitizeWeightGoals(remote.weightGoals));
        state.weightConsent = mergeConsent(remote.weightConsent, state.weightConsent);
        // Wochenarchiv, aus demselben Grund wie die Wiegungen direkt darueber: Dieser Block
        // ist der Baseline-Merge beim Anmelden, und gleich danach schreibt pushNow() den
        // zusammengefuehrten Stand hoch. Fehlt weekStats HIER, hilft die Vereinigung in
        // onRemote() nichts mehr - der Baseline-Push ist dann schon mit dem duennen lokalen
        // Archiv durch, und mergeFields ersetzt das Cloud-Feld ganz. Genau so ist beim
        // Abnahmelauf eine Woche verlorengegangen, die nur die Cloud kannte.
        // Steht ausserhalb der Gruppen-Unterscheidung weiter unten: Der Rueckblick ist
        // kontobezogen, nicht gruppenbezogen - er gilt in beiden Faellen.
        state.weekStats = mergeWeekStats(remote.weekStats, state.weekStats);
        if (remote.profileImage && typeof remote.profileImage === "string") { state.profileImage = remote.profileImage; renderProfileChip(); }
        // Cloud gewinnt: die Personenzahl ist eine Kontoeinstellung, kein Geraetezustand -
        // sonst ueberschriebe ein frisch angemeldetes zweites Geraet sie mit seiner 1.
        if (remote.shopPersons !== undefined) state.shopPersons = sanitizeShopPersons(remote.shopPersons);
        if (remote.favs !== undefined) state.favs = sanitizeFavs(remote.favs); // Cloud gewinnt, kein Union
        if (remote.planned !== undefined) state.planned = sanitizePlanned(remote.planned, state.recipes);
        // Muss VOR dem Rezept-Merge stehen: der fragt die Grabsteine ab, um zu entscheiden,
        // was ueberhaupt noch in den Bestand darf.
        state.deleted = mergeTombstones(state.deleted, remote.deleted);
      }
      // Rezepte zusammenführen (Cloud + eigene lokale, die es dort noch nicht gibt).
      // Beispiel-Meals werden NICHT in ein bestehendes Konto übernommen – sie sind nur
      // ein einmaliges Willkommens-Angebot für neue Konten. Ausgelagert, weil sowohl der
      // Normalfall (Subcollection) als auch die Alt-Migration (Inline-Array) dieselbe
      // Logik brauchen.
      // Grabsteine entscheiden hier ueber beide Richtungen (siehe sanitizeTombstones):
      // ein Meal mit Grabstein kommt weder aus der Cloud noch aus dem lokalen Bestand
      // wieder herein. Kommt es aus der Cloud, bleibt es in lastPushedRecipes stehen und
      // wird vom gleich folgenden pushNow()/syncRecipes() dort ausgeraeumt - so heilt sich
      // auch ein Loeschen, dessen Push seinerzeit nie durchlief.
      function mergeRemoteRecipes(list) {
        const map = {};
        sanitizeRecipes(list).forEach(r => { if (r && r.id && !isDeleted(r.id)) map[r.id] = r; });
        state.recipes.forEach(r => { if (r && r.id && !map[r.id] && !isDeleted(r.id)) map[r.id] = r; });
        state.recipes = Object.values(map);
        const rp = pruneWeeks(normalizePlans(plansField(remote), state.recipes));
        Object.keys(state.plans).forEach(k => { if (!rp[k]) rp[k] = state.plans[k]; }); // lokale Wochen behalten, die es remote nicht gibt
        state.plans = pruneWeeks(rp);
        if (remote.goal) state.goal = sanitizeGoal(remote.goal); // Ziel aus der Cloud übernehmen; lokales bleibt, falls remote keins hat
        state.shares = unionIds(state.shares, remote.shares);
        setViewWeek(state.viewWeek);
        // state.tab bewusst NICHT aus remote uebernehmen — Start bleibt immer der Wochenplan
        save(); render();
      }
      // Rezepte kommen jetzt aus der eigenen Subcollection statt aus dem Hauptdokument.
      // remote.recipes (Alt-Format) wird nur noch als Migrations-Quelle genutzt, falls
      // die Subcollection noch leer ist - verschwindet von selbst, sobald der naechste
      // Hauptdokument-Push (ohne "recipes"-Feld) durchlaeuft. Beide Quellen zusammenfuehren
      // statt Entweder-Oder: bei einer nur TEILWEISE abgeschlossenen Migration (z.B. ein
      // anderes Geraet hat schon einen Teil in die Subcollection geschrieben, aber das
      // Hauptdokument-Feld noch nicht geleert) wuerden sonst die restlichen Alt-Rezepte
      // uebersehen. legacyRecipes zuerst, cloudRecipes danach - bei gleicher ID gewinnt
      // die frischere Subcollection-Version (mergeRemoteRecipes ueberschreibt in Reihenfolge).
      // Gehoert das Konto zu einer Gruppe? Dann kommen Plan UND Meals von dort, und der
      // Zusammenfuehr-Block darunter entfaellt komplett. Persoenlich bleiben Ziel,
      // Gewichte, Profilbild und die Freigabe-Kennungen - die stehen weiter im Konto.
      // Wartezustand: pruefen, ob inzwischen ein zweites Mitglied da ist. Erst HIER, vor der
      // wantGid-Ermittlung - gelingt die Aktivierung, liest der Rest dieses Ablaufs remote.groupId
      // ganz normal ueber enterGroupSync() ein, ohne switchGroup() rekursiv aus diesem laufenden
      // Aufruf heraus anzustossen (das wuerde stopCloudSync() mitten in diesem Durchlauf ausloesen).
      let pgid = (remote && typeof remote.pendingGroupId === "string" && remote.pendingGroupId) ? remote.pendingGroupId : "";
      let activatedNow = false;
      if (pgid && window.CloudGroup) {
        try {
          const { members: pendingMembers, fromCache: pendingFromCache } = await window.CloudGroup.fetchMembers(pgid);
          // Ein Cache-Ergebnis darf keine Aktivierung ausloesen - es koennte der Stand VOR dem
          // Beitritt des zweiten Mitglieds sein. Live-Listener haengt weiter dran, bis ein
          // serverbestaetigtes Ergebnis kommt.
          if (pendingMembers.length > 1 && !pendingFromCache) {
            await finalizeGroupActivation(pgid);
            remote.groupId = pgid; remote.pendingGroupId = ""; activatedNow = true; pgid = "";
          } else {
            watchPendingGroup(pgid);
          }
        } catch (e) {
          // fetchMembers oder die Aktivierung selbst ist gescheitert (offline o.ae.) - trotzdem
          // einen Live-Listener anhaengen. Ohne ihn waere die Aktivierung fuer den Rest dieser
          // Sitzung tot, auch wenn die Verbindung Sekunden spaeter wieder steht - erst ein
          // Neustart wuerde es dann erneut versuchen.
          watchPendingGroup(pgid);
        }
      }
      state.pendingGroupId = pgid;
      state.pendingInviteUrl = pgid ? ((remote && remote.pendingInviteUrl) || "") : "";

      // Der lokale Zeiger ist die zweite Quelle: hat ein frueherer Fehlerpfad die Cloud-groupId
      // geleert, waere die Gruppe sonst dauerhaft unauffindbar, obwohl sie in Firestore samt
      // Mitgliedschaft weiterbesteht. enterGroupSync() entscheidet, was daraus wird - "ok" laesst
      // pushNow() den Zeiger unten wieder eintragen, "gone" raeumt ihn. Der regulaere Austritt auf
      // einem anderen Geraet bleibt damit korrekt: dort ist der eigene Mitglieder-Eintrag geloescht,
      // enterGroupSync() liefert "gone".
      const remoteGid = (remote && typeof remote.groupId === "string" && remote.groupId) ? remote.groupId : null;
      const wantGid = remoteGid || state.groupId || null;
      const groupResult = wantGid ? await enterGroupSync(wantGid) : "gone";
      const inGroup = groupResult === "ok";
      // Nur bei "gone" den Zeiger raeumen - da ist nachgewiesen, dass die Gruppe weg ist oder
      // man entfernt wurde. Bei "error" (Netz/Regeln/Rate-Limit) bleibt state.groupId stehen
      // und groupSyncFailed haelt pushNow() davon ab, das Feld in der Cloud zu ueberschreiben:
      // sonst kostet eine einzige schlechte Verbindung beim Start die ganze Gruppe.
      groupSyncFailed = groupResult === "error";
      // Vierter Ort, an dem groupSyncFailed gesetzt wird - und der haeufigste: enterGroupSync()
      // faengt seine Fehler selbst ab und LIEFERT "error" zurueck, statt zu werfen. Der catch
      // unten sieht diesen Fall also nie. Ohne lastGroupAttempt hier zoege jeder folgende
      // onRemote()-Snapshot switchGroup() erneut auf (siehe dort, "retryingFailedAttempt") -
      // genau die Dauerschleife, die das Netz verhindern soll.
      if (groupSyncFailed) lastGroupAttempt = wantGid || null;
      if (wantGid && groupResult === "gone") state.groupId = "";
      // Aktivierung ist eben erst geglueckt, aber der direkt anschliessende enterGroupSync()
      // ist gescheitert (z. B. Netz weg genau in diesem Moment): lieber den Wartezustand
      // wiederherstellen, als sowohl groupId als auch pendingGroupId zu verlieren - sonst waere
      // die (fuer den Beitretenden laengst aktive!) Gruppe fuer den Owner nicht mehr auffindbar.
      if (activatedNow && !inGroup) {
        state.pendingGroupId = wantGid;
        try { await window.CloudSync.save(syncUid, { pendingGroupId: wantGid }); } catch (e) { noteError("sync:savePendingGroupId", e); }
        watchPendingGroup(wantGid);
      }

      if (inGroup) {
        if (remote.goal) state.goal = sanitizeGoal(remote.goal);
        state.shares = unionIds(state.shares, remote.shares);
        save(); render();
      } else {
        const cloudRecipes = window.CloudSync.loadRecipes ? await window.CloudSync.loadRecipes(["users", uid]) : [];
        const legacyRecipes = (remote && Array.isArray(remote.recipes)) ? remote.recipes : [];
        // Auch unabhaengig vom Merge unten: liegt hier noch ein Meal, das laut Grabstein
        // geloescht ist (Loeschung auf einem anderen Geraet, dieses war offline), muss es
        // raus, BEVOR pushNow() es wieder in die Cloud traegt. Der Merge-Zweig deckt nur
        // den Fall ab, dass die Cloud ueberhaupt Rezepte hat.
        const tombIds = Object.keys(state.deleted || {});
        if (tombIds.length) {
          state.recipes = state.recipes.filter(r => r && r.id && !isDeleted(r.id));
          dropRecipeIds(new Set(tombIds));   // Plan- und Favoritenverweise gleich mitraeumen
        }
        if (cloudRecipes.length || legacyRecipes.length) mergeRemoteRecipes(legacyRecipes.concat(cloudRecipes));
        // Baseline aus dem geladenen Cloud-Stand vorbefuellen statt auf null zu setzen:
        // so schreibt der folgende pushNow()-Lauf nur, was wirklich neu/geaendert ist
        // (Migration UND Normalfall gleichermassen abgedeckt), statt bei JEDEM Login alle
        // Rezepte erneut zu schreiben.
        lastPushedRecipes = new Map(cloudRecipes.map(r => [r.id, canonJSON(r)]));   // kanonisch seeden, siehe enterGroupSync()
        syncUnsubRecipes = window.CloudSync.watchRecipes ? window.CloudSync.watchRecipes(["users", uid], onRecipesRemote) : null;
      }
      lastPushedJSON = null;
      // Ab hier ist der Gruppenzustand geklaert (ok/gone/error sind alle durchlaufen) - erst
      // jetzt darf pushNow() den groupId-Zeiger ueberhaupt anfassen. Muss vor dem Baseline-Push
      // stehen, sonst schriebe genau der das Feld nie mit.
      syncHandshakeOk = true;
      cloudBaselineOk = true;   // der Cloud-Stand ist geladen und eingemischt - ab jetzt darf gepusht werden
      // Der Bestand steht jetzt vollstaendig (Gruppen-Merge bzw. Cloud-Merge ist oben schon
      // gelaufen) - genau die Vorbedingung, die dedupeAgainstCatalog() fuer die Gruppe
      // verlangt. VOR pushNow(), damit eine hier ausgeloeste Aufraeumung gleich mit der
      // folgenden Baseline hochgeschrieben wird statt einen Zyklus zu verzoegern.
      dedupeAgainstCatalog();
      await pushNow();                            // zusammengeführten Stand als Baseline hochschreiben
      // Sperrfrist gleich mitstarten: direkt nach dem Verbinden sagt schon „Mit deiner
      // Cloud verbunden", dass Daten hereingekommen sind — ein zweiter Hinweis darauf
      // waere in derselben Sekunde nur Laerm.
      lastRemoteToast = Date.now();
      syncUnsub = window.CloudSync.watch(uid, onRemote);
      setSyncStatus("synced");
      // siehe Deklaration von suppressConnectToast weiter oben
      if (suppressConnectToast) suppressConnectToast = false;
      else toast(syncGid ? "Mit eurer Gruppe verbunden" : "Mit deiner Cloud verbunden");
      // Erst JETZT ueber die ersten Schritte entscheiden: enterApp() laeuft schon, waehrend
      // dieser Aufruf noch unterwegs ist. Wer den Ablauf dort startete, bekaeme ihn bei jedem
      // Login auf einem neuen Geraet kurz zu sehen, bevor das Flag aus der Cloud eintrifft.
      maybeStartOnboarding();
    } catch (e) {
      // Doppelter Boden zu syncHandshakeOk: der Start ist irgendwo mittendrin abgebrochen, die
      // Mitgliedschaft ist damit ungeklaert. syncUid bleibt gesetzt (die App synct persoenlich
      // weiter), also muss der Gruppenzeiger ausdruecklich gesperrt bleiben - sonst traegt der
      // naechste beliebige save() ein groupId:"" in die Cloud.
      groupSyncFailed = true;
      // Bewusst freigeben, obwohl kein Cloud-Stand geladen wurde: Der Kommentar oben gilt
      // weiter - syncUid bleibt gesetzt, die App synct persoenlich weiter, und das soll sie.
      // Ohne diese Zeile bliebe das Kontodokument bis zum naechsten App-Start ungesichert.
      // Ehrlich benannt: In diesem Zweig gewinnt der lokale Stand. Das war auch vorher schon
      // so - merge:true hat daran nur einzelne Map-Blaetter zufaellig vorbeigerettet, waehrend
      // weights/shares/inviteCodes (Arrays) ohnehin immer ganz ersetzt wurden.
      cloudBaselineOk = true;
      lastGroupAttempt = state.groupId || null;   // fuer WELCHE Gruppe der Versuch scheiterte (onRemote)
      setSyncStatus("offline"); /* offline: App läuft lokal weiter, Sync greift beim nächsten Mal */
      maybeStartOnboarding();   // ohne Cloud entscheidet der lokale Stand
    }
  }
  function stopCloudSync() {
    if (syncUnsub) { try { syncUnsub(); } catch (e) { noteError("sync:unsubState", e); } syncUnsub = null; }
    if (syncUnsubRecipes) { try { syncUnsubRecipes(); } catch (e) { noteError("sync:unsubRecipes", e); } syncUnsubRecipes = null; }
    // Berechtigung mit abmelden UND zuruecksetzen (D1): Bliebe proInfo stehen, behielte das
    // naechste, fremde Konto auf demselben Geraet den Pro-Status des vorigen.
    if (entitlementUnsub) { try { entitlementUnsub(); } catch (e) { noteError("sync:unsubEntitlement", e); } entitlementUnsub = null; }
    proInfo = null;
    unwatchPending();    // Wartezustand-Listener haengt sonst weiter, obwohl niemand mehr angemeldet ist
    leaveGroupState();   // Gruppen-Listener haengen sonst weiter und schreiben in den alten Zustand
    clearTimeout(pushTimer);
    syncUid = null; lastPushedJSON = null; lastPushedRecipes = null; recipesSyncFailed = false; groupSyncFailed = false; syncHandshakeOk = false;
    watchAbgerissen = false;   // gehoert zu genau dieser Sync-Session (wie lastGroupAttempt unten)
    cloudBaselineOk = false;   // naechste Sitzung muss den Cloud-Stand erst wieder laden
    lastGroupAttempt = null;   // Sicherheitsnetz aus onRemote() gehoert zu genau dieser Sync-Session
    setSyncStatus("off");
  }

  // Sync-Status für die Anzeige: "off" | "connecting" | "synced" | "saving" | "offline" | "toobig"
  let syncStatus = "off";
  function syncStatusInfo() {
    return ({
      connecting: { cls: "busy", label: "Verbinde …" },
      synced:     { cls: "ok",   label: "Synchronisiert" },
      saving:     { cls: "busy", label: "Wird gespeichert …" },
      offline:    { cls: "err",  label: "Offline – lokal gespeichert" },
      toobig:     { cls: "err",  label: "Zu viele Fotos für die Cloud" },
      off:        { cls: "off",  label: "Nicht verbunden" }
    })[syncStatus] || { cls: "off", label: "Nicht verbunden" };
  }
  function setSyncStatus(s) {
    if (syncStatus === s) return;
    syncStatus = s;
    updateSyncUI();
  }
  // Gegenstueck zu watchFehler() im Firebase-Modul. Ein onSnapshot, der mit einem Fehler
  // endet, ist ENDGUELTIG beendet - Firestore haengt ihn nicht wieder an. Ab hier kommt von
  // aussen nichts mehr, und genau das muss die Anzeige sagen.
  //
  // Warum das eine eigene Meldung wert ist: Der Sync-Punkt stand auf "Synchronisiert",
  // gesetzt am Ende von startCloudSync(), und nichts nahm ihn je zurueck. Am 28.08.2026 war
  // messbar, dass die App weder lesen noch schreiben konnte, waehrend die Anzeige Sicherheit
  // versprach. Ein stiller Fehler ist schlimmer als ein lauter, wenn es um Daten geht
  // (docs/TROUBLESHOOTING.md 29, 121, 129).
  //
  // "offline" und nicht ein neuer Zustand: Die Lage ist fuer den Nutzer dieselbe - die App
  // laeuft lokal weiter, der naechste Start verbindet neu. Ein fuenfter Status brauchte ein
  // eigenes Symbol und eine eigene Erklaerung, ohne dass sich die Handlung aendert.
  window.__onCloudWatchError = function (kennung, e) {
    setSyncStatus("offline");
    if (watchAbgerissen) return;
    watchAbgerissen = true;
    // Kurz gehalten, und zwar aus drei Gruenden, die der Push-Check am 28.08.2026 genannt hat:
    //
    //   * Der Toast steht 1,9 Sekunden (toast()). Die erste Fassung hatte 21 Woerter - in der
    //     Zeit nicht lesbar.
    //   * "deine Aenderungen bleiben auf diesem Geraet" stand schon im Sync-Punkt daneben
    //     ("Offline - lokal gespeichert"). Ein Toast ist fuer das NEUE da, nicht fuer den
    //     Zustand, den die Anzeige ohnehin traegt.
    //   * "Lade die Seite neu, um weiter zu synchronisieren" versprach eine Wirkung, die nicht
    //     immer eintritt: Reisst der Listener wegen einer Firestore-Regel ab (Rauswurf aus
    //     einer Gruppe, geaenderte Berechtigung), scheitert er nach dem Neuladen genauso.
    //     Jetzt steht dort die Handlung, nicht die Zusage.
    toast("Cloud-Verbindung unterbrochen – lade die Seite neu");
  };
  function updateSyncUI() {
    const info = syncStatusInfo();
    document.querySelectorAll("[data-sync-dot]").forEach(elm => {
      elm.classList.remove("ok", "busy", "err", "off");
      elm.classList.add(info.cls);
      elm.title = "Cloud-Sync: " + info.label;
    });
    document.querySelectorAll("[data-sync-label]").forEach(elm => { elm.textContent = info.label; });
  }

  function uid() { return "r" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  // Waehrend eines Render-Durchlaufs wird sehr oft nach Rezepten gesucht (jeder Slot,
  // jede Tagesbilanz). Der Index macht daraus einen Map-Zugriff statt einer linearen
  // Suche. Er lebt bewusst NUR innerhalb von render(): dort mutiert state.recipes nicht,
  // ausserhalb koennte er veralten - deshalb faellt getRecipe dann auf die Suche zurueck.
  let recipeIndex = null;
  // Seit dem 17.08.2026 zweistufig: erst der eigene Bestand, dann - bei Fehltreffer - der
  // mitgelieferte Katalog. Die Reihenfolge ist Absicht: Eine bewusst uebernommene und
  // veraenderte Kopie traegt dieselbe Bedeutung wie das Original und muss es schlagen, sonst
  // zeigte ein Wochenplan-Slot nach dem Uebernehmen weiterhin die unveraenderte Fassung.
  // recipeIndex bleibt bewusst NUR aus state.recipes gebaut (siehe dort) - der Katalog kommt
  // hier erst beim Fehltreffer dazu, nicht als weitere 34 Eintraege in jedem render().
  function getRecipe(id) {
    const eigenes = recipeIndex ? (recipeIndex.get(id) || null) : (state.recipes.find(r => r.id === id) || null);
    if (eigenes) return eigenes;
    return COOKBOOK.find(r => r.id === id) || null;
  }
  // Die Meals-Bibliothek OHNE die per Barcode-Schnellzugriff still angelegten Produkte
  // (quick: true). Zaehler, Suchfeld, Leerzustand und Liste im Reiter "Meals" muessen
  // dieselbe Menge sehen - sonst steht dort "12 Meals" ueber zehn Karten, oder der
  // Leerzustand fehlt, obwohl die Liste leer aussieht.
  // Seit dem Sheet-Umbau nutzt auch openPicker() diese Menge: eine Auswahlliste, die mit
  // jedem gescannten Riegel laenger wird, ist genau das Gegenteil von "Entscheidungen
  // abnehmen". Ueber Plan, Einkaufsliste und Druck bleiben die Produkte erreichbar.
  function libraryRecipes() { return state.recipes.filter(r => r.quick !== true); }

  // ---------- Rezeptbuch: was zeigen, was ist schon uebernommen ----------
  // Gezeigt wird nur, was zum Ernaehrungsprofil passt - das ist der erste sichtbare Nutzen
  // des Profils (vorher wirkte es nur im Hintergrund). Wer "Alles" gewaehlt hat, sieht alles.
  function cookbookVisible() { return COOKBOOK.filter(r => fitsDiet(r)); }
  // Schon uebernommen? Ueber `lib` und nicht ueber den Namen: Wer die Kopie umbenennt oder
  // anpasst, soll sie nicht ein zweites Mal angeboten bekommen.
  function isAdopted(id) { return state.recipes.some(r => r && r.lib === id); }
  // Der eine Kopierweg vom Katalog in den Bestand - benutzt vom Uebernehmen-Knopf UND von
  // den Startmeals. Bewusst EINE Funktion: Zwei Kopierwege wuerden irgendwann verschiedene
  // Felder mitnehmen, und der Unterschied faellt erst beim Sync auf.
  // Die Katalog-`id` wird NICHT als Rezept-id uebernommen: state.recipes braucht eigene,
  // eindeutige Schluessel (uid()), sonst kollidieren zwei Konten in derselben Gruppe.
  // `lib` bleibt daran haengen, damit spaeter eine korrigierte Fassung zugeordnet werden
  // kann - und damit das Bild aus img/library/ gefunden wird (libPhoto).
  function copyFromCookbook(vorlage) {
    return sanitizeRecipe(Object.assign({}, vorlage, { id: uid(), lib: vorlage.id }));
  }

  // ---------- Startmeals nach dem Onboarding ----------
  // Bis zum 15.08.2026 setzte load() vier feste Beispiel-Meals (SEED) in den Bestand - und
  // zwar beim ALLERERSTEN Start, also bevor das Onboarding gelaufen war. Damit stand die
  // Auswahl fest, bevor jemand wusste, ob der Nutzer vegan isst: Ein Veganer bekam als
  // Erstes ein Rindersteak und einen Molke-Shake. Deshalb entsteht der erste Bestand jetzt
  // NACH dem Onboarding und aus dem Katalog.
  //
  // Feste Listen statt Zufall: Die Auswahl ist eine Kurationsentscheidung, und bei einer
  // Rueckfrage weiss man sonst nicht, was der Nutzer ueberhaupt gesehen hat.
  //
  // Je Liste 1 Fruehstueck, 3 Hauptgerichte, 1 Snack - so ist jeder Slot-Typ des Wochenplans
  // (fr, mi/ab, sn) sofort bedienbar, und die Hauptgerichte, die 14 Slots pro Woche fuellen
  // muessen, haben Auswahl. Wo es geht, mit `mealPrep`.
  const STARTER_ANZAHL = 5;
  const STARTER = {
    alles: ["quark-haferflocken-banane", "haehnchen-bowl-brokkoli", "chili-rinderhack-bohnen",
            "ofenlachs-suesskartoffel", "skyr-beeren-nuesse"],
    vegetarisch: ["quark-haferflocken-banane", "ofen-feta-kichererbsen", "tofu-gemuesepfanne",
                  "linsen-bolognese-vollkorn", "skyr-beeren-nuesse"],
    vegan: ["overnight-oats-soja-beeren", "rotes-linsen-dal", "tofu-gemuesepfanne",
            "kichererbsen-curry-spinat", "edamame-sesam-snack"],
  };
  function addStarterMeals() {
    // NUR in einen leeren Bestand. Wer sich auf einem zweiten Geraet anmeldet und dort das
    // Onboarding durchlaeuft, hat seine Meals schon - fuenf Dubletten waeren die Folge.
    if (state.recipes.length) return;
    const wunsch = STARTER[(state.goal && state.goal.diet) || "alles"] || STARTER.alles;
    const nimm = [];
    // Durch fitsDiet(), nicht blind: Die Listen sind nach Ernaehrungsform gebaut, `avoid`
    // (glutenfrei/laktosefrei) liegt quer dazu. Ein glutenfreier Veganer bekaeme sonst die
    // Bolognese mit Vollkornnudeln.
    wunsch.forEach(id => {
      const r = COOKBOOK.find(x => x.id === id);
      if (r && fitsDiet(r)) nimm.push(r);
    });
    // Aufgefuellt wird aus demselben gefilterten Katalog - und dabei gehen Kategorien vor,
    // die noch fehlen: sonst haette ein glutenfreier Veganer am Ende vier Hauptgerichte.
    while (nimm.length < STARTER_ANZAHL) {
      const rest = cookbookVisible().filter(r => !nimm.some(x => x.id === r.id));
      if (!rest.length) break;
      nimm.push(rest.find(r => !nimm.some(x => x.category === r.category)) || rest[0]);
    }
    nimm.slice(0, STARTER_ANZAHL).forEach(r => state.recipes.push(copyFromCookbook(r)));
  }
  function adoptFromCookbook(id) {
    const vorlage = COOKBOOK.find(r => r.id === id);
    if (!vorlage || isAdopted(id)) return;
    const kopie = copyFromCookbook(vorlage);
    state.recipes.push(kopie);
    // Plan-Verweise auf das Katalog-Original biegen auf die neue Kopie um - sonst zeigt der
    // Wochenplan weiter auf die unveraenderte Fassung und eine spaetere Bearbeitung der Kopie
    // bliebe dort unsichtbar (rewritePlanIds(), Teil 1.5 des Katalog-Umbaus).
    rewritePlanIds(vorlage.id, kopie.id);
    save(); render();
    undoToast(`„${vorlage.name}" ist in deinen Meals`, () => {
      state.recipes = state.recipes.filter(r => r.id !== kopie.id);
      rewritePlanIds(kopie.id, vorlage.id);
      save(); render();
    });
  }

  // ---------- Einmalige Aufraeumung alter Dubletten (Teil 3 des Katalog-Umbaus, 17.08.2026) ----
  // Vor diesem Umbau kopierte sowohl der Planer (planAdopt(), inzwischen entfallen) als auch
  // der Gruppenbeitritt (copyOwnRecipesToGroup(), vor der Deduplizierung in Teil 2) Katalog-
  // Rezepte ohne Abgleich in den Bestand. Startmeals sind je Ernaehrungsform fest verdrahtet
  // (STARTER) - zwei Konten mit gleichem Profil erzeugten so garantiert Dubletten, mehrfaches
  // Planen zusaetzliche. Diese Migration raeumt sie EINMALIG auf, gesteuert ueber
  // state.dedupeV1: eine Bestandskopie mit `lib`, die ihrem Katalog-Original inhaltlich
  // entspricht, wird geloescht, ihre Planeintraege wandern vorher auf die Katalog-id.
  //
  // Verglichen wird gegen sanitizeRecipe(original), NICHT gegen das rohe Katalog-Objekt -
  // sanitizeRecipe() entfernt img/portions/difficulty, ein Rohvergleich schluege deshalb immer
  // fehl. Unangetastet bleiben veraenderte Kopien, Meals ohne lib, Barcode-Produkte (quick)
  // und Favoriten - ein eigenes Foto (image) zaehlt dabei NICHT als Abweichung, es reist mit
  // der id ohnehin weiter mit (siehe rewritePlanIds()).
  const DEDUPE_FELDER = ["name", "category", "nutrition", "ingredients", "steps", "time", "tags", "mealPrep"];
  function kopieEntsprichtKatalog(kopie, original) {
    const sauber = sanitizeRecipe(original);
    return DEDUPE_FELDER.every(f => canonJSON(kopie[f]) === canonJSON(sauber[f]));
  }
  function dedupeAgainstCatalog() {
    if (state.dedupeV1) return;
    // In einer Gruppe laeuft die Migration GAR NICHT (28.08.2026). Bis dahin stand hier
    // `syncGid && !syncHandshakeOk` - sie lief also in der Gruppe, sobald der Bestand
    // vollstaendig war. Zwei Gruende sprechen dagegen, und beide sind erst durch
    // state.dedupeV1 selbst entstanden:
    //
    //   1. `dedupeV1` steht NUR im localStorage, nicht im Kontodokument (siehe dataJSON()).
    //      Es ist also ein GERAETE-Flag, kein Konto-Flag. In einer Gruppe raeumt die
    //      Migration aber nicht den eigenen Bestand auf, sondern den GEMEINSAMEN - und ein
    //      zweites Geraet, ein neuer Browser oder ein geleerter Speicher laesst sie darauf
    //      erneut los. "Einmalig" gilt nur pro Geraet, "gemeinsam" gilt fuer alle.
    //   2. Der Aufraeumschritt loescht Meals und biegt Planverweise auf die Katalog-id um.
    //      pushNow() schreibt die Loeschung VOR dem Plan (syncRecipes() vor pushGroupPlan()).
    //      Das andere Mitglied sieht also erst das "removed" - dropRecipeIds() leert dort die
    //      Slots - und erst danach den umgebogenen Plan. Sein eigener save() dazwischen
    //      schreibt die geleerten Slots zurueck: Gerichte fallen aus dem gemeinsamen Plan.
    //
    // Nichts geht verloren: Das Flag bleibt ungesetzt, und wer die Gruppe verlaesst, laeuft
    // ueber switchGroup(null) -> startCloudSync() sofort wieder hier durch - dann auf dem
    // eigenen Bestand, wo die Migration hingehoert. Die Gruppe selbst ist ohnehin beim
    // Beitritt ueber `lib` abgeglichen worden (copyOwnRecipesToGroup).
    if (syncGid) return;
    const geloescht = [];
    state.recipes.forEach(r => {
      if (!r || !r.lib || r.quick) return;               // nur Kopien mit Herkunft, keine Barcode-Produkte
      if (Array.isArray(state.favs) && state.favs.indexOf(r.id) !== -1) return;   // Favoriten unangetastet
      const original = COOKBOOK.find(x => x.id === r.lib);
      if (!original) return;                              // Herkunft gibt es im Katalog nicht mehr
      if (!kopieEntsprichtKatalog(r, original)) return;    // veraendert - bleibt stehen
      // Reihenfolge nicht verhandelbar: ERST die Planeintraege umbiegen, DANN loeschen -
      // umgekehrt wuerfe normalizePlan() sie beim naechsten Laden weg.
      rewritePlanIds(r.id, original.id);
      geloescht.push(r.id);
    });
    if (geloescht.length) state.recipes = state.recipes.filter(r => geloescht.indexOf(r.id) === -1);
    // Idempotent: Zwei gleichzeitig laufende Clients in einer Gruppe sind deshalb unkritisch,
    // das Loeschen propagiert ganz normal ueber den syncRecipes()-Diff.
    state.dedupeV1 = true;

  // ---------- Zahleneingabe: Rad am Handy, Tastatur am Rechner ----------
  // Ein <select> rendert Safari auf dem iPhone als natives Auswahlrad (UIPickerView),
  // Android als Auswahlliste. Am Rechner waere ein Aufklappmenue mit 150 Eintraegen
  // dagegen langsamer als zwei Tastenanschlaege — dort bleibt es beim Zahlenfeld.
  // Gefragt wird das Eingabegeraet ("pointer: coarse" = Finger), NICHT der User-Agent:
  // Kennungen luegen, und ein Tablet mit Maus soll die Tastatur-Variante bekommen.
  function coarsePointer() {
    try { return window.matchMedia("(pointer: coarse)").matches; } catch (e) { return false; }
  }

  // Steht die Meal-Ansicht gerade als Bottom-Sheet am unteren Rand (siehe .sheet-overlay
  // im CSS)? Hier bewusst der BREAKPOINT und nicht "pointer: coarse" wie eine Zeile darueber:
  // ueber die Darstellung entscheidet die Bildschirmbreite, und CSS und JS muessen dieselbe
  // Grenze verwenden - sonst faehrt auf einem breiten Touch-Geraet ein Sheet hoch, das gar
  // keines ist.
  function sheetLayout() {
    try { return window.matchMedia("(max-width: 560px)").matches; } catch (e) { return false; }
  }

  // Liefert je nach Eingabegeraet <input type="number"> ODER <select> — beide mit
  // derselben id. Auslesende Stellen lesen weiterhin nur .value und brauchen nicht
  // zu wissen, was davon gerendert wurde.
  // Wichtig: Ein vorhandener Wert, der nicht auf dem Raster liegt (z. B. 82,4 kg bei
  // Ganzzahl-Schritten), wird als eigene Option ergaenzt — sonst faellt er beim
  // Rendern still auf einen Nachbarwert und die Eingabe des Nutzers waere verfaelscht.
  // ACHTUNG bei o.extra: Der Wert wird als fertiges Attribut eingesetzt und deshalb
  // NICHT escaped — esc() wuerde die Anfuehrungszeichen zerstoeren und das Attribut
  // unbrauchbar machen. Hier darf ausschliesslich hartkodierter Text hinein, niemals
  // etwas aus Nutzereingaben oder gespeicherten Daten.
  // o.step muss ein glatter Wert sein (1, 5, 0.1) - die Nachkommastellen werden aus
  // seiner Textdarstellung abgeleitet.
  //
  // Ab wie vielen Eintraegen das Rad umschlaegt: Dieselbe Abwaegung wie am Rechner, nur
  // spaeter. Ein Rad gewinnt, solange man das Ziel im Vorbeiziehen sieht - beim Gewicht
  // (30-400 kg in 0,1er-Schritten) waeren es 3.701 Eintraege, und bis 82,4 kg muesste man
  // 525 Zeilen weit scrollen. Auf dem iPhone federt das Schwungrad das noch ab, Android
  // rendert eine schlichte Liste: dort war die Eingabe im Test unbenutzbar. Ab dieser
  // Grenze ist Tippen schneller, deshalb dann auch am Handy das Zahlenfeld.
  // 200 liegt bewusst zwischen Groesse (151 Eintraege, bleibt Rad) und dem ganzzahligen
  // Gewicht (371) - Alter (111) und Trainingsdauer (47) bleiben ebenfalls Rad.
  const PICKER_MAX_OPTIONS = 200;
  function numField(o) {
    const step = o.step || 1;
    const val = (o.value == null || o.value === "") ? "" : String(o.value);
    const cls = o.cls ? ` class="${o.cls}"` : "";
    const extra = o.extra ? " " + o.extra : "";
    // In Ganzzahlen rechnen: 0.1er-Schritte per Addition sammeln Rundungsfehler an.
    // Steht vor der Verzweigung, weil schon das Abzaehlen der Eintraege es braucht.
    const f = step < 1 ? Math.round(1 / step) : 1;
    const lo = Math.round(o.min * f), hi = Math.round(o.max * f), sp = Math.round(step * f);
    const optionCount = Math.floor((hi - lo) / sp) + 1;
    if (!coarsePointer() || optionCount > PICKER_MAX_OPTIONS) {
      return `<input type="number" id="${o.id}"${cls} min="${o.min}" max="${o.max}" step="${step}"`
        + ` inputmode="${step < 1 ? "decimal" : "numeric"}" placeholder="${esc(o.placeholder || "")}"`
        + ` value="${esc(val)}"${extra}>`;
    }
    // NICHT runden: Ein gespeichertes 82,4 wuerde sonst auf 82 einrasten und der Wert
    // waere ohne Zutun des Nutzers veraendert. Verglichen wird mit Toleranz, weil
    // 82.4 * 10 in Gleitkomma 824.0000000000001 ergibt.
    const num = val === "" ? null : parseFloat(val) * f;
    let onGrid = false, out = "";
    // Der value bleibt mit Punkt (parseFloat liest ihn), nur die Anzeige bekommt das
    // im Deutschen uebliche Komma — "82,4 kg" im Rad, "82.4" im Datenmodell.
    const de = t => t.replace(".", ",");
    for (let v = lo; v <= hi; v += sp) {
      const shown = f === 1 ? String(v) : (v / f).toFixed(String(step).split(".")[1].length);
      const sel = (num != null && Math.abs(num - v) < 1e-6) ? (onGrid = true, " selected") : "";
      out += `<option value="${shown}"${sel}>${de(shown)}${o.unit ? " " + esc(o.unit) : ""}</option>`;
    }
    // Wert vorhanden, aber nicht auf dem Raster: unveraendert als eigene Option.
    if (num != null && !onGrid) {
      out = `<option value="${esc(val)}" selected>${de(esc(val))}${o.unit ? " " + esc(o.unit) : ""}</option>` + out;
    }
    // Eigener Platzhaltertext fuers Rad: Im Zahlenfeld ist "0" ein grauer Hinweis,
    // als Option saehe dasselbe "0" wie ein bereits gewaehlter Wert aus.
    const ph = `<option value=""${val === "" ? " selected" : ""}>${esc(o.pickerPlaceholder || o.placeholder || "Bitte wählen")}</option>`;
    return `<select id="${o.id}"${cls}${extra}>${ph}${out}</select>`;
  }

  // ---------- Sicherheitsnetz fuer fremde Bilddaten ----------

  // ein fremder String an (etwa aus einem geteilten Plan), koennte er mit einem
  // Anfuehrungszeichen aus dem Attribut ausbrechen und eigenes JavaScript einschleusen.

  // deren Alphabet (A-Z a-z 0-9 + / =) enthaelt per Definition kein Anfuehrungszeichen.

    // Geprueft wird hier nur die FORM, nicht die Gueltigkeit: Ein Abgleich gegen PHOTOS

    // `let state = load()` und PHOTOS ist erst weiter unten als const deklariert.

    //   Uebernehmen und beim Kopieren der Beispiele in den Bestand tragen, von dort in die
    //   Cloud und in geteilte Meals - und ein spaeter ersetztes oder zurueckgezogenes Bild
    //   waere dort fuer immer eingefroren, bis es eines Tages ins Leere zeigt.
    //
    // Die Kopie verliert dadurch nichts: Sie traegt `lib` und findet ihr Bild darueber
    // (libPhoto) - auch die fuenf Startmeals aus addStarterMeals().
    delete out.img;

    // und Zutaten beschreiben denselben Gegenstand.
    //
    // Warum das kein blosses Aufraeumen war: Das Feld war widerspruechlich. Die Tagesbilanz
    // rechnete immer mit den vollen Naehrwerten des Rezepts, die Einkaufsliste dagegen mit
    // den vollen Zutatenmengen - und `portions` teilte NUR bei individuell zugewiesenen
    // Gerichten in einer Gruppe. Im Normalfall ("fuer alle") wurde es gar nicht angewandt.
    // Im eigenen Beispieldatensatz stand deshalb ein Meal mit 620 kcal, dessen Zutaten
    // (350 g Fleisch + 200 g Reis) weit ueber 1000 kcal ergeben: Naehrwerte fuer eine
    // Portion, Zutaten fuer zwei. Wer danach einkaufte, kaufte doppelt.
    //
    // Deshalb werden die MENGEN einmalig umgerechnet, statt nur das Feld zu loeschen -
    // sonst bliebe genau dieser Fehler stehen, nur ohne Erklaerung daneben. Freitext-
    // Zutaten ("Salz, Pfeffer") haben keine Menge und bleiben unberuehrt.
    //

    const pt = nutNum(r.portions);
    if (pt > 1 && Array.isArray(out.ingredients)) {
      out.ingredients = out.ingredients.map(i => {
        const o = ingObj(i);
        const g = nutNum(o.grams);

        // Auf eine Nachkommastelle runden: aus 200 g / 3 wird 66,7 g statt 66,66666667.
        return Object.assign({}, o, { grams: Math.round((g / pt) * 10) / 10 });

    // Object.assign() kopiert das Feld sonst aus Altdaten und aus geteilten Meals einfach
    // weiter mit - es haenge dann fuer immer im Datenmodell, ohne dass es je jemand liest.
    delete out.difficulty;

  }
  function sanitizeRecipes(list) { return Array.isArray(list) ? list.map(sanitizeRecipe).filter(Boolean) : []; }

  function iconSvg(key, cls) {
    const d = ICONS[key] || ICONS.pot;
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  }

  // ---------- Bilder der kuratierten Bibliothek (img/library/) ----------
  // Der Dateiname steht AM KATALOGEINTRAG (`img`) und wird NICHT aus der id abgeleitet:
  // Eine id darf einen Umlaut tragen ("rührei-avocadobrot"), ein Dateiname sollte keinen.
  // Die Ableitung muesste in JS dieselbe Slug-Regel nachbauen, die das Werkzeug in Python
  // anwendet - zwei Fassungen derselben Regel laufen frueher oder spaeter auseinander.
  //
  // Ein Eintrag OHNE `img` ist kein Fehler, sondern vorgesehen: Ein Bild, das die
  // Sichtpruefung nicht besteht, wird ausgemustert, und die Karte faellt sauber auf die
  // mitgelieferten Fotos zurueck, statt eine 404-Fehlstelle zu zeigen.
  const LIB_IMG = new Map(COOKBOOK.filter(r => r.img).map(r => [r.id, "img/library/" + r.img]));
  // Gilt fuer den Katalogeintrag selbst (`id`) UND fuer die uebernommene Kopie (`lib`).
  // Die Kopie speichert den Dateinamen bewusst nicht mit: Ein spaeter ersetztes oder
  // zurueckgezogenes Bild wirkt so sofort ueberall, und in den Nutzerdaten (Cloud, geteilte
  // Meals) liegt kein Pfad, der eines Tages ins Leere zeigt.
  function libPhoto(r) { return LIB_IMG.get(r.lib) || LIB_IMG.get(r.id) || null; }

  // Liefert IMMER ein Foto: eigenes Bild > Bibliotheksbild > kuratierter Schluessel >
  // Stichwort-Treffer > Kategorie > neutrales Bild.
  function photoFor(r) {

    // ungeschuetzt in einem src="..."-Attribut. Die Eingangspunkte filtern bereits
    // (sanitizeRecipes/safeImage), aber ein kuenftig neu hinzukommender Pfad, der
    // r.image setzt, waere hier automatisch mitabgesichert - statt die Luecke erneut
    // zu oeffnen. Greift nur fuer eigene Fotos; die mitgelieferten PHOTOS sind
    // Konstanten aus dieser Datei und brauchen keine Pruefung.
    if (r.image) { const ok = safeImage(r.image); if (ok) return ok; }
    // Das eigene Bild des Nutzers gewinnt immer, danach kommt das kuratierte
    // Bibliotheksbild - es ist fuer genau dieses Rezept erzeugt worden.
    const lib = libPhoto(r);
    if (lib) return lib;
    // Kuratierte Zuordnung vor dem Stichwortraten: Die Regeln unten sind fuer die
    // SELBST angelegten Meals des Nutzers gebaut und dort auch richtig - im Rezeptbuch
    // greifen sie aber sichtbar daneben, weil sie auf Zutaten im Namen anspringen.
    // "Gruener Smoothie mit Spinat" landete auf dem Salatfoto (Regel "spinat"),
    // "Schoko-Protein-Quark" auf Porridge (Regel "quark"), "Dattel-Nuss-Bissen mit
    // Kakao" auf einem Getraenk. An den Regeln zu drehen waere der falsche Hebel: Sie
    // wirken auf jedes Nutzer-Meal, und Teilwort-Kollisionen sind dort die bekannte
    // Falle (CLAUDE.md §22). Deshalb entscheidet beim Katalog die Kuration - ueber
    // einen SCHLUESSEL aus PHOTOS, nicht ueber einen Pfad. Ein unbekannter Schluessel
    // faellt still auf die Regeln zurueck, statt ein leeres Bild zu erzeugen.
    if (r.photo && PHOTOS[r.photo]) return PHOTOS[r.photo];

    for (const [keys, key] of PHOTO_RULES) { if (keys.some(k => n.includes(k)) && PHOTOS[key]) return PHOTOS[key]; }
    const byCat = CAT_PHOTO[r.category];
    if (byCat && PHOTOS[byCat]) return PHOTOS[byCat];
    return PHOTOS.neutral;
  }
  // Bewertet die Makro-Verteilung ueber den Kalorienanteil (Protein/Kohlenhydrate x4,
  // Fett x9) und liefert 0 bis 2 Badges fuer die Meal-Karte: ein Haupt-Badge fuer das
  // dominante Makro und optional "Low Carb" als Zusatz. Ausgewogene Gerichte bekommen
  // bewusst gar keines - sonst traegt das Badge keine Information mehr.
  function macroBadges(r) {
    const n = recipeNut(r);
    const macroKcal = n.carbs * 4 + n.protein * 4 + n.fat * 9;
    // Unter ~100 kcal ist ein Makro-Anteil reines Rauschen: ein Kaffee mit einem Schuss
    // Milch (je 1 g Makro) kaeme sonst auf 53 % Fettanteil und waere "Fettreich".
    // Prozentual richtig, als Aussage ueber das Gericht aber falsch.
    if (macroKcal < 100) return [];
    const proteinShare = (n.protein * 4) / macroKcal;
    const carbShare = (n.carbs * 4) / macroKcal;
    const fatShare = (n.fat * 9) / macroKcal;
    const out = [];
    // Haupt-Badge: nur eines von beiden. Protein geht vor Fett - ein fettreiches
    // Gericht mit viel Eiweiss ist fuer den Trainingsplan zuerst eine Eiweissquelle.
    if (proteinShare >= 0.30) out.push({ label: "Proteinreich", cls: "good" });
    else if (fatShare >= 0.45) out.push({ label: "Fettreich", cls: "fat" });

    // 15 % einer 1400-kcal-Portion waeren 52 g Kohlenhydrate - kein Low Carb mehr.
    // Steht nie allein: bei <=15 % Kohlenhydraten ergeben Protein + Fett zwingend
    // >=85 %, damit ist immer eine der beiden Schwellen oben gerissen.
    if (carbShare <= 0.15 && n.carbs <= 20) out.push({ label: "Low Carb", cls: "good" });
    return out;
  }
  function cardImageHtml(r) {

      : "";

    // Kategorie-Ueberschrift gruppiert - die Angabe war doppelt.
    return `<div class="rimg has-photo">${badges}<img class="rphoto" src="${photoFor(r)}" alt="${esc(r.name)}" loading="lazy"></div>`;

  // eager: NUR der Plan-Slot uebergibt true (siehe renderPlan()) - dort sind es hoechstens

  // ein laengst dekodiertes Bild um mindestens einen Frame, sichtbar als Aufblitzen bei jedem
  // Neuaufbau (siehe pendingWeekX-Kommentar bei render()). Meal-Raster (cardImageHtml) und

  function thumbHtml(r, cls, eager) {

      img.onload = () => {
        const maxW = 640, scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL("image/jpeg", 0.82)); } catch (err) { cb(null); }
      };
      img.onerror = () => cb(null);
      img.src = e.target.result;
    };
    reader.onerror = () => cb(null);
    reader.readAsDataURL(file);
  }

  // ---------- Rendering ----------
  const view = document.getElementById("view");

  let lastRenderTab = null;

  // die Position. Ohne diese Entkopplung ueberstimmte keepWeekX unten jeden Sprung.
  let pendingDayTarget = null;   // Index oder "today" - naechstes Sprungziel, von renderPlan() einmalig konsumiert
  let pendingWeekDir = 0;        // 1 = naechste Woche, -1 = aktuelle Woche - Richtung fuer den Uebergang
  // Waagerechte Scrollposition der Tagesleiste, von render() VOR dem Neuaufbau gemerkt und

    if (onb) return;

    const focusWasInView = view.contains(document.activeElement);
    // Scrollposition ueber den Neuaufbau retten. view.innerHTML = … wirft den ganzen
    // Inhalt weg, der Browser klemmt die Position dabei auf 0 – nach dem Einplanen
    // eines Meals landete man deshalb wieder ganz oben. Waagerecht gilt dasselbe fuer
    // die Handy-Karussells: sonst springt man von Donnerstag zurueck auf Montag.
    const sameTab = lastRenderTab === state.tab;
    const prevTab = lastRenderTab;
    lastRenderTab = state.tab;
    const keepY = sameTab ? window.scrollY : 0;
    const weekEl = view.querySelector(".week"), wgEl = view.querySelector(".wg-cols");
    // pendingWeekX statt einer lokalen Konstante: renderPlan() muss die Position noch VOR
    // resetCarousels()/initCarousel() zuruecksetzen (siehe Deklaration oben), also VOR dem
    // Punkt, an dem render() selbst wieder zu Wort kaeme. Deshalb hier nur merken, nicht mehr
    // selbst schreiben.
    pendingWeekX = sameTab && weekEl ? weekEl.scrollLeft : 0;
    const keepWgX = sameTab && wgEl ? wgEl.scrollLeft : 0;
    // Caches nur fuer die Dauer dieses Durchlaufs aufspannen; finally stellt sicher,
    // dass sie auch bei einem Fehler nicht als veraltete Kopie zurueckbleiben.
    recipeIndex = new Map(state.recipes.map(r => [r.id, r]));
    dayNutCache = {};
    try {
      document.getElementById("recipe-count").textContent = libraryRecipes().length;
      document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
      if (state.tab === "recipes") renderRecipes();
      else if (state.tab === "plan") renderPlan(sameTab);
      else if (state.tab === "progress") renderProgress();
      else renderHome();
    } finally {
      recipeIndex = null;
      dayNutCache = null;
    }
    // Fokus nur dann einfangen, wenn er beim Neuaufbau tatsaechlich verloren ging -
    // der aktive Reiter ist ein stabiler Anker, von dem aus man weitertabben kann.
    if (focusWasInView && (!document.activeElement || document.activeElement === document.body)) {
      const t = document.querySelector('.tab[aria-selected="true"]');
      if (t) t.focus();
    }
    // Erst jetzt zuruecksetzen – der neue Inhalt steht, die Seite ist wieder hoch genug.
    // Ohne Sanftlauf: das hier ist Wiederherstellen, keine Bewegung, die jemand sehen soll.
    // ".week" faehrt hier NICHT mehr mit - renderPlan() hat die Position schon direkt nach
    // view.innerHTML gesetzt (siehe pendingWeekX oben), lange bevor initCarousel() misst.
    const newWg = view.querySelector(".wg-cols");
    if (keepWgX && newWg) newWg.scrollLeft = keepWgX;
    window.scrollTo(0, keepY);
    // Gleitende Pille der unteren Tab-Leiste (Schiebe-Schema): .tabs liegt ausserhalb von
    // view.innerHTML und ueberlebt den Neuaufbau, deshalb reicht hier eine CSS-transition
    // (siehe .tab-ind im 680px-Breakpoint) statt WAAPI wie bei .week-switch.
    const tabIdx = TAB_ORDER.indexOf(state.tab);
    const tabInd = document.querySelector(".tab-ind");
    if (tabInd && tabIdx >= 0) tabInd.style.transform = "translateX(" + (tabIdx * 100) + "%)";
    // Gerichteter Inhaltswechsel nur bei echtem Tabwechsel (nicht bei jedem Cloud-Snapshot
    // oder eingeplanten Meal, die auch bei sameTab neu rendern) und NACH der Scroll-
    // Wiederherstellung oben - sonst animiert die View, waehrend ihre Position noch springt.
    if (!sameTab && prevTab != null) {
      const prevIdx = TAB_ORDER.indexOf(prevTab);
      if (prevIdx >= 0 && tabIdx >= 0) slideIn(view, Math.sign(tabIdx - prevIdx));
    }
    save();
  }

  function planStats() {
    let filled = 0;
    DAYS.forEach(d => MEALS.forEach(m => { if (state.plan[d.key][m.key].length) filled++; }));
    return filled;
  }

  // ---------- Nährwerte ----------
  function nutNum(x) { const n = Number(x); return isFinite(n) && n > 0 ? n : 0; }
  function nutParse(v) { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) && n >= 0 ? n : null; }
  function recipeNut(r) { const n = (r && r.nutrition) || {}; return { kcal: nutNum(n.kcal), carbs: nutNum(n.carbs), protein: nutNum(n.protein), fat: nutNum(n.fat) }; }
  function addNut(a, b) { return { kcal: a.kcal + b.kcal, carbs: a.carbs + b.carbs, protein: a.protein + b.protein, fat: a.fat + b.fat }; }
  // Die Tagesbilanz wird pro Render mehrfach gebraucht (Wochensumme, Ringe, Tageskarte,
  // Zaehlung der geplanten Tage). Innerhalb eines Durchlaufs aendert sich der Plan nicht,
  // also genuegt eine Berechnung je Tag - der Cache wird in render() gesetzt und geleert.
  let dayNutCache = null;
  // Von state.plan entkoppelt, damit "heute" in weekGoalHtml auch in der
  // Naechste-Woche-Ansicht gegen den Plan der AKTUELLEN Woche rechnen kann.
  // Zaehlt nur Gerichte, die tatsaechlich MICH betreffen (geteilt oder mir explizit
  // zugewiesen) - die Summe laeuft gegen das PERSOENLICHE state.goal, ein nur der anderen
  // Person zugewiesenes Gericht darf mein Kalorien-/Makroziel nicht belasten.
  function dayNutOf(plan, dayKey) {
    let s = { kcal: 0, carbs: 0, protein: 0, fat: 0 };
    MEALS.forEach(m => { plan[dayKey][m.key].forEach(entry => {
      const uids = entryUids(entry);
      if (uids && uids.indexOf(syncUid) === -1) return;
      const r = getRecipe(entryId(entry)); if (r) s = addNut(s, recipeNut(r));
    }); });
    return s;
  }
  function dayNut(dayKey) {
    if (dayNutCache && dayNutCache[dayKey]) return dayNutCache[dayKey];
    const s = dayNutOf(state.plan, dayKey);
    if (dayNutCache) dayNutCache[dayKey] = s;
    return s;
  }
  function weekNut() { let s = { kcal: 0, carbs: 0, protein: 0, fat: 0 }; DAYS.forEach(d => { s = addNut(s, dayNut(d.key)); }); return s; }
  function hasNut(s) { return !!(s.kcal || s.carbs || s.protein || s.fat); }
  function nfmt(n) { return Math.round(n).toLocaleString("de-DE"); }

  // Gemeinsamer Helfer fuer die Makro-Kompaktzeile (CLAUDE.md, Abschnitt "Makros und
  // Nährwerte"): Kuerzel KH/P/F, Reihenfolge KH->P->F, kein "g". kcal rendert jeder
  // Aufrufer selbst - jede Stelle hat ihr eigenes Kcal-Markup (Karte, Zutatenzeile,
  // Tagesbilanz, aufgeklapptes Makrofeld unterscheiden sich dort bewusst nicht im
  // Vokabular, nur in der Umgebung). Fehlende Felder (null/undefined) werden ausgelassen
  // statt als "0" zu erscheinen - noetig fuer .ing-brief, wo einzelne Felder leer sein
  // koennen. `fmt` erlaubt eine Nachkommastelle statt zu runden (ebenfalls .ing-brief).
  // Farbe traegt der Punkt (.mv::before), nicht der Text - dasselbe Signal wie in den
  // .nutfacts-Kacheln. Vorher war es hier umgekehrt (eingefaerbter Text, kein Punkt), wodurch
  // Kompaktzeile und Kacheln wie zwei fremde Bauteile wirkten. Nebeneffekt: eingefaerbter
  // Text bei 11,5 px ist beim Kontrast immer grenzwertig, ein Punkt daneben nicht - die
  // Farbe ist damit nicht mehr alleiniger Bedeutungstraeger (siehe Kommentar bei den Tokens).
  function macroLineHtml(n, fmt) {
    fmt = fmt || (v => Math.round(v).toLocaleString("de-DE"));
    const parts = [];
    if (n.carbs != null) parts.push(`<span class="mv t-carb">${fmt(n.carbs)} KH</span>`);
    if (n.protein != null) parts.push(`<span class="mv t-prot">${fmt(n.protein)} P</span>`);
    if (n.fat != null) parts.push(`<span class="mv t-fat">${fmt(n.fat)} F</span>`);
    return parts.join("");
  }

  // ---------- Strukturierte Zutaten ----------
  // Eine Zutat ist entweder ein String (Altbestand, reiner Freitext) oder ein Objekt
  // { name, grams, unit, kcal, carbs, protein, fat }. `grams` ist die eingesetzte Menge
  // (der Feldname bleibt aus Kompatibilitaet, siehe Namensdualitaet in CLAUDE.md), `unit`
  // sagt worin: "g", "ml" oder "st" (Stueck). Fehlendes `unit` = "g" — so bleiben alle
  // Altbestaende gueltig. Die Naehrwerte gelten pro 100 g / pro 100 ml bzw. PRO STUECK;
  // ingContrib rechnet entsprechend hoch. (ING_UNITS selbst steht ganz oben im Script,
  // weil sanitizeIng schon von load() gebraucht wird - eine const hier waere zu diesem
  // fruehen Zeitpunkt noch nicht initialisiert und haette das ganze Script abgebrochen.
  // Echter Absturz auf dem Live-Server gewesen, siehe Commit-Historie.)
  function ingUnit(o) { const u = o && o.unit; return ING_UNITS.indexOf(u) >= 0 ? u : "g"; }
  function unitShort(u) { return ({ st: "Stück", el: "EL", tl: "TL" })[u] || u; }
  // Bezugsgroesse der Naehrwertfelder — bei Stueck/EL/TL gibt es keine 100er-Basis,
  // der Naehrwert gilt direkt je Einheit. Steht als Zusatz in der Kopfzeile neben
  // "Makros" (aehnliches Muster wie die Ueberschrift "Makros gesamt" in der Meal-Ansicht).
  function ingPerLabel(u) {
    if (u === "st") return "· je Stück";
    if (u === "el" || u === "tl") return "· je " + unitShort(u);
    return "· je 100 " + u;
  }
  function ingObj(i) { return (i && typeof i === "object") ? i : { name: String(i == null ? "" : i) }; }
  function ingLabel(i) {
    const o = ingObj(i), n = String(o.name || "").trim(), q = nutNum(o.grams);
    return q ? qtyLabel(q, ingUnit(o)) + " " + n : n;
  }
  function ingHasNut(i) { const o = ingObj(i); return o.kcal != null || o.carbs != null || o.protein != null || o.fat != null; }
  function ingContrib(i) {
    const o = ingObj(i);
    const u = ingUnit(o);
    // Stueck/EL/TL: Naehrwert gilt je Einheit (×Menge). g/ml: Naehrwert gilt je 100 (×Menge/100).
    const f = (u === "st" || u === "el" || u === "tl") ? nutNum(o.grams) : nutNum(o.grams) / 100;
    return { kcal: nutNum(o.kcal) * f, carbs: nutNum(o.carbs) * f, protein: nutNum(o.protein) * f, fat: nutNum(o.fat) * f };
  }
  // Naehrwerte je Zutat nur dort, wo sie etwas aussagen.
  //
  // Eine Loeffelmenge Gewuerz traegt im Katalog zwischen 0 und 14 kcal bei - weniger als die
  // Rundung des Rezepts selbst - und fuellt die Zeile mit "0 kcal · 0 KH 0 P 0 F". Das ist
  // keine Information, sondern Rauschen an der Stelle, an der der Blick nach der Menge sucht.
  //
  // Die kcal-Grenze steht bewusst NEBEN der Einheit statt allein: Nach reinen Kalorien
  // liesse sich nicht trennen, was zu trennen ist - 1 TL Vanilleextrakt und 100 g Gurke
  // liegen beide bei 12 kcal. Und ein ESSloeffel Oel sind 90 kcal; die gehoeren sichtbar,
  // auch wenn die Einheit dieselbe ist. Erst beides zusammen trifft die Gewuerze und nur sie.
  const ING_NUT_MIN_KCAL = 15;
  // Was hier "Wuerze" heisst: eine Zutat in Loeffelmengen, die kaum Kalorien traegt - Salz,
  // Pfeffer, Backpulver, getrocknete Kraeuter. Es ist EIN Begriff mit ZWEI Folgen, und
  // deshalb steht er auch nur einmal da:
  //   * ihre Naehrwertzeile entfaellt (ingShowsNut) - sie zeigte "0 kcal · 0 KH 0 P 0 F"
  //   * in der Einkaufsliste zaehlt nur, DASS man sie braucht (buildShoppingList)
  // Zwei getrennte Schwellen fuer dieselbe Frage wuerden auseinanderlaufen, sobald eine
  // davon angefasst wird.
  //
  // Die Grenze steht bewusst NEBEN der Einheit statt allein auf den Kalorien: 1 TL
  // Vanilleextrakt und 100 g Gurke liegen beide bei 12 kcal, und ein ESSloeffel Oel sind
  // 90 kcal - Oel ist keine Wuerze, weder in der Anzeige noch beim Einkauf.
  function ingIsSeasoning(i) {
    const o = ingObj(i), u = ingUnit(o);
    if (u !== "el" && u !== "tl") return false;
    if (!nutNum(o.grams)) return false;
    return !ingHasNut(o) || ingContrib(o).kcal < ING_NUT_MIN_KCAL;
  }
  function ingShowsNut(i) {
    const o = ingObj(i);
    if (!ingHasNut(o) || !nutNum(o.grams)) return false;
    return !ingIsSeasoning(o);
  }
  // Brueche statt Dezimalstellen bei Loeffelmengen: "½ TL" ist die Schreibweise, in der
  // Rezepte dosiert werden - "0,5 TL" liest sich wie ein Messprotokoll.
  //
  // NUR Viertel und Halbe, und das ist keine Bequemlichkeit: ¼ ½ ¾ stehen in WinAnsi und
  // ueberleben damit den PDF-Export der Einkaufsliste (WINANSI in lib/pdf.js). ⅓ und ⅔ tun
  // das NICHT - sie wuerden dort als "?" landen, derselbe Fehler wie einst beim "×".
  // Wer hier ein Zeichen ergaenzt, ergaenzt es auch dort.
  const BRUCH = { 25: "¼", 50: "½", 75: "¾" };
  function bruchLabel(n) {
    const ganz = Math.floor(n), rest = BRUCH[Math.round((n - ganz) * 100)];
    if (!rest) return null;              // krumme Menge (0,3 TL) bleibt dezimal
    return ganz ? ganz + rest : rest;    // "1½", aber "½" statt "0½"
  }
  // Menge lesbar machen: ab 1000 auf die grosse Einheit (2800 ml -> 2,8 L, 1500 g -> 1,5 kg).
  function qtyLabel(n, u) {
    if (u === "st") return numLabel(n) + "×"; // "35× Ei" liest sich besser als "35 Stück Ei"
    if (u === "el" || u === "tl") return (bruchLabel(n) || numLabel(n)) + " " + unitShort(u);
    if (n >= 1000) return numLabel(Math.round(n / 10) / 100) + (u === "ml" ? " L" : " kg");
    return numLabel(n) + " " + u;
  }
  function numLabel(n) { return (Math.round(n * 100) / 100).toLocaleString("de-DE"); }
  // Import/Sync-Sicherung: fremde Zutaten-Eintraege auf die zwei erlaubten Formen bringen
  function sanitizeIng(x) {
    if (x == null) return null;
    if (typeof x !== "object") { const s = String(x).trim(); return s || null; }
    const name = String(x.name || "").trim(); if (!name) return null;
    const o = { name };
    ["grams", "kcal", "carbs", "protein", "fat"].forEach(k => { const v = nutParse(x[k]); if (v != null) o[k] = v; });
    if (ING_UNITS.indexOf(x.unit) > 0) o.unit = x.unit; // "g" ist Default, muss nicht mit
    return Object.keys(o).length > 1 ? o : name;
  }

  // Umlaute auf den Grundbuchstaben ziehen, damit "kase", "kaese" und "käse" alle
  // denselben Schluessel ergeben und den Harzer Käse finden. Erst ß, dann die Umlaute,
  // zuletzt die ausgeschriebenen Varianten — sonst bliebe "kaese" auf halbem Weg stehen.
  function foodNorm(s) {
    return String(s == null ? "" : s).toLowerCase()
      .replace(/ß/g, "ss")
      .replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")
      .replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");
  }
  // Der Suchindex wird beim ersten Tippen einmal aufgebaut, nicht beim Laden der Seite.
  let foodIdx = null;
  function foodList() {
    if (!foodIdx) foodIdx = FOODS.map(f => ({
      name: f[0], kcal: f[1], carbs: f[2], protein: f[3], fat: f[4],
      unit: ING_UNITS.indexOf(f[5]) > 0 ? f[5] : "g",
      stk: nutNum(f[7]),
      key: foodNorm(f[0] + (f[6] ? " " + f[6] : ""))
    }));
    return foodIdx;
  }
  // Rangfolge: Treffer am Wortanfang zuerst, dann am Anfang eines spaeteren Wortes,
  // dann irgendwo mittendrin. Sonst schlaegt "reis" die Preiselbeere vor dem Reis vor.
  // Die Liste kommt als Parameter, damit Zutatenzeile (foodSearch) und Schnelleintrag
  // (pieceSearch) dieselbe Rangfolge und dieselbe Normalisierung benutzen.
  function rankFoods(list, q, max) {
    const n = foodNorm(q).trim();
    if (n.length < 2) return [];
    const a = [], b = [], c = [];
    list.forEach(f => {
      const i = f.key.indexOf(n);
      if (i < 0) return;
      if (i === 0) a.push(f);
      else if (/[\s,/-]/.test(f.key.charAt(i - 1))) b.push(f);
      else c.push(f);
    });
    return a.concat(b, c).slice(0, max || 8);
  }
  function foodSearch(q, max) { return rankFoods(foodList(), q, max); }

  // ---------- Schnelleintrag: zaehlbare Lebensmittel ----------
  // Ein Apfel ist kein Meal. Wer eine Banane einplanen will, soll nicht durch das
  // Meal-Formular muessen - dieselbe Idee wie beim Barcode-Schnellzugriff, nur ohne Kamera.
  // Zaehlbar heisst hier: ein Stueck ist eine natuerliche Portion. Zwei Quellen, eine Liste:
  // Eintraege, deren Naehrwerte schon je Stueck gelten (unit "st", z. B. das Ei), und
  // Eintraege mit hinterlegtem Stueckgewicht - deren 100-g-Werte werden einmal aufs Stueck
  // hochgerechnet und danach nie wieder umgerechnet.
  // Bewusst KEINE Scheiben und keine Handvoll: dafuer braeuchte jede Zeile ein eigenes
  // Mengenwort, und "1 Stueck Brot" waere schlicht falsch.
  let pieceIdx = null;
  function pieceFoods() {
    if (!pieceIdx) pieceIdx = foodList().filter(f => f.unit === "st" || f.stk > 0).map(f => {
      const g = f.unit === "st" ? 0 : f.stk;   // 0 = schon je Stueck erfasst, kein Gewicht bekannt
      const k = g ? g / 100 : 1;
      const r1 = v => Math.round(nutNum(v) * k * 10) / 10;
      return {
        name: f.name, key: f.key, grams: g,
        kcal: Math.round(nutNum(f.kcal) * k), carbs: r1(f.carbs), protein: r1(f.protein), fat: r1(f.fat),
      };
    });
    return pieceIdx;
  }
  function pieceSearch(q, max) { return rankFoods(pieceFoods(), q, max); }
  // Vorschlag ohne Suchbegriff: kurze, feste Auswahl statt der ganzen Liste - sonst laeuft
  // der Schnellbereich der Meal-Liste im Picker den Rang ab. Namen muessen exakt so in FOODS
  // stehen; der Pruefstand (docs/TESTING.md) faengt Tippfehler ab, hier wird still uebergangen,
  // was nicht aufloest.
  const PIECE_TOP = ["Apfel", "Banane", "Mandarine", "Ei, Größe M", "Kiwi", "Vollkornbrötchen"];
  function pieceTop() {
    return PIECE_TOP.map(n => pieceFoods().find(f => f.name === n)).filter(Boolean);
  }

  // Live-Scanner: Kamerabild statt Einzelfoto — man haelt den Barcode in den Rahmen,
  // die Suche startet von selbst. Der Kamera-Lifecycle ist hier die heikelste Stelle:
  // eine weiterlaufende Kamera ist ein Vertrauensbruch, kein Schoenheitsfehler. Deshalb
  // gibt es genau EINE Abbaustelle (cleanup), sie ist mehrfach aufrufbar, und jeder
  // Ausgang laeuft durch sie — Treffer, Abbruch, Fehler, Tabwechsel, Seite verlassen.
  // Aufloesung: { code } bei Treffer, { photo:true } bei Ausweichen aufs Foto,
  // { cancelled:true } bei Abbruch.
  let liveScanStop = null;
  // opts: { formats, title, hint, photoFallback } - alle optional. Standardmaessig unveraendert
  // (Zutaten-Barcode). Der Einladungs-Scan (scanInvite()) uebergibt QR_FORMATS, einen eigenen
  // Titel/Hinweis und blendet den Foto-Ausweg aus (ein QR laesst sich nicht sinnvoll aus einem
  // Einzelfoto nachtraeglich lesen wie ein Barcode).
  function scanBarcodeLive(opts) {
    opts = opts || {};
    const formats = opts.formats || BARCODE_FORMATS;
    const title = opts.title || "Barcode scannen";
    const readyHint = opts.hint || "Halte den Barcode in den Rahmen …";
    const showPhoto = opts.photoFallback !== false;
    return new Promise(resolve => {
      let stream = null, reader = null, timer = 0, done = false;
