        row.classList.remove("ac-open");
        nameInp.setAttribute("aria-expanded", "false");
        nameInp.removeAttribute("aria-activedescendant");
      }
      function acMark(i) {
        acCur = i;
        Array.prototype.forEach.call(acBox.children, (li, n) => {
          const on = n === i;
          li.classList.toggle("on", on);
          li.setAttribute("aria-selected", on ? "true" : "false");
        });
        if (i >= 0) {
          nameInp.setAttribute("aria-activedescendant", acId + "-" + i);
          const li = acBox.children[i];
          if (li && li.scrollIntoView) li.scrollIntoView({ block: "nearest" });
        } else nameInp.removeAttribute("aria-activedescendant");
      }
      function acShow() {
        acHits = foodSearch(nameInp.value, 8);
        if (!acHits.length) { acClose(); return; }
        acBox.innerHTML = acHits.map((f, n) =>
          `<li class="ing-ac-item" role="option" aria-selected="false" id="${acId}-${n}">` +
          `<span class="fname">${esc(f.name)}</span>` +
          `<span class="fnut">${nfmt(f.kcal)} kcal ${ingPerLabel(f.unit)}</span></li>`).join("");
        acBox.hidden = false; acOpen = true;
        row.classList.add("ac-open");
        nameInp.setAttribute("aria-expanded", "true");
        acMark(-1);
      }
      function acPick(i) {
        const f = acHits[i];
        if (!f) return;
        nameInp.value = f.name;
        uSel.value = f.unit;
        prevUnit = f.unit; // sonst wuerde ein direkt folgender manueller Wechsel mit einer veralteten Ausgangseinheit umrechnen
        row.querySelector(".ing-kcal").value = f.kcal;
        row.querySelector(".ing-carbs").value = f.carbs;
        row.querySelector(".ing-prot").value = f.protein;
        row.querySelector(".ing-fat").value = f.fat;
        acClose();
        syncUnit(); // zieht Bezugsgroesse, Scan-Button und die Makro-Summe nach
        row.querySelector(".ing-g").focus(); // jetzt fehlt nur noch die Menge
      }
      nameInp.addEventListener("input", acShow);
      nameInp.addEventListener("blur", acClose);
      nameInp.addEventListener("keydown", e => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (!acOpen) { acShow(); if (!acOpen) return; }
          e.preventDefault();
          let n = acCur + (e.key === "ArrowDown" ? 1 : -1);
          if (n < 0) n = acHits.length - 1;
          if (n >= acHits.length) n = 0;
          acMark(n);
        } else if (e.key === "Enter" && acOpen && acCur >= 0) {
          e.preventDefault(); acPick(acCur);
        } else if (e.key === "Escape" && acOpen) {
          e.preventDefault();
          e.stopPropagation(); // nur die Liste schliessen, nicht das ganze Modal
          acClose();
        } else if (e.key === "Tab") acClose();
      });
      // mousedown abfangen: sonst verliert das Feld den Fokus und blur schliesst die
      // Liste, bevor der Klick ueberhaupt ankommt.
      acBox.addEventListener("mousedown", e => e.preventDefault());
      acBox.addEventListener("click", e => {
        const li = e.target.closest(".ing-ac-item");
        if (li) acPick(Array.prototype.indexOf.call(acBox.children, li));
      });

      // Zeile verlassen (Ruhezustand-Wechsel, neu): Enter schliesst, ausser eine offene
      // Vorschlagsliste hat gerade Vorrang (siehe acPick() oben). Fokusverlust aus der
      // ganzen Zeile heraus (nicht nur aus einem Feld ins naechste) schliesst ebenfalls.
      row.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        if (e.target.classList.contains("ing-name") && acOpen) return;
        e.preventDefault();
        closeIngRow(row);
      });
      row.addEventListener("focusout", () => {
        if (!row.classList.contains("editing")) return;
        setTimeout(() => { if (!row.contains(document.activeElement)) closeIngRow(row); }, 0);
      });

      ingsWrap.appendChild(row);
      updateEmptyIngNote();
      return row;
    }
    function rowData(row) {
      const name = row.querySelector(".ing-name").value.trim();
      if (!name) return null;
      const o = { name };
      const grams = nutParse(row.querySelector(".ing-g").value);
      const kcal = nutParse(row.querySelector(".ing-kcal").value);
      const carbs = nutParse(row.querySelector(".ing-carbs").value);
      const protein = nutParse(row.querySelector(".ing-prot").value);
      const fat = nutParse(row.querySelector(".ing-fat").value);
      if (grams == null && kcal == null && carbs == null && protein == null && fat == null) return name; // reiner Freitext wie frueher
      const unit = row.querySelector(".ing-u").value;
      if (grams != null) o.grams = grams;
      if (unit !== "g") o.unit = unit; // "g" ist Default und bleibt ungespeichert
      if (kcal != null) o.kcal = kcal;
      if (carbs != null) o.carbs = carbs;
      if (protein != null) o.protein = protein;
      if (fat != null) o.fat = fat;
      return o;
    }
    function collectIngs() { return Array.from(ingsWrap.querySelectorAll(".ing-row")).map(rowData).filter(Boolean); }
    // Summe aller Zutaten (auf Menge hochgerechnet) → Makro-Felder; die Felder bleiben
    // dabei IMMER von Hand editierbar (frueher gesperrt, solange Zutaten Naehrwerte
    // hatten). Tippt der Nutzer selbst hinein, gilt sein Wert ab da als Uebersteuerung
    // und wird von weiteren Zutaten-Aenderungen nicht mehr ueberschrieben, bis er per
    // "Automatisch uebernehmen" wieder zurueckgesetzt wird.
    let macroOverridden = false;
    // Weicht das GESPEICHERTE nutrition von der Zutatensumme ab? Dann war es von Hand
    // gesetzt. Genau daraus wird macroOverridden beim Oeffnen abgeleitet (siehe unten beim
    // Aufruf) - ein neues Datenfeld braucht es dafuer nicht.
    function macroWeichtAb(zutaten) {
      const n = initial.nutrition;
      if (!n) return false;                       // nichts gespeichert - nichts uebersteuert
      // Aus den DATEN rechnen, nicht aus dem DOM: Der Aufruf muss VOR dem Aufbau der
      // Zutatenzeilen stehen (siehe dort), und da gibt es noch keine Zeilen zu lesen.
      const summe = ingSummeAus(zutaten);
      if (!summe) return false;                   // ohne Zutatensumme gibt es nichts zu vergleichen
      // Auf dieselbe Genauigkeit runden, in der updateMacroSum() schreibt: sonst gilt ein
      // Rundungsrest als Uebersteuerung, und "Automatisch uebernehmen" staende dauerhaft da.
      const r0 = v => Math.round(v || 0), r1 = v => Math.round((v || 0) * 10) / 10;
      return r0(n.kcal) !== r0(summe.kcal) || r1(n.carbs) !== r1(summe.carbs)
          || r1(n.protein) !== r1(summe.protein) || r1(n.fat) !== r1(summe.fat);
    }
    // Die Summe der Zutaten mit Naehrwerten, oder null, wenn es keine gibt. Eine Quelle fuer
    // updateMacroSum() und macroWeichtAb() - zwei Kopien derselben Bedingung waeren genau die
    // Sorte Duplikat, bei der die eine Seite spaeter etwas anders zaehlt als die andere.
    function ingSummeAus(liste) {
      const withNut = (liste || []).map(ingObj)
        .filter(i => typeof i === "object" && nutNum(i.grams) && ingHasNut(i));
      if (!withNut.length) return null;
      let s = { kcal: 0, carbs: 0, protein: 0, fat: 0 };
      withNut.forEach(i => { s = addNut(s, ingContrib(i)); });
      return s;
    }
    function ingSumme() { return ingSummeAus(collectIngs()); }
    function updateMacroSum() {
      const s = ingSumme();
      const auto = !!s;
      if (auto && !macroOverridden) {
        node.querySelector("#f-kcal").value = Math.round(s.kcal);
        node.querySelector("#f-carbs").value = Math.round(s.carbs * 10) / 10;
        node.querySelector("#f-protein").value = Math.round(s.protein * 10) / 10;
        node.querySelector("#f-fat").value = Math.round(s.fat * 10) / 10;
      }
      // Erklaertext gestrichen (CLAUDE.md §7) - "Summe aus Zutaten" und "automatisch
      // summiert" sagen nur, was die Zahlen ohnehin zeigen. "manuell angepasst" bleibt:
      // das begruendet, warum daneben "Automatisch uebernehmen" erscheint.
      const hint = node.querySelector("#f-nut-hint");
      const resetBtn = node.querySelector("#f-nut-reset");
      const overridden = auto && macroOverridden;
      hint.textContent = overridden ? "– manuell angepasst" : "";
      hint.hidden = !overridden;
      resetBtn.hidden = !overridden;
      // "+ Weitere Zutat" erst zeigen, wenn die erste Zutat einen Namen hat - sonst wirkt
      // das Formular ueberladen, bevor ueberhaupt etwas eingetragen wurde. (Der Knopf
      // selbst bleibt dauerhaft unsichtbar, siehe Markup-Kommentar bei #f-ing-add.)
      node.querySelector("#f-ing-add").hidden = ![...ingsWrap.querySelectorAll(".ing-name")].some(inp => inp.value.trim());
    }
    ["f-kcal", "f-carbs", "f-protein", "f-fat"].forEach(fid => {
      node.querySelector("#" + fid).addEventListener("input", () => { macroOverridden = true; updateMacroSum(); });
    });
    node.querySelector("#f-nut-reset").addEventListener("click", () => { macroOverridden = false; updateMacroSum(); commitNow(); });
    // Zutaten des bestehenden Meals (Ruhezustand), sonst die Vorbefuellung aus dem
    // Barcode-Schnellzugriff (Naehrwerte je 100 g ohne Menge - startet im
    // Bearbeiten-Zustand, weil die Menge noch fehlt). Ohne Zutaten bleibt die Liste leer,
    // "Noch keine Zutaten" steht dann ueber dem Knopf (updateEmptyIngNote).
    const startIngs = (initial.ingredients && initial.ingredients.length) ? initial.ingredients
      : (isNew && pre && pre.ingredients && pre.ingredients.length ? pre.ingredients : []);
    // macroOverridden aus den DATEN ableiten statt bei false zu starten. Die Uebersteuerung
    // ist eine Eigenschaft des MEALS, kein Sitzungszustand - und als Sitzungszustand hat sie
    // Daten zerstoert: Wer seine Makros von Hand gesetzt hatte, verlor sie beim naechsten
    // OEFFNEN des Editors, ohne etwas zu tun. Im Pruefstand wurden aus 500 kcal beim blossen
    // Hineinsehen 440, und der erste commitNow() schrieb das fest.
    //
    // Die Zeile MUSS hier stehen, VOR dem Aufbau der Zeilen: addIngRow()/openIngEdit() rufen
    // updateMacroSum() bereits selbst, und genau dieser Aufruf ueberschreibt die Felder,
    // solange die Marke noch false ist. Eine Ableitung nach der Schleife kam nachweislich zu
    // spaet - der Reset-Knopf erschien dann korrekt, im Feld stand aber schon die Summe.
    macroOverridden = macroWeichtAb(startIngs);
    startIngs.forEach(i => {
      const o = ingObj(i);
      const row = addIngRow(o);
      if (o.name && nutNum(o.grams)) paintIngView(row); else openIngEdit(row);
    });
    updateMacroSum();
    node.querySelector("#ms-ing-add").addEventListener("click", () => {
      const row = addIngRow();
      openIngEdit(row, true);
    });
    // Kategorie -> Getraenk gewechselt: noch unberuehrte Zutatenzeilen (kein Name, keine
    // Menge, Einheit noch auf dem "g"-Default) auf ml umstellen. Bereits befuellte Zeilen
    // bleiben unangetastet, damit keine bewusst gewaehlte Einheit ueberschrieben wird.
    node.querySelector("#f-cat").addEventListener("change", (e) => {
      if (e.target.value !== "Getränk") return;
      ingsWrap.querySelectorAll(".ing-row").forEach(row => {
        const nameEl = row.querySelector(".ing-name"), gEl = row.querySelector(".ing-g"), uEl = row.querySelector(".ing-u");
        if (!nameEl.value && !gEl.value && uEl.value === "g") { uEl.value = "ml"; uEl.dispatchEvent(new Event("change")); }
      });
    });
    // Barcode -> Open Food Facts -> Zeile fuellen. Gemeinsamer Weg fuer beide Zugaenge
    // (Live-Kamera und Einzelfoto). Der Scan ersetzt die Zeile vollstaendig: Einheit
    // (g, oder bei erkannter Stueckzahl "Stück" - siehe offServingSize), alle vier
    // Naehrwerte UND den Namen. Den Namen
    // auszunehmen waere inkonsequent — er ist die Identitaet des gescannten Produkts,
    // keine persoenliche Notiz. Liefert der Treffer keinen Namen, bleibt der bisherige
    // stehen, statt ihn gegen nichts zu tauschen. Die Rueckmeldung nennt das erkannte
    // Produkt, damit ein ersetzter Name nicht wortlos verschwindet.
    async function applyBarcode(row, code) {
      const btn = row.querySelector(".ing-barcode");
      btn.disabled = true; btn.classList.add("busy");
      toast("Suche Produkt …");
      try {
        const p = await fetchOffNutrition(code);
        if (!p) { toast("Produkt nicht gefunden – bitte manuell eintragen"); return; }
        if (p.name) row.querySelector(".ing-name").value = p.name;
        // Reihenfolge bewusst so: das change-Event fuer die Einheit laeuft ZUERST, waehrend
        // die Naehrwertfelder noch ihre ALTEN Werte tragen - eine dabei ausgeloeste Umrechnung
        // (convertNutValues, z. B. falls die Zeile zuvor auf EL/TL stand) betrifft dann nur
        // Werte, die im naechsten Moment ohnehin durch die echten Barcode-Werte ueberschrieben
        // werden. Wuerden die Naehrwerte VOR dem change-Event gesetzt, liefe die
        // EL/TL-Umrechnung auf den frisch gesetzten (schon korrekten Pro-100g-)Werten und
        // wuerde sie verfaelschen.
        // Stueckerkennung ueber offServingSize(): nur bei erkannter Stueckzahl (z. B.
        // "1 Stück (65 g)") auf "Stück" umschalten und die Naehrwerte von je-100g auf
        // je-Stück umrechnen - bei reinen Gewichtsangaben ("500 g") bleibt es bei "g",
        // sonst wuerde aus einer Mehltuete "1 Stück Mehl".
        const ss = p.servingSize;
        const perPiece = ss && ss.count ? ss.grams / 100 : null;
        row.querySelector(".ing-u").value = perPiece ? "st" : "g";
        row.querySelector(".ing-u").dispatchEvent(new Event("change"));
        if (p.kcal != null) row.querySelector(".ing-kcal").value = perPiece ? Math.round(p.kcal * perPiece) : Math.round(p.kcal);
        if (p.carbs != null) row.querySelector(".ing-carbs").value = perPiece ? Math.round(p.carbs * perPiece * 10) / 10 : p.carbs;
        if (p.protein != null) row.querySelector(".ing-prot").value = perPiece ? Math.round(p.protein * perPiece * 10) / 10 : p.protein;
        if (p.fat != null) row.querySelector(".ing-fat").value = perPiece ? Math.round(p.fat * perPiece * 10) / 10 : p.fat;
        if (perPiece) row.querySelector(".ing-g").value = 1;
        // Paket B7 (Fund beim Durchsehen): .value setzen loest kein "input"-Event aus (das
        // tut nur echte Tastatureingabe) - die zugeklappte Kurzfassung der Zeile (paintNut,
        // reagiert auf "input") zeigte nach einem Barcode-Scan deshalb weiterhin "–", obwohl
        // die Werte laengst korrekt im DOM standen. Ein manuelles "input" auf einem der Felder
        // stoesst die Kurzfassung an, OHNE erneut ueber das Einheiten-change-Event (und damit
        // die Umrechnung) zu laufen.
        row.querySelector(".ing-kcal").dispatchEvent(new Event("input"));
        updateMacroSum();
        toast(p.name ? "„" + p.name + "“ übernommen – Werte bitte kurz prüfen"
                     : "Nährwerte übernommen – bitte kurz prüfen");
      } catch (e) {
        toast("Suche nicht möglich (offline?) – bitte manuell eintragen");
      } finally {
        btn.disabled = false; btn.classList.remove("busy");
      }
    }
    // Einstieg ueber den Zeilen-Button: erst Live-Kamera; wer dort aufs Foto ausweicht
    // (oder wessen Kamera nicht startet), landet auf dem bisherigen Foto-Weg.
    async function startBarcodeFlow(row) {
      const r = await scanBarcodeLive();
      if (!r || r.cancelled) return;
      if (!row.isConnected) return; // Zeile inzwischen entfernt
      if (r.photo) { barcodeRow = row; barcodeInput.click(); return; }
      if (r.code) await applyBarcode(row, r.code);
    }
    // Foto-Weg: Bild -> Code lokal auslesen -> gemeinsamer Nachschlage-Pfad
    barcodeInput.addEventListener("change", async () => {
      const f = barcodeInput.files && barcodeInput.files[0];
      barcodeInput.value = "";
      const row = barcodeRow; barcodeRow = null;
      if (!f || !row || !row.isConnected) return;
      const btn = row.querySelector(".ing-barcode");
      btn.disabled = true; btn.classList.add("busy");
      toast("Lese Barcode …");
      let code = null, failed = false;
      try {
        code = await detectBarcode(f);
      } catch (e) {
        failed = true;
        toast("Erkennung nicht möglich (offline?) – bitte manuell eintragen");
      } finally {
        btn.disabled = false; btn.classList.remove("busy");
      }
      if (failed) return;
      if (!code) { toast("Kein Barcode erkannt – bitte näher heran oder manuell eintragen"); return; }
      await applyBarcode(row, code);
    });

    // Eigenes Fokusziel statt der openModal()-Standardsuche (die faende sonst den
    // Teilen-Icon-Knopf im .modal-head, das erste fokussierbare Element im Markup).
    openModal(node, { focus: node.querySelector("#f-name"), overlayClass: asSheet ? "sheet-overlay" : "" });
    playEnter(node);
  }

  // Ruhezustand-Zeile im Nur-Lese-Zweig von openMealSheet() - liest direkt aus dem
  // Zutaten-Objekt (kein Formular-DOM vorhanden), nutzt dieselben Helfer qtyLabel()/
  // ingContrib() wie paintIngView() im Bearbeiten-Zweig.
  function roIngRowHtml(i) {
    const o = ingObj(i);
    const qty = nutNum(o.grams) ? qtyLabel(nutNum(o.grams), ingUnit(o)) : "";
    let kcalHtml = "", macHtml = "";
    if (ingShowsNut(o)) {
      const c = ingContrib(o);
      kcalHtml = `<span class="ing-view-kcal">${nfmt(c.kcal)} kcal</span>`;
      macHtml = `<span class="ing-view-macros">${macroLineHtml(c)}</span>`;
    }
    return `<div class="ing-view ro">
      <span class="ing-view-qty">${esc(qty)}</span>
      <span class="ing-view-name">${esc(o.name)}</span>
      ${kcalHtml}
      ${macHtml}
    </div>`;
  }
  // ---------- Picker ----------
  // Woraus die Handauswahl fuer einen Slot schoepft. Seit dem 17.08.2026 dieselbe Menge wie
  // beim Auto-Planer: eigener Bestand PLUS Rezeptbuch. Vorher durfte der Planer aus 34
  // Katalog-Rezepten waehlen und der Mensch nur aus dem eigenen Bestand - eine Asymmetrie,
  // die mit dem Katalog-Umbau erst richtig auffiel, weil der Bestand seitdem nicht mehr bei
  // jedem Planerlauf mitwaechst.
  //
  // Bewusst NICHT planKandidaten() wiederverwendet, obwohl die Quellen dieselben sind: Der
  // Planer muss rechnen und schliesst deshalb Meals ohne Naehrwerte aus. Von Hand darf man
  // sehr wohl ein Meal ohne Naehrwerte einplanen - dieselbe Menge zu erzwingen hiesse, dem
  // Nutzer eigene Meals vorzuenthalten, weil der Planer mit ihnen nichts anfangen kann.
  //
  // cookbookVisible() filtert ueber fitsDiet(), der Katalog kann hier also nichts anbieten,
  // was der Ernaehrungsform widerspricht. isAdopted() haelt Dubletten heraus - ein
  // uebernommenes Rezept steht schon im eigenen Bestand und kommt ueber die erste Quelle.
  //
  // `__cb` sitzt an einer FLACHEN KOPIE, nie am Katalogeintrag selbst (gleiche Begruendung
  // wie bei planKandidaten): COOKBOOK ist gemeinsamer Bestand, ein Feld daran verschmutzte
  // die Rezeptbuch-Ansicht und jede spaetere Uebernahme mit.
  function pickerQuellen() {
    const eigene = libraryRecipes();
    const katalog = cookbookVisible()
      .filter(r => !isAdopted(r.id))
      .map(r => Object.assign({}, r, { __cb: true }));
    return eigene.concat(katalog);
  }

  function openPicker(day, meal) {
    const dLabel = DAYS.find(d => d.key === day).label;
    const mLabel = MEALS.find(m => m.key === meal).label;
    // libraryRecipes() statt state.recipes: Barcode-Schnellzugriff-Produkte (quick) sind
    // fuer EINEN Tag gedacht und gehoeren nicht in eine Auswahlliste, die man beim Planen
    // durchsieht - sonst waechst sie mit jedem gescannten Riegel. Dieselbe Regel gilt
    // schon fuer den Meals-Reiter; hier lief der Picker bisher an ihr vorbei.
    //
    // Ohne ein einziges Meal gab es hier frueher einen eigenen "Noch keine Meals"-Dialog.
    // Der ist mit dem Schnelleintrag falsch geworden: eine Banane laesst sich auch ohne
    // Meal-Bibliothek einplanen. Der Hinweis samt Weg zu den Meals steht jetzt IM Picker,
    // ueber dem Schnellbereich - eine Ansicht weniger, und der Slot bleibt benutzbar.
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Meal wählen">
      <div class="modal-head"><div style="flex:1"><div class="kicker">${esc(dLabel)} · ${esc(mLabel)}</div><h3 style="margin-top:2px">Meal wählen</h3></div><button class="btn ghost sm" data-close>✕</button></div>
      <div class="modal-body">
        <div class="picker-search">
          <input type="text" id="p-search" placeholder="Meal oder Lebensmittel …" autocomplete="off">
          <button type="button" class="btn ghost sm" id="p-barcode" aria-label="Barcode scannen – Fertigprodukt direkt einplanen" title="Barcode scannen – Fertigprodukt direkt einplanen">${BARCODE_SVG}<span>Barcode</span></button>
        </div>
        <div class="plist" id="p-list"></div>
      </div>
    </div>`);
    node.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    node.querySelector("#p-barcode").addEventListener("click", () => { closeModal(); quickAddByBarcode(day, meal); });

    const listEl = node.querySelector("#p-list");
    const searchEl = node.querySelector("#p-search");
    const mealCat = MEALS.find(m => m.key === meal).label;
    let showAll = false;
    // Bewusst pro Picker und geschlossen vorbelegt - siehe Begruendung unten bei pqForced.
    let pqOpen = false;

    function paint(q) {
      const query = (q || "").toLowerCase().trim();
      let list = pickerQuellen().sort((a, b) => a.name.localeCompare(b.name, "de"));
      if (query) list = list.filter(r => r.name.toLowerCase().includes(query) || (r.category || "").toLowerCase().includes(query));
      const hidden = list.filter(r => !catFitsMeal(r.category, meal)).length;
      if (!showAll) list = list.filter(r => catFitsMeal(r.category, meal));
      // Favoriten zuerst, dann die zum Slot passende Kategorie. sort() ist stabil, die
      // Namenssortierung von oben bleibt damit innerhalb beider Gruppen erhalten.
      list.sort((a, b) => {
        const fa = isFav(a.id) ? 0 : 1, fb = isFav(b.id) ? 0 : 1;
        if (fa !== fb) return fa - fb;
        const sa = catSuggestsMeal(a.category, meal) ? 0 : 1, sb = catSuggestsMeal(b.category, meal) ? 0 : 1;
        return sa - sb;
      });
      const more = hidden > 0
        ? `<div class="pmore">
             <span>${hidden} Meal${hidden === 1 ? " passt" : "s passen"} nicht zu ${esc(mealCat)}</span>
             <button class="btn ghost sm" data-toggle-all>${showAll ? "Nur passende" : "Alle anzeigen"}</button>
           </div>`
        : "";
      // Schnellbereich: ab zwei Zeichen die Suche, davor eine kurze feste Auswahl.
      // Dieselbe Rangfolge wie in der Zutatenzeile (rankFoods), damit "ban" sich hier
      // nicht anders verhaelt als dort.
      const pieces = query.length >= 2 ? pieceSearch(query, 8) : pieceTop();
      // Leer ist die Auswahl erst, wenn AUCH das Rezeptbuch nichts hergibt - sonst stuende
      // "Noch keine Meals angelegt" ueber 34 verfuegbaren Gerichten.
      const libEmpty = pickerQuellen().length === 0;
      // Ein Meal-Knopf, unabhaengig von der Quelle: der Umbau macht die Katalog-id zu einem
      // gueltigen Plan-Verweis, zugewiesen wird also in beiden Faellen gleich (data-assign).
      const itemHtml = r => {
        const suggest = catSuggestsMeal(r.category, meal) ? " suggest" : "";
        const off = catFitsMeal(r.category, meal) ? "" : " offcat";
        // esc() auch um die id: Sie ist die EINZIGE der vier data-*-ID-Stellen, die es lange
        // nicht hatte (data-cbview, data-adopt und data-cbcat schon). sanitizeRecipe() prueft
        // die id nicht - Object.assign uebernimmt sie ungeprueft -, und Rezepte kommen aus
        // Sharing-Links und Gruppen-Sync auch von fremd. Der Wert kommt ueber dataset wieder
        // dekodiert heraus, die Zuweisung aendert sich also nicht.
        return `<button class="pitem${suggest}${off}" data-assign="${esc(r.id)}">
          ${thumbHtml(r, "pthumb")}
          <span class="pn">${esc(r.name)}</span>
          ${isFav(r.id) ? `<span class="pfav" aria-hidden="true">${iconSvg("heart", "")}</span>` : ""}
          <span class="pc">${esc(r.category || "")}</span>
        </button>`;
      };

      let html;
      if (libEmpty) {
        // Kein Dead End: der Slot bleibt ueber den Schnellbereich unten benutzbar.
        html = `<p class="pempty">Noch keine Meals angelegt. <button class="btn ghost sm" data-go>Zu den Meals</button></p>`;
      } else if (list.length === 0 && pieces.length === 0) {
        html = `<p class="pempty">Nichts gefunden – probier es kürzer.</p>${more}`;
      } else if (list.length === 0) {
        html = `<p class="pempty">Kein passendes Meal gefunden.</p>${more}`;
      } else {
        // Eigene Meals zuerst, das Rezeptbuch als eigener Abschnitt darunter - die Herkunft
        // steht damit ueber der Gruppe statt als Marke an jeder einzelnen Zeile. `.sec-h` ist
        // die EINE Abschnittsform der App und im Picker schon fuer "Schnell" in Gebrauch
        // (CLAUDE.md, Ziffer 8) - keine neue Form, kein zusaetzlicher Erklaertext.
        const eigene = list.filter(r => !r.__cb);
        const ausBuch = list.filter(r => r.__cb);
        html = eigene.map(itemHtml).join("");
        if (ausBuch.length) html += `<div class="sec-h pq-h">Aus dem Rezeptbuch</div>` + ausBuch.map(itemHtml).join("");
        html += more;
      }
      if (pieces.length) {
        // Der Schnell-Bereich ist ein Aufklapper und beim Oeffnen zu. Er stand hier frueher
        // IMMER offen und verlaengerte jede Meal-Auswahl um sechs feste Zeilen, auch wenn
        // gar kein Lebensmittel gesucht war.
        //
        // Zwei Faelle klappen ihn zwingend auf; die Kopfzeile ist dann nur Beschriftung -
        // dieselbe Unterscheidung wie bei .cathead/.cathead.static im Rezeptbuch:
        //   - ab zwei Zeichen greift pieceSearch(): wer "ban" tippt, will die Banane sehen
        //     und nicht erst einen Knopf finden.
        //   - ohne ein einziges Meal (libEmpty) ist der Schnell-Bereich der EINZIGE Weg,
        //     den Slot zu fuellen (siehe Kommentar oben) - zugeklappt waere das ein Dead End.
        //
        // Bewusst kein natives <details>, obwohl die App es an vier Stellen nutzt: listEl
        // wird bei jedem Tastendruck ueber innerHTML neu gebaut, ein DOM-Zustand ginge dabei
        // verloren. Der Zustand liegt deshalb in pqOpen.
        const pqForced = query.length >= 2 || libEmpty;
        const pqShow = pqForced || pqOpen;
        html += pqForced
          ? `<div class="sec-h pq-h static">Schnell</div>`
          : `<button type="button" class="sec-h pq-h" data-pq-toggle aria-expanded="${pqShow}">
              <svg class="caret${pqShow ? " open" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              <span>Schnell</span>
            </button>`;
        // Eine Nachkommastelle behalten: nfmt() rundet auf ganze Zahlen und machte aus
        // 0,4 g Fett im Apfel eine 0 (gleiche Begruendung wie bei .ing-brief).
        const nz = v => (Math.round(v * 10) / 10).toLocaleString("de-DE");
        if (pqShow) html += pieces.map((f, i) => `
          <button class="pitem pq" data-piece="${i}">
            <span class="pqi" aria-hidden="true">${iconSvg("fruit", "")}</span>
            <span class="pqb">
              <span class="pn">${esc(f.name)}</span>
              <span class="pqs">1 Stück${f.grams ? " · " + f.grams + " g" : ""}</span>
            </span>
            <span class="pqn">
              <span class="pqk">${nfmt(f.kcal)} kcal</span>
              <span class="pqm">${macroLineHtml(f, nz)}</span>
            </span>
          </button>`).join("");
      }
      listEl.innerHTML = html;

      const toggle = listEl.querySelector("[data-toggle-all]");
      if (toggle) toggle.addEventListener("click", () => { showAll = !showAll; umschalten("[data-toggle-all]"); });
      const pqBtn = listEl.querySelector("[data-pq-toggle]");
      if (pqBtn) pqBtn.addEventListener("click", () => { pqOpen = !pqOpen; umschalten("[data-pq-toggle]"); });
      const go = listEl.querySelector("[data-go]");
      if (go) go.addEventListener("click", () => { closeModal(); state.tab = "recipes"; render(); openMealSheet(null); });
      listEl.querySelectorAll("[data-assign]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.assign;
        state.plan[day][meal].push(slotIsShared(day, meal) ? id : makeEntry(id, [syncUid]));
        closeModal(); render(); toast("Zum Plan hinzugefügt");
      }));
      listEl.querySelectorAll("[data-piece]").forEach(b => b.addEventListener("click", () => {
        const f = pieces[Number(b.dataset.piece)];
        if (!f) return;
        quickAddPiece(day, meal, f);
        closeModal(); render(); toast("„" + f.name + "“ zum Plan hinzugefügt");
      }));
    }
    // Beide Umschalter der Liste ("Alle anzeigen" und der Schnell-Aufklapper) zeichnen ueber
    // paint() das ganze listEl neu. Dabei geht der Fokus verloren: Er landet auf <body>, und
    // zwar MITTEN IN EINEM DIALOG - fuer die Tastatur ist der Weg zurueck in die Liste damit
    // weg. Gemessen, nicht vermutet (Kopie ohne diese Zeilen, Chrome: activeElement === body).
    //
    // Die Scrollposition wird bewusst NICHT gerettet, obwohl das naheliegt: Chrome haelt
    // scrollTop ueber einen innerHTML-Neuaufbau hinweg, solange die neue Hoehe es zulaesst.
    // Eine Fassung mit `const top = listEl.scrollTop` / `listEl.scrollTop = top` wurde gegen
    // eine Kopie OHNE diese Zeilen gemessen: beide Male 200 -> 200 und 150 -> 150. Sie tat
    // nichts. Wird die Liste so viel kuerzer, dass der Browser klemmt, kann sie es auch nicht
    // richten - der Inhalt ist dann weg. Siehe docs/TROUBLESHOOTING.md 116.
    //
    // preventScroll, weil focus() sonst zur Zeile springt und damit genau die Bewegung
    // ausloest, um die es hier geht (focus() als Messfalle, siehe docs/TESTING.md).
    // Faellt der Knopf beim Neuzeichnen weg, faengt das Suchfeld den Fokus - es ist im
    // Picker das erste Bedienelement und nie leer.
    function umschalten(wahl) {
      paint(searchEl.value);
      const b = listEl.querySelector(wahl) || searchEl;
      b.focus({ preventScroll: true });
    }
    searchEl.addEventListener("input", () => paint(searchEl.value));
    paint("");
    openModal(node);
  }

  // Live-Kamera zuerst, Foto-Ausweg als eigener, kurzlebiger File-Input - anders als in
  // openMealSheet() gibt es hier kein dauerhaftes Formular-DOM, an das sich ein Input
  // haengen liesse. Liefert den erkannten Code oder null (Abbruch/Fehler - Meldung dann
  // bereits per toast() gezeigt).
  async function scanBarcodeCode() {
    const r = await scanBarcodeLive();
    if (!r || r.cancelled) return null;
    if (r.code) return r.code;
    if (!r.photo) return null;
    const file = await new Promise(resolve => {
      const input = el(`<input type="file" accept="image/*" capture="environment" class="visually-hidden">`);
      document.body.appendChild(input);
      let done = false;
      // Bricht der Nutzer den Datei-Dialog ohne Auswahl ab, feuert nicht in jedem Browser
      // ein "change" (bzw. "cancel") - ohne den Fensterfokus-Rueckfall bliebe der Input
      // sonst als verwaister Knoten im DOM stehen.
      function finish(f) { if (done) return; done = true; input.remove(); resolve(f); }
      input.addEventListener("change", () => finish((input.files && input.files[0]) || null), { once: true });
      input.addEventListener("cancel", () => finish(null), { once: true });
      window.addEventListener("focus", () => setTimeout(() => finish(null), 300), { once: true });
      input.click();
    });
    if (!file) return null;
    toast("Lese Barcode …");
    try {
      const code = await detectBarcode(file);
      if (!code) { toast("Kein Barcode erkannt – bitte näher heran oder manuell eintragen"); return null; }
      return code;
    } catch (e) {
      toast("Erkennung nicht möglich (offline?) – bitte manuell eintragen");
      return null;
    }
  }
  // Barcode-Schnellzugriff: ein Fertigprodukt direkt aus dem Wochenplan heraus einplanen,
  // ohne das Meal-Formular zu sehen. Legt bei vollstaendigen OFF-Daten ein minimales,
  // eigenes Meal an (barcode/quick-Feld, siehe paintRecipeGroups) - Dedupe ueber barcode
  // verhindert, dass derselbe Scan bei jedem Mal ein neues state.recipes-Dokument erzeugt.
  // Fehlt eine auswertbare Packungsgroesse oder sind Name/Naehrwerte unvollstaendig, oeffnet
  // stattdessen das normale Formular vorausgefuellt - kein stiller Fehlwert bei den Kalorien.
  async function quickAddByBarcode(day, meal) {
    const code = await scanBarcodeCode();
    if (!code) return;
    const existing = state.recipes.find(r => r.barcode === code);
    if (existing) {
      state.plan[day][meal].push(slotIsShared(day, meal) ? existing.id : makeEntry(existing.id, [syncUid]));
      render();
      toast("Zum Plan hinzugefügt");
      return;
    }
    toast("Suche Produkt …");
    let p;
    try { p = await fetchOffNutrition(code); }
    catch (e) { toast("Suche nicht möglich (offline?) – bitte manuell eintragen"); return; }
    if (!p) { toast("Produkt nicht gefunden – bitte manuell eintragen"); return; }

    const ss = p.servingSize;
    // Portionsgroesse fuer das stille Anlegen. Eine erkannte Stueckzahl meint IMMER ein
    // einzelnes Stueck - auch bei "6 x 65 g" ist der Riegel die Portion, nicht die ganze
    // Schachtel. Sonst zaehlt nur eine echte serving_size: reines quantity ("500 g" Nudeln,
    // "1 l" Milch) ist die Packungsgroesse und keine Portion - daraus stillschweigend ein
    // Meal zu bauen waere geraten, und Kalorienkorrektheit ist das Kernversprechen.
    const portion = ss && ss.grams > 0 && (ss.count || ss.serving) ? ss.grams : null;
    const complete = p.name && portion && p.kcal != null && p.carbs != null && p.protein != null && p.fat != null;
    if (!complete) {
      toast("Ein paar Angaben fehlen – bitte kurz prüfen");
      // Die gefundenen Naehrwerte gehen nicht verloren: sie ziehen als vorbefuellte
      // Zutaten-Zeile (je 100 g) mit ins Formular. Sobald der Nutzer die Menge eintraegt,
      // rechnet updateMacroSum() die Meal-Naehrwerte selbst aus - genau der eine Wert,
      // den OFF nicht verlaesslich liefert, kommt vom Menschen.
      const hasNut = p.kcal != null || p.carbs != null || p.protein != null || p.fat != null;
      const ings = hasNut ? [{ name: p.name || "Produkt", kcal: p.kcal, carbs: p.carbs, protein: p.protein, fat: p.fat }] : null;
      openMealSheet(null, { name: p.name || "", category: "Snack", barcode: code, assignTo: { day, meal }, ingredients: ings });
      return;
    }
    const f = portion / 100;
    const recipe = Object.assign({ id: uid() }, {
      name: p.name,
      category: "Snack",
      nutrition: {
        kcal: Math.round(p.kcal * f),
        carbs: Math.round(p.carbs * f * 10) / 10,
        protein: Math.round(p.protein * f * 10) / 10,
        fat: Math.round(p.fat * f * 10) / 10,
      },
      ingredients: [],
      steps: "",
      barcode: code,
      quick: true,
      // Anlagezeit fuer das spaetere Aufraeumen (pruneQuickRecipes). Ohne sie liesse sich
      // ein gerade gescanntes Produkt nicht von einem laengst verwaisten unterscheiden.
      created: Date.now(),
    }, syncGid ? { by: syncUid } : null);
    state.recipes.push(recipe);
    state.plan[day][meal].push(slotIsShared(day, meal) ? recipe.id : makeEntry(recipe.id, [syncUid]));
    render();
    toast("„" + p.name + "“ zum Plan hinzugefügt");
  }

  // Schnelleintrag: ein zaehlbares Lebensmittel (pieceFoods) in einen Slot legen. Genau
  // dasselbe Muster wie quickAddByBarcode, nur ist die Datenquelle lokal und immer
  // vollstaendig - deshalb gibt es hier keinen Umweg ueber das Formular.
  //
  // Warum ein stilles Meal und kein neuer Eintragstyp im Slot: der Slot speichert
  // ausschliesslich Rezept-IDs (siehe makeEntry/flattenWeek). Ein zweiter Typ haette
  // Tagesbilanz, Einkaufsliste, PDF, Gruppen-Sync und Undo gleichzeitig anfassen muessen.
  // Als quick-Meal zaehlt es ueberall ohne Sonderfall mit und wird von pruneQuickRecipes
  // automatisch aufgeraeumt, sobald es nirgends mehr eingeplant ist.
  //

  // zeigte dreimal "1× Banane" statt einmal "3× Banane".
  function quickAddPiece(day, meal, food) {
    let recipe = state.recipes.find(r => r.qf === food.key && r.quick === true);
    if (!recipe) {

        ingredients: [Object.assign({ name: food.name, grams: 1, unit: "st" }, nut)],

  const SHOP_OTHER = { key: "sonst", title: "Sonstiges", icon: "📦" };
  function shopCategory(label) {
    const toks = label.toLowerCase().replace(/ß/g, "ss").replace(/[0-9]+/g, " ").replace(/[^a-zäöü]+/g, " ").split(/\s+/).filter(Boolean);
    for (let c = 0; c < SHOP_CATS.length; c++) {
      const kws = SHOP_CATS[c].kw;
      for (let k = 0; k < kws.length; k++) {
        const kw = kws[k];
        for (let t = 0; t < toks.length; t++) {
          const tok = toks[t];
          if (tok === kw) return SHOP_CATS[c];
          if (kw.length >= 4 && (tok.indexOf(kw) === 0 || tok.slice(-kw.length) === kw)) return SHOP_CATS[c];

  const SHOP_DONE_KEY = localKey("wochenkueche_shop_v1");
  // Der abgehakte Zustand haengt an der WOCHE, fuer die eingekauft wird - nicht an der App.
  //
  // Bis zum 28.08.2026 war das ein flaches Set aus `norm`-Schluesseln, geteilt von beiden
  // Wochenreitern. Wer in der aktuellen Woche "500 g Hackfleisch" abhakte und dann auf
  // "Naechste Woche" umschaltete, fand die Position dort bereits erledigt - und kaufte zu
  // wenig ein. Am Montag rueckte derselbe Zustand ausserdem stillschweigend nach: die frische
  // Woche startete mit den Haken der vergangenen.
  //
  // Gespeichert wird deshalb {"2026-W35": [...], "2026-W36": [...]} - derselbe
  // ISO-Wochenschluessel wie bei state.plans. Das erledigt zwei Dinge nebenbei: die Haken der
  // "naechsten Woche" wandern beim Wochenwechsel von selbst mit (ihr Schluessel bleibt ja
  // derselbe, sie heisst dann nur "aktuell"), und alte Wochen verfallen nach derselben Regel
  // wie die Plaene - ohne das waechst der Eintrag mit jeder Woche weiter, und niemand sieht es.
  //
  // BEWUSST NICHT IN DER CLOUD. Der Abhak-Zustand steht in keinem dataJSON()/pushNow()-Feld.
  // Grund ist nicht Bequemlichkeit: Zwei Personen einer Gruppe gehen getrennt einkaufen, und
  // ein geteilter Haken hiesse "jemand hat es geholt" - eine Aussage, die niemand getroffen
  // hat. Ein gemeinsamer Einkauf ist ein eigenes Feature mit eigener Frage ("wer holt was?"),
  // kein Nebeneffekt der Speicherung.
  //
  // Wuerde er JE synchronisiert, braucht loadShopDoneAll() vorher denselben Schluessel-Regex
  // wie sanitizeWeekStats() (/^\d{4}-W\d{2}$/). Heute ist er entbehrlich - der Wert ist rein
  // lokal, und wer ihn manipuliert, hat den Browser ohnehin. Ueber Sync kaeme er von fremd.
  //
  // Der Altbestand-Zweig unten (flaches Array) darf entfallen, sobald niemand mehr von einem
  // Stand VOR dem 28.08.2026 aktualisiert. Kein Datum raten - die Zeile kostet nichts, und
  // ein zu frueh entfernter Migrationspfad loescht stillschweigend Nutzerdaten.
  function loadShopDoneAll() {
    try {
      const raw = JSON.parse(localStorage.getItem(SHOP_DONE_KEY) || "{}");
      // Altbestand aus der Fassung davor (flaches Array) gehoert der Woche, in der man
      // gerade steht - alles andere waere geraten. Einmalig uebernehmen statt wegwerfen,
      // sonst verliert jeder Nutzer beim Update seinen halb abgehakten Einkauf.
      if (Array.isArray(raw)) { const o = {}; o[weekKeyFor("cur")] = raw; return o; }
      return raw && typeof raw === "object" ? raw : {};
    } catch (e) { return {}; }
  }
  function loadShopDone() {
    const list = loadShopDoneAll()[activeWeekKey()];
    return new Set(Array.isArray(list) ? list : []);
  }
  function saveShopDone(set) {
    try {
      const all = loadShopDoneAll();
      const key = activeWeekKey();
      if (set.size) all[key] = Array.from(set); else delete all[key];
      // Nur aktuelle + naechste Woche behalten - dieselbe Regel wie pruneWeeks() fuer die Plaene.
      const keep = {}; keep[weekKeyFor("cur")] = 1; keep[weekKeyFor("next")] = 1;
      Object.keys(all).forEach(k => { if (!keep[k]) delete all[k]; });
      localStorage.setItem(SHOP_DONE_KEY, JSON.stringify(all));
    } catch (e) { noteError("store:saveShopDone", e); }
  }

  // Einkaufsliste als Klartext (Warengruppe als Ueberschrift, Zutaten mit Punkt). Eine Quelle
  // fuer "Als Text kopieren" und fuers Teilen ueber den nativen Dialog - sonst laufen die
  // beiden Formate frueher oder spaeter auseinander.
  function shoppingText(groups) {
    return groups.map(g => g.cat.title.toUpperCase() + "\n"
      + g.items.map(it => "• " + it.label + (it.count > 1 ? " (×" + it.count + ")" : "")).join("\n")).join("\n\n");
  }
  // Aggregiert die Zutaten der relevanten Tage zu einer sortierten, nach Warengruppe
  // gruppierten Einkaufsliste. Ausgelagert aus openShopping() (Paket B3), damit der neue
  // PDF-Export (shopPdfString/planShopPages) dieselbe Aggregation nutzt statt sie zu duplizieren.
  // persons: fuer wie viele Personen eingekauft wird. Default ist die Kontoeinstellung -
  // alle Aufrufer (Modal, Text, PDF, Teilen) erben die Zahl dadurch automatisch, ohne dass
  // jeder sie selbst durchreichen muss.
  function buildShoppingList(persons) {
    const per = sanitizeShopPersons(persons === undefined ? shopPersons() : persons);
    const { todayIdx, relevantDays } = planDaysAhead();
    // Zusammenfassen: gleiche Zutat + gleiche Einheit werden addiert (7 × 400 ml Milch
    // -> "2,8 L Milch"). Zutaten ohne Menge (Freitext wie "Salz, Pfeffer") haben nichts
    // zu addieren und werden wie bisher gezaehlt.
    // sharedQty: Menge aus "fuer alle"-Gerichten, skaliert erst unten mit dem globalen
    // per-Faktor. assignedQty: Menge aus individuell zugewiesenen Gerichten, bereits pro
    // Gericht auf die tatsaechliche Personenzahl skaliert - der globale Faktor darf sie
    // nicht nochmal treffen.
    const map = new Map(); // key -> {label, count, sharedQty, assignedQty, unit, name}
    relevantDays.forEach(d => MEALS.forEach(m => state.plan[d.key][m.key].forEach(entry => {
      const r = getRecipe(entryId(entry));
      if (!r || !r.ingredients) return;
      const uids = entryUids(entry);
      // Ein Meal ist eine Portion (siehe sanitizeRecipe): Ist das Gericht mehreren Personen
      // zugewiesen, braucht jede davon ein eigenes - also mal Anzahl. "Fuer alle" bleibt
      // unskaliert, dort greift der globale per-Faktor weiter unten.
      // shopCountsMembers(): steht "Einkauf fuer alle rechnen" auf Aus, zaehlt auch ein
      // zugewiesenes Gericht nur einfach - sonst folgte nur die eine Haelfte der Summe der
      // Einstellung (siehe dort).
      const factor = uids && shopCountsMembers() ? uids.length : 1;
      r.ingredients.forEach(i => {
        const o = ingObj(i);
        const name = String(o.name || "").trim();
        // WUERZE WIRD NICHT SUMMIERT. Man kauft eine Packung Salz, nicht "1¼ TL" - die
        // Loeffelmenge ist beim Kochen die Information, im Laden ist sie Rauschen. Mit
        // qty = 0 faellt der Eintrag in die vorhandene Darstellung fuer mengenlose Zutaten:
        // nur der Name, dahinter "×N" fuer "in N Meals der Woche". Das gilt dadurch in einem
        // Zug fuer Modal, Text-Export und PDF.
        //
        // Aufgekommen im Pushcheck vom 29.08.2026: Seit jede Zutat eine Menge traegt, stand
        // dort "½ TL Salz" - vorher war es der Freitext "Kurkuma, Kreuzkuemmel, Salz", der
        // sich mit nichts zusammenlegen liess. Beides half beim Einkaufen nicht.
        const wuerze = ingIsSeasoning(o);
        const qty = wuerze ? 0 : nutNum(o.grams) * factor;
        const unit = ingUnit(o);
        // Wuerze schluesselt allein ueber den Namen - sonst blieben ½ TL Salz aus dem einen
        // und ¼ TL Salz aus dem anderen Rezept zwei Zeilen, und genau das soll hier weg.
        // Ohne Menge zaehlt der ganze Text (Altbestand), sonst Name+Einheit als Schluessel.
        const norm = wuerze
          ? name.toLowerCase()
          : qty
            ? name.toLowerCase() + "|" + unit
            : ingLabel(i).toLowerCase().trim();
        if (!norm || (!qty && !name)) return;
        const hit = map.get(norm);
        if (hit) { hit.count++; if (qty) { if (uids) hit.assignedQty += qty; else hit.sharedQty += qty; } }
        else map.set(norm, { norm: norm, name: name, sharedQty: qty && !uids ? qty : 0, assignedQty: qty && uids ? qty : 0, unit: unit, count: 1 });
      });
    })));
    // Hochrechnen auf die Personenzahl - vor der Label-Bildung, damit qtyLabel unten anhand
    // der ENDgueltigen Summe ueber g/kg bzw. ml/L entscheidet. Zutaten ohne Menge (Freitext
    // wie "Salz, Pfeffer") bleiben unangetastet: ihr "×count" heisst "in N Meals der Woche",
    // nicht "N Stueck" - mal 2 genommen waere es schlicht falsch. Der Faktor trifft nur den
    // "fuer alle"-Anteil - der individuell zugewiesene Anteil ist bereits fertig skaliert.
    // it.norm bleibt bewusst unberuehrt (Name + Einheit, ohne Menge): daran haengt der
    // abgehakte Zustand in SHOP_DONE_KEY - er soll eine geaenderte Personenzahl ueberleben.
    // Anzeige-Label erst am Ende bilden — die Summe entscheidet ueber g/kg bzw. ml/L
    map.forEach(it => {
      it.qty = it.sharedQty * per + it.assignedQty;
      it.label = it.qty ? qtyLabel(it.qty, it.unit) + " " + it.name : it.name;
    });

    const items = Array.from(map.values()).sort((a, b) => (a.name || a.label).localeCompare(b.name || b.label, "de"));
    // nach Warengruppe gruppieren; Reihenfolge = SHOP_CATS, "Sonstiges" ganz am Ende
    const gmap = {};
    items.forEach(it => { const c = shopCategory(it.name || it.label); (gmap[c.key] || (gmap[c.key] = { cat: c, items: [] })).items.push(it); });
    const groups = SHOP_CATS.concat([SHOP_OTHER]).map(c => gmap[c.key]).filter(Boolean);
    return { items, groups, todayIdx, persons: per };
  }

  // "2 Personen" / "1 Person" - eine Stelle, damit Knopf-Beschriftung und Vorlesetext
  // nicht auseinanderlaufen koennen.
  function personsLabel(n) { return n + (n === 1 ? " Person" : " Personen"); }

  // Welche Tage der gezeigten Woche zaehlen noch? In der aktuellen Woche nur heute und die

  // Beide Ansichten MUESSEN dieselbe Woche beschreiben - sonst kauft man fuer einen Tag ein,
  // den die Vorkochliste nicht mehr kennt. Als zwei Kopien derselben zwei Zeilen waere genau
  // das eine Frage der Zeit.
  function planDaysAhead() {
    const todayIdx = DAYS.findIndex(d => d.key === todayDayKey());
    return { todayIdx: todayIdx, relevantDays: state.viewWeek === "next" ? DAYS : DAYS.slice(todayIdx) };
  }

  // Welchen Zeitraum beschreibt die Liste? Gegenstueck zu planDaysAhead(): dieselbe Frage,

  // derselben Quelle und muessen deshalb auch dieselbe Woche benennen.
  //
  // Vorher stand fuer die naechste Woche faelschlich "diese Woche" da: der ternaere Ausdruck
  // `viewWeek !== "next" && todayIdx > 0 ? "ab heute" : "diese Woche"` fiel fuer "next" in
  // den zweiten Zweig. Das PDF schrieb an derselben Stelle korrekt "Naechste Woche" - womit
  // belegt war, dass es ein Versehen ist und keine Absicht. Bei geoeffnetem Modal ist der
  // Wochenumschalter verdeckt, der Kopf ist dann der einzige Hinweis, fuer welche Woche man
  // gerade einkauft.
  // Ohne Komma: "diese Woche ab heute" ist EINE Aussage - "ab heute" schraenkt "diese Woche"

  function planScopeLabel(todayIdx) {

    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // ---------- Vorkochen (C3) ----------
  // Die Einkaufsliste beantwortet "was muss ich kaufen?", der Wochenplan "was esse ich wann?".

  // Dafuer wird derselbe Wochenbestand nach GERICHT gruppiert statt nach Tag.
  //

  // Eintrag je Esser (Zuweisung) bzw. je Person (Einkaufsliste-Einstellung).
  //
  // Die frueheren "Kochdurchgaenge" (Portionen / portions des Rezepts) sind am 15.08.2026

  // "4x kochen a 1 Portion" bloss eine umstaendliche Wiederholung der Zahl daneben.

  // Zeitraum wie bei der Einkaufsliste: in der aktuellen Woche ab heute, in der naechsten die

  // Montag ein, was man laut Vorkochliste gar nicht mehr kocht.
  function buildBatchList() {
    const { todayIdx, relevantDays } = planDaysAhead();
    const persons = shopPersons();
    const map = new Map();   // rid -> { r, portions, days:Set }
    relevantDays.forEach(d => MEALS.forEach(m => state.plan[d.key][m.key].forEach(entry => {
      const r = getRecipe(entryId(entry));
      if (!r) return;
      const uids = entryUids(entry);
      // Gleiche Bedingung wie in buildShoppingList(): Beide Listen muessen dieselben Esser
      // zaehlen, sonst kocht man fuer eine andere Zahl, als man eingekauft hat.
      const esser = uids ? (shopCountsMembers() ? uids.length : 1) : persons;
      const hit = map.get(r.id) || { r: r, portions: 0, days: new Set() };

    return { items: items, total: Math.round(total * 10) / 10, todayIdx: todayIdx };
  }
  function openBatchCooking() {

    // Woche im Dialognamen, gleiche Begruendung wie bei der Einkaufsliste.
    const node = el(`<div class="modal" role="dialog" aria-modal="true" aria-label="Vorkochen, ${esc(planScopeLabel(todayIdx))}">

  // ---------- Actions ----------
  // Meal-Verweise aus ALLEN gespeicherten Wochen entfernen, nicht nur aus der gerade
  // angezeigten - sonst bleibt in der anderen Woche ein Verweis auf ein geloeschtes
  // Meal stehen (faellt erst beim naechsten Laden weg, weil normalizePlan aufraeumt).
  function dropRecipeIds(idSet) {
    Object.keys(state.plans).forEach(key => {
      const p = state.plans[key];
      if (!p) return;
      DAYS.forEach(d => MEALS.forEach(m => {
        // entryId(x), NICHT x: Ein Slot-Eintrag ist seit "Gemeinsam planen" entweder ein
        // blanker String ODER ein Objekt {id, uids}. `idSet.has(x)` traf auf ein solches
        // Objekt nie zu - ein geloeschtes Meal, das jemandem ZUGEWIESEN war, blieb deshalb
        // als Geisterverweis im Wochenplan stehen, waehrend dasselbe Meal in der "fuer
        // alle"-Form sauber verschwand. Der Nachbar rewritePlanIds() macht es seit jeher
        // richtig; sein Kommentar nennt diese Funktion sogar sein "Vorbild".
        if (p[d.key] && p[d.key][m.key]) p[d.key][m.key] = asIdList(p[d.key][m.key]).filter(x => !idSet.has(entryId(x)));
      }));
    });
    // Favoriten mitraeumen: ein Herz auf ein geloeschtes Meal waere ein Geisterverweis.
    if (Array.isArray(state.favs)) state.favs = state.favs.filter(x => !idSet.has(x));
    // Dasselbe fuers Planer-Gedaechtnis - ein Verweis auf ein geloeschtes Meal traegt nichts bei.
    if (state.planned) Object.keys(state.planned).forEach(id => { if (idSet.has(id)) delete state.planned[id]; });
  }
  // Einen Plan-Verweis auf eine ANDERE id umbiegen, in ALLEN gespeicherten Wochen - dasselbe
  // Vorbild wie dropRecipeIds() oben, nur ersetzen statt entfernen. Gebraucht an zwei Stellen,
  // die beide denselben Fehler vermeiden muessen (deshalb EIN gemeinsamer Helfer statt zwei
  // Kopien, die irgendwann auseinanderlaufen):
  //
  //   1. adoptFromCookbook(): ein Katalog-Slot wird uebernommen, der Plan soll danach auf die
  //      eigene (editierbare) Kopie zeigen statt weiter auf das unveraenderte Original.
  //   2. copyOwnRecipesToGroup(): meine Kopie wird beim Gruppenbeitritt NICHT hochgeladen,
  //      weil die Gruppe schon eine mit demselben `lib` hat - meine Plaene muessen dann auf
  //      die Gruppen-id zeigen, sonst wirft normalizePlan() sie beim naechsten Laden weg.
  //
  // Objekt-Eintraege ({id, uids}) werden NEU angelegt statt mutiert - dasselbe Prinzip wie im
  // Planer (siehe Kommentar bei autoPlanWeek): eine gemeinsame Objektreferenz waere eine Falle
  // fuer den naechsten, der genau diesen Eintrag anfasst.
  function rewritePlanIds(vonId, nachId) {
    Object.keys(state.plans).forEach(key => {
      const p = state.plans[key];
      if (!p) return;
      DAYS.forEach(d => MEALS.forEach(m => {
        const arr = p[d.key] && p[d.key][m.key];
        if (!arr || !arr.length) return;
        p[d.key][m.key] = arr.map(e => entryId(e) !== vonId ? e
          : (typeof e === "string" ? nachId : Object.assign({}, e, { id: nachId })));
      }));
    });
    // Gedaechtnis mitziehen - sonst gilt die neue id faelschlich als "noch nie geplant" und
    // der Planer wertet sie beim naechsten Lauf nicht ab, obwohl sie gerade erst dran war.
    if (state.planned && Object.prototype.hasOwnProperty.call(state.planned, vonId)) {
      state.planned[nachId] = state.planned[vonId];
      delete state.planned[vonId];
    }
  }
  function deleteRecipe(id) {
    const r = getRecipe(id); if (!r) return;
    // Derselbe Riegel wie bei den Foto-Handlern oben: getRecipe() kann seit dem 17.08.2026
    // ein COOKBOOK-Objekt liefern, und ein Katalog-Rezept darf nie geloescht werden.
    if (!state.recipes.some(x => x.id === id)) return;
    confirmModal({
      title: "Meal löschen?",
      bodyHtml: `<p style="margin:0">„<strong>${esc(r.name)}</strong>" wird dauerhaft entfernt und aus dem Wochenplan gelöscht.</p>`,
      okLabel: "Löschen",
      onConfirm: () => {
        // dropRecipeIds raeumt in ALLEN gespeicherten Wochen auf (nicht nur der aktiven) -
        // fuers Rueckgaengig-Machen deshalb alle Wochen klonen, nicht nur state.plan.
        const plansBefore = JSON.parse(JSON.stringify(state.plans));
        const favsBefore = (state.favs || []).slice();
        state.recipes = state.recipes.filter(x => x.id !== id);
        dropRecipeIds(new Set([id]));
        markDeleted([id]);   // haelt das Meal beim naechsten Anmelden draussen (siehe sanitizeTombstones)
        save(); render();
        undoToast("Meal gelöscht", () => {
          unmarkDeleted([id]);
          state.recipes.push(r);
          state.plans = plansBefore;
          state.plan = state.plans[activeWeekKey()] || state.plan;
          state.favs = favsBefore;
          save(); render();
        });
      }
    });
  }
