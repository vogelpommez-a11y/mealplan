<script>
  /* Erscheinungsbild vor dem ersten Paint setzen — sonst blitzt beim Laden kurz das
     falsche Theme auf. Ohne gespeicherte Wahl bleibt das Attribut weg, dann greift
     wie bisher prefers-color-scheme. Laeuft absichtlich vor allem anderen. */
  try {
    var t = localStorage.getItem("wochenkueche_theme_v1");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"][media]');
      if (m) m.setAttribute("media", t === "dark" ? "all" : "not all");
    }
  } catch (e) {}
</script>
<title>Paddy’s Mealplan</title>
<style>
  :root {
    /* Kondensierte, athletische Display-Schrift — nur System-Fonts (kein externes
       Laden: Google-Fonts-CDN waere in DE ein Datenschutz-/Abmahnrisiko). */
    --font-display: "Bahnschrift", "Arial Narrow", "Roboto Condensed", "Oswald", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --bg: #F6F4F4;
    --surface: #FFFFFF;
    --surface-2: #F0ECEC;
    --text: #1A1416;
    --text-muted: #6B5F62;
    --border: #E7E0E1;
    --border-strong: #D6CCCE;

    /* Glas: Kopfzeile und die schwebende Reiterleiste auf dem Handy. --glass-bg-strong ist
       bewusst dichter als --glass-bg — im Kopf steht Text, unter dem Meal-Fotos durchscrollen,
       waehrend die Leiste ein freistehendes Bedienelement ohne Hintergrundtext ist.
       --glass-edge ist die Lichtkante, die eine echte Glasflaeche oben einfaengt. */
    --glass-bg: color-mix(in srgb, var(--surface) 68%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--surface) 82%, transparent);
    --glass-edge: rgba(255, 255, 255, .72);
    --glass-shadow: 0 8px 28px rgba(20, 24, 31, .16);
    /* Nur hier, nicht je Theme: die Weichzeichnung ist in Hell und Dunkel gleich stark. */
    --glass-blur: 22px;

    --accent: #DC2626;
    --accent-strong: #B01218;
    --accent-contrast: #FFFFFF;
    /* Rot als Vollflaeche hinter weisser Schrift. Getrennt von --accent, weil das
       helle Dark-Rot mit Weiss nur 3,65:1 erreicht – zu wenig fuer Text (4,5:1). */
    --accent-solid: #DC2626;

    /* War frueher ein eigenes Orange, getrennt von --accent. Kein dokumentierter Token,
       kein bewusst gewaehltes zweites Rot – nur ein Altlast-Wert. Fehler/Warnung/
       destruktiv sind im Theme dasselbe Rot wie ueberall sonst, kein zweites Signal. */
    --danger: var(--accent);
    --ok: #1E9E57;   /* Sync ok / verbunden */

    --fr: #A96E12;   /* Frühstück */
    --mi: #2E7D6B;   /* Mittagessen */
    --ab: #6E5A9E;   /* Abendessen */
    /* Makro-Farben (Paket D1): bisher an 13 Stellen als Hex-Wert dupliziert, seit D1
       zentral hier. Sie standen zunaechst in EINEM Theme-neutralen Block, weil Hell und
       Dunkel denselben Wert trugen — das ging nicht mehr auf: Auf hellem --surface kam
       das alte Amber #E9A03B nur auf 2,20:1 und das alte Blau #4AA8E0 auf 2,64:1, also
       unter die 3:1-Schwelle fuer grosse Schrift. Jetzt wie --fr/--mi/--ab in ALLEN vier
       Bloecken gepflegt (:root, @media dark, [data-theme=light], [data-theme=dark]).
       Das ist Pflicht, nicht Fleissarbeit: Ohne den Eintrag in [data-theme=light] wuerde
       auf einem System-dunklen Geraet mit manuell hellem Theme der Dark-Wert durchschlagen
       (der @media-Block greift dort weiterhin, und was er setzt, ueberschreibt der
       spezifischere Attribut-Block nur, wenn er dieselbe Eigenschaft nennt).
       Hell: gemeinsames Kontrastband 4,46-4,56:1 auf --surface, damit alle drei Makros
       gleich schwer wiegen. Der Farbton bleibt (Drift 1-2 Grad), nur die Helligkeit sinkt;
       Saettigung sogar minimal hoeher, damit nichts schlammig wird.
       Dunkel: unveraendert, dort war der Kontrast nie das Problem (7-8,6:1).
       Achtung wie bei --train: Die drei sind untereinander praktisch luminanzgleich
       (1,00-1,02:1). Sie duerfen deshalb NIE allein tragen — an jeder Fundstelle steht
       zusaetzlich ein Text-Label (KH / F / Kohlenhydrate ...), geprueft.
       Bekannt und bewusst in Kauf genommen: --carb liegt hell jetzt sehr nah an --fr
       (#A96E12, Fruehstueck) — vorher trennte die Helligkeit, die dem Kontrast weichen
       musste. Nebeneinander gerendert und fuer unkritisch befunden, weil die beiden nie
       dieselbe Rolle spielen: --fr erscheint als blasser Tint hinter einem Chip, der
       seine Kategorie ausschreibt, --carb als 7px-Punkt neben seinem Makro-Label.
       Wer --carb kuenftig als grosse Flaeche einsetzt, muss das neu bewerten. */
    --carb: #A26A11; /* Kohlenhydrate - hell 4,56:1 */
    --prot: #C74B78; /* Protein      - hell 4,46:1, unveraendert */
    --fat:  #1C7EB3; /* Fett         - hell 4,48:1 */

    /* Trainingstag. Das einzige Blau im Theme und bewusst gesetzt: Rot ist hier die
       Grundfarbe UND das Warnsignal ("drueber"), ein rot markierter Trainingstag waere
       daher nicht als neutrale Eigenschaft lesbar. Blau ist der einzige Ton, der sich
       von beidem absetzt. Achtung: Rot und Blau haben zueinander nur 1,07:1 Kontrast —
       fuer Farbenblinde sind sie ununterscheidbar. Die Markierung traegt deshalb NIE
       allein ueber die Farbe, sondern immer zusaetzlich Hantel-Icon + Text. */
    --train: #2563EB;
    --train-strong: #1D4ED8;
    /* Schrift auf blauer Vollflaeche. Eigener Token, weil sich Blau zwischen den
       Themes UMKEHRT: hell ist es dunkelblau (weisse Schrift), dunkel ist es hellblau
       (dunkle Schrift). Ein festes Weiss wie bei --accent-contrast waere im Dark-Theme
       auf #93C5FD unlesbar (rund 1,9:1). */
    --train-contrast: #FFFFFF;

    --shadow: 0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.08);
    --radius: 12px;
    --radius-sm: 8px;
    --maxw: 1120px;

  @media (prefers-color-scheme: dark) {
    :root {
      --logo: var(--logoD);
      --bg: #0C0A0B;
      --surface: #141011;
      --surface-2: #1C1718;
      --text: #F4EFEE;
      --text-muted: #A69B9D;
      --border: #2A2223;
      --border-strong: #3A2F30;

      --glass-bg: color-mix(in srgb, var(--surface) 66%, transparent);
      --glass-bg-strong: color-mix(in srgb, var(--surface) 80%, transparent);
      --glass-edge: rgba(255, 255, 255, .10);
      --glass-shadow: 0 8px 30px rgba(0, 0, 0, .55);

      --accent: #FF3040;
      --accent-strong: #FF5A66;
      --accent-contrast: #FFFFFF;
      --accent-solid: #E02234;

      --danger: var(--accent);
      --ok: #3DDC84;

      --fr: #E0A94A;
      --mi: #58B49E;
      --ab: #AC93E0;

      /* Dunkel: die urspruenglichen Makro-Werte, hier unveraendert (7-8,6:1 auf --surface) */
      --carb: #E9A03B;
      --prot: #C74B78;
      --fat: #4AA8E0;

      --train: #60A5FA;
      --train-strong: #93C5FD;
      --train-contrast: #0C1220;

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --logo: var(--logoL);
    --bg: #F6F4F4; --surface: #FFFFFF; --surface-2: #F0ECEC;
    --text: #1A1416; --text-muted: #6B5F62; --border: #E7E0E1; --border-strong: #D6CCCE;
    --glass-bg: color-mix(in srgb, var(--surface) 68%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--surface) 82%, transparent);
    --glass-edge: rgba(255, 255, 255, .72); --glass-shadow: 0 8px 28px rgba(20, 24, 31, .16);
    --accent: #DC2626; --accent-strong: #B01218; --accent-contrast: #FFFFFF; --accent-solid: #DC2626; --danger: var(--accent); --ok: #1E9E57;
    --fr: #A96E12; --mi: #2E7D6B; --ab: #6E5A9E;
    --carb: #A26A11; --prot: #C74B78; --fat: #1C7EB3;
    --train: #2563EB; --train-strong: #1D4ED8; --train-contrast: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.08);
  }
  :root[data-theme="dark"] {
    --logo: var(--logoD);
    --bg: #0C0A0B; --surface: #141011; --surface-2: #1C1718;
    --text: #F4EFEE; --text-muted: #A69B9D; --border: #2A2223; --border-strong: #3A2F30;
    --glass-bg: color-mix(in srgb, var(--surface) 66%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--surface) 80%, transparent);
    --glass-edge: rgba(255, 255, 255, .10); --glass-shadow: 0 8px 30px rgba(0, 0, 0, .55);
    --accent: #FF3040; --accent-strong: #FF5A66; --accent-contrast: #FFFFFF; --accent-solid: #E02234; --danger: var(--accent); --ok: #3DDC84;
    --fr: #E0A94A; --mi: #58B49E; --ab: #AC93E0;
    --carb: #E9A03B; --prot: #C74B78; --fat: #4AA8E0;
    --train: #60A5FA; --train-strong: #93C5FD; --train-contrast: #0C1220;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body { margin: 0; }

  .app {
    font-family: var(--font-body);
    color: var(--text);
    background:
      radial-gradient(1200px 400px at 10% -8%, color-mix(in srgb, var(--accent) 9%, transparent), transparent),
      var(--bg);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  /* ---------- Header ---------- */
  /* Hintergrund und Weichzeichnung liegen bewusst auf dem Pseudo-Element, nicht auf
     dem Kopf selbst: ein backdrop-filter auf einem Element macht dieses zum
     Bezugsrahmen fuer ALLE fixierten Nachfahren. Die untere Reiterleiste (position:
     fixed) klebte dadurch am unteren Rand des Kopfes statt am Bildschirm und
     verdeckte Logo, Slogan und Profil. Auf dem Pseudo-Element hat der Filter
     denselben optischen Effekt, ohne diese Nebenwirkung. */
  header.site {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px); /* Statusleiste/Notch bei viewport-fit=cover */
  }
  header.site::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  }
  .head-inner { display: flex; align-items: center; gap: 18px; padding: 14px 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand .mark {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    overflow: hidden;
    background: center / cover no-repeat var(--logo);
  }
  .brand h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: 26px; margin: 0; letter-spacing: .6px; line-height: 1;
    text-transform: uppercase;
  }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 0; font-size: 12.5px; color: var(--text-muted); }
  /* Slogan in Schreibschrift (System-Fonts, kein externes Laden). Farbe folgt
     dem Theme: im Dark quasi weiss, im Light dunkel – sonst waere er unlesbar. */
  .brand .slogan { margin: 3px 0 0; font-family: "Segoe Script", "Bradley Hand", "Brush Script MT", "Snell Roundhand", cursive; font-size: 15.5px; font-weight: 400; color: var(--text); letter-spacing: .3px; line-height: 1.1; }
  /* Kopfzeile: Brand + Profil in Zeile 1, Reiter in eigener Zeile darunter */
  #profile-slot { order: 2; }
  .navrow { order: 3; width: 100%; display: flex; }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; border: 1px solid var(--border); }
  .tab {
    font: inherit; font-size: 14px; font-weight: 550;
    border: 0; background: transparent; color: var(--text-muted);
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; gap: 7px; transition: color var(--dur-fast), background var(--dur-fast);
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow); }
  .tab .count { font-size: 11.5px; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent-strong); border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .tab .ts { display: none; } /* Kurzform der Beschriftung, nur im unteren Balken */
  /* Handy: aus der Reiterleiste im Kopf wird eine feste Leiste am unteren Rand, wie in
     nativen Apps. Grund ist gemessen, nicht geschaetzt: schon vier Reiter brauchen mehr
     Breite, als bei 360 px Bildschirmbreite zur Verfuegung steht — bisher waren
     sie also nur durch seitliches Schieben erreichbar, ohne jeden Hinweis darauf.
     Die Leiste wird per CSS versetzt und NICHT im Markup verdoppelt: sonst muessten
     zwei Leisten synchron gehalten werden (aria-selected, Meal-Zaehler). */
  @media (max-width: 680px) {
    /* display:contents statt none — none wuerde die (fixierte) Leiste mit ausblenden */
    .navrow { display: contents; }
    /* Freistehende Kapsel statt Leiste am Rand: sie schwebt ueber dem Inhalt, der beim
       Scrollen sichtbar dahinter durchwandert. Die Homebar-Freihaltung sitzt in `bottom`,
       nicht im `padding` — sonst waere die Kapsel unten aufgeblaeht statt hochgeschoben. */
    .tabs {
      position: fixed; z-index: 50;
      left: 12px; right: 12px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
      border: 1px solid var(--glass-edge); border-radius: 999px;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      padding: 5px 6px;
      box-shadow: var(--glass-shadow);
    }
    .tab {
      flex: none; flex-direction: column; gap: 3px; padding: 6px 2px 5px;
      font-size: 10.5px; font-weight: 600; line-height: 1.1; min-height: 46px;
      justify-content: center; position: relative; border-radius: 999px; white-space: nowrap;
      /* Voller Textkontrast statt --text-muted: hinter dem Glas kann jederzeit ein Meal-Foto
         liegen, und flaues Grau darauf kippt unter 4.5:1. Welcher Reiter aktiv ist, traegt
         die gefuellte Pille — nicht ein Helligkeitsunterschied. */
      color: var(--text);
      transition: color var(--dur-fast), background var(--dur-fast), transform 120ms var(--ease-out);
    }
    .tab:active { transform: scale(.96); }
    .tab svg { width: 20px; height: 20px; }
    .tab .tl { display: none; }
    .tab .ts { display: inline; }
    /* Die aktive Pille ist DECKEND, nicht getoent. Getoent auf Glas gerechnet: liegt hinter
       der Kapsel eine helle Bildstelle (weisser Teller), faellt Akzentrot darauf auf ~1.8:1.
       Deckend steht die Beschriftung auf definiertem Grund — 6:1 dunkel, 8:1 hell — und die
       Pille hebt sich zugleich klarer von der Glasflaeche ab. */
    .tab[aria-selected="true"] {
      background: var(--surface);
      color: var(--accent-strong);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
    }
    /* Zaehler als Eckmarke am Symbol — neben dem Text ist in 66 px kein Platz.
       3px statt 1px: in der gerundeten Kapsel sitzt er sonst auf der Oberkante. */
    .tab .count { position: absolute; top: 3px; left: 50%; margin-left: 5px; font-size: 9.5px; padding: 0 5px; }
    /* Inset am Seitenende, damit das letzte Element und die Fusszeile (Impressum,
       Datenschutz) frei ueber der Kapsel stehen. Bewusst NICHT 0: dahinter durchwandern
       soll der Inhalt beim Scrollen, dauerhaft verdeckt sein darf er nicht.
       --tabbar-h misst syncStickyOffsets(); der Rueckfall 58px ist die gerechnete Hoehe
       (5 + 46 + 5 Innenmass + 2 Rahmen) und haelt den ersten Bildaufbau ruhig. */
    .app { padding-bottom: calc(var(--tabbar-h, 58px) + 24px + env(safe-area-inset-bottom, 0px)); }
    #toast { bottom: calc(var(--tabbar-h, 58px) + 28px + env(safe-area-inset-bottom, 0px)); }
  }
  /* Rueckfall ohne Weichzeichner: halbtransparent OHNE Blur hiesse Text auf Text. Dann
     lieber deckend. Gleiches gilt fuer "Transparenz reduzieren" im Betriebssystem. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header.site::before { background: color-mix(in srgb, var(--bg) 97%, var(--surface)); }
    /* Nur die schwebende Kapsel: am Rechner steht die Leiste im Kopf und ist ohnehin deckend. */
    @media (max-width: 680px) { .tabs { background: color-mix(in srgb, var(--surface) 96%, var(--bg)); } }
  }
  @media (prefers-reduced-transparency: reduce) {
    header.site::before { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); }
    @media (max-width: 680px) {
      .tabs { -webkit-backdrop-filter: none; backdrop-filter: none; background: color-mix(in srgb, var(--surface) 97%, var(--bg)); }
    }
  }

  main { padding: 28px 0 80px; }

  /* ---------- Footer (Rechtliches) ---------- */
  .site-foot { border-top: 1px solid var(--border); margin-top: auto; background: color-mix(in srgb, var(--surface-2) 40%, var(--bg)); }
  .foot-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; padding: 16px 0; flex-wrap: wrap; }
  .foot-copy { font-size: 12.5px; color: var(--text-muted); }
  .foot-nav { display: flex; align-items: center; gap: 8px; }
  .foot-link { font: inherit; font-size: 12.5px; color: var(--text-muted); background: 0; border: 0; padding: 2px 2px; cursor: pointer; }
  .foot-link:hover { color: var(--accent-strong); text-decoration: underline; }
  .foot-sep { color: var(--border-strong); }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .legal h4 { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; margin: 18px 0 5px; }
  .legal h4:first-child { margin-top: 0; }
  .legal p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.6; color: var(--text); }
  .legal p.muted, .legal a { color: var(--text-muted); }
  .credits { overflow-x: auto; margin: 0 0 10px; }
  .credits table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 12px; }
  .credits th, .credits td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .credits th { color: var(--text-muted); font-weight: 650; white-space: nowrap; }
  .credits td { color: var(--text); }
  .legal a { color: var(--accent-strong); }
  .legal-draft { font-size: 12.5px; line-height: 1.55; background: color-mix(in srgb, var(--fr) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fr) 30%, transparent); border-radius: var(--radius-sm); padding: 10px 12px; margin: 0 0 16px; color: var(--text); }

  /* ---------- Section head ---------- */
  .section-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .section-head .title { margin-right: auto; }
  .section-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 27px; margin: 0 0 2px; letter-spacing: .2px; }
  .section-head .sub { color: var(--text-muted); font-size: 14px; }

  /* ---------- Buttons ---------- */
  .btn {
    font: inherit; font-size: 14px; font-weight: 550; cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    padding: 9px 15px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; gap: 8px; transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast);
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  /* Gesperrte Knoepfe sahen bisher aus wie bedienbare – es gab gar keinen Stil dafuer.
     Kein Zeiger, kein Hover, kein Anheben beim Druecken: der Knopf soll auch beim
     Antippen erkennbar nicht reagieren. */
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .btn:disabled:hover { border-color: var(--border-strong); }
  .btn.primary:disabled:hover { border-color: var(--accent); }
  .btn:disabled:active { transform: none; }
  /* Sieht gesperrt aus, ist es aber nicht: ein echtes disabled schluckt den Klick, und
     dann liesse sich beim Antippen auch nicht sagen, WARUM es nicht weitergeht. Deshalb
     nur die Optik plus aria-disabled – die Meldung kommt aus dem Klick-Handler. */
  .btn.is-off { opacity: .45; box-shadow: none; }
  .btn.is-off:active { transform: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
  .btn.ghost:hover { color: var(--text); background: var(--surface-2); border-color: transparent; }
  .btn.danger { color: var(--accent); border-color: transparent; }
  .btn.danger:hover { background: color-mix(in srgb, var(--accent) 13%, var(--surface)); border-color: transparent; color: var(--accent-strong); }
  /* Löschen als Icon-Button (Meal-Karte) – dezent grau, Hover in Theme-Rot.
     Sichtbar 34 px, Trefferflaeche per Pseudo-Element auf 44 × 44 erweitert
     (hitSlop-Muster) – so bleibt die Button-Zeile niedrig und der Touch-Target konform.
     Das Abruecken nach rechts (margin-left:auto) sitzt am Teilen-Button davor, nicht
     hier - sonst klemmen bei vier Buttons drei links und nur einer isoliert rechts. */
  .btn.del-ic { position: relative; width: 34px; height: 34px; padding: 0; justify-content: center; color: var(--text-muted); background: transparent; border-color: transparent; }
  .btn.del-ic::after { content: ""; position: absolute; inset: -5px; }
  .btn.del-ic svg { width: 17px; height: 17px; }
  .btn.del-ic:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: transparent; }
  .btn svg { width: 16px; height: 16px; }
  /* Icon-Button ohne Text, gleiches hitSlop-Muster wie .btn.del-ic, aber neutral statt
     rot beim Hover - "Woche teilen"/"Woche leeren" sind keine Loeschaktionen. */
  .btn.icon-gh { position: relative; width: 34px; height: 34px; padding: 0; justify-content: center; }
  .btn.icon-gh::after { content: ""; position: absolute; inset: -5px; }
  .btn.icon-gh svg { width: 17px; height: 17px; }
  /* Favoriten-Herz: gleiches Groessen-/Hit-Slop-Muster wie .btn.del-ic. Ruhezustand grau,
     aktiv gefuellt in --accent. Gold ist Pro vorbehalten. Skaliert nur beim Antippen (icon,
     nicht der ganze Button) - hochfrequente Aktion, daher kurz und ohne Einschwingen. */
  .btn.fav-ic { position: relative; width: 34px; height: 34px; padding: 0; justify-content: center;
    color: var(--text-muted); background: transparent; border-color: transparent; }
  .btn.fav-ic::after { content: ""; position: absolute; inset: -5px; }
  .btn.fav-ic svg { width: 17px; height: 17px; transition: transform var(--dur-fast) var(--ease-out); }
  .btn.fav-ic:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: transparent; }
  .btn.fav-ic.on { color: var(--accent); }
  .btn.fav-ic.on svg { fill: currentColor; }
  .btn.fav-ic:active svg { transform: scale(.85); }
  .btn.sm { padding: 6px 11px; font-size: 13px; }

  /* ---------- Week grid ---------- */
  /* Wochenplan-Kopf: Titel oben, Werkzeugleiste eine Zeile darunter */
  .plan-head { flex-direction: column; align-items: stretch; gap: 16px; }
  .plan-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .week-switch { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .ws-btn { font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .01em; cursor: pointer; border: 0; background: transparent; color: var(--text-muted); padding: 7px 15px; border-radius: 999px; white-space: nowrap; transition: color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast); }
  .ws-btn:hover { color: var(--text); }
  .ws-btn.active { color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong)); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 34%, transparent); }
  .shop-cta { display: flex; align-items: center; justify-content: center; gap: 11px; width: 100%; margin: 22px 0 2px; padding: 16px; font: inherit; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong)); border: 0; border-radius: var(--radius); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 26%, transparent); transition: transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease; }
  .shop-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 32%, transparent); }
  .shop-cta svg { width: 22px; height: 22px; }
  .week { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
  .day {
    position: relative;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
    transition: transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease, border-color var(--dur-fast) ease;
  }
  .day::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 1;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  }
  .day:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
    box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .day.today { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), var(--shadow); }
  .day.today::before { height: 5px; }
  .day > .day-head {
    display: flex; align-items: center; justify-content: space-between; gap: 6px 8px;
    flex-wrap: wrap; /* schmale Karte: das Ueberschreitungs-Zeichen darf umbrechen,
                        statt den Heute-Chip aus der Karte zu draengen */
    padding: 15px 15px 12px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 12%, var(--surface)), var(--surface));
    border-bottom: 1px solid var(--border);
  }
  .day-head .dname { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: .2px; }
  .day-head .dtag {
    font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-muted); background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 999px;
  }
  .day.today .dtag {
    color: var(--accent-contrast); border-color: transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .day-head .dnum { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  /* Ueber dem Tagesziel: Zeichen UND Text, nie nur Farbe. Steht vor dem Tages-Chip,
     damit es beim Ueberfliegen der Wochenspalten sofort auffaellt. */
  .day-head .dover {
    margin-left: auto; display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; letter-spacing: .03em;
    white-space: nowrap; color: var(--accent); padding: 3px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .day-head .dover svg { width: 11px; height: 11px; flex: none; }
  .day.over > .day-head { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), var(--surface)); }

  /* ---- Trainingstag ----
     Rot und Blau sind fast gleich hell (1,07:1) und fuer Farbenblinde nicht zu trennen.
     Die Markierung besteht deshalb aus drei Trägern: Rand, Hantel-Icon UND dem Wort
     „Training". Wer nur einen davon entfernt, nimmt der Markierung ihre Zugaenglichkeit. */
  .day.training { border-color: color-mix(in srgb, var(--train) 55%, var(--border)); }
  .day.training::before { background: linear-gradient(90deg, var(--train), var(--train-strong)); }
  /* Kopfzeile zieht mit — sonst steht ein blauer Rand ueber rosa Verlauf. Das :not(.over)
     ist bewusst und nicht durch Reihenfolge ersetzbar: ueberschreitet der Tag sein Ziel,
     muss die Warnung rot bleiben, egal ob trainiert wird. */
  .day.training:not(.over) > .day-head {
    background: linear-gradient(180deg, color-mix(in srgb, var(--train) 12%, var(--surface)), var(--surface));
  }
  .day.training:hover {
    border-color: color-mix(in srgb, var(--train) 70%, var(--border));
    box-shadow: 0 12px 30px color-mix(in srgb, var(--train) 20%, transparent);
  }
  /* Faellt „heute" auf einen Trainingstag, wird auch der Ring blau — sonst stossen roter
     Ring und blauer Rand aneinander. Dass es heute ist, traegt weiter der rote Chip. */
  .day.training.today { box-shadow: 0 0 0 1px color-mix(in srgb, var(--train) 45%, transparent), var(--shadow); }
  .day-head .dtrain {
    /* klebt am Tagesnamen und schiebt Ueberschreitungs-Zeichen + Tages-Chip nach rechts */
    margin-right: auto;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    white-space: nowrap; color: var(--train-strong); padding: 3px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--train) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--train) 40%, transparent);
  }
  /* 13px. Kein stroke-width hier: das Icon bringt seine Staerken selbst mit, und eine
     CSS-Regel wuerde das Praesentationsattribut im SVG ueberschreiben. */
  .day-head .dtrain svg { width: 13px; height: 13px; flex: none; }
  .wg-train { display: inline-flex; align-items: center; gap: 4px; color: var(--train-strong); }
  .wg-train svg { width: 13px; height: 13px; flex: none; }
  .slots { display: flex; flex-direction: column; gap: 2px; padding: 8px; flex: 1; }

  /* Tages-Nährwerte (Fuß der Tageskarte) */
  .day-nut { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; padding: 9px 14px 12px; border-top: 1px dashed var(--border); background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
  .day-nut .kcal { font-weight: 700; font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .day-nut .kcal small { font-weight: 600; color: var(--text-muted); }
  .day-nut .macros { display: flex; gap: 9px; margin-left: auto; font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .day-nut .macros b { font-weight: 650; color: var(--text); }
  .day-nut .m::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: baseline; background: var(--mc, var(--accent)); }
  .m.carb { --mc: var(--carb); } .m.prot { --mc: var(--prot); } .m.fat { --mc: var(--fat); }

  /* Wochen-Gesamtübersicht: kein eigener Rahmen mehr - Heute/Woche stehen mit ihrer
     eigenen Kartenoptik (.wg-col) direkt auf der Seite, ohne umschliessende zweite Karte
     ("Deine Ziele" als Aussenrahmen war Karte-in-der-Karte und ist entfallen). Der Block
     bleibt nur fuer den Abstand zum Wochenplan darunter bestehen. */
  .week-nut { margin-bottom: 20px; }
  /* Ohne Ziel gibt es nur noch die Kalorien-Kachel - die frueheren Makro-Kacheln sind
     entfallen (siehe weekNutHtml), deshalb nur noch eine schmale Kachel statt Raster. */
  /* Kein max-width mehr: eine schmale 220px-Kachel wirkte neben der breiten Ring-Ansicht
     (sobald ein Ziel existiert) kleinlich und unfertig. Volle Breite wie die uebrigen
     Karten dieser Ansicht. */
  .wn-tiles { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .wn-tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
  .wn-tile .val { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .wn-tile .val .u { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-left: 3px; font-family: var(--font-body); }
  .wn-tile .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .wn-tile .lbl::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tc, var(--accent)); }
  .wn-tile.t-kcal { --tc: var(--accent); }
  /* Ziel-Fortschritt: Balken gegen das im Kalorienrechner gespeicherte Tagesziel.
     Ueberschreitung faerbt bernstein (--danger) – Rot ist bereits die Akzentfarbe. */
  /* Zwei getrennte Farbachsen: --mc sagt WELCHES Makro (Punkt vor dem Label),
     --sc sagt WIE es steht (Balken). Sonst wuerde die Kategoriefarbe die Warnung
     ueberdecken – und der Zustand steht ohnehin zusaetzlich als Text da. */
  /* „noch offen“ = gedaempftes Gruen: sichtbar, aber ohne die Aussage „geschafft“.
     Anteil so gewaehlt, dass der Balken gegen die Rinne noch ≥3:1 steht. */
  .gm { --mc: var(--accent); --sc: color-mix(in srgb, var(--ok) 55%, var(--surface-2)); --sc2: color-mix(in srgb, var(--ok) 40%, var(--surface-2)); margin-top: 9px; }
  .gm-r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11.5px; margin-bottom: 5px; }
  .gm-n { color: var(--text-muted); font-weight: 600; }
  .gm-n::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--mc); }
  .gm-v { color: var(--text-muted); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gm-v b { color: var(--text); font-weight: 700; }
  .gm-bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .gm-bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sc2), var(--sc)); transition: width var(--dur-slow) ease; }
  .gm-left { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .gm.t-carb { --mc: var(--carb); } .gm.t-prot { --mc: var(--prot); } .gm.t-fat { --mc: var(--fat); }
  /* Zustaende: noch offen (neutral) – im Ziel (gruen) – drueber (rot) */
  .gm.is-ok   { --sc: var(--ok); --sc2: color-mix(in srgb, var(--ok) 72%, #000); }
  .gm.is-over { --sc: var(--accent); --sc2: var(--accent-strong); }
  .gm.is-ok .gm-left { color: var(--ok); }
  .gm.is-over .gm-v b, .gm.is-over .gm-left { color: var(--accent); }
  /* Ring + Kennzahlen-Liste statt Fortschrittsring mit Text daneben (Vorbild: schlichte
     Fitness-App-Karte, siehe Nutzer-Screenshot "Beispiel"). Der Ring traegt keinen
     Fortschritts-Bogen: farbig nach Zustand (is-ok gruen, is-over Akzent), Rest bleibt
     zusaetzlich IMMER als Text da (Zahl + Wortwechsel "Verbleibend"/"Drüber" in .wg-c) -
     die Farbe des Bogens verstaerkt nur, traegt die Information nicht allein.
     Kein Prozentwert mehr - er stand nirgends in einer Handlung, "wie viel bleibt in
     kcal" beantwortet die Frage direkter. */
  /* Eyebrow-Zeile (Zeitraum + Kennzeichen) steht jetzt UEBER beiden Spalten, spannt die
     volle Breite - vorher war sie Teil der linken Spalte, wodurch "Makros" rechts auf
     Hoehe der Eyebrow-Zeile stand statt auf Hoehe von "Kalorien" (beide Ueberschriften
     muessen gleich weit oben stehen, sonst wirkt es wie zwei verschieden hohe Karten). */
  .wg { display: flex; flex-direction: column; gap: 10px; }
  .wg-row { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-start; }
  /* Zwei Spalten wie im Vorbild: links "Kalorien" (Ring+Kennzahlen), rechts "Makros"
     (Balken). flex-wrap statt fester Breakpoint - auf schmalen Screens faellt die
     Makro-Spalte von selbst darunter, sobald fuer beide nebeneinander kein Platz mehr ist. */
  .wg-col-cal { flex: 2 1 320px; min-width: 0; }
  .wg-col-macros { flex: 1 1 220px; min-width: 200px; }
  /* Kleine Zeile ueber den grossen Ueberschriften: Zeitraum + Kennzeichen. */
  .wg-lbl { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-family: var(--font-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
  /* Grosse Ueberschrift "Kalorien"/"Makros" - traegt jetzt, was vorher eine kleine
     Eyebrow-Zeile war. Normale Gross-/Kleinschreibung wie im Vorbild, nicht Versalien. */
  .wg-h { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--text); margin: 0 0 14px; }
  .wg-main { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .wg-ring { flex: none; position: relative; width: 118px; height: 118px; }
  .wg-ring svg { transform: rotate(-90deg); }
  /* --border-strong statt --surface-2: die Ring-Karte (.wg-col) hat selbst
     --surface-2 als Hintergrund - bei 0% (kein farbiger Bogen sichtbar) war die Kontur
     bislang exakt so dunkel wie die Flaeche dahinter und damit komplett unsichtbar. */
  .wg-track { fill: none; stroke: var(--border-strong); stroke-width: 6; }
  .wg-fill { fill: none; stroke: color-mix(in srgb, var(--ok) 55%, var(--surface-2)); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
  .wg.is-ok .wg-fill { stroke: var(--ok); }
  .wg.is-over .wg-fill { stroke: var(--accent); }
  /* Zahl in der Ringmitte bleibt IMMER neutral (--text/--text-muted), auch bei "Drüber" -
     nur der Ring-Bogen faerbt sich nach Zustand (siehe .wg-fill oben). Zwei rote Elemente
     an derselben Stelle (Bogen UND Zahl) wirkten zu einfarbig; das Wort "Drüber" traegt
     den Zustand als Text bereits, dafuer muss die Zahl nicht auch noch rot werden. Genau
     wie im Vorbild-Screenshot: Ring farbig, Zahl in der Mitte bleibt weiss. */
  .wg-c { position: absolute; inset: 0; display: grid; place-content: center; gap: 2px; text-align: center; }
  .wg-c b { font-family: var(--font-display); font-size: 25px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text); }
  .wg-c span { font-size: 10.5px; color: var(--text-muted); font-weight: 700; letter-spacing: .04em; }
  /* Kennzahlen-Liste (Grundziel/Ernaehrung/Training): Icon in einer dezenten Kachel,
     Label ueber dem Wert - wie im Vorbild, nicht Wert-dann-Label wie die uebrigen
     Kacheln der App (.wn-tile), weil hier bewusst 1:1 nachgebaut wird. */
  .wg-stats { display: flex; flex-direction: column; gap: 13px; flex: 1 1 150px; min-width: 140px; }
  .wg-stat { display: flex; align-items: center; gap: 10px; }
  .wg-stat-ic {
    flex: none; width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center; background: var(--surface-2);
  }
  .wg-stat-ic svg { width: 16px; height: 16px; }
  .wg-stat.base .wg-stat-ic { color: var(--text-muted); }
  .wg-stat.food .wg-stat-ic { color: var(--accent); }
  .wg-stat.train .wg-stat-ic { color: var(--train); }
  .wg-stat-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .wg-stat-txt small { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  .wg-stat-txt b { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  /* Zwei flache Leisten untereinander (Tag, Woche). */
  .wg-cols { display: flex; flex-direction: column; gap: 10px; }
  .wg-col { position: relative; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 16px; transition: border-color var(--dur-fast) ease; }
  /* Zielaktion ("Ziele neu berechnen"): eine eigene Zeile UNTER beiden Karten, weil sie
     beide betrifft - das Ziel gilt fuer Tag wie Woche. Vorher sass sie in der Kopfzeile nur
     der Heute-Karte und machte deren Kopf rund 17px hoeher als den der Wochenkarte; auf dem
     Handy sprang "Kalorien" samt Ring beim Wischen um genau diesen Betrag. Am Rechner
     rechtsbuendig und dezent, auf dem Handy volle Breite (siehe Handy-Abfrage). */
  .wg-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
  .wg-recalc svg { width: 15px; height: 15px; }
  /* Hinweis in der rechten Spalte, wo im Leerzustand sonst Makrobalken bzw. Fortschrittsbalken
     saessen (dayRight/weekRight in weekGoalHtml). */
  .wg-side-note { margin: 2px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--text-muted); max-width: 34ch; }
  /* Rueckblick (Paket C1): Streak + Mini-Trend + Ziel-Treffer. Gleiche Kartenoptik wie .wg-col. */
  .rueck { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 10px; }
  .rueck-streak { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; font-size: 14px; color: var(--text); }
  .rueck-streak b { font-family: var(--font-display); font-size: 17px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .rueck-fl { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .rueck-bars { display: flex; align-items: flex-end; gap: 5px; height: 60px; margin: 14px 0 0; }
  .rueck-bar { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; height: 100%; }
  .rueck-bar i { display: block; width: 100%; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, var(--accent), var(--accent-strong)); }
  .rueck-foot { display: flex; gap: 22px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .rueck-s { display: flex; flex-direction: column; gap: 2px; }
  .rueck-s small { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .rueck-s b { font-family: var(--font-display); font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
  .rueck-s b span { font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }
  /* An Trainingstagen bekommt die "Heute"-Karte denselben blauen Rand + Kopfstreifen wie
     die Tageskarten im Wochenplan (.day.training) - direkt beim App-Start sichtbar, ohne
     erst die Wochenansicht durchsuchen zu muessen. Icon+Wort "Training" stehen bereits in
     der Eyebrow-Zeile (dayTrain) - der Rand ist hier nur die zusaetzliche, schnell
     erfassbare Verstaerkung, nicht der einzige Traeger der Information. */
  .wg-col.wg-col-training { border-color: color-mix(in srgb, var(--train) 55%, var(--border)); }
  .wg-col.wg-col-training::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--train), var(--train-strong));
  }
  /* Kennzeichen in der Titelzeile: Ziel-Modus bei „Heute“, Planungsstand bei der Woche.
     Traegt den Kontext, ohne eine weitere Zeile aufzumachen. */
  .wg-chip {
    font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .wg-chip.plain { color: var(--text-muted); background: transparent; border-color: var(--border-strong); text-transform: none; letter-spacing: .02em; }
  .wg-macros { display: flex; flex-wrap: wrap; gap: 12px 14px; min-width: 0; }
  /* Eigene Spalte statt Zeile unter Ring+Liste (siehe .wg-col-macros oben) - betrifft
     aktuell nur die "Heute"-Karte (dort stehen die Makros weiterhin rechts). "Diese
     Woche" hat rechts stattdessen "Fortschritt" (siehe weekGoalHtml), keine Makros mehr.
     Nur in dieser Spalte untereinander statt nebeneinander, weil die Spalte selbst schon
     schmal ist (siehe .wg-col-macros) - die Tageskarten (.day-goals .wg-macros) bleiben
     von dieser Regel unberuehrt.
     WICHTIG: flex-basis 150px (unten, .wg-macros .gm) ist fuer die REIHEN-Anordnung
     gedacht (Breite). In flex-direction:column wird dieselbe Basis zur Hoehe - jeder
     Balken wollte dadurch 150px HOCH sein, was den riesigen Abstand zwischen Protein/
     Kohlenhydrate/Fett verursacht hat. Deshalb hier auf auto zuruecksetzen. */
  .wg-col-macros .wg-macros { flex-direction: column; }
  .wg-col-macros .wg-macros .gm { flex: 0 0 auto; }
  /* 150 px Basis ist die Untergrenze, bei der „Kohlenhydrate“ und der Wert noch
     nebeneinander passen. Schmaler wuerde nur ein Teil der drei umbrechen und sie
     stuenden versetzt — lieber einer pro Zeile als drei ausgefranste. */
  .wg-macros .gm { margin-top: 0; flex: 1 1 150px; min-width: 0; }
  /* Protein etwas breiter und kraeftiger als KH/Fett: beim Abnehmen ist es die
     wichtigste Nebengroesse (Saettigung, Muskelerhalt) und intern schon als
     Untergrenze modelliert — das darf man auch sehen. */
  .wg-macros .gm.t-prot { flex-grow: 1.35; }
  .wg-macros .gm.t-prot .gm-n { font-size: 12.5px; }
  .wg-macros .gm.t-prot .gm-v b { font-size: 13px; }
  .wg-macros .gm.t-prot .gm-bar { height: 8px; }
  /* Restbudget fuer die noch ungeplanten Tage — beim Planen die gesuchte Zahl */
  .wg-open {
    margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .wg-open b { color: var(--text); font-weight: 700; }
  /* Fortschritt der Woche - rechte Spalte bei "Diese Woche" statt Makros (siehe
     weekGoalHtml): wie viele der 7 Tage schon geplant sind. */
  .wg-progress-txt { font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 8px; }
  .wg-progress-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .wg-progress-bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width var(--dur-slow) ease; }
  .wg-macros .gm-r { gap: 8px; margin-bottom: 5px; }
  .wg-macros .gm-n { font-weight: 700; color: var(--text); }
  .wg-macros .gm-v { font-size: 11.5px; }

  /* „Ziele <Jahr>" – Gewichtsverlauf. Sitzt in derselben Kartenschale wie die
     Kalorien-Ringe (.wg-col), damit auf dem Startreiter eine Optik herrscht.
     Alle Farben kommen aus Tokens: nur so stimmen Hell und Dunkel beide. */
  /* overflow sichtbar (anders als .wg-col): sonst schneidet die Kartenkante das Menue
     hinter dem Plus-Knopf ab. Geclippt werden muss hier nichts - das Diagramm-SVG
     regelt seinen Ueberstand selbst. */
  .wch { margin-top: 10px; overflow: visible; }
  .wch-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  /* Ankerpunkt fuer .menu (position:absolute; right:0) - ohne ihn haengt das Menue an
     der ganzen Karte und rutscht an deren rechten Rand. */
  .wch-menu { position: relative; flex: none; }
  /* Gleiche Optik wie das Foto-Plus auf den Meal-Karten (.rcard .imgadd), nur groesser
     und im Fluss statt absolut: 36px sichtbar, Trefferflaeche per ::after auf 44px. */
  .wch-add {
    position: relative; width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; font-size: 23px; line-height: 1; padding: 0;
    color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform var(--dur-fast) ease;
  }
  .wch-add::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
  .wch-add:hover { transform: scale(1.12); }
  .wch-head .wg-h { margin-bottom: 10px; }
  .wch-stats { display: flex; gap: 16px; flex-wrap: wrap; }
  .wch-s { display: flex; flex-direction: column; gap: 2px; }
  .wch-s small { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); }
  .wch-s b { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
  .wch-s b span { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-left: 3px; font-family: var(--font-body); }
  /* Richtung der Veraenderung: gruen heisst „naeher am Ziel", nicht „weniger" — wer
     aufbaut, sieht eine Zunahme gruen (siehe zunahmeIstZiel in weightHtml). Das
     Vorzeichen steht im Text daneben, die Farbe verstaerkt es nur. */
  .wch-s b.is-toward { color: var(--ok); }
  .wch-s b.is-away { color: var(--accent-strong); }
  .wch .week-switch { margin: 2px 0 10px; }
  .wch-plot { width: 100%; }
  .wch-svg { display: block; max-width: 100%; overflow: visible; }
  .wch-grid { stroke: var(--border); stroke-width: 1; }
  .wch-ay { fill: var(--text-muted); font-size: 10px; text-anchor: end; font-family: var(--font-body); }
  .wch-ax { fill: var(--text-muted); font-size: 10px; text-anchor: middle; font-family: var(--font-body); }
  .wch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .wch-goal { stroke: var(--text-muted); stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; }
  /* Hohl statt gefuellt: unterscheidet den Zielpunkt im Dezember auf einen Blick von
     den gefuellten Messpunkten und beendet die Linie sichtbar, statt sie auslaufen
     zu lassen. */
  .wch-goal-dot { fill: var(--surface-2); stroke: var(--text-muted); stroke-width: 2; }
  .wch-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  /* Unsichtbare, aber grosse Trefferflaeche: der sichtbare Punkt ist 8px breit und
     mit dem Finger sonst nicht zu treffen. */
  .wch-hit { fill: transparent; }
  .wch-pt { cursor: pointer; }
  .wch-pt:focus { outline: none; }
  .wch-pt.is-on .wch-dot, .wch-pt:focus-visible .wch-dot { r: 6; stroke: var(--accent-strong); }
  .wch-leg { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--text-muted); }
  .wch-leg span { display: inline-flex; align-items: center; gap: 6px; }
  .wch-leg i { width: 16px; height: 0; border-top: 2px solid var(--accent); border-radius: 2px; }
  .wch-leg i.k-goal { border-top-style: dashed; border-color: var(--text-muted); }
  .wch-tip { margin-top: 8px; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; min-height: 17px; }
  .wch-empty { margin: 6px 0 0; font-size: 13.5px; color: var(--text-muted); }
  /* Kennzahlenreihe als Fuss der Karte: Trennlinie setzt sie vom Diagramm ab. */
  .wch-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  /* Verlaufsliste im Wiegen-Dialog */
  .wl-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .wl-row .wl-d { flex: 1; font-size: 13.5px; color: var(--text); }
  .wl-row .wl-k { font-weight: 700; font-size: 14px; }
  .wl-empty { font-size: 13px; color: var(--text-muted); margin: 8px 0 0; }

  /* Kalorien breit, darunter die Makros (.wg-macros, wiederverwendet von "Ziele dieser
     Woche" – siehe dayGoalsHtml). Die Tageskarte sitzt in einem auto-fill-Grid und wird
     im Desktop-Raster nur ~232px breit; .wg-macros schrumpft dort von selbst auf ein
     Makro pro Zeile (flex-wrap, siehe dort), statt Namen abzukuerzen. */
  .day-goals { padding: 11px 14px 13px; border-top: 1px dashed var(--border); background: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
  .day-goals .wg-macros { margin-top: 12px; }
  /* Aufklapp-Knopf fuer die drei Makrobalken - im Ruhezustand zaehlt nur der
     Kalorien-Balken, die Makros stehen einen Tap entfernt (siehe dayGoalsHtml). */
  .day-goals-toggle {
    display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 9px;
    font: inherit; font-size: 11px; font-weight: 600; color: var(--text-muted);
    background: none; border: 0; padding: 6px 0; cursor: pointer; min-height: 32px;
  }
  .day-goals-toggle:hover { color: var(--text); }
  .day-goals-toggle .caret { width: 13px; height: 13px; flex: none; transition: transform var(--dur-fast); }
  .day-goals-toggle .caret.open { transform: rotate(90deg); }

  /* Nährwerte in der Rezept-Detailansicht */
  .nutfacts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .nutfacts .nf { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; }
  .nutfacts .nf .v { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .nutfacts .nf .v .u { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-left: 2px; }
  .nutfacts .nf .k { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .nutfacts .nf .k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--accent)); }
  .nutfacts .nf.t-kcal { --tc: var(--accent); } .nutfacts .nf.t-carb { --tc: var(--carb); } .nutfacts .nf.t-prot { --tc: var(--prot); } .nutfacts .nf.t-fat { --tc: var(--fat); }
  @media (max-width: 560px) { .nutfacts { grid-template-columns: repeat(2, 1fr); } }

  .slot { position: relative; border-radius: var(--radius-sm); padding: 8px 10px 9px 12px; transition: background var(--dur-fast); }
  .slot::before { content:""; position:absolute; left:5px; top:10px; bottom:10px; width:3px; border-radius:3px; background: var(--slot-c); opacity:.9; }
  .slot[data-meal="fr"] { --slot-c: var(--fr); }
  .slot[data-meal="mi"] { --slot-c: var(--mi); }
  .slot[data-meal="ab"] { --slot-c: var(--ab); }
  .slot .mlabel { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--slot-c); margin-bottom: 3px; }
  .slot .add {
    font: inherit; font-size: 13px; width: 100%; text-align: left; cursor: pointer;
    border: 1px dashed var(--border-strong); background: transparent; color: var(--text-muted);
    padding: 7px 10px; border-radius: var(--radius-sm); transition: border-color var(--dur-fast), color var(--dur-fast), background var(--dur-fast);
  }
  .slot .add:hover { border-color: var(--slot-c); color: var(--text); background: color-mix(in srgb, var(--slot-c) 7%, transparent); }
  .slot .add.more { font-size: 12px; padding: 5px 10px; opacity: .8; }
  .slot .filled + .filled, .slot .filled + .add, .slot .add + .filled { margin-top: 4px; }
  .slot .filled {
    display: flex; align-items: flex-start; gap: 8px;
    background: color-mix(in srgb, var(--slot-c) 9%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--slot-c) 24%, var(--surface));
    border-radius: var(--radius-sm); padding: 8px 8px 8px 10px; cursor: grab;
  }
  .slot .filled:active { cursor: grabbing; }
  .slot .filled img.r-thumb { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex: none; margin-top: 1px; }
  .slot .filled .r-name { font-size: 13.5px; font-weight: 550; line-height: 1.3; flex: 1; word-break: break-word; }
  .slot .filled .r-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .slot .filled .x {
    flex: none; border: 0; background: transparent; color: var(--text-muted); cursor: pointer;
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 15px; line-height: 1;
  }
  .slot .filled .x:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .slot.dragover { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: 2px dashed var(--accent); outline-offset: -2px; }
  .slot.nodrop { opacity: .4; cursor: not-allowed; }
  .filled.dragging { opacity: .4; }

  /* ---------- Recipe grid ---------- */
  .catgroup { margin-bottom: 22px; }
  .cathead {
    display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 12px;
    padding: 6px 2px; background: none; border: none; border-bottom: 1px solid var(--border);
    color: var(--text); font: inherit; cursor: pointer; text-align: left;
  }
  .cathead:hover { border-bottom-color: var(--border-strong); }
  /* Waehrend der Suche ist die Kopfzeile nur Beschriftung, kein Knopf - siehe paintRecipeGroups(). */
  .cathead.static { cursor: default; padding-left: 25px; }
  .cathead.static:hover { border-bottom-color: var(--border); }
  .cathead .caret { width: 15px; height: 15px; flex: none; color: var(--text-muted); transition: transform var(--dur-fast); }
  .cathead .caret.open { transform: rotate(90deg); }
  .cathead .cname { font-size: 14.5px; font-weight: 650; letter-spacing: .01em; display: inline-flex; align-items: center; gap: 7px; }
  .cathead .cname .cicon { width: 16px; height: 16px; flex: none; color: var(--text-muted); }
  .cathead .ccount {
    font-size: 11.5px; font-weight: 650; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 1px 8px; border-radius: 999px;
  }
  /* Suchfeld im Meals-Reiter, eigene Zeile unter der .section-head (die ist flex-wrap und
     streckt auf 720px .btn per flex:1 - ein drittes Element wuerde mitgestreckt). */
  .recipe-search { position: relative; margin: -6px 0 18px; }
  .recipe-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-muted); pointer-events: none; }
  /* Attributselektor, nicht nur "input": input[type="search"] (Zeile ~1113) hat dieselbe
     Spezifitaet und steht spaeter - dessen Kurzform "padding: 9px 11px" loeschte sonst das
     padding-left und die Lupe laege auf dem Platzhaltertext. */
  .recipe-search input[type="search"] { padding-left: 34px; }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .rcard {
    position: relative;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 0; display: flex; flex-direction: column; overflow: hidden;
    transition: transform var(--dur-fast) ease, box-shadow var(--dur-fast) ease, border-color var(--dur-fast) ease;
  }
  .rcard::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 2;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  }
  .rcard:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent) 42%, var(--border));
    box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  /* Ganze Karte als Drop-Ziel fuer ein Foto aus dem Dateisystem (Desktop) - im
     Ruhezustand unsichtbar, nur waehrend des Ziehens ein Rahmen als Rueckmeldung.
     Mobil fehlt echtes OS-Datei-Drag ohnehin, daher keine eigene Handhabung noetig. */
  .rcard.dragover-file { outline: 2px dashed var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .rcard .imgadd {
    position: absolute; top: 12px; right: 10px; z-index: 3;
    width: 28px; height: 28px; border: 0; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; font-size: 19px; line-height: 1; padding: 0;
    color: var(--accent-contrast); background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform var(--dur-fast) ease;
  }
  .rcard .imgadd:hover { transform: scale(1.12); }

  /* Zutaten-Zeilen im Meal-Formular */
  /* Akzentbalken oben wie bei den Meal-Karten (.rcard::before) — grenzt die einzelnen
     Zutaten sichtbar voneinander ab; etwas schmaler, weil hier mehrere untereinander stehen */
  /* overflow bleibt sichtbar, damit die Vorschlagsliste der Zutaten-Suche aus der Zeile
     herausragen darf; der Akzentbalken rundet sich dafuer selbst oben mit ab. */
  .ing-row { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 12px 11px; margin-bottom: 9px; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
  .ing-row::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 2;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  }
  .ing-row:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--border-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
  /* Die offene Vorschlagsliste hebt ihre Zeile ueber die darunterliegenden Zeilen */
  .ing-row.ac-open { z-index: 5; }
  .ing-top { display: flex; align-items: center; gap: 8px; }
  /* Name und Barcode-Knopf bleiben zusammen — auch wenn die Zeile mobil umbricht */
  .ing-nrow { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .ing-nwrap { position: relative; flex: 1; min-width: 0; }
  .ing-nwrap .ing-name { width: 100%; }
  /* Zutaten-Suche: Vorschlaege aus der eingebauten Naehrwerttabelle (ARIA-Listbox) */
  .ing-ac {
    position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0;
    margin: 0; padding: 4px; list-style: none; max-height: 236px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); box-shadow: var(--shadow);
  }
  .ing-ac-item {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    min-height: 40px; padding: 9px 10px; border-radius: 7px; cursor: pointer;
    transition: background-color var(--dur-fast), color var(--dur-fast);
  }
  .ing-ac-item .fname { font-weight: 600; color: var(--text); }
  .ing-ac-item .fnut { flex: none; font-size: 11px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ing-ac-item:hover, .ing-ac-item.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
  .ing-ac-item:hover .fnut, .ing-ac-item.on .fnut { color: var(--accent); }
  /* Mengen-Feld mit Einheiten-Auswahl (g / ml / Stueck) */
  .ing-gwrap { display: flex; gap: 6px; flex: none; width: 158px; }
  .ing-gwrap .ing-g { flex: none; width: 74px; text-align: right; }
  .ing-gwrap .ing-u { flex: 1; min-width: 0; padding: 8px 6px; }
  .ing-ic { flex: none; width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); border-radius: 9px; cursor: pointer; display: grid; place-items: center; font-size: 14px; line-height: 1; padding: 0; transition: color var(--dur-fast), border-color var(--dur-fast), background-color var(--dur-fast); }
  .ing-ic svg { width: 17px; height: 17px; }
  .ing-ic:disabled, .ing-barcode:disabled { opacity: .5; cursor: default; }
  /* Beschriftet statt nur bebildert: auf Touch gibt es keine Tooltips, ein reines
     Symbol waere dort unauffindbar. Deshalb traegt der Knopf seinen Namen sichtbar. */
  .ing-barcode {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px;
    padding: 0 11px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); border-radius: 9px; cursor: pointer;
    font-family: var(--font-body); font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    transition: color var(--dur-fast), border-color var(--dur-fast), background-color var(--dur-fast);
  }
  .ing-barcode svg { width: 17px; height: 17px; flex: none; }
  .ing-barcode:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .ing-ic.busy, .ing-barcode.busy { animation: syncpulse 1s ease-in-out infinite; }
  .ing-del:hover { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  /* Naehrwerte zugeklappt. Wer die Zutat aus der Vorschlagsliste waehlt, bekommt sie
     automatisch gefuellt und muss sie gar nicht sehen — sichtbar kosteten die vier
     Felder 93 von 225 px Zeilenhoehe (gemessen). Zum Nachbessern aufklappbar, ueber
     <details> statt eigenem Zustand: nativ per Tastatur und Screenreader bedienbar. */
  .ing-nut { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  /* Zugeklappt braucht der Trennstrich weniger Luft — die Zeile traegt sich selbst. */
  .ing-nut:not([open]) { margin-top: 5px; padding-top: 4px; }
  .ing-nsum {
    display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer;
    list-style: none; /* Firefox */
  }
  .ing-nsum::-webkit-details-marker { display: none; } /* Safari/Chrome */
  .ing-nsum:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent); border-radius: var(--radius-sm); }
  .ing-nsum::after {
    content: "▾"; margin-left: auto; flex: none; color: var(--text);
    font-size: 14px; line-height: 1; opacity: .7; transition: transform var(--dur-fast);
  }
  .ing-nut[open] .ing-nsum::after { transform: rotate(180deg); }
  /* Feststehendes Label in der Kopfzeile (inkl. Bezugsgroesse .ing-per als Kind) -
     bricht nicht um, die Makro-Kurzfassung daneben bekommt den ganzen restlichen Platz. */
  .ing-ntitle { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
  /* Bezugsgroesse steht als Inline-Zusatz hinter "Makros" in der Kopfzeile, gleiches
     Muster wie "Makros · je Portion" in der Meal-Detailansicht - normale Schrift statt
     der Versalien von .ing-ntitle, damit sie als Nebeninfo lesbar bleibt. */
  .ing-per { font-size: 11px; font-weight: 400; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
  .ing-brief { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; text-align: right; gap: 10px; margin-left: auto; font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 0; }
  /* Aufgeklappt stehen dieselben Werte schon unten in den Feldern - die Kurzfassung
     in der Kopfzeile waere doppelt, deshalb nur zugeklappt sichtbar. */
  .ing-nut[open] .ing-brief { display: none; }
  .ing-brief .t-kcal { --tc: var(--accent); }
  .ing-brief .t-carb { --tc: var(--carb); }
  .ing-brief .t-prot { --tc: var(--prot); }
  .ing-brief .t-fat  { --tc: var(--fat); }
  .ing-vals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-bottom: 3px; }
  .ing-nut label { display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); text-align: center; }
  /* Farbpunkt vor dem Feldnamen, gleiches Muster wie .nutfacts .k / .macro .ml (nur der
     Punkt traegt Farbe, der Text bleibt --text-muted) - so uebernimmt sich die bekannte
     Kontrastschwaeche von Amber/Blau auf hellem Grund nicht in ein neues Textelement. */
  .ing-lbl { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .ing-lbl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--tc, var(--text-muted)); }
  .ing-vals label.t-kcal { --tc: var(--accent); }
  .ing-vals label.t-carb { --tc: var(--carb); }
  .ing-vals label.t-prot { --tc: var(--prot); }
  .ing-vals label.t-fat  { --tc: var(--fat); }
  .ing-nut input { width: 100%; padding: 7px 4px; text-align: center; }
  #f-ing-add { margin-top: 2px; }
  #f-ing-add[hidden] { display: none; }
  /* Makro-Summe: das Ergebnis der Zutaten, keine weitere Eingabezeile. Roter Rahmen und
     kraeftigere Schrift grenzen sie von den optisch gleichen Zutatenkarten darueber ab. */
  .nut-total {
    border: 1.5px solid var(--accent); border-radius: var(--radius);
    background: color-mix(in srgb, var(--accent) 6%, var(--surface-2));
    padding: 14px 14px 12px;
  }
  .nut-total > label {
    font-family: var(--font-display); font-size: 16px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--text);
  }
  .nut-total > label .hint { font-family: var(--font-body); text-transform: none; letter-spacing: 0; }
  .nut-total input { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .nut-total #f-kcal { color: var(--accent); }
  /* Gleiche Farbpunkte UND Kurzbeschriftung wie bei den Zutaten-Naehrwerten (.ing-lbl,
     .ing-nut label): Kcal/KH/P/F statt ausgeschriebener Woerter, damit "Makros gesamt"
     nicht anders beschriftet ist als die Zutatenzeilen darueber. Nur der Punkt traegt
     Farbe, der Text bleibt ueber .hint gedaempft (Kontrastschwaeche von Amber/Blau auf
     hellem Grund bleibt so aussen vor). */
  .nut-total .field .ing-lbl { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .nut-total .t-kcal { --tc: var(--accent); }
  .nut-total .t-carb { --tc: var(--carb); }
  .nut-total .t-prot { --tc: var(--prot); }
  .nut-total .t-fat  { --tc: var(--fat); }
  .rimg { position: relative; height: 116px; display: grid; place-items: center; overflow: hidden; }
  .rimg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(130px 66px at 78% 16%, rgba(255,255,255,.30), transparent); pointer-events: none; }
  .rimg.has-photo::after { display: none; }
  .rphoto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Makro-Hinweis oben links: .good (Proteinreich/Low Carb) nutzt --ok, das schon als
     "positiv"-Signal existiert (Sync verbunden). .fat nutzt dasselbe Blau wie die
     Naehrwert-Kacheln (--mc/--tc fuer Fett) - kein neuer Fett-Ton.
     Bis zu zwei Badges (Haupt-Makro + "Low Carb"), daher Flex mit Umbruch: auf
     schmalen Karten rutscht das zweite in die naechste Zeile statt aus dem Bild. */
  .rimg .mbadges { position: absolute; left: 11px; top: 10px; z-index: 1; display: flex; flex-wrap: wrap; gap: 5px; max-width: calc(100% - 22px); }
  .rimg .mbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #fff; background: rgba(16,18,13,.62); backdrop-filter: blur(4px); padding: 3px 9px 3px 7px; border-radius: 999px; }
  .rimg .mbadge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--mbc); flex: none; }
  .rimg .mbadge.good { --mbc: var(--ok); }
  .rimg .mbadge.fat { --mbc: var(--fat); }
  .rbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .rcard .top { display: flex; align-items: flex-start; gap: 10px; }
  .rcard h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; flex: 1; line-height: 1.25; word-break: break-word; }
  .chip { font-size: 11px; font-weight: 650; letter-spacing: .03em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.cat-fr { color: var(--fr); background: color-mix(in srgb, var(--fr) 14%, var(--surface)); }
  .chip.cat-ha { color: var(--mi); background: color-mix(in srgb, var(--mi) 14%, var(--surface)); }
  .chip.cat-x { color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
  .chip.example { color: var(--fr); background: color-mix(in srgb, var(--fr) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--fr) 32%, transparent); }
  .rcard .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--text-muted); font-size: 12.5px; }
  .rcard .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .rcard .meta svg { width: 14px; height: 14px; color: var(--accent); opacity: 1; }
  .rcard .ingredients { font-size: 13px; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 10px; line-height: 1.5; }
  /* flex-wrap: fuenf Knoepfe (mit dem Herz) passen auf schmalen Handys nicht mehr in eine
     Zeile - sie brechen um, statt die Karte zu sprengen. */
  .rcard .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: auto; padding-top: 4px; }
  /* Teilen+Loeschen+Herz als EIN Block rechts, Ansehen+Bearbeiten links. Der Block haelt
     die Icons beim Umbruch zusammen und bleibt per margin-left:auto auch in der zweiten
     Zeile rechts - einzeln umbrechende Icons landeten sonst links (Herz gehoert nach
     unten rechts). */
  .rcard .actions .act-icons { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .rcard .actions .btn.sm { gap: 6px; }
  .rcard .actions .btn.sm svg { width: 15px; height: 15px; }

  /* ---------- Empty state ---------- */
  .empty { text-align: center; padding: 60px 24px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); color: var(--text-muted); background: var(--surface); }
  .empty .em-ico { width: 52px; height: 52px; margin: 0 auto 14px; color: var(--accent); opacity: .85; }
  .empty h3 { font-family: var(--font-display); color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .empty p { margin: 0 auto 18px; max-width: 42ch; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, #0a0c07 55%, transparent); display: grid; place-items: start center; padding: 5vh 16px 16px; overflow-y: auto; color: var(--text); font-family: var(--font-body); }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.35);
    width: 100%; max-width: 540px; overflow: hidden;
    animation: pop var(--dur-fast) var(--ease-out); /* Fallback ohne @starting-style-Support */
    opacity: 1; transform: none;
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  @starting-style { .modal { opacity: 0; transform: translateY(8px) scale(.99); } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.99);} to { opacity: 1; transform: none; } }
  /* Live-Barcode-Scanner. Eigene Ebene ueber dem Modal-Overlay (60), aber unter dem
     Toast (90) - der Scanner wird AUS dem Meal-Formular geoeffnet, das darunter offen
     bleiben muss. Deshalb bewusst nicht ueber openModal(), das modalRoot leert.
     Farben (Paket D6, gepruefte Entscheidung, kein Uebersehen): bewusst FEST dunkel in
     beiden Themes, nicht auf --bg/--text-Tokens gemappt. Ein Kamera-Sucher ist wie ein
     Fotoapp-Viewfinder immer dunkel, unabhaengig vom Erscheinungsbild der App - genau wie
     bei nativen Kamera-UIs verbessert das feste Dunkel den Kontrast zum Kamerabild UND
     zum hellen Sucherrahmen (.scanframe, --accent). Im Hell-Theme waeren --bg/--text hier
     falsch (heller Sucher blendet, Rahmen ginge im hellen Hintergrund unter). */
  .scanwrap { position: fixed; inset: 0; z-index: 80; background: #0a0c07; display: grid; place-items: center; padding: 16px; color: var(--text); font-family: var(--font-body); }
  .scanbox { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
  .scanhead { display: flex; align-items: center; gap: 12px; color: #F4EFEE; }
  .scanhead h3 { font-family: var(--font-display); font-size: 20px; margin: 0; flex: 1; letter-spacing: .3px; }
  .scanhead .btn { flex: none; }
  /* Feste 4:3-Buehne: reserviert den Platz, bevor das Video laeuft (kein Springen) */
  .scanvid { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-strong); }
  .scanvid video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Sucherrahmen: Ecken statt Vollrahmen, damit der Barcode sichtbar bleibt */
  .scanframe { position: absolute; left: 8%; right: 8%; top: 27%; bottom: 27%; pointer-events: none; }
  .scanframe::before, .scanframe::after { content: ""; position: absolute; width: 34px; height: 34px; border: 3px solid var(--accent); }
  .scanframe::before { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  .scanframe::after { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
  .scanhint { margin: 0; text-align: center; font-size: 14px; color: #A69B9D; min-height: 21px; }
  .scanhint.err { color: var(--accent); font-weight: 600; }
  .scanfoot { display: flex; flex-direction: column; gap: 8px; }
  .scanfoot .btn { width: 100%; justify-content: center; }
  @media (max-width: 560px) {
    .scanvid { aspect-ratio: 3 / 4; }
  }
  .modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-family: var(--font-display); font-size: 19px; margin: 0; flex: 1; }
  .modal-head .kicker { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
  .modal-body { padding: 18px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }

  .field { margin-bottom: 15px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--text); letter-spacing: .01em; }
  .field .hint { font-weight: 400; color: var(--text-muted); }
  input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="search"], select, textarea {
    font: inherit; font-size: 14px; width: 100%; color: var(--text);
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 9px 11px; transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
  }
  textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .imgfield { display: flex; gap: 14px; align-items: center; }
  .imgprev { width: 156px; min-height: 96px; flex: none; border-radius: 10px; border: 1.5px dashed var(--border-strong); background-color: var(--surface-2); background-size: cover; background-position: center; overflow: hidden; display: grid; place-items: center; text-align: center; color: var(--text-muted); cursor: pointer; transition: border-color var(--dur-fast), background-color var(--dur-fast); }
  .imgprev.has-img { border-style: solid; border-color: var(--border); }
  .imgprev:hover { border-color: var(--accent); }
  .imgprev.dragover { border-color: var(--accent); background-color: color-mix(in srgb, var(--accent) 13%, var(--surface-2)); }
  .imgprev:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .imgprev-hint { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; line-height: 1.3; padding: 8px; pointer-events: none; }
  .imgprev-hint svg { opacity: .8; }
  .imgprev-hint b { color: var(--text); font-weight: 600; }
  .imgbtns { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
  .imgbtns label.btn { cursor: pointer; }

  /* Picker list */
  .picker-search { margin-bottom: 12px; }
  .plist { display: flex; flex-direction: column; gap: 4px; max-height: 46vh; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .pitem { display: flex; align-items: center; gap: 11px; text-align: left; width: 100%; font: inherit; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 9px 11px; color: var(--text); }
  .pitem:hover { background: var(--surface-2); border-color: var(--border); }
  .pitem .pdot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .pitem img.pthumb { width: 38px; height: 28px; border-radius: 5px; object-fit: cover; flex: none; }
  .pitem .pn { font-size: 14px; font-weight: 550; flex: 1; }
  .pitem .pc { font-size: 11.5px; color: var(--text-muted); }
