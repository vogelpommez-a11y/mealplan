<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sync-Diagnose</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  pre { background:#1c1c1c; border:1px solid #333; border-radius:8px; padding:12px;
        white-space:pre-wrap; word-break:break-word; font-size:14px; }
  .ok { color:#5dd97b; } .bad { color:#ff6b6b; } .warn { color:#ffc857; }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:0; background:#c62828;
           color:#fff; margin-top:12px; }
</style></head><body>
<h1>Sync-Diagnose</h1>
<pre id="out">Läuft …</pre>
<button onclick="navigator.clipboard.writeText(document.getElementById('out').textContent).then(()=>alert('Kopiert'))">Ergebnis kopieren</button>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const out = document.getElementById("out");
const zeilen = [];
const log = (s) => { zeilen.push(s); out.textContent = zeilen.join("\n"); };

const app = initializeApp({
    apiKey: "AIzaSyAr6kx7lByKgoUrnNJsRD06PKSs3ivplLE",
    authDomain: "paddys-mealplan.firebaseapp.com",
    projectId: "paddys-mealplan",
    storageBucket: "paddys-mealplan.firebasestorage.app",
    messagingSenderId: "1045496121634",
    appId: "1:1045496121634:web:c43390145fe7b52789bd7b"
  });
const auth = getAuth(app);
const db = getFirestore(app);

// Lokaler Zustand - unabhaengig von Firestore, deshalb zuerst.
try {
  const d = JSON.parse(localStorage.getItem("wochenkueche_v1") || "{}");
  log("LOKAL");
  log("  groupId:  " + (d.groupId || "(keine)"));
  log("  Rezepte:  " + ((d.recipes || []).length));
  log("  Wochen:   " + Object.keys(d.plans || {}).join(", "));
  let n = 0;
  Object.keys(d.plans || {}).forEach(w => Object.keys(d.plans[w]).forEach(t =>
    Object.keys(d.plans[w][t]).forEach(s => n += (d.plans[w][t][s] || []).length)));
  log("  Eintraege im Plan: " + n);
} catch (e) { log("LOKAL: Lesefehler " + e.message); }

onAuthStateChanged(auth, async (user) => {
  log("");
  if (!user) { log("ANGEMELDET: NEIN - bitte erst in der App anmelden."); return; }
  log("ANGEMELDET als " + (user.email || "(ohne E-Mail)"));
  log("  uid: " + user.uid);

  let gid = null;
  try {
    const u = await getDoc(doc(db, "users", user.uid));
    gid = u.exists() ? (u.data().groupId || null) : null;
    log("  groupId im KONTO (Cloud): " + (gid || "(keine)"));
  } catch (e) { log("  Konto lesen FEHLGESCHLAGEN: " + e.code + " " + e.message); }

  if (!gid) { log(""); log("Ohne groupId endet die Pruefung hier."); return; }

  log("");
  log("GRUPPE " + gid);
  try {
    const g = await getDoc(doc(db, "groups", gid));
    log("  Gruppendokument lesbar: " + (g.exists() ? "ja" : "NEIN"));
    if (g.exists()) log("  memberCount: " + (("memberCount" in g.data()) ? g.data().memberCount : "(fehlt)"));
  } catch (e) { log("  Gruppendokument FEHLER: " + e.code); }

  try {
    const ms = await getDocs(collection(db, "groups", gid, "members"));
    log("  Mitglieder: " + ms.size);
    log("  ich bin Mitglied: " + (ms.docs.some(x => x.id === user.uid) ? "ja" : "NEIN"));
  } catch (e) { log("  Mitglieder FEHLER: " + e.code + " " + e.message); }

  try {
    const rs = await getDocs(collection(db, "groups", gid, "recipes"));
    log("  >> Rezepte in der Gruppe: " + rs.size);
  } catch (e) { log("  >> Rezepte FEHLER: " + e.code + " " + e.message); }

  try {
    const ps = await getDocs(collection(db, "groups", gid, "plans"));
    log("  >> Planwochen: " + ps.docs.map(x => x.id).join(", "));
    ps.docs.forEach(x => {
      let n = 0;
      const f = x.data();
      Object.keys(f).forEach(k => { if (Array.isArray(f[k])) n += f[k].length; });
      log("     " + x.id + ": " + n + " Eintraege");
    });
  } catch (e) { log("  >> Plaene FEHLER: " + e.code + " " + e.message); }

  log("");
  log("Fertig. Bitte auf 'Ergebnis kopieren' tippen und schicken.");
});
</script></body></html>
